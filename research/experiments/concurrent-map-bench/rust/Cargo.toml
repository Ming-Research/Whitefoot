# Serves concurrent-map-bench: the Rust comparators and the Rust floor, built
# as one static library whose functions the C driver calls directly.
[package]
name = "cmaps"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib"]
path = "src/lib.rs"

[dependencies]
dashmap = "=6.2.1"
papaya = "=0.2.5"
scc = "=3.8.8"

[profile.release]
codegen-units = 1
debug = false
lto = false
opt-level = 3
panic = "abort"

[workspace]

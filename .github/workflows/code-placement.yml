# Serves research/investigations/code-placement: times the five compute
# kernels' images under shifted placements, for an unaligned and an aligned
# compiler, on a hosted runner or the owner's i9-14900K. Remove it with that
# investigation's harness when the alignment decision no longer needs
# re-measuring.
#
# research-boundary: manual-only
# Explicitly requested experiment; no push or pull-request trigger. Its exit
# status is the harness's and the reducer's, which fail only on a build,
# verification or malformed-row failure, never on a measurement.
name: code-placement

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Where the experiment runs, a GitHub runner or the owner's i9-14900K, a self-hosted Hyper-V virtual machine labelled 14900k
        type: choice
        options: [github, 14900k]
        default: github
      rounds:
        description: Interleaved rounds over every image, kernel and width
        type: string
        default: "10"
      unaligned:
        description: Commit of the unaligned compiler; empty means the merge base with main
        type: string
        default: ""
      cpus:
        description: The vCPUs every timed process is pinned to with taskset
        type: string
        default: "0-3"

defaults:
  run:
    shell: bash

concurrency:
  group: code-placement-${{ inputs.runner }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0

jobs:
  placement:
    name: placement (${{ inputs.runner }})
    runs-on: ${{ inputs.runner == '14900k' && fromJSON('["self-hosted", "14900k"]') || 'ubuntu-24.04' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A runner service starts without the login shell's PATH, where rustup
      # puts cargo; the step stops on the first missing tool and names it.
      - name: Check the host's tools
        run: |
          if [ -d "$HOME/.cargo/bin" ]; then
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          missing=
          for tool in /usr/bin/clang cargo make taskset perl python3 git nm; do
            command -v "$tool" >/dev/null || missing="$missing $tool"
          done
          if [ -n "$missing" ]; then
            echo "missing:$missing"
            exit 1
          fi
          /usr/bin/clang --version
          nproc
          lscpu

      - name: Build the unaligned and aligned compilers
        env:
          UNALIGNED: ${{ inputs.unaligned }}
        run: |
          if [ -z "$UNALIGNED" ]; then
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            UNALIGNED=$(git merge-base origin/main HEAD)
          fi
          git worktree prune
          rm -rf "$RUNNER_TEMP/unaligned"
          git worktree add --detach "$RUNNER_TEMP/unaligned" "$UNALIGNED"
          for tree in "$RUNNER_TEMP/unaligned" "$GITHUB_WORKSPACE"; do
            cargo fetch --locked --manifest-path "$tree/compiler/Cargo.toml"
            make -C "$tree/compiler" build
          done

      - name: Build, verify and time every placement
        env:
          ROUNDS: ${{ inputs.rounds }}
          CPUS: ${{ inputs.cpus }}
          WHITEFOOT_CHECK_TIMEOUT: "6000"
        run: |
          rm -rf "$RUNNER_TEMP/placement"
          perl .github/run-check.pl code-placement/measure \
            bash research/investigations/code-placement/placement.sh \
            "$RUNNER_TEMP/unaligned" "$RUNNER_TEMP/unaligned/compiler/target/gate/whitefootc" \
            "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/compiler/target/gate/whitefootc" \
            "$RUNNER_TEMP/placement" "$ROUNDS" "$CPUS"

      - name: Reduce and publish
        run: |
          python3 -I research/investigations/code-placement/summarize.py \
            "$RUNNER_TEMP/placement/raw.tsv" > "$RUNNER_TEMP/placement/summary.txt"
          cat "$RUNNER_TEMP/placement/summary.txt"
          {
            echo "## code-placement (${{ inputs.runner }})"
            echo
            echo '```text'
            head -3 "$RUNNER_TEMP/placement/manifest.txt"
            echo
            cat "$RUNNER_TEMP/placement/summary.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-placement-${{ inputs.runner }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/placement/manifest.txt
            ${{ runner.temp }}/placement/raw.tsv
            ${{ runner.temp }}/placement/summary.txt
            ${{ runner.temp }}/placement/logs/

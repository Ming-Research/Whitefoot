# Completion I/O performance tables from GitHub-hosted runners: a real Linux
# kernel on real hardware, native Windows, and an ordinary macOS system without
# a corporate endpoint-security stack. Linux and macOS retain exploratory
# tables. Windows runs matched candidates and native controls on one recorded host and
# reports native compute, IOCP, and mixed timing ratios and stability. Correct
# bytes, native IOCP use and ordinary scheduler activity remain checked; speed
# does not select success (see `research/experiments/io-completion-bench/`).
#
# Full measurement matrices run on demand. Ordinary pushes retain the native
# IO correctness workflows and benchmark-program compilation in the gate;
# an emitter edit does not need a half-hour storage experiment. Every table
# a batch relies on is copied into `research/investigations/io-model/RESULTS.md`
# with its run id, because job logs and artifacts expire.
name: io-bench

on:
  workflow_dispatch:
    inputs:
      compare_firn:
        description: Compare candidate Firn with exact published PR208 and pre208 on one Linux host
        type: boolean
        default: false
      compare_windows_workers:
        description: Compare full worker count with the primary count on one Windows VM
        type: boolean
        default: false

# Every shell step runs under `bash -eo pipefail`, so a protocol that fails
# behind `| tee` fails the step. Before this, the compiler rejecting a bench
# program printed the rejection into the log and the step stayed green,
# because the exit status of a pipeline is tee's unless pipefail is set.
defaults:
  run:
    shell: bash

concurrency:
  group: io-bench-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  # A fresh checkout gains nothing from incremental state (compiler/Cargo.toml).
  CARGO_INCREMENTAL: 0

jobs:
  # Opt-in recovery experiment; the ordinary dispatch keeps its existing jobs.
  # Cross-revision Firn results measure the complete implementation. The
  # same-source preparation comparison is a separate native observation.
  bench-firn:
    if: ${{ inputs.compare_firn }}
    name: Firn recovery (same Linux runner)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/checkout@v4
        with:
          ref: 51bc58e13f766a506d113871c17a5d736a4de3de
          path: published
      - uses: actions/checkout@v4
        with:
          ref: cea9188d46ae531b3f6eb5ec7d9e1c340c240aaf
          path: pre208

      - name: Install native Linux tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld redis-server redis-tools time
          rustup default stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            candidate/compiler/target
            published/compiler/target
            pre208/compiler/target
          key: firn-recovery-${{ github.sha }}-51bc58e13-cea9188d4
          restore-keys: |
            firn-recovery-

      - name: Build each exact revision with its own compiler
        env:
          ROOT: ${{ github.workspace }}/candidate
        run: |
          mkdir -p "$RUNNER_TEMP/firn-recovery"
          for name in candidate published pre208; do
            tree="$GITHUB_WORKSPACE/$name"
            sha=$(git -C "$tree" rev-parse HEAD)
            printf '%s,%s\n' "$name" "$sha" >> "$RUNNER_TEMP/firn-recovery/revisions.csv"
            cargo fetch --locked --manifest-path "$tree/compiler/Cargo.toml"
            make -C "$tree/compiler" build
            perl "$ROOT/.github/run-check.pl" "firn/build-$name" \
              "$tree/compiler/target/gate/whitefootc" --full-lto \
              --graph "$tree/apps/firn/modules.wfg" --entry firn \
              -o "$RUNNER_TEMP/firn-recovery/$name"
          done
          clang --version > "$RUNNER_TEMP/firn-recovery/toolchain.txt"
          rustc --version >> "$RUNNER_TEMP/firn-recovery/toolchain.txt"
          sha256sum "$RUNNER_TEMP/firn-recovery/candidate" \
            "$RUNNER_TEMP/firn-recovery/published" \
            "$RUNNER_TEMP/firn-recovery/pre208" > "$RUNNER_TEMP/firn-recovery/binaries.sha256"

      - name: Measure both preparation algorithms on identical generated sources
        env:
          WHITEFOOT_SCRATCH_ROOT: ${{ runner.temp }}/firn-recovery/native
          ROOT: ${{ github.workspace }}/candidate
        run: |
          perl "$ROOT/.github/run-check.pl" firn/preparation \
            make -C "$ROOT/research/experiments/io-completion-bench" key-prepare-bench
          cp "$WHITEFOOT_SCRATCH_ROOT/whitefoot-io-completion-bench/key-prepare-times.csv" \
            "$RUNNER_TEMP/firn-recovery/"
          cp "$WHITEFOOT_SCRATCH_ROOT/whitefoot-io-completion-bench/key-prepare-observations.csv" \
            "$RUNNER_TEMP/firn-recovery/"
          sha256sum "$WHITEFOOT_SCRATCH_ROOT/whitefoot-io-completion-bench/build/key-prepare" \
            "$WHITEFOOT_SCRATCH_ROOT/whitefoot-io-completion-bench/build/key-prepare-observe" \
            >> "$RUNNER_TEMP/firn-recovery/binaries.sha256"
          echo 'Timing image allocator/copy fields are unobserved zeros; use the observation twin for counts.' \
            > "$RUNNER_TEMP/firn-recovery/preparation-notes.txt"
          echo 'Counts cover runtime allocator calls and explicit memcpy/memmove bytes, excluding fixture construction and warmed old spare.' \
            >> "$RUNNER_TEMP/firn-recovery/preparation-notes.txt"
          echo 'Keys exercise both rank-at-head and rank-at-tail (long common-prefix) comparison shapes.' \
            >> "$RUNNER_TEMP/firn-recovery/preparation-notes.txt"
          echo 'This compares preparation and release, not parallel value computation or the entire cross-revision Firn change.' \
            >> "$RUNNER_TEMP/firn-recovery/preparation-notes.txt"

      - name: Measure identical and historical Firn images interleaved
        env:
          ROOT: ${{ github.workspace }}/candidate
          OUT: ${{ runner.temp }}/firn-recovery/end-to-end
          FIRN_CANDIDATE: ${{ runner.temp }}/firn-recovery/candidate
          FIRN_PUBLISHED: ${{ runner.temp }}/firn-recovery/published
          FIRN_PRE208: ${{ runner.temp }}/firn-recovery/pre208
          PUBLISHED_REVISION: 51bc58e13f766a506d113871c17a5d736a4de3de
          PRE208_REVISION: cea9188d46ae531b3f6eb5ec7d9e1c340c240aaf
          COMPARE_CPUS: "1 2"
          COMPARE_PASSES: "6"
          SECONDS_PER_RUN: "12"
          WHITEFOOT_CHECK_TIMEOUT: "7200"
        run: |
          export CANDIDATE_REVISION=$(git -C "$ROOT" rev-parse HEAD)
          perl "$ROOT/.github/run-check.pl" firn/recovery \
            sh "$ROOT/research/experiments/io-completion-bench/redis-bench.sh" compare \
            2>&1 | tee "$RUNNER_TEMP/firn-recovery/bench.txt"

      - name: Publish raw observations
        if: always()
        run: |
          {
            echo '## Firn recovery experiment'
            echo
            echo 'Raw throughput, p50/p95/p99 and memory observations are retained in the artifact.'
            echo 'A successful job does not decide recovery or statistical significance.'
            echo 'Missing cells, failed identical-image control or unstable comparisons require an inconclusive handoff.'
            echo
            echo '```text'
            cat "$RUNNER_TEMP/firn-recovery/revisions.csv" 2>/dev/null || true
            cat "$RUNNER_TEMP/firn-recovery/binaries.sha256" 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firn-recovery-${{ github.sha }}-51bc58e13-cea9188d4
          path: ${{ runner.temp }}/firn-recovery

  bench-linux:
    if: ${{ !inputs.compare_windows_workers && !inputs.compare_firn }}
    name: bench-linux (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install the host toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang
          test -x /usr/bin/clang
          /usr/bin/clang --version
          rustup default stable
          cargo --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            compiler/target
          key: bench-linux-${{ hashFiles('compiler/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            bench-linux-${{ hashFiles('compiler/Cargo.lock') }}-
            bench-linux-

      - name: Fetch the recorded crate dependencies
        run: cargo fetch --locked --manifest-path compiler/Cargo.toml

      # A shared runner is noisy, so the reading has to carry its own spread
      # and the record has to say what machine produced it.
      - name: Record the host
        run: |
          {
            echo "kernel: $(uname -srvmo)"
            echo "cpus: $(nproc)"
            echo "model: $(awk -F': ' '/^model name/ {print $2; exit}' /proc/cpuinfo)"
            echo "io_uring_disabled: $(cat /proc/sys/kernel/io_uring_disabled 2>/dev/null || echo absent)"
            echo "bench filesystem: $(findmnt -no SOURCE,FSTYPE --target "$RUNNER_TEMP")"
            echo "bench free space: $(df -h --output=avail "$RUNNER_TEMP" | tail -1 | tr -d ' ')"
          } | tee host.txt

      - name: Run the Linux bench protocol
        env:
          ROOT: ${{ github.workspace }}
          ROUNDS: "9"
          WARMUP: "2"
        run: |
          export OUT="$RUNNER_TEMP/io-completion-bench"
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/compiler/target"
          sh research/experiments/io-completion-bench/linux-bench.sh 2>&1 | tee bench.txt

      # The TCP echo control test of NETWORK.md section 6 uses one loopback
      # and one load generator for the selected server lines. Three rounds
      # plus warmup keep the table beside the file protocol within this job.
      #
      # The step carries its own bound. The protocol decides nothing by a
      # timeout -- it waits only for a port to appear and for a child to exit
      # -- so a server that stops making progress would otherwise hold the
      # step until the job's own limit and take the summary above down with
      # it. This bound ends the step instead, and the tables already produced
      # are still published.
      - name: Run the Linux network protocol
        if: always()
        timeout-minutes: 12
        env:
          ROOT: ${{ github.workspace }}
          ROUNDS: "3"
          WARMUP: "1"
          # Current-stack Whitefoot serves peers in source order, so the
          # concurrent four-peer correctness pass cannot complete. Omit its
          # line until connection-level concurrency is supported again.
          NET_LINES: "uring epoll"
        run: |
          export OUT="$RUNNER_TEMP/io-net-bench"
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/compiler/target"
          sh research/experiments/io-completion-bench/linux-net-bench.sh 2>&1 | tee bench-net.txt

      - name: Publish the table
        if: always()
        run: |
          {
            echo '## bench-linux'
            echo
            echo '```text'
            cat host.txt
            echo
            cat bench.txt
            echo
            cat bench-net.txt 2>/dev/null || echo "the network table did not run"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-linux
          path: |
            host.txt
            bench.txt
            bench-net.txt

  # The read-dominated tables, on hosts the maintainer's machine cannot stand
  # in for. The macOS job matters twice over: its numbers are the first clean
  # macOS numbers this project has, because the maintainer's machine runs a
  # corporate endpoint-security stack that charges 116 us for an `openat` and
  # reads the benchmark tree behind the benchmark's back. A hosted macOS
  # runner has neither.
  #
  # Both jobs run `read-bench.sh`, the same bytes the `linux-read` container
  # target runs. It labels each table by what the residency probe measured
  # rather than refusing to print one, because a hosted runner's storage is
  # not known in advance; a table whose probe refused the label says so on its
  # own label line.
  bench-linux-read:
    if: ${{ !inputs.compare_windows_workers && !inputs.compare_firn }}
    name: bench-linux-read (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install the host toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang
          test -x /usr/bin/clang
          /usr/bin/clang --version
          rustup default stable
          cargo --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            compiler/target
          key: bench-linux-read-${{ hashFiles('compiler/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            bench-linux-read-${{ hashFiles('compiler/Cargo.lock') }}-
            bench-linux-read-

      - name: Fetch the recorded crate dependencies
        run: cargo fetch --locked --manifest-path compiler/Cargo.toml

      # A table taken on a shared runner is only readable beside the machine
      # that produced it, and the storage matters more here than anywhere
      # else: this workload is a measurement of what one read costs.
      - name: Record the host
        run: |
          {
            echo "kernel: $(uname -srvmo)"
            echo "cpus: $(nproc)"
            echo "model: $(awk -F': ' '/^model name/ {print $2; exit}' /proc/cpuinfo)"
            echo "memory: $(awk '/^MemTotal/ {print $2 " kB"}' /proc/meminfo)"
            echo "io_uring_disabled: $(cat /proc/sys/kernel/io_uring_disabled 2>/dev/null || echo absent)"
            echo "bench filesystem: $(findmnt -no SOURCE,FSTYPE --target "$RUNNER_TEMP")"
            echo "bench free space: $(df -h --output=avail "$RUNNER_TEMP" | tail -1 | tr -d ' ')"
            echo "rotational: $(lsblk -no NAME,ROTA 2>/dev/null | tr '\n' ' ')"
            echo "load: $(cat /proc/loadavg)"
          } | tee host-read.txt

      - name: Run the read-heavy protocol
        env:
          ROOT: ${{ github.workspace }}
          ROUNDS: "7"
          WARMUP: "2"
        run: |
          export OUT="$RUNNER_TEMP/io-read-bench"
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/compiler/target"
          sh research/experiments/io-completion-bench/read-bench.sh 2>&1 | tee bench-read.txt

      - name: Publish the tables
        if: always()
        run: |
          {
            echo '## bench-linux-read'
            echo
            echo '```text'
            cat host-read.txt
            echo
            cat bench-read.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-linux-read
          path: |
            host-read.txt
            bench-read.txt

  bench-macos-read:
    if: ${{ !inputs.compare_windows_workers && !inputs.compare_firn }}
    name: bench-macos-read (macos-14)
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install the host toolchain
        run: |
          test -x /usr/bin/clang
          /usr/bin/clang --version
          rustup default stable
          cargo --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            compiler/target
          key: bench-macos-read-${{ hashFiles('compiler/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            bench-macos-read-${{ hashFiles('compiler/Cargo.lock') }}-
            bench-macos-read-

      - name: Fetch the recorded crate dependencies
        run: cargo fetch --locked --manifest-path compiler/Cargo.toml

      - name: Record the host
        run: |
          {
            echo "kernel: $(uname -srvm)"
            echo "product: $(sw_vers -productName) $(sw_vers -productVersion)"
            echo "cpus: $(sysctl -n hw.ncpu)"
            echo "model: $(sysctl -n machdep.cpu.brand_string)"
            echo "memory: $(sysctl -n hw.memsize)"
            echo "bench filesystem: $(df -h "$RUNNER_TEMP" | tail -1)"
            echo "load: $(sysctl -n vm.loadavg)"
          } | tee host-read.txt

      - name: Run the read-heavy protocol
        env:
          ROOT: ${{ github.workspace }}
          ROUNDS: "7"
          WARMUP: "2"
        run: |
          export OUT="$RUNNER_TEMP/io-read-bench"
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/compiler/target"
          sh research/experiments/io-completion-bench/read-bench.sh 2>&1 | tee bench-read.txt

      # The many-files workload, which every earlier macOS table measured on
      # the maintainer's machine. There an `openat` costs 116 us and the table
      # is mostly a measurement of the endpoint-security stack; here there is
      # no such stack, so this is the first reading of that workload's open
      # path on an ordinary macOS system.
      - name: Run the many-files protocol
        if: always()
        env:
          ROUNDS: "7"
          WARMUP: "2"
        run: |
          export WHITEFOOT_SCRATCH_ROOT="$RUNNER_TEMP/scratch"
          make -C research/experiments/io-completion-bench bench 2>&1 | tee bench-many.txt

      - name: Publish the tables
        if: always()
        run: |
          {
            echo '## bench-macos-read'
            echo
            echo '```text'
            cat host-read.txt
            echo
            cat bench-read.txt
            echo
            cat bench-many.txt 2>/dev/null || echo "the many-files table did not run"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-macos-read
          path: |
            host-read.txt
            bench-read.txt
            bench-many.txt

  # The Windows measurement protocol is deliberately one job, not three
  # independent timing jobs. Every candidate/reference pair runs on the same
  # VM, processor mask, generated bytes, compiler revision, and cache state;
  # order is balanced with a native multithread control in every round.
  # The native C runner rejects a process
  # before reporting its QPC time unless exit status, stdout, and stderr are
  # exact. An untimed observed link separately requires a non-owner compute
  # worker and a used, fully reaped IOCP path. C2 has ordinary synchronous call
  # boundaries; no cross-call completion overlap or speed threshold is required.
  bench-windows:
    if: ${{ !inputs.compare_firn }}
    name: bench-windows-measured (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Record the installed toolchain
        shell: pwsh
        run: |
          (Get-Command clang.exe).Source
          clang.exe --version
          rustup default stable
          rustc.exe --version
          cargo.exe --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            compiler/target
          key: bench-windows-${{ hashFiles('compiler/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            bench-windows-${{ hashFiles('compiler/Cargo.lock') }}-
            bench-windows-

      - name: Fetch the recorded crate dependencies
        shell: pwsh
        run: |
          cargo.exe fetch --locked --manifest-path compiler/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo.exe fetch --locked --manifest-path research/investigations/proof-derived-parallelism/bench/rust/Cargo.toml

      - name: Run the native Windows measurement protocol
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}\compiler\target
        run: |
          $out = Join-Path $env:RUNNER_TEMP "whitefoot-windows-bench"
          & "research/experiments/io-completion-bench/windows-bench.ps1" `
            -Root $env:GITHUB_WORKSPACE `
            -Out $out `
            -Rounds 15 `
            -Warmup 2 `
            -CompareWorkers:([bool]::Parse('${{ inputs.compare_windows_workers || false }}'))

      - name: Publish the measurement table
        if: always()
        shell: pwsh
        run: |
          $summary = Join-Path $env:RUNNER_TEMP "whitefoot-windows-bench/summary.md"
          if (Test-Path -LiteralPath $summary) {
            Get-Content -LiteralPath $summary | Add-Content $env:GITHUB_STEP_SUMMARY
          } else {
            "## Windows native runtime measurements`n`nThe protocol failed before it produced a valid table." | `
              Add-Content $env:GITHUB_STEP_SUMMARY
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-windows-measured
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}\whitefoot-windows-bench\host.txt
            ${{ runner.temp }}\whitefoot-windows-bench\mixed-observer.txt
            ${{ runner.temp }}\whitefoot-windows-bench\raw.tsv
            ${{ runner.temp }}\whitefoot-windows-bench\summary.md

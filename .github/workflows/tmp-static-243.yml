# Temporary, for item #243: the gate's static group on a hosted runner, as
# gate.yml runs it, on the tree this push holds without this file. The fast
# workflow's `static` check waits for the owner's runner, which other works
# keep busy. A failed group's last lines are shown as an annotation, since a
# job log needs repository admin rights to read. Removed before the full check.
name: tmp-static-243

on:
  push:
    branches: ['work-243-26e0fade', 'wf-try/work-243-26e0fade/**']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Set the scratch root
        run: |
          echo "WHITEFOOT_SCRATCH_ROOT=$RUNNER_TEMP/whitefoot" >> "$GITHUB_ENV"
          echo "WHITEFOOT_TIME_BUDGET_RECORD=$RUNNER_TEMP/time-budget-overruns.txt" >> "$GITHUB_ENV"

      - name: Name main as a local ref
        run: |
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          git branch -f main origin/main
          git log --oneline -1 main

      - name: Select the design review base
        run: |
          design_review_base=$(git merge-base refs/remotes/origin/main HEAD)
          echo "DESIGN_REVIEW_BASE=$design_review_base" >> "$GITHUB_ENV"
          git log --oneline -1 "$design_review_base"

      - name: Install the host toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          ld.lld --version
          test -x /usr/bin/clang
          /usr/bin/clang --version
          python3 --version
          rustup default stable
          rustup component add clippy rustfmt
          cargo --version

      - name: Fetch locked compiler dependencies
        run: cargo fetch --locked --manifest-path compiler/Cargo.toml

      - name: Remove this temporary workflow from the tree the group reads
        run: |
          rm .github/workflows/tmp-static-243.yml
          git status --short

      - name: static
        env:
          WHITEFOOT_CHECK_TIMEOUT: 900
        run: |
          set +e
          set -o pipefail
          make check-group GROUP=static 2>&1 | tee "$RUNNER_TEMP/static.out"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            body=$(tail -n 60 "$RUNNER_TEMP/static.out" | head -c 3500 | tr -d '\r' | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=static exit $status::$body"
          fi
          exit "$status"

      - name: Hold every stage to its time budget
        if: always()
        run: |
          if [ -s "$WHITEFOOT_TIME_BUDGET_RECORD" ]; then cat "$WHITEFOOT_TIME_BUDGET_RECORD"; fi
          perl .github/run-check.pl --budget-verdict "$WHITEFOOT_TIME_BUDGET_RECORD"

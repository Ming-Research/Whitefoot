# Temporary, explicitly requested scheduling experiment for this branch only.
# Remove this workflow before the branch is marked ready.
name: ctx-starvation

on:
  push:
    branches: [claude/ctx-handoff]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ctx-starvation-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0

jobs:
  witness:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install the host toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld
          rustup default stable

      - name: Record the revision and host
        run: |
          mkdir -p "$RUNNER_TEMP/context-starvation"
          {
            git rev-parse HEAD
            uname -srvmo
            lscpu
            taskset -pc $$
            if [ -r /proc/sys/kernel/io_uring_disabled ]; then
              echo "io_uring_disabled: $(cat /proc/sys/kernel/io_uring_disabled)"
            fi
            clang --version
            ld.lld --version
            rustc --version
            cargo --version
            python3 --version
            echo "runner: $RUNNER_NAME ($RUNNER_ENVIRONMENT)"
            echo "affinity: taskset -c 0; WF_WORKERS=1; WF_DRIVERS=1 or 2; no --par"
          } > "$RUNNER_TEMP/context-starvation/host.txt"
          cat "$RUNNER_TEMP/context-starvation/host.txt"

      - name: Fetch the recorded crate dependencies
        run: cargo fetch --locked --manifest-path compiler/Cargo.toml

      - name: Build the compiler
        run: make -C compiler build

      - name: Compile and observe the witness
        env:
          OUT: ${{ runner.temp }}/context-starvation
        run: sh research/experiments/context-starvation/run.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: context-starvation-${{ github.sha }}
          path: |
            ${{ runner.temp }}/context-starvation/host.txt
            ${{ runner.temp }}/context-starvation/results.tsv

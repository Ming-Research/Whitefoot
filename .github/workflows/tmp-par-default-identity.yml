# Temporary: the stage-3 machine-code identity checker's own tests, and the
# checker replayed on the hosted smoke images of run 38540754961 (an earlier
# head of the default --par demand-splitting branch), so a change to the
# checker shows its verdicts without building any compiler. The replay is
# reported, not required: those images predate later compiler changes, and
# the smoke run of tmp-par-default-accept.yml on the current head decides.
# Removed before that pull request is marked ready.
#
#   gh workflow run tmp-par-default-identity.yml --ref claude/par-demand-default
#
# research-boundary: manual-only
# Research instrument; no push or pull-request trigger.
name: tmp-par-default-identity

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  FROZEN: 73aaab85a92479ada6bf57fa996e17b163e019ed

jobs:
  identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unit tests of the checker
        working-directory: research/experiments/par-default
        run: python3 -B -m unittest -v test_identity test_identity_entry test_identity_image test_identity_ir test_identity_projection test_identity_stencil
      - name: Self-test with wrong evidence
        run: python3 -B research/experiments/par-default/identity.py --self-test --clang clang
      - uses: actions/download-artifact@v4
        with:
          name: par-default-accept-smoke
          run-id: 38540754961
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/smoke
      - name: Replay the checker on the earlier smoke images (reported)
        continue-on-error: true
        run: |
          set -euo pipefail
          git cat-file -e "$FROZEN^{commit}" 2>/dev/null || git fetch --no-tags --depth 1 origin "$FROZEN"
          git archive "$FROZEN" research/experiments/par-demand/manifest.json | tar -x -C "$GITHUB_WORKSPACE"
          mkdir "$RUNNER_TEMP/images"
          tar -xzf "$RUNNER_TEMP/smoke/s3-images.tar.gz" -C "$RUNNER_TEMP/images"
          python3 -B research/experiments/par-default/identity.py \
            --build "$RUNNER_TEMP/images/s3" --output "$RUNNER_TEMP/replayed-identity.json"

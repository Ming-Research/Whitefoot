# TEMPORARY: removed before wf-fr-pkg-windows is marked ready.
#
# Quick checks for the Windows package item: the documentation example check
# over the getting started guide (its Windows section is new), the target and
# toolchain unit tests, and the repository's static checks. The Windows
# container run of the guide's commands is the compiler-release trial; the
# negatives job breaks one thing at a time in the guide or the candidate's
# checksum file and runs the same check, which must fail at that stage.
name: tmp-windows-pkg

on:
  push:
    branches: [wf-fr-pkg-windows]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: tmp-windows-pkg-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0

jobs:
  unit:
    name: Documentation examples and target tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install the host toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          rustup default stable
          cargo --version
      - name: Fetch locked compiler dependencies
        run: cargo fetch --locked --manifest-path compiler/Cargo.toml
      - name: Documentation examples
        run: |
          perl .github/run-check.pl quick/doc-examples cargo test --manifest-path compiler/Cargo.toml --profile gate --locked --offline --test corpus doc_examples
      - name: Target, toolchain and deterministic-target tests
        run: |
          perl .github/run-check.pl quick/unit cargo test --manifest-path compiler/Cargo.toml --profile gate --locked --offline --lib -- target:: toolchain:: deterministic_target

  static:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: Name main as a local ref
        run: |
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          git branch -f main origin/main
      - name: make static
        run: make static

  # The candidate and its checksum file come from the compiler-release trial
  # run of the previous commit (run 39684914209), which passed the same check
  # unbroken.
  negatives:
    name: The check fails on ${{ matrix.case }}
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        case: [download-block, missing-expand, checksum, exit-code, rejection-text]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the candidate of the trial
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 39684914209 --repo "$GITHUB_REPOSITORY" --name package-acceptance-inputs --dir candidate
          ls -l candidate
      - name: Break one thing
        env:
          CASE: ${{ matrix.case }}
        run: |
          python -I - <<'PY'
          import os, pathlib
          case = os.environ['CASE']
          guide = pathlib.Path('docs/guide/getting-started.md')
          sums = pathlib.Path('candidate/SHA256SUMS')
          text = guide.read_text()
          def replace_once(old, new):
              global text
              assert text.count(old) >= 1, old
              text = text.replace(old, new, 1)
          if case == 'download-block':
              replace_once('Invoke-WebRequest "$base/whitefootc-windows-x86_64-bundled.zip" -OutFile whitefootc-windows-x86_64-bundled.zip',
                           'Invoke-WebRequest "$base/other.zip" -OutFile other.zip')
          elif case == 'missing-expand':
              replace_once('Expand-Archive $archive -DestinationPath whitefoot\n', '')
          elif case == 'exit-code':
              replace_once('return exit_status(code: 1_u8);', 'return exit_status(code: 3_u8);')
          elif case == 'rejection-text':
              replace_once('disposition: Unproved', 'disposition: Proved')
          elif case == 'checksum':
              lines = sums.read_text().splitlines()
              for number, line in enumerate(lines):
                  if line.endswith('whitefootc-windows-x86_64-bundled.zip'):
                      digit = '0' if line[0] != '0' else '1'
                      lines[number] = digit + line[1:]
              sums.write_text('\n'.join(lines) + '\n')
          guide.write_text(text)
          PY
          git diff --stat
      - name: Run the check, which must fail where this case breaks it
        env:
          CASE: ${{ matrix.case }}
        run: |
          status=0
          bash .github/toolchain/check-package-windows.sh \
            "$PWD/candidate/whitefootc-windows-x86_64-bundled.zip" \
            "$PWD/tests/package-fixtures" "$RUNNER_TEMP/package-windows" \
            mcr.microsoft.com/windows/servercore:ltsc2022 || status=$?
          echo "== check status: $status"
          log="$RUNNER_TEMP/package-windows/logs/acceptance.log"
          test "$status" != 0
          want() { grep -F "$1" "$log" > /dev/null || { echo "missing in the log: $1" >&2; exit 1; }; }
          unwanted() { if grep -F "$1" "$log" > /dev/null; then echo "reached: $1" >&2; exit 1; fi; }
          case "$CASE" in
            download-block) want 'the guide download does not name' ;;
            missing-expand) want 'the guide has no PowerShell block with' ;;
            checksum) want 'whitefootc-windows-x86_64-bundled.zip: FAILED'; unwanted 'Verified package files' ;;
            exit-code) want 'Exit (install-from-guide): 0'; unwanted 'Verified package files' ;;
            rejection-text) want 'Exit (guide-rejected): 1'; want 'Proved'; unwanted 'Exit (stack-build)' ;;
          esac
          echo "The check failed at the stage this case breaks."
      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: negatives-${{ matrix.case }}
          path: ${{ runner.temp }}/package-windows/logs/
          if-no-files-found: warn
          retention-days: 3

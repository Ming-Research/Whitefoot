# TEMPORARY. Experiment E1 of research/investigations/float-text/DESIGN.md:
# builds the real redis-server 7.2.16 and records exactly how it writes
# doubles. This workflow is removed before the branch is ready; its results
# are copied into the investigation with the run id, because artifacts expire.
#
# It runs on a push to the work branch that touches this file only (touch the
# file to run it again), and on dispatch once the file is on the default
# branch. The driver and the models are research/investigations/float-text/
# redis_double_oracle.py, reference.py and fpconv_reconstruction.py.
name: float-text-redis

on:
  push:
    branches: [claude/float-text]
    paths: [.github/workflows/float-text-redis.yml]
  workflow_dispatch:

permissions:
  contents: read

env:
  REDIS_VERSION: 7.2.16
  # From github.com/redis/redis-hashes, file README, the line for
  # redis-7.2.16.tar.gz (README at commit 1ae1e93d5c6234bb991f2dd74e6f89abaeb6ba11).
  REDIS_SHA256: 960a8ec15e34ff40e57ff16837b26b33bd81f2da6d24497bb63de532a323a18e
  REDIS_PORT: 16379

jobs:
  oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Download redis and verify its SHA-256
        run: |
          mkdir -p "$RUNNER_TEMP/redis-download" "$RUNNER_TEMP/redis-src"
          curl --fail --silent --show-error --location --retry 5 \
            --output "$RUNNER_TEMP/redis-download/redis.tar.gz" \
            "https://download.redis.io/releases/redis-${REDIS_VERSION}.tar.gz"
          echo "${REDIS_SHA256}  $RUNNER_TEMP/redis-download/redis.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/redis-download/redis.tar.gz" -C "$RUNNER_TEMP/redis-src" --strip-components=1

      - name: Build redis-server
        run: make -C "$RUNNER_TEMP/redis-src" -j"$(nproc)" MALLOC=libc

      - name: Record the source that decides the output
        run: |
          OUT="$RUNNER_TEMP/out"
          mkdir -p "$OUT"
          cd "$RUNNER_TEMP/redis-src"
          {
            echo "== version, licence and dependencies"
            head -n 3 COPYING || true
            ls deps
            echo "-- fast_float mentions in the build files:"
            grep -rn -i "fast_float" deps/Makefile src/Makefile || echo "none"
            echo "-- glibc and the libraries redis-server links:"
            ldd --version | head -n 1
            ldd src/redis-server
            echo
            echo "== deps/fpconv (every file, whole)"
            ls -l deps/fpconv
            for f in deps/fpconv/*; do echo "---- $f"; cat "$f"; done
            echo
            echo "== where fpconv_dtoa, double2ll and d2string are used"
            grep -rn "fpconv_dtoa\|double2ll\|d2string" src/*.c src/*.h | grep -v "^src/\(debug\|module\)\.c" || true
            echo
            echo "== double2ll"
            grep -n -B3 -A25 "double2ll(double" src/util.h src/util.c || true
            echo
            echo "== d2string"
            sed -n '/^int d2string(/,/^}/p' src/util.c || true
            echo
            echo "== addReplyDouble and addReplyHumanLongDouble"
            sed -n '/^void addReplyDouble(/,/^}/p' src/networking.c || true
            sed -n '/^void addReplyHumanLongDouble(/,/^}/p' src/networking.c || true
            echo
            echo "== Lua argument conversion (script_lua.c)"
            grep -n -B6 -A14 "LUA_TNUMBER" src/script_lua.c | sed -n '1,140p' || true
            echo
            echo "== LUA_NUMBER_FMT"
            grep -n "LUA_NUMBER_FMT\|lua_str2number\|lua_number2str" deps/lua/src/luaconf.h || true
            echo
            echo "== string2d, string2ld, ld2string"
            sed -n '/^int string2d(/,/^}/p' src/util.c || true
            sed -n '/^int string2ld(/,/^}/p' src/util.c || true
            sed -n '/^int ld2string(/,/^}/p' src/util.c || true
          } > "$OUT/source-excerpts.txt" 2>&1
          wc -l "$OUT/source-excerpts.txt"

      - name: Start redis-server on localhost
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          "$RUNNER_TEMP/redis-src/src/redis-server" --port "$REDIS_PORT" --bind 127.0.0.1 \
            --save "" --appendonly no --daemonize yes \
            --logfile "$RUNNER_TEMP/out/redis-server.log"

      - name: Query it and compare with the models
        run: |
          python3 -I research/investigations/float-text/redis_double_oracle.py \
            --port "$REDIS_PORT" --out "$RUNNER_TEMP/out" --count 5000 --wait 30

      - name: Summary
        if: always()
        run: |
          {
            echo '## float-text E1: redis-server 7.2.16'
            echo '```'
            head -n 150 "$RUNNER_TEMP/out/summary.txt" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop redis-server
        if: always()
        run: |
          "$RUNNER_TEMP/redis-src/src/redis-cli" -p "$REDIS_PORT" shutdown nosave || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: float-text-redis-7.2.16
          path: ${{ runner.temp }}/out
          retention-days: 30

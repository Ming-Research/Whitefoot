# TEMPORARY. Experiment E1 of research/investigations/float-text/DESIGN.md:
# builds the real redis-server 7.2.16 and records exactly how it writes
# doubles. This workflow is removed before the branch is ready; its results
# are copied into the investigation with the run id, because artifacts expire.
#
# Both jobs run only on an explicit workflow_dispatch. The oracle driver and
# the models are research/investigations/float-text/
# redis_double_oracle.py, reference.py and fpconv_reconstruction.py.
#
# The `witnesses` job is experiment E2: it builds the compiler and compiles and
# runs the witness programs under research/investigations/float-text/witnesses/,
# recording accept or reject per witness with the full diagnostic.
name: float-text-redis

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  REDIS_VERSION: 7.2.16
  # From github.com/redis/redis-hashes, file README, the line for
  # redis-7.2.16.tar.gz (README at commit 1ae1e93d5c6234bb991f2dd74e6f89abaeb6ba11).
  REDIS_SHA256: 960a8ec15e34ff40e57ff16837b26b33bd81f2da6d24497bb63de532a323a18e
  REDIS_PORT: 16379

jobs:
  oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Download redis and verify its SHA-256
        run: |
          mkdir -p "$RUNNER_TEMP/redis-download" "$RUNNER_TEMP/redis-src"
          curl --fail --silent --show-error --location --retry 5 \
            --output "$RUNNER_TEMP/redis-download/redis.tar.gz" \
            "https://download.redis.io/releases/redis-${REDIS_VERSION}.tar.gz"
          echo "${REDIS_SHA256}  $RUNNER_TEMP/redis-download/redis.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/redis-download/redis.tar.gz" -C "$RUNNER_TEMP/redis-src" --strip-components=1

      - name: Build redis-server
        run: make -C "$RUNNER_TEMP/redis-src" -j"$(nproc)" MALLOC=libc

      - name: Record the source that decides the output
        run: |
          OUT="$RUNNER_TEMP/out"
          mkdir -p "$OUT"
          cd "$RUNNER_TEMP/redis-src"
          {
            echo "== version, licence and dependencies"
            head -n 3 COPYING || true
            ls deps
            echo "-- fast_float mentions in the build files:"
            grep -rn -i "fast_float" deps/Makefile src/Makefile || echo "none"
            echo "-- glibc and the libraries redis-server links:"
            ldd --version | head -n 1
            ldd src/redis-server
            echo
            echo "== deps/fpconv (every file, whole)"
            ls -l deps/fpconv
            for f in deps/fpconv/*; do echo "---- $f"; cat "$f"; done
            echo
            echo "== where fpconv_dtoa, double2ll and d2string are used"
            grep -rn "fpconv_dtoa\|double2ll\|d2string" src/*.c src/*.h | grep -v "^src/\(debug\|module\)\.c" || true
            echo
            echo "== double2ll"
            grep -n -B3 -A25 "double2ll(double" src/util.h src/util.c || true
            echo
            echo "== d2string"
            sed -n '/^int d2string(/,/^}/p' src/util.c || true
            echo
            echo "== addReplyDouble and addReplyHumanLongDouble"
            sed -n '/^void addReplyDouble(/,/^}/p' src/networking.c || true
            sed -n '/^void addReplyHumanLongDouble(/,/^}/p' src/networking.c || true
            echo
            echo "== Lua argument conversion (script_lua.c)"
            grep -n -B6 -A14 "LUA_TNUMBER" src/script_lua.c | sed -n '1,140p' || true
            echo
            echo "== LUA_NUMBER_FMT"
            grep -n "LUA_NUMBER_FMT\|lua_str2number\|lua_number2str" deps/lua/src/luaconf.h || true
            echo
            echo "== string2d, string2ld, ld2string"
            sed -n '/^int string2d(/,/^}/p' src/util.c || true
            sed -n '/^int string2ld(/,/^}/p' src/util.c || true
            sed -n '/^int ld2string(/,/^}/p' src/util.c || true
          } > "$OUT/source-excerpts.txt" 2>&1
          wc -l "$OUT/source-excerpts.txt"

      - name: Start redis-server on localhost
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          "$RUNNER_TEMP/redis-src/src/redis-server" --port "$REDIS_PORT" --bind 127.0.0.1 \
            --save "" --appendonly no --daemonize yes \
            --logfile "$RUNNER_TEMP/out/redis-server.log"

      - name: Query it and compare with the models
        run: |
          python3 -I research/investigations/float-text/redis_double_oracle.py \
            --port "$REDIS_PORT" --out "$RUNNER_TEMP/out" --count 5000 --wait 30

      - name: Summary
        if: always()
        run: |
          {
            echo '## float-text E1: redis-server 7.2.16'
            echo '```'
            head -n 150 "$RUNNER_TEMP/out/summary.txt" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop redis-server
        if: always()
        run: |
          "$RUNNER_TEMP/redis-src/src/redis-cli" -p "$REDIS_PORT" shutdown nosave || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: float-text-redis-7.2.16
          path: ${{ runner.temp }}/out
          retention-days: 30

  witnesses:
    name: float-text E2 witness programs
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install the host toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          ld.lld --version
          /usr/bin/clang --version
          rustup default stable
          cargo --version

      - name: Build the compiler
        run: cargo build --manifest-path compiler/Cargo.toml --locked --profile gate --bin whitefootc

      - name: Check the witnesses against their generator
        run: python3 -I research/investigations/float-text/witnesses/generate.py --check

      - name: Compile and run every witness
        run: |
          # No -e: a refusal is a result, and the next witness still runs.
          set +e
          DIR=research/investigations/float-text/witnesses
          OUT="$RUNNER_TEMP/witnesses"
          WFC="$PWD/compiler/target/gate/whitefootc"
          mkdir -p "$OUT"
          python3 -I "$DIR/generate.py" --expect > "$OUT/expected.tsv"
          printf 'witness\texpected\tcompile\trun\n' > "$OUT/results.tsv"
          wrong=0
          while IFS=$'\t' read -r name expected; do
            src="$DIR/$name.wf"
            "$WFC" --diagnostic-format text -o "$OUT/$name.bin" "$src" > "$OUT/$name.diagnostic.txt" 2>&1
            compile=$?
            "$WFC" --diagnostic-format json --check "$src" > "$OUT/$name.diagnostic.json" 2>&1
            run=-
            if [ "$compile" -eq 0 ]; then
              compile=accepted
              timeout 60 "$OUT/$name.bin" > "$OUT/$name.run.txt" 2>&1
              run=$?
              if [ "$run" -ne 0 ]; then wrong=1; fi
            else
              compile="rejected($compile)"
            fi
            printf '%s\t%s\t%s\t%s\n' "$name" "$expected" "$compile" "$run" >> "$OUT/results.tsv"
          done < "$OUT/expected.tsv"
          echo "$wrong" > "$OUT/wrong-output.txt"
          cat "$OUT/results.tsv"

      - name: Summary
        if: always()
        run: |
          OUT="$RUNNER_TEMP/witnesses"
          {
            echo '## float-text E2: witness programs'
            echo
            echo 'run is the exit status of the compiled program: 0 means every value matched the one computed in Python; 10*n+k names the failing check k of case n.'
            echo
            echo '```'
            cat "$OUT/results.tsv" || true
            echo '```'
            for f in "$OUT"/*.diagnostic.txt; do
              [ -s "$f" ] || continue
              echo
              echo "### $(basename "$f" .diagnostic.txt)"
              echo '```'
              head -n 60 "$f"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: float-text-witnesses
          path: ${{ runner.temp }}/witnesses
          retention-days: 30

      - name: Fail when an accepted witness produced a wrong value
        run: test "$(cat "$RUNNER_TEMP/witnesses/wrong-output.txt")" = 0

# Temporary (gran-canon-resource-latch): the focused checks of the resource
# record race test, which a draft pull request's gate skips: the exhaustion
# test module with its output shown, 25 repeats of the race test on an idle
# machine and 25 with every processor busy, the same module on macOS, and the
# compiler lint. Removed before the full check.
name: tmp-resource-latch

on:
  push:
    branches: [gran-canon-resource-latch]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0

jobs:
  race:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install the host toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          rustup default stable
          cargo --version
          cargo fetch --locked --manifest-path compiler/Cargo.toml
      - name: Decline core dumps
        run: sudo sysctl -w kernel.core_pattern=core
      - name: Run the exhaustion tests
        run: |
          ulimit -c 0
          perl .github/run-check.pl latch-race cargo test --manifest-path compiler/Cargo.toml \
            --profile gate --locked --offline --lib backend::tests::exhaustion:: -- --nocapture
      - name: Repeat the race test on an idle machine
        run: |
          ulimit -c 0
          perl .github/run-check.pl latch-repeat sh -c 'for i in $(seq 25); do cargo test --manifest-path compiler/Cargo.toml --profile gate --locked --offline --lib -- --exact backend::tests::exhaustion::failure_paths_racing_for_the_record_leave_exactly_one || exit 1; done'
      - name: Repeat the race test with every processor busy
        run: |
          ulimit -c 0
          pids=""
          for i in $(seq "$(nproc)"); do
            sh -c 'while :; do :; done' &
            pids="$pids $!"
          done
          status=0
          perl .github/run-check.pl latch-loaded sh -c 'for i in $(seq 25); do cargo test --manifest-path compiler/Cargo.toml --profile gate --locked --offline --lib -- --exact backend::tests::exhaustion::failure_paths_racing_for_the_record_leave_exactly_one || exit 1; done' || status=$?
          kill $pids
          exit "$status"
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install the host toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          rustup default stable
          rustup component add clippy
          cargo --version
          cargo fetch --locked --manifest-path compiler/Cargo.toml
      - name: Lint the compiler as the gate does
        run: |
          perl .github/run-check.pl latch-lint cargo clippy --manifest-path compiler/Cargo.toml \
            --all-targets --locked --offline -- -D warnings
  macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install the host toolchain
        run: |
          test -x /usr/bin/clang
          /usr/bin/clang --version
          rustup default stable
          cargo --version
          cargo fetch --locked --manifest-path compiler/Cargo.toml
      - name: Run the exhaustion tests
        run: |
          perl .github/run-check.pl latch-macos cargo test --manifest-path compiler/Cargo.toml \
            --profile gate --locked --offline --lib backend::tests::exhaustion:: -- --nocapture
      - name: Repeat the race test
        run: |
          perl .github/run-check.pl latch-macos-repeat sh -c 'for i in $(seq 10); do cargo test --manifest-path compiler/Cargo.toml --profile gate --locked --offline --lib -- --exact backend::tests::exhaustion::failure_paths_racing_for_the_record_leave_exactly_one || exit 1; done'

# Temporary quick checks for spec-proof-interpreter; removed before the full
# check. Each `broken-*` job breaks one thing `lake exe conformance` protects
# and requires the check to fail with the matching report; `prose` runs the
# repository checks the branch's prose touches and the design tree's lint.
name: tmp-spi

on:
  push:
    branches: [spec-proof-interpreter]

jobs:
  broken:
    name: Conformance fails on ${{ matrix.case }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: a wrong exit status
            file: WhitefootProof/Interpreter.lean
            from: '\| \.int \.u8 c => \.ok \(\.status c\)'
            to: '| .int .u8 c => .ok (.status (c + 1))'
            expect: 'exit status 1, expected 0'
          - case: an exact operation that never steps
            file: WhitefootProof/Interpreter.lean
            from: '\| some r => \.ok \(\.int t r\)'
            to: '| some _ => stuck .domain'
            expect: 'stuck: Whitefoot.Stuck.domain'
          - case: an accepted literal rejected
            file: WhitefootProof/Parser.lean
            from: 'digits\.length > 1 && digits\.head\? == some'
            to: 'digits.length > 0 && digits.head? == some'
            expect: '(run): the parser rejects it citing FORM-7'
          - case: a call in an if condition that never branches
            file: WhitefootProof/Interpreter.lean
            from: 'Step\.ofEval \(branch g v thn els\)'
            to: 'Step.ofEval (ill "broken" : Eval Frame)'
            expect: 'example a call in an if condition: ill formed: broken'
          - case: an unresolved name read as a binding without a value
            file: WhitefootProof/Interpreter.lean
            from: '\| none => ill s!"the name \{x\} is not in scope"'
            to: '| none => stuck .noValue'
            expect: 'example an unresolved name: stuck: Whitefoot.Stuck.noValue'
          - case: fragment cases put outside
            file: WhitefootProof/Parser.lean
            from: 'if let some \(\.oper _\) :='
            to: 'if let some _ :='
            expect: 'listed in fragment-cases.txt but outside the fragment: computed const arguments'
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Lean toolchain
        working-directory: proof
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Break the model
        working-directory: proof
        env:
          FROM: ${{ matrix.from }}
          TO: ${{ matrix.to }}
          FILE: ${{ matrix.file }}
        run: |
          perl -0pi -e 's/$ENV{FROM}/$ENV{TO}/' "$FILE"
          git diff --stat
          test -n "$(git diff --name-only)"
      - name: The conformance check fails with the expected report
        working-directory: proof
        env:
          EXPECT: ${{ matrix.expect }}
        run: |
          set +e
          lake exe conformance > "$RUNNER_TEMP/out.txt" 2>&1
          status=$?
          set -e
          tail -n 20 "$RUNNER_TEMP/out.txt"
          echo "exit status $status"
          test "$status" -ne 0
          grep -F -- "$EXPECT" "$RUNNER_TEMP/out.txt"

  prose:
    name: Prose and guidance checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - name: Name main as a local ref
        run: git branch -f main origin/main
      - name: Checks
        run: |
          perl .github/run-check.pl readme-translation make --no-print-directory readme-translation
          perl .github/run-check.pl spec-prose-integrity make --no-print-directory spec-prose-integrity
          perl .github/run-check.pl guidance make --no-print-directory guidance
          perl .github/run-check.pl repository-invariants make --no-print-directory repository-invariants
          perl .github/run-check.pl design-lint make --no-print-directory design-lint

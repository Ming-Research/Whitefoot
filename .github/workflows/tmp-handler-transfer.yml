# Temporary: the handler-transfer tests of the default --par branch, which a
# draft pull request's push does not otherwise run. Removed before the tests
# are pushed to claude/par-demand-default.
name: tmp-handler-transfer

on:
  push:
    branches: [gran-canon-handler-transfer]
    paths:
      - 'compiler/**'
      - '.github/workflows/tmp-handler-transfer.yml'

permissions:
  contents: read

concurrency:
  group: tmp-handler-transfer
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0

jobs:
  tests:
    name: handler_transfer tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - name: Prepare the host as the gate does
        run: |
          set -euo pipefail
          echo "WHITEFOOT_SCRATCH_ROOT=$RUNNER_TEMP/whitefoot" >> "$GITHUB_ENV"
          echo "WHITEFOOT_TIME_BUDGET_RECORD=$RUNNER_TEMP/time-budget-overruns.txt" >> "$GITHUB_ENV"
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          rustup default stable
          rustup component add clippy rustfmt
          cargo fetch --locked --manifest-path compiler/Cargo.toml
          sudo sysctl -w kernel.core_pattern=core
      - name: The handler-transfer tests
        env:
          WHITEFOOT_CHECK_TIMEOUT: 2100
        run: >
          perl .github/run-check.pl handler-transfer-tests
          cargo test --manifest-path compiler/Cargo.toml --profile gate --locked
          --offline --lib handler_transfer

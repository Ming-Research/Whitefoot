# Temporary measurement for coord-wfbl-01-22; remove before the branch is ready.
# 1. Records the base compiler's verdicts on the new ENT-5 cases.
# 2. Exploratory same-source check-time comparison on hosted runners
#    (base, byte-identical base twin as noise control, branch), five
#    interleaved rounds, compiler CPU only, plus one counter run each.
# Falsifier for "cost is negligible": median branch/base CPU ratio above 1.03
# with the twin within 1.01 of 1.
name: disjoint-write-cost

on:
  push:
    branches: [claude/disjoint-write-facts]
    paths: [.github/workflows/disjoint-write-cost.yml, 'compiler/**']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: disjoint-write-cost-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
  BASE_REVISION: 5850a7e0e
  HALO_REVISION: 80f0ee4
  WHITEFOOT_CHECK_TIMEOUT: 1800

jobs:
  measure:
    name: ${{ matrix.workload }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Firn main is not measured: its source names a local `held`, a
        # keyword since v0.147, so the base compiler rejects it (FORM-3).
        workload: [cases, halo]
    env:
      WORKLOAD: ${{ matrix.workload }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare sources
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          rustup default stable
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_REVISION"
          if [ "$WORKLOAD" = halo ]; then
            git clone --quiet https://github.com/Ming-Research/Halo-wf.git "$RUNNER_TEMP/halo"
            git -C "$RUNNER_TEMP/halo" checkout --quiet --detach "$HALO_REVISION"
          elif [ "$WORKLOAD" = firn ]; then
            git clone --quiet --branch main --single-branch https://github.com/Ming-Research/Firn-wf.git "$RUNNER_TEMP/firn"
            git -C "$RUNNER_TEMP/firn" checkout --quiet --detach HEAD
            git -C "$RUNNER_TEMP/firn" submodule update --init --quiet deps/halo-wf
          fi
          { printf 'base=%s\nbranch=%s\n' "$(git -C "$RUNNER_TEMP/base" rev-parse HEAD)" "$(git rev-parse HEAD)"
            [ "$WORKLOAD" = cases ] || printf 'source=%s\n' "$(git -C "$RUNNER_TEMP/$WORKLOAD" rev-parse HEAD)"
            rustc -vV; lscpu | grep 'Model name'; } | tee "$RUNNER_TEMP/out/identity.txt"
          for tree in "$RUNNER_TEMP/base" "$GITHUB_WORKSPACE"; do
            perl .github/run-check.pl dwc-fetch cargo fetch --locked --manifest-path "$tree/compiler/Cargo.toml"
          done
      - name: Build gate compilers
        run: |
          for tree in "$RUNNER_TEMP/base" "$GITHUB_WORKSPACE"; do
            perl .github/run-check.pl compiler/build cargo build --manifest-path "$tree/compiler/Cargo.toml" --profile gate --bin whitefootc --locked --offline
          done
          cp "$RUNNER_TEMP/base/compiler/target/gate/whitefootc" "$RUNNER_TEMP/base-twin"
      - name: New case verdicts on base and branch
        if: matrix.workload == 'cases'
        run: |
          for case in tests/conformance/cases/ent5-*disjoint*.wf; do
            for which in base branch; do
              if [ "$which" = base ]; then bin="$RUNNER_TEMP/base/compiler/target/gate/whitefootc"; else bin=compiler/target/gate/whitefootc; fi
              set +e
              "$bin" --check "$case" > "$RUNNER_TEMP/out/case.log" 2>&1
              status=$?
              set -e
              codes=$(grep -oE '\b(FN|OP|ENT|OWN|TYPE|FORM)-[0-9]+\b' "$RUNNER_TEMP/out/case.log" | sort -u | tr "\n" " " || true)
              line="$(basename "$case" .wf) $which exit=$status codes=[$codes]"
              echo "$line" | tee -a "$RUNNER_TEMP/out/verdicts.txt"
              [ "$status" = 0 ] || head -5 "$RUNNER_TEMP/out/case.log"
            done
          done
          { echo '## Case verdicts'; echo '```'; cat "$RUNNER_TEMP/out/verdicts.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Interleaved check-time panel and counters
        if: matrix.workload != 'cases'
        run: |
          python3 - <<'PY'
          import collections, csv, os, pathlib, statistics, subprocess
          temp = pathlib.Path(os.environ['RUNNER_TEMP']); out = temp / 'out'
          ws = pathlib.Path(os.environ['GITHUB_WORKSPACE']); workload = os.environ['WORKLOAD']
          source = temp / workload
          bins = {'base': temp / 'base/compiler/target/gate/whitefootc', 'branch': ws / 'compiler/target/gate/whitefootc', 'base-twin': temp / 'base-twin'}
          cmd = ['--graph', 'lib/halo/modules.wfg', '--check-module', 'pkg::vm'] if workload == 'halo' else ['--graph', 'firn/modules.wfg', '--entry', 'firn', '--check']
          env = {k: v for k, v in os.environ.items() if k not in ('WHITEFOOT_CHECK_WORK', 'WHITEFOOT_TIME_BUDGET_RECORD')}
          def run(which, label, counters=False):
              timing = out / (label + '.time'); e = dict(env)
              if counters: e['WHITEFOOT_CHECK_WORK'] = str(out / (which + '-work.tsv'))
              r = subprocess.run(['perl', str(ws / '.github/run-check.pl'), 'dwc-' + label, '/usr/bin/time', '-q', '-f', '%e\t%U\t%S', '-o', str(timing), str(bins[which]), *cmd],
                                 cwd=source, env=e, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              if r.returncode: print(r.stdout[-4000:]); raise SystemExit(f'{label} failed with {r.returncode}')
              wall, user, sys_ = map(float, timing.read_text().split()); return user + sys_
          for w in bins: print(w, 'warm', run(w, 'warm-' + w), flush=True)
          order = list(bins); paired = collections.defaultdict(dict)
          for rnd in range(1, 6):
              cur = order[:] if rnd % 2 else order[::-1]; s = (rnd - 1) % 3; cur = cur[s:] + cur[:s]
              for w in cur:
                  paired[rnd][w] = run(w, f'{w}-{rnd}'); print(rnd, w, paired[rnd][w], flush=True)
          lines = [f'## {workload}: compiler CPU (user+sys) ratios, 5 interleaved rounds', '', '| Comparison | Median | Min | Max |', '|---|---:|---:|---:|']
          for w in ('branch', 'base-twin'):
              rs = [p[w] / p['base'] for p in paired.values()]
              lines.append(f'| {w}/base | {statistics.median(rs):.4f} | {min(rs):.4f} | {max(rs):.4f} |')
          lines.append(f"\nBase median CPU: {statistics.median(p['base'] for p in paired.values()):.2f} s")
          totals = {}
          for w in ('base', 'branch'):
              run(w, 'counters-' + w, counters=True); t = collections.Counter()
              with (out / (w + '-work.tsv')).open() as f:
                  for row in csv.reader(f, delimiter='\t'):
                      if len(row) == 7 and row[6].isdigit(): t[row[3] + ':' + row[5]] += int(row[6])
              totals[w] = t
          keys = sorted(set(totals['base']) | set(totals['branch']), key=lambda k: -max(totals['base'][k], totals['branch'][k]))[:25]
          lines += ['', '| Counter | Base | Branch |', '|---|---:|---:|'] + [f"| {k} | {totals['base'][k]} | {totals['branch'][k]} |" for k in keys]
          summary = '\n'.join(lines) + '\n'; print(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f: f.write(summary)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: disjoint-write-cost-${{ matrix.workload }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: warn

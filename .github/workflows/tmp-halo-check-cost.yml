# Temporary (board item enum-route-check-cost); remove before the branch is ready.
# Re-measures Halo's pkg::vm and pkg::test checks and Firn's whole-program
# check after origin/main was merged
# into the branch, to confirm the merge left the work unchanged: the branch
# before the merge (e2f2bfe2f), the main revision merged, and the merge itself,
# against the pre-regression compilers the earlier measurements used. Compiler
# CPU (user + system), interleaved rounds, plus one work-counter run each.
name: tmp-halo-check-cost

on:
  push:
    branches: [claude/enum-route-check-cost]
    paths: [.github/workflows/tmp-halo-check-cost.yml, 'compiler/**']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: tmp-halo-check-cost-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
  PREBRANCH_REVISION: e2f2bfe2f2046327b926c2d9104d9b6a1416effa
  MAIN_REVISION: c40acc366f2844869666869ce157bbe3ae5858eb
  WHITEFOOT_CHECK_TIMEOUT: 1800

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # pkg::vm: the baseline is the main revision just before the
          # regression, as the first acceptance row defines it.
          - label: halo pkg::vm
            repo: Halo-wf
            rev: 9de699da3261322eaa750c21f31ae290ef5e93cf
            args: --graph tests/halo-vm/modules.wfg --check-module pkg::vm
            base: 7d9118eba
            rounds: 5
            main_rounds: 5
          # pkg::test: the baseline is the compiler of the earlier run; main
          # takes about ten minutes a check, so it runs once.
          - label: halo pkg::test
            repo: Halo-wf
            rev: 9de699da3261322eaa750c21f31ae290ef5e93cf
            args: --graph tests/halo-vm/modules.wfg --check-module pkg::test
            base: d837678c6905
            rounds: 3
            main_rounds: 1
          # Firn whole program: the current main of Firn-wf, and the main of
          # the earlier measurement in case the current one needs newer rules.
          - label: firn now
            repo: Firn-wf
            rev: 97037839080693708361bfd06d6ed789ed2a4808
            args: --graph firn/modules.wfg --entry firn --check
            base: 7d9118eba
            rounds: 5
            main_rounds: 5
          - label: firn then
            repo: Firn-wf
            rev: cc8de63beb272279ec7af16e1eb0f6e578ee36e1
            args: --graph firn/modules.wfg --entry firn --check
            base: 7d9118eba
            rounds: 5
            main_rounds: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare sources and compilers
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          rustup default stable
          git worktree add --detach "$RUNNER_TEMP/base" "${{ matrix.base }}"
          git worktree add --detach "$RUNNER_TEMP/prebranch" "$PREBRANCH_REVISION"
          git worktree add --detach "$RUNNER_TEMP/main" "$MAIN_REVISION"
          git clone --quiet "https://github.com/Ming-Research/${{ matrix.repo }}.git" "$RUNNER_TEMP/halo"
          git -C "$RUNNER_TEMP/halo" checkout --quiet --detach "${{ matrix.rev }}"
          git -C "$RUNNER_TEMP/halo" submodule update --init --quiet
          { printf 'base=%s\nprebranch=%s\nmain=%s\nbranch=%s\nhalo=%s\n' "$(git -C "$RUNNER_TEMP/base" rev-parse HEAD)" "$(git -C "$RUNNER_TEMP/prebranch" rev-parse HEAD)" "$(git -C "$RUNNER_TEMP/main" rev-parse HEAD)" "$(git rev-parse HEAD)" "${{ matrix.rev }}"; lscpu | grep 'Model name'; } | tee "$RUNNER_TEMP/out/identity.txt"
          for tree in "$RUNNER_TEMP/base" "$RUNNER_TEMP/prebranch" "$RUNNER_TEMP/main" "$GITHUB_WORKSPACE"; do
            perl .github/run-check.pl thc-fetch cargo fetch --locked --manifest-path "$tree/compiler/Cargo.toml"
            perl .github/run-check.pl compiler/build cargo build --manifest-path "$tree/compiler/Cargo.toml" --profile gate --bin whitefootc --locked --offline
          done
      - name: Interleaved checks and counters
        env:
          LABEL: ${{ matrix.label }}
          ARGS: ${{ matrix.args }}
          ROUNDS: ${{ matrix.rounds }}
          MAIN_ROUNDS: ${{ matrix.main_rounds }}
        run: |
          python3 - <<'PY'
          import collections, csv, os, pathlib, statistics, subprocess
          temp = pathlib.Path(os.environ['RUNNER_TEMP']); out = temp / 'out'
          ws = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          module = os.environ['LABEL']; rounds = int(os.environ['ROUNDS']); main_rounds = int(os.environ['MAIN_ROUNDS'])
          bins = {'base': temp / 'base/compiler/target/gate/whitefootc', 'prebranch': temp / 'prebranch/compiler/target/gate/whitefootc',
                  'main': temp / 'main/compiler/target/gate/whitefootc', 'branch': ws / 'compiler/target/gate/whitefootc'}
          cmd = os.environ['ARGS'].split()
          env = {k: v for k, v in os.environ.items() if k not in ('WHITEFOOT_CHECK_WORK', 'WHITEFOOT_TIME_BUDGET_RECORD')}
          tag = module.replace('::', '-').replace(' ', '-')
          def run(which, label, counters=False):
              timing = out / (tag + '-' + label + '.time'); e = dict(env)
              if counters: e['WHITEFOOT_CHECK_WORK'] = str(out / (tag + '-' + which + '-work.tsv'))
              r = subprocess.run(['perl', str(ws / '.github/run-check.pl'), 'thc-' + label, '/usr/bin/time', '-q', '-f', '%e\t%U\t%S', '-o', str(timing), str(bins[which]), *cmd],
                                 cwd=temp / 'halo', env=e, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              (out / (tag + '-' + label + '.log')).write_text(r.stdout)
              wall, user, sys_ = map(float, timing.read_text().split()[-3:])
              return r.returncode, user + sys_
          order = list(bins); paired = collections.defaultdict(dict); status = collections.defaultdict(dict)
          for rnd in range(1, rounds + 1):
              cur = order[:] if rnd % 2 else order[::-1]
              for w in cur:
                  if w == 'main' and rnd > main_rounds: continue
                  rc, cpu = run(w, f'{w}-{rnd}'); paired[rnd][w] = cpu; status[rnd][w] = rc
                  print(rnd, w, f'rc={rc}', f'{cpu:.2f}', flush=True)
          lines = [f'## Halo {module}: compiler CPU (user+sys), {rounds} interleaved rounds', '',
                   'Exit codes by round: ' + '; '.join(f'r{r}: ' + ' '.join(f'{w}={status[r][w]}' for w in status[r]) for r in sorted(status)), '',
                   '| Compiler | Median CPU s | Ratio to base (median, min-max) | Ratio to prebranch (median, min-max) |', '|---|---:|---:|---:|']
          for w in order:
              rows = [p for p in paired.values() if w in p]
              if not rows: continue
              rb = [p[w] / p['base'] for p in rows]; rp = [p[w] / p['prebranch'] for p in rows]
              lines.append(f"| {w} | {statistics.median(p[w] for p in rows):.2f} | {statistics.median(rb):.3f} ({min(rb):.3f}-{max(rb):.3f}) | {statistics.median(rp):.3f} ({min(rp):.3f}-{max(rp):.3f}) |")
          totals = {}
          for w in order:
              if w == 'main' and module.endswith('pkg::test'): continue
              rc, _ = run(w, 'counters-' + w, counters=True); t = collections.Counter(); print('counters', w, f'rc={rc}', flush=True)
              work = out / (tag + '-' + w + '-work.tsv')
              if work.exists():
                  with work.open() as f:
                      for row in csv.reader(f, delimiter='\t'):
                          if len(row) == 7 and row[6].isdigit(): t[row[3] + ':' + row[5]] += int(row[6])
              totals[w] = t
          keys = sorted(set().union(*totals.values()), key=lambda k: -max(t[k] for t in totals.values()))[:20]
          ws_ = list(totals)
          lines += ['', '| Counter | ' + ' | '.join(ws_) + ' |', '|---|' + '---:|' * len(ws_)] + [f"| {k} | " + ' | '.join(str(totals[w][k]) for w in ws_) + ' |' for k in keys]
          summary = '\n'.join(lines) + '\n'; print(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f: f.write(summary)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tmp-halo-check-cost-${{ strategy.job-index }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: warn

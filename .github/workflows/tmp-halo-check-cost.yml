# Temporary (board item enum-route-check-cost); remove before the branch is ready.
# After a second merge of origin/main into the branch: the unit tests the
# change owns (a build of every test target of the merged tree, its own test
# module, then the whole unit suite). The Halo re-timing for this merge ran on da79abd12 and is
# not repeated: later commits change tests only.
name: tmp-halo-check-cost

on:
  push:
    branches: [claude/enum-route-check-cost]
    paths: [.github/workflows/tmp-halo-check-cost.yml, 'compiler/**']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: tmp-halo-check-cost-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
  WHITEFOOT_CHECK_TIMEOUT: 1800

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    name: unit tests
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and build the test targets
        run: |
          rustup default stable
          perl .github/run-check.pl thc-fetch cargo fetch --locked --manifest-path compiler/Cargo.toml
          perl .github/run-check.pl thc-unit-build cargo test --manifest-path compiler/Cargo.toml --profile gate --locked --offline --lib --no-run
      - name: Routed ensures tests
        run: |
          perl .github/run-check.pl thc-unit-routed cargo test --manifest-path compiler/Cargo.toml --profile gate --locked --offline --lib 'enum_routed_ensures'
      - name: All unit tests
        if: ${{ !cancelled() }}
        run: |
          perl .github/run-check.pl thc-unit-all cargo test --manifest-path compiler/Cargo.toml --profile gate --locked --offline --lib

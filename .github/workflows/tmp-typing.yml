# Temporary: builds the Lean model and its proofs on every push of this
# branch (spec-proof-typing). Removed before the full check.
name: tmp-typing

on:
  push:
    branches: [spec-proof-typing]

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Lean toolchain
        working-directory: proof
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lake" --version
      - name: Proofs
        working-directory: proof
        run: perl ../.github/run-check.pl proof-build lake build
      - name: Sentence coverage
        working-directory: proof
        run: perl ../.github/run-check.pl proof-coverage lake exe coverage
      - name: Conformance cases in the fragment
        working-directory: proof
        run: perl ../.github/run-check.pl proof-conformance lake exe conformance

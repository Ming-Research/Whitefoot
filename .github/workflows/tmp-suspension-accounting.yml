# Temporary: the focused checks of the per-executor invocation accounting work
# (firn-req-shared-max): the runtime group (every C runtime test, which runs
# the driver-service test), the driver-service tests under the address and
# thread sanitizers, the context programs end to end, one job per mutation of
# the runtime that the driver-service test must reject, and the static and
# change-log checks against the branch's fork point. Removed before the branch
# is ready.
name: tmp-suspension-accounting

on:
  push:
    branches: [firn-req-shared-max]

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install the host toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          rustup default stable
          cargo fetch --locked --manifest-path compiler/Cargo.toml
      - name: Run the runtime group
        run: perl .github/run-check.pl tmp-runtime make --no-print-directory check-group GROUP=runtime
      - name: Run the driver-service tests under the sanitizers
        if: always()
        run: |
          perl .github/run-check.pl tmp-driver-service-asan make -C compiler driver-service-sanitize
          perl .github/run-check.pl tmp-driver-service-tsan make -C compiler driver-service-tsan
          perl .github/run-check.pl tmp-driver-service-native-asan make -C compiler driver-service-native-sanitize
          perl .github/run-check.pl tmp-driver-service-native-tsan make -C compiler driver-service-native-tsan

  programs:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install the host toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          rustup default stable
          cargo fetch --locked --manifest-path compiler/Cargo.toml
      - name: Run the context and parallel programs
        run: |
          perl .github/run-check.pl tmp-programs cargo test --manifest-path compiler/Cargo.toml \
            --profile gate --locked --offline --test corpus -- \
            programs::contexts:: programs::parallel:: --nocapture \
            --skip a_deadlock_report --skip a_program_that_can_take_no_step

  # Each mutation breaks one condition of the change in the runtime source and
  # builds the driver-service test from it, running only the named test
  # function. The test must build and then fail on one of its own checks, not
  # on a compile error.
  mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {mutation: pending-host-work, test: fair_yield_boundaries}
          - {mutation: pending-host-work, test: solitary_sleep_reap}
          - {mutation: fair-through-gate, test: fair_yield_boundaries}
          - {mutation: single-collect, test: invocation_collections}
          - {mutation: collect-ignores-odd, test: invocation_collections}
          - {mutation: quiescence-ignores-slots, test: invocation_collections}
          - {mutation: run-take-no-activate, test: idle_quiescence}
          - {mutation: failed-probe-churn, test: idle_quiescence}
          - {mutation: searcher-claim-any, test: idle_quiescence}
          - {mutation: no-final-notification, test: root_ingress_quiescence}
    steps:
      - uses: actions/checkout@v4
      - name: Install the host toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
      - name: Apply the mutation
        env:
          TARGET: ${{ matrix.test }}
        run: |
          f=compiler/src/backend/completion/bridge.c
          case "${{ matrix.mutation }}" in
            pending-host-work)
              # The 64-answer check ignores a pending host wait and ingress.
              perl -0777 -pi -e 's/\n            && atomic_load_explicit\(&driver->host_waits, memory_order_seq_cst\) == 0u\n            && atomic_load_explicit\(&driver->ingress_count, memory_order_seq_cst\) == 0u\) return 0;/) return 0;/ or die "the pending check is gone\n"' "$f" ;;
            single-collect)
              # The stuck check does not validate its first collection.
              perl -0777 -pi -e 's/return wf_invocations_unchanged\(sequence\)\n        && /(void)sequence;\n    return /g or die "the second collection is gone\n"' "$f" ;;
            fair-through-gate)
              # A fairness suspension arms the external-wake gate again.
              perl -0777 -pi -e 's/(    wf_context_parked_away = WF_SUSPEND_FAIR;)/$1\n    wf_context_arm_wake(self);/ or die "the fair marker is gone\n"' "$f" ;;
            no-final-notification)
              # A displaced return sends nothing after its even publication.
              perl -0777 -pi -e 's/    if \(!retained\) wf_completion_notify_target\(driver->runtime\);\n/    (void)driver; (void)retained;\n/ or die "the final notification is gone\n"' "$f" ;;
            quiescence-ignores-slots)
              # Shutdown quiescence does not look at the invocation slots.
              perl -0777 -pi -e 's/int quiet = wf_invocations_collect\(sequence\)\n        && !atomic_load_explicit/(void)sequence;\n    int quiet = !atomic_load_explicit/ or die "the quiet collect is gone\n"; s/    if \(quiet\) quiet = wf_invocations_unchanged\(sequence\);\n// or die "the quiet validation is gone\n"' "$f" ;;
            collect-ignores-odd)
              # A collection accepts a slot that is inside an invocation.
              perl -0777 -pi -e 's/\n        if \(sequence\[i\] & 1u\) return 0;//g or die "the odd rejection is gone\n"' "$f" ;;
            run-take-no-activate)
              # Taking a context from an idle driver leaves it logically idle.
              perl -0777 -pi -e 's/    wf_driver_activate\(driver\);\n    wf_spin_lock\(&driver->run_lock\);/    (void)wf_driver_activate;\n    wf_spin_lock(&driver->run_lock);/ or die "the activation is gone\n"' "$f" ;;
            failed-probe-churn)
              # A refused borrow probe counts as a driver-state change.
              perl -0777 -pi -e 's/(        if \(!wf_driver_try_borrow\(victim, &outside\)\) \{\n)/$1            atomic_fetch_add_explicit(&wf_drivers_changes, 1u, memory_order_seq_cst);\n/ or die "the borrow probe is gone\n"' "$f" ;;
            searcher-claim-any)
              # Ending a search retires a wake claim the driver never held.
              perl -0777 -pi -e 's/    if \(!atomic_load_explicit\(&driver->searcher, memory_order_seq_cst\)\) return;\n    wf_quiescence_lock\(\);/    wf_quiescence_lock();/ or die "the early return is gone\n"; s/if \(claimed\) atomic_store_explicit\(&wf_drivers_searching/atomic_store_explicit(&wf_drivers_searching/ or die "the claim test is gone\n"' "$f" ;;
          esac
          # Run only the named test function: the others stay referenced so
          # the unused-function warning does not hide the mutated build.
          perl -0777 -pi -e 'my ($head, $tail) = split(/(?=int main\(void\) \{)/, $_, 2); $tail =~ /^    \Q$ENV{TARGET}\E\(\);$/m or die "no such test\n"; $tail =~ s/^    ([a-z][a-z_]*)\(\);$/my $n = $1; ($n eq $ENV{TARGET} || $n =~ m{^wf_}) ? "    $n();" : "    (void)$n;"/gme; $_ = $head . $tail;' compiler/src/backend/completion/driver_service_test.c
          git diff --stat
          git diff -U1
      - name: The driver-service test must build and then fail one of its own checks
        run: |
          set +e
          make -C compiler driver-service-test > "$RUNNER_TEMP/mutant.log" 2>&1
          status=$?
          set -e
          tail -30 "$RUNNER_TEMP/mutant.log"
          if [ "$status" = 0 ]; then
            echo "::error::the mutated runtime passed the driver-service test"
            exit 1
          fi
          grep -E 'driver-service-test:[0-9]+: ' "$RUNNER_TEMP/mutant.log"

  # The three deadlock-report program tests, one at a time: each builds a
  # program cold and takes 30 to 60 s alone, on main as well, so they do not
  # fit beside the other cases in one process on a four-core runner.
  deadlock:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install the host toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          rustup default stable
          cargo fetch --locked --manifest-path compiler/Cargo.toml
      - name: Build the test binary
        run: |
          perl .github/run-check.pl tmp-deadlock-build cargo test --manifest-path compiler/Cargo.toml \
            --profile gate --locked --offline --test corpus --no-run
      - name: Each deadlock test alone
        run: |
          for name in a_deadlock_report_names_the_guard_and_the_implicit_loop_join \
                      a_deadlock_report_distinguishes_binding_use_from_ordinary_block_end \
                      a_program_that_can_take_no_step_stops_with_a_report_on_every_driver_count; do
            perl .github/run-check.pl "tmp-deadlock-$name" cargo test --manifest-path compiler/Cargo.toml \
              --profile gate --locked --offline --test corpus -- "programs::contexts::$name" \
              --test-threads=1 --nocapture
          done

  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - name: Run the static checks and the change-log check
        run: |
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          git branch -f main origin/main
          base=$(git merge-base HEAD origin/main)
          git log --oneline -1 "$base"
          make --no-print-directory static DESIGN_REVIEW_BASE="$base"
          perl .github/run-check.pl tmp-design-ready make --no-print-directory design-ready \
            DESIGN_REVIEW_BASE="$base"

# Temporary: shows that `make source-size` refuses each wrong input of its
# list file. Removed before the branch is ready; the run is linked from the
# pull request.
name: source-size demonstration

on:
  push:
    branches: [claude/delete-todo-md]

jobs:
  demo:
    name: source-size wrong inputs (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v4
      - name: Refuse each wrong input, accept the real list
        shell: bash
        run: |
          set -u
          scratch="$RUNNER_TEMP/source-size"
          mkdir -p "$scratch"
          state=compiler/src/semantic/entailment/state.rs
          tests=compiler/src/semantic/tests/entailment.rs
          small=compiler/src/semantic/check.rs
          failed=0
          run() {
            make --no-print-directory source-size SOURCE_SIZE_LIST="$1" > "$scratch/out" 2>&1
          }
          accept() {
            if run "$2"; then echo "ok: $1 accepted"; cat "$scratch/out"
            else echo "FAIL: $1 refused"; cat "$scratch/out"; failed=1; fi
          }
          refuse() {
            if run "$2"; then echo "FAIL: $1 accepted"; cat "$scratch/out"; failed=1; return; fi
            if grep -q -F -e "$3" "$scratch/out"; then echo "ok: $1 refused"; cat "$scratch/out"
            else echo "FAIL: $1 refused without '$3'"; cat "$scratch/out"; failed=1; fi
          }
          accept "the real list" .github/oversized-sources.txt
          printf '\n  # indented comment\n%s coord-wfbl-07-01\n\n%s coord-wfbl-07-01\n' "$state" "$tests" > "$scratch/blank"
          accept "blank and comment lines" "$scratch/blank"
          printf '%s coord-wfbl-07-01\n' "$state" > "$scratch/unlisted"
          refuse "an unlisted source over the limit" "$scratch/unlisted" "$tests has"
          { cat .github/oversized-sources.txt; printf '%s coord-wfbl-07\n' "$small"; } > "$scratch/under"
          refuse "a listed source no longer over the limit" "$scratch/under" "$small has"
          { cat .github/oversized-sources.txt; printf 'compiler/src/does_not_exist.rs coord-wfbl-07\n'; } > "$scratch/absent"
          refuse "a listed path that does not exist" "$scratch/absent" "is not a tracked compiler source"
          printf '%s\n%s coord-wfbl-07-01\n' "$state" "$tests" > "$scratch/keyless"
          refuse "a line without a board key" "$scratch/keyless" "expected '<path> <board key>'"
          printf '%s TODO\n%s coord-wfbl-07-01\n' "$state" "$tests" > "$scratch/badkey"
          refuse "a key that is not a board key" "$scratch/badkey" "expected '<path> <board key>'"
          printf '%s coord-wfbl-07-01 extra\n%s coord-wfbl-07-01\n' "$state" "$tests" > "$scratch/extra"
          refuse "a line with a third field" "$scratch/extra" "expected '<path> <board key>'"
          { cat .github/oversized-sources.txt; printf '%s coord-wfbl-07-01\n' "$state"; } > "$scratch/twice"
          refuse "a path listed twice" "$scratch/twice" "is listed twice"
          refuse "a missing list file" "$scratch/none" "is missing"
          exit "$failed"

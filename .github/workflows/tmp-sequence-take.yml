# Temporary: runs the registered measurements Q1, Q2 and Q3 of
# research/investigations/sequence-take/DESIGN.md section 7. Q1 prices one
# shared fetch-and-add in C, and Q2 compares ordinary statements with and
# without an exclusive sequence on the compiler revision named by wf_rev.
# Q3 uses experiment_release and includes T1, T1t, T1off, TP and TC, plus
# same-compiler Q2 controls. Before Q3, a hosted job compares the ordinary
# statement fixture's emitted body with ir_baseline byte for byte.
# Removed after the run, with the results copied into the investigation's
# record.
#
#   gh workflow run tmp-sequence-take.yml --ref <branch> -f mode=smoke
#   gh workflow run tmp-sequence-take.yml --ref <branch> -f mode=pilot
#   gh workflow run tmp-sequence-take.yml --ref <branch> -f mode=main
#   gh workflow run tmp-sequence-take.yml --ref <branch> -f kinds=q3 -f experiment_release=wf-exp-<12-hex> -f mode=pilot
#
# smoke builds the compiler and the arms and runs every arm briefly on a
# GitHub-hosted runner to check the wiring, the check values, that T2 passes
# the correctness checks N1 to N3 (and T1 in Q3) and that Tbad fails N1 and N3; its rates
# decide nothing. pilot (one block at the 8-P-core list, timed) and main (the
# registered six blocks at four lists, plus one driver for Q3) run only on the 14900K runner and
# refuse any other host. If the noise at the 8-P-core list exceeds 0.05, rerun
# main once with cell_millis=10000.
#
# The heavy steps run under .github/run-check.pl, which holds the host-wide
# lock so that no other heavy command shares the machine. Their labels have
# no row in .github/time-budgets.txt and no budget record is named here, so
# the budget comparison is skipped for them; a dispatch-only measurement is
# not a gate stage.
#
# research-boundary: manual-only
# Explicitly requested measurement; no push or pull-request trigger.
name: tmp-sequence-take

on:
  workflow_dispatch:
    inputs:
      mode:
        description: smoke checks the wiring on a GitHub-hosted runner (no verdict); pilot is one block at the 8-P-core list and main the registered blocks, both on the 14900K
        type: choice
        options: [smoke, pilot, main]
        default: smoke
      kinds:
        description: Q1/Q2 pre-implementation comparison, or Q3 atomic-value acceptance with the same-compiler controls
        type: choice
        options: ["q1 q2", q3]
        default: "q1 q2"
      experiment_release:
        description: Q3 compiler experiment release tag (wf-exp followed by twelve hex digits); required for kinds=q3
        type: string
        default: ""
      ir_baseline:
        description: Pre-amendment compiler revision for exact ordinary-statement IR comparison before Q3
        type: string
        default: 30ea2978819d2c8047f748fbcfec019e69c50084
      blocks:
        description: Blocks of the main run (registered as 6, DESIGN.md section 7)
        type: string
        default: "6"
      cell_millis:
        description: Milliseconds of each timed cell (registered as 5000; 10000 for the one allowed rerun)
        type: string
        default: "5000"
      wf_rev:
        description: The compiler revision the Whitefoot arms are built with (default, main at 3adedae9bb1a, which includes skip-handle-count)
        type: string
        default: 3adedae9bb1a9028e0afd95d2776e5330db4abc1

defaults:
  run:
    shell: bash

permissions:
  contents: read

env:
  KINDS: ${{ inputs.kinds }}
  EXPERIMENT_RELEASE: ${{ inputs.experiment_release }}
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0

jobs:
  ir_baseline:
    if: ${{ inputs.kinds == 'q3' }}
    name: ordinary statement IR matches the pre-amendment compiler
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      BASELINE_INPUT: ${{ inputs.ir_baseline }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Q3 reduction with deliberately wrong inputs
        run: python3 -I -B research/experiments/sequence-take/q3/test_summary.py
      - name: Install LLVM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld
          rustup default stable
      - name: Build the baseline compiler
        run: |
          baseline=$(git rev-parse "$BASELINE_INPUT")
          echo "BASELINE=$baseline" >> "$GITHUB_ENV"
          git worktree add --detach "$RUNNER_TEMP/sequence-take-baseline" "$baseline"
          cargo fetch --locked --manifest-path "$RUNNER_TEMP/sequence-take-baseline/compiler/Cargo.toml"
          make -C "$RUNNER_TEMP/sequence-take-baseline/compiler" build
      - name: Download the experiment compiler
        run: |
          [[ "$EXPERIMENT_RELEASE" =~ ^wf-exp-[0-9a-f]{12}$ ]] || { echo "Q3 requires an experiment release"; exit 1; }
          release_dir="$RUNNER_TEMP/sequence-take-ir"
          mkdir -p "$release_dir"
          gh release download "$EXPERIMENT_RELEASE" --repo "$GITHUB_REPOSITORY" --dir "$release_dir" --clobber \
            --pattern whitefootc-linux-x86_64.tar.gz --pattern whitefoot-release.json --pattern SHA256SUMS
          (cd "$release_dir" && sha256sum --check SHA256SUMS --ignore-missing)
          tar -xzf "$release_dir/whitefootc-linux-x86_64.tar.gz" -C "$release_dir"
          jq --exit-status --arg tag "$EXPERIMENT_RELEASE" \
            '.tag == $tag and (.commit | startswith($tag | ltrimstr("wf-exp-")))' \
            "$release_dir/whitefoot-release.json" >/dev/null
      - name: Compare emitted ordinary statement bodies
        run: |
          release_dir="$RUNNER_TEMP/sequence-take-ir"
          perl .github/run-check.pl sequence-take/baseline-ir \
            "$RUNNER_TEMP/sequence-take-baseline/compiler/target/gate/whitefootc" --emit-llvm \
            -o "$release_dir/baseline.ll" tests/programs/shared_statement_ir.wf
          perl .github/run-check.pl sequence-take/experiment-ir \
            "$release_dir/whitefootc" --emit-llvm \
            -o "$release_dir/experiment.ll" tests/programs/shared_statement_ir.wf
          python3 -I -B - "$release_dir" <<'PYCOMPARE'
          import pathlib
          import re
          import sys
          directory = pathlib.Path(sys.argv[1])
          def body(path):
              text = path.read_text()
              for name in ("_env_ordinary.body", "_env_ordinary", "ordinary.body", "ordinary"):
                  match = re.search(r"^define [^\n]* @wf_" + re.escape(name) + r"\([^\n]*\n.*?^}", text, re.M | re.S)
                  if match:
                      return match.group(0)
              raise SystemExit(f"no ordinary function body in {path}")
          before = body(directory / "baseline.ll")
          after = body(directory / "experiment.ll")
          (directory / "baseline-body.ll").write_text(before + "\n")
          (directory / "experiment-body.ll").write_text(after + "\n")
          if before != after:
              import difflib
              print("\n".join(difflib.unified_diff(before.splitlines(), after.splitlines(), fromfile="baseline", tofile="experiment")))
              raise SystemExit("ordinary-statement emitted IR changed")
          print("ordinary-statement emitted IR is byte-for-byte identical")
          PYCOMPARE
          printf '%s\n' "$BASELINE" > "$release_dir/baseline-revision.txt"
          cp tests/programs/shared_statement_ir.wf "$release_dir/source.wf"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sequence-take-ir-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/sequence-take-ir/*.ll
            ${{ runner.temp }}/sequence-take-ir/whitefoot-release.json
            ${{ runner.temp }}/sequence-take-ir/baseline-revision.txt
            ${{ runner.temp }}/sequence-take-ir/source.wf

  smoke:
    needs: ir_baseline
    if: ${{ always() && (needs.ir_baseline.result == 'success' || needs.ir_baseline.result == 'skipped') && inputs.mode == 'smoke' }}
    name: sequence-take ${{ inputs.kinds }} (smoke, GitHub-hosted, no verdict)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MODE: smoke
      MILLIS: "300"
      CHECK_MILLIS: "1000"
      BLOCKS: "2"
      W_LIST: "100 400"
      WF_REV_INPUT: ${{ inputs.wf_rev }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Name the output directory and pick the host's CPU lists
        run: |
          echo "OUT=$RUNNER_TEMP/sequence-take" >> "$GITHUB_ENV"
          cpus=$(nproc)
          echo "cpus: $cpus"
          if [ "$cpus" -ge 4 ]; then
            echo "CPU_LISTS=0 0,1 0-3" >> "$GITHUB_ENV"
            echo "CHECK_LIST=0-3" >> "$GITHUB_ENV"
          else
            echo "CPU_LISTS=0 0,1" >> "$GITHUB_ENV"
            echo "CHECK_LIST=0,1" >> "$GITHUB_ENV"
          fi

      - name: Install the host's tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld
          rustup default stable
          missing=
          for tool in /usr/bin/clang ld.lld cargo make taskset perl python3 git awk lscpu timeout sha256sum /usr/bin/time gh jq tar; do
            command -v "$tool" >/dev/null || missing="$missing $tool"
          done
          if [ -n "$missing" ]; then
            echo "missing:$missing"
            exit 1
          fi

      - name: Require an experiment release for Q3
        run: |
          if [ "$KINDS" = q3 ]; then
            [[ "$EXPERIMENT_RELEASE" =~ ^wf-exp-[0-9a-f]{12}$ ]] || { echo "Q3 requires experiment_release=wf-exp-<12-hex>"; exit 1; }
          elif [ -n "$EXPERIMENT_RELEASE" ]; then
            echo "experiment_release is only used for kinds=q3"
            exit 1
          fi

      - name: Download the Q3 experiment compiler
        if: ${{ inputs.kinds == 'q3' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_dir="$RUNNER_TEMP/sequence-take-release"
          mkdir -p "$release_dir"
          gh release download "$EXPERIMENT_RELEASE" --repo "$GITHUB_REPOSITORY" --dir "$release_dir" --clobber \
            --pattern whitefootc-linux-x86_64.tar.gz --pattern whitefoot-release.json --pattern SHA256SUMS
          (cd "$release_dir" && sha256sum --check SHA256SUMS --ignore-missing)
          tar -xzf "$release_dir/whitefootc-linux-x86_64.tar.gz" -C "$release_dir"
          jq --exit-status --arg tag "$EXPERIMENT_RELEASE" \
            '.tag == $tag and (.commit | startswith($tag | ltrimstr("wf-exp-")))' \
            "$release_dir/whitefoot-release.json" >/dev/null
          revision=$(jq -r .commit "$release_dir/whitefoot-release.json")
          echo "WF_RELEASE=$EXPERIMENT_RELEASE ($revision)" >> "$GITHUB_ENV"
          echo "WHITEFOOTC=$release_dir/whitefootc" >> "$GITHUB_ENV"
          cp "$release_dir/whitefoot-release.json" "$RUNNER_TEMP/sequence-take-release.json"

      - name: Build the compiler at the named revision
        if: ${{ inputs.kinds != 'q3' }}
        run: |
          rev=$(git rev-parse "$WF_REV_INPUT")
          echo "WF_RELEASE=$rev" >> "$GITHUB_ENV"
          echo "WHITEFOOTC=$RUNNER_TEMP/wf/compiler/target/gate/whitefootc" >> "$GITHUB_ENV"
          git worktree prune
          rm -rf "$RUNNER_TEMP/wf"
          git worktree add --detach "$RUNNER_TEMP/wf" "$rev"
          cargo fetch --locked --manifest-path "$RUNNER_TEMP/wf/compiler/Cargo.toml"
          perl .github/run-check.pl sequence-take/compiler make -C "$RUNNER_TEMP/wf/compiler" build

      - name: Build the arms
        run: |
          perl .github/run-check.pl sequence-take/build \
            bash research/experiments/sequence-take/run.sh --out "$OUT" --build-only

      - name: Run the cells and the correctness runs
        run: |
          perl .github/run-check.pl sequence-take/cells \
            bash research/experiments/sequence-take/run.sh --out "$OUT" --skip-build

      - name: Summarize
        if: always()
        run: |
          test -s "$OUT/raw.tsv" || { echo "no rows were written"; exit 1; }
          status=0
          python3 -I -B research/experiments/sequence-take/summarize.py --smoke "$OUT" > "$OUT/summary.txt" || status=$?
          cat "$OUT/summary.txt"
          {
            echo "## sequence-take ${{ inputs.kinds }} (smoke, no verdict)"
            echo
            echo '```text'
            cat "$OUT/host.txt" 2>/dev/null || true
            echo
            cat "$OUT/summary.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sequence-take-smoke-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/sequence-take/raw.tsv
            ${{ runner.temp }}/sequence-take/correct.tsv
            ${{ runner.temp }}/sequence-take/calib.tsv
            ${{ runner.temp }}/sequence-take/idle.tsv
            ${{ runner.temp }}/sequence-take/summary.txt
            ${{ runner.temp }}/sequence-take/host.txt
            ${{ runner.temp }}/sequence-take/runs/
            ${{ runner.temp }}/sequence-take/bin/*.ll
            ${{ runner.temp }}/sequence-take-release.json

  measure:
    needs: ir_baseline
    if: ${{ always() && (needs.ir_baseline.result == 'success' || needs.ir_baseline.result == 'skipped') && inputs.mode != 'smoke' }}
    name: sequence-take ${{ inputs.kinds }} (${{ inputs.mode }}, 14900K)
    runs-on: [self-hosted, 14900k]
    # Q1/Q2 main: 31 units x 4 lists x 6 blocks x 5 s, about 62 minutes.
    # Q3 main: 8 units x 5 lists x 6 blocks x 5 s, about 20 minutes, plus
    # three correctness controls per block. The baseline build is hosted.
    # Bounds a stuck runner only.
    timeout-minutes: 150
    # One run at a time on the 14900K, queued rather than cancelled.
    concurrency:
      group: tmp-sequence-take-14900k
      cancel-in-progress: false
    env:
      MODE: ${{ inputs.mode }}
      WF_REV_INPUT: ${{ inputs.wf_rev }}
      CLANG: /usr/bin/clang
      CPU_LISTS: "0,2 0,2,4,6 0,2,4,6,8,10,12,14 0-15"
      CHECK_LIST: "0,2,4,6,8,10,12,14"
      CHECK_MILLIS: "1000"
    steps:
      - name: Refuse any host but the 14900K
        run: |
          model=$(awk -F': ' '/^model name/ {print $2; exit}' /proc/cpuinfo)
          echo "runner: $RUNNER_NAME ($RUNNER_ENVIRONMENT); model: $model; cpus: $(nproc)"
          if [ "$RUNNER_ENVIRONMENT" != self-hosted ]; then
            echo "the $MODE mode runs only on the self-hosted 14900K runner; use mode=smoke on a GitHub-hosted runner"
            exit 1
          fi
          case $model in
            *i9-14900K*) ;;
            *) echo "this host is not an i9-14900K; the CPU lists name that machine's cores"; exit 1 ;;
          esac
          if [ "$(nproc)" != 32 ]; then
            echo "expected 32 CPUs (8 P-cores with two hyperthreads, 16 E-cores), found $(nproc)"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the inputs and the host's tools
        env:
          BLOCKS_INPUT: ${{ inputs.blocks }}
          MILLIS_INPUT: ${{ inputs.cell_millis }}
        run: |
          [[ "$BLOCKS_INPUT" =~ ^[1-9][0-9]?$ ]] || { echo "blocks must be a number from 1 to 99"; exit 1; }
          [[ "$MILLIS_INPUT" =~ ^[1-9][0-9]{3,4}$ ]] || { echo "cell_millis must be a number from 1000 to 99999"; exit 1; }
          echo "BLOCKS=$BLOCKS_INPUT" >> "$GITHUB_ENV"
          echo "MILLIS=$MILLIS_INPUT" >> "$GITHUB_ENV"
          echo "OUT=$RUNNER_TEMP/sequence-take" >> "$GITHUB_ENV"
          if [ "$KINDS" = q3 ]; then
            echo "CPU_LISTS=0 0,2 0,2,4,6 0,2,4,6,8,10,12,14 0-15" >> "$GITHUB_ENV"
          fi
          if [ -d "$HOME/.cargo/bin" ]; then
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          missing=
          for tool in /usr/bin/clang ld.lld cargo make taskset perl python3 git awk lscpu timeout sha256sum /usr/bin/time gh jq tar; do
            command -v "$tool" >/dev/null || missing="$missing $tool"
          done
          if [ -n "$missing" ]; then
            echo "missing:$missing"
            exit 1
          fi
          /usr/bin/clang --version

      - name: Stop leftovers and check that the host is idle
        run: |
          ps -eo pid,args | grep -E '/sequence-take/bin/' | grep -v grep | tee "$RUNNER_TEMP/leftover.txt" || true
          awk '{print $1}' "$RUNNER_TEMP/leftover.txt" | xargs -r kill 2>/dev/null || true
          lock=/tmp/whitefoot-check-$(id -u).lock
          if [ -e "$lock" ]; then
            owner=$(head -1 "$lock/pid" 2>/dev/null)
            if [ -z "$owner" ] || ! kill -0 "$owner" 2>/dev/null; then
              echo "removing stale lock of $owner: $(cat "$lock/command" 2>/dev/null)"
              rm -rf "$lock"
            fi
          fi
          sleep 2
          sample() { awk '/^cpu / {idle = $5 + $6; total = 0; for (i = 2; i <= NF; i++) total += $i; print idle, total}' /proc/stat; }
          read -r idle_before total_before < <(sample)
          sleep 5
          read -r idle_after total_after < <(sample)
          busy=$(awk -v ib="$idle_before" -v tb="$total_before" -v ia="$idle_after" -v ta="$total_after" 'BEGIN { printf "%.4f", 1 - (ia - ib) / (ta - tb) }')
          echo "load: $(cat /proc/loadavg); busy share over 5 s: $busy"
          ps -eo pid,pcpu,args --sort=-pcpu | head -n 8
          awk -v busy="$busy" 'BEGIN { exit !(busy > 0.05) }' && { echo "the host is not idle; stop its other work first"; exit 1; } || true

      - name: Require an experiment release for Q3
        run: |
          if [ "$KINDS" = q3 ]; then
            [[ "$EXPERIMENT_RELEASE" =~ ^wf-exp-[0-9a-f]{12}$ ]] || { echo "Q3 requires experiment_release=wf-exp-<12-hex>"; exit 1; }
          elif [ -n "$EXPERIMENT_RELEASE" ]; then
            echo "experiment_release is only used for kinds=q3"
            exit 1
          fi

      - name: Download the Q3 experiment compiler
        if: ${{ inputs.kinds == 'q3' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_dir="$RUNNER_TEMP/sequence-take-release"
          mkdir -p "$release_dir"
          gh release download "$EXPERIMENT_RELEASE" --repo "$GITHUB_REPOSITORY" --dir "$release_dir" --clobber \
            --pattern whitefootc-linux-x86_64.tar.gz --pattern whitefoot-release.json --pattern SHA256SUMS
          (cd "$release_dir" && sha256sum --check SHA256SUMS --ignore-missing)
          tar -xzf "$release_dir/whitefootc-linux-x86_64.tar.gz" -C "$release_dir"
          jq --exit-status --arg tag "$EXPERIMENT_RELEASE" \
            '.tag == $tag and (.commit | startswith($tag | ltrimstr("wf-exp-")))' \
            "$release_dir/whitefoot-release.json" >/dev/null
          revision=$(jq -r .commit "$release_dir/whitefoot-release.json")
          echo "WF_RELEASE=$EXPERIMENT_RELEASE ($revision)" >> "$GITHUB_ENV"
          echo "WHITEFOOTC=$release_dir/whitefootc" >> "$GITHUB_ENV"
          cp "$release_dir/whitefoot-release.json" "$RUNNER_TEMP/sequence-take-release.json"

      - name: Build the compiler at the named revision
        if: ${{ inputs.kinds != 'q3' }}
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          rev=$(git rev-parse "$WF_REV_INPUT")
          echo "WF_RELEASE=$rev" >> "$GITHUB_ENV"
          echo "WHITEFOOTC=$RUNNER_TEMP/wf/compiler/target/gate/whitefootc" >> "$GITHUB_ENV"
          git worktree prune
          rm -rf "$RUNNER_TEMP/wf"
          git worktree add --detach "$RUNNER_TEMP/wf" "$rev"
          cargo fetch --locked --manifest-path "$RUNNER_TEMP/wf/compiler/Cargo.toml"
          perl .github/run-check.pl sequence-take/compiler make -C "$RUNNER_TEMP/wf/compiler" build

      - name: Build the arms
        run: |
          perl .github/run-check.pl sequence-take/build \
            bash research/experiments/sequence-take/run.sh --out "$OUT" --build-only

      - name: Run the cells and the correctness runs
        env:
          WHITEFOOT_CHECK_TIMEOUT: "9000"
        run: |
          perl .github/run-check.pl sequence-take/cells \
            bash research/experiments/sequence-take/run.sh --out "$OUT" --skip-build

      - name: Summarize
        if: always()
        run: |
          test -s "$OUT/raw.tsv" || { echo "no rows were written"; exit 0; }
          flag=
          if [ "$MODE" = pilot ]; then flag=--pilot; fi
          python3 -I -B research/experiments/sequence-take/summarize.py $flag "$OUT" > "$OUT/summary.txt" || true
          cat "$OUT/summary.txt"
          {
            echo "## sequence-take ${{ inputs.kinds }} ($MODE)"
            echo
            echo '```text'
            cat "$OUT/host.txt" 2>/dev/null || true
            cat "$OUT/pilot.txt" 2>/dev/null || true
            echo
            cat "$OUT/summary.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sequence-take-${{ inputs.mode }}-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/sequence-take/raw.tsv
            ${{ runner.temp }}/sequence-take/correct.tsv
            ${{ runner.temp }}/sequence-take/calib.tsv
            ${{ runner.temp }}/sequence-take/idle.tsv
            ${{ runner.temp }}/sequence-take/pilot.txt
            ${{ runner.temp }}/sequence-take/summary.txt
            ${{ runner.temp }}/sequence-take/host.txt
            ${{ runner.temp }}/sequence-take/runs/
            ${{ runner.temp }}/sequence-take/bin/*.ll
            ${{ runner.temp }}/sequence-take-release.json

# Temporary: which stack probes each clang puts in the runtime's C frames over
# a page, under each candidate argument, on the pushes the wf-agents engine
# makes of this work's commits (the `wf-try/work-208-26e0fade/` refs), and the
# runtime frame test on macOS. Removed before the full check (AGENTS.md,
# "Checks").
name: tmp-runtime-probes

on:
  push:
    branches: ['wf-try/work-208-26e0fade/**']

permissions:
  contents: read

jobs:
  # The runtime frame test itself, with the gate's compiler on each platform:
  # LLVM 22 as /usr/bin/clang on Linux, Apple's clang on macOS.
  frame-test:
    name: frame-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM as the gate does
        if: runner.os == 'Linux'
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
      # From compiler/, so that rustup takes the toolchain its
      # rust-toolchain.toml names.
      - name: Set up Rust
        working-directory: compiler
        run: |
          /usr/bin/clang --version
          cargo --version
      - name: Fetch locked compiler dependencies
        working-directory: compiler
        run: cargo fetch --locked
      - name: Runtime frame test
        working-directory: compiler
        run: |
          perl ../.github/run-check.pl tmp/runtime-frame-test \
            cargo test --profile gate --locked --offline \
            --bin whitefootc -- --exact tests::every_runtime_c_frame_over_a_page_is_probed --nocapture

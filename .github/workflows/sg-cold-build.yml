# Temporary: measures sg-req-cold-build-speed, removed before any merge (this
# branch never merges as is). Snowghost asks why a from-scratch build of its
# `--par` layout_oracle (the full-pipeline driver `make binary-size-check`
# builds) takes 4.5-7.5 minutes on a hosted 4-vCPU runner, against a target of
# under 2 minutes. This workflow builds Whitefoot main's compiler from this
# checkout (outside the timed region), then runs Snowghost-wf main's exact
# binary-size-check command three times cold (cache emptied before each) and
# once warm, and splits each run by the phases `whitefootc --report` prints:
# front end (parse, check, proof checking and code generation to LLVM IR,
# one figure), splitting into fragments, clang compiling the fragments, and
# the ThinLTO link. Two extra cold single runs split the front end further:
# `--check-modules` alone (parse, check, proof, no code generation) and
# `--emit-llvm` alone (front end plus code generation, no clang).
name: sg-cold-build

on:
  push:
    branches: [claude/sg-cold-build]
  workflow_dispatch:

concurrency:
  group: sg-cold-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
  WHITEFOOT_CHECK_TIMEOUT: 1800

defaults:
  run:
    shell: bash

jobs:
  measure:
    name: Cold build of Snowghost's --par layout_oracle
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      # The gate's toolchain step: the LLVM major .github/llvm-major pins as
      # /usr/bin/clang and ld.lld, which whitefootc runs.
      - name: Install the host toolchain
        run: |
          set -euo pipefail
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          rustup default stable

      # Snowghost main does not compile with Whitefoot main yet (`unchanged`
      # became a keyword), so the measured compiler is the release it pins.
      - name: Fetch the compiler release Snowghost pins (not timed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wfc"
          gh release download wf-d837678c6905 -R "$GITHUB_REPOSITORY" \
            -p whitefootc-linux-x86_64.tar.gz -D "$RUNNER_TEMP/wfc"
          tar -xzf "$RUNNER_TEMP/wfc/whitefootc-linux-x86_64.tar.gz" -C "$RUNNER_TEMP/wfc"
          bin=$(find "$RUNNER_TEMP/wfc" -type f -name whitefootc | head -1)
          mkdir -p compiler/target/gate
          cp "$bin" compiler/target/gate/whitefootc
          ls -l compiler/target/gate/whitefootc

      - name: Check out Snowghost-wf main and record the machine
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/sg-cold-build"
          mkdir -p "$out"
          git clone --quiet --recurse-submodules https://github.com/Ming-Research/Snowghost-wf.git "$RUNNER_TEMP/snowghost"
          {
            echo "whitefoot commit: $(git rev-parse HEAD)"
            echo "snowghost commit: $(git -C "$RUNNER_TEMP/snowghost" rev-parse HEAD)"
            echo "snowghost pin: $(cat "$RUNNER_TEMP/snowghost/whitefoot.pin")"
            echo "nproc: $(nproc)"
            echo "cpu: $(grep -m1 'model name' /proc/cpuinfo)"
            echo "memory: $(grep MemTotal /proc/meminfo)"
            echo "clang: $(/usr/bin/clang --version | head -1)"
            echo "ld.lld: $(ld.lld --version)"
            echo "rustc: $(rustc --version)"
          } | tee "$out/machine.txt"

      # The command is Snowghost-wf's Makefile rule for $(ENGINE_BINARY),
      # which `make binary-size-check` runs: in renderer/,
      #   $(WHITEFOOTC) --cache build/whitefoot-cache --fragments function \
      #     --par --graph modules.wfg --entry layout_oracle -o build/layout_oracle_par
      # (WFC = $(WHITEFOOTC)$(if $(CACHE), --cache $(CACHE) --fragments function),
      # CACHE = build/whitefoot-cache). Here WHITEFOOTC is the compiler built
      # above, not the pinned release; --report is added to print the phases.
      - name: Cold builds, a warm rebuild and the front-end splits
        run: |
          set +e
          set -uo pipefail
          out="$RUNNER_TEMP/sg-cold-build"
          wfc="$GITHUB_WORKSPACE/compiler/target/gate/whitefootc"
          sg="$RUNNER_TEMP/snowghost"
          cache="$sg/build/whitefoot-cache"
          mkdir -p "$sg/build"
          build() {
            label=$1
            ( cd "$sg/renderer" && \
              perl "$GITHUB_WORKSPACE/.github/run-check.pl" "$label" \
                /usr/bin/time -f "TIME wall=%e user=%U sys=%S maxrss_kb=%M" \
                "$wfc" --cache "$cache" --fragments function --report \
                --par --graph modules.wfg --entry layout_oracle \
                -o "$sg/build/layout_oracle_par" ) > "$out/$label.log" 2>&1
            echo "$label exit $?" | tee -a "$out/status.txt"
            grep -E '^(== END|TIME|\{"build")' "$out/$label.log" || tail -n 20 "$out/$label.log"
            ls -l "$sg/build/layout_oracle_par" 2>&1 | tee -a "$out/$label.log" || true
          }
          for n in 1 2 3; do
            rm -rf "$cache" "$sg/build/layout_oracle_par"
            [ ! -e "$cache" ] && echo "cache empty before cold-$n"
            build "cold-$n"
          done
          # Warm: the cache of cold-3 kept, nothing changed.
          build "warm"

          # Front-end splits, each cold (no cache): parse, check and proof
          # checking alone, then the front end with code generation but no clang.
          rm -rf "$cache"
          ( cd "$sg/renderer" && \
            perl "$GITHUB_WORKSPACE/.github/run-check.pl" split-check-modules \
              /usr/bin/time -f "TIME wall=%e user=%U sys=%S maxrss_kb=%M" \
              "$wfc" --graph modules.wfg --check-modules ) > "$out/split-check-modules.log" 2>&1
          echo "split-check-modules exit $?" | tee -a "$out/status.txt"
          ( cd "$sg/renderer" && \
            perl "$GITHUB_WORKSPACE/.github/run-check.pl" split-emit-llvm \
              /usr/bin/time -f "TIME wall=%e user=%U sys=%S maxrss_kb=%M" \
              "$wfc" --par --graph modules.wfg --entry layout_oracle --emit-llvm \
              -o "$out/layout_oracle_par.ll" ) > "$out/split-emit-llvm.log" 2>&1
          echo "split-emit-llvm exit $?" | tee -a "$out/status.txt"
          grep -E '^(== END|TIME)' "$out"/split-*.log || tail -n 20 "$out"/split-*.log
          ls -l "$out/layout_oracle_par.ll" || true

      - name: Summarize
        if: always()
        run: |
          out="$RUNNER_TEMP/sg-cold-build"
          {
            echo "## sg-cold-build: Snowghost-wf --par layout_oracle on $(nproc) vCPU"
            cat "$out/machine.txt"
            echo
            echo "Phases from whitefootc --report, in seconds. front_end = parse + check + proofs + code generation to LLVM IR; compile = clang on the fragments; link = ThinLTO link (optimization, code generation, link)."
            echo
            echo "| run | wall | user | sys | front_end | split | compile | link | objects compiled/reused |"
            echo "|---|---|---|---|---|---|---|---|---|"
            for run in cold-1 cold-2 cold-3 warm; do
              log="$out/$run.log"
              [ -f "$log" ] || continue
              t=$(grep -E '^TIME' "$log" | tail -1)
              wall=$(sed -n 's/.*wall=\([0-9.]*\).*/\1/p' <<<"$t")
              user=$(sed -n 's/.*user=\([0-9.]*\).*/\1/p' <<<"$t")
              sys=$(sed -n 's/.*sys=\([0-9.]*\).*/\1/p' <<<"$t")
              json=$(grep -E '^\{"build"' "$log" | tail -1)
              f() { jq -r ".build.$1 / 1000" <<<"$json" 2>/dev/null || echo "-"; }
              echo "| $run | $wall | $user | $sys | $(f front_end_ms) | $(f split_ms) | $(f compile_ms) | $(f link_ms) | $(jq -r '"\(.build.objects_compiled)/\(.build.objects_reused)"' <<<"$json" 2>/dev/null) |"
            done
            echo
            echo "Front-end splits (cold, no cache):"
            echo
            echo '```'
            grep -H -E '^(TIME)' "$out"/split-*.log || true
            echo '```'
            echo
            echo "Not covered: the split is one process's wall clock. Parse, check, proofs and code generation are one front_end figure (the two split runs bound them: check-modules is check-only over every module, emit-llvm is front end plus code generation). compile and link overlap with other fragments' work inside clang/lld, so their parts (clang -O, ThinLTO optimization, code generation, linking) are not separated; the user/sys columns give total CPU."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sg-cold-build
          path: ${{ runner.temp }}/sg-cold-build
          if-no-files-found: warn

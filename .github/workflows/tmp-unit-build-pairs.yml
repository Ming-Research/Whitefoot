# Temporary (coord-wfbl-04-04): removed before the branch is ready.
#
# Question: which part of the merge of Whitefoot#444 lengthens the cold build
# of the unit group's test binary, `cargo test --profile gate --lib --no-run`?
#
# Earlier runs, three EPYC 7763 hosts each, cold builds rotated in one job,
# first round dropped, ratios to base (main before the merge, 154 s):
#   twin (second checkout of base)   1.012, 0.999, 1.002   noise
#   cand (the merge commit)          1.040, 1.039, 1.035   about +6 s
#   prod (merge commit without the PR's two test modules, the one edited
#         test restored)             1.004, 1.005, 1.006   no detected change
# so the difference is in the PR's tests, not its checker or diagnostics code.
#
# This run splits the tests, six builds per round, order rotated each round:
#   base  main before the merge
#   twin  a second checkout of base: its ratio to base is this run's noise
#   cand  the merge commit
#   sem   the merge commit without the driver test module
#   drv   the merge commit without the semantic test module, the edited
#         existing test restored
# Reading: the variant whose ratio to base is near cand's holds the cost.

name: tmp-unit-build-pairs

on:
  push:
    branches: [claude/diag-err2-build-time]

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0

jobs:
  pairs:
    name: pairs (host ${{ matrix.host }})
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        host: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install the host toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          rustup default stable
          cargo --version
          sudo sysctl -w kernel.core_pattern=core

      - name: Fetch locked compiler dependencies
        run: cargo fetch --locked --manifest-path compiler/Cargo.toml

      - name: Record the host
        run: |
          uname -a
          nproc
          grep -m 1 'model name' /proc/cpuinfo
          df -h .

      - name: Prepare the five trees
        run: |
          set -eu
          cand=d1f2a19d2ae599512b51a19ea622cd3377e34366
          base=$(git rev-parse "$cand^1")
          echo "cand=$cand base=$base"
          for v in base twin; do
            git worktree add --detach "$RUNNER_TEMP/$v" "$base"
          done
          for v in cand sem drv; do
            git worktree add --detach "$RUNNER_TEMP/$v" "$cand"
          done

          # sem: no driver test module.
          cd "$RUNNER_TEMP/sem"
          sed -i '/^mod match_sites;$/d' compiler/src/driver/diagnostic/tests.rs
          git rm -q -f compiler/src/driver/diagnostic/tests/match_sites.rs

          # drv: no semantic test module; the one edited existing test back.
          cd "$RUNNER_TEMP/drv"
          sed -i '/^mod match_sites;$/d' compiler/src/semantic/tests.rs
          git rm -q -f compiler/src/semantic/tests/match_sites.rs
          python3 -I - <<'PY'
          p = "compiler/src/semantic/tests.rs"
          s = open(p, encoding="utf-8").read()
          a = s.index("    match_sites::assert_sites(")
          b = s.index('    assert_rule(\n        b"struct Pair {', a)
          new = (
              "    assert_rule(\n"
              '        include_bytes!("../../../tests/conformance/cases/err2-neg-missing-variant.wf"),\n'
              "        SemanticRule::Err2,\n"
              "        SemanticIssueKind::NonExhaustiveMatch {\n"
              '            missing_variants: vec!["Blue".to_owned()],\n'
              "            other_sites: Vec::new(),\n"
              "        },\n"
              "    );\n"
          )
          open(p, "w", encoding="utf-8").write(s[:a] + new + s[b:])
          PY

          for v in sem drv; do
            echo "== $v"
            git -C "$RUNNER_TEMP/$v" status --short
          done

      - name: Interleaved cold builds
        run: |
          set -eu
          ulimit -c 0
          variants=(sem base drv cand twin)
          : > "$RUNNER_TEMP/walls.txt"
          for round in 1 2 3 4 5; do
            for k in 0 1 2 3 4; do
              v=${variants[$(( (k + round - 1) % 5 ))]}
              tree="$RUNNER_TEMP/$v"
              rm -rf "$tree/compiler/target"
              start=$(date +%s%N)
              if ! (cd "$tree/compiler" && cargo test --profile gate --lib --no-run --locked --offline) > "$RUNNER_TEMP/build-$v-$round.log" 2>&1; then
                tail -40 "$RUNNER_TEMP/build-$v-$round.log"
                exit 1
              fi
              end=$(date +%s%N)
              ms=$(( (end - start) / 1000000 ))
              echo "round $round $v ${ms} ms"
              echo "$round $v $ms" >> "$RUNNER_TEMP/walls.txt"
              rm -rf "$tree/compiler/target"
            done
          done

      - name: Summary
        if: always()
        run: |
          test -s "$RUNNER_TEMP/walls.txt" || exit 0
          python3 -I - "$RUNNER_TEMP/walls.txt" <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import sys, statistics
          rows = [l.split() for l in open(sys.argv[1]) if l.strip()]
          walls = {}
          for rnd, v, ms in rows:
              walls.setdefault(int(rnd), {})[v] = int(ms) / 1000.0
          names = ("base", "twin", "cand", "sem", "drv")
          print("### cold unit test build, seconds (host ${{ matrix.host }})")
          print()
          print("| round | " + " | ".join(names) + " |")
          print("|---" * (len(names) + 1) + "|")
          for rnd in sorted(walls):
              w = walls[rnd]
              print("| %d | %s |" % (rnd, " | ".join("%.1f" % w[v] if v in w else "-" for v in names)))
          print()
          for v in names[1:]:
              ratios = [walls[r][v] / walls[r]["base"] for r in sorted(walls)[1:] if v in walls[r] and "base" in walls[r]]
              if len(ratios) > 1:
                  print("%s/base, rounds 2 on: %s; mean %.3f" % (v, ", ".join("%.3f" % x for x in ratios), statistics.mean(ratios)))
          EOF

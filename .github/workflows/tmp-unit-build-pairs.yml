# Temporary (coord-wfbl-04-04): removed before the branch is ready.
#
# Question: does the merge of Whitefoot#444 lengthen the cold build of the
# unit group's test binary, `cargo test --profile gate --lib --no-run`?
# The gate's compiler/test-build-unit stage went 109 s (main before the merge,
# EPYC 9V45) to 127 s (the PR head on the same base, same CPU class), and
# 173 s (main on 10-14, EPYC 7763) to 194 s (main after the merge, EPYC 7763).
#
# Comparison: in one job on one host, five interleaved rounds of four cold
# builds with the build order rotated each round:
#   base  main before the merge (first parent of the merge commit)
#   twin  a second checkout of base: its ratio to base is this run's noise
#   cand  the merge commit
#   prod  the merge commit without the PR's two test modules and with the
#         PR's edit to the one existing test restored: the PR's production
#         code alone
# Result that rejects "the PR lengthens the build": the cand/base ratios of
# all rounds lie within the spread of the twin/base ratios.
#
# First run (three hosts, six rounds, base/twin/cand): twin/base stayed within
# 1% of 1 after the first round, cand/base 1.003 to 1.053 on every later
# round of the two hosts that finished their logs (EPYC 9V74, EPYC 7763).
# This run attributes that difference: prod/base near cand/base puts it in
# the production code, near 1 in the tests.

name: tmp-unit-build-pairs

on:
  push:
    branches: [claude/diag-err2-build-time]

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0

jobs:
  pairs:
    name: pairs (host ${{ matrix.host }})
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        host: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install the host toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          rustup default stable
          cargo --version
          sudo sysctl -w kernel.core_pattern=core

      - name: Fetch locked compiler dependencies
        run: cargo fetch --locked --manifest-path compiler/Cargo.toml

      - name: Record the host
        run: |
          uname -a
          nproc
          grep -m 1 'model name' /proc/cpuinfo
          df -h .

      - name: Prepare the four trees
        run: |
          cand=d1f2a19d2ae599512b51a19ea622cd3377e34366
          git cat-file -p "$cand" | sed -n '1,4p'
          base=$(git rev-parse "$cand^1")
          echo "cand=$cand base=$base"
          git log --oneline -1 "$cand"
          git log --oneline -1 "$base"
          for v in base twin; do
            git worktree add --detach "$RUNNER_TEMP/$v" "$base"
          done
          for v in cand prod; do
            git worktree add --detach "$RUNNER_TEMP/$v" "$cand"
          done
          cd "$RUNNER_TEMP/prod"
          sed -i '/^mod match_sites;$/d' compiler/src/semantic/tests.rs compiler/src/driver/diagnostic/tests.rs
          git rm -q -f compiler/src/semantic/tests/match_sites.rs compiler/src/driver/diagnostic/tests/match_sites.rs
          python3 -I - <<'PY'
          p = "compiler/src/semantic/tests.rs"
          s = open(p, encoding="utf-8").read()
          a = s.index("    match_sites::assert_sites(")
          b = s.index('    assert_rule(\n        b"struct Pair {', a)
          new = (
              "    assert_rule(\n"
              '        include_bytes!("../../../tests/conformance/cases/err2-neg-missing-variant.wf"),\n'
              "        SemanticRule::Err2,\n"
              "        SemanticIssueKind::NonExhaustiveMatch {\n"
              '            missing_variants: vec!["Blue".to_owned()],\n'
              "            other_sites: Vec::new(),\n"
              "        },\n"
              "    );\n"
          )
          open(p, "w", encoding="utf-8").write(s[:a] + new + s[b:])
          PY
          git status --short
          git diff --stat HEAD | tail -3

      - name: Interleaved cold builds
        run: |
          set -eu
          ulimit -c 0
          variants=(prod base cand twin)
          : > "$RUNNER_TEMP/walls.txt"
          for round in 1 2 3 4 5; do
            for k in 0 1 2 3; do
              v=${variants[$(( (k + round - 1) % 4 ))]}
              tree="$RUNNER_TEMP/$v"
              rm -rf "$tree/compiler/target"
              start=$(date +%s%N)
              if ! (cd "$tree/compiler" && cargo test --profile gate --lib --no-run --locked --offline) > "$RUNNER_TEMP/build-$v-$round.log" 2>&1; then
                tail -40 "$RUNNER_TEMP/build-$v-$round.log"
                exit 1
              fi
              end=$(date +%s%N)
              ms=$(( (end - start) / 1000000 ))
              echo "round $round $v ${ms} ms"
              echo "$round $v $ms" >> "$RUNNER_TEMP/walls.txt"
              rm -rf "$tree/compiler/target"
            done
          done

      - name: Summary
        if: always()
        run: |
          test -s "$RUNNER_TEMP/walls.txt" || exit 0
          python3 -I - "$RUNNER_TEMP/walls.txt" <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import sys, statistics
          rows = [l.split() for l in open(sys.argv[1]) if l.strip()]
          walls = {}
          for rnd, v, ms in rows:
              walls.setdefault(int(rnd), {})[v] = int(ms) / 1000.0
          print("### cold unit test build, seconds (host ${{ matrix.host }})")
          print()
          print("| round | base | twin | cand | prod |")
          print("|---|---|---|---|---|")
          for rnd in sorted(walls):
              w = walls[rnd]
              print("| %d | %s |" % (rnd, " | ".join("%.1f" % w[v] if v in w else "-" for v in ("base", "twin", "cand", "prod"))))
          print()
          t95 = {1: 12.706, 2: 4.303, 3: 3.182, 4: 2.776, 5: 2.571, 6: 2.447}
          for v in ("twin", "cand", "prod"):
              ratios = [walls[r][v] / walls[r]["base"] for r in sorted(walls) if v in walls[r] and "base" in walls[r]]
              if len(ratios) > 1:
                  mean = statistics.mean(ratios)
                  half = t95.get(len(ratios) - 1, 2.0) * statistics.stdev(ratios) / len(ratios) ** 0.5
                  print("%s/base per round: %s; mean %.3f, 95%% interval %.3f to %.3f" % (v, ", ".join("%.3f" % x for x in ratios), mean, mean - half, mean + half))
          EOF

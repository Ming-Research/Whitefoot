# Temporary: the focused checks of the sealed type invariant work (the
# compiler build and lint, the type-invariant, fact-source and repair unit
# tests, every conformance case's verdict with each failing case listed),
# this round's cases checked with the compilers they fail on, and the trial
# compile of the downstream programs with the branch's compiler and the
# base's. Removed before the branch is ready.
name: tmp-sealed-invariants

on:
  push:
    branches: [claude/invariant-sealed-values]

permissions:
  contents: read

jobs:
  sealed:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install the host toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          rustup default stable
          cargo --version
          cargo fetch --locked --manifest-path compiler/Cargo.toml
      - name: Build the compiler
        run: |
          perl .github/run-check.pl sealed-build cargo build --manifest-path compiler/Cargo.toml \
            --profile gate --locked --offline --bin whitefootc
      - name: Lint the compiler as the gate does
        if: always()
        run: |
          rustup component add clippy
          perl .github/run-check.pl sealed-lint cargo clippy --manifest-path compiler/Cargo.toml \
            --all-targets --locked --offline -- -D warnings
      - name: Run the type-invariant, fact-source and repair unit tests
        run: |
          perl .github/run-check.pl sealed-unit cargo test --manifest-path compiler/Cargo.toml \
            --profile gate --locked --offline --lib -- \
            type_invariant entailment_sources sealing invariant_payload pinned_repairs
      - name: Reach every conformance verdict and list each failing case
        if: always()
        run: |
          set +e
          perl .github/run-check.pl sealed-corpus cargo test --manifest-path compiler/Cargo.toml \
            --profile gate --locked --offline --test corpus -- \
            conformance::adapter::the_corpus_reaches_its_declared_verdict_through_the_ordinary_compiler_path \
            --nocapture > "$RUNNER_TEMP/corpus.log" 2>&1
          status=$?
          set -e
          grep -E '^  Fail ' "$RUNNER_TEMP/corpus.log" || true
          grep -E 'conformance adapter: Pass=' "$RUNNER_TEMP/corpus.log" || tail -60 "$RUNNER_TEMP/corpus.log"
          exit "$status"
  # This round's cases with the compilers they fail on: the head the first
  # review saw, and the merge of main before field-valued offsets widened
  # debts. A case that does not end within two minutes is stopped.
  before:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: reviewed-head
            commit: f997714d31528e0f8e2c98b510d1e39de8ebe861
            # The other cases of this round ran with it in run 39568749252.
            cases: >-
              type11-neg-segment-element-write-keeps-debt
          # The pushed head with the widening row for written offsets
          # [TYPE-11.S3] switched off, which the negative case must need.
          - label: head-without-offset-widening
            commit: head
            cases: >-
              type11-neg-field-offset-moved-before-restored
              type11-pos-field-offset-restored-before-moved
    steps:
      - uses: actions/checkout@v4
      - name: Install the host toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          rustup default stable
      - name: Build the compiler of ${{ matrix.label }}
        run: |
          if [ "${{ matrix.commit }}" = head ]; then
            git worktree add "$RUNNER_TEMP/before" HEAD
            perl -0777 -pi -e 's/(self\.seal_offset_kills\(separations, states, events\);)/if false { $1 }/ or die "the widening call is gone\n"' \
              "$RUNNER_TEMP/before/compiler/src/semantic/entailment/flow/events.rs"
            git -C "$RUNNER_TEMP/before" diff --stat
          else
            git fetch --depth=1 origin ${{ matrix.commit }}
            git worktree add "$RUNNER_TEMP/before" FETCH_HEAD
          fi
          cargo fetch --locked --manifest-path "$RUNNER_TEMP/before/compiler/Cargo.toml"
          perl .github/run-check.pl before-build cargo build \
            --manifest-path "$RUNNER_TEMP/before/compiler/Cargo.toml" \
            --profile gate --locked --offline --bin whitefootc
      - name: Check this round's cases with it
        env:
          WHITEFOOT_CHECK_TIMEOUT: "120"
        run: |
          set +e
          for case in ${{ matrix.cases }}; do
            echo "== $case"
            perl .github/run-check.pl before-check "$RUNNER_TEMP/before/compiler/target/gate/whitefootc" \
              --check "tests/conformance/cases/$case.wf"
            echo "exit $?"
          done
  # The trial compile: each module of the downstream programs checked with
  # the branch's compiler and the base's, one module at a time so that one
  # rejection hides no other, then Firn's entry composed, which also judges
  # the standard library modules it selects. Both verdicts and both lists of
  # errors are compared, since a module the base already rejects can hide a
  # new rejection behind the old one. The programs predate the base's
  # reserved words `held`, `not` and `unchanged` and its prelude variant
  # `Open`, so their copies rename each before either compiler reads them.
  trial:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install the host toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          rustup default stable
          cargo fetch --locked --manifest-path compiler/Cargo.toml
      - name: Build the branch's compiler and the base's
        run: |
          perl .github/run-check.pl trial-build cargo build --manifest-path compiler/Cargo.toml \
            --profile gate --locked --offline --bin whitefootc
          git fetch --depth=1 origin 48b990f05ba32c2763dfcc441a94a00e2ee03cbd
          git worktree add "$RUNNER_TEMP/base" FETCH_HEAD
          cargo fetch --locked --manifest-path "$RUNNER_TEMP/base/compiler/Cargo.toml"
          perl .github/run-check.pl trial-base-build cargo build \
            --manifest-path "$RUNNER_TEMP/base/compiler/Cargo.toml" \
            --profile gate --locked --offline --bin whitefootc
      - name: Check each downstream module with both compilers
        env:
          WHITEFOOT_CHECK_TIMEOUT: "900"
        run: |
          set +e
          work="$RUNNER_TEMP/trial"
          mkdir -p "$work/logs"
          for repo in Firn-wf Halo-wf Snowghost-wf; do
            git clone --quiet --depth=1 --recurse-submodules \
              "https://github.com/Ming-Research/$repo" "$work/$repo"
            git -C "$work/$repo" log -1 --format="$repo %H"
          done
          # Names only: a string literal keeps its text, whose length a
          # fixed-size text constant states.
          find "$work" -type f \( -name '*.wf' -o -name '*.wfm' \) -print0 | xargs -0 perl -pi -e \
            'BEGIN { %r = (held => "trial_held", not => "trial_not", unchanged => "trial_unchanged", Open => "TrialOpen") }
             s{("(?:[^"\\]|\\.)*")|\b(held|not|unchanged|Open)\b}{defined $1 ? $1 : $r{$2}}ge'
          same_accepted=0
          same_rejected=0
          differ=0
          errors_differ=0
          branch="$PWD/compiler/target/gate/whitefootc"
          base="$RUNNER_TEMP/base/compiler/target/gate/whitefootc"
          # One judgment with both compilers, run in the given directory; a
          # verdict that differs prints both outputs, a shared rejection the
          # first lines of each.
          judge() {
            label="$1"
            dir="$2"
            shift 2
            for compiler in branch base; do
              bin="$branch"
              [ "$compiler" = base ] && bin="$base"
              (cd "$dir" && perl "$GITHUB_WORKSPACE/.github/run-check.pl" "trial-$compiler" \
                "$bin" "$@") > "$work/logs/$label.$compiler" 2>&1
              echo $? > "$work/logs/$label.$compiler.exit"
            done
            mine=$(cat "$work/logs/$label.branch.exit")
            theirs=$(cat "$work/logs/$label.base.exit")
            for compiler in branch base; do
              grep -E '^[^ ]+:[0-9]+:[0-9]+: error\[' "$work/logs/$label.$compiler" | sort \
                > "$work/logs/$label.$compiler.errors"
            done
            if ! cmp -s "$work/logs/$label.branch.errors" "$work/logs/$label.base.errors"; then
              errors_differ=$((errors_differ + 1))
              echo "---- $label errors only the branch reports:"
              comm -23 "$work/logs/$label.branch.errors" "$work/logs/$label.base.errors"
              echo "---- $label errors only the base reports:"
              comm -13 "$work/logs/$label.branch.errors" "$work/logs/$label.base.errors"
            fi
            seconds=$(sed -n 's/^== END [^:]*: \([0-9.]*\) s.*/\1/p' "$work/logs/$label.branch" | tr '\n' ' ')
            printf '%-50s branch %s base %s (%s s)\n' "$label" "$mine" "$theirs" "$seconds"
            quiet='^== (START|RUNNING|BUDGET)'
            if [ "$mine" != "$theirs" ]; then
              differ=$((differ + 1))
              echo "---- $label differs: branch"
              grep -v -E "$quiet" "$work/logs/$label.branch" | head -80
              echo "---- $label differs: base"
              grep -v -E "$quiet" "$work/logs/$label.base" | head -30
            elif [ "$mine" != 0 ]; then
              same_rejected=$((same_rejected + 1))
              echo "---- $label rejected by both: branch"
              grep -v -E "$quiet" "$work/logs/$label.branch" | head -12
              echo "---- $label rejected by both: base"
              grep -v -E "$quiet" "$work/logs/$label.base" | head -12
            else
              same_accepted=$((same_accepted + 1))
            fi
          }
          graph() {
            name="$1"
            dir="$2"
            for module in $(sed -n 's/^\(pkg[a-z_:]*\):.*/\1/p' "$dir/modules.wfg"); do
              judge "$name $module" "$dir" --graph modules.wfg --check-module "$module"
            done
          }
          graph snowghost "$work/Snowghost-wf/renderer"
          for lib in msgpack json halo; do
            graph "halo-$lib" "$work/Halo-wf/lib/$lib"
          done
          graph firn "$work/Firn-wf/firn"
          judge "firn composed" "$work/Firn-wf/firn" --graph modules.wfg --check-modules
          echo "accepted by both $same_accepted, rejected by both $same_rejected, verdicts that differ $differ, error lists that differ $errors_differ"
          cat "$work"/logs/*.branch.errors | sed 's/.*error\[\([^]]*\)\].*/\1/' | sort | uniq -c | sed 's/^/branch errors by rule: /'
          cat "$work"/logs/*.base.errors | sed 's/.*error\[\([^]]*\)\].*/\1/' | sort | uniq -c | sed 's/^/base errors by rule: /'

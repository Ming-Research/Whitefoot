# Accepted programs under host sanitizers (compiler/sanitized-builds): every
# program the corpus target builds and every running conformance case, each
# case also built with the `--par` lowering, compiled with the emitted code and
# the C runtime instrumented by AddressSanitizer with UndefinedBehaviorSanitizer
# and by ThreadSanitizer. An accepted program has no memory error, undefined
# behavior or data race, so any report is a soundness defect of the checker,
# the compiler or the runtime, and fails its job whatever the case's own
# verdict (compiler/Makefile, test-corpus-asan and test-corpus-tsan).
#
# The conformance walk is one sequential test, so each sanitizer splits it
# into three shards beside a job for the rest of the corpus target.
#
# These checks run on the revisions gate.yml checks, decided the same way by
# .github/gate-scope.sh: a push to main, a push to a branch with an open ready
# pull request, the opening or reopening of a ready pull request, the event of
# marking one ready, which skips when its head already has a successful manual
# run of this workflow, and a manual run. Any other push, a draft pull
# request's included, ends after the first job with every check skipped; the
# author starts this workflow by hand once, after the review has passed
# (AGENTS.md, "Checks"). They also run every night on main's head.
#
# A revision on main is checked whole: a push to main, the nightly run and a
# manual run on main. Of any other revision the checks run only where its
# change from its merge base with main touches a path these jobs read, as
# .github/change-scope.sh decides (AGENTS.md, "Branch and main boundary",
# item 4). The first job reads both deciding scripts from this workflow's own
# revision, so that in a run the engine asked for main's copy judges the
# commit's change. The job named for the decision says it, whether the checks
# run or not, so that a run that checks nothing passes with its reason.
#
# The wf-agents engine runs this workflow as one of its full workflows
# (`ci.full` of wf-agents.toml), by hand on main's file, giving the commit to
# merge (`commit`) and a value only its request knows (`call`), which the
# run's name holds. Such a run checks out that commit, has a concurrency group
# of its own that no other run cancels, and ends with the job `Test results`,
# which says how each other job ended as JUnit XML (.github/junit.py) in the
# artifact `test-results`, which the engine reads. These jobs report no test
# of their own: a test that fails under a sanitizer need not fail when the
# engine runs it again by name without one. Every other run skips that job.
name: sanitizers

run-name: ${{ inputs.call && format('sanitizers {0}', inputs.call) || '' }}

on:
  push:
  pull_request:
    types: [opened, reopened, ready_for_review]
  # Every night, on main's head, whole.
  schedule:
    - cron: '23 10 * * *'
  workflow_dispatch:
    inputs:
      commit:
        description: The commit to check, for the wf-agents engine; empty for the branch the run is asked on
        required: false
        default: ''
      call:
        description: A value only the engine's request knows, which the run's name holds; empty otherwise
        required: false
        default: ''

permissions:
  actions: read
  contents: read
  pull-requests: read

# As in io-hosts.yml: pushes to one branch share a group, and the opening or
# reopening of a pull request, the event of marking one ready, a manual run
# and the nightly run each have a group of their own. Each main commit gets
# its own group, as in gate.yml: a shared main group would cancel the run of
# every merge but the last of a quick succession, and the cancelled commit
# would show red on the main line. A run the engine asked for has a group of
# its own, named by its `call`, and is never cancelled: the engine waits for
# it.
concurrency:
  group: sanitizers-${{ inputs.call && format('call-{0}-', inputs.call) || '' }}${{ github.event.action == 'ready_for_review' && 'ready-' || github.event_name == 'pull_request' && 'opened-' || github.event_name == 'workflow_dispatch' && 'manual-' || github.event_name == 'schedule' && 'nightly-' || '' }}${{ github.head_ref && format('refs/heads/{0}', github.head_ref) || github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ !inputs.call }}

env:
  CARGO_TERM_COLOR: never
  # A fresh checkout gains nothing from incremental state (compiler/Cargo.toml).
  CARGO_INCREMENTAL: 0

jobs:
  scope:
    name: Choose whether to check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.scope.outputs.run }}
      needed: ${{ steps.scope.outputs.needed }}
      why: ${{ steps.scope.outputs.why }}
    steps:
      # The deciding scripts, from this workflow's own revision.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
          persist-credentials: false
      # The revision checked, with the history of every branch, for its change
      # from main.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.event.pull_request.head.sha || github.sha }}
          path: checked
          fetch-depth: 0
          sparse-checkout: .github
          persist-credentials: false
      # A failed query or a failed decision fails the run rather than quietly
      # skipping the checks.
      - name: Choose whether to check
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scope=$(sh .github/gate-scope.sh)
          echo "$scope"
          echo "$scope" >> "$GITHUB_OUTPUT"
          echo "$scope" | sed -n 's/^reason=/sanitizers: /p' >> "$GITHUB_STEP_SUMMARY"
          if [ "$(echo "$scope" | sed -n 's/^run=//p')" = true ]; then
            needed=$(cd checked && sh ../.github/change-scope.sh sanitizers)
            echo "$needed"
            echo "$needed" >> "$GITHUB_OUTPUT"
            echo "$needed" | sed -n 's/^why=/sanitizers: /p' >> "$GITHUB_STEP_SUMMARY"
          fi

  # The decision of .github/change-scope.sh as this job's name, which the
  # engine reads beside each job's result.
  reason:
    name: ${{ needs.scope.outputs.why }}
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Say what the change asks of this workflow
        env:
          WHY: ${{ needs.scope.outputs.why }}
        run: echo "$WHY"

  sanitized:
    name: ${{ matrix.sanitizer }} ${{ matrix.part }}
    needs: scope
    if: needs.scope.outputs.run == 'true' && needs.scope.outputs.needed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [asan, tsan]
        part: [conformance 1/3, conformance 2/3, conformance 3/3, programs]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.event.pull_request.head.sha || github.sha }}

      - name: Set the scratch root
        run: |
          echo "WHITEFOOT_SCRATCH_ROOT=$RUNNER_TEMP/whitefoot" >> "$GITHUB_ENV"
          echo "WHITEFOOT_TIME_BUDGET_RECORD=$RUNNER_TEMP/time-budget-overruns.txt" >> "$GITHUB_ENV"

      # The LLVM major the gate pins, as /usr/bin/clang and ld.lld, with its
      # sanitizer runtimes, which the apt.llvm.org installer leaves out.
      - name: Install the host toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo apt-get install -y --no-install-recommends "libclang-rt-$version-dev"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          /usr/bin/clang --version
          rustup default stable
          cargo --version
          nproc
          grep -m 1 'model name' /proc/cpuinfo

      - name: Fetch locked compiler dependencies
        run: cargo fetch --locked --manifest-path compiler/Cargo.toml

      # As in gate.yml: cases that prove programs die must not each wait for
      # systemd-coredump.
      - name: Decline core dumps
        run: |
          sudo sysctl -w kernel.core_pattern=core
          cat /proc/sys/kernel/core_pattern

      - name: Sanitized corpus
        env:
          PART: ${{ matrix.part }}
          WHITEFOOT_CHECK_TIMEOUT: 1500
        run: |
          case "$PART" in
            conformance\ *)
              export WHITEFOOT_CONFORMANCE_SHARD="${PART#conformance }"
              filter=the_corpus_reaches_its_declared_verdict
              stage=conformance
              ;;
            programs)
              filter="--skip the_corpus_reaches_its_declared_verdict"
              stage=programs
              ;;
          esac
          make -C compiler test-corpus-${{ matrix.sanitizer }} \
            SANITIZER_FILTER="$filter" SANITIZER_STAGE="$stage"

      # run-check.pl appended every stage over its budget in
      # .github/time-budgets.txt, or without one, to this record; the stages
      # themselves kept their own statuses.
      - name: Hold every stage to its time budget
        if: always()
        run: perl .github/run-check.pl --budget-verdict "$WHITEFOOT_TIME_BUDGET_RECORD"

  # Only in a run the engine asked for: how each other job ended, as JUnit XML
  # in the artifact `test-results`, which the engine reads (.github/junit.py).
  results:
    name: Test results
    needs: [scope, reason, sanitized]
    if: ${{ !cancelled() && inputs.call }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          sparse-checkout: .github
          persist-credentials: false
      - name: Name the results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 -B .github/junit.py needs --out "$RUNNER_TEMP/junit/Test results.xml"
      - uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ runner.temp }}/junit

# Temporary (compare-perf-wall-time): the self-tests of the compiler-compare
# instruments, which no gate runs, on a hosted Linux runner: the reducers, the
# usage capture of `launch` on stand-in images, and the perf and reduce stages
# end to end on a stand-in `perf`. Removed before the full check.
name: tmp-compare-perf-wall-time

on:
  push:
    branches: [compare-perf-wall-time]

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Self-test the compiler-compare instruments
        env:
          OUT: ${{ runner.temp }}/out
        run: perl .github/run-check.pl compare-selftest bash research/experiments/compiler-compare/run.sh selftest

# Temporary (work 285): the identical-image evidence for tests/performance, on
# the revision itself. Removed before the full check.
name: tmp-performance-identity
on:
  push:
    branches: ['work-285-**']
    paths:
      - tests/performance/**
      - .github/workflows/tmp-performance-identity.yml
defaults:
  run:
    shell: bash
env:
  CARGO_INCREMENTAL: 0
  CARGO_BUILD_JOBS: 2
jobs:
  identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build the compiler
        run: |
          rustup default stable
          perl .github/run-check.pl identity-compiler cargo build --manifest-path compiler/Cargo.toml --locked --profile gate --bin whitefootc
          lscpu | grep -E '^Model name'
      # The same commit's sources under two checkout paths, built the way the
      # baseline arm is (ROOT, WFC and FIXTURES of the other checkout).
      - name: Build both arms of one commit under two paths
        run: |
          git worktree add --detach "$RUNNER_TEMP/second" HEAD
          wfc="$PWD/compiler/target/gate/whitefootc"
          make -s -j2 -C tests/performance build BUILD="$RUNNER_TEMP/arm-a" WFC="$wfc"
          make -s -j2 -C tests/performance build BUILD="$RUNNER_TEMP/arm-b" WFC="$wfc" \
            ROOT="$RUNNER_TEMP/second" FIXTURES="$RUNNER_TEMP/second/tests/programs/compute"
          # Without the prefix map the same two builds must differ (the fault of run 38389055091).
          make -s -j2 -C tests/performance build BUILD="$RUNNER_TEMP/arm-c" WFC="$wfc" PATH_MAPS=
          make -s -j2 -C tests/performance build BUILD="$RUNNER_TEMP/arm-d" WFC="$wfc" PATH_MAPS= \
            ROOT="$RUNNER_TEMP/second" FIXTURES="$RUNNER_TEMP/second/tests/programs/compute"
      - name: The executables of one commit are identical under two paths, and differ without the prefix map
        run: |
          kernels=$(sed -n 's/^KERNELS := //p' tests/performance/Makefile)
          for k in $kernels; do
            cmp "$RUNNER_TEMP/arm-a/$k" "$RUNNER_TEMP/arm-b/$k" || { echo "::error::$k differs under two paths with the prefix map"; exit 1; }
            if cmp -s "$RUNNER_TEMP/arm-c/$k" "$RUNNER_TEMP/arm-d/$k"; then echo "::error::$k is identical without the prefix map; the control cannot fail"; exit 1; fi
          done
          echo "five executables identical with the map, different without it"
      # One kernel's image replaced by one that differs (96 bytes of code ahead
      # of its module): judge.sh must list the other four as identical and time
      # only that one, here with a stub measuring command.
      - name: Only the changed kernel is timed
        run: |
          make -s -j2 -C tests/performance build BUILD="$RUNNER_TEMP/arm-pad" WFC="$PWD/compiler/target/gate/whitefootc" PLACEMENT_PAD=96
          cp -r "$RUNNER_TEMP/arm-b" "$RUNNER_TEMP/arm-changed"
          cp "$RUNNER_TEMP/arm-pad/stencil" "$RUNNER_TEMP/arm-changed/stencil"
          cat > "$RUNNER_TEMP/stub.sh" <<'STUB'
          #!/bin/bash
          # A quiet table for each kernel asked for, recording the request.
          echo "KERNELS=$KERNELS $1 $2" >> "$WF_STUB_LOG"
          mkdir -p "$3"
          for k in $KERNELS; do for w in 1 2 4; do printf '%s\t%s\t1.0\t2\t5\t1.0\n' "$k" "$w"; done; done > "$3/paired.tsv"
          STUB
          chmod +x "$RUNNER_TEMP/stub.sh"
          : > "$RUNNER_TEMP/stub.log"
          WF_STUB_LOG="$RUNNER_TEMP/stub.log" WF_PERF_MEASURE="$RUNNER_TEMP/stub.sh" WF_PERF_CPUS=4 \
            bash tests/performance/judge.sh "$RUNNER_TEMP/arm-a" "$RUNNER_TEMP/arm-changed" "$RUNNER_TEMP/judged"
          cat "$RUNNER_TEMP/judged/identical.txt"
          test "$(sort "$RUNNER_TEMP/judged/identical.txt" | tr '\n' ' ')" = 'fir mandelbrot quadrature records ' || { echo '::error::the identical kernels are not the four unchanged'; exit 1; }
          test "$(grep -c . "$RUNNER_TEMP/stub.log")" = 2
          grep -q '^KERNELS=stencil ' "$RUNNER_TEMP/stub.log"
      # The workflow step's own status mapping over a judgment that stays
      # indeterminate in both rounds: the step passes, with the warning.
      - name: An inconclusive judgment passes the step with a warning
        run: |
          cat > "$RUNNER_TEMP/stub3.sh" <<'STUB'
          #!/bin/bash
          mkdir -p "$3"
          for k in $KERNELS; do for w in 1 2 4; do
            if [ "$1" = "$2" ]; then r=1.0; [ "$w" = 4 ] && r=0.95   # the null control reads at the threshold
            else r=0.94; [ "$w" = 4 ] && r=1.0; fi                  # the comparison is adverse at widths 1 and 2
            printf '%s\t%s\t%s\t4\t5\t1.0\n' "$k" "$w" "$r"
          done; done > "$3/paired.tsv"
          STUB
          status=0
          WF_PERF_MEASURE="bash $RUNNER_TEMP/stub3.sh" WF_PERF_CPUS=4 \
            bash tests/performance/judge.sh "$RUNNER_TEMP/arm-a" "$RUNNER_TEMP/arm-changed" "$RUNNER_TEMP/inconclusive" 2>&1 | tee "$RUNNER_TEMP/inconclusive.log" || status=${PIPESTATUS[0]}
          echo "judge status $status"
          grep -q '::warning::INCONCLUSIVE: stencil' "$RUNNER_TEMP/inconclusive.log"
          # The step snippet of compute-regression.yml, verbatim in its condition.
          if [ "$status" -ne 0 ] && [ "$status" -ne 3 ]; then exit "$status"; fi
          test "$status" -eq 3

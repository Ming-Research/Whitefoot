# Temporary claude/guard-fairness research workflow; remove before ready.
# Counters explain costs but judge nothing; uninstrumented paired arms apply
# the criteria registered in research/investigations/guard-fairness/DESIGN.md.
name: tmp-guard-fairness
on:
  workflow_dispatch:
    inputs:
      path_diagnostics:
        description: Interleave separate path counters and sampled return waits with timing
        type: boolean
        default: false
  push:
    branches: [claude/guard-fairness]
    paths: [.github/workflows/tmp-guard-fairness.yml]
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install host sanitizer toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-rt-18-dev
      - name: Build compiler and validate measurement decisions
        run: |
          cargo fetch --locked --manifest-path compiler/Cargo.toml
          make -C compiler build
          python3 research/experiments/guard-fairness/summarize.py self-test
          python3 research/experiments/guard-fairness/tag-acquire.py self-test
          mkdir -p "$RUNNER_TEMP/wfc"
          cp compiler/target/gate/whitefootc "$RUNNER_TEMP/wfc/"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/wfc.tar.gz" wfc
      - uses: actions/upload-artifact@v4
        with:
          name: wfc
          path: ${{ runner.temp }}/wfc.tar.gz
      - name: Guard test sensitivity controls
        run: |
          ulimit -c 0
          flags='-std=c11 -O2 -g -Wall -Wextra -Werror -Wpedantic -pthread -DWF_GUARD_TEST_HOOKS=1'
          for variant in candidate baseline age threshold-zero; do
            scratch="$RUNNER_TEMP/guard-control-$variant"
            case "$variant" in
              candidate) defines='-DWF_GUARD_MODE=2' ;;
              baseline) defines='-DWF_GUARD_MODE=0' ;;
              age) defines='-DWF_GUARD_MODE=1' ;;
              threshold-zero) defines='-DWF_GUARD_MODE=2 -DWF_GUARD_TURN_AGE_NS=0' ;;
            esac
            make -C compiler "$scratch/shared-object-test" COMPLETION_TMP="$scratch" \
              COMPLETION_BASE_CFLAGS="$flags $defines"
          done
          for selection in handoff newcomer age cancel cross-unit; do
            SHARED_OBJECT_TEST_CASE="$selection" "$RUNNER_TEMP/guard-control-candidate/shared-object-test"
          done
          scratch="$RUNNER_TEMP/guard-control-candidate"
          make -C compiler "$scratch/cancel-test" COMPLETION_TMP="$scratch" \
            COMPLETION_BASE_CFLAGS="$flags -DWF_GUARD_MODE=2"
          CANCEL_TEST_CASE=ordered "$scratch/cancel-test"
          for variant in baseline age threshold-zero; do
            case "$variant" in
              baseline) selection=newcomer; expected='R overtook a woken guard' ;;
              age) selection=handoff; expected='an aged write did not wake only the oldest guard' ;;
              threshold-zero) selection=age; expected='a young, boundary, or fresh-statement watch blocked R' ;;
            esac
            record="$RUNNER_TEMP/guard-control-$variant/negative.txt"
            if SHARED_OBJECT_TEST_CASE="$selection" "$RUNNER_TEMP/guard-control-$variant/shared-object-test" > "$record" 2>&1; then
              cat "$record"
              printf 'negative control unexpectedly passed: %s\n' "$variant" >&2
              exit 1
            fi
            cat "$record"
            # Failure must be the intended assertion, not a signal, timeout
            # or unrelated earlier failure. The child's status was read above.
            grep -F -- "$expected" "$record"
          done
      - name: False-pass and cancellation cleanup sensitivity
        run: |
          ulimit -c 0
          bridge=compiler/src/backend/completion/bridge.c
          backup="$RUNNER_TEMP/guard-release-original.c"
          cp "$bridge" "$backup"
          # A failed construction also restores checkout source. Mutants
          # exist only in scratch executables, never in the compiler artifact.
          trap 'cp "$backup" "$bridge"' EXIT
          flags='-std=c11 -O2 -g -Wall -Wextra -Werror -Wpedantic -pthread -DWF_GUARD_MODE=2 -DWF_GUARD_TEST_HOOKS=1'
          for variant in no-false-pass no-success-clear; do
            python3 - "$bridge" "$backup" "$variant" <<'PY'
          import sys
          from pathlib import Path
          bridge, backup, variant = sys.argv[1:]
          text = Path(backup).read_text()
          signature = "static unsigned wf_guard_release_locked("
          assert text.count(signature) == 1, "release helper must be unique"
          start = text.index(signature)
          end = text.index("\n}\n#endif", start) + len("\n}")
          region = text[start:end]
          if variant == "no-false-pass":
              old = "wf_watch *next = wf_guard_oldest(shared->watching, self, self->guard_cutoff);"
              new = "wf_watch *next = NULL;"
          elif variant == "no-success-clear":
              old = "if (shared->reservation == NULL || shared->reservation != self) return 0u;"
              new = old + "\n    if (wrote && !wf_watch_quiet()) return 0u;"
          else:
              raise ValueError("unknown release mutant")
          assert region.count(old) == 1, "mutation anchor changed"
          changed = region.replace(old, new, 1)
          Path(bridge).write_text(text[:start] + changed + text[end:])
          PY
            scratch="$RUNNER_TEMP/guard-control-$variant"
            make -C compiler "$scratch/shared-object-test" COMPLETION_TMP="$scratch" \
              COMPLETION_BASE_CFLAGS="$flags"
            cp "$backup" "$bridge"
            case "$variant" in
              no-false-pass) selection=handoff; expected='a false guard did not pass its reservation' ;;
              no-success-clear) selection=cancel; expected='a context finished with a shared hold or a guard turn' ;;
            esac
            record="$scratch/negative.txt"
            if SHARED_OBJECT_TEST_CASE="$selection" "$scratch/shared-object-test" > "$record" 2>&1; then
              cat "$record"
              printf 'release mutant unexpectedly passed: %s\n' "$variant" >&2
              exit 1
            fi
            cat "$record"
            grep -F -- "$expected" "$record"
          done
          cmp "$backup" "$bridge"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guard-fairness-negative-controls
          path: ${{ runner.temp }}/guard-control-*/negative.txt
      - name: Guard handoff ThreadSanitizer checks
        run: |
          scratch="$RUNNER_TEMP/guard-control-tsan"
          make -C compiler "$scratch/shared-object-test" "$scratch/cancel-test" COMPLETION_TMP="$scratch" CC=/usr/bin/clang \
            COMPLETION_BASE_CFLAGS='-std=c11 -O1 -g -Wall -Wextra -Werror -Wpedantic -pthread -DWF_GUARD_MODE=2 -DWF_GUARD_COUNTERS=1 -DWF_GUARD_TEST_HOOKS=1 -fsanitize=thread -fno-omit-frame-pointer'
          for selection in handoff newcomer age cancel cross-unit; do
            TSAN_OPTIONS=halt_on_error=1 SHARED_OBJECT_TEST_CASE="$selection" "$scratch/shared-object-test"
          done
          TSAN_OPTIONS=halt_on_error=1 CANCEL_TEST_CASE=ordered "$scratch/cancel-test"
  run:
    # The 14900K is shared: time only when dispatched in its queue.
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: [self-hosted, 14900k]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wfc
          path: ${{ runner.temp }}
      - name: Unpack compiler and record toolchain
        run: |
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/wfc.tar.gz"
          /usr/bin/clang --version
          ld.lld --version
      - name: Build counter arms separately
        if: inputs.path_diagnostics
        env:
          WFC: ${{ runner.temp }}/wfc/whitefootc
          OUT: ${{ runner.temp }}/gf-counters
          COUNTERS: 1
        run: sh research/experiments/guard-fairness/build.sh > "$OUT-build.txt"
      - name: Build uninstrumented comparison arms
        env:
          WFC: ${{ runner.temp }}/wfc/whitefootc
          OUT: ${{ runner.temp }}/gf-timing
          COUNTERS: 0
        run: sh research/experiments/guard-fairness/build.sh > "$OUT-build.txt"
      - name: Reversed interleaved orders and baseline twin
        env:
          OUT: ${{ runner.temp }}/gf-timing
          DIAGNOSTIC_OUT: ${{ runner.temp }}/gf-counters
          PATH_DIAGNOSTICS: ${{ inputs.path_diagnostics && '1' || '0' }}
        run: sh research/experiments/guard-fairness/run.sh > "$OUT-run.txt"
      - name: Show paired decision and diagnostics
        run: |
          cat "$RUNNER_TEMP/gf-timing/verdict.txt"
          if [ -f "$RUNNER_TEMP/gf-counters/counters.csv" ]; then
            cat "$RUNNER_TEMP/gf-counters/counters.csv"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guard-fairness-evidence
          path: |
            ${{ runner.temp }}/gf-*/raw/
            ${{ runner.temp }}/gf-*/*.csv
            ${{ runner.temp }}/gf-*/verdict.txt
            ${{ runner.temp }}/gf-*/probe.ll
            ${{ runner.temp }}/gf-*/probe-diagnostic.ll
            ${{ runner.temp }}/gf-*/*.stdout
            ${{ runner.temp }}/gf-*-build.txt
            ${{ runner.temp }}/gf-*-run.txt

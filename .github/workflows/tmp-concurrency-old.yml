# Temporary (wf-gate-budget-noise): removed before the branch is ready.
# The concurrency group of sanitizers.yml before the change, with this branch
# standing in for main: two pushes in a row, the second cancels the first.
name: tmp-concurrency-old

on:
  push:
    branches: [wf-gate-main-concurrency]

concurrency:
  group: tmp-old-${{ github.event.action == 'ready_for_review' && 'ready-' || github.event_name == 'pull_request' && 'opened-' || github.event_name == 'workflow_dispatch' && 'manual-' || '' }}${{ github.head_ref && format('refs/heads/{0}', github.head_ref) || github.ref }}
  cancel-in-progress: true

jobs:
  hold:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: sleep 100

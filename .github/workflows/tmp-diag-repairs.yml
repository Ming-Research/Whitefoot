# Temporary quick check for Whitefoot#446 (coord-wfbl-01-05); removed before the full check.
name: tmp-diag-repairs

on:
  push:
    branches: [claude/diag-repairs-proof]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0

jobs:
  quick:
    name: ${{ matrix.stage }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        stage: [lint, unit]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - name: Install the host toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          rustup default stable
          rustup component add clippy rustfmt
          cargo --version
      - name: Fetch locked compiler dependencies
        run: cargo fetch --locked --manifest-path compiler/Cargo.toml
      - name: Decline core dumps
        run: sudo sysctl -w kernel.core_pattern=core
      - name: Format
        if: matrix.stage == 'lint'
        run: cd compiler && cargo fmt --all -- --check
      - name: Lint
        if: matrix.stage == 'lint'
        run: make -C compiler lint
      - name: Unit tests
        if: matrix.stage == 'unit'
        env:
          WHITEFOOT_CHECK_TIMEOUT: 1500
        run: make -C compiler test-build-unit test-unit

# Temporary (board item enum-route-check-cost); remove before the branch is ready.
# Decides the Firn acceptance row by an interval, on the head that merges: Firn's
# whole-program check, five compilers (base = pre-#431 main, a twin of it, the
# #431 merge commit with this branch's compiler/ change applied, main at the
# merge base, and this branch), interleaved rounds, compiler CPU (user + system).
# The job runs 15 rounds and stops if the distribution-free 95% interval of the
# median of the per-round branch/base ratio lies wholly at or below, or wholly
# above, 1.03 (or the batch is invalid); otherwise it runs to 25 rounds. The
# design, the interval, the stop rules and the validity condition are written in
# the study record before the run.
name: tmp-firn-interval

on:
  push:
    branches: [claude/enum-route-check-cost]
    paths: [.github/workflows/tmp-firn-interval.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

concurrency:
  group: tmp-firn-interval-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
  MAIN_REVISION: dc2bd2f3370cfd400a551482e1b226fafabbb242
  C431_REVISION: af7665be6
  WHITEFOOT_CHECK_TIMEOUT: 1800

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Firn whole program, at the revision the 10-13 measurement used.
          - label: firn
            repo: Firn-wf
            rev: b83b67fa0d7b463dbafe5429b013efc04e39076a
            args: --graph firn/modules.wfg --entry firn --check
            base: 7d9118eba
            c431: 'true'
            adapt_max: 400
            adapt_run: '39899519361'
            adapt_artifact: tmp-final-timing-2
            strip: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare sources and worktrees
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          rustup default stable
          if [ -n "${{ matrix.base }}" ]; then git worktree add --detach "$RUNNER_TEMP/base" "${{ matrix.base }}"; fi
          if [ "${{ matrix.c431 }}" = true ]; then git worktree add --detach "$RUNNER_TEMP/c431fix" "$C431_REVISION"; fi
          git worktree add --detach "$RUNNER_TEMP/main" "$MAIN_REVISION"
          git clone --quiet "https://github.com/Ming-Research/${{ matrix.repo }}.git" "$RUNNER_TEMP/halo"
          git -C "$RUNNER_TEMP/halo" checkout --quiet --detach "${{ matrix.rev }}"
          git -C "$RUNNER_TEMP/halo" submodule update --init --quiet
          { printf 'base=%s\nc431fix_base=%s\nmain=%s\nbranch=%s\nsource=%s\n' "$([ -d "$RUNNER_TEMP/base" ] && git -C "$RUNNER_TEMP/base" rev-parse HEAD)" "$([ -d "$RUNNER_TEMP/c431fix" ] && git -C "$RUNNER_TEMP/c431fix" rev-parse HEAD)" "$(git -C "$RUNNER_TEMP/main" rev-parse HEAD)" "$(git rev-parse HEAD)" "${{ matrix.rev }}"; lscpu | grep 'Model name'; } | tee "$RUNNER_TEMP/out/identity.txt"
      - name: Apply this branch's compiler change to the #431 merge commit
        if: matrix.c431 == 'true'
        run: |
          git diff --binary "$MAIN_REVISION" HEAD -- compiler > "$RUNNER_TEMP/out/pr-compiler.patch"
          wc -l "$RUNNER_TEMP/out/pr-compiler.patch"
          if git -C "$RUNNER_TEMP/c431fix" apply --3way --whitespace=nowarn "$RUNNER_TEMP/out/pr-compiler.patch"; then
            echo "applied" | tee "$RUNNER_TEMP/out/c431fix-status.txt"
          else
            echo "the patch does not apply" | tee "$RUNNER_TEMP/out/c431fix-status.txt"
            git -C "$RUNNER_TEMP/c431fix" reset --hard --quiet
            git worktree remove --force "$RUNNER_TEMP/c431fix"
          fi
      - name: Build the merged compiler
        run: |
          perl .github/run-check.pl thc-fetch cargo fetch --locked --manifest-path "$GITHUB_WORKSPACE/compiler/Cargo.toml"
          perl .github/run-check.pl compiler/build cargo build --manifest-path "$GITHUB_WORKSPACE/compiler/Cargo.toml" --profile gate --bin whitefootc --locked --offline
      - name: Apply the earlier run's adaptation
        env:
          GH_TOKEN: ${{ github.token }}
          ADAPT_RUN: ${{ matrix.adapt_run }}
          ADAPT_ARTIFACT: ${{ matrix.adapt_artifact }}
        run: |
          dir=$(mktemp -d "$RUNNER_TEMP/earlier.XXXXXX")
          if gh run download "$ADAPT_RUN" --repo "$GITHUB_REPOSITORY" -n "$ADAPT_ARTIFACT" -D "$dir"; then
            git -C "$RUNNER_TEMP/halo" apply --exclude='deps/*' --whitespace=nowarn "$dir/adapt.diff" && echo "applied the earlier diff" || echo "the earlier diff did not apply; adapting from the original source"
            if [ -f "$dir/deps-adapt.diff" ] && [ -d "$RUNNER_TEMP/halo/deps/halo-wf" ]; then
              git -C "$RUNNER_TEMP/halo/deps/halo-wf" apply --whitespace=nowarn "$dir/deps-adapt.diff" && echo "applied the earlier library diff" || echo "the earlier library diff did not apply"
            fi
          else
            echo "no earlier artifact; adapting from the original source"
          fi
          git -C "$RUNNER_TEMP/halo" status --short | wc -l
      - name: Adapt the source to the merged compiler's OP-5 rule
        id: adapt
        env:
          ARGS: ${{ matrix.args }}
          ADAPT_MAX: ${{ matrix.adapt_max }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re, subprocess
          temp = pathlib.Path(os.environ['RUNNER_TEMP']); out = temp / 'out'; src = temp / 'halo'
          binary = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'compiler/target/gate/whitefootc'
          cmd = os.environ['ARGS'].split(); cap = int(os.environ['ADAPT_MAX'])
          env = {k: v for k, v in os.environ.items() if k not in ('WHITEFOOT_CHECK_WORK', 'WHITEFOOT_TIME_BUDGET_RECORD')}
          site = re.compile(r'rejected: (\S+?):(\d+):(\d+): error\[([A-Za-z0-9-]+)\]')
          notes = []; end = 'cap reached'; counter = [0]
          def block_end(lines, start, indent):
              return next((n for n in range(start, len(lines)) if lines[n].startswith(indent + '}') and not lines[n].startswith(indent + ' ')), None)
          def fix_else_if(path, number, decided):
              lines = (src / path).read_text().split('\n'); i = number - 1
              m = re.match(r'^(\s*)\} else if (.*) \{$', lines[i])
              if not m: return None
              indent = m.group(1)
              j = block_end(lines, i + 1, indent)
              if j is None: return 'else-if: no closing line at the same indent'
              if decided == 'True':
                  # Keep the then block as the final else; drop the rest of the chain.
                  k = j
                  while lines[k] != indent + '}':
                      k = block_end(lines, k + 1, indent)
                      if k is None: return 'else-if: chain does not close'
                  lines[i:k + 1] = [indent + '} else {'] + lines[i + 1:j] + [indent + '}']
              else:
                  # Drop the then block; the next link (or the closing brace) follows the previous block.
                  lines[i:j + 1] = [lines[j]]
              (src / path).write_text('\n'.join(lines))
              return ''
          def fix_effect_row(path, number, text):
              expected = re.search(r'expected_row: (.*)', text); found = re.search(r'found_row: (.*)', text)
              if not expected or not found: return 'no rows in the diagnostic'
              lines = (src / path).read_text().split('\n'); i = number - 1
              if found.group(1) not in lines[i]: return 'found row is not on the reported line'
              lines[i] = lines[i].replace(found.group(1), expected.group(1), 1)
              (src / path).write_text('\n'.join(lines))
              return None
          def fix_redundant(path, number, decided):
              chain = fix_else_if(path, number, decided)
              if chain is not None: return chain or None
              lines = (src / path).read_text().split('\n'); i = number - 1
              m = re.match(r'^(\s*)if (.*) \{$', lines[i])
              if not m: return f'not a statement-form if: {lines[i]!r}'
              indent = m.group(1)
              j = block_end(lines, i + 1, indent)
              if j is None: return 'no closing brace at the same indent'
              then = [l[2:] if l.startswith('  ') else l for l in lines[i + 1:j]]; other = []; tail = j + 1
              if lines[j] == indent + '} else {':
                  k = block_end(lines, j + 1, indent)
                  if k is None or lines[k] != indent + '}': return 'else branch is not a plain block'
                  other = [l[2:] if l.startswith('  ') else l for l in lines[j + 1:k]]; tail = k + 1
              elif lines[j] != indent + '}': return f'closing line is {lines[j]!r}'
              keep = then if decided == 'True' else other
              # The kept block's own bindings leave their block and could collide
              # with a later binding of the same spelling [TYPE-6]: rename them.
              for at in range(len(keep)):
                  d = re.match(r'^' + re.escape(indent) + r'let (.*?) = ', keep[at])
                  if not d: continue
                  pattern = d.group(1)
                  names = [pattern] if re.fullmatch(r'\w+', pattern) else re.findall(r'(?<=: )[a-z_]\w*', pattern)
                  for name in names:
                      counter[0] += 1; fresh = f'{name}_d{counter[0]}'
                      use = re.compile(r'(?<![\w:])(?<![\w)\]^]\.)' + re.escape(name) + r'(?!\w)(?!:(?!:))')
                      keep[at] = use.sub(fresh, keep[at][:d.end(1)]) + keep[at][d.end(1):]
                      keep[at + 1:] = [use.sub(fresh, l) for l in keep[at + 1:]]
              rest = lines[tail:]
              # Statements after a kept `return` at this level are unreachable.
              last = next((l for l in reversed(keep) if l.strip()), None)
              if last is not None and last.startswith(indent + 'return') and len(last) - len(last.lstrip()) == len(indent):
                  cut = next((n for n, l in enumerate(rest) if l.strip() and len(l) - len(l.lstrip()) < len(indent)), len(rest))
                  rest = rest[cut:]
              (src / path).write_text('\n'.join(lines[:i] + keep + rest))
              return None
          def fix_match_fields(path, number, text):
              declared = re.search(r'declared_fields: \[(.*?)\]', text)
              if not declared or not text.startswith(': InvalidMatchFields'): return 'not a missing-field rejection'
              names = re.findall(r'"(\w+)"', declared.group(1))
              lines = (src / path).read_text().split('\n'); line = lines[number - 1]
              if ') = ' not in line: return 'no closing pattern on the line'
              close = line.index(') = '); listed = set(re.findall(r'(?:(?<=\()|(?<=, ))(\w+): ', line[:close]))
              missing = [n for n in names if n not in listed]
              if not missing: return 'no missing field'
              lines[number - 1] = line[:close] + ''.join(f', {n}: unused_{n}' for n in missing) + line[close:]
              (src / path).write_text('\n'.join(lines))
              return None
          def rename_held():
              changed = 0
              for path in src.rglob('*'):
                  if path.suffix not in ('.wf', '.wfm') or '.git' in path.relative_to(src).parts: continue
                  text = path.read_text(); new = re.sub(r'\bheld\b', 'held_n', text)
                  if new != text: path.write_text(new); changed += 1
              return changed
          def rename_collision(spelling):
              changed = 0
              for path in src.rglob('*'):
                  if path.suffix not in ('.wf', '.wfm') or '.git' in path.relative_to(src).parts: continue
                  text = path.read_text(); new = re.sub(r'\b' + re.escape(spelling) + r'\b', spelling + '_n', text)
                  if new != text: path.write_text(new); changed += 1
              return changed
          for n in range(cap + 1):
              r = subprocess.run([str(binary), *cmd], cwd=src, env=env, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              if r.returncode == 0: end = 'accepted'; break
              (out / 'adapt-last.log').write_text(r.stdout)
              m = site.search(r.stdout)
              if not m: end = 'stopped: no located rejection'; break
              if n == cap: break
              where = f'{m.group(1)}:{m.group(2)}'
              if m.group(4) == 'OP-5':
                  d = re.search(r'decided: (True|False)', r.stdout[m.end():])
                  why = fix_redundant(m.group(1), int(m.group(2)), d.group(1) if d else '?') if d else 'no decided value'
                  if why: end = f'cannot fix {where}: {why}'; break
                  notes.append('OP-5 ' + where)
              elif m.group(4) == 'EFF-2':
                  why = fix_effect_row(m.group(1), int(m.group(2)), r.stdout[m.end():m.end() + 2500])
                  if why: end = f'cannot fix {where}: {why}'; break
                  notes.append('EFF-2 ' + where)
              elif m.group(4) == 'GRAM-10':
                  why = fix_match_fields(m.group(1), int(m.group(2)), r.stdout[m.end():m.end() + 4000])
                  if why: end = f'cannot fix {where}: {why}'; break
                  notes.append('GRAM-10 ' + where)
              elif m.group(4) == 'FORM-3' and 'found: "held"' in r.stdout[m.end():m.end() + 1500] and not any(x.startswith('held') for x in notes):
                  notes.append(f'held renamed in {rename_held()} files')
              elif m.group(4) == 'TYPE-6' and ': DeclarationCollision' in r.stdout[m.end():m.end() + 40] and (sp := re.search(r'spelling: (\w+)\n\s*conflicts: [^\n]*origin: prelude', r.stdout[m.end():m.end() + 1500])) and not any(x.startswith('collision ' + sp.group(1) + ' ') for x in notes):
                  notes.append(f'collision {sp.group(1)} renamed in {rename_collision(sp.group(1))} files')
              else:
                  end = f'stopped at {where} {m.group(4)}'; break
              print('applied', notes[-1], flush=True)
          diff = subprocess.run(['git', 'diff'], cwd=src, stdout=subprocess.PIPE, text=True).stdout
          (out / 'adapt.diff').write_text(diff); (out / 'adapt-notes.txt').write_text('\n'.join(notes) + '\n')
          line = f'## Adapt `{os.environ["ARGS"]}`: {len(notes)} fixes, ended: {end}\n'
          print(line, flush=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f: f.write(line)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f: f.write('accepted=' + ('true' if end == 'accepted' else 'false') + '\n')
          PY
      - name: Save the library adaptation
        if: steps.adapt.outputs.accepted == 'true'
        run: |
          if [ -d "$RUNNER_TEMP/halo/deps/halo-wf" ]; then
            git -C "$RUNNER_TEMP/halo/deps/halo-wf" diff > "$RUNNER_TEMP/out/deps-adapt.diff"
            wc -l "$RUNNER_TEMP/out/deps-adapt.diff"
          fi
      - name: Build the other compilers
        if: steps.adapt.outputs.accepted == 'true'
        run: |
          for tree in "$RUNNER_TEMP/main" "$RUNNER_TEMP/base" "$RUNNER_TEMP/c431"; do
            [ -d "$tree" ] || continue
            perl .github/run-check.pl thc-fetch cargo fetch --locked --manifest-path "$tree/compiler/Cargo.toml"
            perl .github/run-check.pl compiler/build cargo build --manifest-path "$tree/compiler/Cargo.toml" --profile gate --bin whitefootc --locked --offline
            df -h / | tail -1
          done
      - name: Build the #431 merge commit with this branch's change
        id: c431fix
        continue-on-error: true
        if: steps.adapt.outputs.accepted == 'true' && matrix.c431 == 'true'
        run: |
          [ -d "$RUNNER_TEMP/c431fix" ] || { echo "no c431fix tree"; exit 1; }
          tree="$RUNNER_TEMP/c431fix"
          if perl .github/run-check.pl thc-fetch cargo fetch --locked --manifest-path "$tree/compiler/Cargo.toml" && perl .github/run-check.pl compiler/build cargo build --manifest-path "$tree/compiler/Cargo.toml" --profile gate --bin whitefootc --locked --offline; then
            echo "applied and built" | tee "$RUNNER_TEMP/out/c431fix-status.txt"
            df -h / | tail -1
          else
            echo "applied but the build failed" | tee "$RUNNER_TEMP/out/c431fix-status.txt"
            exit 1
          fi
      - name: Source without the Inputs bindings the baseline lacks, and the baseline compiler's check of it
        if: steps.adapt.outputs.accepted == 'true' && matrix.strip == 'true'
        env:
          ARGS: ${{ matrix.args }}
        run: |
          cp -a "$RUNNER_TEMP/halo" "$RUNNER_TEMP/halo0"
          python3 - <<'PY'
          import os, pathlib, re, subprocess, sys
          temp = pathlib.Path(os.environ['RUNNER_TEMP']); src = temp / 'halo0'; out = temp / 'out'
          base = temp / 'base/compiler/target/gate/whitefootc'; cmd = os.environ['ARGS'].split()
          site = re.compile(r'rejected: (\S+?):(\d+):\d+: error\[GRAM-10\]: InvalidMatchFields')
          removed = []
          for n in range(6):
              r = subprocess.run([str(base), *cmd], cwd=src, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              if r.returncode == 0: break
              m = site.search(r.stdout); d = re.search(r'declared_fields: \[(.*?)\]', r.stdout)
              if not m or not d or n == 5: print(r.stdout); sys.exit('the baseline compiler rejects the source for another reason')
              declared = set(re.findall(r'\w+', d.group(1)))
              path = src / m.group(1); lines = path.read_text().split('\n'); i = int(m.group(2)) - 1
              extra = [x for x in re.findall(r', (\w+): unused_\1(?=[,)])', lines[i]) if x not in declared]
              if not extra: print(r.stdout); sys.exit('no unused binding of an undeclared field on the reported line')
              for x in extra: lines[i] = lines[i].replace(f', {x}: unused_{x}', '', 1)
              path.write_text('\n'.join(lines)); removed += [f'{x} at {m.group(1)}:{m.group(2)}' for x in extra]
              print('removed', extra, 'at', m.group(1), m.group(2), flush=True)
          (out / 'baseline-removed.txt').write_text('\n'.join(removed) + '\n')
          line = f'## Baseline source: removed {len(removed)} unused binding(s): {removed}; the baseline compiler accepts it\n'
          print(line, flush=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f: f.write(line)
          PY
      - name: Interleaved rounds with interval checkpoints
        if: steps.adapt.outputs.accepted == 'true'
        env:
          ARGS: ${{ matrix.args }}
        run: |
          python3 - <<'PY'
          import collections, os, pathlib, statistics, subprocess
          temp = pathlib.Path(os.environ['RUNNER_TEMP']); out = temp / 'out'
          ws = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          bins = {'base': temp / 'base/compiler/target/gate/whitefootc'}
          bins['twin'] = bins['base']
          fixed_bin = temp / 'c431fix/compiler/target/gate/whitefootc'
          if fixed_bin.exists(): bins['c431fix'] = fixed_bin
          bins['main'] = temp / 'main/compiler/target/gate/whitefootc'
          bins['branch'] = ws / 'compiler/target/gate/whitefootc'
          cmd = os.environ['ARGS'].split()
          env = {k: v for k, v in os.environ.items() if k not in ('WHITEFOOT_CHECK_WORK', 'WHITEFOOT_TIME_BUDGET_RECORD')}
          RANK = {15: 4, 25: 8}          # k for the interval [R(k), R(n+1-k)] of the median
          COVER = {15: 96.5, 25: 95.7}   # coverage in percent, from 1 - 2 P(Bin(n, 1/2) <= k-1)
          CRITERION = 1.03
          def run(which, rnd):
              timing = out / f'firn-{which}-{rnd}.time'
              cwd = temp / ('halo0' if which in ('base', 'twin', 'c431fix') and (temp / 'halo0').is_dir() else 'halo')
              r = subprocess.run(['perl', str(ws / '.github/run-check.pl'), f'thc-{which}-{rnd}', '/usr/bin/time', '-q', '-f', '%e\t%U\t%S', '-o', str(timing), str(bins[which]), *cmd],
                                 cwd=cwd, env=env, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              (out / f'firn-{which}-{rnd}.log').write_text(r.stdout)
              wall, user, sys_ = map(float, timing.read_text().split()[-3:])
              return r.returncode, user + sys_
          cpu = collections.defaultdict(dict); rc = collections.defaultdict(dict)
          def ratio(top, bottom, n):
              return [cpu[r][top] / cpu[r][bottom] for r in range(1, n + 1)]
          def interval(values, n):
              k = RANK[n]; s = sorted(values); return s[k - 1], s[n - k]
          def row(name, values, n):
              lo, hi = interval(values, n)
              return (f"| {name} | {statistics.median(values):.3f} | {lo:.3f}-{hi:.3f} | {min(values):.3f}-{max(values):.3f} | "
                      + ' '.join(f'{v:.3f}' for v in values) + ' |'), lo, hi
          def checkpoint(n):
              names = [('D = branch/base', 'branch', 'base'), ('E = c431fix/base', 'c431fix', 'base'), ('F = branch/c431fix', 'branch', 'c431fix'),
                       ('c = branch/main', 'branch', 'main'), ('M = main/base', 'main', 'base'), ('T = twin/base', 'twin', 'base')]
              lines = [f'## firn after {n} rounds: ratios of compiler CPU (user+sys), median, {COVER[n]}% interval of the median, min-max, per round', '',
                       '| Ratio | median | interval | min-max | per round |', '|---|---:|---|---|---|']
              bounds = {}
              for name, top, bottom in names:
                  if top not in bins or bottom not in bins: continue
                  text, lo, hi = row(name, ratio(top, bottom, n), n); lines.append(text); bounds[name[0]] = (lo, hi)
              bad = [(r, w) for r in range(1, n + 1) for w, c in rc[r].items() if c != 0]
              tlo, thi = bounds['T']
              valid = not bad and tlo <= 1.0 <= thi
              dlo, dhi = bounds['D']
              verdict = 'INVALID BATCH' if not valid else ('met: interval wholly <= 1.03' if dhi <= CRITERION else ('not met: interval wholly > 1.03' if dlo > CRITERION else 'undecided: interval contains 1.03'))
              med = {w: statistics.median(cpu[r][w] for r in range(1, n + 1)) for w in bins}
              lines += ['', 'Median CPU s: ' + ', '.join(f'{w} {v:.2f}' for w, v in med.items()),
                        f'Nonzero exit codes: {bad if bad else "none"}', f'T interval {tlo:.3f}-{thi:.3f} contains 1.000: {tlo <= 1.0 <= thi}',
                        f'**Verdict on D at {n} rounds: {verdict}**']
              text = '\n'.join(lines) + '\n'; print(text, flush=True)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f: f.write(text)
              return valid, verdict
          names = list(bins)
          for rnd in range(1, 26):
              for w in (names if rnd % 2 else names[::-1]):
                  rc[rnd][w], cpu[rnd][w] = run(w, rnd)
                  print(rnd, w, f'rc={rc[rnd][w]}', f'{cpu[rnd][w]:.2f}', flush=True)
              with (out / 'rounds.tsv').open('w') as f:
                  f.write('round\t' + '\t'.join(names) + '\n')
                  for r in sorted(cpu): f.write(str(r) + '\t' + '\t'.join(f'{cpu[r][w]:.2f}' for w in names) + '\n')
              if rnd in (15, 25):
                  valid, verdict = checkpoint(rnd)
                  if rnd == 15 and valid and verdict.startswith('undecided'): continue
                  break
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tmp-firn-interval
          path: ${{ runner.temp }}/out/
          if-no-files-found: warn

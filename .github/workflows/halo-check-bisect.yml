# Temporary: finds which main merge made `whitefootc --check-module pkg::vm`
# slower on Halo's library graph. Compiler release wf-d837678c6905 takes 3.33 s
# and wf-93e97efdc27b 4.19 s (+25.8%, 14900K, same Halo source). Each matrix job
# builds the base compiler (d837678c6905) and one first-parent main merge
# between them, then times both on Halo 80f0ee4 in 5 alternating rounds. The
# final job lists the median (user+sys) ratio per merge, oldest first.
# Remove this workflow and its branch when the merge is found.
name: halo-check-bisect

on:
  push:
    branches: [claude/halo-check-bisect]
    paths: [.github/workflows/halo-check-bisect.yml]
  workflow_dispatch:

concurrency:
  group: halo-check-bisect-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
  BASE_REVISION: d837678c69057a7ca79be8fa0bd1598af51647b6
  # The Halo source both compilers check (branch claude/halo-pin-93e97ef).
  HALO_REVISION: 80f0ee4

jobs:
  time:
    name: ${{ matrix.title }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Newest first, as the first-parent main merges between the two
        # releases; title is the pull request number and branch.
        include:
          - {commit: 93e97efdc27ba5700328794445d1f401b9be6213, title: "#405 join-slot-local"}
          - {commit: d596153529e4aaa98e474cbd224cadec648694d1, title: "#399 gate-pr-branches-only"}
          - {commit: 588bd31ed641520effc36bf4e6e0451715a3e3c5, title: "#411 ref2-sibling-release"}
          - {commit: 35cfc4a0ba27ca74a9933711ef52369a67ec912d, title: "#395 range-helper-frames"}
          - {commit: 9bc6bb7eda51e15037f0b8dbc36385aae3865165, title: "#390 const-arg-type"}
          - {commit: 2a785316590a8f22a7e3c92508e4b59daca783bf, title: "#392 guard-clock-and-error-class"}
          - {commit: c0394d85a8a9773a7abe1a36bfde4e76bceb9eea, title: "#400 read-through-results"}
          - {commit: d469bd164682363025b007cf5fd134f49a5cbab0, title: "#383 cache-key-path"}
          - {commit: bfa06a7d019b3745f8892f90291422c531b9afd1, title: "#404 runtime-budget-raise"}
          - {commit: 58743a931a5ec6244864d37041fd1a7c1c5a145d, title: "#396 share2-indexed-target"}
          - {commit: 6876bd1751aba44c53784ecbdce89f480fecb88f, title: "#397 agents-ci-only"}
          - {commit: d67e83250c5f8fcfa5e3ea02a0835e9b908e2142, title: "#391 place-render-names"}
          - {commit: 1741f12627c4c9f2f361dca2608969de0c571352, title: "#384 meta-commit-witness"}
          - {commit: c52e867cae4fd81de4e8bec2027bce66ce240f47, title: "#401 budget-raise-1012"}
          - {commit: abc27fbd342e407839a4042bf6804cac2fb5ca2d, title: "#381 heap-read-nolock"}
          - {commit: 8b14adf8abd120d5eb74070edc16dbe35ca9e22c, title: "#378 keyset-spare"}
          - {commit: f0df1d2587533618d7ad8acaac4b0ea1ad9830e8, title: "#373 contract-alias-overlap"}
          - {commit: 51c5f4263f512d5b1a5f02f7cd3d5e23baa276a2, title: "#379 readelf-import-check"}
          - {commit: 29de8a21eef895f9e5ff12373422202d753936b9, title: "#371 mixed-join-cursor"}
          - {commit: 1762a4480e9edf0cc4aa0b896e97061630e048d7, title: "#365 driver-count"}
          - {commit: 8ffb6d93241f69e736b12d4339eba780e857d8c9, title: "#361 keyset-bytes"}
          - {commit: c9c45a6ecee57c53675cc4c9e5c82cfe96eb5022, title: "#375 macos-corpus-budget"}
          - {commit: 94d353e33034b8de457a8cff90904e637a054cea, title: "#362 io-error-text"}
          - {commit: 5b8bccb2d9bed3c40155ae0351510e844fb46559, title: "#366 range-guard-facts"}
          - {commit: 60272a6a9bec86290bd60511bb1d1ef3438c3074, title: "#372 gate-ready-group"}
          - {commit: 26355924f94222025151e56b3e8f9a8c8db4135c, title: "#363 paged-small-owners"}
    env:
      COMMIT: ${{ matrix.commit }}
      WHITEFOOT_CHECK_TIMEOUT: 1800
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare the toolchain and both worktrees
        run: |
          rustup default stable
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_REVISION"
          git worktree add --detach "$RUNNER_TEMP/commit" "$COMMIT"
          git -C "$RUNNER_TEMP/base" log --oneline -1
          git -C "$RUNNER_TEMP/commit" log --oneline -1
          cargo fetch --locked --manifest-path "$RUNNER_TEMP/base/compiler/Cargo.toml"
          cargo fetch --locked --manifest-path "$RUNNER_TEMP/commit/compiler/Cargo.toml"
      - name: Build both compilers
        run: |
          perl .github/run-check.pl bisect-build-base \
            cargo build --manifest-path "$RUNNER_TEMP/base/compiler/Cargo.toml" --profile gate --locked
          perl .github/run-check.pl bisect-build-commit \
            cargo build --manifest-path "$RUNNER_TEMP/commit/compiler/Cargo.toml" --profile gate --locked
          ls -l "$RUNNER_TEMP/base/compiler/target/gate/whitefootc" "$RUNNER_TEMP/commit/compiler/target/gate/whitefootc"
      - name: Fetch pinned Halo
        run: |
          git clone --quiet "https://github.com/Ming-Research/Halo-wf.git" "$RUNNER_TEMP/halo"
          git -C "$RUNNER_TEMP/halo" checkout --quiet --detach "$HALO_REVISION"
          git -C "$RUNNER_TEMP/halo" rev-parse HEAD
      - name: Time the check of pkg::vm
        run: |
          out="$RUNNER_TEMP/bisect"
          mkdir -p "$out"
          cpu=$(grep -m 1 'model name' /proc/cpuinfo | sed 's/^[^:]*: *//')
          echo "cpu: $cpu"
          base="$RUNNER_TEMP/base/compiler/target/gate/whitefootc"
          commit="$RUNNER_TEMP/commit/compiler/target/gate/whitefootc"
          tsv="$out/$COMMIT.tsv"
          printf 'commit\tround\twhich\twall\tuser\tsys\tcpu\n' > "$tsv"
          cd "$RUNNER_TEMP/halo"
          run() {
            label=$1 compiler=$2
            perl "$GITHUB_WORKSPACE/.github/run-check.pl" "bisect-$label" \
              /usr/bin/time -q -f '%e %U %S' -o "$out/$label.time" \
              "$compiler" --graph lib/halo/modules.wfg --check-module pkg::vm \
              > "$out/$label.log" 2>&1 || { cat "$out/$label.log"; echo "::error::$label exited nonzero"; exit 1; }
          }
          # Warm each compiler once (page cache, binary load).
          run warm-base "$base"
          run warm-commit "$commit"
          for round in 1 2 3 4 5; do
            for which in base commit; do
              run "$which-$round" "$([ $which = base ] && echo "$base" || echo "$commit")"
              read -r wall user sys < "$out/$which-$round.time"
              printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$COMMIT" "$round" "$which" "$wall" "$user" "$sys" "$cpu" >> "$tsv"
              echo "$which round $round: $wall s wall, $user user, $sys sys"
            done
          done
          cat "$tsv"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bisect-${{ matrix.commit }}
          path: ${{ runner.temp }}/bisect/*.tsv
          if-no-files-found: error

  summary:
    name: Median ratios by merge
    needs: time
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bisect-*
          path: tsv
          merge-multiple: true
      - name: Write the table
        run: |
          python3 - <<'PY'
          import csv, glob, os, statistics
          # Oldest first; mirrors the matrix.
          order = [
            ("26355924f94222025151e56b3e8f9a8c8db4135c", "#363 paged-small-owners"),
            ("60272a6a9bec86290bd60511bb1d1ef3438c3074", "#372 gate-ready-group"),
            ("5b8bccb2d9bed3c40155ae0351510e844fb46559", "#366 range-guard-facts"),
            ("94d353e33034b8de457a8cff90904e637a054cea", "#362 io-error-text"),
            ("c9c45a6ecee57c53675cc4c9e5c82cfe96eb5022", "#375 macos-corpus-budget"),
            ("8ffb6d93241f69e736b12d4339eba780e857d8c9", "#361 keyset-bytes"),
            ("1762a4480e9edf0cc4aa0b896e97061630e048d7", "#365 driver-count"),
            ("29de8a21eef895f9e5ff12373422202d753936b9", "#371 mixed-join-cursor"),
            ("51c5f4263f512d5b1a5f02f7cd3d5e23baa276a2", "#379 readelf-import-check"),
            ("f0df1d2587533618d7ad8acaac4b0ea1ad9830e8", "#373 contract-alias-overlap"),
            ("8b14adf8abd120d5eb74070edc16dbe35ca9e22c", "#378 keyset-spare"),
            ("abc27fbd342e407839a4042bf6804cac2fb5ca2d", "#381 heap-read-nolock"),
            ("c52e867cae4fd81de4e8bec2027bce66ce240f47", "#401 budget-raise-1012"),
            ("1741f12627c4c9f2f361dca2608969de0c571352", "#384 meta-commit-witness"),
            ("d67e83250c5f8fcfa5e3ea02a0835e9b908e2142", "#391 place-render-names"),
            ("6876bd1751aba44c53784ecbdce89f480fecb88f", "#397 agents-ci-only"),
            ("58743a931a5ec6244864d37041fd1a7c1c5a145d", "#396 share2-indexed-target"),
            ("bfa06a7d019b3745f8892f90291422c531b9afd1", "#404 runtime-budget-raise"),
            ("d469bd164682363025b007cf5fd134f49a5cbab0", "#383 cache-key-path"),
            ("c0394d85a8a9773a7abe1a36bfde4e76bceb9eea", "#400 read-through-results"),
            ("2a785316590a8f22a7e3c92508e4b59daca783bf", "#392 guard-clock-and-error-class"),
            ("9bc6bb7eda51e15037f0b8dbc36385aae3865165", "#390 const-arg-type"),
            ("35cfc4a0ba27ca74a9933711ef52369a67ec912d", "#395 range-helper-frames"),
            ("588bd31ed641520effc36bf4e6e0451715a3e3c5", "#411 ref2-sibling-release"),
            ("d596153529e4aaa98e474cbd224cadec648694d1", "#399 gate-pr-branches-only"),
            ("93e97efdc27ba5700328794445d1f401b9be6213", "#405 join-slot-local"),
          ]
          rows = {}
          for path in glob.glob("tsv/*.tsv"):
              with open(path) as f:
                  for r in csv.DictReader(f, delimiter="\t"):
                      rows.setdefault(r["commit"], {}).setdefault(int(r["round"]), {})[r["which"]] = (
                          float(r["user"]) + float(r["sys"]), r["cpu"])
          lines = ["## Checking pkg::vm: commit compiler against base d837678c6905",
                   "Ratio is (user+sys) of the merge's compiler over the base's, 5 alternating rounds.", "",
                   "| Commit | Pull request | Median ratio | Min | Max | CPU |", "|---|---|---:|---:|---:|---|"]
          marked = False
          for commit, title in order:
              rounds = rows.get(commit)
              if not rounds:
                  lines.append(f"| {commit[:8]} | {title} | missing | | | |")
                  continue
              ratios = [r["commit"][0] / r["base"][0] for r in rounds.values() if "base" in r and "commit" in r]
              median = statistics.median(ratios)
              cpu = next(iter(rounds.values()))["base"][1]
              mark = ""
              if not marked and median > 1.10:
                  marked = True
                  mark = " **first above 1.10**"
              lines.append(f"| {commit[:8]} | {title}{mark} | {median:.3f} | {min(ratios):.3f} | {max(ratios):.3f} | {cpu} |")
          text = "\n".join(lines) + "\n"
          print(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(text)
          PY

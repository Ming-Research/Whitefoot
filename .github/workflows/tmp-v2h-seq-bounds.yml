# Temporary: builds the old and the new wasm interpreter source with this work's
# compiler on a hosted runner, for the commit pushed to one of this work's
# wf-try branches, reads the machine code of the sequential handlers of both
# images and runs CoreMark on both at 2000 and 20000 iterations as a trial
# (CRCs checked on every launch, no timing verdict). Remove this file before
# the full check (the gate's `No temporary workflow` job fails while it exists).
name: tmp-v2h-seq-bounds

on:
  push:
    branches: ['wf-try/work-237-26e0fade/**']

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0

jobs:
  hosted:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CANDIDATE: ${{ github.sha }}
      BASE: ""
      RUNNER_KIND: github
      MODE: time
      CPU: ""
      ITERATIONS: "2000"
      ROUNDS: "2"
      FLOOR: ""
      RESIDUAL_LIMIT: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install the host toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          rustup default stable
          echo "OUT=$RUNNER_TEMP/out" >> "$GITHUB_ENV"

      - name: Check the tools
        run: bash research/experiments/interpreter-compare/run.sh tools

      # The candidate's compiler builds the base source (the merge base with
      # main) and the candidate source. A rejection of the candidate source by
      # the compiler stops here with its diagnostic.
      - name: Build the compiler and both interpreters
        run: perl .github/run-check.pl tmp-v2h-seq-bounds/build bash research/experiments/interpreter-compare/run.sh build

      - name: Count the successor comparison in the sequential handlers
        run: |
          cat > "$RUNNER_TEMP/handlers.py" <<'PY'
          import importlib.util
          import os
          import re
          import subprocess
          import sys

          out = sys.argv[1]
          spec = importlib.util.spec_from_file_location(
              "handler_samples", "research/experiments/interpreter-compare/handler_samples.py")
          samples = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(samples)

          WANTED = ["Copy", "Copy2", "I32Add", "I32AddA", "I32AddD", "I32AddAD", "BrIf", "BrUnless", "BrIfC", "BrUnlessC", "Jump"]
          COND = re.compile(r"\sj(?!mp)[a-z]+\s")
          CMP = re.compile(r"\s(cmp|test)[a-z]*\s")
          rows = []
          for arm in ("base", "candidate"):
              image = os.path.join(out, "images", f"v2h-{arm}")
              with open(os.path.join(out, "inputs", f"v2h-{arm}.wf")) as f:
                  arms = samples.source_arms(f.read())
              nm = subprocess.run(["nm", "-S", "--defined-only", "--format=posix", image],
                                  capture_output=True, text=True, check=True).stdout
              with open(os.path.join(out, f"{arm}-nm.txt"), "w") as f:
                  f.write(nm)
              symbols = samples.parse_nm(nm)
              handlers = samples.handler_map(symbols, arms)
              for name in WANTED:
                  if name not in arms:
                      print(f"{arm}: no arm {name}")
                      continue
                  for symbol in sorted(s for s, h in handlers.items() if h == name):
                      text = subprocess.run(["objdump", "-d", "--no-show-raw-insn", f"--disassemble={symbol}", image],
                                            capture_output=True, text=True, check=True).stdout
                      with open(os.path.join(out, f"asm-{arm}-{name}-{symbol}.txt"), "w") as f:
                          f.write(text)
                      body = [l for l in text.splitlines() if re.match(r"\s+[0-9a-f]+:\t", l)]
                      rows.append((arm, name, symbol, len(body),
                                   sum(1 for l in body if CMP.search(l + " ")),
                                   sum(1 for l in body if COND.search(l + " "))))
          with open(os.path.join(out, "handler-counts.tsv"), "w") as f:
              f.write("arm\thandler\tsymbol\tinstructions\tcmp_or_test\tconditional_jumps\n")
              for row in rows:
                  f.write("\t".join(map(str, row)) + "\n")
          print("arm\thandler\tsymbol\tinstructions\tcmp_or_test\tconditional_jumps")
          for row in rows:
              print("\t".join(map(str, row)))
          PY
          python3 -B "$RUNNER_TEMP/handlers.py" "$OUT"
          for form in base candidate; do
            echo "=== $form: Copy ==="
            cat "$OUT"/asm-$form-Copy-*.txt
            echo "=== $form: BrIf ==="
            cat "$OUT"/asm-$form-BrIf-*.txt
          done

      - name: CoreMark trial at 2000 iterations
        run: perl .github/run-check.pl tmp-v2h-seq-bounds/time-2000 bash research/experiments/interpreter-compare/run.sh time

      - name: CoreMark trial at 20000 iterations
        run: |
          cp "$OUT/summary.txt" "$OUT/summary-2000.txt"
          mv "$OUT/time.tsv" "$OUT/time-2000.tsv"
          echo 20000 > "$OUT/inputs/coremark-iterations"
          perl .github/run-check.pl tmp-v2h-seq-bounds/time-20000 bash research/experiments/interpreter-compare/run.sh time

      - name: Publish
        if: ${{ !cancelled() }}
        run: |
          cat "$OUT/summary-2000.txt" "$OUT/summary.txt" || true
          bash research/experiments/interpreter-compare/run.sh summary

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tmp-v2h-seq-bounds-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/out/manifest.txt
            ${{ runner.temp }}/out/time*.tsv
            ${{ runner.temp }}/out/summary*.txt
            ${{ runner.temp }}/out/handler-counts.tsv
            ${{ runner.temp }}/out/asm-*.txt
            ${{ runner.temp }}/out/*-nm.txt
            ${{ runner.temp }}/out/*-stdout.txt
            ${{ runner.temp }}/out/inputs/v2h-*.wf

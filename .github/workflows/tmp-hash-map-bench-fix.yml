# Temporary: builds a compiler and compiles the hash-map comparison's
# measurement programs, as they are on main (original) and as this branch has
# them (fixed), to show every rejection at once. The compilers are main's
# and the open scan change's (claude/hash-scan-resume), which hold.wf needs.
# wf-hash-map-bench-fix removes this file before the full check.
name: tmp-hash-map-bench-fix

on:
  push:
    branches: [wf-hash-map-bench-fix]

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0

jobs:
  compile:
    name: compile (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: main
            ref: main
            hold: rejected
          - compiler: scan-change
            ref: claude/hash-scan-resume
            hold: accepted
    steps:
      - uses: actions/checkout@v4
        with:
          path: fix
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          path: root
          ref: ${{ matrix.ref }}

      - name: Install the host toolchain
        working-directory: root
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          rustup default stable

      - name: Build the compiler
        working-directory: root
        run: |
          git log --oneline -1
          cargo fetch --locked --manifest-path compiler/Cargo.toml
          make -C compiler build

      # Each program is compiled on its own and its status kept, so one
      # rejection does not hide another. The originals are main's files.
      - name: Compile the measurement programs
        env:
          HOLD: ${{ matrix.hold }}
        run: |
          wfc="$PWD/root/compiler/target/gate/whitefootc"
          out="$RUNNER_TEMP/images"
          mkdir -p "$out/original"
          directory=research/experiments/hash-map-compare
          for program in bench hold; do
            git -C fix show "origin/main:$directory/$program.wf" > "$out/original/$program.wf"
          done
          status=0
          for program in bench hold; do
            for kind in original fixed; do
              if [ "$kind" = original ]; then
                source="$out/original/$program.wf"
              else
                source="fix/$directory/$program.wf"
              fi
              echo "== $kind $program.wf"
              code=0
              "$wfc" "$source" -o "$out/$kind-$program" || code=$?
              echo "exit $code for $kind $program.wf"
              # The fixed programs must compile, hold.wf only where the scan
              # exists.
              if [ "$kind" = fixed ] && [ "$code" -ne 0 ]; then
                if [ "$program" = bench ] || [ "$HOLD" = accepted ]; then status=1; fi
              fi
            done
          done
          echo "== peak image of the fixed bench.wf"
          code=0
          make -s -C "fix/$directory" peak ROOT="$PWD/root" WFC="$wfc" BUILD="$out/peak" || code=$?
          echo "exit $code for the peak image"
          if [ "$code" -ne 0 ]; then status=1; fi
          exit "$status"

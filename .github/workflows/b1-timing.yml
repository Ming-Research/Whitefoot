# Temporary: mixed-join cursor transport; delete before the branch is ready.
# Same-source v2h CoreMark and Halo fib/loop, compiled by the candidate,
# main 032a0f665 and an independently built twin of main. Launches rotate
# among the three sides; only the 14900K run can decide the adoption criterion.
# Research inputs require the checker's explicit manual-only workflow
# boundary; invoke on claude/mixed-join-cursor with
# gh workflow run b1-timing.yml --ref claude/mixed-join-cursor
name: b1-timing

on:
  workflow_dispatch:

permissions:
  contents: read

# [14900k] in the selected commit's message selects the owner's runner and
# seven rounds. Hosted runs with two rounds exercise the workflow and do
# not settle a 2% timing difference.
env:
  MAIN_COMMIT: 032a0f6650dc8d9cad617d4ab2045b820a877fec
  # This snapshot adopts the current cancel and equality contracts. Its
  # kernels and graph equal the earlier acb39ad7f measurement's, but its
  # interpreter changed: historical raw times are not a direct comparison.
  HALO_COMMIT: 641eb29f48334489ff62af3b3ed71721c2967fb6
  NANO_COMMIT: 5f248e4420102356be7edadbdb4db2ae105d3270

jobs:
  select-runner:
    if: github.ref == 'refs/heads/claude/mixed-join-cursor'
    runs-on: ubuntu-24.04
    outputs:
      runner: ${{ steps.select.outputs.runner }}
      rounds: ${{ steps.select.outputs.rounds }}
    steps:
      - uses: actions/checkout@v4
      - name: Select placement from this commit's message
        id: select
        run: |
          set -eo pipefail
          message=$(git show -s --format=%B HEAD)
          case "$message" in
            *'[14900k]'*)
              echo 'runner=["self-hosted","14900k"]' >> "$GITHUB_OUTPUT"
              echo 'rounds=7' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo 'runner=["ubuntu-24.04"]' >> "$GITHUB_OUTPUT"
              echo 'rounds=2' >> "$GITHUB_OUTPUT"
              ;;
          esac

  b1-timing:
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runner) }}
    env:
      ROUNDS: ${{ needs.select-runner.outputs.rounds }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install and record the host toolchain
        run: |
          set -eo pipefail
          if [ "$RUNNER_ENVIRONMENT" = github-hosted ]; then
            version=$(tr -d '[:space:]' < .github/llvm-major)
            curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
            sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
            sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
            sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
            rustup default stable
          elif [ -d "$HOME/.cargo/bin" ]; then
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          /usr/bin/clang --version | head -1
          rustc --version
          cargo --version
          lscpu | grep -E 'Model name|^CPU\(s\)'
          echo "main $MAIN_COMMIT, candidate $(git rev-parse HEAD), Halo $HALO_COMMIT"

      - name: Build main, candidate and twin compilers independently
        run: |
          set -eo pipefail
          out="$RUNNER_TEMP/b1-timing"
          mkdir -p "$out"
          for side in main candidate twin; do
            if [ "$side" = candidate ]; then
              tree="$PWD"
            else
              tree="$out/source-$side"
              mkdir -p "$tree"
              git archive "$MAIN_COMMIT" | tar -x -C "$tree"
            fi
            # Separate targets force an actual second main compiler build.
            export CARGO_TARGET_DIR="$out/target-$side"
            cargo fetch --locked --manifest-path "$tree/compiler/Cargo.toml"
            make -C "$tree/compiler" build
            cp "$CARGO_TARGET_DIR/gate/whitefootc" "$out/whitefootc-$side"
          done
          sha256sum "$out"/whitefootc-*

      - name: Build identical v2h source with all three compilers
        run: |
          set -eo pipefail
          out="$RUNNER_TEMP/b1-timing"
          python3 research/experiments/match-dispatch/wasm/gen.py "$out/interp.wf"
          for side in main candidate twin; do
            echo "== v2h $side"
            /usr/bin/time -p "$out/whitefootc-$side" --dispatch-ledger --full-lto \
              "$out/interp.wf" -o "$out/wasm-$side" > "$out/ledger-v2h-$side.txt"
            cat "$out/ledger-v2h-$side.txt"
          done
          sha256sum "$out/interp.wf" "$out"/wasm-*

      - name: Build pinned Halo source with all three compilers
        run: |
          set -eo pipefail
          out="$RUNNER_TEMP/b1-timing"
          git clone --quiet https://github.com/Ming-Research/Halo-wf "$out/halo-source"
          git -C "$out/halo-source" checkout --quiet "$HALO_COMMIT"
          git -C "$out/halo-source" log --oneline -1
          cat "$out/halo-source/whitefoot.pin"
          for side in main candidate twin; do
            echo "== Halo $side"
            ( cd "$out/halo-source" && /usr/bin/time -p "$out/whitefootc-$side" \
                --dispatch-ledger --graph research/experiments/halo-bench/modules.wfg \
                --entry bench --full-lto -o "$out/halo-$side" > "$out/ledger-halo-$side.txt" )
            cat "$out/ledger-halo-$side.txt"
          done
          sha256sum "$out/halo-main" "$out/halo-candidate" "$out/halo-twin"
          # Silverfir supplies only the pinned CoreMark module; no comparison
          # engine is built, because this experiment compares WF compilers.
          git clone --quiet https://github.com/mbbill/Silverfir-nano "$out/nano-source"
          git -C "$out/nano-source" checkout --quiet "$NANO_COMMIT"
          sha256sum "$out/nano-source/benchmarks/wasi/coremark/coremark.wasm"

      - name: Run CoreMark through coremark.py in rotated rounds
        run: |
          set -eo pipefail
          out="$RUNNER_TEMP/b1-timing"
          probe="$PWD/research/experiments/match-dispatch/wasm/coremark.py"
          cd "$out/nano-source/benchmarks/wasi/coremark"
          # First observe the established 2K workload before the reference
          # workflow's 20K measurement launches; exclude this sample below.
          /usr/bin/time -p python3 "$probe" --module coremark.wasm --iterations 2000 \
            --launches 1 main="$out/wasm-main" candidate="$out/wasm-candidate" twin="$out/wasm-twin"
          for ((round=0; round<ROUNDS; round++)); do
            sides=(main candidate twin)
            engines=()
            for ((position=0; position<3; position++)); do
              side="${sides[$(((round + position) % 3))]}"
              engines+=("$side=$out/wasm-$side")
            done
            echo "== CoreMark round $((round + 1)): ${engines[*]}"
            python3 "$probe" --module coremark.wasm --iterations 20000 --launches 1 \
              --tsv "$out/coremark-$round.tsv" "${engines[@]}"
            cat "$out/coremark-$round.tsv"
          done
          python3 - "$out" "$ROUNDS" <<'PY'
          import csv, pathlib, statistics, sys
          out, rounds = pathlib.Path(sys.argv[1]), int(sys.argv[2])
          sides = ("main", "candidate", "twin")
          values = {side: [] for side in sides}
          finals, rows = set(), []
          for round in range(rounds):
              with (out / f"coremark-{round}.tsv").open() as source:
                  result = list(csv.DictReader(source, delimiter="\t"))
              if len(result) != 3 or {row["engine"] for row in result} != set(sides):
                  sys.exit(f"incomplete CoreMark round {round + 1}")
              scores = {}
              for row in result:
                  scores[row["engine"]] = float(row["score"])
                  finals.add(row["crcfinal"])
                  rows.append({**row, "launch": round + 1})
              for side in sides:
                  values[side].append(scores[side])
              print(f"CoreMark round {round + 1}: candidate/main {scores['candidate']/scores['main']:.6f}, twin/main {scores['twin']/scores['main']:.6f}")
          if len(finals) != 1:
              sys.exit(f"CoreMark rounds disagree on crcfinal: {sorted(finals)}")
          with (out / "coremark.tsv").open("w") as target:
              writer = csv.DictWriter(target, fieldnames=("launch", "engine", "iterations", "score", "crcfinal"), delimiter="\t")
              writer.writeheader()
              writer.writerows(rows)
          base = statistics.median(values["main"])
          for side in sides:
              median = statistics.median(values[side])
              spread = (max(values[side]) - min(values[side])) / median
              print(f"CoreMark {side}: median {median:.6f} score, spread {spread:.3%}, median/main {median/base:.6f}")
          for side in sides[1:]:
              paired = [a/b for a, b in zip(values[side], values["main"])]
              print(f"CoreMark paired {side}/main: median {statistics.median(paired):.6f}, range {min(paired):.6f}-{max(paired):.6f}, above 1 in {sum(r > 1 for r in paired)}/{rounds}")
          PY

      - name: Time Halo fib and loop in rotated rounds
        run: |
          set -eo pipefail
          out="$RUNNER_TEMP/b1-timing"
          python3 - "$out" "$ROUNDS" <<'PY'
          import csv, pathlib, statistics, subprocess, sys, time
          out, rounds = pathlib.Path(sys.argv[1]), int(sys.argv[2])
          kernels = out / "halo-source/research/experiments/halo-bench/kernels"
          sides = ("main", "candidate", "twin")
          expected = {"fib": b"9227465\n", "loop": b"5.00000005e+15\n"}
          rows = []
          for kernel in ("fib", "loop"):
              source = (kernels / f"{kernel}.lua").read_bytes()
              if kernel == "fib":
                  old = b"local N = 30\n"
                  if source.count(old) != 1:
                      sys.exit("fib source has no unique N = 30")
                  source = source.replace(old, b"local N = 35\n")
              (out / f"{kernel}.lua").write_bytes(source)
              values = {side: [] for side in sides}
              collections = set()
              for round in range(-1, rounds):
                  # Round -1 sizes and warms this kernel; it is not measured.
                  rotation = max(round, 0) % len(sides)
                  order = sides[rotation:] + sides[:rotation]
                  for side in order:
                      start = time.perf_counter()
                      process = subprocess.run([str(out / f"halo-{side}")], input=source, capture_output=True, timeout=600)
                      elapsed = time.perf_counter() - start
                      stats = process.stderr.splitlines()
                      if process.returncode or process.stdout != expected[kernel]:
                          sys.exit(f"{kernel} {side}: exit {process.returncode}, stdout {process.stdout!r}, stderr {process.stderr!r}")
                      if len(stats) != 2 or any(not item.isdigit() for item in stats) or int(stats[0]) != 0:
                          sys.exit(f"{kernel} {side}: malformed stats or unexpected suspension: {process.stderr!r}")
                      collections.add(int(stats[1]))
                      label = "sample" if round < 0 else str(round + 1)
                      print(f"Halo {kernel}\t{label}\t{side}\t{elapsed:.6f}s\t{process.stdout.strip()!r}\tcollections {int(stats[1])}", flush=True)
                      if round >= 0:
                          values[side].append(elapsed)
                          rows.append((kernel, round + 1, side, elapsed))
                  if round >= 0:
                      print(f"Halo {kernel} round {round + 1}: candidate/main {values['candidate'][-1]/values['main'][-1]:.6f}, twin/main {values['twin'][-1]/values['main'][-1]:.6f}")
              if len(collections) != 1:
                  sys.exit(f"{kernel}: collection counts changed across launches: {sorted(collections)}")
              base = statistics.median(values["main"])
              for side in sides:
                  median = statistics.median(values[side])
                  spread = (max(values[side]) - min(values[side])) / median
                  print(f"Halo {kernel} {side}: median {median:.6f}s, spread {spread:.3%}, median/main {median/base:.6f}")
              for side in sides[1:]:
                  paired = [a/b for a, b in zip(values[side], values["main"])]
                  print(f"Halo {kernel} paired {side}/main: median {statistics.median(paired):.6f}, range {min(paired):.6f}-{max(paired):.6f}, above 1 in {sum(r > 1 for r in paired)}/{rounds}")
          with (out / "halo.tsv").open("w") as target:
              writer = csv.writer(target, delimiter="\t")
              writer.writerow(("kernel", "round", "engine", "seconds"))
              writer.writerows(rows)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b1-timing-${{ github.sha }}
          path: |
            ${{ runner.temp }}/b1-timing/*tsv
            ${{ runner.temp }}/b1-timing/ledger-*.txt
            ${{ runner.temp }}/b1-timing/interp.wf
            ${{ runner.temp }}/b1-timing/fib.lua
            ${{ runner.temp }}/b1-timing/loop.lua

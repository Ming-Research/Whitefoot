# Temporary (spec-proof-discharge-sound): watches the two disequality examples
# fail on main's checker, and the proofs fail to check with the disequality
# defect put back; proof.yml checks the proofs. Removed before the full check.
name: tmp-spec-proof-discharge-sound

on:
  push:
    branches: [spec-proof-discharge-sound]

jobs:
  watch-fail:
    name: Examples fail on main's checker
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install the pinned Lean toolchain
        working-directory: proof
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lake" --version
      - name: Restore main's checker
        run: git show origin/main:proof/WhitefootProof/Checker.lean > proof/WhitefootProof/Checker.lean
      # The new proofs rest on the fix, so the harness is built without them.
      - name: Leave out the proofs of the fix
        run: sed -i -E '/^import WhitefootProof\.(Holds|DischargeSound|ObligationSound|ValueSound)$/d' proof/WhitefootProof.lean
      - name: Conformance on main's checker
        working-directory: proof
        run: |
          set +e
          perl ../.github/run-check.pl tmp-watch lake exe conformance > "$RUNNER_TEMP/out.txt" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/out.txt"
          if [ "$status" -eq 0 ]; then
            echo "unexpected pass on main's checker"
            exit 1
          fi
          grep -F "example a disequality requirement the call refutes: the checker gives acceptance, expected a rejection citing FN-8" "$RUNNER_TEMP/out.txt"
          grep -F "example a disequality postcondition the return refutes: the checker gives acceptance, expected a rejection citing FN-9" "$RUNNER_TEMP/out.txt"
          grep -F "conformance: 2 disagreements" "$RUNNER_TEMP/out.txt"

  watch-proofs-fail:
    name: Proofs fail with the defect
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Lean toolchain
        working-directory: proof
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lake" --version
      # The defect: a disequality given an empty list of affine components,
      # which the disposition counts as proved.
      - name: Put the defect back
        run: |
          sed -i 's/^  | \.ne => none$/  | .ne => some []/' proof/WhitefootProof/Checker.lean
          grep -n '^  | \.ne => some \[\]$' proof/WhitefootProof/Checker.lean
      - name: Proofs on the defective checker
        working-directory: proof
        run: |
          set +e
          perl ../.github/run-check.pl tmp-watch-proofs lake build WhitefootProof > "$RUNNER_TEMP/out.txt" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/out.txt"
          if [ "$status" -eq 0 ]; then
            echo "unexpected pass with the defect"
            exit 1
          fi
          grep -E "error: .*WhitefootProof/DischargeSound\.lean:[0-9]+" "$RUNNER_TEMP/out.txt"

# Serves research/experiments/compute-bench: the compute scoreboard on hosted
# runners. One question per leg -- for each kernel, at each width, is the
# Whitefoot program built with plain `--par` the fastest thing in the row? --
# answered on a real Linux host and on an ordinary Apple M1.
#
# With `experiment: placement` it serves research/investigations/code-placement
# instead: the five kernels' images under shifted placements, built by an
# unaligned and an aligned compiler, timed on a hosted runner or the owner's
# i9-14900K. Remove that job with the investigation's harness when the
# alignment decision no longer needs re-measuring.
# With `experiment: par-suite` it serves the generated --par baseline suite
# and reuses the formal paired instrument. Its H1 cells are observations;
# incomplete data, checksum errors and a failed formal null control stop it.
#
# research-boundary: manual-only
# Explicitly requested framework comparison; no push or pull-request trigger.
# Formal correctness and paired regression use the maintained test system.
#
# SCOREBOARD FAILURE POLICY. The job fails on a `deps`, `build` or `verify` failure and on
# nothing else. The manual `compare` step's exit status is the reducer's, and the
# reducer fails only on a missing or malformed row. No ratio, no spread, no
# ordering and no elapsed time selects a pass in the scoreboard job.
# Performance-regression verdicts belong to compute-regression.yml, outside
# deterministic `make check`. `timeout-minutes` bounds a stuck runner and
# decides no source-language result.
#
# Every table a batch relies on is copied by hand into
# `research/investigations/compute-runtime/RESULTS.md` with its run id,
# because job logs and artifacts expire.
name: compute-bench

on:
  workflow_dispatch:
    # An A/B twin on a quiet runner: a non-empty control value builds the second
    # image and adds the wf-b rows (README, "The A/B twin"); such a table is
    # never a recorded plain table. `gap_us` is not a control and builds
    # nothing, but marks its table the same way.
    inputs:
      experiment:
        description: The compute scoreboard, code placement, or the par-suite baseline
        type: choice
        options: [scoreboard, placement, par-suite]
        default: scoreboard
      placement_runner:
        description: Where placement or par-suite runs, GitHub or the owner's i9-14900K runner
        type: choice
        options: [github, 14900k]
        default: github
      placement_rounds:
        description: Placement or par-suite rounds over every image and width (par-suite requires at least 3)
        type: string
        default: "10"
      placement_unaligned:
        description: Commit of the placement experiment's unaligned compiler; empty means the merge base with main
        type: string
        default: ""
      placement_cpus:
        description: The vCPUs every timed placement process is pinned to with taskset
        type: string
        default: "0-3"
      placement_event:
        description: Runtime revision whose images the aligned compiler's are compared with by compare.sh; the default is main before PR 251; empty skips the replay
        type: string
        default: c2e5a1808a7ab194c1523a809e88de64316bd15a
      par_control_flags:
        description: WF_PAR_CONTROL_FLAGS for the B image (emission)
        default: ""
        type: string
      runtime_control_flags:
        description: WF_RUNTIME_CONTROL_FLAGS for the B image (runtime objects)
        default: ""
        type: string
      module_control_flags:
        description: WF_MODULE_CONTROL_FLAGS for the B image (module and runtime compile)
        default: ""
        type: string
      # The call cadence, and the one input here that is not an A/B control: it
      # builds nothing, reaches every form alike, and is waited between
      # consecutive timed calls outside every measured interval (README, "The
      # gap between calls"). Empty is the back-to-back cadence a recorded table
      # is taken at; a non-zero value marks its own table `gap_us=` and is
      # never recorded as a plain one.
      gap_us:
        description: WFB_GAP_US, microseconds waited between consecutive timed calls (every form)
        default: ""
        type: string

# Every shell step runs under `bash -eo pipefail`, so a step that fails behind
# a pipe fails the step. io-bench.yml carries the same default and records the
# bug it fixes: a compiler rejection printed into the log while the step
# stayed green, because the exit status of a pipeline is tee's unless pipefail
# is set.
defaults:
  run:
    shell: bash

# Hosted placement runs land on whichever processor model the pool assigns, so
# several may run at once to reach a given model. A placement run on the
# 14900K waits for the one running before it; GitHub keeps one waiting run
# per group, so a third dispatch replaces the waiting one.
concurrency:
  group: compute-bench-${{ github.ref }}-${{ inputs.experiment }}-${{ inputs.placement_runner }}${{ inputs.experiment == 'placement' && inputs.placement_runner == 'github' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ inputs.experiment == 'scoreboard' }}

env:
  CARGO_TERM_COLOR: never
  # A fresh checkout gains nothing from incremental state (compiler/Cargo.toml).
  CARGO_INCREMENTAL: 0

jobs:
  bench:
    name: bench (${{ matrix.os }})
    if: inputs.experiment == 'scoreboard'
    runs-on: ${{ matrix.os }}
    # Against a stated 15-minute target for a cold leg. It bounds a stuck
    # runner and nothing else.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      # No historical compiler is built here, so a shallow checkout is enough.
      # The manifest records the revision from it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # The scratch root goes through GITHUB_ENV because the `runner` context
      # is not available to a job-level `env`; a workflow that uses it there
      # fails validation before any job starts.
      - name: Record the Rust toolchain and set the scratch root
        run: |
          rustup default stable
          rustc -vV
          cargo --version
          echo "WHITEFOOT_SCRATCH_ROOT=$RUNNER_TEMP/scratch" >> "$GITHUB_ENV"
          # The three A/B controls and the call cadence travel as environment
          # variables, which the bundle Makefile's `?=` defaults yield to; they
          # are empty on a push and on a dispatch that set none, so such a run
          # builds no twin. Only a dispatch performs timed calls.
          {
            echo "WF_PAR_CONTROL_FLAGS=${{ inputs.par_control_flags }}"
            echo "WF_RUNTIME_CONTROL_FLAGS=${{ inputs.runtime_control_flags }}"
            echo "WF_MODULE_CONTROL_FLAGS=${{ inputs.module_control_flags }}"
            echo "WFB_GAP_US=${{ inputs.gap_us }}"
          } >> "$GITHUB_ENV"

      # The OS prefix is load-bearing. Keyed on the three hashes alone, both
      # legs compute the same key, so whichever leg saved first would hand the
      # other its `compiler/target` and its foreign oneTBB build -- a Linux
      # libtbb.so restored into a macOS leg, or the reverse -- and the failure
      # is a link error in a job that never touched the library, or worse, a
      # silently stale binary. `runner.os` and `matrix.os` are both prefixed
      # because the matrix may one day carry two images of the same OS.
      #
      # The restore-keys prefix is load-bearing too: with an exact key that
      # changes only when a lockfile changes, the cache is written once and
      # never refreshed, so an unchanged-lockfile run that added new
      # dependencies would rebuild everything. The prefix restores the most
      # recent same-OS entry and the run saves an updated one.
      #
      # The cache is not optional: a miss pays the compiler build and the
      # oneTBB build together, and that is most of a cold leg.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            compiler/target
            ${{ runner.temp }}/scratch/whitefoot-compute-deps
          key: ${{ runner.os }}-${{ matrix.os }}-computebench-${{ hashFiles('compiler/Cargo.lock', 'research/experiments/compute-bench/rayon/Cargo.lock', 'research/experiments/compute-bench/deps.sh') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.os }}-computebench-

      # Pinned to the image's own sources. A preinstalled browser repository
      # once returned a hash-sum mismatch and failed a run for a reason that
      # had nothing to do with what was being measured.
      - name: Install the host toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          test -f /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources \
                       -o Dir::Etc::sourceparts=- update
          sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources \
                       -o Dir::Etc::sourceparts=- install -y --no-install-recommends clang cmake
          test -x /usr/bin/clang
          test -x /usr/bin/clang++
          /usr/bin/clang --version
          cmake --version

      - name: Record the host toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          test -x /usr/bin/clang
          test -x /usr/bin/clang++
          /usr/bin/clang --version
          /usr/bin/clang++ --version
          command -v cmake
          cmake --version

      # So the bundle's `cargo build --locked --offline` works.
      - name: Fetch the recorded crate dependencies
        run: cargo fetch --locked --manifest-path compiler/Cargo.toml

      # The only network step in the bundle. Everything after it is offline.
      - name: Build the pinned schedulers
        run: make -C research/experiments/compute-bench deps

      - name: Build the kernel images
        run: make -C research/experiments/compute-bench build

      - name: Verify every form at every emitted width
        run: make -C research/experiments/compute-bench verify

      # The reducer's exit status is this step's. It fails only on a missing
      # or malformed row, never on a measurement.
      - name: Run the timed passes and print the table
        if: github.event_name == 'workflow_dispatch'
        run: |
          make -C research/experiments/compute-bench compare \
            PASSES=5 RESULTS="$RUNNER_TEMP/results"

      - name: Publish the table
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          {
            echo "## compute-bench (${{ matrix.os }})"
            echo
            echo '```text'
            cat "$RUNNER_TEMP/results/manifest.txt" 2>/dev/null \
              || echo "the manifest was not written"
            echo
            cat "$RUNNER_TEMP/results/table.txt" 2>/dev/null \
              || echo "the table was not written"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch'
        with:
          name: compute-bench-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/results/manifest.txt
            ${{ runner.temp }}/results/raw.tsv
            ${{ runner.temp }}/results/table.txt
            ${{ runner.temp }}/results/logs/

  par-suite:
    name: par-suite (${{ inputs.placement_runner }})
    if: inputs.experiment == 'par-suite'
    runs-on: ${{ inputs.placement_runner == '14900k' && fromJSON('["self-hosted", "14900k"]') || 'ubuntu-24.04' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Check the host tools
        run: |
          if [ -d "$HOME/.cargo/bin" ]; then
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          for tool in /usr/bin/clang cargo make python3 git awk sed timeout lscpu; do
            command -v "$tool"
          done
          lscpu
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            compiler/target
          key: ${{ runner.os }}-${{ runner.arch }}-par-suite-${{ inputs.placement_runner }}-${{ hashFiles('compiler/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-par-suite-${{ inputs.placement_runner }}-
      - name: Build the compiler and qualify the instrument
        run: |
          cargo fetch --locked --manifest-path compiler/Cargo.toml
          make -C compiler build
          make -C research/experiments/par-suite BUILD="$RUNNER_TEMP/par-instrument" "$RUNNER_TEMP/par-instrument/measure"
          python3 -B research/experiments/par-suite/check.py "$RUNNER_TEMP/par-instrument/measure"
      - name: Small visible pilot
        run: |
          python3 -B research/experiments/par-suite/run.py \
            --compiler "$GITHUB_WORKSPACE/compiler/target/gate/whitefootc" \
            --build-dir "$RUNNER_TEMP/par-pilot-build" --results "$RUNNER_TEMP/par-pilot" \
            --phase pilot --rounds 3 --workers 1 2 \
            --startup-ns 0 --allowance-source uncalibrated-zero
      - name: Measure the frozen baseline grid for a verdict
        env:
          ROUNDS: ${{ inputs.placement_rounds }}
          PLACEMENT_RUNNER: ${{ inputs.placement_runner }}
        run: |
          widths=(1 2 4 8 16)
          if [ "$PLACEMENT_RUNNER" = 14900k ]; then widths+=(32); fi
          python3 -B research/experiments/par-suite/run.py \
            --compiler "$GITHUB_WORKSPACE/compiler/target/gate/whitefootc" \
            --build-dir "$RUNNER_TEMP/par-build" --results "$RUNNER_TEMP/par-results" \
            --phase verdict --rounds "$ROUNDS" --workers "${widths[@]}" default \
            --startup-ns 0 --allowance-source uncalibrated-zero
          cat "$RUNNER_TEMP/par-results/summary.txt" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: par-suite-${{ inputs.placement_runner }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/par-results/
            ${{ runner.temp }}/par-pilot/
            ${{ runner.temp }}/par-build/generated/
            ${{ runner.temp }}/par-build/images/
            ${{ runner.temp }}/par-build/kernels-seq/
            ${{ runner.temp }}/par-build/kernels-par/

  placement:
    name: placement (${{ inputs.placement_runner }})
    if: inputs.experiment == 'placement'
    runs-on: ${{ inputs.placement_runner == '14900k' && fromJSON('["self-hosted", "14900k"]') || 'ubuntu-24.04' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A runner service starts without the login shell's PATH, where rustup
      # puts cargo; the step stops on the first missing tool and names it.
      - name: Check the host's tools
        run: |
          if [ -d "$HOME/.cargo/bin" ]; then
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          missing=
          for tool in /usr/bin/clang cargo make taskset perl python3 git nm; do
            command -v "$tool" >/dev/null || missing="$missing $tool"
          done
          if [ -n "$missing" ]; then
            echo "missing:$missing"
            exit 1
          fi
          /usr/bin/clang --version
          nproc
          lscpu

      - name: Build the unaligned and aligned compilers
        env:
          UNALIGNED: ${{ inputs.placement_unaligned }}
        run: |
          if [ -z "$UNALIGNED" ]; then
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            UNALIGNED=$(git merge-base origin/main HEAD)
          fi
          git worktree prune
          rm -rf "$RUNNER_TEMP/unaligned"
          git worktree add --detach "$RUNNER_TEMP/unaligned" "$UNALIGNED"
          for tree in "$RUNNER_TEMP/unaligned" "$GITHUB_WORKSPACE"; do
            cargo fetch --locked --manifest-path "$tree/compiler/Cargo.toml"
            make -C "$tree/compiler" build
          done

      - name: Build, verify and time every placement
        env:
          ROUNDS: ${{ inputs.placement_rounds }}
          CPUS: ${{ inputs.placement_cpus }}
          WHITEFOOT_CHECK_TIMEOUT: "6000"
        run: |
          rm -rf "$RUNNER_TEMP/placement"
          perl .github/run-check.pl code-placement/measure \
            bash research/investigations/code-placement/placement.sh \
            "$RUNNER_TEMP/unaligned" "$RUNNER_TEMP/unaligned/compiler/target/gate/whitefootc" \
            "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/compiler/target/gate/whitefootc" \
            "$RUNNER_TEMP/placement" "$ROUNDS" "$CPUS"

      - name: Reduce and publish
        run: |
          python3 -I research/investigations/code-placement/summarize.py \
            "$RUNNER_TEMP/placement/raw.tsv" > "$RUNNER_TEMP/placement/summary.txt"
          cat "$RUNNER_TEMP/placement/summary.txt"
          {
            echo "## code-placement (${{ inputs.placement_runner }})"
            echo
            echo '```text'
            head -3 "$RUNNER_TEMP/placement/manifest.txt"
            echo
            cat "$RUNNER_TEMP/placement/summary.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The event that reopened the investigation: the same aligned compiler
      # and flags over the runtime before and after a change that adds one
      # import, judged by the regression instrument itself. The event
      # revision's hand-written LLVM gets the alignment its successors carry.
      - name: Replay the runtime change under the aligned compiler
        if: inputs.placement_event != ''
        env:
          EVENT: ${{ inputs.placement_event }}
        run: |
          rm -rf "$RUNNER_TEMP/event" "$RUNNER_TEMP/event-images" "$RUNNER_TEMP/placement/event"
          git worktree add --detach "$RUNNER_TEMP/event" "$EVENT"
          sed -i -E 's/^(define .*\)) \{$/\1 align 64 {/' \
            "$RUNNER_TEMP/event/compiler/src/backend/ordinary_values.ll"
          make -s -C tests/performance build BUILD="$RUNNER_TEMP/event-images" \
            ROOT="$RUNNER_TEMP/event" WFC="$GITHUB_WORKSPACE/compiler/target/gate/whitefootc"
          status=0
          bash tests/performance/compare.sh "$RUNNER_TEMP/event-images" \
            "$RUNNER_TEMP/placement/fr" "$RUNNER_TEMP/placement/event" || status=$?
          {
            echo "### replay of $EVENT against this revision's runtime, aligned compiler"
            echo
            echo '```text'
            cat "$RUNNER_TEMP/placement/event/verdict.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "compare.sh exit status: $status"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-placement-${{ inputs.placement_runner }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/placement/manifest.txt
            ${{ runner.temp }}/placement/raw.tsv
            ${{ runner.temp }}/placement/summary.txt
            ${{ runner.temp }}/placement/logs/
            ${{ runner.temp }}/placement/event/

# TEMPORARY quick check for the 16-byte heap alignment PR (item
# wf-bl-heap-overaligned) after it merged main. It runs what the change
# touches, as the gate's own commands do, with no time budget record so no
# budget verdict is produced:
#   static   make static (spec archives, English text, design lint, clippy, ...)
#   lib      every lib test (heap alignment, completion, window and driver tests)
#   runtime  the runtime group (the C units around the heap and the
#            concurrent map's C probe)
#   corpus   the whole corpus target (program tests whose metered bytes the
#            wider element alignment could move)
#   conformance  the whole conformance adapter
#   windows  the native Windows heap alignment probe
#   darwin   the heap alignment tests on macOS arm64, with the alignments
#            max_align_t and malloc give there
#   arm-linux  the heap alignment tests on aarch64 Linux
# Removed before the full check; the gate fails while a tmp- workflow exists.
name: tmp-heap-overaligned

on:
  push:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0

jobs:
  quick:
    name: ${{ matrix.stage }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        stage: [static, lib, runtime, corpus, conformance]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Set the scratch root
        run: |
          echo "WHITEFOOT_SCRATCH_ROOT=$RUNNER_TEMP/whitefoot" >> "$GITHUB_ENV"

      - name: Name main as a local ref
        run: |
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          if git symbolic-ref -q HEAD | grep -qx refs/heads/main; then
            echo "checkout is on main"
          else
            git branch -f main origin/main
          fi
          git log --oneline -1 main

      - name: Select the design review base
        if: matrix.stage == 'static'
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          design_review_base=$(sh design/skill/review-base.sh "$GITHUB_EVENT_NAME" "$GITHUB_REF" "$PUSH_BEFORE")
          echo "DESIGN_REVIEW_BASE=$design_review_base" >> "$GITHUB_ENV"
          git log --oneline -1 "$design_review_base"

      - name: Install the host toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          ld.lld --version
          /usr/bin/clang --version
          python3 --version
          rustup default stable
          rustup component add clippy rustfmt
          cargo --version

      - name: Fetch locked compiler dependencies
        run: cargo fetch --locked --manifest-path compiler/Cargo.toml

      - name: Decline core dumps
        run: |
          sudo sysctl -w kernel.core_pattern=core
          cat /proc/sys/kernel/core_pattern

      - name: static
        if: matrix.stage == 'static'
        env:
          WHITEFOOT_CHECK_TIMEOUT: 1500
        run: make static

      - name: lib
        if: matrix.stage == 'lib'
        env:
          WHITEFOOT_CHECK_TIMEOUT: 1500
        run: |
          ulimit -c 0
          cd compiler
          perl ../.github/run-check.pl tmp/lib cargo test --profile gate --lib --locked --offline

      - name: corpus
        if: matrix.stage == 'corpus'
        env:
          WHITEFOOT_CHECK_TIMEOUT: 1500
        run: |
          ulimit -c 0
          cd compiler
          perl ../.github/run-check.pl tmp/corpus cargo test --profile gate --test corpus --locked --offline

      - name: conformance
        if: matrix.stage == 'conformance'
        env:
          WHITEFOOT_CHECK_TIMEOUT: 1500
        run: |
          ulimit -c 0
          cd compiler
          perl ../.github/run-check.pl tmp/conformance cargo test --profile gate --test corpus --locked --offline -- conformance::adapter:: --nocapture

      - name: runtime
        if: matrix.stage == 'runtime'
        env:
          WHITEFOOT_CHECK_TIMEOUT: 1500
        run: make check-group GROUP=runtime

  windows:
    name: windows
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned llvm-mingw
        timeout-minutes: 8
        run: |
          set -euo pipefail
          root=$(bash .github/toolchain/fetch-llvm-mingw.sh .github/toolchain/llvm-assets.json \
            "$RUNNER_TEMP/llvm-mingw-archives" "$RUNNER_TEMP/llvm-mingw" | tail -n 1)
          echo "LLVM_MINGW_ROOT=$root" >> "$GITHUB_ENV"
          cygpath -w "$root/bin" >> "$GITHUB_PATH"

      - name: Run the native Windows heap alignment probe
        timeout-minutes: 15
        env:
          CARGO_BUILD_JOBS: 2
          RUST_TEST_THREADS: 2
          RUST_MIN_STACK: 8388608
        run: |
          clang --version
          cargo test --manifest-path compiler/Cargo.toml --profile gate --locked \
            --test corpus -- native_windows::heap_and_pool_storage_meet_the_recorded_alignment

  darwin:
    name: darwin
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Record the alignments max_align_t and malloc give
        run: |
          uname -m
          cat > "$RUNNER_TEMP/align.c" <<'EOF'
          #include <stdint.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <stddef.h>
          int main(void) {
              unsigned worst = 16;
              for (size_t n = 1; n < 100000; n += 7) {
                  void *p = malloc(n);
                  unsigned a = 1;
                  while (((uintptr_t)p % (a * 2)) == 0 && a < 4096) a *= 2;
                  if (a < worst) worst = a;
                  void *q = realloc(p, n * 2 + 1);
                  unsigned b = 1;
                  while (((uintptr_t)q % (b * 2)) == 0 && b < 4096) b *= 2;
                  if (b < worst) worst = b;
                  free(q);
              }
              printf("alignof(max_align_t)=%zu smallest malloc/realloc alignment=%u\n",
                     _Alignof(max_align_t), worst);
              return 0;
          }
          EOF
          /usr/bin/clang -O1 -o "$RUNNER_TEMP/align" "$RUNNER_TEMP/align.c"
          "$RUNNER_TEMP/align"

      - name: Install the host toolchain
        run: |
          test -x /usr/bin/clang
          /usr/bin/clang --version
          rustup default stable
          cargo --version

      - name: Fetch locked compiler dependencies
        run: cargo fetch --locked --manifest-path compiler/Cargo.toml

      - name: Run the heap alignment tests
        env:
          WHITEFOOT_CHECK_TIMEOUT: 2400
        run: |
          cd compiler
          perl ../.github/run-check.pl tmp/darwin cargo test --profile gate --lib --locked --offline -- heap_alignment overaligned_meters

  arm-linux:
    name: arm-linux
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install the host toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          uname -m
          /usr/bin/clang --version
          rustup default stable
          cargo --version

      - name: Fetch locked compiler dependencies
        run: cargo fetch --locked --manifest-path compiler/Cargo.toml

      - name: Run the heap alignment tests
        env:
          WHITEFOOT_CHECK_TIMEOUT: 2400
        run: |
          cd compiler
          perl ../.github/run-check.pl tmp/arm-linux cargo test --profile gate --lib --locked --offline -- heap_alignment overaligned_meters

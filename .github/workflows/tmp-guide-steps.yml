# Temporary (wf-docs-getting-started): runs the guide reader, guide-steps.py,
# against a stand-in compiler, and against each doctored input it must refuse;
# runs the Linux acceptance on an already built candidate with a guide that
# forgets a library; and runs the repository's static and design checks, which
# a draft pull request's gate skips. Removed before the full check.
name: tmp-guide-steps

on:
  push:
    paths:
      - .github/workflows/tmp-guide-steps.yml
      - .github/toolchain/guide-steps.py
      - .github/toolchain/check-package.sh
      - docs/guide/getting-started.md
      - design/**

permissions:
  contents: read

jobs:
  reader:
    name: ${{ matrix.case }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        case:
          - positive
          - wrong-exit-status
          - wrong-rejection-text
          - rejected-program-accepted
          - bad-checksum
          - missing-block
          - help-fails
          - tilde-fence
          - other-download
          - prepare-macos
    steps:
      - uses: actions/checkout@v4

      - name: Run the case
        env:
          CASE: ${{ matrix.case }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/gs"
          rm -rf "$root"
          mkdir -p "$root/pkg/bin" "$root/dl" "$root/work"
          reader="$PWD/.github/toolchain/guide-steps.py"
          guide="$root/guide.md"
          cp docs/guide/getting-started.md "$guide"
          platform=linux
          expect_prepare=pass
          case "$CASE" in
            prepare-macos) platform=macos ;;
            tilde-fence) printf '\n~~~\nx\n~~~\n' >> "$guide"; expect_prepare='unsupported fence form' ;;
            other-download)
              sed -i 's|/whitefootc-linux-x86_64-bundled.tar.gz"|/evil.tar.gz"|' "$guide"
              expect_prepare='not the candidate files' ;;
          esac
          prepared=0
          python3 -I "$reader" prepare "$guide" "$platform" "$root/dl" "$root/work" "$root/tools" \
            > "$root/prepare.txt" 2>&1 || prepared=$?
          cat "$root/prepare.txt"
          if [ "$expect_prepare" != pass ]; then
            test "$prepared" -ne 0
            grep -F "$expect_prepare" "$root/prepare.txt"
            echo "refused as intended: $expect_prepare"
            exit 0
          fi
          test "$prepared" -eq 0
          if [ "$CASE" = prepare-macos ]; then
            python3 -I -c "
          import json, sys
          expect = json.load(open(sys.argv[1]))
          assert len(expect['skipped']) == 1 and 'xcode-select --install' in expect['skipped'][0]['command'], expect['skipped']
          assert any(b['kind'] == 'checksum' for b in expect['blocks'])
          " "$root/tools/expect.json"
            grep -F 'shasum -a 256 -c --ignore-missing SHA256SUMS' "$root/tools/install.sh"
            ! grep -F 'xcode-select' "$root/tools/install.sh" | grep -v '^# Not run'
            exit 0
          fi
          # A stand-in for the packaged compiler, behaving as the guide says
          # except where the case makes it wrong.
          python3 -I - "$root" <<'PY'
          import json, os, pathlib, sys
          root, case = pathlib.Path(sys.argv[1]), os.environ['CASE']
          expect = json.loads((root / 'tools' / 'expect.json').read_text())
          text = next(b['output'] for b in expect['blocks'] if b['kind'] == 'reject')
          if case == 'wrong-rejection-text':
              text = text.replace('OP-2', 'OP-3')
          first = 5 if case == 'wrong-exit-status' else 4
          check_status = 0 if case == 'rejected-program-accepted' else 1
          # The real compiler prints its usage as a usage error and exits 1.
          help_line = 'exit 1' if case == 'help-fails' else 'echo "whitefootc: usage: whitefootc [--check]" >&2; exit 1'
          (root / 'pkg' / 'rejection.txt').write_text(text)
          (root / 'pkg' / 'bin' / 'whitefootc').write_text(f'''#!/bin/bash
          here=$(cd "$(dirname "$0")" && pwd)
          case "$1" in
            --help) {help_line}; exit 0 ;;
            --check) cat "$here/../rejection.txt"; exit {check_status} ;;
          esac
          case "$1" in
            first.wf) code={first} ;;
            checked.wf) code=1 ;;
            *) echo "unexpected program $1" >&2; exit 2 ;;
          esac
          printf '#!/bin/bash\\nexit %s\\n' "$code" > "$3"
          chmod +x "$3"
          ''')
          (root / 'pkg' / 'bin' / 'whitefootc').chmod(0o755)
          PY
          archive=whitefootc-linux-x86_64-bundled.tar.gz
          tar -czf "$root/dl/$archive" -C "$root/pkg" bin rejection.txt
          (cd "$root/dl" && sha256sum "$archive" > SHA256SUMS)
          if [ "$CASE" = bad-checksum ]; then
            sed -i 's/^[0-9a-f]\{8\}/00000000/' "$root/dl/SHA256SUMS"
          fi
          sudo apt-get update
          # The guide's commands as a user with sudo runs them, from the
          # directory they work in.
          (cd "$root/work" && sudo bash "$root/tools/install.sh") > "$root/install.txt" 2>&1 || true
          tail -n 40 "$root/install.txt"
          if [ "$CASE" = missing-block ]; then
            sudo rm "$root/tools/blocks/08.status"
          fi
          verified=0
          python3 -I "$reader" verify "$root/tools" > "$root/verify.txt" 2>&1 || verified=$?
          cat "$root/verify.txt"
          case "$CASE" in
            positive) test "$verified" -eq 0 ;;
            *)
              test "$verified" -ne 0
              case "$CASE" in
                wrong-exit-status) needle='the guide says 4' ;;
                wrong-rejection-text) needle='rejection text differs' ;;
                rejected-program-accepted) needle='was accepted' ;;
                bad-checksum) needle='guide block 3' ;;
                missing-block) needle='did not run' ;;
                help-fails) needle='guide block 5' ;;
              esac
              grep -F "$needle" "$root/verify.txt"
              echo "refused as intended: $needle" ;;
          esac

  static:
    name: static and design checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Name main as a local ref
        run: |
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          git branch -f main origin/main

      - name: Select the design review base
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          design_review_base=$(sh design/skill/review-base.sh "$GITHUB_EVENT_NAME" "$GITHUB_REF" "$PUSH_BEFORE")
          echo "DESIGN_REVIEW_BASE=$design_review_base" >> "$GITHUB_ENV"
          git log --oneline -1 "$design_review_base"

      - run: make static

      - run: make design-ready

  missing-library:
    name: guide lists ${{ matrix.case }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        case: [intact, without-libc-dev, without-libxml2]
    steps:
      - uses: actions/checkout@v4

      # The candidate the compiler-release dry run built and qualified at
      # f274bc63; the acceptance scripts come from this checkout.
      - uses: actions/download-artifact@v4
        with:
          name: release-bundled-candidate
          path: candidate
          run-id: 39901641548
          github-token: ${{ github.token }}

      - name: Run linux-absent with the guide's apt-get line as doctored
        env:
          CASE: ${{ matrix.case }}
        run: |
          set -euo pipefail
          mkdir -p guide out/logs
          cp docs/guide/getting-started.md guide/
          case "$CASE" in
            without-libc-dev)
              sed -i 's/^sudo apt-get install libc6-dev libgcc-13-dev /sudo apt-get install /' guide/getting-started.md ;;
            without-libxml2)
              sed -i 's/^\(sudo apt-get install .*\) libxml2 /\1 /' guide/getting-started.md ;;
          esac
          grep -n '^sudo apt-get install' guide/getting-started.md
          status=0
          docker run --rm --platform linux/amd64 \
            --mount "type=bind,src=$PWD/candidate,dst=/input/candidate,readonly" \
            --mount "type=bind,src=$PWD/tests/package-fixtures,dst=/input/fixtures,readonly" \
            --mount "type=bind,src=$PWD/.github/toolchain,dst=/input/toolchain,readonly" \
            --mount "type=bind,src=$PWD/guide,dst=/input/guide,readonly" \
            --mount "type=bind,src=$PWD/out,dst=/output" \
            --env MODE=linux-absent ubuntu:24.04 /bin/bash -c '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends python3 strace
              bash /input/toolchain/check-package.sh \
                /input/candidate/whitefootc-linux-x86_64-bundled.tar.gz /input/fixtures \
                /output "$MODE" /input/guide/getting-started.md
            ' > out/logs/container.txt 2>&1 || status=$?
          tail -n 25 out/logs/container.txt
          if [ "$CASE" = intact ]; then
            test "$status" -eq 0
          else
            test "$status" -ne 0
            grep -E 'guide-steps: guide block 6 \(line [0-9]+\) printed' out/logs/container.txt
            echo "refused as intended: $CASE"
          fi

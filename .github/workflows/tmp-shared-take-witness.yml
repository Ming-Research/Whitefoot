# Temporary phase-2 count sweep. Remove after the hosted comparison is
# complete; the fixed required regression remains in completion-test.
name: tmp-shared-take-witness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  witness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set scratch and evidence paths
        run: |
          echo "WHITEFOOT_SCRATCH_ROOT=$RUNNER_TEMP/shared-take" >> "$GITHUB_ENV"
          echo "WHITEFOOT_TIME_BUDGET_RECORD=$RUNNER_TEMP/shared-take-budget.txt" >> "$GITHUB_ENV"
          echo "WITNESS_EVIDENCE=$RUNNER_TEMP/shared-take-evidence" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/shared-take-evidence"

      - name: Record construction identity
        run: |
          {
            git rev-parse HEAD
            uname -a
            clang --version
            python3 --version
          } > "$WITNESS_EVIDENCE/construction.txt"

      - name: Build only the native witness
        env:
          WHITEFOOT_CHECK_TIMEOUT: 120
        run: |
          status=0
          perl .github/run-check.pl shared-take-witness-build \
            make -C compiler -j2 shared-take-witness-build CC=clang LLVM_CC=clang \
            > "$WITNESS_EVIDENCE/build.log" 2>&1 || status=$?
          cat "$WITNESS_EVIDENCE/build.log"
          exit "$status"

      - name: Verify count verdict sensitivity
        run: |
          python3 research/investigations/shared-take-fairness/run.py --self-test \
            > "$WITNESS_EVIDENCE/verdict-controls.log" 2>&1
          cat "$WITNESS_EVIDENCE/verdict-controls.log"

      - name: Required runtime regression and negative control
        run: |
          status=0
          make -C compiler shared-take-witness CC=clang LLVM_CC=clang \
            > "$WITNESS_EVIDENCE/required-checks.log" 2>&1 || status=$?
          cat "$WITNESS_EVIDENCE/required-checks.log"
          exit "$status"

      - name: Pilot then repeated count trials (bound failures fail the job)
        env:
          WHITEFOOT_CHECK_TIMEOUT: 240
        run: |
          ulimit -c 0
          status=0
          perl .github/run-check.pl shared-take-witness-counts \
            python3 research/investigations/shared-take-fairness/run.py \
            --binary "$WHITEFOOT_SCRATCH_ROOT/whitefoot-completion-test/shared-take-witness" \
            --output "$WITNESS_EVIDENCE/counts" --require-bound \
            > "$WITNESS_EVIDENCE/sweep.log" 2>&1 || status=$?
          cat "$WITNESS_EVIDENCE/sweep.log"
          exit "$status"

      - name: Enforce stage budgets
        if: always()
        run: perl .github/run-check.pl --budget-verdict "$WHITEFOOT_TIME_BUDGET_RECORD"

      - name: Upload counts, raw exits and construction logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-take-witness-${{ matrix.os }}
          path: ${{ runner.temp }}/shared-take-evidence
          if-no-files-found: error

# Temporary acceptance measurement for claude/unwind-resume; remove before ready.
# Compiles the witness with this branch's compiler, samples it with perf's DWARF
# call graph and requires 95% of hot-leaf samples to reach the waiting function.
name: tmp-unwind-accept

on:
  push:
    branches: [claude/unwind-resume]

permissions:
  contents: read

jobs:
  accept:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install the host toolchain and kernel perf
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          rustup default stable
          sudo apt-get update
          sudo apt-get install -y binutils linux-tools-common
          kernel=$(uname -r)
          if ! sudo apt-get install -y "linux-tools-$kernel"; then
            sudo apt-get install -y linux-tools-generic
          fi
          perf_binary="/usr/lib/linux-tools/$kernel/perf"
          if [ ! -x "$perf_binary" ]; then
            perf_binary=$(find -L /usr/lib/linux-tools -type f -name perf -executable | sort -V | tail -n 1)
            echo "fallback perf: $perf_binary (kernel $kernel)"
          fi
          test -x "$perf_binary"
          echo "UNWIND_PERF=$perf_binary" >> "$GITHUB_ENV"
          sudo sysctl kernel.perf_event_paranoid=-1
          "$perf_binary" --version
          cargo fetch --locked --manifest-path compiler/Cargo.toml
      - name: Build the compiler and compile the witness
        shell: bash
        run: |
          set -euo pipefail
          witness=$(find . -name witness.wf -path '*unwind-resume*' -not -path './.git/*')
          test -f "$witness"
          git rev-parse HEAD
          cargo build --manifest-path compiler/Cargo.toml --profile gate --locked --offline --bin whitefootc
          mkdir -p "$RUNNER_TEMP/accept"
          compiler/target/gate/whitefootc --full-lto "$witness" -o "$RUNNER_TEMP/accept/witness"
          readelf -lW "$RUNNER_TEMP/accept/witness" | grep -E 'LOAD|Type'
      - name: Sample the witness and count the hot-leaf chains
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/accept"
          cat > count.py <<'PY'
          import re, subprocess, sys, os, time, math, json
          perf = os.environ['UNWIND_PERF']
          binary = os.path.abspath('witness')
          nm = subprocess.run(['nm', '-nS', '--defined-only', binary], capture_output=True, text=True, check=True).stdout
          names = []
          for line in nm.splitlines():
              match = re.match(r'^[0-9a-fA-F]+\s+[0-9a-fA-F]+\s+[tT]\s+(.+)$', line)
              if match:
                  names.append(match.group(1))
          leaf = {n for n in names if re.match(r'^wf[_.]hot_leaf(?:[.$]|$)', n)}
          resume = {n for n in names if re.match(r'^wf[_.]awaitable_loop(?:\$instance\$[^.]*)?\.resume(?:\.|$)', n)}
          print('leaf symbols:', sorted(leaf)); print('resume symbols:', sorted(resume))
          if not leaf or not resume:
              sys.exit('witness lacks the expected symbols')
          def run(batches):
              start = time.monotonic()
              subprocess.run([binary] + ['batch'] * batches, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, check=True, timeout=60)
              return time.monotonic() - start
          duration = run(16)
          batches = max(1, min(5000, math.ceil(16 * 3.5 / max(duration, 0.001))))
          print('calibration: 16 batches took %.3f s; recording %d batches' % (duration, batches))
          def clean(token):
              return re.sub(r'\+0x[0-9a-fA-F]+$', '', token)
          def count(script):
              hot = reach = main_body = entry = 0
              for sample in re.split(r'\n\s*\n', script):
                  stack = []
                  for line in sample.splitlines():
                      m = re.match(r'^\s+([0-9a-fA-F]+)\s+(\S+)', line)
                      if m:
                          stack.append(clean(m[2]))
                  if not stack or stack[0] not in leaf:
                      continue
                  hot += 1
                  present = set(stack)
                  reach += bool(present & resume)
                  main_body += 'wf__main_body' in present
                  entry += 'wf__floor_entry' in present
              return hot, reach, main_body, entry
          # Parser controls: a nonhot first IP is excluded; a chain without resume is a miss.
          fake = ("s1:\n\t10 wf_hot_leaf+0x1 (w)\n\t30 wf_awaitable_loop.resume (w)\n\t50 main (w)\n\n"
                  "s2:\n\t10 wf_hot_leaf (w)\n\t20 wf_ordinary (w)\n\n"
                  "s3:\n\t10 unrelated (w)\n\t20 wf_hot_leaf (w)\n")
          saved = (leaf, resume)
          leaf, resume = {'wf_hot_leaf'}, {'wf_awaitable_loop.resume'}
          control = count(fake)
          leaf, resume = saved
          assert control[:2] == (2, 1), control
          results = {}
          failed = False
          for label, graph in [('dwarf16384', 'dwarf,16384'), ('dwarf65528', 'dwarf,65528')]:
              data = label + '.data'
              subprocess.run([perf, 'record', '-e', 'cpu-clock:u', '-F', '499', '--call-graph', graph, '-o', data, '--', binary] + ['batch'] * batches,
                             stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, check=True, timeout=120)
              script = subprocess.run([perf, 'script', '--no-demangle', '-i', data], capture_output=True, text=True, check=True, timeout=300).stdout
              hot, reach, main_body, entry = count(script)
              fraction = reach / hot if hot else 0
              results[label] = dict(hot=hot, resume=reach, main_body=main_body, floor_entry=entry, fraction=fraction)
              print('%s: hot-leaf samples %d, reach resume %d (%.1f%%), wf__main_body %d, wf__floor_entry %d' % (label, hot, reach, 100 * fraction, main_body, entry))
              if hot < 500 or fraction < 0.95:
                  failed = True
          print(json.dumps(results))
          if failed:
              sys.exit('acceptance not met: fewer than 95% of hot-leaf samples reach resume, or too few samples')
          print('acceptance met: at least 95% of hot-leaf samples reach the waiting function in both stack-copy sizes')
PY
          python3 count.py

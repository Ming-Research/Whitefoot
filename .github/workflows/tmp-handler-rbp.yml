# Temporary machine-code evidence for the dispatch parts' RBP change
# (compiler/match-dispatch-lowering). Remove this file before the full check:
# the gate's job `No temporary workflow` fails while it exists.
#
# It builds the compiler at the pushed commit (candidate) and at the merge base
# with main (base) by research/experiments/compiler-compare/arms.sh, compiles
# the wasm interpreter v2h with each, disassembles every handler and the
# C-convention boundary, and runs the candidate on CoreMark. It FAILS when:
#   - the candidate has a push or pop of %rbp in any `wf_run.arm.*` or
#     `wf_run.cold*` function;
#   - the base has no %rbp save in any handler of one of the families Clz, Sub,
#     And (32- and 64-bit arms) and GlobalSet (the control: a check that cannot
#     fail on the old compiler shows nothing);
#   - the candidate's `wf_run` does not hold exactly one `push %rbp` and at
#     least one `pop %rbp`;
#   - the candidate's CoreMark exits non-zero or one of the CRCs 0xe714, 0x1fd7,
#     0x8e3a, 0x4983 differs;
#   - the checker's own self-test does not reject a hand-made wrong input.
# Tail-jump register copies are counted and reported, not failed (LLVM 22's
# tail-call target class, research/investigations/match-dispatch/DESIGN.md).
#
# research-boundary: temporary
# The generator of v2h is under research/; the ordinary static check refuses
# that for a push-triggered workflow, which is another reason this file is
# removed before the full check.
name: tmp-handler-rbp

on:
  push:
    branches:
      - work-238-26e0fade
      - "wf-try/work-238-26e0fade/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tmp-handler-rbp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  handler-code:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      LC_ALL: C
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Prepare diagnostic output
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/handler-rbp"
          mkdir -p "$out"
          echo "OUT=$out" >> "$GITHUB_ENV"
          echo "WHITEFOOT_SCRATCH_ROOT=$RUNNER_TEMP/whitefoot" >> "$GITHUB_ENV"
          git rev-parse HEAD > "$out/candidate-revision.txt"

      - name: Install the pinned host toolchain as gate.yml does
        run: |
          set -euo pipefail
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          sudo apt-get install -y -qq binutils
          rustup default stable
          { /usr/bin/clang --version; objdump --version | head -1; } > "$OUT/toolchain.txt"
          cat "$OUT/toolchain.txt"

      - name: Write the checker
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/rbp_check.py" <<'PY'
          import json, re, subprocess, sys
          from pathlib import Path

          INSTRUCTION = re.compile(r"^[ \t]*[0-9a-f]+:[ \t]+([a-z][a-z0-9]*)[ \t]*(.*?)[ \t]*$", re.M)
          REGISTER_COPY = re.compile(r"(%(?:r\w+|e\w+)),\s*(%r\w+)\s*$")
          EXPECTED_CRC = {"crclist": "0xe714", "crcmatrix": "0x1fd7",
                          "crcstate": "0x8e3a", "crcfinal": "0x4983"}
          # The arms of the generated interpreter are named by value width:
          # the control families are the ones the item names, each by its
          # 32- and 64-bit arms, and a family is controlled when any of its
          # base handlers saves %rbp.
          CONTROL = {"Clz": ["I32Clz", "I64Clz"], "Sub": ["I32Sub", "I64Sub"],
                     "And": ["I32And", "I64And"], "GlobalSet": ["GlobalSet"]}
          CONTROL_ARMS = [arm for arms in CONTROL.values() for arm in arms]

          def annotate(level, title, lines):
              # Annotations are readable without credentials, unlike the log
              # and the artifact, so the numbers reach the person who reads
              # the run from the host's check-run page.
              text = "\n".join(lines).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::{level} title={title}::{text}")

          def instructions(body):
              return [(m[1], m[2]) for m in INSTRUCTION.finditer(body)]

          def rbp_counts(body):
              code = instructions(body)
              pushes = sum(op in {"push", "pushq"} and a == "%rbp" for op, a in code)
              pops = sum(op in {"pop", "popq"} and a == "%rbp" for op, a in code)
              return pushes, pops

          def tail_copies(body):
              code = instructions(body)
              found = 0
              for index, (opcode, operands) in enumerate(code):
                  if opcode not in {"jmp", "jmpq"} or not re.fullmatch(r"\*%r\w+", operands):
                      continue
                  target = operands[1:]
                  before = index - 1
                  while before >= 0 and code[before][0] in {"pop", "popq", "add", "addq", "lea", "leaq"}:
                      operation, arguments = code[before]
                      if operation not in {"pop", "popq"} and not arguments.endswith(",%rsp"):
                          break
                      before -= 1
                  if before >= 0:
                      operation, arguments = code[before]
                      copy = REGISTER_COPY.fullmatch(arguments)
                      if operation in {"mov", "movq"} and copy and copy[2] == target and copy[1] != target:
                          found += 1
              return found

          def arm_names(source):
              start = source.index("\nfn run(") + 1
              end = source.index("\nfn ", start)
              arms = re.findall(r"^      (\w+)\([^\n]*\) => \{", source[start:end], re.M)
              if not arms or len(set(arms)) != len(arms) or any(n not in arms for n in CONTROL_ARMS):
                  raise ValueError("generated run arm map is empty, ambiguous or lacks a control handler")
              return arms

          def report(arm_dir):
              arm_dir = Path(arm_dir)
              arms = arm_names((arm_dir / "v2h.wf").read_text())
              binary = arm_dir / "v2h"
              symbols = subprocess.check_output(
                  ["nm", "-S", "--defined-only", "--format=posix", str(binary)], text=True)
              inventory = {}
              for line in symbols.splitlines():
                  fields = line.split()
                  if len(fields) == 4 and fields[1] in {"t", "T", "w", "W"}:
                      inventory[fields[0]] = (int(fields[2], 16), int(fields[3], 16))
              names = [f"wf_run.arm.{i}" for i in range(len(arms))]
              missing = [n for n in names + ["wf_run"] if n not in inventory]
              if missing:
                  raise ValueError(f"missing symbols: {missing}")
              selected = sorted(set(names) | {n for n in inventory if n.startswith(("wf_run.arm.", "wf_run.cold"))})
              result = {"handlers": {}, "arm_of": dict(zip(names, arms))}
              with (arm_dir / "handlers.asm").open("w") as asm:
                  for name in selected + ["wf_run"]:
                      start, size = inventory[name]
                      if size == 0:
                          raise ValueError(f"empty symbol range: {name}")
                      body = subprocess.check_output(
                          ["objdump", "-d", "--no-show-raw-insn", f"--start-address={start}",
                           f"--stop-address={start + size}", str(binary)], text=True)
                      asm.write(f"\n# {name}\n{body}")
                      code = instructions(body)
                      if not code:
                          raise ValueError(f"no disassembled instructions: {name}")
                      pushes, pops = rbp_counts(body)
                      result["handlers"][name] = {
                          "instructions": len(code), "rbp_pushes": pushes,
                          "rbp_pops": pops, "tail_copies": tail_copies(body)}
              return result

          def evaluate(candidate, base):
              failures = []
              for name, row in candidate["handlers"].items():
                  if name == "wf_run":
                      if row["rbp_pushes"] != 1 or row["rbp_pops"] < 1:
                          failures.append(f"candidate boundary wf_run: {row['rbp_pushes']} pushes, {row['rbp_pops']} pops of %rbp")
                  elif row["rbp_pushes"] or row["rbp_pops"]:
                      failures.append(f"candidate {name}: {row['rbp_pushes']} pushes, {row['rbp_pops']} pops of %rbp")
              by_arm = {arm: sym for sym, arm in base["arm_of"].items()}
              for family, family_arms in CONTROL.items():
                  rows = [base["handlers"].get(by_arm.get(arm, "")) for arm in family_arms]
                  if not any(r and (r["rbp_pushes"] or r["rbp_pops"]) for r in rows):
                      failures.append(f"control: no base handler of {family} ({', '.join(family_arms)}) saves %rbp, so the check cannot fail on the old compiler")
              return failures

          def crc_failure(status, stdout):
              if status:
                  return f"CoreMark exited with status {status}"
              values = dict(re.findall(r"\[0\](crc\w+)\s*:\s*(0x[0-9a-f]+)", stdout))
              if any(values.get(k) != v for k, v in EXPECTED_CRC.items()):
                  return f"CoreMark CRC mismatch: expected {EXPECTED_CRC}, observed {values}"
              return None

          def row(pushes=0, pops=0):
              return {"instructions": 8, "rbp_pushes": pushes, "rbp_pops": pops, "tail_copies": 0}

          def synthetic(clean):
              handlers = {"wf_run": row(1, 1)}
              arm_of = {}
              for index, arm in enumerate(CONTROL_ARMS + ["Other"]):
                  symbol = f"wf_run.arm.{index}"
                  arm_of[symbol] = arm
                  handlers[symbol] = row() if clean or arm == "Other" else row(1, 1)
              return {"handlers": handlers, "arm_of": arm_of}

          def self_test():
              good = evaluate(synthetic(True), synthetic(False))
              assert not good, good
              dirty = synthetic(True)
              dirty["handlers"]["wf_run.arm.4"] = row(1, 1)
              assert evaluate(dirty, synthetic(False)), "a handler push passed"
              popped = synthetic(True)
              popped["handlers"]["wf_run.arm.2"] = row(0, 1)
              assert evaluate(popped, synthetic(False)), "a handler pop passed"
              no_boundary = synthetic(True)
              no_boundary["handlers"]["wf_run"] = row(0, 0)
              assert evaluate(no_boundary, synthetic(False)), "a missing boundary save passed"
              two_pushes = synthetic(True)
              two_pushes["handlers"]["wf_run"] = row(2, 2)
              assert evaluate(two_pushes, synthetic(False)), "two boundary saves passed"
              assert evaluate(synthetic(True), synthetic(True)), "a base without saves passed"
              one_family_clean = synthetic(False)
              for symbol, arm in one_family_clean["arm_of"].items():
                  if arm in CONTROL["Sub"]:
                      one_family_clean["handlers"][symbol] = row()
              assert evaluate(synthetic(True), one_family_clean), "a base family without saves passed"
              one_arm_enough = synthetic(False)
              one_arm_enough["handlers"]["wf_run.arm.3"] = row()
              assert not evaluate(synthetic(True), one_arm_enough), "a family with one saving arm was refused"
              annotation = []
              real_print = print
              try:
                  import builtins
                  builtins.print = lambda *args, **kwargs: annotation.append(" ".join(map(str, args)))
                  annotate("notice", "t", ["a%b", "c"])
              finally:
                  builtins.print = real_print
              assert annotation == ["::notice title=t::a%25b%0Ac"], annotation
              assert rbp_counts("  1: push %rbp\n  2: pop %rbp\n") == (1, 1)
              assert rbp_counts("  1: push %rbx\n") == (0, 0)
              assert tail_copies("  1: mov %r10,%rax\n  2: jmp *%rax\n") == 1
              assert tail_copies("  1: jmp *0x8(%r9)\n") == 0
              try:
                  arm_names("\nfn run() {\n}\nfn end() {}")
              except ValueError:
                  pass
              else:
                  raise AssertionError("an empty arm map passed")
              ok = "".join(f"[0]{k}: {v}\n" for k, v in EXPECTED_CRC.items())
              assert not crc_failure(0, ok)
              for name, value in EXPECTED_CRC.items():
                  assert crc_failure(0, ok.replace(value, "0xffff")), name
                  assert crc_failure(0, ok.replace(f"[0]{name}: {value}\n", "")), name
              assert crc_failure(1, ok)
              print("self-test: every wrong input was rejected")

          def main():
              command = sys.argv[1]
              if command == "self-test":
                  self_test()
              elif command == "inspect":
                  out = Path(sys.argv[2])
                  candidate = report(out / "candidate")
                  base = report(out / "base")
                  (out / "report.json").write_text(json.dumps({"candidate": candidate, "base": base}, indent=1))
                  reports = {"candidate": candidate, "base": base}
                  lines = []
                  for kind, rep in reports.items():
                      total = sum(r["instructions"] for n, r in rep["handlers"].items() if n != "wf_run")
                      copies = sum(r["tail_copies"] for n, r in rep["handlers"].items() if n != "wf_run")
                      saves = sum(1 for n, r in rep["handlers"].items() if n != "wf_run" and (r["rbp_pushes"] or r["rbp_pops"]))
                      lines.append(f"{kind}: {len(rep['handlers']) - 1} handlers, {total} instructions, "
                                   f"{saves} handlers with %rbp saves, {copies} tail-jump register copies")
                  for arm in CONTROL_ARMS:
                      for kind, rep in reports.items():
                          sym = {a: s for s, a in rep["arm_of"].items()}[arm]
                          r = rep["handlers"][sym]
                          lines.append(f"{kind} {arm} ({sym}): {r['instructions']} instructions, "
                                       f"{r['rbp_pushes']} push/{r['rbp_pops']} pop of %rbp, {r['tail_copies']} tail copies")
                  boundary = candidate["handlers"]["wf_run"]
                  lines.append(f"candidate boundary wf_run: {boundary['instructions']} instructions, "
                               f"{boundary['rbp_pushes']} push/{boundary['rbp_pops']} pop of %rbp")
                  failures = evaluate(candidate, base)
                  lines += failures[:40] or ["no forbidden instruction in the candidate; the control fails on the base as required"]
                  (out / "machine-code-check.txt").write_text("\n".join(lines) + "\n")
                  print("\n".join(lines))
                  annotate("error" if failures else "notice", "machine-code-check", lines)
                  if failures:
                      raise SystemExit(1)
              elif command == "crc":
                  out = Path(sys.argv[2])
                  result = subprocess.run(
                      [str(out / "candidate" / "v2h"), "coremark.wasm", "0x0", "0x0", "0x66", "2000"],
                      cwd=out, capture_output=True, text=True, check=False)
                  (out / "coremark.stdout.txt").write_text(result.stdout)
                  print(result.stdout, end="")
                  failure = crc_failure(result.returncode, result.stdout)
                  crc_lines = [line for line in result.stdout.splitlines() if re.search(r"crc|Iterations|Total time", line)]
                  annotate("error" if failure else "notice", "coremark-crc", [failure or "CRCs as recorded"] + crc_lines[:12])
                  if failure:
                      raise SystemExit(failure)
                  print("CoreMark 2000-iteration CRC oracle passed")
              else:
                  raise SystemExit("usage: rbp_check.py self-test | inspect OUT | crc OUT")

          main()
          PY

      - name: Self-test the checker on hand-made wrong inputs
        run: perl .github/run-check.pl tmp-handler-rbp/self-test python3 "$RUNNER_TEMP/rbp_check.py" self-test

      - name: Build the candidate and the merge-base compilers
        env:
          WHITEFOOT_CHECK_TIMEOUT: "5400"
        run: |
          set -euo pipefail
          perl .github/run-check.pl tmp-handler-rbp/arms bash research/experiments/compiler-compare/arms.sh "$(git rev-parse HEAD)" "" "$OUT"
          cat "$OUT/manifest.txt"

      - name: Compile v2h with each compiler
        run: |
          set -euo pipefail
          for arm in candidate base; do
            mkdir -p "$OUT/$arm"
            python3 -B research/experiments/match-dispatch/wasm/gen.py "$OUT/$arm/v2h.wf"
            perl .github/run-check.pl "tmp-handler-rbp/compile-$arm" "$OUT/arms/$arm/compiler/target/gate/whitefootc" --dispatch-ledger "$OUT/$arm/v2h.wf" -o "$OUT/$arm/v2h" 2>&1 | tee "$OUT/$arm/v2h-compile.log"
          done
          sha256sum "$OUT/candidate/v2h" "$OUT/base/v2h" "$OUT/candidate/v2h.wf" > "$OUT/image-sha256.txt"

      - name: Inspect every handler and the C-convention boundary
        run: perl .github/run-check.pl tmp-handler-rbp/inspect python3 "$RUNNER_TEMP/rbp_check.py" inspect "$OUT"

      - name: Run the candidate's CoreMark CRC oracle
        if: always()
        run: |
          set -euo pipefail
          test -x "$OUT/candidate/v2h"
          git clone --quiet https://github.com/mbbill/Silverfir-nano "$OUT/sf"
          git -C "$OUT/sf" checkout --quiet 5f248e44
          cp "$OUT/sf/benchmarks/wasi/coremark/coremark.wasm" "$OUT/coremark.wasm"
          blob=$(git hash-object "$OUT/coremark.wasm")
          echo "coremark.wasm blob $blob"
          case "$blob" in 70b4d2165e7f*) ;; *) echo "unexpected CoreMark module" >&2; exit 1;; esac
          perl .github/run-check.pl tmp-handler-rbp/crc python3 "$RUNNER_TEMP/rbp_check.py" crc "$OUT"

      - name: Retain the disassembly, report and CRC output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tmp-handler-rbp-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.OUT }}/*.txt
            ${{ env.OUT }}/report.json
            ${{ env.OUT }}/candidate/handlers.asm
            ${{ env.OUT }}/candidate/v2h-compile.log
            ${{ env.OUT }}/base/handlers.asm
            ${{ env.OUT }}/base/v2h-compile.log
          if-no-files-found: warn

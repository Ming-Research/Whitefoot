# Temporary: the focused checks of the integer element contract work
# (lang-contract-element-term): the compiler build and lint, every unit
# test, every conformance case's verdict with each failing case listed, and
# the repository-level static checks with the change-log check against the
# branch's fork point. Removed before the branch is ready.
name: tmp-element-terms

on:
  push:
    branches: [lang-contract-element-term]

permissions:
  contents: read

jobs:
  elements:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install the host toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          rustup default stable
          cargo --version
          cargo fetch --locked --manifest-path compiler/Cargo.toml
      - name: Decline core dumps
        run: |
          sudo sysctl -w kernel.core_pattern=core
          cat /proc/sys/kernel/core_pattern
      - name: Build the compiler
        run: |
          perl .github/run-check.pl elements-build cargo build --manifest-path compiler/Cargo.toml \
            --profile gate --locked --offline --bin whitefootc
      - name: Lint the compiler as the gate does
        if: always()
        run: |
          rustup component add clippy
          perl .github/run-check.pl elements-lint cargo clippy --manifest-path compiler/Cargo.toml \
            --all-targets --locked --offline -- -D warnings
      - name: Run every unit test
        if: always()
        run: |
          perl .github/run-check.pl elements-unit cargo test --manifest-path compiler/Cargo.toml \
            --profile gate --locked --offline --lib
      - name: Reach every conformance verdict and list each failing case
        if: always()
        run: |
          ulimit -c 0
          set +e
          perl .github/run-check.pl elements-corpus cargo test --manifest-path compiler/Cargo.toml \
            --profile gate --locked --offline --test corpus -- \
            conformance::adapter::the_corpus_reaches_its_declared_verdict_through_the_ordinary_compiler_path \
            --nocapture > "$RUNNER_TEMP/corpus.log" 2>&1
          status=$?
          set -e
          grep -E -A6 '^  Fail ' "$RUNNER_TEMP/corpus.log" || true
          grep -E 'conformance adapter: Pass=' "$RUNNER_TEMP/corpus.log" || tail -60 "$RUNNER_TEMP/corpus.log"
          exit "$status"
  # The rest of the corpus group: the programs, documentation examples and
  # CLI harnesses, since every element read in a body now forms a term.
  corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install the host toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          rustup default stable
          cargo fetch --locked --manifest-path compiler/Cargo.toml
      - name: Decline core dumps
        run: sudo sysctl -w kernel.core_pattern=core
      - name: Run the corpus tests except the conformance adapter
        run: |
          ulimit -c 0
          perl .github/run-check.pl elements-programs cargo test --manifest-path compiler/Cargo.toml \
            --profile gate --bins --test '*' --locked --offline -- --skip conformance::adapter::
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - name: Run the static checks and the change-log check
        run: |
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          git branch -f main origin/main
          base=$(git merge-base HEAD origin/main)
          git log --oneline -1 "$base"
          make --no-print-directory static DESIGN_REVIEW_BASE="$base"
          perl .github/run-check.pl tmp-design-ready make --no-print-directory design-ready \
            DESIGN_REVIEW_BASE="$base"
  # The new loop-head case is accepted by the loop head before the fix, which
  # compared literal offsets for measures, so the case watches that defect.
  before-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install the host toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          rustup default stable
          cargo fetch --locked --manifest-path compiler/Cargo.toml
      - name: Restore the loop head before the fix
        run: |
          git show b1abc2c6a14d3022631e415cb52f799daf34077d:compiler/src/semantic/entailment/flow/loop_summary.rs \
            > compiler/src/semantic/entailment/flow/loop_summary.rs
          git diff --stat
      - name: Build the compiler
        run: |
          perl .github/run-check.pl before-fix-build cargo build --manifest-path compiler/Cargo.toml \
            --profile gate --locked --offline --bin whitefootc
      - name: The cases are accepted before the fix
        run: |
          set +e
          failed=0
          for case in ent5-neg-loop-head-sibling-element-measure ent5-neg-loop-head-sibling-element-goal; do
            compiler/target/gate/whitefootc --check "tests/conformance/cases/$case.wf"
            status=$?
            echo "$case: whitefootc --check exit: $status"
            if [ "$status" -ne 0 ]; then
              failed=1
            fi
          done
          test "$failed" -eq 0

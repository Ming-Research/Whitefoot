# Temporary (#289): why the first cold build of the compiler in a hosted job
# takes longer than an identical second one. Each job builds the same source
# twice, each into its own target directory, after one of three preparations:
# none, reading every file of the Rust toolchain into the page cache, or a
# 60 s wait that reads nothing. Each build records its wall, user and system
# time, its page faults and file-system inputs, and the host's I/O and CPU
# pressure and /proc/stat counters around it. Deleted before the full check,
# which fails while a tmp- workflow exists.
name: tmp first build

on:
  push:
    branches: [work-289-26e0fade]

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
  CARGO_BUILD_JOBS: 2

jobs:
  build-twice:
    name: build twice (${{ matrix.prep }} ${{ matrix.n }})
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5, 6]
        prep: [none, toolchain, wait]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Read the host
        run: |
          rustup default stable
          rustc -vV
          cargo --version
          grep -m1 '^model name' /proc/cpuinfo
          nproc
          free -m
          uptime
          sysroot=$(rustc --print sysroot)
          echo "sysroot $sysroot"
          du -sh "$sysroot"
          findmnt -T "$sysroot" || true
          cat /proc/pressure/io || echo 'no io pressure file'
      - name: Fetch the locked crates
        run: |
          /usr/bin/time -f 'FETCH %e s, %I inputs' cargo fetch --locked --manifest-path compiler/Cargo.toml
      - name: Prepare (${{ matrix.prep }})
        env:
          PREP: ${{ matrix.prep }}
        run: |
          case "$PREP" in
            none) echo 'PREP none' ;;
            toolchain)
              /usr/bin/time -f 'PREP toolchain %e s, %I inputs' \
                sh -c 'find "$1" -type f -print0 | xargs -0 cat > /dev/null' sh "$(rustc --print sysroot)" ;;
            wait) sleep 60; echo 'PREP wait 60 s' ;;
          esac
      - name: Build the same compiler twice
        run: |
          field() { sed -n "s/^$2 .*total=\([0-9]*\)$/\1/p" "/proc/pressure/$1" 2>/dev/null || true; }
          snap() {
            printf 'SNAP %s majfault=%s pgpgin=%s io_some_us=%s io_full_us=%s cpu_some_us=%s stat=%s\n' "$1" \
              "$(awk '$1 == "pgmajfault" { print $2 }' /proc/vmstat)" \
              "$(awk '$1 == "pgpgin" { print $2 }' /proc/vmstat)" \
              "$(field io some)" "$(field io full)" "$(field cpu some)" \
              "$(head -n 1 /proc/stat | tr -s ' ' ',')"
            grep -E '^(MemFree|Cached|Dirty|Writeback):' /proc/meminfo | tr -s ' ' | paste -sd ' '
          }
          for i in 1 2; do
            snap "before-$i"
            perl .github/run-check.pl "tmp-first-build-$i" \
              /usr/bin/time -o "$RUNNER_TEMP/time-$i" -f '%e %U %S %F %R %I %w %c' \
              cargo build --manifest-path compiler/Cargo.toml --locked --offline --profile gate \
              --bin whitefootc --target-dir "$RUNNER_TEMP/target-$i"
            snap "after-$i"
            echo "TIME $i wall,user,sys,majflt,minflt,inputs,vcsw,ivcsw $(cat "$RUNNER_TEMP/time-$i")"
          done

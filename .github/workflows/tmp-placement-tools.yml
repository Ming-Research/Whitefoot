# Temporary: runs the code-placement investigation's layout.py and
# summarize.py self-tests on the pushes the wf-agents engine makes of this
# work's commits (the `wf-try/work-287-26e0fade/` refs), so each self-test can
# be seen failing on a deliberately wrong expectation and passing without it
# (research/investigations/code-placement, item 287). Removed before the full
# check (AGENTS.md, "Checks").
name: tmp-placement-tools

on:
  push:
    branches: ['wf-try/work-287-26e0fade/**']

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  self-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: layout.py self-test
        run: python3 -I research/investigations/code-placement/layout.py self-test
      - name: summarize.py self-test
        if: always()
        run: python3 -I research/investigations/code-placement/summarize.py self-test

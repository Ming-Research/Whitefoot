# Temporary: runs the safety-claims check, watches it fail on broken input,
# repeats the page's reproduction commands, and counts the LLVM sources the
# page quotes. Removed before the branch is ready.
name: tmp-safety-claims

on:
  push:
    branches: [wf-fr-safety-claims]

permissions:
  contents: read

jobs:
  checker:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: make safety-claims
        run: make safety-claims
      - name: Counts
        run: python3 -B .github/check-safety-claims.py --tcb

  watch-it-fail:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Each broken input turns the check red for its own reason
        run: |
          python3 -B .github/check-safety-claims.py > /dev/null
          expect_red() {
            if python3 -B .github/check-safety-claims.py > "$RUNNER_TEMP/out.txt" 2>&1; then
              echo "STAYED GREEN: $1"; cat "$RUNNER_TEMP/out.txt"; exit 1
            fi
            grep -q -F -- "$2" "$RUNNER_TEMP/out.txt" || { echo "RED FOR ANOTHER REASON: $1"; cat "$RUNNER_TEMP/out.txt"; exit 1; }
            echo "red as intended ($1):"; head -3 "$RUNNER_TEMP/out.txt"
            git checkout -q -- .
          }
          sed -i 's/"id":"own1-pos-consume-once","rules":\["OWN-1"\]/"id":"own1-pos-consume-once","rules":["SCOPE-2"]/' tests/conformance/manifest.jsonl
          expect_red "an accepting case stops citing the rule" "own1-pos-consume-once no longer cites OWN-1"
          sed -i '/"id":"op4-pos-index-discharged"/d' tests/conformance/manifest.jsonl
          expect_red "a cited case is deleted" "op4-pos-index-discharged is not in the manifest"
          sed -i '/"id":"own1-neg-index-atom-after-move"/s/"rule":"OWN-1"/"rule":"OWN-11"/' tests/conformance/manifest.jsonl
          expect_red "a rejecting case now cites another rule" "own1-neg-index-atom-after-move declares"
          sed -i 's/"covered_by":"compiler-permission-judgment","rule":"PAR-1"/"covered_by":"renamed","rule":"PAR-1"/' tests/conformance/manifest.jsonl
          expect_red "an annotation key changes" "other evidence 'compiler-permission-judgment' does not match"
          sed -i 's/it does not exclude general race conditions/it excludes general race conditions/' spec/kernel-spec.md
          expect_red "a quoted rule changes" "does not occur verbatim in CAP-1"
          sed -i 's/^conformance-run:/conformance-runs:/' Makefile
          expect_red "a make target the page names disappears" "is not a Makefile target"
          sed -i 's/`OP-14` | A window/`OP-99` | A window/' docs/safety-claims.md
          expect_red "the page cites an undefined rule" "OP-99 is not defined"
          python3 -B .github/check-safety-claims.py > /dev/null

  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install the host toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          rustup default stable
      - name: The page's reproduction commands
        run: |
          cargo fetch --locked --manifest-path compiler/Cargo.toml
          make conformance-run

  llvm-count:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Count the pinned LLVM release's sources
        run: |
          version=$(python3 -B -c "import json;print(json.load(open('.github/toolchain/llvm-assets.json'))['llvm_version'])")
          mkdir -p "$RUNNER_TEMP/llvm"
          curl -fsSL -o "$RUNNER_TEMP/llvm/source.tar.xz" \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-$version/llvm-project-$version.src.tar.xz"
          tar -xJf "$RUNNER_TEMP/llvm/source.tar.xz" -C "$RUNNER_TEMP/llvm" \
            "llvm-project-$version.src/llvm/lib" "llvm-project-$version.src/llvm/include" \
            "llvm-project-$version.src/clang/lib" "llvm-project-$version.src/clang/include" \
            "llvm-project-$version.src/lld"
          cd "$RUNNER_TEMP/llvm/llvm-project-$version.src"
          echo "LLVM release $version"
          for part in "llvm/lib llvm/include" "clang/lib clang/include" "lld"; do
            printf '%s: ' "$part"
            find $part -type f \( -name '*.cpp' -o -name '*.h' -o -name '*.c' -o -name '*.def' -o -name '*.inc' -o -name '*.td' \) \
              -not -path '*/test/*' -not -path '*/unittests/*' -print0 | xargs -0 cat | wc -l
          done

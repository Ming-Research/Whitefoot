# Temporary evidence workflow for claude/unwind-resume; remove before ready.
# This experiment is separate from the correctness gate and changes no compiler flags.
name: unwind-resume evidence

on:
  push:
    branches: [claude/unwind-resume]

permissions:
  contents: read

concurrency:
  group: unwind-resume-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
  WF_DRIVERS: 1
  WF_WORKERS: 1

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Prepare runner scratch and retain experiment ceilings
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/unwind-resume"
          mkdir -p "$evidence"
          echo "UNWIND_EVIDENCE=$evidence" >> "$GITHUB_ENV"
          echo "WHITEFOOT_TIME_BUDGET_RECORD=$evidence/budget-record.txt" >> "$GITHUB_ENV"
          # Archive the canonical table; this workflow's new rows are initial
          # operational ceilings, not measured regression thresholds.
          cp .github/time-budgets.txt "$evidence/time-budgets.txt"
          git rev-parse HEAD > "$evidence/revision.txt"
          uname -a > "$evidence/kernel.txt"
          lscpu > "$evidence/cpu.txt"
          cp research/experiments/unwind-resume/{witness.wf,README.md} "$evidence/"
          sha256sum spec/kernel-spec.md "$evidence/witness.wf" > "$evidence/inputs.sha256"

      - name: Install the release host toolchain and kernel perf
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          rustup default stable
          sudo apt-get update
          sudo apt-get install -y binutils linux-tools-common
          kernel=$(uname -r)
          if ! sudo apt-get install -y "linux-tools-$kernel"; then
            sudo apt-get install -y linux-tools-generic
          fi
          # The /usr/bin/perf wrapper can report a missing kernel package even
          # when a directly executable tool exists; prefer an exact match.
          perf_binary="/usr/lib/linux-tools/$kernel/perf"
          if [ ! -x "$perf_binary" ]; then
            perf_binary=$(find -L /usr/lib/linux-tools -type f -name perf -executable | sort -V | tail -n 1)
            printf 'No exact-kernel perf package for %s; fallback tool: %s. This run cannot establish kernel-matched perf behavior.\n' \
              "$kernel" "$perf_binary" | tee "$UNWIND_EVIDENCE/perf-mismatch.txt"
          fi
          test -n "$perf_binary"
          test -x "$perf_binary"
          echo "UNWIND_PERF=$perf_binary" >> "$GITHUB_ENV"
          sudo sysctl kernel.perf_event_paranoid=-1
          {
            /usr/bin/clang --version
            ld.lld --version
            cargo --version
            "$perf_binary" --version
            printf 'perf path: %s\n' "$perf_binary"
            sysctl kernel.perf_event_paranoid
          } > "$UNWIND_EVIDENCE/toolchain.txt"

      - name: Build the locked compiler
        shell: bash
        run: |
          set -euo pipefail
          perl .github/run-check.pl unwind-build \
            cargo build --manifest-path compiler/Cargo.toml --profile gate --locked \
            > "$UNWIND_EVIDENCE/build.log" 2>&1
          cat "$UNWIND_EVIDENCE/build.log"
          compiler/target/gate/whitefootc --help > "$UNWIND_EVIDENCE/compiler-cli.txt" 2>&1 || true

      - name: Compile the downstream release binary and retain raw IR
        shell: bash
        run: |
          set -euo pipefail
          perl .github/run-check.pl unwind-compile bash -euo pipefail -c '
            compiler/target/gate/whitefootc --full-lto research/experiments/unwind-resume/witness.wf -o "$UNWIND_EVIDENCE/witness"
            # --emit-llvm cannot combine with --full-lto; this is the same
            # source before host optimization, not the final split resume IR.
            compiler/target/gate/whitefootc --emit-llvm research/experiments/unwind-resume/witness.wf -o "$UNWIND_EVIDENCE/raw.ll"
            /usr/bin/clang -O2 -g0 research/experiments/unwind-resume/control.c -o "$UNWIND_EVIDENCE/control"
            /usr/bin/clang -O2 -g0 -fuse-ld=lld research/experiments/unwind-resume/control.c -o "$UNWIND_EVIDENCE/control-lld"
            /usr/bin/clang -O2 -g0 -fuse-ld=lld -Wl,-z,separate-code research/experiments/unwind-resume/control.c -o "$UNWIND_EVIDENCE/control-lld-sep"
          ' > "$UNWIND_EVIDENCE/compile.log" 2>&1
          cat "$UNWIND_EVIDENCE/compile.log"
          cp research/experiments/unwind-resume/control.c "$UNWIND_EVIDENCE/"
          sha256sum "$UNWIND_EVIDENCE/witness" "$UNWIND_EVIDENCE/raw.ll" "$UNWIND_EVIDENCE/control" "$UNWIND_EVIDENCE/control-lld" "$UNWIND_EVIDENCE/control-lld-sep" "$UNWIND_EVIDENCE/control.c" >> "$UNWIND_EVIDENCE/inputs.sha256"

      - name: Inspect frames, calibrate a small sample, and compare call graphs
        shell: bash
        run: |
          set -euo pipefail
          cat > "$UNWIND_EVIDENCE/observe.py" <<'PY'
          import json
          import math
          import os
          import re
          import subprocess
          import time
          from pathlib import Path

          root = Path(os.environ['UNWIND_EVIDENCE'])
          binary = str(root / 'witness')
          perf = os.environ['UNWIND_PERF']

          def command_log(name, command, started, exit_code, **details):
              with (root / 'commands.jsonl').open('a') as output:
                  output.write(json.dumps(dict(artifact=name, argv=command,
                      seconds=time.monotonic() - started, exit=exit_code, **details)) + '\n')

          def capture(name, command, optional=False, timeout=10, discard_stdout=False):
              started = time.monotonic()
              with (root / name).open('w') as output:
                  try:
                      result = subprocess.run(command, stdout=subprocess.DEVNULL if discard_stdout else output,
                          stderr=output if discard_stdout else subprocess.STDOUT, timeout=timeout)
                      command_log(name, command, started, result.returncode, optional=optional,
                                  stdout_discarded=discard_stdout, timeout_seconds=timeout)
                  except (subprocess.TimeoutExpired, OSError) as error:
                      output.write(f'\nDiagnostic command unavailable or timed out: {error}\n')
                      command_log(name, command, started, None, optional=optional, error=str(error),
                                  outcome='timeout' if isinstance(error, subprocess.TimeoutExpired) else 'unavailable',
                                  timeout_seconds=timeout)
                      if not optional:
                          raise
                      print(f'::warning::{name}: diagnostic unavailable or timed out; see commands.jsonl and artifact.', flush=True)
                      return ''
              if result.returncode:
                  if not optional:
                      raise RuntimeError(f'{name}: exit {result.returncode}; see artifact')
                  print(f'::warning::{name}: diagnostic exit {result.returncode}; see commands.jsonl and artifact.', flush=True)
              return (root / name).read_text()

          # Backend identity and load-segment biases are essential to interpreting
          # a recovered PC. Optional diagnostics never replace the baseline verdict.
          capture('perf-build-options.txt', [perf, 'version', '--build-options'], optional=True, timeout=5)
          capture('perf-libraries.txt', ['ldd', perf], optional=True, timeout=5)

          def inspect_elf(executable, prefix=''):
              symbols = capture(prefix + 'symbols.txt', ['nm', '-nS', '--defined-only', executable])
              frames = capture(prefix + 'readelf-frames.txt', ['readelf', '--debug-dump=frames', executable])
              capture(prefix + 'readelf-cfa.txt', ['readelf', '-wF', executable])
              capture(prefix + 'objdump-frames.txt', ['objdump', '--dwarf=frames', executable])
              capture(prefix + 'elf-header.txt', ['readelf', '-hW', executable])
              capture(prefix + 'elf-sections.txt', ['readelf', '-SW', executable])
              capture(prefix + 'elf-segments.txt', ['readelf', '-lW', executable])
              capture(prefix + 'eh-frame-header.txt', ['readelf', '-x', '.eh_frame_hdr', executable])
              disassembly = capture(prefix + 'disassembly.txt', ['objdump', '-d', executable])
              return symbols, frames, disassembly

          nm, frames, disassembly = inspect_elf(binary)
          inspect_elf(str(root / 'control'), 'control-')
          inspect_elf(str(root / 'control-lld'), 'control-lld-')
          inspect_elf(str(root / 'control-lld-sep'), 'control-lld-sep-')
          raw_ir = (root / 'raw.ll').read_text()
          (root / 'ir-attributes.txt').write_text('\n'.join(
              line for line in raw_ir.splitlines()
              if line.startswith(('define ', 'attributes ')) or
              re.search(r'uwtable|frame-pointer|nounwind', line)) + '\n')

          symbols = {}
          for line in nm.splitlines():
              match = re.match(r'^([0-9a-fA-F]+)\s+([0-9a-fA-F]+)\s+[tT]\s+(.+)$', line)
              if match:
                  symbols[match[3]] = (int(match[1], 16), int(match[2], 16))
          families = {
              'resume': [s for s in symbols if re.match(r'^wf[_.]awaitable_loop(?:\$instance\$[^.]*)?\.resume(?:\.|$)', s)],
              'ordinary': [s for s in symbols if re.match(r'^(?:wf[_.]ordinary|wf__env_ordinary)(?:[.$]|$)', s)],
              'leaf': [s for s in symbols if re.match(r'^wf[_.]hot_leaf(?:[.$]|$)', s)],
          }
          bodies = {}
          for match in re.finditer(r'^([0-9a-f]+) <([^>]+)>:\n(.*?)(?=^[0-9a-f]+ <|\Z)', disassembly, re.M | re.S):
              bodies[match[2]] = match[3]
          chunks = re.split(r'\n\s*\n', frames)
          summary = []
          for family, names in families.items():
              summary.append(f'[{family}] surviving symbols: {names}')
              for name in names:
                  start, size = symbols[name]
                  covering = []
                  for chunk in chunks:
                      match = re.search(r'FDE .*?pc=([0-9a-f]+)\.\.([0-9a-f]+)', chunk)
                      if match and int(match[1], 16) <= start < int(match[2], 16):
                          covering.append(chunk)
                          cie = re.search(r'cie=([0-9a-f]+)', chunk)
                          if cie:
                              offset = int(cie[1], 16)
                              summary.extend(c for c in chunks if re.search(r'^([0-9a-f]+)\s+.*CIE', c, re.M) and
                                             int(re.search(r'^([0-9a-f]+)\s+.*CIE', c, re.M)[1], 16) == offset)
                  summary.append(f'{name}: pc={start:x}..{start + size:x}, FDE count={len(covering)}')
                  summary.extend(covering)
                  body = bodies.get(name, '<no disassembly>')
                  summary.append('Prologue (first 20 instruction lines):\n' + '\n'.join(body.splitlines()[:20]))
                  (root / f'disassembly-{family}-{start:x}.txt').write_text(f'{name}\n{body}')
          (root / 'frame-summary.txt').write_text('\n\n'.join(summary) + '\n')
          print((root / 'frame-summary.txt').read_text(), flush=True)

          # Presence alone is insufficient: a removed/inlined/tail call has no
          # physical parent to unwind. Inspect direct non-tail call edges in
          # the exact executable, without disabling release optimization.
          def call_edges(callers, callees):
              return [(caller, callee) for caller in callers for callee in callees
                      if re.search(r'\bcallq?\s+[^\n]*<' + re.escape(callee) + r'>', bodies.get(caller, ''))]

          edges_a = call_edges(families['resume'], families['ordinary'])
          edges_b = call_edges(families['ordinary'], families['leaf'])
          # Full LTO may inline the ordinary function into resume; a direct
          # non-tail resume -> hot_leaf call is then the physical chain to test.
          edges_direct = call_edges(families['resume'], families['leaf'])
          preflight = {'symbols': families, 'resume_to_ordinary': edges_a, 'ordinary_to_leaf': edges_b,
                       'resume_to_leaf': edges_direct}
          (root / 'preflight.json').write_text(json.dumps(preflight, indent=2) + '\n')
          connected = any(ordinary == middle for _, ordinary in edges_a for middle, _ in edges_b) or bool(edges_direct)
          if not connected:
              raise RuntimeError('Inconclusive: optimized executable lacks a non-tail call chain from resume to hot_leaf; no fraction table can answer this witness.')

          # Begin with two million iterations, then a bounded larger sample
          # when startup overhead makes it too short. Keep all measurements.
          timings = []
          def trial(batches, label):
              started = time.monotonic()
              with (root / f'{label}.stdout').open('w') as out, (root / f'{label}.stderr').open('w') as err:
                  result = subprocess.run([binary] + ['batch'] * batches, stdout=out, stderr=err, timeout=20)
              elapsed = time.monotonic() - started
              timings.append({'trial': label, 'batches': batches, 'seconds': elapsed, 'exit': result.returncode})
              (root / 'calibration.json').write_text(json.dumps(timings, indent=2) + '\n')
              if result.returncode:
                  raise RuntimeError(f'{label}: witness exit {result.returncode}')
              return elapsed

          trial(1, 'smallest')
          duration = trial(16, 'sample-16')
          batches = max(1, min(5000, math.ceil(16 * 3.5 / max(duration, 0.001))))
          duration = trial(batches, 'selected')
          # A second estimate is useful only if the first misses the intended
          # sampling window; three perf recordings then use one identical argv.
          if not 2 <= duration <= 5:
              batches = max(1, min(5000, math.ceil(batches * 3.5 / max(duration, 0.001))))
              duration = trial(batches, 'adjusted')
          argv = [binary] + ['batch'] * batches
          (root / 'invocation.json').write_text(json.dumps({'argv': argv, 'iterations': batches * 2000000,
              'unprofiled_seconds': duration, 'target_seconds': [2, 5],
              'within_target': 2 <= duration <= 5}, indent=2) + '\n')
          if not 2 <= duration <= 5:
              print(f'::warning::Calibration was {duration:.3f}s; target 2-5s is unconfirmed, see artifact.', flush=True)

          def clean_symbol(token):
              return re.sub(r'\+0x[0-9a-fA-F]+$', '', token)

          def sample_counts(script, leaf_symbols, resume_symbols, ordinary_symbols):
              counts = dict(hot=0, ordinary=0, resume=0, native_main=0, wf_main_resume=0,
                            wf_main_body=0, floor_entry=0, thread_start=0, beyond_resume=0)
              launchers = {'wf__context_root_run', 'wf_context_run', 'wf_context_drive',
                           'wf_executor_loop', 'wf__coro_resume', 'wf__main_body',
                           'wf__floor_entry', 'start_thread', '__clone', 'clone', '__clone3'}
              for sample in re.split(r'\n\s*\n', script):
                  stack = []
                  for line in sample.splitlines():
                      match = re.match(r'^\s+([0-9a-fA-F]+)\s+(\S+)', line)
                      if match:
                          stack.append(clean_symbol(match[2]))
                  # FIRST recorded IP is the sampled leaf; merely containing
                  # hot_leaf somewhere in a chain would bias the denominator.
                  if not stack or stack[0] not in leaf_symbols:
                      continue
                  counts['hot'] += 1
                  present = set(stack)
                  counts['ordinary'] += bool(present & ordinary_symbols)
                  counts['resume'] += bool(present & resume_symbols)
                  counts['native_main'] += 'main' in present
                  counts['wf_main_resume'] += any(re.match(r'^wf[_.]main(?:\$instance\$[^.]*)?\.resume(?:\.|$)', s) for s in present)
                  counts['wf_main_body'] += 'wf__main_body' in present
                  counts['floor_entry'] += 'wf__floor_entry' in present
                  counts['thread_start'] += bool(present & {'start_thread', '__clone', 'clone', '__clone3'})
                  positions = [i for i, symbol in enumerate(stack) if symbol in resume_symbols]
                  counts['beyond_resume'] += any(any(symbol == launcher or symbol.startswith(launcher + '.')
                      for symbol in stack[i + 1:] for launcher in launchers) for i in positions)
              return counts

          # CI-only parser controls: a nonhot first IP must be excluded even
          # when hot_leaf appears deeper. A missing resume is a real miss.
          synthetic = ("sample 1:\n\t10 wf_hot_leaf+0x1 (witness)\n\t20 wf_ordinary (witness)\n"
                       "\t30 wf_awaitable_loop.resume (witness)\n\t40 wf__context_root_run (witness)\n\t50 main (witness)\n\n"
                       "sample 2:\n\t10 wf_hot_leaf (witness)\n\t20 wf_ordinary (witness)\n\n"
                       "sample 3:\n\t10 unrelated (witness)\n\t20 wf_hot_leaf (witness)\n\t50 main (witness)\n")
          control = sample_counts(synthetic, {'wf_hot_leaf'}, {'wf_awaitable_loop.resume'}, {'wf_ordinary'})
          if not (control['hot'] == 2 and control['resume'] == 1 and control['native_main'] == 1 and control['beyond_resume'] == 1):
              raise RuntimeError(f'Parser controls failed: {control}')
          if sample_counts('sample:\n\t10 unrelated (witness)\n', {'wf_hot_leaf'}, set(), set())['hot'] != 0:
              raise RuntimeError('Zero-hot-sample parser control failed')
          (root / 'parser-controls.json').write_text(json.dumps(control, indent=2) + '\n')

          # Inspect only descendants of the perf process launched below, and
          # require the exact executable's device/inode identity. No global name
          # search, ptrace, signal or change to the workload argv is involved.
          def snapshot_maps(recording, executable, label, started):
              expected = Path(executable).stat()
              deadline = time.monotonic() + 1
              attempts, errors, identified_at = 0, [], None
              while recording.poll() is None and time.monotonic() < deadline:
                  attempts += 1
                  pending, seen = [recording.pid], set()
                  while pending:
                      pid = pending.pop()
                      if pid in seen:
                          continue
                      seen.add(pid)
                      process = Path('/proc') / str(pid)
                      try:
                          # Read every thread's child list in case perf delegates.
                          tasks = list((process / 'task').iterdir())
                          for task in tasks:
                              pending.extend(int(child) for child in (task / 'children').read_text().split())
                          actual = (process / 'exe').stat()
                          if (actual.st_dev, actual.st_ino) != (expected.st_dev, expected.st_ino):
                              continue
                          if identified_at is None:
                              identified_at = time.monotonic()
                          # Wait after identifying the actual child, allowing
                          # floor/worker startup while the workload proceeds.
                          if time.monotonic() - identified_at < 0.2:
                              continue
                          before = time.monotonic()
                          maps = (process / 'maps').read_text()
                          status = (process / 'status').read_text()
                          task_ids = sorted(int(task.name) for task in (process / 'task').iterdir())
                          resolved = str((process / 'exe').resolve(strict=True))
                          after = time.monotonic()
                          (root / f'{label}.maps').write_text(maps)
                          (root / f'{label}.process-status').write_text(status)
                          metadata = dict(status='captured', perf_pid=recording.pid, pid=pid,
                              task_ids=task_ids, executable=resolved, device=actual.st_dev, inode=actual.st_ino,
                              wall_time_ns=time.time_ns(), clock='CLOCK_MONOTONIC',
                              record_start_monotonic_seconds=started, identified_monotonic_seconds=identified_at,
                              snapshot_monotonic_seconds=[before, after],
                              since_record_start_seconds=[before - started, after - started],
                              attempts=attempts, errors=errors)
                          (root / f'{label}.maps.json').write_text(json.dumps(metadata, indent=2) + '\n')
                          return
                      except OSError as error:
                          if len(errors) < 8:
                              errors.append(f'{process}: {error}')
                  time.sleep(0.01)
              metadata = dict(status='missing', perf_pid=recording.pid, executable=executable,
                  clock='CLOCK_MONOTONIC', record_start_monotonic_seconds=started,
                  identified_monotonic_seconds=identified_at, diagnostic_monotonic_seconds=time.monotonic(),
                  since_record_start_seconds=time.monotonic() - started, attempts=attempts, errors=errors,
                  reason='No live descendant with the exact executable identity yielded a complete maps/status snapshot within 1 second.')
              (root / f'{label}.maps.json').write_text(json.dumps(metadata, indent=2) + '\n')
              print(f'::warning::{label}: process maps snapshot missing; see maps.json.', flush=True)

          def record_profile(label, graph, invocation):
              command = [perf, 'record', '-e', 'cpu-clock:u', '-F', '499', '--call-graph', graph,
                         '-o', str(root / f'{label}.data'), '--'] + invocation
              started = time.monotonic()
              with (root / f'{label}.stdout').open('w') as out, (root / f'{label}.stderr').open('w') as err:
                  with subprocess.Popen(command, stdout=out, stderr=err) as recording:
                      try:
                          snapshot_maps(recording, invocation[0], label, started)
                          exit_code = recording.wait(timeout=max(0.01, 20 - (time.monotonic() - started)))
                      except BaseException as error:
                          # Preserve the existing record ceiling even if maps
                          # discovery or artifact writing fails before wait().
                          # Normal observation never signals the process.
                          if recording.poll() is None:
                              recording.kill()
                          recording.wait()
                          command_log(label, command, started, recording.returncode,
                              timed_out=isinstance(error, subprocess.TimeoutExpired),
                              error=f'{type(error).__name__}: {error}')
                          raise
              elapsed = time.monotonic() - started
              command_log(label, command, started, exit_code)
              with (root / 'record-runs.jsonl').open('a') as output:
                  output.write(json.dumps(dict(mode=label, seconds=elapsed, exit=exit_code, argv=command)) + '\n')
              if exit_code:
                  raise RuntimeError(f'{label}: perf record exit {exit_code}; see stderr')
              return elapsed, exit_code

          def profile_artifacts(label, mode):
              data = str(root / f'{label}.data')
              script = capture(f'{label}.script', [perf, 'script', '--no-demangle', '-i', data])
              capture(f'{label}.header', [perf, 'report', '--header-only', '-i', data])
              if mode.startswith('dwarf'):
                  capture(f'{label}.registers.script', [perf, 'script', '--no-demangle', '-i', data,
                      '-F', 'comm,pid,tid,time,event,ip,sym,period,uregs'], optional=True, timeout=5)
                  # Raw tool output retains stack bytes without a new perf.data parser.
                  capture(f'{label}.raw-dump.txt', [perf, 'script', '-D', '-i', data], optional=True, timeout=5)
                  capture(f'{label}.unwind-trace.stderr', [perf, 'script', '-vv', '--no-demangle', '-i', data],
                      optional=True, timeout=5, discard_stdout=True)
              return script

          rows = []
          # Software sampling avoids requiring a hardware PMU on hosted VMs.
          # Every mode uses the same user-space event, frequency, binary, argv.
          profiles = [('dwarf16384', 'dwarf,16384'), ('dwarf65528', 'dwarf,65528'), ('fp', 'fp')]
          for mode, graph in profiles:
              elapsed, exit_code = record_profile(mode, graph, argv)
              script = profile_artifacts(mode, mode)
              counts = sample_counts(script, set(families['leaf']), set(families['resume']), set(families['ordinary']))
              warning_lines = [line for line in (root / f'{mode}.stderr').read_text().splitlines()
                               if re.search(r'lost|drop|warn|error|fail', line, re.I)]
              row = dict(mode=mode, seconds=elapsed, exit=exit_code, counts=counts, warnings=warning_lines)
              rows.append(row)
              (root / 'counts.json').write_text(json.dumps(rows, indent=2) + '\n')

          # Same C source and optimization; isolate the selected native linker.
          # Keep the original default-linker build and its calibration unchanged.
          def control_invocation(executable, prefix):
              timings = []
              def control_trial(batches, label):
                  command = [executable] + ['batch'] * batches
                  started = time.monotonic()
                  with (root / f'{label}.stdout').open('w') as out, (root / f'{label}.stderr').open('w') as err:
                      result = subprocess.run(command, stdout=out, stderr=err, timeout=20)
                  elapsed = time.monotonic() - started
                  command_log(label, command, started, result.returncode)
                  timings.append(dict(trial=label, batches=batches, seconds=elapsed, exit=result.returncode))
                  (root / f'{prefix}-calibration.json').write_text(json.dumps(timings, indent=2) + '\n')
                  if result.returncode:
                      raise RuntimeError(f'{label}: control exit {result.returncode}')
                  return elapsed
              duration = control_trial(16, f'{prefix}-sample-16')
              batches = max(1, min(5000, math.ceil(16 * 3.5 / max(duration, 0.001))))
              duration = control_trial(batches, f'{prefix}-selected')
              invocation = [executable] + ['batch'] * batches
              (root / f'{prefix}-invocation.json').write_text(json.dumps(dict(argv=invocation,
                  unprofiled_seconds=duration, target_seconds=[2, 5], within_target=2 <= duration <= 5), indent=2) + '\n')
              return invocation

          def control_counts(script):
              counts = dict(hot=0, caller_loop=0, main=0)
              for sample in re.split(r'\n\s*\n', script):
                  stack = []
                  for line in sample.splitlines():
                      match = re.match(r'^\s+([0-9a-fA-F]+)\s+(\S+)', line)
                      if match:
                          stack.append(clean_symbol(match[2]))
                  if not stack or stack[0] != 'hot_leaf':
                      continue
                  counts['hot'] += 1
                  counts['caller_loop'] += 'caller_loop' in stack
                  counts['main'] += 'main' in stack
              return counts
          probe = control_counts("s:\n\t10 hot_leaf+0x1 (control)\n\t20 caller_loop (control)\n\t30 main (control)\n\n"
                                 "s:\n\t10 hot_leaf (control)\n\n s:\n\t10 other (control)\n\t20 hot_leaf (control)\n")
          if probe != dict(hot=2, caller_loop=1, main=1):
              raise RuntimeError(f'Control parser probe failed: {probe}')

          control_tables = []
          for prefix, description in [('control', 'C control (clang -O2 -g0, default linker)'),
                                      ('control-lld', 'C control (same source, clang -O2 -g0 -fuse-ld=lld)'),
                                      ('control-lld-sep', 'C control (same source, -fuse-ld=lld -Wl,-z,separate-code)')]:
              control_argv = control_invocation(str(root / prefix), prefix)
              control_rows = []
              for mode, graph in profiles:
                  label = f'{prefix}-{mode}'
                  elapsed, exit_code = record_profile(label, graph, control_argv)
                  script = profile_artifacts(label, mode)
                  warnings = [line for line in (root / f'{label}.stderr').read_text().splitlines()
                              if re.search(r'lost|drop|warn|error|fail', line, re.I)]
                  control_rows.append(dict(mode=mode, seconds=elapsed, exit=exit_code,
                                           counts=control_counts(script), warnings=warnings))
                  (root / f'{prefix}-counts.json').write_text(json.dumps(control_rows, indent=2) + '\n')
              control_table = [description, '', 'mode | hot samples | caller_loop | main | seconds / exit',
                               '--- | ---: | ---: | ---: | ---']
              for row in control_rows:
                  counts = row['counts']
                  hot = counts['hot']
                  cells = [f'{counts[c]}/{hot} ({counts[c] / hot:.1%})' if hot else 'inconclusive (0 hot samples)' for c in ('caller_loop', 'main')]
                  control_table.append(f"{row['mode']} | {hot} | " + ' | '.join(cells) + f" | {row['seconds']:.3f} / {row['exit']}")
              control_table.extend(['', 'Same event (cpu-clock:u, 499 Hz), modes and host as the Whitefoot table; only samples whose first IP is hot_leaf count.',
                                    'Each linker build has its own recorded calibrated invocation; inspect ELF segments before interpreting this comparison.'])
              control_tables.extend([''] + control_table)

          columns = ['ordinary', 'resume', 'native_main', 'wf_main_resume', 'wf_main_body', 'floor_entry', 'thread_start', 'beyond_resume']
          table = ['mode | hot samples | ' + ' | '.join(columns) + ' | seconds / exit',
                   '--- | ---: | ' + ' | '.join(['---:'] * len(columns)) + ' | ---']
          for row in rows:
              counts = row['counts']
              hot = counts['hot']
              ratios = [f'{counts[c]}/{hot} ({counts[c] / hot:.1%})' if hot else 'inconclusive (0 hot samples)' for c in columns]
              table.append(f"{row['mode']} | {hot} | " + ' | '.join(ratios) + f" | {row['seconds']:.3f} / {row['exit']}")
          table.extend(['', 'Only samples whose first IP belongs to hot_leaf count. native_main is exact C main;',
                        'it runs on another thread, so absence is expected rather than an unwind failure.',
                        'wf_main_resume is a logical caller and may be absent after suspension; floor/thread entries are physical ancestors.',
                        'Lost/drop warnings are retained in counts.json and complete per-mode stderr; inspect them before interpreting ratios.'])
          table.extend(control_tables)
          (root / 'table.md').write_text('\n'.join(table) + '\n')
          print((root / 'table.md').read_text(), flush=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write((root / 'table.md').read_text())
          if any(row['counts']['hot'] == 0 for row in rows):
              raise RuntimeError('Inconclusive: at least one call-graph mode has zero hot_leaf samples.')
          PY
          perl .github/run-check.pl unwind-observe python3 "$UNWIND_EVIDENCE/observe.py" \
            > "$UNWIND_EVIDENCE/observe.log" 2>&1
          cat "$UNWIND_EVIDENCE/observe.log"

      - name: Report experiment ceiling violations
        if: always()
        shell: bash
        run: |
          if [ -n "${UNWIND_EVIDENCE:-}" ]; then
            perl .github/run-check.pl --budget-verdict "$UNWIND_EVIDENCE/budget-record.txt"
          fi

      - name: Upload the executable, frames, raw IR, profiles, and protocol
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unwind-resume-${{ github.sha }}
          path: ${{ runner.temp }}/unwind-resume/
          if-no-files-found: error

# Temporary evidence workflow for claude/unwind-resume; remove before ready.
# This experiment is separate from the correctness gate and changes no compiler flags.
name: unwind-resume evidence

on:
  push:
    branches: [claude/unwind-resume]

permissions:
  contents: read

concurrency:
  group: unwind-resume-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
  WF_DRIVERS: 1
  WF_WORKERS: 1

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Prepare runner scratch and retain experiment ceilings
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/unwind-resume"
          mkdir -p "$evidence"
          echo "UNWIND_EVIDENCE=$evidence" >> "$GITHUB_ENV"
          echo "WHITEFOOT_TIME_BUDGET_RECORD=$evidence/budget-record.txt" >> "$GITHUB_ENV"
          # Archive the canonical table; this workflow's new rows are initial
          # operational ceilings, not measured regression thresholds.
          cp .github/time-budgets.txt "$evidence/time-budgets.txt"
          git rev-parse HEAD > "$evidence/revision.txt"
          uname -a > "$evidence/kernel.txt"
          lscpu > "$evidence/cpu.txt"
          cp research/experiments/unwind-resume/{witness.wf,README.md} "$evidence/"
          sha256sum spec/kernel-spec.md "$evidence/witness.wf" > "$evidence/inputs.sha256"

      - name: Install the release host toolchain and kernel perf
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          rustup default stable
          sudo apt-get update
          sudo apt-get install -y binutils linux-tools-common
          kernel=$(uname -r)
          if ! sudo apt-get install -y "linux-tools-$kernel"; then
            sudo apt-get install -y linux-tools-generic
          fi
          # The /usr/bin/perf wrapper can report a missing kernel package even
          # when a directly executable tool exists; prefer an exact match.
          perf_binary="/usr/lib/linux-tools/$kernel/perf"
          if [ ! -x "$perf_binary" ]; then
            perf_binary=$(find -L /usr/lib/linux-tools -type f -name perf -executable | sort -V | tail -n 1)
            printf 'No exact-kernel perf package for %s; fallback tool: %s. This run cannot establish kernel-matched perf behavior.\n' \
              "$kernel" "$perf_binary" | tee "$UNWIND_EVIDENCE/perf-mismatch.txt"
          fi
          test -n "$perf_binary"
          test -x "$perf_binary"
          echo "UNWIND_PERF=$perf_binary" >> "$GITHUB_ENV"
          sudo sysctl kernel.perf_event_paranoid=-1
          {
            /usr/bin/clang --version
            ld.lld --version
            cargo --version
            "$perf_binary" --version
            printf 'perf path: %s\n' "$perf_binary"
            sysctl kernel.perf_event_paranoid
          } > "$UNWIND_EVIDENCE/toolchain.txt"

      - name: Build the locked compiler
        shell: bash
        run: |
          set -euo pipefail
          perl .github/run-check.pl unwind-build \
            cargo build --manifest-path compiler/Cargo.toml --profile gate --locked \
            > "$UNWIND_EVIDENCE/build.log" 2>&1
          cat "$UNWIND_EVIDENCE/build.log"
          compiler/target/gate/whitefootc --help > "$UNWIND_EVIDENCE/compiler-cli.txt" 2>&1 || true

      - name: Compile the downstream release binary and retain raw IR
        shell: bash
        run: |
          set -euo pipefail
          perl .github/run-check.pl unwind-compile bash -euo pipefail -c '
            compiler/target/gate/whitefootc --full-lto research/experiments/unwind-resume/witness.wf -o "$UNWIND_EVIDENCE/witness"
            # --emit-llvm cannot combine with --full-lto; this is the same
            # source before host optimization, not the final split resume IR.
            compiler/target/gate/whitefootc --emit-llvm research/experiments/unwind-resume/witness.wf -o "$UNWIND_EVIDENCE/raw.ll"
          ' > "$UNWIND_EVIDENCE/compile.log" 2>&1
          cat "$UNWIND_EVIDENCE/compile.log"
          sha256sum "$UNWIND_EVIDENCE/witness" "$UNWIND_EVIDENCE/raw.ll" >> "$UNWIND_EVIDENCE/inputs.sha256"

      - name: Inspect frames, calibrate a small sample, and compare call graphs
        shell: bash
        run: |
          set -euo pipefail
          cat > "$UNWIND_EVIDENCE/observe.py" <<'PY'
          import json
          import math
          import os
          import re
          import subprocess
          import time
          from pathlib import Path

          root = Path(os.environ['UNWIND_EVIDENCE'])
          binary = str(root / 'witness')
          perf = os.environ['UNWIND_PERF']

          def capture(name, command):
              with (root / name).open('w') as output:
                  result = subprocess.run(command, stdout=output, stderr=subprocess.STDOUT)
              if result.returncode:
                  raise RuntimeError(f'{name}: exit {result.returncode}; see artifact')
              return (root / name).read_text()

          nm = capture('symbols.txt', ['nm', '-nS', '--defined-only', binary])
          frames = capture('readelf-frames.txt', ['readelf', '--debug-dump=frames', binary])
          capture('readelf-cfa.txt', ['readelf', '-wF', binary])
          capture('objdump-frames.txt', ['objdump', '--dwarf=frames', binary])
          capture('elf-sections.txt', ['readelf', '-SW', binary])
          disassembly = capture('disassembly.txt', ['objdump', '-d', binary])
          raw_ir = (root / 'raw.ll').read_text()
          (root / 'ir-attributes.txt').write_text('\n'.join(
              line for line in raw_ir.splitlines()
              if line.startswith(('define ', 'attributes ')) or
              re.search(r'uwtable|frame-pointer|nounwind', line)) + '\n')

          symbols = {}
          for line in nm.splitlines():
              match = re.match(r'^([0-9a-fA-F]+)\s+([0-9a-fA-F]+)\s+[tT]\s+(.+)$', line)
              if match:
                  symbols[match[3]] = (int(match[1], 16), int(match[2], 16))
          families = {
              'resume': [s for s in symbols if re.match(r'^wf[_.]awaitable_loop(?:\$instance\$[^.]*)?\.resume(?:\.|$)', s)],
              'ordinary': [s for s in symbols if re.match(r'^(?:wf[_.]ordinary|wf__env_ordinary)(?:[.$]|$)', s)],
              'leaf': [s for s in symbols if re.match(r'^wf[_.]hot_leaf(?:[.$]|$)', s)],
          }
          bodies = {}
          for match in re.finditer(r'^([0-9a-f]+) <([^>]+)>:\n(.*?)(?=^[0-9a-f]+ <|\Z)', disassembly, re.M | re.S):
              bodies[match[2]] = match[3]
          chunks = re.split(r'\n\s*\n', frames)
          summary = []
          for family, names in families.items():
              summary.append(f'[{family}] surviving symbols: {names}')
              for name in names:
                  start, size = symbols[name]
                  covering = []
                  for chunk in chunks:
                      match = re.search(r'FDE .*?pc=([0-9a-f]+)\.\.([0-9a-f]+)', chunk)
                      if match and int(match[1], 16) <= start < int(match[2], 16):
                          covering.append(chunk)
                          cie = re.search(r'cie=([0-9a-f]+)', chunk)
                          if cie:
                              offset = int(cie[1], 16)
                              summary.extend(c for c in chunks if re.search(r'^([0-9a-f]+)\s+.*CIE', c, re.M) and
                                             int(re.search(r'^([0-9a-f]+)\s+.*CIE', c, re.M)[1], 16) == offset)
                  summary.append(f'{name}: pc={start:x}..{start + size:x}, FDE count={len(covering)}')
                  summary.extend(covering)
                  body = bodies.get(name, '<no disassembly>')
                  summary.append('Prologue (first 20 instruction lines):\n' + '\n'.join(body.splitlines()[:20]))
                  (root / f'disassembly-{family}-{start:x}.txt').write_text(f'{name}\n{body}')
          (root / 'frame-summary.txt').write_text('\n\n'.join(summary) + '\n')
          print((root / 'frame-summary.txt').read_text(), flush=True)

          # Presence alone is insufficient: a removed/inlined/tail call has no
          # physical parent to unwind. Inspect direct non-tail call edges in
          # the exact executable, without disabling release optimization.
          def call_edges(callers, callees):
              return [(caller, callee) for caller in callers for callee in callees
                      if re.search(r'\bcallq?\s+[^\n]*<' + re.escape(callee) + r'>', bodies.get(caller, ''))]

          edges_a = call_edges(families['resume'], families['ordinary'])
          edges_b = call_edges(families['ordinary'], families['leaf'])
          preflight = {'symbols': families, 'resume_to_ordinary': edges_a, 'ordinary_to_leaf': edges_b}
          (root / 'preflight.json').write_text(json.dumps(preflight, indent=2) + '\n')
          connected = any(ordinary == middle for _, ordinary in edges_a for middle, _ in edges_b)
          if not connected:
              raise RuntimeError('Inconclusive: optimized executable lacks connected non-tail resume -> ordinary -> hot_leaf calls; no fraction table can answer this witness.')

          # Begin with two million iterations, then a bounded larger sample
          # when startup overhead makes it too short. Keep all measurements.
          timings = []
          def trial(batches, label):
              started = time.monotonic()
              with (root / f'{label}.stdout').open('w') as out, (root / f'{label}.stderr').open('w') as err:
                  result = subprocess.run([binary] + ['batch'] * batches, stdout=out, stderr=err, timeout=20)
              elapsed = time.monotonic() - started
              timings.append({'trial': label, 'batches': batches, 'seconds': elapsed, 'exit': result.returncode})
              (root / 'calibration.json').write_text(json.dumps(timings, indent=2) + '\n')
              if result.returncode:
                  raise RuntimeError(f'{label}: witness exit {result.returncode}')
              return elapsed

          trial(1, 'smallest')
          duration = trial(16, 'sample-16')
          batches = max(1, min(5000, math.ceil(16 * 3.5 / max(duration, 0.001))))
          duration = trial(batches, 'selected')
          # A second estimate is useful only if the first misses the intended
          # sampling window; three perf recordings then use one identical argv.
          if not 2 <= duration <= 5:
              batches = max(1, min(5000, math.ceil(batches * 3.5 / max(duration, 0.001))))
              duration = trial(batches, 'adjusted')
          argv = [binary] + ['batch'] * batches
          (root / 'invocation.json').write_text(json.dumps({'argv': argv, 'iterations': batches * 2000000,
              'unprofiled_seconds': duration, 'target_seconds': [2, 5],
              'within_target': 2 <= duration <= 5}, indent=2) + '\n')
          if not 2 <= duration <= 5:
              print(f'::warning::Calibration was {duration:.3f}s; target 2-5s is unconfirmed, see artifact.', flush=True)

          def clean_symbol(token):
              return re.sub(r'\+0x[0-9a-fA-F]+$', '', token)

          def sample_counts(script, leaf_symbols, resume_symbols, ordinary_symbols):
              counts = dict(hot=0, ordinary=0, resume=0, native_main=0, wf_main_resume=0,
                            wf_main_body=0, floor_entry=0, thread_start=0, beyond_resume=0)
              launchers = {'wf__context_root_run', 'wf_context_run', 'wf_context_drive',
                           'wf_executor_loop', 'wf__coro_resume', 'wf__main_body',
                           'wf__floor_entry', 'start_thread', '__clone', 'clone', '__clone3'}
              for sample in re.split(r'\n\s*\n', script):
                  stack = []
                  for line in sample.splitlines():
                      match = re.match(r'^\s+([0-9a-fA-F]+)\s+(\S+)', line)
                      if match:
                          stack.append(clean_symbol(match[2]))
                  # FIRST recorded IP is the sampled leaf; merely containing
                  # hot_leaf somewhere in a chain would bias the denominator.
                  if not stack or stack[0] not in leaf_symbols:
                      continue
                  counts['hot'] += 1
                  present = set(stack)
                  counts['ordinary'] += bool(present & ordinary_symbols)
                  counts['resume'] += bool(present & resume_symbols)
                  counts['native_main'] += 'main' in present
                  counts['wf_main_resume'] += any(re.match(r'^wf[_.]main(?:\$instance\$[^.]*)?\.resume(?:\.|$)', s) for s in present)
                  counts['wf_main_body'] += 'wf__main_body' in present
                  counts['floor_entry'] += 'wf__floor_entry' in present
                  counts['thread_start'] += bool(present & {'start_thread', '__clone', 'clone', '__clone3'})
                  positions = [i for i, symbol in enumerate(stack) if symbol in resume_symbols]
                  counts['beyond_resume'] += any(any(symbol == launcher or symbol.startswith(launcher + '.')
                      for symbol in stack[i + 1:] for launcher in launchers) for i in positions)
              return counts

          # CI-only parser controls: a nonhot first IP must be excluded even
          # when hot_leaf appears deeper. A missing resume is a real miss.
          synthetic = ("sample 1:\n\t10 wf_hot_leaf+0x1 (witness)\n\t20 wf_ordinary (witness)\n"
                       "\t30 wf_awaitable_loop.resume (witness)\n\t40 wf__context_root_run (witness)\n\t50 main (witness)\n\n"
                       "sample 2:\n\t10 wf_hot_leaf (witness)\n\t20 wf_ordinary (witness)\n\n"
                       "sample 3:\n\t10 unrelated (witness)\n\t20 wf_hot_leaf (witness)\n\t50 main (witness)\n")
          control = sample_counts(synthetic, {'wf_hot_leaf'}, {'wf_awaitable_loop.resume'}, {'wf_ordinary'})
          if not (control['hot'] == 2 and control['resume'] == 1 and control['native_main'] == 1 and control['beyond_resume'] == 1):
              raise RuntimeError(f'Parser controls failed: {control}')
          if sample_counts('sample:\n\t10 unrelated (witness)\n', {'wf_hot_leaf'}, set(), set())['hot'] != 0:
              raise RuntimeError('Zero-hot-sample parser control failed')
          (root / 'parser-controls.json').write_text(json.dumps(control, indent=2) + '\n')

          rows = []
          # Software sampling avoids requiring a hardware PMU on hosted VMs.
          # Every mode uses the same user-space event, frequency, binary, argv.
          profiles = [('dwarf16384', 'dwarf,16384'), ('dwarf65528', 'dwarf,65528'), ('fp', 'fp')]
          for mode, graph in profiles:
              started = time.monotonic()
              with (root / f'{mode}.stdout').open('w') as out, (root / f'{mode}.stderr').open('w') as err:
                  result = subprocess.run([perf, 'record', '-e', 'cpu-clock:u', '-F', '499', '--call-graph', graph,
                                           '-o', str(root / f'{mode}.data'), '--'] + argv,
                                          stdout=out, stderr=err, timeout=20)
              elapsed = time.monotonic() - started
              with (root / 'record-runs.jsonl').open('a') as output:
                  output.write(json.dumps({'mode': mode, 'seconds': elapsed, 'exit': result.returncode}) + '\n')
              if result.returncode:
                  raise RuntimeError(f'{mode}: perf record exit {result.returncode}; see stderr')
              script = capture(f'{mode}.script', [perf, 'script', '--no-demangle', '-i', str(root / f'{mode}.data')])
              capture(f'{mode}.header', [perf, 'report', '--header-only', '-i', str(root / f'{mode}.data')])
              counts = sample_counts(script, set(families['leaf']), set(families['resume']), set(families['ordinary']))
              warning_lines = [line for line in (root / f'{mode}.stderr').read_text().splitlines()
                               if re.search(r'lost|drop|warn|error|fail', line, re.I)]
              row = dict(mode=mode, seconds=elapsed, exit=result.returncode, counts=counts, warnings=warning_lines)
              rows.append(row)
              (root / 'counts.json').write_text(json.dumps(rows, indent=2) + '\n')

          columns = ['ordinary', 'resume', 'native_main', 'wf_main_resume', 'wf_main_body', 'floor_entry', 'thread_start', 'beyond_resume']
          table = ['mode | hot samples | ' + ' | '.join(columns) + ' | seconds / exit',
                   '--- | ---: | ' + ' | '.join(['---:'] * len(columns)) + ' | ---']
          for row in rows:
              counts = row['counts']
              hot = counts['hot']
              ratios = [f'{counts[c]}/{hot} ({counts[c] / hot:.1%})' if hot else 'inconclusive (0 hot samples)' for c in columns]
              table.append(f"{row['mode']} | {hot} | " + ' | '.join(ratios) + f" | {row['seconds']:.3f} / {row['exit']}")
          table.extend(['', 'Only samples whose first IP belongs to hot_leaf count. native_main is exact C main;',
                        'it runs on another thread, so absence is expected rather than an unwind failure.',
                        'wf_main_resume is a logical caller and may be absent after suspension; floor/thread entries are physical ancestors.',
                        'Lost/drop warnings are retained in counts.json and complete per-mode stderr; inspect them before interpreting ratios.'])
          (root / 'table.md').write_text('\n'.join(table) + '\n')
          print((root / 'table.md').read_text(), flush=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write((root / 'table.md').read_text())
          if any(row['counts']['hot'] == 0 for row in rows):
              raise RuntimeError('Inconclusive: at least one call-graph mode has zero hot_leaf samples.')
          PY
          perl .github/run-check.pl unwind-observe python3 "$UNWIND_EVIDENCE/observe.py" \
            > "$UNWIND_EVIDENCE/observe.log" 2>&1
          cat "$UNWIND_EVIDENCE/observe.log"

      - name: Report experiment ceiling violations
        if: always()
        shell: bash
        run: |
          if [ -n "${UNWIND_EVIDENCE:-}" ]; then
            perl .github/run-check.pl --budget-verdict "$UNWIND_EVIDENCE/budget-record.txt"
          fi

      - name: Upload the executable, frames, raw IR, profiles, and protocol
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unwind-resume-${{ github.sha }}
          path: ${{ runner.temp }}/unwind-resume/
          if-no-files-found: error

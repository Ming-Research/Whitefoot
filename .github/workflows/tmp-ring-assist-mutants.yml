# Temporary claude/ring-assist workflow; remove before ready.
# Shows once that each new ring-trigger case fails under the mutant it guards:
# every case passes unmutated, then fails with its own message mutated. The
# witness job shows the same for the whole-program case, with the split arm
# as the control that passes on the old trigger too.
name: tmp-ring-assist-mutants
on:
  workflow_dispatch:
  push:
    branches: [claude/ring-assist]
env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set the scratch root
        run: echo "WHITEFOOT_SCRATCH_ROOT=$RUNNER_TEMP/whitefoot" >> "$GITHUB_ENV"
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-rt-18-dev
          echo "kernel.io_uring_disabled=$(cat /proc/sys/kernel/io_uring_disabled 2>/dev/null || echo absent)"
      - name: Controls and mutants
        run: |
          set -u
          status=0
          out="$RUNNER_TEMP/out.txt"
          native="$WHITEFOOT_SCRATCH_ROOT/whitefoot-completion-test/driver-service-native-test"
          bridge=compiler/src/backend/completion/bridge.c
          uring=compiler/src/backend/completion/linux_io_uring.c
          run_ring() {
            timeout 300s make -C compiler driver-service-native-test CC=/usr/bin/clang REQUIRE_NATIVE=1 > "$out" 2>&1
            code=$?
            tail -5 "$out"
            return $code
          }
          # The same image with the ring refused runs only the probe's word cases.
          run_refused() {
            timeout 300s make -C compiler "$native" CC=/usr/bin/clang > "$out" 2>&1 || return 1
            env -u WF_REQUIRE_LINUX_IO_URING WF_IO_NO_NATIVE_RING=1 WF_IO_HELPERS=0 "$native" >> "$out" 2>&1
            code=$?
            tail -5 "$out"
            return $code
          }
          expect_fail() {
            name=$1 runner=$2 message=$3
            if $runner; then
              echo "FAIL mutant $name: $runner passed"; status=1
            elif grep -qF "driver-service-native-test:" "$out" && grep -qF ": $message" "$out"; then
              echo "PASS mutant $name: $runner failed with: $message"
            else
              echo "FAIL mutant $name: $runner failed for another reason"; status=1
            fi
          }
          mutate() {
            file=$1 name=$2 program=$3
            perl -0pi -e "$program" "$file" || { echo "FAIL mutant $name not applied"; exit 1; }
            git diff --stat -- "$file"
          }
          if run_ring; then echo "PASS control: native cases"; else echo "FAIL control: native cases"; status=1; fi
          run_refused; code=$?
          if [ "$code" = 77 ]; then echo "PASS control: probe cases with the ring refused"; else echo "FAIL control: refused run exited $code"; status=1; fi
          if timeout 300s make -C compiler driver-service-test CC=/usr/bin/clang > "$out" 2>&1; then echo "PASS control: service cases"; else tail -5 "$out"; echo "FAIL control: service cases"; status=1; fi

          # M1: the monitor keeps only the deadline trigger, as before this change;
          # the watch answers at once so no function is left unused under -Werror.
          mutate "$bridge" M1 's/(static int wf_monitor_ring_watch\(wf_driver \*driver, uint64_t now\) \{\n)/$1    if (driver) return 0;\n/ or die'
          expect_fail M1 run_ring "a stale run with an unreaped completion and an idle peer was not reassigned"
          git checkout -- "$bridge"
          # M2: the ring trigger keeps the idle-peer deferral.
          mutate "$bridge" M2 's/    if \(phase == WF_DRIVER_BORROWED_SERVICE\) return 0;/    if (phase == WF_DRIVER_BORROWED_SERVICE || atomic_load_explicit(&wf_drivers_idle, memory_order_seq_cst)) return 0;/ or die'
          expect_fail M2 run_ring "a stale run with an unreaped completion and an idle peer was not reassigned"
          git checkout -- "$bridge"
          # M3: the role is handed off at the first sighting of ring work.
          mutate "$bridge" M3 's/    if \(now < sighting->since \+ WF_HANDOFF_TAU_NS\) return 0;\n// or die'
          expect_fail M3 run_ring "a first sighting of ring work reassigned the role"
          git checkout -- "$bridge"
          # M4: staleness is keyed by the token's phase, not its exact word.
          mutate "$bridge" M4 's/    if \(sighting->outside != token\) \{/    if ((sighting->outside & WF_DRIVER_PHASE_MASK) != phase) {/ or die'
          expect_fail M4 run_ring "a new context run inherited the previous run's sighting"
          git checkout -- "$bridge"
          # M5: the probe ignores staged submissions. The ring run fails at the
          # end-to-end case; the refused run, which has only the word cases, there.
          mutate "$uring" M5 's/    return wf_linux_load_acquire\(adapter->submission_head\)\n        != wf_linux_load_acquire\(adapter->submission_tail\);\n/    return 0;\n/ or die'
          expect_fail M5 run_ring "a staged submission left in a stale run was not reassigned"
          expect_fail M5 run_refused "a staged submission is not pending"
          git checkout -- "$uring"
          # M6: the probe ignores the kernel's overflow flag.
          mutate "$uring" M6 's/    if \(\(wf_linux_load_acquire\(adapter->submission_flags\)\n            & IORING_SQ_CQ_OVERFLOW\) != 0\) \{\n        return 1;\n    \}\n// or die'
          expect_fail M6 run_ring "a completion overflow is not pending"
          git checkout -- "$uring"
          # M7: the claim stores PROBE from the sighted word without the exact CAS.
          mutate "$bridge" M7 's/    int claimed = atomic_compare_exchange_strong_explicit\(&driver->service_token,\n        &outside, probe, memory_order_acquire, memory_order_relaxed\);/    atomic_store_explicit(&driver->service_token, probe, memory_order_relaxed);\n    int claimed = 1;/ or die'
          expect_fail M7 run_ring "the ring path claimed a role a borrower holds"
          git checkout -- "$bridge"
          # M8a: a miss leaves the moving count raised.
          mutate "$bridge" M8a 's/(    if \(!spare\) \{\n)/$1        atomic_fetch_add_explicit(&wf_drivers_moving, 1u, memory_order_seq_cst);\n/ or die'
          expect_fail M8a run_ring "a ring reassignment without a spare leaked its claim"
          git checkout -- "$bridge"
          # M8b: a miss leaves the token in PROBE.
          mutate "$bridge" M8b 's/(    if \(!spare\) \{\n)/$1        atomic_store_explicit(&driver->service_token, (outside & ~WF_DRIVER_PHASE_MASK) | WF_DRIVER_PROBE, memory_order_release);\n/ or die'
          expect_fail M8b run_ring "a ring reassignment without a spare leaked its claim"
          git checkout -- "$bridge"
          exit $status

  witness:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install the host toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          rustup default stable
          cargo fetch --locked --manifest-path compiler/Cargo.toml
          nproc
      - name: Witness control and the old trigger
        run: |
          set -u
          status=0
          out="$RUNNER_TEMP/witness.txt"
          bridge=compiler/src/backend/completion/bridge.c
          witness() {
            timeout 1500s cargo test --manifest-path compiler/Cargo.toml --profile gate --locked --offline \
              --test corpus "$1" -- --test-threads=1 > "$out" 2>&1
            code=$?
            grep -E '^test |panicked|echo took|test result' "$out" | tail -20
            return $code
          }
          same=programs::ring_assist::an_echo_beside_a_computation_on_its_driver_returns_within_100_ms
          split=programs::ring_assist::an_echo_on_an_idle_driver_returns_within_100_ms_beside_a_computation
          if witness programs::ring_assist::; then echo "PASS control: every witness case"; else echo "FAIL control: witness"; status=1; fi
          # M1, the deadline-only trigger: the same-driver echo waits for the
          # whole computation, while the split arm stays fast.
          perl -0pi -e 's/(static int wf_monitor_ring_watch\(wf_driver \*driver, uint64_t now\) \{\n)/$1    if (driver) return 0;\n/ or die' "$bridge" || exit 1
          if witness "$same"; then
            echo "FAIL mutant M1: the same-driver witness passed"; status=1
          elif grep -qE 'same-driver arm, attempt [0-9]+: the echo took' "$out"; then
            echo "PASS mutant M1: the same-driver echo was late"
          else
            echo "FAIL mutant M1: the same-driver witness failed for another reason"; status=1
          fi
          if witness "$split"; then echo "PASS control M1: the split arm stays fast"; else echo "FAIL control M1: split arm"; status=1; fi
          git checkout -- "$bridge"
          exit $status

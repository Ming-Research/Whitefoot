# Temporary (coord-wfbl-09-21): removed before the branch is ready.
# The quick workflow for the window-reference work after main's merge of
# the built-in `clear`: the compiler build and lint, every unit test, every
# conformance case's verdict with each failing case listed, and the static
# checks and change-log check against the branch's fork point.
name: tmp-window-call-refs

on:
  push:
    branches: [claude/window-call-refs]

permissions:
  contents: read

jobs:
  checker:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install the host toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          rustup default stable
          cargo --version
          cargo fetch --locked --manifest-path compiler/Cargo.toml
      - name: Build the compiler
        run: |
          perl .github/run-check.pl wcr-build cargo build --manifest-path compiler/Cargo.toml \
            --profile gate --locked --offline --bin whitefootc
      - name: Lint the compiler as the gate does
        if: always()
        run: |
          rustup component add clippy
          perl .github/run-check.pl wcr-lint cargo clippy --manifest-path compiler/Cargo.toml \
            --all-targets --locked --offline -- -D warnings
      - name: Run every unit test, since main's merge reaches the whole checker
        if: always()
        run: |
          perl .github/run-check.pl wcr-unit cargo test --manifest-path compiler/Cargo.toml \
            --profile gate --locked --offline --lib
      - name: Reach every conformance verdict and list each failing case
        if: always()
        run: |
          set +e
          perl .github/run-check.pl wcr-corpus cargo test --manifest-path compiler/Cargo.toml \
            --profile gate --locked --offline --test corpus -- \
            conformance::adapter::the_corpus_reaches_its_declared_verdict_through_the_ordinary_compiler_path \
            --nocapture > "$RUNNER_TEMP/corpus.log" 2>&1
          status=$?
          set -e
          grep -E '^  Fail ' "$RUNNER_TEMP/corpus.log" || true
          grep -E 'conformance adapter: Pass=' "$RUNNER_TEMP/corpus.log" || tail -60 "$RUNNER_TEMP/corpus.log"
          exit "$status"

  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - name: Run the static checks and the change-log check
        run: |
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          git branch -f main origin/main
          base=$(git merge-base HEAD origin/main)
          git log --oneline -1 "$base"
          make --no-print-directory static DESIGN_REVIEW_BASE="$base"
          perl .github/run-check.pl wcr-design-ready make --no-print-directory design-ready \
            DESIGN_REVIEW_BASE="$base"

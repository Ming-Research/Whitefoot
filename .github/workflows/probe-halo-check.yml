# Temporary: evidence for the summary-read symbolic scope on Halo-wf's
# pkg::vm (board item proof-bl-cost-halo-check). Removed before the branch is
# ready.
name: probe-halo-check

on:
  push:
    branches: [claude/halo-check-cost]
    paths: [.github/workflows/probe-halo-check.yml, compiler/src/semantic/check.rs]

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: Ming-Research/Halo-wf
          ref: 99150005f5681780d0fe9d83f22f2b7792198ac7
          path: halo
      - name: Build base and head
        run: |
          base=$(git merge-base HEAD origin/main)
          echo "base $base head $(git rev-parse HEAD)"
          git worktree add -q $RUNNER_TEMP/base $base
          cargo build --manifest-path compiler/Cargo.toml --profile gate --bin whitefootc --locked
          cargo build --manifest-path $RUNNER_TEMP/base/compiler/Cargo.toml --profile gate --bin whitefootc --locked
      - name: Analyses, verdicts and LLVM
        run: |
          set +e
          for side in base head; do
            if [ $side = base ]; then bin=$RUNNER_TEMP/base/compiler/target/gate/whitefootc; else bin=$GITHUB_WORKSPACE/compiler/target/gate/whitefootc; fi
            (cd halo/lib/halo && WHITEFOOT_CHECK_WORK=$RUNNER_TEMP/$side.tsv /usr/bin/time -f "$side pkg::vm wall %e s, user %U s, rss %M KiB" "$bin" --check --graph modules.wfg --check-module pkg::vm > $RUNNER_TEMP/$side.verdict 2>&1; echo "$side pkg::vm exit $?")
            python3 - $RUNNER_TEMP/$side.tsv $side <<'PY'
          import sys, collections
          runs = set(); work = collections.Counter()
          for line in open(sys.argv[1]):
              f = line.rstrip("\n").split("\t")
              runs.add(f[1])
              if f[3] in ("function", "join"): work[f[3] + "." + f[5]] += int(f[6])
          print(sys.argv[2], "analyses", len(runs), "joins", work["function.joins"], "pairs", work["join.pairs_evaluated"], "interning", work["function.intern_calls"])
          PY
            (cd halo/research/experiments/halo-e2e && /usr/bin/time -f "$side test entry LLVM wall %e s" "$bin" --emit-llvm --graph modules.wfg --entry test -o $RUNNER_TEMP/$side.ll; echo "$side emit exit $?")
          done
          cmp $RUNNER_TEMP/base.verdict $RUNNER_TEMP/head.verdict && echo "verdict output identical"
          cmp $RUNNER_TEMP/base.ll $RUNNER_TEMP/head.ll && echo "LLVM identical"; ls -la $RUNNER_TEMP/*.ll

  mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: The new cases pass on the head
        run: cargo test --manifest-path compiler/Cargo.toml --profile gate --locked --lib -- a_generic_body_reads_a_summary a_renamed_symbolic_instance_publishes
      - name: The scope case fails when the scope stops at the canonical components' direct callees
        run: |
          cp compiler/src/semantic/check.rs $RUNNER_TEMP/check.rs
          python3 - <<'PY'
          p = "compiler/src/semantic/check.rs"; s = open(p).read()
          old = "            pending.extend(\n                schedule.components[component]"
          assert old in s
          s = s.replace(old, "            if !canonical.iter().any(|(index, _)| schedule.function_components[*index] as usize == component) { continue; }\n" + old, 1)
          open(p, "w").write(s)
          PY
          if cargo test --manifest-path compiler/Cargo.toml --profile gate --locked --lib a_generic_body_reads_a_summary; then echo "MUTANT SURVIVED"; exit 1; else echo "mutant killed"; fi
          cp $RUNNER_TEMP/check.rs compiler/src/semantic/check.rs
      - name: The renamed-instance case fails without the edge to the canonical instance
        run: |
          python3 - <<'PY'
          p = "compiler/src/semantic/entailment.rs"; s = open(p).read()
          old = "        graph[index].extend(function.summary_source);\n"
          assert old in s
          s = s.replace(old, "", 1)
          open(p, "w").write(s)
          PY
          if cargo test --manifest-path compiler/Cargo.toml --profile gate --locked --lib a_renamed_symbolic_instance_publishes; then echo "MUTANT SURVIVED"; exit 1; else echo "mutant killed"; fi

# Temporary: profile the checker on Halo-wf's pkg::vm (board item
# proof-bl-cost-halo-check). Removed before the branch is ready.
name: probe-halo-check

on:
  push:
    branches: [claude/halo-check-cost]
    paths: [.github/workflows/probe-halo-check.yml]

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Ming-Research/Halo-wf
          ref: 99150005f5681780d0fe9d83f22f2b7792198ac7
          path: halo
      - name: Install perf
        run: sudo apt-get update -qq && sudo apt-get install -y -qq linux-tools-common linux-tools-generic linux-tools-$(uname -r) || sudo apt-get install -y -qq linux-tools-generic
      - name: Build the compiler with symbols
        env:
          CARGO_PROFILE_GATE_DEBUG: line-tables-only
          CARGO_PROFILE_GATE_STRIP: none
          RUSTFLAGS: -C force-frame-pointers=yes
        run: cargo build --manifest-path compiler/Cargo.toml --profile gate --bin whitefootc --locked
      - name: Time and profile pkg::vm by thread
        run: |
          set +e
          bin=$GITHUB_WORKSPACE/compiler/target/gate/whitefootc
          cd halo/lib/halo
          nproc
          for i in 1 2 3; do /usr/bin/time -f "wall %e s, user %U s, sys %S s, rss %M KiB, exit %x" "$bin" --check --graph modules.wfg --check-module pkg::vm > /dev/null; done
          PERF=$(ls /usr/lib/linux-tools/*/perf 2>/dev/null | head -1); [ -z "$PERF" ] && PERF=perf
          sudo sysctl -w kernel.perf_event_paranoid=-1
          $PERF record --call-graph fp -F 499 -o $RUNNER_TEMP/perf.data "$bin" --check --graph modules.wfg --check-module pkg::vm > /dev/null 2>&1
          echo "===== samples by thread"
          $PERF report -i $RUNNER_TEMP/perf.data --no-children --stdio --sort tid -g none 2>/dev/null | grep -v "^$" | grep -v "^#" | head -20
          main=$($PERF report -i $RUNNER_TEMP/perf.data --no-children --stdio --sort tid -g none 2>/dev/null | grep -v "^#" | grep -v "^$" | head -1 | awk '{print $2}' | cut -d: -f1)
          echo "main tid $main"
          echo "===== main thread self"
          $PERF report -i $RUNNER_TEMP/perf.data --tid=$main --no-children --stdio --percent-limit 1 --sort symbol -g none 2>/dev/null | grep -v "^$" | grep -v "^#" | head -45
          echo "===== main thread inclusive"
          $PERF report -i $RUNNER_TEMP/perf.data --tid=$main --children --stdio --percent-limit 1.5 --sort symbol -g none 2>/dev/null | grep -v "^$" | grep -v "^#" | grep "w::\|whitefoot::\|hashbrown\|alloc::" | head -130

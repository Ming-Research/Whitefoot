# Temporary (board item wf-need-firn-hash-shrink); remove before the branch is ready.
# Focused checks of the HashMap shrink: the container, snapshot and heap
# alignment tests that use the map, and a comparison of the rebuild's
# machine code in the comparison's bench image with the merge base's.
name: tmp-hash-shrink

on:
  push:
    branches: [claude/hash-shrink]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: tmp-hash-shrink-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
  WHITEFOOT_CHECK_TIMEOUT: 1800

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    name: focused tests
    steps:
      - uses: actions/checkout@v4
      - name: Install the host toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          sudo sysctl -w kernel.core_pattern=core
          rustup default stable
          grep -m 1 'model name' /proc/cpuinfo
      - name: Build the test targets
        run: |
          perl .github/run-check.pl ths-fetch cargo fetch --locked --manifest-path compiler/Cargo.toml
          perl .github/run-check.pl ths-build cargo test --manifest-path compiler/Cargo.toml --profile gate --locked --offline --test corpus --no-run
      - name: Container programs
        run: perl .github/run-check.pl ths-containers cargo test --manifest-path compiler/Cargo.toml --profile gate --locked --offline --test corpus -- programs::containers
      - name: Snapshot export and canonical corpus
        if: ${{ !cancelled() }}
        run: perl .github/run-check.pl ths-corpus cargo test --manifest-path compiler/Cargo.toml --profile gate --locked --offline --test corpus -- programs::snapshot_export canonical_corpus
      - name: Heap alignment of a stored map
        if: ${{ !cancelled() }}
        run: perl .github/run-check.pl ths-heap cargo test --manifest-path compiler/Cargo.toml --profile gate --locked --offline --lib heap_alignment

  codegen:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    name: rebuild machine code against the merge base
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install the host toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          sudo ln -sf "/usr/bin/llvm-objdump-$version" /usr/bin/llvm-objdump
          rustup default stable
      - name: Build the merge base's library and this commit's
        run: bash research/experiments/hash-map-compare/arms.sh "$GITHUB_SHA" "" "$RUNNER_TEMP/out"
      - name: The rebuild's instructions, registers removed, in both bench images
        # The growth path's moving loop must match the merge base's: an
        # earlier revision's split helper reloaded two hash constants per pair.
        run: |
          out="$RUNNER_TEMP/out"
          for arm in base candidate; do
            "$out/arms/$arm/compiler/target/gate/whitefootc" research/experiments/hash-map-compare/bench.wf -o "$out/bench-$arm"
            llvm-objdump -d --no-show-raw-insn --no-leading-addr "$out/bench-$arm" > "$out/dis-$arm.txt"
            F='wf_std\.collections\.hash_map\.hash_map_rebuild\$instance\$[0-9a-f]+' awk '$0 ~ ("^<" ENVIRON["F"] ">:$"){p=1} p&&/^$/{p=0} p' "$out/dis-$arm.txt" \
              | awk 'NR>1{print $1}' > "$out/ops-$arm.txt"
            # The moving loop: from the first hash constant to the old backing's release.
            # Alignment padding (nop forms) is left out.
            awk '/movabsq/{p=1} p&&!/^nop/{print} /heap_give/{if(p) exit}' "$out/ops-$arm.txt" > "$out/move-$arm.txt"
            printf '%s: %s instructions, %s movabsq, called from %s sites\n' "$arm" "$(wc -l < "$out/ops-$arm.txt")" "$(grep -c movabsq "$out/ops-$arm.txt")" \
              "$(grep -cE 'call.*hash_map_(rebuild|migrate)' "$out/dis-$arm.txt")"
          done
          diff "$out/ops-base.txt" "$out/ops-candidate.txt" || true
          echo "moving loop: base $(wc -l < "$out/move-base.txt"), candidate $(wc -l < "$out/move-candidate.txt") instructions"
          # Fails when the candidate's loop has an instruction the base's lacks.
          diff "$out/move-base.txt" "$out/move-candidate.txt" > "$out/move.diff" || true
          cat "$out/move.diff"
          if grep -q '^>' "$out/move.diff"; then
            echo "moving loop: instructions the merge base does not have"
            exit 1
          fi
          echo "moving loop: no instruction beyond the merge base's"

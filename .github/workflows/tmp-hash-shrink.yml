# Temporary (board item wf-need-firn-hash-shrink); remove before the branch is ready.
# Focused checks of the HashMap shrink: the container, snapshot and heap
# alignment tests that use the map, the design tree's lint and readiness, and
# runs that watch each new or changed hash-map test fail on a broken library:
# the merge base's library, which never shrinks, and for the scan-shrink test
# also a scan that treats its cursor as a bucket index; a run of the
# comparison instrument's removal-tail program and its reducer's self-test.
name: tmp-hash-shrink

on:
  push:
    branches: [claude/hash-shrink]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: tmp-hash-shrink-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
  WHITEFOOT_CHECK_TIMEOUT: 1800

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    name: focused tests
    steps:
      - uses: actions/checkout@v4
      - name: Install the host toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          sudo sysctl -w kernel.core_pattern=core
          rustup default stable
          grep -m 1 'model name' /proc/cpuinfo
      - name: Build the test targets
        run: |
          perl .github/run-check.pl ths-fetch cargo fetch --locked --manifest-path compiler/Cargo.toml
          perl .github/run-check.pl ths-build cargo test --manifest-path compiler/Cargo.toml --profile gate --locked --offline --test corpus --no-run
      - name: Container programs
        run: perl .github/run-check.pl ths-containers cargo test --manifest-path compiler/Cargo.toml --profile gate --locked --offline --test corpus -- programs::containers
      - name: Snapshot export and canonical corpus
        if: ${{ !cancelled() }}
        run: perl .github/run-check.pl ths-corpus cargo test --manifest-path compiler/Cargo.toml --profile gate --locked --offline --test corpus -- programs::snapshot_export canonical_corpus
      - name: Heap alignment of a stored map
        if: ${{ !cancelled() }}
        run: perl .github/run-check.pl ths-heap cargo test --manifest-path compiler/Cargo.toml --profile gate --locked --offline --lib heap_alignment

  watch-fail:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    name: tests fail on a broken library
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install the host toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          rustup default stable
      - name: Build the merge base's library and this commit's
        run: bash research/experiments/hash-map-compare/arms.sh "$GITHUB_SHA" "" "$RUNNER_TEMP/out"
      - name: Build a scan that reads its cursor as a bucket index
        run: |
          arm="$RUNNER_TEMP/out/arms/mutant"
          git worktree add --detach "$arm" "$GITHUB_SHA"
          python3 - "$arm/lib/std/collections/hash_map/hash-map.wf" <<'EOF'
          import sys
          path = sys.argv[1]
          text = open(path).read()
          for old, new in [("let start = ishr.wrap(cursor, shift);", "let start = cursor;"),
                           ("return ishl.wrap(end, shift);", "return end;")]:
              assert text.count(old) == 1, old
              text = text.replace(old, new)
          open(path, "w").write(text)
          EOF
          git -C "$arm" diff --stat
          make -C "$arm/compiler" build
      - name: Run each test alone under each library
        run: |
          out="$RUNNER_TEMP/out"
          python3 - "$out" <<'EOF'
          import os, subprocess, sys
          out = sys.argv[1]
          source = open("tests/programs/containers/hash-map-program.wf").read()
          head = source[:source.index("fn main() -> status: ExitStatus pure {")]
          compilers = {arm: f"{out}/arms/{arm}/compiler/target/gate/whitefootc" for arm in ("base", "candidate", "mutant")}
          # Each test with the arms that must fail it; every test must pass on the candidate.
          cases = {
              "hash_map_test_growth": ["base"],
              "hash_map_test_shrink_million": ["base"],
              "hash_map_test_shrink_oscillation": ["base"],
              "hash_map_test_shrink_empty_reuse": ["base"],
              "hash_map_test_shrink_regrow": ["base"],
              "hash_map_test_owned_shrink": ["base"],
              "hash_map_test_scan_shrink": ["base", "mutant"],
          }
          wrong = 0
          for name, failing in cases.items():
              program = f"{out}/{name}.wf"
              with open(program, "w") as f:
                  f.write(head + "fn main() -> status: ExitStatus pure {\n"
                          f"  let failures = {name}();\n"
                          "  if failures != 0_u64 {\n    return exit_status(code: 1_u8);\n  }\n"
                          "  return exit_status(code: 0_u8);\n}\n")
              for arm in ["candidate"] + failing:
                  image = f"{out}/{name}-{arm}"
                  subprocess.run([compilers[arm], program, "-o", image], check=True)
                  status = subprocess.run([image]).returncode
                  expected = 0 if arm == "candidate" else 1
                  verdict = "as expected" if status == expected else "WRONG"
                  wrong += status != expected
                  print(f"{name} {arm}: exit {status}, expected {expected}, {verdict}", flush=True)
          sys.exit(1 if wrong else 0)
          EOF

      - name: The removal-tail program on both libraries, and the reducer's self-test
        run: |
          out="$RUNNER_TEMP/out"
          python3 -B research/experiments/hash-map-compare/compare.py self-test
          for arm in base candidate; do
            "$out/arms/$arm/compiler/target/gate/whitefootc" research/experiments/hash-map-compare/tail.wf -o "$out/tail-$arm"
            for size in 10000 1000000; do
              printf '%s ' "$arm"
              taskset -c 1 "$out/tail-$arm" "$size"
            done
          done

  remove-codegen:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    name: removal code under both libraries
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install the host toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          rustup default stable
      - name: Build the merge base's library and this commit's
        run: bash research/experiments/hash-map-compare/arms.sh "$GITHUB_SHA" "" "$RUNNER_TEMP/out"
      - name: Build the variants
        # split: the removal tests the shrink condition itself and calls the
        # shrink only on its rare side, the form an unlikely marker would
        # annotate. pr420: this commit with Whitefoot#420's automatic branch
        # weights merged in; pr420base: the same with the merge base's library.
        run: |
          out="$RUNNER_TEMP/out"
          git config --global user.email ci@example.invalid
          git config --global user.name ci
          git fetch --no-tags origin +refs/heads/claude/cold-branch-weights:refs/remotes/origin/claude/cold-branch-weights
          for arm in split pr420 pr420base; do
            git worktree add --detach "$out/arms/$arm" "$GITHUB_SHA"
          done
          # Whitefoot#420 predates the integer match terminator; its successor
          # list gets that terminator's targets and default, nothing else.
          for arm in pr420 pr420base; do
            git -C "$out/arms/$arm" merge --no-edit origin/claude/cold-branch-weights || echo "$arm" >> "$out/failed.txt"
            python3 - "$out/arms/$arm/compiler/src/backend/emitter/branch_weights.rs" <<'EOF' || echo "$arm" >> "$out/failed.txt"
          import sys
          path = sys.argv[1]
          text = open(path).read()
          old = "                IrTerminator::Return { .. } | IrTerminator::Unreachable => Vec::new(),\n"
          new = ("                IrTerminator::IntegerMatch { targets, default, .. } => targets\n"
                 "                    .iter()\n"
                 "                    .map(|target| target.block().index())\n"
                 "                    .chain(default.iter().map(|block| block.index()))\n"
                 "                    .collect(),\n") + old
          assert text.count(old) == 1
          open(path, "w").write(text.replace(old, new))
          EOF
          done
          rm -r "$out/arms/pr420base/lib/std/collections/hash_map"
          cp -r "$out/arms/base/lib/std/collections/hash_map" "$out/arms/pr420base/lib/std/collections/"
          for arm in split; do
            python3 - "$out/arms/$arm/lib/std/collections/hash_map/hash-map.wf" <<'EOF'
          import sys
          path = sys.argv[1]
          text = open(path).read()
          call = "          hash_map_shrink::<HashMapKey<K, E>, V, ceiling>(map: map, env: env);\n"
          split = ("          let remaining = before - 1_u64;\n"
                   "          let span = map^.cells.inner.len;\n"
                   "          let due = hash_map_shrink_due(live: remaining, buckets: span);\n"
                   "          if due {\n"
                   "            hash_map_shrink::<HashMapKey<K, E>, V, ceiling>(map: map, env: env);\n"
                   "          }\n")
          due = ("fn hash_map_shrink_due(live: u64, buckets: u64) -> due: Bool pure {\n"
                 "  if live == 0_u64 {\n    if buckets > 0_u64 {\n      return True();\n    }\n    return False();\n  }\n"
                 "  let eighth = buckets / 8_u64;\n  if live < eighth {\n    return True();\n  }\n  return False();\n}\n\n")
          anchor = "fn hash_map_remove<"
          assert text.count(call) == 1 and text.count(anchor) == 1
          text = text.replace(call, split).replace(anchor, due + anchor)
          open(path, "w").write(text)
          EOF
            git -C "$out/arms/$arm" diff --stat
          done
          make -C "$out/arms/split/compiler" build
          for arm in pr420 pr420base; do
            grep -qx "$arm" "$out/failed.txt" 2>/dev/null || make -C "$out/arms/$arm/compiler" build || echo "$arm" >> "$out/failed.txt"
          done
          touch "$out/failed.txt"
          echo "arms that did not build: $(tr '\n' ' ' < "$out/failed.txt")"
      - name: Optimized code of the bench under each arm
        run: |
          out="$RUNNER_TEMP/out"
          root="$out/arms/candidate"
          printf 'ROOT := %s\nBUILD := %s\nCLANG := /usr/bin/clang\ninclude $(ROOT)/compiler/runtime.mk\nobjects: $(NATIVE_OBJECTS)\n\t@echo $(NATIVE_OBJECTS) > %s/objects.txt\n' \
            "$root" "$out/rt" "$out" > "$out/rt.mk"
          make -f "$out/rt.mk" objects
          objects=$(cat "$out/objects.txt")
          arms="base candidate split weighted"
          for arm in pr420base pr420; do
            grep -qx "$arm" "$out/failed.txt" || arms="$arms $arm"
          done
          echo "$arms" > "$out/arms.txt"
          for arm in $(echo "$arms" | sed 's/ weighted//'); do
            "$out/arms/$arm/compiler/target/gate/whitefootc" --emit-llvm research/experiments/hash-map-compare/bench.wf -o "$out/$arm.ll"
          done
          # weighted: split with a 1:2000 branch weight on the branch whose
          # side holds the shrink call, as an unlikely marker would lower.
          awk '/^define .*hash_map_remove\$instance/{p=1} p{print} p&&/^}/{p=0}' "$out/split.ll"
          python3 - "$out/split.ll" "$out/weighted.ll" <<'EOF'
          import re, sys
          from collections import deque
          lines = open(sys.argv[1]).read().split("\n")
          # The removal's definition that holds the shrink call: the lowering
          # emits an if as a two-case switch on an i1 with an unreachable default.
          for start, line in enumerate(lines):
              if not (line.startswith("define") and "hash_map_remove$instance" in line):
                  continue
              end = next(i for i in range(start, len(lines)) if lines[i] == "}")
              if any("hash_map_shrink$instance" in l and "call" in l for l in lines[start:end]):
                  break
          else:
              sys.exit("no removal holds a shrink call")
          label, holder, edges, switches = "entry", None, {}, []
          i = start + 1
          while i < end:
              line = lines[i]
              m = re.match(r"^([A-Za-z0-9_.$-]+):", line)
              if m:
                  label = m.group(1)
              edges.setdefault(label, set()).update(re.findall(r"label %([A-Za-z0-9_.$-]+)", line))
              if "hash_map_shrink$instance" in line and "call" in line:
                  holder = label
              if re.match(r"^\s*switch i1 ", line):
                  close = next(j for j in range(i, end) if lines[j].strip() == "]")
                  cases = [re.search(r"label %([A-Za-z0-9_.$-]+)", lines[j]).group(1) for j in range(i + 1, close)]
                  for j in range(i + 1, close):
                      edges[label].update(re.findall(r"label %([A-Za-z0-9_.$-]+)", lines[j]))
                  switches.append((close, cases))
                  i = close
              i += 1
          def distance(source):
              seen, queue = {source: 0}, deque([source])
              while queue:
                  node = queue.popleft()
                  for nxt in edges.get(node, ()):
                      if nxt not in seen:
                          seen[nxt] = seen[node] + 1
                          queue.append(nxt)
              return seen.get(holder)
          # The two-way branch whose one side reaches the shrink call and the
          # other does not, nearest to the call.
          best = None
          for close, cases in switches:
              reach = [distance(c) for c in cases]
              if len(cases) == 2 and (reach[0] is None) != (reach[1] is None):
                  d = min(r for r in reach if r is not None)
                  if best is None or d < best[0]:
                      best = (d, close, ["1" if r is not None else "2000" for r in reach])
          assert best, "no branch guards the shrink call"
          _, close, weights = best
          text = "i32 0, " + ", ".join(f"i32 {w}" for w in weights)
          lines[close] = lines[close].rstrip() + ", !prof !9999990"
          lines.append(f'!9999990 = !{{!"branch_weights", {text}}}')
          print("weighted:", " ".join(l.strip() for l in lines[close - 3:close + 1]), "->", text)
          open(sys.argv[2], "w").write("\n".join(lines) + "\n")
          EOF
          # hinted: an inline hint on the removal's definitions, as an inline
          # marker on hash_map_remove would lower (Rust's #[inline]); always:
          # an always-inline attribute (Rust's #[inline(always)]). Each on
          # candidate and on weighted.
          for spec in candidate:hinted:inlinehint weighted:weightedhinted:inlinehint \
                      candidate:always:alwaysinline weighted:weightedalways:alwaysinline; do
            IFS=: read -r from to attr <<< "$spec"
            python3 - "$out/$from.ll" "$out/$to.ll" "$attr" <<'EOF'
          import sys
          lines = open(sys.argv[1]).read().split("\n")
          hits = 0
          for i, line in enumerate(lines):
              if line.startswith("define") and "hash_map_remove$instance" in line and line.endswith(" {"):
                  lines[i] = line[:-2] + f" {sys.argv[3]} {{"
                  hits += 1
          assert hits >= 1, hits
          print(sys.argv[2], sys.argv[3], "definitions:", hits)
          open(sys.argv[2], "w").write("\n".join(lines) + "\n")
          EOF
          done
          # coldsplit: weighted with LLVM's hot/cold splitting run on the
          # unoptimized module first, so the cold side is outlined before the
          # inliner prices the removal, as a compiler pass splitting cold code
          # ahead of LLVM would; coldsplitforced also outlines regions the
          # splitter's benefit model would keep.
          version=$(tr -d '[:space:]' < .github/llvm-major)
          "/usr/bin/opt-$version" -passes=hotcoldsplit -S "$out/weighted.ll" -o "$out/coldsplit.ll"
          "/usr/bin/opt-$version" -passes=hotcoldsplit -hotcoldsplit-threshold=-1 -S "$out/weighted.ll" -o "$out/coldsplitforced.ll"
          for arm in coldsplit coldsplitforced; do
            echo "$arm outlined functions: $(grep -c '^define .*\.cold' "$out/$arm.ll")"
            grep '^define .*\.cold' "$out/$arm.ll" | cut -c1-200 || true
          done
          # Where hot/cold splitting and the partial inliner stand in the O2
          # pipeline relative to the inliner.
          "/usr/bin/opt-$version" -passes='default<O2>' -hot-cold-split -enable-partial-inlining -print-pipeline-passes -disable-output "$out/weighted.ll" \
            | tr ',' '\n' | grep -n -E 'inline|hotcold|partial' || true
          sed -i 's/weighted/weighted hinted weightedhinted inlined always weightedalways coldsplit coldsplitforced partial/' "$out/arms.txt"
          cat "$out/arms.txt"
          for arm in $(cat "$out/arms.txt"); do
            source=$arm; extra=""
            if [ "$arm" = inlined ]; then source=candidate; extra="-mllvm -inline-threshold=2000"; fi
            if [ "$arm" = partial ]; then source=weighted; extra="-mllvm -enable-partial-inlining"; fi
            clang -O2 -falign-functions=64 $extra -Wno-override-module -x ir -c "$out/$source.ll" -o "$out/$arm.o"
            clang -O2 "$out/$arm.o" $objects -pthread -lm -o "$out/hand-$arm"
            clang -O2 -falign-functions=64 $extra -Wno-override-module -x ir -S -emit-llvm "$out/$source.ll" -o "$out/$arm.opt.ll"
            printf '%s: calls of hash_map_remove %s, of hash_map_shrink %s, branch weights in the removal %s\n' "$arm" \
              "$(grep -c 'call .*hash_map_remove\$instance' "$out/$arm.opt.ll")" \
              "$(grep -c 'call .*hash_map_shrink\$instance' "$out/$arm.opt.ll")" \
              "$(awk '/^define .*hash_map_remove\$instance/{p=1} p&&/!prof/{n++} p&&/^}/{p=0} END{print n+0}' "$out/$source.ll")"
          done
      - name: Sizes of the removal path in each optimized module
        run: |
          out="$RUNNER_TEMP/out"
          python3 - "$out" $(cat "$out/arms.txt") <<'EOF'
          import re, sys
          out, arms = sys.argv[1], sys.argv[2:]
          for arm in arms:
              text = open(f"{out}/{arm}.opt.ll").read()
              parts = []
              for m in re.finditer(r'^define [^@]*@("?[^(]+"?)\(.*?^}', text, re.S | re.M):
                  name = m.group(1).strip('"')
                  short = name.split("$")[0].split(".")[-1]
                  if ".cold" in name:
                      short += ".cold"
                  if short.removesuffix(".cold") not in ("wf_remove_one", "wf_churn_sample", "hash_map_remove", "hash_map_shrink", "hash_map_find"):
                      continue
                  count = sum(1 for l in m.group(0).splitlines() if l.startswith("  "))
                  calls = sorted({c.split("$")[0].split(".")[-1] for c in re.findall(r'call [^@]*@"?([A-Za-z0-9_.$]+)', m.group(0)) if not c.startswith("llvm")})
                  parts.append(f"{short}={count} calls {calls}")
              print(arm + ": " + "; ".join(parts))
          EOF
      - name: Remove-insert timing, alternating images
        run: |
          out="$RUNNER_TEMP/out"
          for round in $(seq 1 10); do
            for arm in $(cat "$out/arms.txt"); do
              for size in 1000 10000; do
                printf 'ns %s %s ' "$arm" "$size"
                WF_DRIVERS=1 taskset -c 1 "$out/hand-$arm" 6 "$size" 5 0 | awk -F'\t' '{printf "%s ", $5}'
                echo
              done
            done
          done
      - uses: actions/upload-artifact@v4
        with:
          name: remove-codegen
          path: |
            ${{ runner.temp }}/out/*.ll

  design-tree:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    name: design tree lint
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - name: Name main as a local ref
        run: |
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          git branch -f main origin/main
      - name: Tree lint and readiness against the merge base with main
        run: |
          base=$(git merge-base origin/main HEAD)
          git log --oneline -1 "$base"
          perl .github/run-check.pl ths-design-lint make design-lint DESIGN_REVIEW_BASE="$base"
          perl .github/run-check.pl ths-design-ready make design-ready DESIGN_REVIEW_BASE="$base"

# Temporary quick check for firn-req-linear-resource-lease; removed before the full check.
# The static checks with the conformance structure and the design readiness
# check, and the conformance adapter with the one new program test, on each
# push to the branch.
name: tmp-firn-req-linear-resource-lease

on:
  push:
    branches: [firn-req-linear-resource-lease]

permissions:
  contents: read

concurrency:
  group: tmp-firn-req-linear-resource-lease
  cancel-in-progress: true

jobs:
  static:
    name: static
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - name: Set the scratch root
        run: |
          echo "WHITEFOOT_SCRATCH_ROOT=$RUNNER_TEMP/whitefoot" >> "$GITHUB_ENV"
          echo "WHITEFOOT_TIME_BUDGET_RECORD=$RUNNER_TEMP/time-budget-overruns.txt" >> "$GITHUB_ENV"
      - name: Name main as a local ref
        run: |
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          git branch -f main origin/main
          git log --oneline -1 main
      - name: Select the design review base
        run: |
          design_review_base=$(git merge-base origin/main HEAD)
          echo "DESIGN_REVIEW_BASE=$design_review_base" >> "$GITHUB_ENV"
          git log --oneline -1 "$design_review_base"
      - name: static
        env:
          WHITEFOOT_CHECK_TIMEOUT: 1500
        run: make static
      - name: conformance structure and coverage
        run: make conformance
      - name: design readiness
        run: make design-ready

  focused:
    name: adapter and program test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - name: Set the scratch root
        run: |
          echo "WHITEFOOT_SCRATCH_ROOT=$RUNNER_TEMP/whitefoot" >> "$GITHUB_ENV"
          echo "WHITEFOOT_TIME_BUDGET_RECORD=$RUNNER_TEMP/time-budget-overruns.txt" >> "$GITHUB_ENV"
      - name: Install the host toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          rustup default stable
          cargo --version
      - name: Fetch locked compiler dependencies
        run: cargo fetch --locked --manifest-path compiler/Cargo.toml
      - name: Decline core dumps
        run: sudo sysctl -w kernel.core_pattern=core
      - name: conformance adapter and the parked file program test
        env:
          WHITEFOOT_CHECK_TIMEOUT: 2400
        run: |
          ulimit -c 0
          perl .github/run-check.pl tmp-focused cargo test --manifest-path compiler/Cargo.toml --profile gate --locked --offline --test corpus -- conformance::adapter:: programs::parallel::contexts_take_turns_appending_to_one_parked_file --nocapture

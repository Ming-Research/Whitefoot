# Temporary quick check for the linear-probing HashMap with high-bit homes
# (board item coord-wfbl-02-01): the container tests that exercise the
# HashMap, the million-member scan witness, the Firn tests that read the map's
# slots, the driver test that names the slot payload, the snapshot export of a
# HashMap (emitter, native runtime oracle and an end-to-end program, plus that
# program built with the chained map's library, whose layout the exporter must
# refuse), and the static group. Removed before the full check.
name: tmp-hash-probe

on:
  push:
    branches: [claude/hash-scan-resume]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - name: Install the host toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          echo "WHITEFOOT_SCRATCH_ROOT=$RUNNER_TEMP/whitefoot" >> "$GITHUB_ENV"
      - name: Fetch locked compiler dependencies
        run: cargo fetch --locked --manifest-path compiler/Cargo.toml
      - name: Check the HashMap library and the witness
        run: |
          perl .github/run-check.pl tmp-build cargo build --release --locked --offline --manifest-path compiler/Cargo.toml
          out="$RUNNER_TEMP/witness"
          compiler/target/release/whitefootc tests/programs/containers/hash-map-scan-witness.wf -o "$out"
          /usr/bin/time -v "$out"
      - name: HashMap container tests
        if: always()
        run: |
          cd compiler
          perl ../.github/run-check.pl tmp-containers cargo test --profile gate --test corpus --locked --offline -- programs::containers::hash_map programs::containers::indexed_membership --nocapture
      - name: Driver test naming the slot payload
        if: always()
        run: |
          cd compiler
          perl ../.github/run-check.pl tmp-driver cargo test --profile gate --lib --locked --offline -- driver::tests::unsupported_heap_payloads --nocapture
      - name: Firn tests
        if: always()
        run: |
          cd compiler
          perl ../.github/run-check.pl tmp-firn cargo test --profile gate --test corpus --locked --offline -- programs::network::firn

  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - name: Install the host toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          echo "WHITEFOOT_SCRATCH_ROOT=$RUNNER_TEMP/whitefoot" >> "$GITHUB_ENV"
      - name: Fetch locked compiler dependencies
        run: cargo fetch --locked --manifest-path compiler/Cargo.toml
      - name: Snapshot emitter tests
        run: |
          cd compiler
          perl ../.github/run-check.pl tmp-snapshot-lib cargo test --profile gate --lib --locked --offline -- backend::tests::snapshot --nocapture
      - name: Snapshot program tests
        if: always()
        run: |
          cd compiler
          perl ../.github/run-check.pl tmp-snapshot-programs cargo test --profile gate --test corpus --locked --offline -- programs::snapshot_export --nocapture
      - name: Native snapshot runtime oracle
        if: always()
        run: |
          make -C compiler -j"$(getconf _NPROCESSORS_ONLN)" completion-test-images
          make -C compiler completion-fork-capsule-test
      - name: The exporter refuses the chained map's bucket layout
        if: always()
        run: |
          git checkout 5f86546e3 -- lib/std/collections/hash_map/hash-map.wf lib/std/collections/hash_map/module.wfm
          cd compiler
          set +e
          cargo test --profile gate --test corpus --locked --offline -- programs::snapshot_export::capture_exports_the_pairs_of_a_hash_map_value --exact > "$RUNNER_TEMP/chained.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/chained.log"
          test "$status" -ne 0
          grep -Ei 'InvalidIr|invalid IR' "$RUNNER_TEMP/chained.log"

  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - name: Install the host toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          rustup default stable
          rustup component add clippy rustfmt
          cargo fetch --locked --manifest-path compiler/Cargo.toml
          echo "WHITEFOOT_SCRATCH_ROOT=$RUNNER_TEMP/whitefoot" >> "$GITHUB_ENV"
      - name: Name main and the design base
        run: |
          git branch -f main origin/main
          echo "DESIGN_REVIEW_BASE=$(git merge-base origin/main HEAD)" >> "$GITHUB_ENV"
      - name: Run make static
        run: make static

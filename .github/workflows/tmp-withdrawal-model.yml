# Temporary: runs the timed-atomic withdrawal model (research only).
# Removed before the branch is ready.
name: tmp-withdrawal-model

on:
  push:
    branches: [claude/atomic-wait-study]

jobs:
  model:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Exhaustive withdrawal model
        run: |
          set -e
          cd research/investigations/atomic-wait-alternatives
          /usr/bin/time -v python3 withdrawal_model.py

# Temporary (wf-gate-budget-noise): removed before the branch is ready.
# The quick workflow for the change to the semantic tests' driver: builds the
# library in test mode and runs the semantic test modules and the driver's.
name: tmp-semantic-tests

on:
  push:
    branches: [wf-gate-budget-noise]
    paths:
      - '.github/workflows/tmp-semantic-tests.yml'
      - 'compiler/src/semantic/tests.rs'

env:
  CARGO_TERM_COLOR: never

jobs:
  semantic:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install the host toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          rustup default stable
          rustup component add clippy
          cargo --version
          sudo sysctl -w kernel.core_pattern=core

      - name: Fetch locked compiler dependencies
        run: cargo fetch --locked --manifest-path compiler/Cargo.toml

      - name: Semantic tests
        run: |
          grep -m 1 'model name' /proc/cpuinfo
          perl .github/run-check.pl semantic-tests cargo test --manifest-path compiler/Cargo.toml --profile gate --locked --offline --lib semantic::

      - name: Lint
        run: |
          perl .github/run-check.pl lint cargo clippy --manifest-path compiler/Cargo.toml --all-targets --locked --offline -- -D warnings

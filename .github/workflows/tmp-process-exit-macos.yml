# Temporary: runs the immediate-exit program test on macOS, which no workflow
# the engine starts covers (gate.yml runs macOS only under `-f macos=true`).
# Deleted before the full check, which fails while a tmp- workflow exists.
# The engine pushes each commit it tests to its own `wf-try/` ref, often the
# same commit more than once, so one commit's runs queue one after another and
# a commit that has already passed here is not run again.
name: tmp process exit on macOS

on:
  push:
    branches: ['wf-try/work-176-26e0fade/**']

permissions:
  actions: read
  contents: read

concurrency:
  group: tmp-process-exit-macos-${{ github.sha }}
  cancel-in-progress: false

jobs:
  process-exit:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Look for an earlier pass on this commit
        id: earlier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/tmp-process-exit-macos.yml/runs?head_sha=$GITHUB_SHA&status=success" --jq '.total_count')
          echo "commit $GITHUB_SHA has $passed passing run(s) of this workflow"
          echo "passed=$passed" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.earlier.outputs.passed == '0'
      - name: Set the scratch root
        if: steps.earlier.outputs.passed == '0'
        run: echo "WHITEFOOT_SCRATCH_ROOT=$RUNNER_TEMP/whitefoot" >> "$GITHUB_ENV"
      - name: Install the host toolchain
        if: steps.earlier.outputs.passed == '0'
        run: |
          test -x /usr/bin/clang
          /usr/bin/clang --version
          rustup default stable
          cargo --version
      - name: Fetch locked compiler dependencies
        if: steps.earlier.outputs.passed == '0'
        run: cargo fetch --locked --manifest-path compiler/Cargo.toml
      - name: Run the process exit test
        if: steps.earlier.outputs.passed == '0'
        env:
          WHITEFOOT_CHECK_TIMEOUT: "2400"
        run: |
          perl .github/run-check.pl process-exit-macos \
            cargo test --manifest-path compiler/Cargo.toml --profile gate --locked --offline \
            --test corpus -- programs::process_exit:: --nocapture

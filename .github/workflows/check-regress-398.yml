# Temporary: show that the new tests of this branch detect the faults they
# guard. Each job restores sources.rs from an earlier revision and runs the
# four tests. Remove before this branch is ready.
name: check-regress-398

on:
  push:
    branches: [claude/check-regress-398]

concurrency:
  group: check-regress-398-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0

jobs:
  falsify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # 8ba7da5c6: before the fix (unconditional transport).
        # 60b5ea847: the first fix, which skipped a copied source too.
        sources: [8ba7da5c6, 60b5ea847]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run the new tests against sources.rs from ${{ matrix.sources }}
        run: |
          rustup default stable
          git checkout "${{ matrix.sources }}" -- compiler/src/semantic/entailment/flow/sources.rs
          git diff --stat HEAD
          for t in aggregate_give_does_not_register_unmentioned_measured_descendants \
                   an_aggregate_descendant_can_be_first_measured_after_give \
                   aggregate_give_preserves_a_family_when_length_or_only_capacity_was_read \
                   a_copied_generic_array_give_preserves_a_later_length_equality; do
            set +e
            cargo test --manifest-path compiler/Cargo.toml --profile gate --locked --lib "$t" -- --exact --nocapture > "out-$t.txt" 2>&1
            st=$?
            set -e
            printf 'FALSIFY sources=%s test=%s status=%s\n' "${{ matrix.sources }}" "$t" "$st"
            grep -E "panicked|assertion|test result" "out-$t.txt" | head -4 || true
          done

# Temporary quick workflow for proof-bl-repair-words-module: runs only the
# tests that pin the repair sentences moved into semantic::check::repairs.
# Removed before the branch is ready.
name: tmp-repair-words

on:
  push:
    branches: [proof-bl-repair-words-module]

permissions:
  contents: read

jobs:
  quick:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install the host toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          rustup default stable
          rustup component add clippy rustfmt
          cargo --version

      - name: Fetch locked compiler dependencies
        run: cargo fetch --locked --manifest-path compiler/Cargo.toml

      - name: Pinned repair sentences
        env:
          WHITEFOOT_CHECK_TIMEOUT: 1500
        run: perl .github/run-check.pl repair-words-pinned cargo test --manifest-path compiler/Cargo.toml --profile gate --locked --offline --lib driver::pinned

      - name: Diagnostic tests
        env:
          WHITEFOOT_CHECK_TIMEOUT: 1500
        run: perl .github/run-check.pl repair-words-diagnostic cargo test --manifest-path compiler/Cargo.toml --profile gate --locked --offline --lib driver::tests::

      - name: Effect and derivation tests
        env:
          WHITEFOOT_CHECK_TIMEOUT: 1500
        run: |
          perl .github/run-check.pl repair-words-ordinary-effects cargo test --manifest-path compiler/Cargo.toml --profile gate --locked --offline --lib semantic::tests::ordinary_effects
          perl .github/run-check.pl repair-words-derivation cargo test --manifest-path compiler/Cargo.toml --profile gate --locked --offline --lib semantic::tests::derivation

# Temporary hosted experiment; remove before the branch is ready.
# No emitter change: scratch IR first adopts the actual consumer's three
# measured LLVM forms; the candidate then changes only stack-probe attributes.
# Fixtures and signal/record expectations are maintained native floor tests.
name: Darwin stack-probe qualification

on:
  push:
    branches: [claude/bundled-clang]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: darwin-probe-qualify-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
  LLVM_VERSION: 22.1.8
  LLVM_ARCHIVE: LLVM-22.1.8-macOS-ARM64.tar.xz
  LLVM_SHA256: f260f4f7c0d430828a81ae8a3826a1d63fc0963ec2459489308cc23b1f7eab4f
  WHITEFOOT_CHECK_TIMEOUT: 1800

jobs:
  qualify:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The runner context is not available in job-level env, so the scratch
      # paths are exported here for every later step.
      - name: Set scratch paths
        run: |
          {
            echo "QUALIFY_DIR=$RUNNER_TEMP/darwin-probe-qualify"
            echo "WHITEFOOT_TIME_BUDGET_FILE=$RUNNER_TEMP/darwin-probe-budgets.txt"
            echo "WHITEFOOT_TIME_BUDGET_RECORD=$RUNNER_TEMP/darwin-probe-qualify/budgets.tsv"
          } >> "$GITHUB_ENV"

      - name: Record host and provisional experiment limits
        run: |
          set -euo pipefail
          mkdir -p "$QUALIFY_DIR"
          test "$(uname -m)" = arm64
          # Provisional safety deadlines, not measurements or gate budgets.
          # macOS budget comparisons are report-only; record costs on this run.
          cat > "$WHITEFOOT_TIME_BUDGET_FILE" <<'EOF'
          label macos windows
          darwin-probe/compiler-build 1800 -
          darwin-probe/experiment 1800 -
          EOF
          {
            uname -a
            sw_vers
            git rev-parse HEAD
            /usr/bin/clang --version
            xcrun --show-sdk-path
            xcrun --find ld
          } > "$QUALIFY_DIR/host.txt"
          cat "$QUALIFY_DIR/host.txt"
          echo "SDKROOT=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"
          echo "SYSTEM_LD=$(xcrun --find ld)" >> "$GITHUB_ENV"

      - name: Install the exact official upstream LLVM archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/llvm/llvm-project/releases/tags/llvmorg-$LLVM_VERSION" > "$QUALIFY_DIR/llvm-release.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['QUALIFY_DIR'])
          release = json.loads((root / 'llvm-release.json').read_text())
          assets = [a for a in release['assets'] if a['name'] == os.environ['LLVM_ARCHIVE']]
          assert len(assets) == 1, 'exact official macOS ARM64 archive is missing or ambiguous'
          asset = assets[0]
          wanted = 'sha256:' + os.environ['LLVM_SHA256']
          published = asset.get('digest')
          if published:
              assert published == wanted, f'publisher digest changed: {published} != {wanted}'
          expected_url = ('https://github.com/llvm/llvm-project/releases/download/'
                          'llvmorg-' + os.environ['LLVM_VERSION'] + '/' + os.environ['LLVM_ARCHIVE'])
          assert asset['browser_download_url'] == expected_url
          (root / 'archive-metadata.json').write_text(json.dumps(asset, indent=2) + '\n')
          (root / 'checksum-source.txt').write_text(
              f'Pinned SHA256: {wanted}\nPublisher digest: {published or "not supplied in release metadata"}\n')
          PY
          curl --fail --location --retry 3 \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/$LLVM_ARCHIVE" \
            -o "$RUNNER_TEMP/$LLVM_ARCHIVE"
          printf '%s  %s\n' "$LLVM_SHA256" "$RUNNER_TEMP/$LLVM_ARCHIVE" > "$QUALIFY_DIR/archive.sha256"
          shasum -a 256 -c "$QUALIFY_DIR/archive.sha256" > "$QUALIFY_DIR/checksum.log"
          cat "$QUALIFY_DIR/checksum.log"
          mkdir -p "$RUNNER_TEMP/upstream-llvm-$LLVM_VERSION"
          tar -xJf "$RUNNER_TEMP/$LLVM_ARCHIVE" -C "$RUNNER_TEMP/upstream-llvm-$LLVM_VERSION" --strip-components=1
          test -x "$RUNNER_TEMP/upstream-llvm-$LLVM_VERSION/bin/clang"
          test -x "$RUNNER_TEMP/upstream-llvm-$LLVM_VERSION/bin/llvm-objdump"
          "$RUNNER_TEMP/upstream-llvm-$LLVM_VERSION/bin/clang" --version > "$QUALIFY_DIR/upstream-version.txt"
          cat "$QUALIFY_DIR/upstream-version.txt"
          grep -F "clang version $LLVM_VERSION" "$QUALIFY_DIR/upstream-version.txt"
          echo "UPSTREAM_ROOT=$RUNNER_TEMP/upstream-llvm-$LLVM_VERSION" >> "$GITHUB_ENV"
          # Never add upstream LLVM to PATH or replace /usr/bin/clang: the CLI's
          # current capability probes deliberately retain the Apple consumer.

      - name: Fetch locked compiler dependencies
        run: |
          rustup default stable
          cargo fetch --locked --manifest-path compiler/Cargo.toml

      - name: Build the unchanged compiler with the normal gate profile
        id: build
        run: |
          set +e
          perl .github/run-check.pl darwin-probe/compiler-build \
            cargo build --manifest-path compiler/Cargo.toml --profile gate --locked --offline --bin whitefootc \
            > "$QUALIFY_DIR/compiler-build.log" 2>&1
          status=$?
          printf '%s\n' "$status" > "$QUALIFY_DIR/compiler-build.status"
          cat "$QUALIFY_DIR/compiler-build.log"
          exit "$status"

      - name: Prepare the scratch qualification instrument
        run: |
          cat > "$RUNNER_TEMP/darwin-probe-qualify.py" <<'PY'
          # Experiment-only instrument. No compiler or maintained fixture edit.
          import difflib, json, os, re, resource, shutil, subprocess, sys, time, traceback
          from pathlib import Path

          root = Path(os.environ['QUALIFY_DIR'])
          repo = Path.cwd()
          backend = repo / 'compiler/src/backend'
          upstream = Path(os.environ['UPSTREAM_ROOT'])
          compiler = repo / 'compiler/target/gate/whitefootc'
          sdk = os.environ['SDKROOT']
          ld = os.environ['SYSTEM_LD']
          resource.setrlimit(resource.RLIMIT_CORE, (0, 0))
          rows, failures = [], []
          record = b'{"resource":"stack"}\n'
          opt = ['-O2', '-falign-functions=64']
          toolchains = {'upstream': upstream / 'bin/clang', 'Apple': Path('/usr/bin/clang')}

          def result(step, toolchain, okay, text):
              rows.append((step, toolchain, ('PASS: ' if okay else 'FAIL: ') + text))
              (root / 'results.tsv').write_text(''.join('\t'.join(r) + '\n' for r in rows))
              print(f'{step} [{toolchain}]: {rows[-1][2]}', flush=True)
              if not okay:
                  failures.append(f'{step} [{toolchain}]: {text}')

          def run(label, command, *, timeout=120, env=None):
              path = root / label
              path.parent.mkdir(parents=True, exist_ok=True)
              started = time.monotonic()
              metadata = {'argv': [str(x) for x in command], 'cwd': str(repo)}
              try:
                  p = subprocess.run(metadata['argv'], stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                                     timeout=timeout, env=env)
                  metadata.update(returncode=p.returncode, elapsed_seconds=time.monotonic() - started)
                  path.with_suffix('.stdout').write_bytes(p.stdout)
                  path.with_suffix('.stderr').write_bytes(p.stderr)
                  return p
              except subprocess.TimeoutExpired as error:
                  metadata.update(timeout_seconds=timeout, elapsed_seconds=time.monotonic() - started)
                  path.with_suffix('.stdout').write_bytes(error.stdout or b'')
                  path.with_suffix('.stderr').write_bytes(error.stderr or b'')
                  raise
              except OSError as error:
                  metadata.update(execution_error=str(error), elapsed_seconds=time.monotonic() - started)
                  path.with_suffix('.stderr').write_text(str(error) + '\n')
                  raise
              finally:
                  path.with_suffix('.command.json').write_text(json.dumps(metadata, indent=2) + '\n')

          def must_run(label, command):
              p = run(label, command)
              assert p.returncode == 0, f'{label}: exit {p.returncode}; see saved stderr'
              return p

          # These are the compiler's rendered probe inputs, not substitute
          # experiments. Pin each exact Rust literal and decode only its used
          # escapes; drift or missing source is a setup error before clang runs.
          probe_literals = {
              'coro_end_result': r'''"declare void @llvm.coro.end(ptr, i1, token)\n\n\
                   define void @probe() {\n  \
                   call void @llvm.coro.end(ptr null, i1 false, token none)\n  ret void\n}\n"''',
              'preserve_none': r'''"define internal preserve_nonecc i64 @q(i64 %a) {\n  ret i64 %a\n}\n\n\
                   define preserve_nonecc i64 @p(i64 %a) {\n  \
                   %r = musttail call preserve_nonecc i64 @q(i64 %a)\n  ret i64 %r\n}\n"''',
              'no_capture_attribute': r'''"define void @p(ptr {NEW} %v) {{\n  ret void\n}}\n"''',
          }
          probe_inputs = {
              'coro_end_result': 'declare void @llvm.coro.end(ptr, i1, token)\n\ndefine void @probe() {\n  call void @llvm.coro.end(ptr null, i1 false, token none)\n  ret void\n}\n',
              'preserve_none': 'define internal preserve_nonecc i64 @q(i64 %a) {\n  ret i64 %a\n}\n\ndefine preserve_nonecc i64 @p(i64 %a) {\n  %r = musttail call preserve_nonecc i64 @q(i64 %a)\n  ret i64 %r\n}\n',
              'no_capture_attribute': 'define void @p(ptr captures(none) %v) {\n  ret void\n}\n',
          }
          probe_source_functions = {'coro_end_result': 'coro_end_result',
                                    'preserve_none': 'preserve_none_supported',
                                    'no_capture_attribute': 'no_capture_attribute'}
          probe_flags = {'coro_end_result': ['-x', 'ir', '-S', '-emit-llvm', '-fverify-intermediate-code', '-o'],
                         'preserve_none': ['-x', 'ir', '-c', '-o'],
                         'no_capture_attribute': ['-x', 'ir', '-c', '-o']}

          def checked_probe_inputs(source):
              rendered = {}
              for key, literal in probe_literals.items():
                  assert source.count(literal) == 1, f'missing/changed compiler probe source: {key}'
                  marker = 'fn ' + probe_source_functions[key] + '(directory: &Path)'
                  assert source.count(marker) == 1, f'missing/ambiguous compiler probe function: {key}'
                  body = source.split(marker, 1)[1].split('\n}', 1)[0]
                  assert body.count(literal) == 1, f'probe literal moved outside its owner: {key}'
                  command_flags = re.findall(r'\.args\(\[(.*?)\]\)', body, re.S)
                  assert len(command_flags) == 1, f'probe command shape changed: {key}'
                  expected_flags = ','.join('"' + flag + '"' for flag in probe_flags[key])
                  assert re.sub(r'\s+', '', command_flags[0]).rstrip(',') == expected_flags, f'compiler probe flags changed: {key}'
                  text = re.sub(r'\\\n\s*', '', literal[1:-1])
                  text = text.replace(r'\n', '\n')
                  assert '\\' not in text, f'unhandled Rust escape in {key}'
                  if key == 'no_capture_attribute':
                      assert 'const NEW: &str = "captures(none)";' in body
                      text = text.replace('{NEW}', 'captures(none)').replace('{{', '{').replace('}}', '}')
                  assert text.encode() == probe_inputs[key].encode(), f'probe bytes differ: {key}'
                  rendered[key] = text
              return rendered

          def consumer_facts():
              inputs = checked_probe_inputs((repo / 'compiler/src/toolchain.rs').read_text())
              # Same policy and flags as toolchain.rs, without isysroot/O2:
              # the coro probe is verification-only, never code generation.
              facts = {}
              for tc, clang in toolchains.items():
                  directory = root / 'consumer-probes' / tc
                  directory.mkdir(parents=True, exist_ok=True)
                  answers = {}
                  for key, text in inputs.items():
                      probe = directory / (key + '.ll')
                      probe.write_bytes(text.encode())
                      output = directory / (key + ('.verified.ll' if key == 'coro_end_result' else '.o'))
                      p = run(f'consumer-probes/{tc}/{key}', [clang] + probe_flags[key] + [output, probe])
                      # OSError and timeout propagate as setup failures. Only a
                      # completed rejection chooses the compiler's old form.
                      assert p.returncode >= 0, f'{tc}/{key}: probe terminated by signal {p.returncode}'
                      answers[key] = {'returncode': p.returncode, 'accepted': p.returncode == 0}
                  facts[tc] = {
                      'preserve_none': answers['preserve_none']['accepted'],
                      'no_capture_attribute': 'captures(none)' if answers['no_capture_attribute']['accepted'] else 'nocapture',
                      'coro_end_result': 'void' if answers['coro_end_result']['accepted'] else 'i1',
                  }
                  (directory / 'answers.json').write_text(json.dumps(answers, indent=2) + '\n')
                  (directory / 'facts.json').write_text(json.dumps(facts[tc], indent=2) + '\n')
                  result('compiler-owned consumer probes', tc, True, json.dumps(facts[tc], sort_keys=True))
              (root / 'consumer-facts.json').write_text(json.dumps(facts, indent=2) + '\n')
              (root / 'consumer-facts.diff').write_text(''.join(difflib.unified_diff(
                  json.dumps(facts['Apple'], indent=2).splitlines(True),
                  json.dumps(facts['upstream'], indent=2).splitlines(True), fromfile='Apple facts', tofile='upstream facts')))
              return facts

          def floor_outcome(p, status, stdout, stderr):
              # Python receives direct Unix signal status, unlike a shell's
              # ambiguous 128+signal representation. Exact bytes match the
              # maintained assert_resource_record; no substring verdict.
              assert p.returncode == status, f'status={p.returncode}, expected={status}'
              assert p.stdout == stdout, f'stdout={p.stdout!r}, expected={stdout!r}'
              assert p.stderr == stderr, f'stderr={p.stderr!r}, expected={stderr!r}'

          def oracle_controls():
              from types import SimpleNamespace
              valid = SimpleNamespace(returncode=-6, stdout=b'', stderr=record)
              floor_outcome(valid, -6, b'', record)
              wrong = [SimpleNamespace(returncode=-10, stdout=b'', stderr=record),
                       SimpleNamespace(returncode=-6, stdout=b'', stderr=b''),
                       SimpleNamespace(returncode=-6, stdout=b'', stderr=record + b'extra\n'),
                       SimpleNamespace(returncode=-6, stdout=b'extra\n', stderr=record)]
              for observation in wrong:
                  try:
                      floor_outcome(observation, -6, b'', record)
                  except AssertionError:
                      continue
                  raise AssertionError('floor checker accepted an injected wrong observation')
              try:
                  raw_constant('', 'LARGE_FRAME_SPINE')
              except AssertionError:
                  pass
              else:
                  raise AssertionError('fixture extractor accepted missing input')
              result('floor oracle and missing-input controls', 'instrument', True,
                     'correct result accepted; wrong signal, absent/extra record, extra stdout and missing fixture rejected')
              # Verify the native-code recognizer against both printer formats
              # before trusting it on generated code. A one-shot decrement
              # with an unrelated comparison/branch must never count as a walk.
              assembly = ('Lprobe:\n\tsub sp, sp, #1, lsl #12\n'
                          '\tstr xzr, [sp]\n\tcmp sp, x9\n\tb.ne Lprobe\nLafter:\n\tret\n')
              disassembly = ('0000000000001000 <_wf_spine>:\n'
                             '1000: sub sp, sp, #0x1, lsl #12\n'
                             '1004: str xzr, [sp]\n1008: cmp sp, x9, uxtx\n'
                             '100c: b.ne 0x1000 <_wf_spine>\n1010: ret\n')
              for text, linked, touch, stride, backedge, forward in [
                  (assembly, False, '\tstr xzr, [sp]\n', '#1, lsl #12', 'b.ne Lprobe', 'b.ne Lafter'),
                  (disassembly, True, '1004: str xzr, [sp]\n', '#0x1, lsl #12', 'b.ne 0x1000', 'b.ne 0x1010'),
              ]:
                  assert inline_walk(text, linked=linked), 'recognizer rejected its valid loop control'
                  flawed = [text.replace(touch, touch.replace('str xzr, [sp]', 'nop')), text.replace(stride, '#2, lsl #12'),
                            text.replace(backedge, forward), text.replace('cmp sp,', 'cmp x10,')]
                  for bad in flawed:
                      assert not inline_walk(bad, linked=linked), 'recognizer accepted a flawed page-walk control'
              result('native page-walk recognizer controls', 'instrument', True,
                     'assembly/disassembly loops accepted; missing touch, wrong stride, forward branch and non-SP compare rejected')

          def exact_replace(text, old, new):
              assert text.count(old) == 1, f'fixture shape changed: {old!r}'
              return text.replace(old, new, 1)

          def raw_constant(text, name):
              matches = re.findall(r'const\s+' + re.escape(name) + r'\s*:[^=]*=\s*b?r#"(.*?)"#;', text, re.S)
              assert len(matches) == 1, f'missing/ambiguous maintained constant {name}'
              return matches[0]

          def formatted_fixture(text, name, **parameters):
              start = text.index('pub(crate) fn ' + name + '(')
              tail = text[start:]
              matches = re.search(r'format!\(\s*r#"(.*?)"#\s*\)', tail, re.S)
              assert matches, f'fixture format changed: {name}'
              source = matches.group(1)
              for key, value in parameters.items():
                  assert '{' + key + '}' in source
                  source = source.replace('{' + key + '}', str(value))
              # Only Rust format escapes and the explicitly supplied constants.
              source = source.replace('{{', '{').replace('}}', '}')
              assert not re.search(r'\{(?:depth|slots)\}', source)
              return source

          def expose(module, large):
              # Same entry substitution as exhaustion.rs / stack_ledger.rs.
              # Save raw compiler IR separately; these are C observer adapters.
              module = exact_replace(module, 'define i32 @wf__main_body(', 'define i32 @wf__unused_main_body(')
              module = exact_replace(module, 'define i32 @main(', 'define i32 @wf__unused_main(')
              if large:
                  module = module.replace('define internal i64 @wf_spine(', 'define i64 @wf_spine(', 1)
                  module = exact_replace(module, 'define i64 @wf_read_pad(', 'define i64 @wf_read_pad(')
                  lines = module.splitlines()
                  readers = [i for i, line in enumerate(lines) if line.startswith('define i64 @wf_read_pad(')]
                  assert len(readers) == 1
                  i = readers[0]
                  lines[i] = exact_replace(lines[i], ' #0 align 64 {', ' noinline #0 align 64 {')
                  module = '\n'.join(lines)
              assert len(re.findall(r'^define (?:internal )?(?:i64|double) @wf_spine\(', module, re.M)) == 1
              return module + '\ndeclare i32 @wf__main_body(i32, ptr)\n'

          old_probe = '"probe-stack"="__chkstk_darwin"'
          new_probe = '"probe-stack"="inline-asm" "stack-probe-size"="4096"'

          def ir_tokens(line):
              # Retain offsets and treat quoted strings/symbols as one token.
              # Semicolons outside strings start comments, whose bytes remain
              # in the fingerprint and are never an editable fact slot.
              pattern = r'"(?:[^"\\]|\\.)*"|[@%](?:"(?:[^"\\]|\\.)*"|[-\w.$]+)|[A-Za-z_][-\w.]*|\d+|[^\s]'
              tokens = []
              for match in re.finditer(pattern, line):
                  if match.group() == ';':
                      break
                  tokens.append((match.group(), match.start(), match.end()))
              return tokens

          def fact_fingerprint(text, facts, *, inline=False):
              # This validator is independent of rewrite_facts: it identifies
              # legal typed/token contexts, replaces only those spans with
              # placeholders and compares every remaining byte. Thus an
              # unrelated edit shared by a faulty forward/reverse transformer
              # cannot pass. Comments, strings and symbol names stay literal.
              assert type(facts['preserve_none']) is bool
              assert facts['no_capture_attribute'] in ['nocapture', 'captures(none)']
              assert facts['coro_end_result'] in ['i1', 'void']
              spans, counts, offset = [], {'capture': 0, 'coro_declaration': 0, 'coro_call': 0,
                                         'preserve_none': 0, 'eligible_dispatch_definitions': 0, 'probe': 0}, 0
              current, references, definitions, eligible = None, {}, {}, set()
              # A public enclosing function can call a part before the part's
              # later definition. Collect known internal helper names first.
              for line in text.splitlines(True):
                  words = [t[0] for t in ir_tokens(line)]
                  if words and words[0] == 'define':
                      symbols = [word for word in words if word.startswith('@')]
                      if len(symbols) == 1 and re.search(r'\.(?:dispatch|arm\.\d+)$', symbols[0]):
                          assert re.fullmatch(r'@wf_[-\w.$]+(?:\.dispatch|\.arm\.\d+)', symbols[0]), 'unknown dispatch helper naming'
                          assert words[1] == 'internal', 'dispatch part must remain internal'
                          eligible.add(symbols[0])
              for line in text.splitlines(True):
                  ts = ir_tokens(line)
                  words = [t[0] for t in ts]
                  capture_positions = set()
                  signature = bool(words and words[0] in ['define', 'declare'])
                  if signature:
                      symbols = [i for i, word in enumerate(words) if word.startswith('@')]
                      assert len(symbols) == 1, 'unrecognized function signature'
                      symbol_at = symbols[0]
                      symbol = words[symbol_at]
                      if words[0] == 'define':
                          assert current is None, 'nested/unclosed IR function'
                          current = symbol
                          references[current], definitions[current] = 0, 0
                          if re.fullmatch(r'@wf_[-\w.$]+(?:\.dispatch|\.arm\.\d+)', symbol):
                              assert words[1] == 'internal', 'dispatch part must remain internal'
                              assert (words[2] == 'preserve_nonecc') == facts['preserve_none'], 'dispatch convention differs from consumer probe'
                              counts['eligible_dispatch_definitions'] += 1
                      assert words[symbol_at + 1] == '(', 'unrecognized parameter list'
                      # Split the actual signature parameters, retaining nested
                      # aggregate types and parenthesized parameter attributes.
                      depth, start, segments = 0, symbol_at + 2, []
                      for i in range(start, len(words)):
                          word = words[i]
                          if word == ')' and depth == 0:
                              segments.append((start, i))
                              break
                          if word == ',' and depth == 0:
                              segments.append((start, i))
                              start = i + 1
                          elif word in ['(', '{', '[', '<']:
                              depth += 1
                          elif word in [')', '}', ']', '>']:
                              depth -= 1
                              assert depth >= 0
                      else:
                          raise AssertionError('unterminated signature parameters')
                      for first, last in segments:
                          for i in range(first, last):
                              if words[i] not in ['nocapture', 'captures']:
                                  continue
                              width = 1 if words[i] == 'nocapture' else 4
                              form = 'nocapture' if width == 1 else 'captures(none)'
                              assert words[first] == 'ptr', 'capture attribute outside a pointer parameter'
                              assert words[first + 1:i] == [w for w in words[first + 1:i]
                                                          if w in ['noalias', 'readonly', 'nonnull']], 'unknown pre-capture parameter attributes'
                              assert width == 1 or words[i:i + 4] == ['captures', '(', 'none', ')'], 'unknown capture spelling'
                              assert i + width <= last and form == facts['no_capture_attribute'], 'IR capture form differs from consumer probe'
                              assert line[ts[i][1]:ts[i + width - 1][2]] == form, 'noncanonical capture token bytes'
                              # Attribute must precede the parameter name. It
                              # cannot be a value, return attribute or call arg.
                              assert not any(w.startswith('%') for w in words[first:i])
                              spans.append((offset + ts[i][1], offset + ts[i + width - 1][2], 'capture'))
                              capture_positions.add(i)
                              counts['capture'] += 1
                  if '@llvm.coro.end' in words:
                      declaration = re.fullmatch(r'declare (i1|void) @llvm\.coro\.end\(ptr, i1, token\)(\n)?', line)
                      call = re.fullmatch(r'  (%wf\.coro\.end = call i1|call void) @llvm\.coro\.end\(ptr null, i1 false, token none\)(\n)?', line)
                      assert bool(declaration) != bool(call), 'unknown coro.end declaration/call form'
                      if declaration:
                          assert declaration.group(1) == facts['coro_end_result'], 'IR coro declaration differs from consumer probe'
                          spans.append((offset + declaration.start(1), offset + declaration.end(1), 'coro_declaration'))
                          counts['coro_declaration'] += 1
                      else:
                          expected = 'call void' if facts['coro_end_result'] == 'void' else '%wf.coro.end = call i1'
                          assert current is not None and call.group(1) == expected, 'IR coro call differs from consumer probe'
                          spans.append((offset + call.start(1), offset + call.end(1), 'coro_call'))
                          counts['coro_call'] += 1
                          if facts['coro_end_result'] == 'i1':
                              definitions[current] += 1
                  if current is not None:
                      references[current] += words.count('%wf.coro.end')
                  elif '%wf.coro.end' in words:
                      raise AssertionError('coro.end SSA name outside a function')
                  for i, word in enumerate(words):
                      if word in ['nocapture', 'captures']:
                          assert i in capture_positions, 'capture token outside actual signature parameter attribute'
                      if word == 'preserve_nonecc':
                          # No convention upgrade is attempted: the compiler's
                          # choice can also change part selection/register ABI.
                          assert facts['preserve_none'], 'IR preserve_none differs from consumer probe'
                          definition = signature and words[0] == 'define' and current in eligible and i == 2
                          transfer = current is not None and i > 0 and words[i - 1] == 'call'
                          target = next((w for w in words[i + 1:] if w.startswith(('@', '%'))), None)
                          assert definition or (transfer and (target in eligible or current in eligible)), 'preserve_none outside known internal dispatch entities'
                          counts['preserve_none'] += 1
                  if '"probe-stack"' in words or '"stack-probe-size"' in words:
                      expected = new_probe if inline else old_probe
                      match = re.fullmatch(r'attributes #0 = \{ (' + re.escape(expected) + r') \}(\n)?', line)
                      assert match, 'unknown stack-probe attribute/context'
                      spans.append((offset + match.start(1), offset + match.end(1), 'probe'))
                      counts['probe'] += 1
                  if words == ['}']:
                      assert current is not None
                      current = None
                  offset += len(line)
              assert current is None, 'unterminated IR function'
              assert all(references[key] == definitions[key] and definitions[key] <= 1 for key in references), 'old coro.end SSA result is used or multiply defined'
              assert counts['coro_declaration'] <= 1 and (counts['coro_call'] == 0 or counts['coro_declaration'] == 1)
              assert counts['probe'] == 1, 'one original/candidate probe group required'
              pieces, end = [], 0
              for first, last, kind in sorted(spans):
                  assert end <= first < last
                  pieces += [text[end:first], '<consumer-' + kind + '>']
                  end = last
              pieces.append(text[end:])
              return ''.join(pieces), counts

          def validate_delta(original, changed, before, after, *, inline=False):
              left, old_counts = fact_fingerprint(original, before)
              right, new_counts = fact_fingerprint(changed, after, inline=inline)
              assert old_counts == new_counts, 'consumer rewrite changed fact/context counts'
              if before['preserve_none'] != after['preserve_none']:
                  assert old_counts['eligible_dispatch_definitions'] == 0, 'unsupported dispatch convention normalization: consumer fact affects register layout and part selection'
                  assert old_counts['preserve_none'] == 0
              assert left == right, 'IR contains a byte change outside measured fact forms/probe attributes'
              return old_counts

          def rewrite_facts(original, before, after):
              # Forward edits deliberately do not use the fingerprint's spans.
              # Independent validation below confines every changed byte.
              _, counts = fact_fingerprint(original, before)
              if before['preserve_none'] != after['preserve_none'] and counts['eligible_dispatch_definitions']:
                  raise AssertionError('unsupported dispatch convention normalization: re-emission is required')
              lines = []
              for line in original.splitlines(True):
                  if line.startswith(('define ', 'declare ')):
                      pattern = r'(ptr(?: (?:noalias|readonly|nonnull))* )' + re.escape(before['no_capture_attribute']) + r'(?= )'
                      line = re.sub(pattern, lambda m: m.group(1) + after['no_capture_attribute'], line)
                  if before['coro_end_result'] != after['coro_end_result']:
                      line = line.replace('declare ' + before['coro_end_result'] + ' @llvm.coro.end(ptr, i1, token)',
                                          'declare ' + after['coro_end_result'] + ' @llvm.coro.end(ptr, i1, token)')
                      old_call = 'call void' if before['coro_end_result'] == 'void' else '%wf.coro.end = call i1'
                      new_call = 'call void' if after['coro_end_result'] == 'void' else '%wf.coro.end = call i1'
                      line = line.replace(old_call + ' @llvm.coro.end(ptr null, i1 false, token none)',
                                          new_call + ' @llvm.coro.end(ptr null, i1 false, token none)')
                  lines.append(line)
              baseline = ''.join(lines)
              validate_delta(original, baseline, before, after)
              return baseline

          def inline_candidate(original, facts):
              assert original.count(old_probe) == 1 and '"stack-probe-size"' not in original
              candidate = original.replace(old_probe, new_probe)
              validate_delta(original, candidate, facts, facts, inline=True)
              return candidate

          def consumer_controls():
              old = {'preserve_none': False, 'no_capture_attribute': 'nocapture', 'coro_end_result': 'i1'}
              new = {'preserve_none': True, 'no_capture_attribute': 'captures(none)', 'coro_end_result': 'void'}
              # Independent, hand-written expected input/output: not the
              # transformer's own earlier output used as its oracle.
              apple = ('; nocapture llvm.coro.end remain literal\n'
                       '@nocapture = private constant [10 x i8] c"nocapture\\00"\n'
                       'declare i1 @llvm.coro.end(ptr, i1, token)\n'
                       'declare void @nocapture(ptr noalias nonnull nocapture %v)\n'
                       'define i64 @wf_guard(i64 %v) #0 align 64 {\n'
                       '  %r = add i64 %v, 1\n'
                       '  %wf.coro.end = call i1 @llvm.coro.end(ptr null, i1 false, token none)\n'
                       '  ret i64 %r\n}\n'
                       'attributes #0 = { "probe-stack"="__chkstk_darwin" }\n')
              expected = ('; nocapture llvm.coro.end remain literal\n'
                          '@nocapture = private constant [10 x i8] c"nocapture\\00"\n'
                          'declare void @llvm.coro.end(ptr, i1, token)\n'
                          'declare void @nocapture(ptr noalias nonnull captures(none) %v)\n'
                          'define i64 @wf_guard(i64 %v) #0 align 64 {\n'
                          '  %r = add i64 %v, 1\n'
                          '  call void @llvm.coro.end(ptr null, i1 false, token none)\n'
                          '  ret i64 %r\n}\n'
                          'attributes #0 = { "probe-stack"="__chkstk_darwin" }\n')
              assert rewrite_facts(apple, old, new) == expected
              validate_delta(apple, apple, old, old)
              validate_delta(apple, expected, old, new)
              candidate = expected.replace(old_probe, new_probe)
              validate_delta(apple, candidate, old, new, inline=True)
              validate_delta(expected, candidate, new, new, inline=True)
              assert rewrite_facts(expected, new, old) == apple
              bad = [
                  expected.replace('add i64', 'sub i64'),
                  expected.replace('add i64', 'add i32'),
                  expected.replace('%v, 1', '%v, 2'),
                  expected.replace('nonnull captures', 'readonly captures'),
                  expected.replace('@wf_guard', '@wf_changed'),
                  expected.replace('i1 false', 'i1 true'),
                  expected.replace('@llvm.coro.end(ptr null', '@llvm.coro.begin(ptr null'),
                  expected.replace('declare void @nocapture', 'declare i64 @nocapture'),
                  expected.replace('; nocapture', '; captures(none)'),
                  expected.replace('c"nocapture\\00"', 'c"captures(none)\\00"'),
                  expected.replace('@nocapture', '@captures_none'),
                  expected.replace('captures(none)', 'captures (none)'),
                  expected.replace('ptr noalias nonnull captures(none) %v', 'ptr noalias nonnull %captures(none)'),
                  expected.replace('  ret i64 %r', '  call void @other(ptr captures(none) null)\n  ret i64 %r'),
                  candidate.replace('"4096"', '"8192"'),
                  candidate.replace('"inline-asm"', '"other"'),
              ]
              for changed in bad:
                  try:
                      validate_delta(apple, changed, old, new, inline='"stack-probe-size"' in changed)
                  except AssertionError:
                      continue
                  raise AssertionError('fact/probe byte guard accepted injected unrelated IR/context')
              # Reject a used legacy result before any deletion, and a C part
              # that would require a different convention/layout on upstream.
              consumed = apple.replace('  ret i64 %r', '  %use = zext i1 %wf.coro.end to i64\n  ret i64 %r')
              dispatch = apple.replace('@wf_guard', '@wf_guard.dispatch').replace('define i64', 'define internal i64')
              for unsupported in [consumed, dispatch]:
                  try:
                      rewrite_facts(unsupported, old, new)
                  except AssertionError:
                      continue
                  raise AssertionError('fact rewrite accepted used coro result/unsupported dispatch upgrade')
              source = (repo / 'compiler/src/toolchain.rs').read_text()
              checked_probe_inputs(source)
              changed_source = source.replace('call void @llvm.coro.end', 'call void @llvm.coro.foo', 1)
              assert changed_source != source and len(changed_source) == len(source)
              for invalid_source in ['', changed_source]:
                  try:
                      checked_probe_inputs(invalid_source)
                  except AssertionError:
                      continue
                  raise AssertionError('probe source guard accepted missing/drifted source')
              result('consumer fact and independent byte-allowlist controls', 'instrument', True,
                     'unchanged/explicit three-fact delta/probe attributes accepted; instruction, type, constant, attribute, symbol, coro operands, other intrinsic, signature, comment, string, context, probe size, missing source, used coro SSA and unsupported dispatch upgrade rejected')

          def negative(module):
              # Exactly the maintained negative: isolate only array_filled,
              # remove only spine's group, and suppress Apple default probing.
              assert 'attributes #1 =' not in module
              lines = module.splitlines()
              fills = [i for i, line in enumerate(lines) if line.startswith('define void @wf_array_filled$instance$')]
              assert len(fills) == 1
              i = fills[0]
              lines[i] = exact_replace(lines[i], ' #0 align 64 {', ' noinline #0 align 64 {')
              spines = [i for i, line in enumerate(lines) if line.startswith('define ') and '@wf_spine(' in line]
              assert len(spines) == 1
              i = spines[0]
              lines[i] = exact_replace(lines[i], ' #0 align 64 {', ' #1 align 64 {')
              return '\n'.join(lines) + '\nattributes #1 = { "no-stack-arg-probe" }\n'

          def cflags(clang):
              return [clang, '-isysroot', sdk] + opt

          # Normal support.rs link order; concurrent_map.c is included by
          # keyed_table.c, never compiled twice. The runtime itself is unchanged.
          units = ['wf_floor.c', 'sched/core.c', 'sched/prim_host.c', 'sched/entry.c',
                   'completion/runtime.c', 'completion/wait_host.c', 'completion/file_adapter.c',
                   'completion/file_posix.c', 'completion/bridge.c', 'completion/stop_signals.c',
                   'completion/linux_io_uring.c', 'keyed_table.c', 'ordinary_values.c',
                   'ordinary_values.ll', 'heap.c']
          runtimes = {}

          def runtime_objects(tc, small):
              key = (tc, small)
              if key in runtimes:
                  return runtimes[key]
              directory = root / tc / ('runtime-1MiB' if small else 'runtime-normal')
              directory.mkdir(parents=True, exist_ok=True)
              floor = directory / 'wf_floor.c'
              text = (backend / 'wf_floor.c').read_text()
              if small:
                  definitions = re.findall(r'^#define WF_FLOOR_STACK_BYTES .*$', text, re.M)
                  assert len(definitions) == 1
                  text = exact_replace(text, definitions[0], '#define WF_FLOOR_STACK_BYTES ((size_t)1048576u)')
              floor.write_text(text)
              objects = []
              for i, unit in enumerate(units):
                  # Normal and 1 MiB stacks differ only in floor's reservation.
                  # Reuse immutable non-floor objects from this same compiler.
                  if unit != 'wf_floor.c' and (tc, not small) in runtimes:
                      objects.append(runtimes[(tc, not small)][i])
                      continue
                  obj = directory / f'unit-{i}.o'
                  source = floor if unit == 'wf_floor.c' else backend / unit
                  command = cflags(toolchains[tc]) + ['-pthread', '-I', backend, '-I', backend / 'completion']
                  if unit.endswith('.ll'):
                      command += ['-x', 'ir', '-Wno-override-module']
                  else:
                      command += ['-std=c11', '-x', 'c']
                  must_run(f'{tc}/{directory.name}/unit-{i}', command + [source, '-c', '-o', obj])
                  objects.append(obj)
              runtimes[key] = objects
              return objects

          def build_image(tc, name, ir, observer, *, wide=False, small=False):
              directory = root / tc / name
              directory.mkdir(parents=True, exist_ok=True)
              ll, assembly = directory / 'module.ll', directory / 'module.s'
              ll.write_text(ir)
              command = cflags(toolchains[tc]) + ['-Wno-override-module', '-x', 'ir', ll]
              must_run(f'{tc}/{name}/assembly', command + ['-S', '-fstack-usage', '-o', assembly])
              # Link the identical assembly whose .su frame report is measured.
              binary = directory / 'program'
              link = cflags(toolchains[tc]) + ['--ld-path=' + ld, '-pthread', '-x', 'assembler', assembly,
                      '-x', 'c', observer, '-I', backend, '-I', backend / 'completion',
                      '-DWF_TEST_WIDE=' + str(int(wide)), '-x', 'none']
              link += runtime_objects(tc, small) + ['-lm', '-o', binary]
              must_run(f'{tc}/{name}/link', link)
              disassembly = must_run(f'{tc}/{name}/disassembly', [upstream / 'bin/llvm-objdump', '--disassemble', '--no-show-raw-insn', binary])
              (directory / 'program.disasm').write_bytes(disassembly.stdout)
              return binary, assembly, directory / 'module.su'

          def machine_body(text):
              matches = re.findall(r'^_wf_spine:.*?\n(.*?)-- End function', text, re.S | re.M)
              assert len(matches) == 1, 'exact spine machine function missing/ambiguous'
              return matches[0]

          def inline_walk(text, *, linked=False):
              # Expected LLVM 22.1.8 AArch64FrameLowering.cpp,
              # inlineStackProbeLoopExactMultiple: contiguous SUB/STR/CMP/B.NE.
              # Assembly labels resolve to instruction indices; linked branch
              # addresses must equal the actual decrement's address. Unknown
              # formats fail closed rather than accepting scattered substrings.
              instructions, labels = [], {}
              selected = not linked
              for original_line in text.lower().splitlines():
                  line = original_line.split(';', 1)[0].split('//', 1)[0].strip()
                  if not line:
                      continue
                  address = None
                  if linked:
                      symbol = re.fullmatch(r'(?:[0-9a-f]+\s+)?<([^>]+)>:', line)
                      if symbol is None:
                          symbol = re.fullmatch(r'(_[a-z0-9_.$]+):', line)
                      if symbol:
                          name = symbol.group(1)
                          if name == '_wf_spine':
                              if selected:
                                  return False
                              selected = True
                              continue
                          if selected and not name.startswith('_wf_spine+'):
                              break
                          continue
                      if not selected:
                          continue
                      machine = re.fullmatch(r'([0-9a-f]+):\s+(.+)', line)
                      if machine is None:
                          return False
                      address, line = int(machine.group(1), 16), machine.group(2)
                      if instructions and address != instructions[-1][0] + 4:
                          return False
                  else:
                      label = re.fullmatch(r'([a-z_.$][a-z0-9_.$]*):', line)
                      if label:
                          if label.group(1) in labels:
                              return False
                          labels[label.group(1)] = len(instructions)
                          continue
                      if line.startswith('.'):
                          continue  # assembler/CFI directives emit no instruction
                  instruction = re.fullmatch(r'([a-z][a-z0-9.]*)\s*(.*)', line)
                  if instruction is None:
                      return False
                  mnemonic, operands = instruction.groups()
                  operands = re.sub(r'\s+', '', operands)
                  operands = re.sub(r'#0x([0-9a-f]+)', lambda m: '#' + str(int(m.group(1), 16)), operands)
                  instructions.append((address, mnemonic, operands))
              for index in range(len(instructions) - 3):
                  sub, store, compare, branch = instructions[index:index + 4]
                  if sub[1] != 'sub' or sub[2] not in ['sp,sp,#4096', 'sp,sp,#1,lsl#12']:
                      continue
                  if store[1:] != ('str', 'xzr,[sp]'):
                      continue
                  if compare[1] != 'cmp' or not re.fullmatch(r'sp,x(?:[0-9]|[12][0-9]|30)(?:,uxtx(?:#0)?)?', compare[2]):
                      continue
                  if branch[1] != 'b.ne':
                      continue
                  if linked:
                      target = re.fullmatch(r'(?:0x)?([0-9a-f]+)(?:<[^>]+>)?', branch[2])
                      if target and int(target.group(1), 16) == sub[0]:
                          return True
                  elif labels.get(branch[2]) == index:
                      return True
              return False

          def assert_probe(tc, positive, negative_assembly, binary):
              pos, neg = machine_body(positive.read_text()), machine_body(negative_assembly.read_text())
              (positive.parent / 'spine.s').write_text(pos)
              (negative_assembly.parent / 'spine.s').write_text(neg)
              if tc == 'upstream':
                  assert inline_walk(pos), 'large positive spine has no recognized 4096-byte inline page walk'
                  assert not inline_walk(neg), 'large negative spine still has an inline page walk'
                  final = run(f'{tc}/large/final-spine', [upstream / 'bin/llvm-objdump', '--disassemble',
                              '--no-show-raw-insn', '--disassemble-symbols=_wf_spine', binary])
                  assert final.returncode == 0
                  (positive.parent / 'spine.disasm').write_bytes(final.stdout)
                  assert inline_walk(final.stdout.decode(), linked=True), 'linked spine disassembly does not retain the inline page walk'
              else:
                  assert 'chkstk' in pos and 'chkstk' not in neg, 'Apple helper positive/negative comparison failed'

          def check_large(tc, original, observer, facts):
              selected = inline_candidate(original, facts) if tc == 'upstream' else original
              positive, pos_asm, _ = build_image(tc, 'large', selected, observer)
              unprobed, neg_asm, _ = build_image(tc, 'large-unprobed', negative(selected), observer)
              assert_probe(tc, pos_asm, neg_asm, positive)
              p = run(f'{tc}/large/execution', [positive])
              floor_outcome(p, -6, b'', record)
              p = run(f'{tc}/large-unprobed/execution', [unprobed])
              floor_outcome(p, -10, b'', b'')
              result('large-frame containment and ablation', tc, True, 'SIGABRT + exact stack record; ablation SIGBUS + no record; native probe checked')

          def check_recursion(tc, name, original, observer, facts):
              selected = inline_candidate(original, facts) if tc == 'upstream' else original
              binary, assembly, usage = build_image(tc, name, selected, observer, wide=name == 'wide', small=True)
              rows_su = [line.split('\t') for line in usage.read_text().splitlines()]
              frames = [int(fields[1]) for fields in rows_su if len(fields) == 3
                        and fields[0].split(':')[-1].lstrip('_') == 'wf_spine' and fields[2] == 'static']
              assert len(frames) == 1 and frames[0] > 0, 'retained recursion requires one positive static frame'
              frame = frames[0]  # arm64 ledger correction is zero.
              assert 'bl\t_wf_spine' in machine_body(assembly.read_text()), 'recursion optimized away'
              if name == 'wide':
                  assert frame >= 2048, f'wide live array disappeared: {frame} < 256*8'
              environment = dict(os.environ, WF_WORKERS='4')
              for thread in ['entry', 'worker']:
                  bounds = run(f'{tc}/{name}/bounds-{thread}', [binary, 'bounds-' + thread, '0'], env=environment)
                  assert bounds.returncode == 0 and bounds.stderr == b''
                  assert bounds.stdout.startswith((thread + '\n').encode())
                  values = {key: int(value) for key, value in re.findall(r'(room|stack|page)=(\d+)', bounds.stdout.decode())}
                  assert len(values) == 3 and values['stack'] >= 1048576
                  room, page = values['room'], values['page']
                  allowance = 2 * page + 4096 + 2 * frame
                  assert allowance < room / 10, 'fixture overhead exceeds maintained ten-percent bound'
                  levels, slack = room // frame, (allowance + frame - 1) // frame
                  assert levels > slack
                  (assembly.parent / f'{thread}-boundary.json').write_text(json.dumps(
                      dict(values, frame=frame, levels=levels, slack=slack, allowance=allowance), indent=2) + '\n')
                  for depth, exhausted in [(levels - slack, False), (levels + slack, True)]:
                      p = run(f'{tc}/{name}/{thread}-{depth}', [binary, thread, str(depth)], env=environment)
                      floor_outcome(p, -6 if exhausted else 0, (thread + '\n').encode(), record if exhausted else b'')
              result(name + ' recursion floor boundary', tc, True, 'entry/worker below boundary succeed; above abort with exact record; retained measured frame')

          def attempt(step, tc, action):
              try:
                  action()
              except Exception as error:
                  result(step, tc, False, str(error))
                  (root / (tc + '-' + re.sub(r'[^a-z0-9]+', '-', step.lower()) + '.exception.txt')).write_text(traceback.format_exc())

          def experiment():
              oracle_controls()
              consumer_controls()
              facts = consumer_facts()
              fixture_text = (backend / 'tests/exhaustion.rs').read_text()
              source_text = (repo / 'compiler/tests/support/native.rs').read_text()
              sources = {'large': raw_constant(fixture_text, 'LARGE_FRAME_SPINE'),
                         'narrow': formatted_fixture(source_text, 'spine_source', depth=0),
                         'wide': formatted_fixture(source_text, 'wide_frame_source', depth=0, slots=256)}
              observer = root / 'large-observer.c'
              observer.write_text(raw_constant(fixture_text, 'LARGE_FRAME_BODY'))
              boundary = root / 'stack_boundary.c'
              shutil.copyfile(backend / 'tests/stack_boundary.c', boundary)
              originals = {'Apple': {}, 'upstream': {}}
              for name, source in sources.items():
                  directory = root / 'fixtures' / name
                  directory.mkdir(parents=True, exist_ok=True)
                  wf, raw = directory / 'fixture.wf', directory / 'compiler-raw.ll'
                  wf.write_text(source)
                  must_run(f'fixtures/{name}/emit', [compiler, '--emit-llvm', '-o', raw, wf])
                  _, raw_counts = fact_fingerprint(raw.read_text(), facts['Apple'])
                  text = expose(raw.read_text(), large=name == 'large')
                  _, apple_counts = fact_fingerprint(text, facts['Apple'])
                  assert raw_counts == apple_counts, 'observer adaptation changed consumer fact counts'
                  originals['Apple'][name] = text
                  (directory / 'original.ll').write_text(text)
                  baseline = rewrite_facts(text, facts['Apple'], facts['upstream'])
                  counts = validate_delta(text, baseline, facts['Apple'], facts['upstream'])
                  originals['upstream'][name] = baseline
                  (directory / 'upstream-fact-original.ll').write_text(baseline)
                  (directory / 'consumer-fact.diff').write_text(''.join(difflib.unified_diff(
                      text.splitlines(True), baseline.splitlines(True), fromfile='original.ll', tofile='upstream-fact-original.ll')))
                  candidate = inline_candidate(baseline, facts['upstream'])
                  validate_delta(text, candidate, facts['Apple'], facts['upstream'], inline=True)
                  (directory / 'inline.ll').write_text(candidate)
                  (directory / 'probe-only.diff').write_text(''.join(difflib.unified_diff(
                      baseline.splitlines(True), candidate.splitlines(True), fromfile='upstream-fact-original.ll', tofile='inline.ll')))
                  deltas = {
                      'no_capture_attribute': counts['capture'] if facts['Apple']['no_capture_attribute'] != facts['upstream']['no_capture_attribute'] else 0,
                      'coro_end_result': counts['coro_declaration'] + counts['coro_call'] if facts['Apple']['coro_end_result'] != facts['upstream']['coro_end_result'] else 0,
                      'preserve_none': 0,
                  }
                  (directory / 'consumer-fact-counts.json').write_text(json.dumps(
                      {'occurrences': counts, 'changed_occurrences': deltas,
                       'facts': facts, 'probe_attribute_changes': 1}, indent=2) + '\n')
                  result(name + ' consumer-fact baseline and byte allowlist', 'instrument', True,
                         json.dumps({'occurrences': counts, 'changed_occurrences': deltas}, sort_keys=True))
              # Small feasibility sample first; do not build all runtime units
              # until a real compiler-emitted candidate reaches object code.
              for name in ['narrow', 'large', 'wide']:
                  directory = root / 'fixtures' / name
                  p = run(f'upstream/{name}/reported-failure', cflags(toolchains['upstream']) +
                          ['-Wno-override-module', '-x', 'ir', directory / 'upstream-fact-original.ll', '-c', '-o', directory / 'upstream-fact-original.o'])
                  diagnostic = b'Unsupported stack probing method'
                  okay = p.returncode != 0 and diagnostic in p.stderr
                  result(name + ' reported failure reproduction', 'upstream', okay,
                         f'exit {p.returncode}; ' + ('exact backend error observed' if okay else
                         'expected backend error absent; inspect stderr for an independent capability/IR blocker'))
                  p = run(f'upstream/{name}/candidate-screen', cflags(toolchains['upstream']) +
                          ['-Wno-override-module', '-x', 'ir', directory / 'inline.ll', '-c', '-o', directory / 'inline.o'])
                  result(name + ' probe-only candidate object', 'upstream', p.returncode == 0,
                         f'exit {p.returncode}; only probe attributes changed relative to measured consumer-fact baseline')
              for tc in ['Apple', 'upstream']:
                  attempt('large-frame containment and ablation', tc,
                          lambda tc=tc: check_large(tc, originals[tc]['large'], observer, facts[tc]))
                  for name in ['narrow', 'wide']:
                      attempt(name + ' recursion floor boundary', tc,
                              lambda tc=tc, name=name: check_recursion(tc, name, originals[tc][name], boundary, facts[tc]))

          try:
              experiment()
          except Exception as error:
              result('experiment setup', 'host', False, str(error))
              (root / 'setup.exception.txt').write_text(traceback.format_exc())
          (root / 'experiment-verdict.json').write_text(json.dumps({'failures': failures, 'passed': not failures}, indent=2) + '\n')
          sys.exit(bool(failures))
          PY
          cp "$RUNNER_TEMP/darwin-probe-qualify.py" "$QUALIFY_DIR/instrument.py"

      - name: Compare Apple original and upstream consumer-fact probe-only candidate
        id: experiment
        run: |
          set +e
          ulimit -c 0
          perl .github/run-check.pl darwin-probe/experiment python3 "$RUNNER_TEMP/darwin-probe-qualify.py" \
            > "$QUALIFY_DIR/experiment.log" 2>&1
          status=$?
          printf '%s\n' "$status" > "$QUALIFY_DIR/experiment.status"
          cat "$QUALIFY_DIR/experiment.log"
          exit "$status"

      - name: Check the experiment budget record
        if: always()
        run: |
          if [ -f "$WHITEFOOT_TIME_BUDGET_RECORD" ]; then
            perl .github/run-check.pl --budget-verdict "$WHITEFOOT_TIME_BUDGET_RECORD"
          fi

      - name: Write the qualification summary
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          EXPERIMENT_OUTCOME: ${{ steps.experiment.outcome }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['QUALIFY_DIR'])
          rows = [('compiler build', 'gate profile / Apple host', os.environ['BUILD_OUTCOME']),
                  ('qualification command', 'upstream 22.1.8 / Apple', os.environ['EXPERIMENT_OUTCOME'])]
          if (root / 'results.tsv').exists():
              rows.extend(tuple(line.split('\t', 2)) for line in (root / 'results.tsv').read_text().splitlines())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Temporary arm64 Darwin stack-probe qualification. This is not package or LTO acceptance.\n\n')
              run_url = os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID']
              summary.write('[Run](' + run_url + ') at `' + os.environ['GITHUB_SHA'] + '`.\n\n')
              summary.write('| Step | Toolchain | Result |\n| --- | --- | --- |\n')
              for row in rows:
                  summary.write('| ' + ' | '.join(cell.replace('|', '\\|').replace('\n', ' ') for cell in row) + ' |\n')
              summary.write('\nThe unchanged compiler emits Apple-host forms. Its own three probe inputs run against both actual consumers; measured capture spelling, preserve_none support and coro.end result select the upstream fact baseline, standing in for later bundled sibling-clang fact resolution. The candidate changes only probe attributes relative to that baseline. Dispatch convention/layout changes outside a known ABI-only rewrite fail explicitly.\n')
              summary.write('\nArtifact contains probe inputs, commands, answers and facts JSON/diff; intact raw compiler and Apple observer-adapted IR; upstream-fact original IR and consumer-fact diff/counts; inline candidate and probe-only diff; assembly/stack reports, final disassembly, direct signal/record outcomes and logs. Independent byte/context controls reject every other IR change; probe launch/file errors and timeouts fail setup.\n')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: darwin-probe-qualify-${{ github.sha }}
          path: ${{ runner.temp }}/darwin-probe-qualify
          if-no-files-found: error
          retention-days: 14

# Temporary: profile the range judgment on the 257-projection case.
# Removed before the branch is ready.
name: probe-range-cost

on:
  push:
    branches: [claude/eq-range-cost]

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install perf
        run: sudo apt-get update -qq && sudo apt-get install -y -qq linux-tools-common linux-tools-generic linux-tools-$(uname -r) || sudo apt-get install -y -qq linux-tools-generic
      - name: Build the compiler with symbols
        env:
          CARGO_PROFILE_GATE_DEBUG: line-tables-only
          CARGO_PROFILE_GATE_STRIP: none
        run: cargo build --manifest-path compiler/Cargo.toml --profile gate --bin whitefootc --locked
      - name: Time and profile the case
        run: |
          set +e
          bin=compiler/target/gate/whitefootc
          f=tests/conformance/cases/range3-pos-aggregate-projections-one-instance.wf
          /usr/bin/time -v "$bin" --check "$f" 2>&1 | grep -E "Elapsed|Maximum resident|Exit status"
          PERF=$(ls /usr/lib/linux-tools/*/perf 2>/dev/null | head -1); [ -z "$PERF" ] && PERF=perf
          sudo sysctl -w kernel.perf_event_paranoid=-1
          $PERF record -g -F 499 -o perf.data "$bin" --check "$f" > /dev/null 2>&1
          $PERF report -i perf.data --no-children --stdio --percent-limit 1.5 --sort symbol 2>/dev/null | grep -v "^$" | head -80
          echo ===== callers
          $PERF report -i perf.data --children --stdio --percent-limit 4 --sort symbol -g none 2>/dev/null | grep -v "^$" | head -60

# Temporary claude/ring-assist workflow; remove before ready.
# The thread-sanitized programs part of the sanitizers workflow, repeated, with
# the busy-ring receive's stall report (whether a missed bound ever recovers,
# and every thread's stack when it does not) printed from each run.
name: tmp-ring-assist-tsan
on:
  workflow_dispatch:
  push:
    branches: [claude/ring-assist]
env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
jobs:
  loaded:
    name: tsan exit sleep ${{ matrix.sleep }} ${{ matrix.rep }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        sleep: [keep, drop]
        rep: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - name: Set the scratch root
        run: |
          echo "WHITEFOOT_SCRATCH_ROOT=$RUNNER_TEMP/whitefoot" >> "$GITHUB_ENV"
          echo "WHITEFOOT_TIME_BUDGET_RECORD=$RUNNER_TEMP/time-budget-overruns.txt" >> "$GITHUB_ENV"
      - name: Install the host toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo apt-get install -y --no-install-recommends "libclang-rt-$version-dev" gdb
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          rustup default stable
          cargo fetch --locked --manifest-path compiler/Cargo.toml
          sudo sysctl -w kernel.core_pattern=core
          nproc
      - name: The sanitizers workflow's thread-sanitized programs part
        env:
          WHITEFOOT_CHECK_TIMEOUT: 1500
        run: |
          set -u
          if [ "${{ matrix.sleep }}" = keep ]; then export WF_TMP_KEEP_ATEXIT_SLEEP=1; fi
          out="$RUNNER_TEMP/loaded.txt"
          code=0
          make -C compiler test-corpus-tsan \
            SANITIZER_FILTER="--skip the_corpus_reaches_its_declared_verdict --nocapture" \
            SANITIZER_STAGE=programs > "$out" 2>&1 || code=$?
          grep -E "busy-ring receive run [0-9]+ split|^test programs::(ring_assist|busy_ring_receive)|test result|did not release|the echo took" "$out" | cut -c1-200
          sed -n '/=== STALL BEGIN/,/=== STALL END/p' "$out" | cut -c1-400
          exit $code

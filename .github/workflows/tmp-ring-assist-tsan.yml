# Temporary claude/ring-assist workflow; remove before ready.
# The two witnesses under ThreadSanitizer: the thread-sanitized programs part
# of the sanitizers workflow, three times, each run's latencies printed; and
# the busy-ring receive and the old trigger together, which must still fail
# under the sanitizer's longer bound.
name: tmp-ring-assist-tsan
on:
  workflow_dispatch:
  push:
    branches: [claude/ring-assist]
env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
jobs:
  loaded:
    name: tsan programs ${{ matrix.rep }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Set the scratch root
        run: |
          echo "WHITEFOOT_SCRATCH_ROOT=$RUNNER_TEMP/whitefoot" >> "$GITHUB_ENV"
          echo "WHITEFOOT_TIME_BUDGET_RECORD=$RUNNER_TEMP/time-budget-overruns.txt" >> "$GITHUB_ENV"
      - name: Install the host toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo apt-get install -y --no-install-recommends "libclang-rt-$version-dev"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          rustup default stable
          cargo fetch --locked --manifest-path compiler/Cargo.toml
          sudo sysctl -w kernel.core_pattern=core
          nproc
      - name: The sanitizers workflow's thread-sanitized programs part
        env:
          WHITEFOOT_CHECK_TIMEOUT: 1500
        run: |
          set -u
          out="$RUNNER_TEMP/loaded.txt"
          code=0
          make -C compiler test-corpus-tsan \
            SANITIZER_FILTER="--skip the_corpus_reaches_its_declared_verdict --nocapture" \
            SANITIZER_STAGE=programs > "$out" 2>&1 || code=$?
          grep -E "arm, attempt [0-9]+: echo|busy-ring receive run [0-9]+ split|^test programs::(ring_assist|busy_ring_receive)|test result|did not release|the echo took" "$out" | cut -c1-200
          exit $code
  isolated:
    name: tsan isolated, and the old trigger
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Set the scratch root
        run: echo "WHITEFOOT_SCRATCH_ROOT=$RUNNER_TEMP/whitefoot" >> "$GITHUB_ENV"
      - name: Install the host toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo apt-get install -y --no-install-recommends "libclang-rt-$version-dev"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          rustup default stable
          cargo fetch --locked --manifest-path compiler/Cargo.toml
          sudo sysctl -w kernel.core_pattern=core
      - name: Witnesses alone under ThreadSanitizer, then with the old trigger
        run: |
          set -u
          status=0
          out="$RUNNER_TEMP/isolated.txt"
          bridge=compiler/src/backend/completion/bridge.c
          export WF_REQUIRE_LINUX_IO_URING=1 WHITEFOOT_TEST_SANITIZER=thread
          export TSAN_OPTIONS=halt_on_error=1 ASAN_OPTIONS=detect_leaks=0
          witness() {
            code=0
            timeout 1500s cargo test --manifest-path compiler/Cargo.toml --profile gate --locked --offline \
              --test corpus "$1" -- --test-threads=1 --nocapture > "$out" 2>&1 || code=$?
            grep -E "arm, attempt [0-9]+: echo|busy-ring receive run [0-9]+ split|test result|did not release|the echo took" "$out" | cut -c1-200
            return $code
          }
          for i in 1 2 3; do
            if witness programs::busy_ring_receive::; then echo "PASS isolated busy-ring receive $i"; else echo "FAIL isolated busy-ring receive $i"; status=1; fi
            if witness programs::ring_assist::; then echo "PASS isolated ring_assist $i"; else echo "FAIL isolated ring_assist $i"; status=1; fi
          done
          perl -0pi -e 's/(static int wf_monitor_ring_watch\(wf_driver \*driver, uint64_t now\) \{\n)/$1    if (driver) return 0;\n/ or die' "$bridge" || exit 1
          if witness programs::busy_ring_receive::; then
            echo "FAIL old trigger: the busy-ring receive passed"; status=1
          elif grep -qF "the receive did not release the atomic computation within 1s" "$out"; then
            echo "PASS old trigger: the busy-ring receive timed out under the sanitizer"
          else
            echo "FAIL old trigger: the busy-ring receive failed for another reason"; status=1
          fi
          if witness "programs::ring_assist::an_echo_beside"; then
            echo "FAIL old trigger: the same-driver echo passed"; status=1
          elif grep -qE 'same-driver arm, attempt [0-9]+: the echo took' "$out"; then
            echo "PASS old trigger: the same-driver echo was late under the sanitizer"
          else
            echo "FAIL old trigger: the same-driver case failed for another reason"; status=1
          fi
          git checkout -- "$bridge"
          exit $status

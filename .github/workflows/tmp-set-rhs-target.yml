# Temporary quick check for wf-sound-set-rhs-target; removed before the full check.
name: tmp-set-rhs-target

on:
  push:
    branches: [wf-sound-set-rhs-target]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0

jobs:
  quick:
    name: ${{ matrix.stage }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        stage: [static, unit, conformance, base, restore]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - name: Set the scratch root
        run: |
          echo "WHITEFOOT_SCRATCH_ROOT=$RUNNER_TEMP/whitefoot" >> "$GITHUB_ENV"
          echo "WHITEFOOT_TIME_BUDGET_RECORD=$RUNNER_TEMP/time-budget-overruns.txt" >> "$GITHUB_ENV"
      - name: Name main as a local ref
        run: |
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          git branch -f main origin/main
      - name: Select the design review base
        if: matrix.stage == 'static'
        run: |
          design_review_base=$(sh design/skill/review-base.sh pull_request "$GITHUB_REF" "")
          echo "DESIGN_REVIEW_BASE=$design_review_base" >> "$GITHUB_ENV"
          git log --oneline -1 "$design_review_base"
      - name: Install the host toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          rustup default stable
          rustup component add clippy rustfmt
          cargo --version
      - name: Fetch locked compiler dependencies
        run: cargo fetch --locked --manifest-path compiler/Cargo.toml
      - name: Decline core dumps
        run: sudo sysctl -w kernel.core_pattern=core
      - name: Static group
        if: matrix.stage == 'static'
        run: make check-group GROUP=static
      - name: Unit group
        if: matrix.stage == 'unit'
        env:
          WHITEFOOT_CHECK_TIMEOUT: 2400
        run: make check-group GROUP=unit
      - name: Conformance structure and native adapter
        if: matrix.stage == 'conformance'
        env:
          WHITEFOOT_CHECK_TIMEOUT: 2400
        run: |
          make conformance
          make conformance-run
          # The page case must be refused at its target (line 16), not at
          # the later read (line 18).
          perl .github/run-check.pl tmp-whitefootc cargo build --manifest-path compiler/Cargo.toml --profile gate --locked --offline --bin whitefootc
          out=$(compiler/target/gate/whitefootc --check tests/conformance/cases/call4-neg-set-result-rhs-writes-page-index.wf 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q 'call4-neg-set-result-rhs-writes-page-index.wf:16:'
      # The new rejected cases must be accepted by the compiler at the merge
      # base, so that each one witnesses the defect the change removes; the
      # accepted cases that write the new storage are run there to show the
      # old order's outcome.
      - name: New cases at the merge base
        if: matrix.stage == 'base'
        run: |
          base=$(git merge-base origin/main HEAD)
          git worktree add "$RUNNER_TEMP/base" "$base"
          cargo fetch --locked --manifest-path "$RUNNER_TEMP/base/compiler/Cargo.toml"
          perl .github/run-check.pl tmp-base-build cargo build --manifest-path "$RUNNER_TEMP/base/compiler/Cargo.toml" --profile gate --locked --offline --bin whitefootc
          compiler="$RUNNER_TEMP/base/compiler/target/gate/whitefootc"
          status=0
          for case in \
            set1-neg-rhs-shifts-the-target-slot \
            set1-neg-rhs-takes-back-the-target-slot \
            set1-neg-rhs-shifts-the-target-slot-through-a-parameter; do
            if "$compiler" --check "tests/conformance/cases/$case.wf"; then
              echo "accepted at the base: $case"
            else
              echo "rejected at the base: $case"
              status=1
            fi
          done
          for case in set1-neg-rhs-shifts-the-target-slot set1-pos-rhs-grows-the-target-block set1-pos-rhs-replaces-the-target-box set1-pos-rhs-shifts-before-the-target-is-located; do
            "$compiler" -o "$RUNNER_TEMP/$case" "tests/conformance/cases/$case.wf" || true
            if [ -x "$RUNNER_TEMP/$case" ]; then
              code=0; "$RUNNER_TEMP/$case" || code=$?
              echo "$case at the base exits $code"
            fi
          done
          # The old order writes the slot the index named before the call.
          case=set1-pos-index-is-read-after-the-rhs-writes-it
          "$compiler" -o "$RUNNER_TEMP/$case" "tests/conformance/cases/$case.wf"
          code=0; "$RUNNER_TEMP/$case" || code=$?
          echo "$case at the base exits $code"
          [ "$code" -ne 0 ] || status=1
          # The old read-out match never recognized an indexed target.
          if "$compiler" --check tests/conformance/cases/op12-pos-atomic-update-of-an-indexed-slot.wf; then
            echo "accepted at the base: op12-pos-atomic-update-of-an-indexed-slot"
            status=1
          else
            echo "rejected at the base: op12-pos-atomic-update-of-an-indexed-slot"
          fi
          exit "$status"
      # The read-out probe restores the call-value notes; without that line
      # set1-neg-row-index-written-by-the-rhs must be accepted, so the case
      # guards it.
      - name: The new row case fails without the probe's restore
        if: matrix.stage == 'restore'
        run: |
          grep -q 'self.body.call_value_captures = noted;' compiler/src/semantic/check/control/commit.rs
          sed -i 's/self.body.call_value_captures = noted;//' compiler/src/semantic/check/control/commit.rs
          perl .github/run-check.pl tmp-restore-build cargo build --manifest-path compiler/Cargo.toml --profile gate --locked --offline --bin whitefootc
          if compiler/target/gate/whitefootc --check tests/conformance/cases/set1-neg-row-index-written-by-the-rhs.wf; then
            echo "accepted without the restore: set1-neg-row-index-written-by-the-rhs"
          else
            echo "rejected without the restore: set1-neg-row-index-written-by-the-rhs"
            exit 1
          fi

# Temporary: attributes the checking-time cost of the OP-5 condition
# redundancy judgment. It builds this branch's compiler and main's (58743a931)
# in one job and times `whitefootc --check` on apps/firn three ways:
#   main-main      main compiler, main's firn sources
#   main-branch    main compiler, this branch's migrated firn sources
#   branch-branch  this branch's compiler, this branch's firn sources
# main-main against main-branch isolates the source migration; main-branch
# against branch-branch isolates the judgment on the same sources. Each run is
# timed once without counters, then repeated with WHITEFOOT_CHECK_WORK set to
# dump the checker's work counters (compiler/src/semantic/entailment/work.rs
# documents the columns). Remove this workflow before the branch is ready.
# Halo and Snowghost additionally compare both compilers on identical pinned,
# unmigrated sources. All-module verdicts continue past source rejections;
# timing with errors present estimates checking work, not a migrated --check.
name: op5-cost

on:
  push:
    branches: [claude/redundant-test-r1]
  workflow_dispatch:

concurrency:
  group: op5-cost-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0

jobs:
  cost:
    name: OP-5 checking cost on firn
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      MAIN_REVISION: 58743a931
      WHITEFOOT_CHECK_TIMEOUT: 3000
      # Current main heads resolved for this extension with GitHub's
      # branches/main API after git ls-remote failed DNS resolution locally.
      HALO_REVISION: 56878ac4d607f7496c8e23a4c2ffe2d45e9cb552
      SNOWGHOST_REVISION: 466e9843f7a0fe4926022be8718d4ab677cafed1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - name: Prepare the toolchain and main's worktree
        run: |
          rustup default stable
          git worktree add --detach "$RUNNER_TEMP/main" "$MAIN_REVISION"
          git -C "$RUNNER_TEMP/main" log --oneline -1
          cargo fetch --locked --manifest-path compiler/Cargo.toml
          cargo fetch --locked --manifest-path "$RUNNER_TEMP/main/compiler/Cargo.toml"
      - name: Build both compilers
        run: |
          perl .github/run-check.pl op5-build-branch \
            cargo build --manifest-path compiler/Cargo.toml --profile gate --locked
          perl .github/run-check.pl op5-build-main \
            cargo build --manifest-path "$RUNNER_TEMP/main/compiler/Cargo.toml" --profile gate --locked
          ls -l compiler/target/gate/whitefootc "$RUNNER_TEMP/main/compiler/target/gate/whitefootc"
      # Each module is checked on its own, so one run lists the redundant
      # conditions of every module instead of stopping at the first.
      - name: List every module's redundant conditions
        run: |
          for graph in apps/*/modules.wfg; do
            echo "== $graph"
            compiler/target/gate/whitefootc --check-modules --graph "$graph" 2>&1 \
              | grep -E -A6 'error\[OP-5\]' || true
          done
      - name: Time and count the three checks
        run: |
          out="$RUNNER_TEMP/op5"
          mkdir -p "$out"
          branch_compiler="$PWD/compiler/target/gate/whitefootc"
          main_compiler="$RUNNER_TEMP/main/compiler/target/gate/whitefootc"
          branch_graph="$PWD/apps/firn/modules.wfg"
          main_graph="$RUNNER_TEMP/main/apps/firn/modules.wfg"
          check() {
            label=$1 compiler=$2 graph=$3 counters=$4
            log="$out/$label.log"
            status=0
            if [ -n "$counters" ]; then
              WHITEFOOT_CHECK_WORK="$counters" perl .github/run-check.pl "op5-$label" \
                "$compiler" --check --graph "$graph" --entry firn > "$log" 2>&1 || status=$?
            else
              perl .github/run-check.pl "op5-$label" \
                "$compiler" --check --graph "$graph" --entry firn > "$log" 2>&1 || status=$?
            fi
            grep -E '^== END ' "$log" || echo "== $label: no END line (status $status) =="
            grep -vE '^== (RUNNING|END|BUDGET) ' "$log" | head -n 20 || true
          }
          for run in main-main main-branch branch-branch; do
            case $run in
              main-main) compiler=$main_compiler graph=$main_graph ;;
              main-branch) compiler=$main_compiler graph=$branch_graph ;;
              branch-branch) compiler=$branch_compiler graph=$branch_graph ;;
            esac
            check "time-$run" "$compiler" "$graph" ""
          done
          for run in main-main main-branch branch-branch; do
            case $run in
              main-main) compiler=$main_compiler graph=$main_graph ;;
              main-branch) compiler=$main_compiler graph=$branch_graph ;;
              branch-branch) compiler=$branch_compiler graph=$branch_graph ;;
            esac
            check "work-$run" "$compiler" "$graph" "$out/work-$run.tsv"
          done
      - name: Summarize the counters
        if: always()
        run: |
          out="$RUNNER_TEMP/op5"
          summary="$out/summary.txt"
          {
            echo "## Wall time (run-check.pl END lines)"
            grep -h -E '^== END ' "$out"/*.log || true
            echo
            echo "## Totals per kind and metric (sum; *_max is the maximum)"
            for run in main-main main-branch branch-branch; do
              file="$out/work-$run.tsv"
              [ -f "$file" ] || { echo "$run: no counters"; continue; }
              echo "### $run ($(wc -l < "$file") rows, $(cut -f2 "$file" | sort -u | wc -l) analysis runs)"
              awk -F'\t' '{ key = $4 "\t" $6
                            if ($6 ~ /_max$/) { if ($7 > total[key]) total[key] = $7 }
                            else total[key] += $7 }
                          END { for (key in total) print key "\t" total[key] }' "$file" | sort
            done
            echo
            echo "## Per function: closures, closure cells, affine attempts, final-family exhaustions, conditions, condition queries"
            echo "## columns: function, then those six for main-main | main-branch | branch-branch; top 40 by branch-branch closure cells"
            for run in main-main main-branch branch-branch; do
              file="$out/work-$run.tsv"
              [ -f "$file" ] || : > "$file"
              awk -F'\t' -v run="$run" '
                $4 == "closure" && $6 == "count" { closures[$3] += $7 }
                $4 == "closure" && $6 == "cells_sum" { cells[$3] += $7 }
                $4 == "function" && $6 == "affine_attempts" { affine[$3] += $7 }
                $4 == "function" && $6 == "affine_final_family_exhaustions" { exhausted[$3] += $7 }
                $4 == "function" && $6 == "conditions" { conditions[$3] += $7 }
                $4 == "function" && $6 == "condition_queries" { queries[$3] += $7 }
                { seen[$3] = 1 }
                END { for (f in seen) printf "%s\t%d\t%d\t%d\t%d\t%d\t%d\n", f, closures[f], cells[f], affine[f], exhausted[f], conditions[f], queries[f] }
              ' "$file" | sort -t$'\t' -k1,1 > "$out/per-function-$run.tsv"
            done
            join -t$'\t' -a2 -e0 -o auto "$out/per-function-main-main.tsv" "$out/per-function-main-branch.tsv" \
              | join -t$'\t' -a2 -e0 -o auto - "$out/per-function-branch-branch.tsv" \
              | sort -t$'\t' -k15,15nr | head -n 40 || true
          } > "$summary"
          cat "$summary"
          { echo '```'; cat "$summary"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Fetch pinned Halo and Snowghost sources
        run: |
          out="$RUNNER_TEMP/op5"
          mkdir -p "$out"
          for project in halo snowghost; do
            case $project in
              halo) repository=Halo-wf revision=$HALO_REVISION ;;
              snowghost) repository=Snowghost-wf revision=$SNOWGHOST_REVISION ;;
            esac
            git clone --quiet "https://github.com/Ming-Research/$repository.git" "$RUNNER_TEMP/$project"
            git -C "$RUNNER_TEMP/$project" checkout --quiet --detach "$revision"
            actual=$(git -C "$RUNNER_TEMP/$project" rev-parse HEAD)
            [ "$actual" = "$revision" ]
            printf '%s %s\n' "$repository" "$actual" | tee "$out/$project-source.txt"
          done
      # Halo's root Makefile builds the halo-e2e graph with entry test; it includes
      # ../../../lib/halo and fpconv. Snowghost's renderer Makefile checks
      # modules separately because pending interfaces prevent entry builds
      # (layout_oracle is its renderer entry). --check-modules checks every
      # module AND every declared entry without emitting code or using a cache.
      # Pending entry composition can therefore produce non-OP-5 rejections.
      - name: Time the same downstream sources with both compilers
        run: |
          out="$RUNNER_TEMP/op5"
          for project in halo snowghost; do
            case $project in
              halo) graph="$RUNNER_TEMP/halo/research/experiments/halo-e2e/modules.wfg" ;;
              snowghost) graph="$RUNNER_TEMP/snowghost/renderer/modules.wfg" ;;
            esac
            for round in 1 2 3; do
              for variant in main branch; do
                case $variant in
                  main) compiler="$RUNNER_TEMP/main/compiler/target/gate/whitefootc" ;;
                  branch) compiler="$PWD/compiler/target/gate/whitefootc" ;;
                esac
                label="downstream-$project-$variant-$round"
                status=0
                perl .github/run-check.pl "op5-$label" \
                  /usr/bin/time -q -f '%e %x' -o "$out/$label.time" \
                  "$compiler" --check-modules --report --graph "$graph" \
                  > "$out/$label.log" 2>&1 || status=$?
                printf '%s\n' "$status" > "$out/$label.status"
                grep -E '^== END ' "$out/$label.log" || echo "== $label: no END line =="
                echo "$label: exit $status"
              done
            done
          done
      - name: Summarize downstream checking cost
        if: always()
        run: |
          python3 - <<'PY'
          import collections
          import json
          import math
          import os
          import pathlib
          import statistics
          import sys

          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / "op5"
          out.mkdir(exist_ok=True)
          results, errors = {}, []
          for project in ("halo", "snowghost"):
              subjects = None
              for variant in ("main", "branch"):
                  runs = []
                  for round in (1, 2, 3):
                      label = f"downstream-{project}-{variant}-{round}"
                      try:
                          seconds, timed_status = (out / f"{label}.time").read_text().split()
                          seconds, timed_status = float(seconds), int(timed_status)
                          status = int((out / f"{label}.status").read_text())
                          if status not in (0, 1) or timed_status != status:
                              raise ValueError(f"unexpected exit: wrapper={status}, compiler={timed_status}")
                          if not math.isfinite(seconds) or seconds <= 0:
                              raise ValueError(f"invalid elapsed time: {seconds}")
                          log = (out / f"{label}.log").read_text()
                          if f"== END op5-{label}:" not in log or "== STOP " in log:
                              raise ValueError("missing END or interrupted command")
                          verdicts = [json.loads(line) for line in log.splitlines() if line.startswith("{")]
                          current = [("module", v["module"]) if "module" in v else ("entry", v["entry"])
                                     for v in verdicts]
                          if not current or len(set(current)) != len(current):
                              raise ValueError("missing or duplicate module/entry verdicts")
                          if subjects is None:
                              subjects = current
                          if current != subjects:
                              raise ValueError("module/entry coverage differs between runs or compilers")
                          if any(v["verdict"] not in ("accepted", "rejected") for v in verdicts):
                              raise ValueError("unknown verdict")
                          rejected = [v for v in verdicts if v["verdict"] == "rejected"]
                          if status != int(bool(rejected)):
                              raise ValueError("exit status disagrees with source verdicts")
                          # Entry composition can repeat module diagnostics: count each
                          # source site/function/failure once, separately for each rule.
                          tasks = {(t["rule"], t["file"], t["line"], t["column"], t["function"], t["failure"])
                                   for v in rejected for t in v["tasks"]}
                          counts = collections.Counter(t[0] or "no rule" for t in tasks)
                          incomplete = sum(not v["complete"] for v in rejected)
                          runs.append((seconds, status, counts, incomplete))
                      except (OSError, ValueError, KeyError, TypeError) as error:
                          errors.append(f"{label}: {error}")
                  if len(runs) == 3:
                      if any(r[1:] != runs[0][1:] for r in runs[1:]):
                          errors.append(f"{project}/{variant}: status or diagnostic counts changed between rounds")
                      results[project, variant] = runs

          lines = ["## Halo and Snowghost checking cost",
                   "Same pinned sources; 3 interleaved runs per compiler; seconds exclude wrapper overhead.",
                   "Errors remain: this estimates checking work, including every declared entry.",
                   "Snowghost pending entry composition may produce non-OP-5 rejections; these are listed separately."]
          if errors:
              lines += ["Measurement invalid; no timing comparison reported.", *errors]
          else:
              lines += ["", "| Project | Main median s | Branch median s | Branch/main | Main min-max s | Branch min-max s | OP-5 errors main/branch |",
                        "|---|---:|---:|---:|---|---|---:|"]
              for project in ("halo", "snowghost"):
                  main, branch = (results[project, v] for v in ("main", "branch"))
                  a, b = ([r[0] for r in runs] for runs in (main, branch))
                  lines.append(f"| {project} | {statistics.median(a):.2f} | {statistics.median(b):.2f} | {statistics.median(b)/statistics.median(a):.3f} | {min(a):.2f}-{max(a):.2f} | {min(b):.2f}-{max(b):.2f} | {main[0][2]['OP-5']}/{branch[0][2]['OP-5']} |")
              lines += ["", "| Project/compiler | Exit statuses (rounds 1-3) | Other rejection rules (unique diagnostics) | Incomplete verdicts per run |",
                        "|---|---|---|---:|"]
              for (project, variant), runs in results.items():
                  other = {rule: count for rule, count in sorted(runs[0][2].items()) if rule != "OP-5"}
                  lines.append(f"| {project}/{variant} | {','.join(str(r[1]) for r in runs)} | {json.dumps(other, sort_keys=True)} | {runs[0][3]} |")
          summary = "\n".join(lines) + "\n"
          (out / "downstream-summary.md").write_text(summary)
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as file:
              file.write(summary)
          sys.exit(bool(errors))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: op5-cost
          path: ${{ runner.temp }}/op5

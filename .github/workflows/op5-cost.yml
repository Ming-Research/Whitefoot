# Temporary OP-5 first-analysis probe; remove before this branch is ready.
# Only the two pinned Snowghost oracle modules. Stack attachment and work
# counters perturb branch time: this is phase attribution, not a cost ratio.
name: op5-cost

on:
  workflow_dispatch:

concurrency:
  group: op5-cost-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_GATE_DEBUG: line-tables-only
  CARGO_PROFILE_GATE_STRIP: none
  WHITEFOOT_CHECK_TIMEOUT: 900
  MAIN_REVISION: 8c5b07c360c9
  SNOWGHOST_REVISION: 466e9843f7a0fe4926022be8718d4ab677cafed1

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - name: Build both gate compilers with line tables once
        run: |
          rustup default stable
          git worktree add --detach "$RUNNER_TEMP/main" "$MAIN_REVISION"
          perl .github/run-check.pl op5-fetch-branch cargo fetch --locked --manifest-path compiler/Cargo.toml
          perl .github/run-check.pl op5-fetch-main cargo fetch --locked --manifest-path "$RUNNER_TEMP/main/compiler/Cargo.toml"
          perl .github/run-check.pl op5-build-branch \
            cargo build --manifest-path compiler/Cargo.toml --profile gate --locked --offline
          perl .github/run-check.pl op5-build-main \
            cargo build --manifest-path "$RUNNER_TEMP/main/compiler/Cargo.toml" --profile gate --locked --offline
      - name: Bundle compilers, line tables and the pinned source
        run: |
          bundle="$RUNNER_TEMP/op5-inputs"
          mkdir -p "$bundle/bin" "$bundle/snowghost"
          cp compiler/target/gate/whitefootc "$bundle/bin/branch"
          cp "$RUNNER_TEMP/main/compiler/target/gate/whitefootc" "$bundle/bin/main"
          cp .github/run-check.pl .github/time-budgets.txt "$bundle/bin/"
          {
            printf 'branch '; git rev-parse HEAD
            printf 'main '; git -C "$RUNNER_TEMP/main" rev-parse HEAD
            rustc --version --verbose
            printf 'profile=gate debug=%s strip=%s incremental=%s\n' \
              "$CARGO_PROFILE_GATE_DEBUG" "$CARGO_PROFILE_GATE_STRIP" "$CARGO_INCREMENTAL"
          } > "$bundle/identities.txt"
          for compiler in branch main; do
            readelf --sections --wide "$bundle/bin/$compiler" > "$bundle/$compiler.elf-sections.txt"
          done
          git clone --quiet https://github.com/Ming-Research/Snowghost-wf.git "$RUNNER_TEMP/snowghost"
          git -C "$RUNNER_TEMP/snowghost" checkout --quiet --detach "$SNOWGHOST_REVISION"
          actual=$(git -C "$RUNNER_TEMP/snowghost" rev-parse HEAD)
          [ "$actual" = "$SNOWGHOST_REVISION" ]
          printf 'Snowghost-wf %s\n' "$actual" >> "$bundle/identities.txt"
          git -C "$RUNNER_TEMP/snowghost" archive --format=tar --output="$RUNNER_TEMP/snowghost.tar" HEAD
          tar -xf "$RUNNER_TEMP/snowghost.tar" -C "$bundle/snowghost"
          # Main now reserves `held`; the pinned oracle sources use it only as a
          # variable name. Rename that identifier in the probe copy so both
          # compilers check the same meaning (measurement input only).
          find "$bundle/snowghost/renderer/oracle" -name "*.wf" -exec perl -pi -e "s/\\bheld\\b/held_value/g" {} +
          if grep -rqw --include="*.wf" held "$bundle/snowghost/renderer/oracle"; then echo "held remains in oracle sources"; exit 1; fi
          python3 - <<'PY'
          import os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'op5-inputs'
          for compiler in ('branch', 'main'):
              assert '.debug_line ' in (root / f'{compiler}.elf-sections.txt').read_text(), 'missing line tables'
          graph = (root / 'snowghost/renderer/modules.wfg').read_text()
          for module in ('pkg::oracle::style', 'pkg::oracle::layout'):
              assert module + ':' in graph or module + ' :' in graph, 'missing requested module'
          PY
      - name: Prepare temporary sampler and summary helper
        run: |
          cat > "$RUNNER_TEMP/op5-inputs/probe.py" <<'PY'
          import collections, datetime, json, os, pathlib, re, signal, subprocess, sys, time

          def write(path, value):
              path.write_text(json.dumps(value, indent=2) + '\n')

          def utc():
              return datetime.datetime.now(datetime.timezone.utc).isoformat()

          def identity(pid):
              stat = pathlib.Path(f'/proc/{pid}/stat').read_text()
              # After the command's closing ')', field 3 starts the suffix.
              return {'pid': pid, 'start_ticks': stat.rsplit(')', 1)[1].split()[19],
                      'exe': os.readlink(f'/proc/{pid}/exe')}

          def compare_identity(expected, observed):
              if observed['start_ticks'] != expected['start_ticks']:
                  return 'reused'
              return 'same' if observed['exe'] == expected['exe'] else 'changed-executable'

          def process_state(expected):
              try:
                  return compare_identity(expected, identity(expected['pid']))
              except (FileNotFoundError, ProcessLookupError):
                  # A zombie has no executable but its original process ended.
                  try:
                      suffix = pathlib.Path(f"/proc/{expected['pid']}/stat").read_text().rsplit(')', 1)[1].split()
                      return 'gone' if suffix[0] == 'Z' else 'unreadable'
                  except (FileNotFoundError, ProcessLookupError):
                      return 'gone'
                  except PermissionError:
                      return 'unreadable'
              except PermissionError:
                  return 'unreadable'

          def exit_race(target_state, wrapper_ended):
              return target_state == 'gone' or wrapper_ended

          def frames(text):
              rows, thread = [], '1'
              for line in text.splitlines():
                  match = re.match(r'Thread (\d+)\b', line)
                  if match:
                      thread = match[1]
                  match = re.match(r'#(\d+)\s+(?:0x[0-9a-f]+\s+in\s+)?(.+)', line)
                  if match:
                      symbol = re.split(r' at | from ', match[2], maxsplit=1)[0]
                      symbol = symbol.split(' (', 1)[0].strip()
                      rows.append((thread, int(match[1]), symbol))
              return rows

          def sample_state(status, stdout, stderr):
              if status != 0:
                  return 'failed'
              if any(error in stdout + stderr for error in
                     ('ptrace: Operation not permitted', 'No stack.', 'No such process',
                      'Error accessing memory', 'Cannot access memory')):
                  return 'failed'
              return 'captured' if frames(stdout) else 'empty'

          def attach(target, prefix):
              command = ['sudo', '-n', 'timeout', '--signal=TERM', '--kill-after=5s', '20s',
                         'gdb', '-nx', '-nh', '-p', str(target['pid']), '-batch',
                         '-ex', 'set pagination off', '-ex', 'set debuginfod enabled off',
                         '-ex', 'thread apply all bt 40', '-ex', 'detach']
              started, timestamp = time.monotonic(), utc()
              # GDB is outside the compiler's owned process group. timeout
              # bounds an attachment; normal completion explicitly detaches.
              result = subprocess.run(command, capture_output=True, text=True, check=False)
              prefix.with_suffix('.stdout').write_text(result.stdout)
              prefix.with_suffix('.stderr').write_text(result.stderr)
              record = {'started_utc': timestamp, 'ended_utc': utc(), 'target': target,
                        'status': result.returncode, 'attach_wall_s': time.monotonic() - started,
                        'state': sample_state(result.returncode, result.stdout, result.stderr),
                        'command': command, 'target_state_after': process_state(target)}
              write(prefix.with_suffix('.json'), record)
              return record

          def smoke(out):
              out.mkdir(parents=True, exist_ok=True)
              child = subprocess.Popen(['sleep', '60'])
              try:
                  target = identity(child.pid)
                  record = attach(target, out / 'smoke')
                  if record['state'] != 'captured' or record['target_state_after'] != 'same':
                      raise RuntimeError('GDB attachment smoke failed; see raw smoke evidence')
              finally:
                  child.terminate()
                  child.wait()

          def classify(record, stdout, stderr, module):
              ends = re.findall(r'^== END [^\n]+: ([0-9.]+) s, exit ([0-9]+) ==$', stdout, re.M)
              if len(ends) != 1 or int(ends[0][1]) != record['status']:
                  return 'invalid', 'missing or inconsistent wrapper END'
              if record['status'] == 124 and 'deadline exceeded' in stderr:
                  return 'timeout', '900 s wall deadline, including debugger pauses'
              if record['status'] not in (0, 1) or '== STOP ' in stderr:
                  return 'invalid', f"unexpected wrapper exit {record['status']}"
              try:
                  verdicts = [json.loads(line) for line in stdout.splitlines() if line.startswith('{')]
                  assert len(verdicts) == 1
                  verdict = verdicts[0]
                  assert verdict['module'] == module and verdict['reused'] is False
                  if record['status'] == 0 and verdict['verdict'] == 'accepted':
                      return 'accepted', ''
                  assert record['status'] == 1 and verdict['verdict'] == 'rejected'
                  assert type(verdict['complete']) is bool and verdict['tasks']
                  return ('rejected' if verdict['complete'] else 'incomplete'), str(dict(
                      collections.Counter(task.get('rule') or 'no rule' for task in verdict['tasks'])))
              except (AssertionError, KeyError, ValueError, TypeError):
                  return 'invalid', 'missing, inconsistent or malformed module verdict'

          def counter_problem(stderr):
              return any(message in stderr for message in
                         ('checker work output unavailable:', 'checker work output failed:'))

          def completed_blocks(text):
              groups = {}
              for line in text.splitlines():
                  fields = line.split('\t')
                  if len(fields) != 7:
                      raise ValueError('malformed counter row')
                  pid, run, function, kind, ordinal, metric, value = fields
                  if not function or not all(field.isdecimal() for field in (pid, run, ordinal, value)):
                      raise ValueError('invalid counter identity/value')
                  if int(value) >= 2**64 - 1:
                      raise ValueError('saturated counter')
                  metrics = groups.setdefault((pid, run, function), {})
                  key = (kind, ordinal, metric)
                  if key in metrics:
                      raise ValueError('duplicate counter metric')
                  metrics[key] = int(value)
              if not groups:
                  raise ValueError('no counter rows')
              for metrics in groups.values():
                  if (('function', '0', 'joins') not in metrics
                      or ('phase_ns', '0', 'analysis') not in metrics
                      or metrics.get(('phase_calls', '0', 'analysis')) != 1):
                      raise ValueError('missing analysis completion markers')
              return list(groups)

          def sampling_problems(record):
              errors = list(record['sampling_errors'])
              captured = any(sample['state'] == 'captured' for sample in record['samples'])
              if record['wall_s'] >= 30 and not captured:
                  errors.append('branch ran at least 30 s without a captured stack')
              if record['status'] == 124 and any(sample['state'] == 'target-gone' for sample in record['samples']):
                  errors.append('compiler PID disappeared but wrapper remained until deadline')
              return list(dict.fromkeys(errors))

          def stop_wrapper(process, pidfile, errors):
              groups = set()
              if pidfile.exists():
                  groups.add(int(json.loads(pidfile.read_text())['check_pgid']))
              children = pathlib.Path(f'/proc/{process.pid}/task/{process.pid}/children')
              if children.exists():
                  for child in children.read_text().split():
                      try:
                          group = os.getpgid(int(child))
                          if group == int(child):
                              groups.add(group)  # run-check.pl's owned child group
                      except ProcessLookupError:
                          pass
              process.terminate()
              try:
                  process.wait(timeout=10)
              except subprocess.TimeoutExpired:
                  errors.append('wrapper cleanup exceeded 10 s; killed its recorded owned groups')
                  for group in groups:
                      if group > 1 and group != os.getpgrp():
                          try:
                              os.killpg(group, signal.SIGKILL)
                          except ProcessLookupError:
                              pass
                  process.kill()
                  process.wait(timeout=5)

          def run(root, out, module):
              out.mkdir(parents=True, exist_ok=True)
              write(out / 'case.json', {'module': module, 'deadline_s': 900, 'period_s': 30})
              (out / 'identities.txt').write_text((root / 'identities.txt').read_text())
              (out / 'host.txt').write_text(subprocess.check_output(['uname', '-a'], text=True)
                  + pathlib.Path('/proc/cpuinfo').read_text())
              failures = []
              for variant in ('main', 'branch'):
                  pidfile = out / f'{variant}.pid.json'
                  command = [str(root / 'bin' / variant), '--graph',
                             str(root / 'snowghost/renderer/modules.wfg'),
                             '--check-module', module, '--report']
                  env = dict(os.environ, WHITEFOOT_CHECK_TIMEOUT='900')
                  env.pop('WHITEFOOT_CHECK_WORK', None)
                  env.pop('WHITEFOOT_TIME_BUDGET_RECORD', None)
                  if variant == 'branch':
                      env['WHITEFOOT_CHECK_WORK'] = str(out / 'branch.tsv')
                  helper = [sys.executable, str(root / 'probe.py'), 'exec', str(pidfile), *command]
                  wrapped = ['perl', str(root / 'bin/run-check.pl'), 'op5-probe-' + variant, *helper]
                  started, timestamp = time.monotonic(), utc()
                  samples, target, errors = [], None, []
                  next_sample = started + 30
                  with (out / f'{variant}.stdout').open('w') as stdout, (out / f'{variant}.stderr').open('w') as stderr:
                      process = subprocess.Popen(wrapped, stdout=stdout, stderr=stderr, env=env)
                      try:
                          while process.poll() is None:
                              now = time.monotonic()
                              if target is None and pidfile.exists():
                                  original = json.loads(pidfile.read_text())
                                  try:
                                      candidate = identity(original['pid'])
                                      if (candidate['start_ticks'] == original['start_ticks']
                                          and candidate['exe'] == str((root / 'bin' / variant).resolve())):
                                          target = candidate
                                  except (FileNotFoundError, ProcessLookupError, PermissionError):
                                      pass
                              if variant == 'branch' and now >= next_sample and now < started + 895:
                                  next_sample += 30
                                  target_state = process_state(target) if target else 'not-found'
                                  if target_state != 'same':
                                      # Do not attach a reused PID or the wrapper. A normal
                                      # exit race is recorded without inventing a sample.
                                      event = {'state': 'target-' + target_state,
                                               'target': target, 'started_utc': utc(),
                                               'elapsed_s': now - started, 'wrapper_running': process.poll() is None}
                                      samples.append(event)
                                      write(out / f'sample-{len(samples):03}.json', event)
                                      if not exit_race(target_state, process.poll() is not None):
                                          errors.append('scheduled sample target: ' + target_state)
                                  else:
                                      record = attach(target, out / f'sample-{len(samples)+1:03}')
                                      record['elapsed_s'] = now - started
                                      if record['state'] != 'captured' and exit_race(
                                          record['target_state_after'], process.poll() is not None):
                                          # Only a confirmed compiler-exit race is exempt.
                                          record['state'] = 'target-exited-during-attach'
                                      elif record['state'] != 'captured':
                                          errors.append(f"attachment {len(samples)+1}: {record['state']}")
                                      samples.append(record)
                                      write(out / f'sample-{len(samples):03}.json', record)
                                      print(module, record['state'], 'at', round(now - started), 's', flush=True)
                              time.sleep(0.2)
                          process.wait()
                      except (OSError, ValueError, RuntimeError, subprocess.SubprocessError) as error:
                          errors.append(f'probe interrupted: {type(error).__name__}: {error}')
                      finally:
                          if process.poll() is None:
                              # Let the wrapper forward TERM and reap its owned group.
                              stop_wrapper(process, pidfile, errors)
                  status = process.returncode
                  record = {'status': status, 'wall_s': time.monotonic() - started,
                            'started_utc': timestamp, 'ended_utc': utc(),
                            'command': command, 'wrapped_command': wrapped, 'target': target,
                            'deadline_s': 900, 'samples': samples, 'sampling_errors': errors}
                  write(out / f'{variant}.json', record)
                  if variant == 'branch':
                      errors[:] = sampling_problems(record)
                      record['sampling_errors'] = errors
                      write(out / f'{variant}.json', record)
                  if errors:
                      failures.extend(errors)
              return bool(failures)

          def summarize(out, module):
              out.mkdir(parents=True, exist_ok=True)
              lines = [f'# {module}: first-analysis probe', '',
                       'Gate compilers share line-table settings and pinned sources. Main runs once without counters or sampling; branch runs once with both.',
                       'The 900 s deadline includes debugger pauses. These observed times are not a clean performance ratio.', '']
              invalid = False
              for variant in ('main', 'branch'):
                  try:
                      record = json.loads((out / f'{variant}.json').read_text())
                      state, detail = classify(record, (out / f'{variant}.stdout').read_text(),
                                                (out / f'{variant}.stderr').read_text(), module)
                      lines.append(f"{variant}: **{state}**, exit {record['status']}, {record['wall_s']:.2f} s. {detail}")
                      invalid |= state == 'invalid'
                      if variant == 'branch':
                          problems = sampling_problems(record)
                          invalid |= bool(problems)
                          lines.append('Sampling: **invalid** — ' + '; '.join(problems) if problems else 'Sampling: valid observed evidence.')
                  except (OSError, ValueError, KeyError) as error:
                      lines.append(f'{variant}: **missing/invalid evidence**: {error}')
                      invalid = True
              samples = [json.loads(path.read_text()) for path in sorted(out.glob('sample-*.json'))]
              good = [sample for sample in samples if sample['state'] == 'captured']
              races = ('target-gone', 'target-exited-during-attach')
              bad = [sample for sample in samples if sample['state'] not in ('captured', *races)]
              pause = sum(sample.get('attach_wall_s', 0) for sample in samples)
              lines += ['', f'Samples: {len(good)} captured; {len(bad)} failed/empty/unidentified; {len(samples)-len(good)-len(bad)} exit races. Total attachment wall time: {pause:.3f} s (an upper bound on debugger pause time).',
                        'Counts are frame presence in wall-time snapshots across all threads, not CPU percentages. Waiting threads may dominate. A missing stack means unknown work.', '']
              inclusive, tops = collections.Counter(), collections.Counter()
              for path in sorted(out.glob('sample-*.json')):
                  sample = json.loads(path.read_text())
                  if sample['state'] != 'captured':
                      continue
                  rows = frames(path.with_suffix('.stdout').read_text())
                  inclusive.update({symbol for _, _, symbol in rows})
                  tops.update((thread, symbol) for thread, number, symbol in rows if number == 0)
              lines += ['## Frames present in samples', '', '| Samples | Frame |', '| ---: | --- |']
              lines += [f'| {count}/{len(good)} | `{symbol.replace("|", "&#124;")}` |' for symbol, count in inclusive.most_common(30)]
              lines += ['', '## Checker and prover frames present in samples', '', '| Samples | Frame |', '| ---: | --- |']
              checker = [(symbol, count) for symbol, count in inclusive.most_common()
                         if 'whitefoot::semantic::' in symbol or 'whitefoot::check::' in symbol]
              lines += [f'| {count}/{len(good)} | `{symbol.replace("|", "&#124;")}` |' for symbol, count in checker[:40]]
              lines += ['', '## Top frames by GDB thread', '', '| Observations | Thread | Frame |', '| ---: | ---: | --- |']
              lines += [f'| {count} | {thread} | `{symbol.replace("|", "&#124;")}` |' for (thread, symbol), count in tops.most_common(30)]
              if not good:
                  lines += ['', 'No captured stack: a fast compiler may exit before 30 s; an attachment or missing-evidence failure is not evidence of zero work.']
              lines += ['', '## Completed analysis prefix', '',
                        'Existing work TSV rows are flushed at function end. The unfinished function has no counters; use stacks to identify its active phase. No per-condition progress hook was added.']
              try:
                  if counter_problem((out / 'branch.stderr').read_text()):
                      invalid = True
                      raise ValueError('checker reported counter-output failure; raw prefix is unvalidated')
                  blocks = completed_blocks((out / 'branch.tsv').read_text())
                  lines += [f'{len(blocks)} blocks with validated analysis completion markers. Last five (PID / analysis / function):', '']
                  lines += ['- `' + ' / '.join(block) + '`' for block in blocks[-5:]]
              except (OSError, ValueError) as error:
                  lines += [f'Counter prefix unavailable/invalid: {error}. Raw TSV is retained; unfinished analysis work is unknown.']
              (out / 'summary.md').write_text('\n'.join(lines) + '\n')
              print('\n'.join(lines))
              return invalid or bool(bad)

          def controls():
              trace = 'Thread 2 (Thread 0x123):\n#0  0x123 in core::foo::<u64> (x=1) at foo.rs:3\n#1  whitefoot::semantic::entailment::search (x=2) at bar.rs:5\n'
              assert frames(trace) == [('2', 0, 'core::foo::<u64>'), ('2', 1, 'whitefoot::semantic::entailment::search')]
              assert sample_state(0, trace, '') == 'captured'
              target = {'pid': 1, 'start_ticks': '20', 'exe': '/compiler'}
              assert compare_identity(target, target) == 'same'
              assert compare_identity(target, dict(target, exe='/different')) == 'changed-executable'
              assert compare_identity(target, dict(target, start_ticks='21')) == 'reused'
              assert exit_race('gone', False) and exit_race('same', True)
              for state in ('changed-executable', 'reused', 'unreadable', 'same'):
                  assert not exit_race(state, False)
              record = {'status': 124, 'wall_s': 902, 'samples': [{'state': 'target-gone'}], 'sampling_errors': []}
              assert sampling_problems(record)
              assert not sampling_problems(dict(record, status=0, wall_s=2, samples=[]))
              assert not sampling_problems(dict(record, samples=[{'state': 'captured'}]))
              assert counter_problem('checker work output failed: disk full')
              counter = '1\t0\tf\tfunction\t0\tjoins\t0\n1\t0\tf\tphase_ns\t0\tanalysis\t123\n1\t0\tf\tphase_calls\t0\tanalysis\t1\n'
              assert completed_blocks(counter) == [('1', '0', 'f')]
              for invalid in ('truncated\n', counter.splitlines()[0], counter + counter, counter.replace('\t123', '\t18446744073709551615')):
                  try:
                      completed_blocks(invalid)
                  except ValueError:
                      pass
                  else:
                      raise AssertionError('invalid counter prefix accepted')
              for status, stdout, stderr in [(1, trace, ''), (124, trace, ''), (0, '', ''),
                                              (0, trace, 'ptrace: Operation not permitted'), (0, 'No stack.', '')]:
                  assert sample_state(status, stdout, stderr) != 'captured'
              verdict = {'module': 'pkg::test', 'verdict': 'accepted', 'reused': False}
              stdout = '== END probe: 1.00 s, exit 0 ==\n' + json.dumps(verdict) + '\n'
              assert classify({'status': 0}, stdout, '', 'pkg::test')[0] == 'accepted'
              assert classify({'status': 0}, '', '', 'pkg::test')[0] == 'invalid'
              assert classify({'status': 1}, stdout, '', 'pkg::test')[0] == 'invalid'
              assert classify({'status': 124}, '== END probe: 902.00 s, exit 124 ==\n',
                              'deadline exceeded', 'pkg::test')[0] == 'timeout'
              verdict.update(verdict='rejected', complete=False, tasks=[{'rule': 'OP-5'}])
              assert classify({'status': 1}, '== END probe: 1.00 s, exit 1 ==\n' + json.dumps(verdict),
                              '', 'pkg::test')[0] == 'incomplete'
              print('controls distinguish captured, failed/empty stacks, timeout, incomplete and invalid evidence')

          if __name__ == '__main__':
              mode = sys.argv[1]
              if mode == 'exec':
                  path = pathlib.Path(sys.argv[2])
                  temporary = path.with_suffix('.tmp')
                  write(temporary, dict(identity(os.getpid()), check_pgid=int(os.environ['WHITEFOOT_CHECK_PGID'])))
                  temporary.replace(path)
                  os.execv(sys.argv[3], sys.argv[3:])
              elif mode == 'controls':
                  controls()
              elif mode == 'smoke':
                  smoke(pathlib.Path(sys.argv[2]))
              elif mode == 'run':
                  sys.exit(run(pathlib.Path(sys.argv[2]), pathlib.Path(sys.argv[3]), sys.argv[4]))
              elif mode == 'summarize':
                  sys.exit(summarize(pathlib.Path(sys.argv[2]), sys.argv[3]))
              else:
                  raise ValueError(mode)
          PY
          python3 -m py_compile "$RUNNER_TEMP/op5-inputs/probe.py"
          perl .github/run-check.pl op5-probe-controls python3 "$RUNNER_TEMP/op5-inputs/probe.py" controls
      - name: Pack shared inputs including unstripped line tables
        run: tar -czf "$RUNNER_TEMP/op5-inputs.tar.gz" -C "$RUNNER_TEMP" op5-inputs
      - uses: actions/upload-artifact@v4
        with:
          name: op5-inputs
          path: ${{ runner.temp }}/op5-inputs.tar.gz

  probe:
    name: Probe ${{ matrix.module }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: oracle-style
            module: pkg::oracle::style
          - id: oracle-layout
            module: pkg::oracle::layout
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: op5-inputs
          path: ${{ runner.temp }}
      - name: Unpack inputs and install GDB when missing
        run: |
          tar -xzf "$RUNNER_TEMP/op5-inputs.tar.gz" -C "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/op5-results"
          if ! command -v gdb >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y gdb
          fi
          gdb --version > "$RUNNER_TEMP/op5-results/gdb-version.txt"
          cat /proc/sys/kernel/yama/ptrace_scope > "$RUNNER_TEMP/op5-results/ptrace-scope.txt"
      - name: Verify stack attachment before measuring
        run: |
          perl "$RUNNER_TEMP/op5-inputs/bin/run-check.pl" op5-ptrace-smoke \
            python3 "$RUNNER_TEMP/op5-inputs/probe.py" smoke "$RUNNER_TEMP/op5-results"
      - name: Main reference once then branch with 30-second stack samples
        env:
          MODULE: ${{ matrix.module }}
        run: |
          python3 "$RUNNER_TEMP/op5-inputs/probe.py" run \
            "$RUNNER_TEMP/op5-inputs" "$RUNNER_TEMP/op5-results" "$MODULE"
      - name: Summarize dominant frames and observed outcomes
        if: always()
        env:
          MODULE: ${{ matrix.module }}
        run: |
          set +e
          python3 "$RUNNER_TEMP/op5-inputs/probe.py" summarize "$RUNNER_TEMP/op5-results" "$MODULE"
          status=$?
          if [ -f "$RUNNER_TEMP/op5-results/summary.md" ]; then
            cat "$RUNNER_TEMP/op5-results/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: op5-probe-${{ matrix.id }}
          path: ${{ runner.temp }}/op5-results
          if-no-files-found: error

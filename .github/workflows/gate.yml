# The canonical gate on hosts the project does not own.
#
# `make check` is the repository's one all-tests entry point, and until this
# workflow existed it had only ever run on the maintainer's macOS machine. The
# Linux half of the compiler — the io_uring adapter, the `__linux__` bodies of
# every compiler-owned C unit, the ELF link path — was covered by a container
# on that same machine or by nothing at all. These jobs run the identical
# group inventory and recipes on GitHub-hosted Linux and macOS
# runners, so a Linux result is a real x86-64 Linux kernel rather than a
# virtualized aarch64 guest.
#
# Local make check walks the root Makefile's groups in order. This workflow
# reads those same groups into its matrix and invokes their common recipes.
# Only host setup and job scheduling belong here; adding a correctness group
# or changing its commands requires no second workflow inventory update.
name: gate

on:
  push:
  workflow_dispatch:

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  # A fresh checkout gains nothing from incremental state (compiler/Cargo.toml).
  CARGO_INCREMENTAL: 0

jobs:
  groups:
    name: Select correctness groups
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      groups: ${{ steps.select.outputs.groups }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the canonical group inventory
        id: select
        run: |
          groups=$(make --no-print-directory --silent check-groups)
          echo "groups=$groups" >> "$GITHUB_OUTPUT"
          echo "Correctness groups: $groups" >> "$GITHUB_STEP_SUMMARY"

  gate:
    needs: groups
    name: ${{ matrix.stage }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # This bounds a job, never a language verdict. Corpus assertions now share
    # one executable and job; phase logs distinguish construction from runs.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        stage: ${{ fromJSON(needs.groups.outputs.groups) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Everything the gate writes outside the checkout goes under one scratch
      # root. Naming it here keeps generated experiment files in runner-owned
      # storage on both images. It is set from a step because the
      # `runner` context is not available to a job-level `env:` block.
      - name: Set the scratch root
        run: echo "WHITEFOOT_SCRATCH_ROOT=$RUNNER_TEMP/whitefoot" >> "$GITHUB_ENV"

      # The desktop default of two reserves capacity for interactive work and
      # other agents' commands. Each CI job owns its VM, so compilation and the
      # test pool both use the host. Building whitefootc from scratch on a
      # four-CPU host took 72.6 s at two Cargo jobs and 43.1 s at four, with
      # peak memory 1.27 and 1.37 GB.
      - name: Set dedicated-runner build and test parallelism
        run: |
          processors=$(getconf _NPROCESSORS_ONLN)
          echo "CARGO_BUILD_JOBS=$processors" >> "$GITHUB_ENV"
          echo "RUST_TEST_THREADS=$processors" >> "$GITHUB_ENV"

      # `spec-archives` reads `main` as a local ref: it compares released
      # specification archives with the merge base. A CI checkout
      # has the remote-tracking ref only, so name it locally here. On a push to
      # main the checkout already sits on that branch, and git refuses to force
      # a branch the worktree has checked out, so the ref is only created when
      # it is missing.
      - name: Name main as a local ref
        run: |
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          if git symbolic-ref -q HEAD | grep -qx refs/heads/main; then
            echo "checkout is on main"
          else
            git branch -f main origin/main
          fi
          git log --oneline -1 main

      # A main push must compare with its previous tip, not origin/main after
      # checkout. Work branches use their fork point; manual main runs use
      # the first parent. Missing bases fail instead of skipping the check.
      - name: Select the design review base
        if: matrix.stage == 'static'
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          design_review_base=$(sh .github/design-review-base.sh "$GITHUB_EVENT_NAME" "$GITHUB_REF" "$PUSH_BEFORE")
          echo "DESIGN_REVIEW_BASE=$design_review_base" >> "$GITHUB_ENV"
          git log --oneline -1 "$design_review_base"

      # A cached build links its ThinLTO fragments with LLD on Linux; the
      # macOS toolchain's own linker does ThinLTO itself.
      - name: Install the host toolchain
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends clang lld
            ld.lld --version
          fi
          test -x /usr/bin/clang
          /usr/bin/clang --version
          python3 --version
          rustup default stable
          rustup component add clippy rustfmt
          cargo --version

      # The active gate uses the dependency-free compiler crate and formal
      # fixtures. Research instruments run only when explicitly requested.

      # A gate that proves programs die is a gate that makes the kernel run
      # `kernel.core_pattern` a few hundred times. On `ubuntu-24.04` that
      # pattern pipes every crash to `systemd-coredump`, which reads the dying
      # process, compresses a core and journals it, and the crashing task waits
      # for it. Measured in batch 0093 on this runner: one case that runs an
      # aborting program forty times took 403.7 seconds with the pattern as the
      # image ships it and 0.45 with the pattern set here, and `coredumpctl`
      # counted exactly forty stored dumps for the first and none for the
      # second. That single line was nine tenths of the Linux gate.
      #
      # RLIMIT_CORE cannot decline a piped dump: the kernel ignores it for
      # pipes, because the limit bounds a file and a pipe writes none. Measured
      # on the same runner, a soft limit of 0 and the value 1 that
      # `fs/coredump.c` documents as skip-this-dump both left all forty dumps
      # in place. So the disposition is set here, where root is available: an
      # ordinary file pattern, which the soft limit of zero the runner already
      # has — and which `Makefile` sets anyway — then declines in the ordinary
      # way. No case asserts anything about a core file; what each asserts is
      # the signal, the exit status and the record channel, none of which
      # moves.
      - name: Decline core dumps
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.core_pattern=core
          cat /proc/sys/kernel/core_pattern

      - name: Record the host
        run: |
          uname -a
          if [ "$RUNNER_OS" = Linux ]; then
            nproc
            echo "core_pattern: $(cat /proc/sys/kernel/core_pattern)"
          else
            sysctl -n hw.ncpu
          fi
          echo "core file limit: $(ulimit -c)"
          df -h .

      # Every line the stage prints, copied to a file with the moment it
      # arrived and passed through to the log unchanged. The report step below
      # turns the file into the ranking; nothing here changes what runs.
      #
      # One process rather than a `tee` into a `cut`: `cut` block-buffers when
      # its output is not a terminal, which arrives at the runner as the whole
      # stage completing in one instant and destroys the timestamps the raw log
      # is read for.
      - name: ${{ matrix.stage }}
        env:
          STAGE_LOG: ${{ runner.temp }}/stage.log
          CHECK_GROUP: ${{ matrix.stage }}
          WHITEFOOT_CHECK_TIMEOUT: 900
        run: |
          set -o pipefail
          make check-group GROUP="$CHECK_GROUP" 2>&1 | perl -MTime::HiRes=time -e '
            open(my $stamped, ">", $ENV{STAGE_LOG}) or die "$ENV{STAGE_LOG}: $!";
            $| = 1;
            while (my $line = <STDIN>) {
              printf $stamped "%.3f %s", time, $line;
              print $line;
            }'

      # A budget holds only while somebody can see it slipping. This prints the
      # ten largest gaps between one case reporting and the next, so the case
      # that grew is named in the run that grew it.
      #
      # It is a ranking of gaps, not a table of durations: cargo runs the cases
      # of one target on as many threads as the host has cores, so a gap is a
      # lower bound on the wall of the case that closed it, and a case that ran
      # entirely beside a slower one can be invisible. That is enough for the
      # job it has — a case that goes from milliseconds to minutes closes a
      # minutes-long gap on any host — and it costs no test time, which a real
      # per-case measurement on stable Rust would.
      - name: Ten largest gaps in ${{ matrix.stage }}
        if: always()
        run: |
          test -s "$RUNNER_TEMP/stage.log" || exit 0
          {
            echo "### ${{ matrix.stage }} (${{ matrix.os }}) — ten largest completion gaps"
            echo
            echo 'Seconds between one case reporting and the previous one, so a lower'
            echo 'bound on the wall of the case that closed the gap.'
            echo
            echo '```text'
            awk '{ moment = $1; $1 = ""; if (previous != "") printf "%8.1f%s\n", moment - previous, $0; previous = moment }' \
              "$RUNNER_TEMP/stage.log" \
              | grep -E '\.\.\. (ok|FAILED|ignored)$' \
              | sort -rn | head -10
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

# The canonical gate on hosts the project does not own.
#
# `make check` is the repository's one all-tests entry point, and until this
# workflow existed it had only ever run on the maintainer's macOS machine. The
# Linux half of the compiler — the io_uring adapter, the `__linux__` bodies of
# every compiler-owned C unit, the ELF link path — was covered by a container
# on that same machine or by nothing at all. These jobs run the identical
# group inventory and recipes on GitHub-hosted Linux and macOS
# runners, so a Linux result is a real x86-64 Linux kernel rather than a
# virtualized aarch64 guest.
#
# Local make check walks the root Makefile's groups in order. This workflow
# reads those same groups into its matrix and invokes their common recipes.
# Only host setup and job scheduling belong here; adding a correctness group
# or changing its commands requires no second workflow inventory update.
#
# A run checks a revision that is about to merge: a push to main, a push to a
# branch with an open ready pull request, the opening or reopening of a ready
# pull request, the event of marking one ready, and a manual run. A draft pull
# request is still being written, so a push to its branch, like a push to a
# branch with no open pull request or to a tag, ends after the first job with
# every check skipped; while writing, a temporary workflow (`tmp-` file, see
# AGENTS.md, "Checks") gives the author the result for what the change
# touches, and the author starts this workflow by hand once, after the review
# has passed. Marking the pull request ready then skips this workflow when
# its head already has that successful manual run, and runs it when nobody
# has. The first job decides with .github/gate-scope.sh, which io-hosts.yml
# shares. Branch names decide nothing: research and code work share `claude/`
# names, and a research branch with a pull request needs its gate to merge.
#
# A checked revision runs every group on Linux only. macOS is off for now
# (wf-gate-no-macos, compiler/verification): the hosted macOS runners take
# five jobs at a time, and ready pull requests waited most of an hour for
# them. A manual run started with the `macos` input runs every group on macOS
# as well, which a compiler release asks of its commit (compiler-release.yml
# requires a successful gate run with macOS jobs), so the macOS queue is
# entered once per release:
#
#   gh workflow run gate.yml --ref <branch whose tip is the commit> -f macos=true
#
# The last job requires every group green on the platforms the run was asked
# for, for the revision. A job fails
# the run while a `tmp-` workflow file exists in the checked head: a temporary
# workflow never merges, and the last run before a merge, started by hand, is
# the one that stops a forgotten one; main's own run stops one that got in.
#
# The wf-agents engine runs this workflow as one of its full workflows
# (`ci.full` of wf-agents.toml), by hand on main's file, giving the commit to
# merge (`commit`) and a value only its request knows (`call`), which the
# run's name holds so that the engine finds the run it asked for. Such a run
# checks out that commit in every job, compares the design tree with the
# commit's fork point from main, has a concurrency group of its own that no
# other run cancels, and judges `Gate on both platforms` by this run's own
# group jobs, since the run belongs to main's head and not to the commit; its
# group jobs are named `<group> (<os>) of <commit>`, so that main's own run
# never reads them. Each group job then writes what became of each Rust test
# it ran, and of its own steps, as JUnit XML (.github/junit.py), and `Gate on
# both platforms` puts them together in the artifact `test-results`, which
# the engine reads. Every other run leaves those steps out.
name: gate

run-name: ${{ inputs.call && format('gate {0}', inputs.call) || '' }}

on:
  push:
  pull_request:
    types: [opened, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      macos:
        description: Also run every group on macOS (a release needs such a run of its commit)
        type: boolean
        default: false
      commit:
        description: The commit to check, for the wf-agents engine; empty for the branch the run is asked on
        required: false
        default: ''
      call:
        description: A value only the engine's request knows, which the run's name holds; empty otherwise
        required: false
        default: ''

permissions:
  actions: read
  contents: read
  pull-requests: read

# Pushes to one branch share a group, so a later push cancels the run of an
# earlier head. The opening or reopening of a pull request, the event of
# marking one ready and a manual run each have a group of their own, marked
# before the ref so that no branch name can reach it. Were an opening in the
# push group, its run, created a few seconds after the pull request, could
# cancel the push run of a newer head pushed right after the opening, as
# GitHub orders runs by creation time, and leave that head unchecked; the
# opening's run instead decides to skip once the pull request's head has moved
# (.github/gate-scope.sh), because that push run checks the new head. A pull
# request reopened right after a push may be checked twice, once by each run.
# The ready run checks the head it was raised for, and cancelling the push run
# of that same head, or being cancelled by it, would only leave a cancelled
# run beside the successful one; a manual run was asked for, and a push that
# skips must not cancel it. A manual run that asks for macOS has a group apart
# from one that does not, so that starting the one for a release does not
# cancel the full check on Linux, nor the other way round.
# Each main commit gets its own group: a release needs the gate of that exact
# commit, and a group keeps only one pending run, so a shared main group would
# cancel the run of every merge but the last of a quick succession.
# A run the engine asked for has a group of its own, named by its `call`, and
# is never cancelled: the engine waits for it.
concurrency:
  group: gate-${{ inputs.call && format('call-{0}-', inputs.call) || '' }}${{ github.event.action == 'ready_for_review' && 'ready-' || github.event_name == 'pull_request' && 'opened-' || github.event_name == 'workflow_dispatch' && (inputs.macos && 'manual-macos-' || 'manual-') || '' }}${{ github.head_ref && format('refs/heads/{0}', github.head_ref) || github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ !inputs.call }}

env:
  CARGO_TERM_COLOR: never
  # A fresh checkout gains nothing from incremental state (compiler/Cargo.toml).
  CARGO_INCREMENTAL: 0

jobs:
  groups:
    name: Select correctness groups
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      groups: ${{ steps.select.outputs.groups }}
      platforms: ${{ steps.platforms.outputs.platforms }}
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.event.pull_request.head.sha || github.sha }}
      - name: Read the canonical group inventory
        id: select
        run: |
          groups=$(make --no-print-directory --silent check-groups)
          echo "groups=$groups" >> "$GITHUB_OUTPUT"
          echo "Correctness groups: $groups" >> "$GITHUB_STEP_SUMMARY"
      # Linux always; macOS too only in a manual run that asks for it, so a
      # push, an opening and the event of marking ready stay on Linux.
      - name: Choose the platforms
        id: platforms
        env:
          MACOS: ${{ inputs.macos }}
        run: |
          if [ "$MACOS" = true ]; then
            platforms='["ubuntu-24.04","macos-15"]'
          else
            platforms='["ubuntu-24.04"]'
          fi
          echo "platforms=$platforms" >> "$GITHUB_OUTPUT"
          echo "Platforms: $platforms" >> "$GITHUB_STEP_SUMMARY"
      # Whether this revision is checked. A failed query fails the run rather
      # than quietly skipping the gate.
      - name: Choose whether to check
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f .github/gate-scope.sh ]; then
            echo "::error::.github/gate-scope.sh is missing from the checked-out head: the branch was cut from main before main gained it. Merge main into the branch and push again."
            exit 1
          fi
          scope=$(sh .github/gate-scope.sh)
          echo "$scope"
          echo "$scope" >> "$GITHUB_OUTPUT"
          run=$(echo "$scope" | sed -n 's/^run=//p')
          reason=$(echo "$scope" | sed -n 's/^reason=//p')
          if [ "$run" = true ]; then
            echo "Gate runs: $reason" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Gate skipped: $reason" >> "$GITHUB_STEP_SUMMARY"
          fi

  # A temporary workflow (`tmp-` file) is the author's quick check while
  # writing; it never merges, so the run that decides a merge fails while one
  # exists in the head it checks. The matrix and the final job wait for this
  # cheap check: a head that has one spends no matrix run, and shows no green
  # `Gate on both platforms`, which AGENTS.md reads as the merge precondition.
  no-tmp-workflow:
    name: No temporary workflow
    needs: groups
    if: needs.groups.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: .github/workflows
      - name: Fail while a temporary workflow exists
        run: |
          leftover=$(find .github/workflows -maxdepth 1 -name 'tmp-*' | sort)
          if [ -n "$leftover" ]; then
            echo "::error::A temporary workflow is still in the head; delete it before the full check: $leftover"
            exit 1
          fi
          echo "No tmp- workflow in .github/workflows"

  gate:
    needs: [groups, no-tmp-workflow]
    if: needs.groups.outputs.run == 'true'
    # A run the engine asked for belongs to main's head but checks another
    # commit, so its jobs name that commit: `Gate on both platforms` of a run
    # on main's head reads the jobs `<group> (<os>)` of every run of that
    # head, and must not read these.
    name: ${{ matrix.stage }} (${{ matrix.os }})${{ inputs.call && format(' of {0}', inputs.commit) || '' }}
    runs-on: ${{ matrix.os }}
    # This bounds a job, never a language verdict. Corpus assertions now share
    # one executable and job; phase logs distinguish construction from runs.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Linux, and macOS in a manual run that asks for it
        # (wf-gate-no-macos, compiler/verification).
        os: ${{ fromJSON(needs.groups.outputs.platforms) }}
        stage: ${{ fromJSON(needs.groups.outputs.groups) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          # The design-tree skill's lint and CI base script, design/skill.
          submodules: true

      # Everything the gate writes outside the checkout goes under one scratch
      # root. Naming it here keeps generated experiment files in runner-owned
      # storage on both images. It is set from a step because the
      # `runner` context is not available to a job-level `env:` block.
      - name: Set the scratch root
        run: |
          echo "WHITEFOOT_SCRATCH_ROOT=$RUNNER_TEMP/whitefoot" >> "$GITHUB_ENV"
          echo "WHITEFOOT_TIME_BUDGET_RECORD=$RUNNER_TEMP/time-budget-overruns.txt" >> "$GITHUB_ENV"

      # `spec-archives` and `readme-translation` read `main` as a local ref:
      # they compare released specification archives, and the README with its
      # translation, with the merge base. A CI checkout
      # has the remote-tracking ref only, so name it locally here. On a push to
      # main the checkout already sits on that branch, and git refuses to force
      # a branch the worktree has checked out, so the ref is only created when
      # it is missing.
      - name: Name main as a local ref
        run: |
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          if git symbolic-ref -q HEAD | grep -qx refs/heads/main; then
            echo "checkout is on main"
          else
            git branch -f main origin/main
          fi
          git log --oneline -1 main

      # A main push must compare with its previous tip, not origin/main after
      # checkout. Work branches use their fork point; manual main runs use
      # the first parent. Missing bases fail instead of skipping the check.
      # A run the engine asked for checks a commit that is not main's head
      # though the run is asked on main: its change is what it holds beyond
      # main, so its base is its fork point from main.
      - name: Select the design review base
        if: matrix.stage == 'static'
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          ENGINE_COMMIT: ${{ inputs.commit }}
        run: |
          if [ -n "$ENGINE_COMMIT" ]; then
            design_review_base=$(git merge-base refs/remotes/origin/main HEAD)
          else
            design_review_base=$(sh design/skill/review-base.sh "$GITHUB_EVENT_NAME" "$GITHUB_REF" "$PUSH_BEFORE")
          fi
          echo "DESIGN_REVIEW_BASE=$design_review_base" >> "$GITHUB_ENV"
          git log --oneline -1 "$design_review_base"

      # A cached build links its ThinLTO fragments with LLD on Linux; the
      # macOS toolchain's own linker does ThinLTO itself. Linux takes the
      # LLVM major .github/llvm-major pins, from apt.llvm.org rather than
      # Ubuntu's older clang, and makes it the /usr/bin/clang and ld.lld the
      # compiler runs, so the gate builds with the toolchain releases are
      # built with, including the dispatch parts' preserve_none convention,
      # which LLVM 19 added. Raising the pin is its own change
      # (compiler/verification).
      - name: Install the host toolchain
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
            version=$(tr -d '[:space:]' < .github/llvm-major)
            sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
            sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
            sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
            ld.lld --version
          fi
          test -x /usr/bin/clang
          /usr/bin/clang --version
          python3 --version
          rustup default stable
          rustup component add clippy rustfmt
          cargo --version

      - name: Fetch locked compiler dependencies
        run: cargo fetch --locked --manifest-path compiler/Cargo.toml

      # The active gate runs offline against formal fixtures. Research
      # instruments run only when explicitly requested.

      # A gate that proves programs die is a gate that makes the kernel run
      # `kernel.core_pattern` a few hundred times. On `ubuntu-24.04` that
      # pattern pipes every crash to `systemd-coredump`, which reads the dying
      # process, compresses a core and journals it, and the crashing task waits
      # for it. Measured in batch 0093 on this runner: one case that runs an
      # aborting program forty times took 403.7 seconds with the pattern as the
      # image ships it and 0.45 with the pattern set here, and `coredumpctl`
      # counted exactly forty stored dumps for the first and none for the
      # second. That single line was nine tenths of the Linux gate.
      #
      # RLIMIT_CORE cannot decline a piped dump: the kernel ignores it for
      # pipes, because the limit bounds a file and a pipe writes none. Measured
      # on the same runner, a soft limit of 0 and the value 1 that
      # `fs/coredump.c` documents as skip-this-dump both left all forty dumps
      # in place. So the disposition is set here, where root is available: an
      # ordinary file pattern, which the soft limit of zero the runner already
      # has — and which `Makefile` sets anyway — then declines in the ordinary
      # way. No case asserts anything about a core file; what each asserts is
      # the signal, the exit status and the record channel, none of which
      # moves.
      - name: Decline core dumps
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.core_pattern=core
          cat /proc/sys/kernel/core_pattern

      - name: Record the host
        run: |
          uname -a
          if [ "$RUNNER_OS" = Linux ]; then
            nproc
            grep -m 1 'model name' /proc/cpuinfo
            echo "core_pattern: $(cat /proc/sys/kernel/core_pattern)"
          else
            sysctl -n hw.ncpu
            sysctl -n machdep.cpu.brand_string
          fi
          echo "core file limit: $(ulimit -c)"
          df -h .

      # Every line the stage prints, copied to a file with the moment it
      # arrived and passed through to the log unchanged. The report step below
      # turns the file into the ranking; nothing here changes what runs.
      #
      # One process rather than a `tee` into a `cut`: `cut` block-buffers when
      # its output is not a terminal, which arrives at the runner as the whole
      # stage completing in one instant and destroys the timestamps the raw log
      # is read for.
      - name: ${{ matrix.stage }}
        id: stage
        env:
          STAGE_LOG: ${{ runner.temp }}/stage.log
          CHECK_GROUP: ${{ matrix.stage }}
          WHITEFOOT_CHECK_TIMEOUT: 900
        run: |
          set -o pipefail
          make check-group GROUP="$CHECK_GROUP" 2>&1 | perl -MTime::HiRes=time -e '
            open(my $stamped, ">", $ENV{STAGE_LOG}) or die "$ENV{STAGE_LOG}: $!";
            $| = 1;
            while (my $line = <STDIN>) {
              printf $stamped "%.3f %s", time, $line;
              print $line;
            }'

      # A budget holds only while somebody can see it slipping. This prints the
      # ten largest gaps between one case reporting and the next, so the case
      # that grew is named in the run that grew it.
      #
      # It is a ranking of gaps, not a table of durations: cargo runs the cases
      # of one target on as many threads as the host has cores, so a gap is a
      # lower bound on the wall of the case that closed it, and a case that ran
      # entirely beside a slower one can be invisible. That is enough for the
      # job it has — a case that goes from milliseconds to minutes closes a
      # minutes-long gap on any host — and it costs no test time, which a real
      # per-case measurement on stable Rust would.
      - name: Ten largest gaps in ${{ matrix.stage }}
        if: always()
        run: |
          test -s "$RUNNER_TEMP/stage.log" || exit 0
          {
            echo "### ${{ matrix.stage }} (${{ matrix.os }}) — ten largest completion gaps"
            echo
            echo 'Seconds between one case reporting and the previous one, so a lower'
            echo 'bound on the wall of the case that closed the gap.'
            echo
            echo '```text'
            awk '{ moment = $1; $1 = ""; if (previous != "") printf "%8.1f%s\n", moment - previous, $0; previous = moment }' \
              "$RUNNER_TEMP/stage.log" \
              | grep -E '\.\.\. (ok|FAILED|ignored)$' \
              | sort -rn | head -10
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

      # Include report-only macOS overruns and unknown Linux CPU notes in the
      # summary; the verdict fails only on enforcing entries. The stages
      # themselves kept their own statuses.
      - name: Hold every stage to its time budget
        id: budget
        if: always()
        run: |
          if [ -s "$WHITEFOOT_TIME_BUDGET_RECORD" ]; then
            {
              echo "### ${{ matrix.stage }} (${{ matrix.os }}) — time budget reports"
              echo
              echo '```text'
              cat "$WHITEFOOT_TIME_BUDGET_RECORD"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          perl .github/run-check.pl --budget-verdict "$WHITEFOOT_TIME_BUDGET_RECORD"

      # Only in a run the engine asked for: what became of each Rust test the
      # group ran, read from the stage's log, and of the job's own steps, as
      # JUnit XML in a file named by the job (.github/junit.py). A failed
      # stage that its failed tests explain is said by those tests alone, so
      # that the engine may run them again by name; any other failure, a time
      # budget's included, is said as an error of the job.
      - name: Name the results
        if: ${{ !cancelled() && inputs.call }}
        env:
          JOB: ${{ matrix.stage }} (${{ matrix.os }}) of ${{ inputs.commit }}
          STAGE: ${{ matrix.stage }}
          STAGE_OUTCOME: ${{ steps.stage.outcome }}
          BUDGET_OUTCOME: ${{ steps.budget.outcome }}
        run: |
          python3 -B .github/junit.py job --job "$JOB" --out "$RUNNER_TEMP/junit/$JOB.xml" \
            --log "$RUNNER_TEMP/stage.log" --stamped --tests-step "$STAGE" \
            --step "$STAGE_OUTCOME" "$STAGE" --step "$BUDGET_OUTCOME" "Hold every stage to its time budget"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && inputs.call }}
        with:
          name: junit-${{ matrix.stage }}-${{ matrix.os }}
          path: ${{ runner.temp }}/junit
          if-no-files-found: ignore

  # The merge precondition, read from the revision's own check runs rather
  # than from this run's matrix: every group green on the checked platforms.
  # Unchecked revisions skip it, so its success marks a revision that may be
  # merged. A cancelled run skips it too: a later push in its concurrency
  # group supersedes it, and a verdict read from cancelled jobs would only
  # stand red beside that run's answer. A run the engine asked for belongs to
  # main's head, not to the commit it checks, so it is judged by its own group
  # jobs instead, and puts their results in the artifact `test-results`.
  platforms:
    name: Gate on both platforms
    needs: [groups, no-tmp-workflow, gate]
    if: ${{ !cancelled() && needs.groups.outputs.run == 'true' && needs.no-tmp-workflow.result == 'success' }}
    runs-on: ubuntu-24.04
    # A listing makes one call for the runs and one per run of the revision
    # (usually one or two). With three calls, each failing four times before
    # it answers (5+10+20+40 = 75 s of waits), and 3 waits of 30 s between 4
    # listings, the step takes 4*3*75 + 90 = 990 s, under 20 minutes; more runs
    # of one revision or a hung call can reach the limit, which fails the step.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.event.pull_request.head.sha || github.sha }}
      # A branch cut before main gained the script judges with main's copy.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: default-branch
          sparse-checkout: .github
      - name: Require every group green on the checked platforms
        if: ${{ !inputs.call }}
        env:
          # The platforms the run was asked for: Linux, and macOS if its
          # manual run asked for it (wf-gate-no-macos).
          GATE_PLATFORMS: ${{ join(fromJSON(needs.groups.outputs.platforms), ' ') }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GATE_GROUPS: ${{ needs.groups.outputs.groups }}
        run: |
          script=.github/gate-both-platforms.sh
          [ -f "$script" ] || script=default-branch/.github/gate-both-platforms.sh
          sh "$script"
      # The results of every group job, in the one artifact the engine reads.
      # Where no job kept results there is nothing to put together, and the
      # engine says the run uploaded none.
      - uses: actions/upload-artifact/merge@v4
        if: ${{ inputs.call }}
        continue-on-error: true
        with:
          name: test-results
          pattern: junit-*
      - name: Require every group job of this run green
        if: ${{ inputs.call }}
        env:
          GATE: ${{ needs.gate.result }}
        run: |
          echo "The group jobs of this run: $GATE"
          [ "$GATE" = success ]

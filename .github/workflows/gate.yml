# The canonical gate on hosts the project does not own.
#
# `make check` is the repository's one all-tests entry point, and until this
# workflow existed it had only ever run on the maintainer's macOS machine. The
# Linux half of the compiler — the io_uring adapter, the `__linux__` bodies of
# every compiler-owned C unit, the ELF link path — was covered by a container
# on that same machine or by nothing at all. These jobs run the identical
# group inventory and recipes on GitHub-hosted Linux and macOS
# runners, so a Linux result is a real x86-64 Linux kernel rather than a
# virtualized aarch64 guest.
#
# Local make check walks the root Makefile's groups in order. This workflow
# reads those same groups into its matrix and invokes their common recipes.
# Only host setup and job scheduling belong here; adding a correctness group
# or changing its commands requires no second workflow inventory update.
#
# A run checks a revision that may merge: a push to main, a push to a branch
# with an open pull request, draft or ready, the opening or reopening of a
# pull request, the event of marking one ready, and a manual run. Any other
# push, to a branch with no open pull request or to a tag, ends after the
# first job with every check skipped: nothing merges from it, and a pull
# request opened for it later starts a run on its head when it opens. The
# first job decides with .github/gate-scope.sh, which io-hosts.yml shares.
# Branch names decide nothing: research and code work share `claude/` names,
# and a research branch with a pull request needs its gate to merge.
#
# A checked revision runs the groups on Linux. macOS joins where its answer
# decides a merge: a push to a branch with an open pull request marked ready,
# the opening of a ready pull request, the event of marking one ready, main,
# and a manual run (compiler/verification). The last job then requires every
# group green on both platforms for the revision.
name: gate

on:
  push:
  pull_request:
    types: [opened, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

# Pushes to one branch share a group, so a later push cancels the run of an
# earlier head. The opening or reopening of a pull request joins its branch's
# group, so a later push cancels its run too once its head is superseded. The
# push run of the head it was opened on has almost always decided to skip,
# because that push came before the pull request; in the rare run that checks
# it, as when a pull request is reopened right after a push, the cancelled
# run's last job is skipped rather than failed, and the opening's run checks
# the same head on the same platforms. The event of marking a pull request
# ready has a group of its own, and so does a manual run, each marked before
# the ref so that no branch name can reach it: the ready run checks both
# platforms on the head it was raised for, and cancelling the push run of
# that same head, or being cancelled by it, would only leave a cancelled run
# beside the successful one; a manual run was asked for, and a push that skips
# must not cancel it. If a push run asks GitHub before the
# ready state is visible, it runs Linux only and Gate on both platforms is
# skipped, not passed, for that run; the ready run, a later push or a manual
# run qualifies the head.
# Each main commit gets its own group: a release needs the gate of that exact
# commit, and a group keeps only one pending run, so a shared main group would
# cancel the run of every merge but the last of a quick succession.
concurrency:
  group: gate-${{ github.event.action == 'ready_for_review' && 'ready-' || github.event_name == 'workflow_dispatch' && 'manual-' || '' }}${{ github.head_ref && format('refs/heads/{0}', github.head_ref) || github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  # A fresh checkout gains nothing from incremental state (compiler/Cargo.toml).
  CARGO_INCREMENTAL: 0

jobs:
  groups:
    name: Select correctness groups
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      groups: ${{ steps.select.outputs.groups }}
      run: ${{ steps.platforms.outputs.run }}
      platforms: ${{ steps.platforms.outputs.platforms }}
      both: ${{ steps.platforms.outputs.both }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Read the canonical group inventory
        id: select
        run: |
          groups=$(make --no-print-directory --silent check-groups)
          echo "groups=$groups" >> "$GITHUB_OUTPUT"
          echo "Correctness groups: $groups" >> "$GITHUB_STEP_SUMMARY"
      # Whether this revision is checked, and on which platforms. A failed
      # query fails the run rather than quietly skipping the gate or dropping
      # macOS.
      - name: Choose whether to check and the platforms
        id: platforms
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scope=$(sh .github/gate-scope.sh)
          echo "$scope"
          echo "$scope" >> "$GITHUB_OUTPUT"
          run=$(echo "$scope" | sed -n 's/^run=//p')
          both=$(echo "$scope" | sed -n 's/^both=//p')
          reason=$(echo "$scope" | sed -n 's/^reason=//p')
          if [ "$both" = true ]; then
            platforms='["ubuntu-24.04","macos-15"]'
          else
            platforms='["ubuntu-24.04"]'
          fi
          echo "platforms=$platforms" >> "$GITHUB_OUTPUT"
          if [ "$run" = true ]; then
            echo "Platforms: $platforms ($reason)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Gate skipped: $reason" >> "$GITHUB_STEP_SUMMARY"
          fi

  gate:
    needs: groups
    if: needs.groups.outputs.run == 'true'
    name: ${{ matrix.stage }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # This bounds a job, never a language verdict. Corpus assertions now share
    # one executable and job; phase logs distinguish construction from runs.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.groups.outputs.platforms) }}
        stage: ${{ fromJSON(needs.groups.outputs.groups) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          # The design-tree skill's lint and CI base script, design/skill.
          submodules: true

      # Everything the gate writes outside the checkout goes under one scratch
      # root. Naming it here keeps generated experiment files in runner-owned
      # storage on both images. It is set from a step because the
      # `runner` context is not available to a job-level `env:` block.
      - name: Set the scratch root
        run: |
          echo "WHITEFOOT_SCRATCH_ROOT=$RUNNER_TEMP/whitefoot" >> "$GITHUB_ENV"
          echo "WHITEFOOT_TIME_BUDGET_RECORD=$RUNNER_TEMP/time-budget-overruns.txt" >> "$GITHUB_ENV"

      # `spec-archives` and `readme-translation` read `main` as a local ref:
      # they compare released specification archives, and the README with its
      # translation, with the merge base. A CI checkout
      # has the remote-tracking ref only, so name it locally here. On a push to
      # main the checkout already sits on that branch, and git refuses to force
      # a branch the worktree has checked out, so the ref is only created when
      # it is missing.
      - name: Name main as a local ref
        run: |
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          if git symbolic-ref -q HEAD | grep -qx refs/heads/main; then
            echo "checkout is on main"
          else
            git branch -f main origin/main
          fi
          git log --oneline -1 main

      # A main push must compare with its previous tip, not origin/main after
      # checkout. Work branches use their fork point; manual main runs use
      # the first parent. Missing bases fail instead of skipping the check.
      - name: Select the design review base
        if: matrix.stage == 'static'
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          design_review_base=$(sh design/skill/review-base.sh "$GITHUB_EVENT_NAME" "$GITHUB_REF" "$PUSH_BEFORE")
          echo "DESIGN_REVIEW_BASE=$design_review_base" >> "$GITHUB_ENV"
          git log --oneline -1 "$design_review_base"

      # A cached build links its ThinLTO fragments with LLD on Linux; the
      # macOS toolchain's own linker does ThinLTO itself. Linux takes the
      # LLVM major .github/llvm-major pins, from apt.llvm.org rather than
      # Ubuntu's older clang, and makes it the /usr/bin/clang and ld.lld the
      # compiler runs, so the gate builds with the toolchain releases are
      # built with, including the dispatch parts' preserve_none convention,
      # which LLVM 19 added. Raising the pin is its own change
      # (compiler/verification).
      - name: Install the host toolchain
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
            version=$(tr -d '[:space:]' < .github/llvm-major)
            sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
            sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
            sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
            ld.lld --version
          fi
          test -x /usr/bin/clang
          /usr/bin/clang --version
          python3 --version
          rustup default stable
          rustup component add clippy rustfmt
          cargo --version

      - name: Fetch locked compiler dependencies
        run: cargo fetch --locked --manifest-path compiler/Cargo.toml

      # The active gate runs offline against formal fixtures. Research
      # instruments run only when explicitly requested.

      # A gate that proves programs die is a gate that makes the kernel run
      # `kernel.core_pattern` a few hundred times. On `ubuntu-24.04` that
      # pattern pipes every crash to `systemd-coredump`, which reads the dying
      # process, compresses a core and journals it, and the crashing task waits
      # for it. Measured in batch 0093 on this runner: one case that runs an
      # aborting program forty times took 403.7 seconds with the pattern as the
      # image ships it and 0.45 with the pattern set here, and `coredumpctl`
      # counted exactly forty stored dumps for the first and none for the
      # second. That single line was nine tenths of the Linux gate.
      #
      # RLIMIT_CORE cannot decline a piped dump: the kernel ignores it for
      # pipes, because the limit bounds a file and a pipe writes none. Measured
      # on the same runner, a soft limit of 0 and the value 1 that
      # `fs/coredump.c` documents as skip-this-dump both left all forty dumps
      # in place. So the disposition is set here, where root is available: an
      # ordinary file pattern, which the soft limit of zero the runner already
      # has — and which `Makefile` sets anyway — then declines in the ordinary
      # way. No case asserts anything about a core file; what each asserts is
      # the signal, the exit status and the record channel, none of which
      # moves.
      - name: Decline core dumps
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.core_pattern=core
          cat /proc/sys/kernel/core_pattern

      - name: Record the host
        run: |
          uname -a
          if [ "$RUNNER_OS" = Linux ]; then
            nproc
            grep -m 1 'model name' /proc/cpuinfo
            echo "core_pattern: $(cat /proc/sys/kernel/core_pattern)"
          else
            sysctl -n hw.ncpu
            sysctl -n machdep.cpu.brand_string
          fi
          echo "core file limit: $(ulimit -c)"
          df -h .

      # Every line the stage prints, copied to a file with the moment it
      # arrived and passed through to the log unchanged. The report step below
      # turns the file into the ranking; nothing here changes what runs.
      #
      # One process rather than a `tee` into a `cut`: `cut` block-buffers when
      # its output is not a terminal, which arrives at the runner as the whole
      # stage completing in one instant and destroys the timestamps the raw log
      # is read for.
      - name: ${{ matrix.stage }}
        env:
          STAGE_LOG: ${{ runner.temp }}/stage.log
          CHECK_GROUP: ${{ matrix.stage }}
          WHITEFOOT_CHECK_TIMEOUT: 900
        run: |
          set -o pipefail
          make check-group GROUP="$CHECK_GROUP" 2>&1 | perl -MTime::HiRes=time -e '
            open(my $stamped, ">", $ENV{STAGE_LOG}) or die "$ENV{STAGE_LOG}: $!";
            $| = 1;
            while (my $line = <STDIN>) {
              printf $stamped "%.3f %s", time, $line;
              print $line;
            }'

      # A budget holds only while somebody can see it slipping. This prints the
      # ten largest gaps between one case reporting and the next, so the case
      # that grew is named in the run that grew it.
      #
      # It is a ranking of gaps, not a table of durations: cargo runs the cases
      # of one target on as many threads as the host has cores, so a gap is a
      # lower bound on the wall of the case that closed it, and a case that ran
      # entirely beside a slower one can be invisible. That is enough for the
      # job it has — a case that goes from milliseconds to minutes closes a
      # minutes-long gap on any host — and it costs no test time, which a real
      # per-case measurement on stable Rust would.
      - name: Ten largest gaps in ${{ matrix.stage }}
        if: always()
        run: |
          test -s "$RUNNER_TEMP/stage.log" || exit 0
          {
            echo "### ${{ matrix.stage }} (${{ matrix.os }}) — ten largest completion gaps"
            echo
            echo 'Seconds between one case reporting and the previous one, so a lower'
            echo 'bound on the wall of the case that closed the gap.'
            echo
            echo '```text'
            awk '{ moment = $1; $1 = ""; if (previous != "") printf "%8.1f%s\n", moment - previous, $0; previous = moment }' \
              "$RUNNER_TEMP/stage.log" \
              | grep -E '\.\.\. (ok|FAILED|ignored)$' \
              | sort -rn | head -10
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

      # run-check.pl appended every stage over its budget in
      # .github/time-budgets.txt, or without one, to this record; the stages
      # themselves kept their own statuses.
      - name: Hold every stage to its time budget
        if: always()
        run: perl .github/run-check.pl --budget-verdict "$WHITEFOOT_TIME_BUDGET_RECORD"

  # The merge precondition, read from the revision's own check runs rather
  # than from this run's matrix: every group green on both platforms. Draft
  # pushes and unchecked revisions skip it, so its success marks a revision
  # that may be merged. A cancelled run skips it too: a later run in its
  # concurrency group checks the same head or supersedes it, and a verdict
  # read from cancelled jobs would only stand red beside that run's answer.
  platforms:
    name: Gate on both platforms
    needs: [groups, gate]
    if: ${{ !cancelled() && needs.groups.outputs.run == 'true' && needs.groups.outputs.both == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every group green on Linux and macOS
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GATE_GROUPS: ${{ needs.groups.outputs.groups }}
        run: |
          set -euo pipefail
          groups=$(jq -er '.[]' <<< "$GATE_GROUPS")
          test -n "$groups"
          # Only jobs of this workflow's runs for the revision count; a job
          # re-run in a later attempt or run supersedes the earlier one.
          runs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/gate.yml/runs?head_sha=$HEAD_SHA&per_page=100" \
            --jq '.workflow_runs[].id')
          : > "$RUNNER_TEMP/jobs.tsv"
          for run in $runs; do
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?filter=latest&per_page=100" \
              --jq '.jobs[] | select(.completed_at != null) | [.completed_at, .name, .conclusion] | @tsv' >> "$RUNNER_TEMP/jobs.tsv"
          done
          missing=0
          for group in $groups; do
            for os in ubuntu-24.04 macos-15; do
              name="$group ($os)"
              conclusion=$(sort -r "$RUNNER_TEMP/jobs.tsv" | awk -F '\t' -v name="$name" '$2 == name && found == "" { found = $3 } END { print found }')
              if [ "$conclusion" = success ]; then
                echo "ok      $name"
              else
                echo "MISSING $name: ${conclusion:-no gate job}"
                missing=1
              fi
            done
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::$HEAD_SHA is not green on both platforms"
            exit 1
          fi

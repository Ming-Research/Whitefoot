# Temporary (wf-fr-sanitizer-check): watches the sanitized corpus target
# fail once for each sanitizer on a fault injected into the runtime.
# Removed before the branch is ready.
name: tmp-sanitizer-probe

on:
  push:
    branches: [wf-fr-sanitizer-check]

concurrency:
  group: tmp-sanitizer-probe
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0

jobs:
  probe:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: red on an injected out-of-bounds read
            kind: red
            target: test-corpus-asan
            fault: oob
            expect: heap-buffer-overflow
          - name: red on injected undefined behavior
            kind: red
            target: test-corpus-asan
            fault: ub
            expect: signed integer overflow
          - name: red on an injected data race
            kind: red
            target: test-corpus-tsan
            fault: race
            expect: "ThreadSanitizer: data race"
    steps:
      - uses: actions/checkout@v4
      - name: Set the scratch root
        run: echo "WHITEFOOT_SCRATCH_ROOT=$RUNNER_TEMP/whitefoot" >> "$GITHUB_ENV"
      - name: Install the host toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo apt-get install -y --no-install-recommends "libclang-rt-$version-dev"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          /usr/bin/clang --version
          rustup default stable
          cargo --version
          nproc
          grep -m 1 'model name' /proc/cpuinfo
      - name: Fetch locked compiler dependencies
        run: cargo fetch --locked --manifest-path compiler/Cargo.toml
      - name: Decline core dumps
        run: sudo sysctl -w kernel.core_pattern=core
      # Appends one deliberate fault to the floor runtime, which every
      # program links, run by a constructor before main; the target must
      # fail and print the sanitizer's report from its report file.
      - name: The target turns red on an injected fault
        if: matrix.kind == 'red'
        env:
          FAULT: ${{ matrix.fault }}
          EXPECT: ${{ matrix.expect }}
        run: |
          floor=compiler/src/backend/wf_floor.c
          case "$FAULT" in
            oob) cat >> "$floor" <<'C'
          #include <stdlib.h>
          __attribute__((constructor)) static void wf_injected_fault(void) {
              volatile unsigned char *bytes = malloc(4);
              volatile unsigned char past = bytes[4];
              (void)past;
              free((void *)bytes);
          }
          C
              ;;
            ub) cat >> "$floor" <<'C'
          #include <limits.h>
          __attribute__((constructor)) static void wf_injected_fault(void) {
              volatile int largest = INT_MAX;
              volatile int beyond = largest + 1;
              (void)beyond;
          }
          C
              ;;
            race) cat >> "$floor" <<'C'
          #include <pthread.h>
          static int wf_injected_counter;
          static void *wf_injected_increment(void *unused) {
              (void)unused;
              wf_injected_counter++;
              return 0;
          }
          __attribute__((constructor)) static void wf_injected_fault(void) {
              pthread_t first, second;
              pthread_create(&first, 0, wf_injected_increment, 0);
              pthread_create(&second, 0, wf_injected_increment, 0);
              pthread_join(first, 0);
              pthread_join(second, 0);
          }
          C
              ;;
          esac
          tail -20 "$floor"
          log="$RUNNER_TEMP/red.log"
          status=0
          make -C compiler ${{ matrix.target }} SANITIZER_FILTER="programs::runs::" > "$log" 2>&1 || status=$?
          grep -E "sanitizer report|test result|SUMMARY" "$log" | head -20
          echo "target exit status: $status"
          [ "$status" -ne 0 ] || { echo "::error::the target passed with an injected fault"; exit 1; }
          grep -q "sanitizer report" "$log" || { echo "::error::no report file was printed"; exit 1; }
          grep -q "$EXPECT" "$log" || { echo "::error::no report of $EXPECT"; exit 1; }
          echo "red as required: $EXPECT"
      - name: Emitted code is instrumented
        if: matrix.kind == 'ir'
        run: |
          set -eu
          perl .github/run-check.pl tmp-build cargo build --manifest-path compiler/Cargo.toml --profile gate --locked --offline --bin whitefootc
          wfc=compiler/target/gate/whitefootc
          program=tests/programs/heap_run.wf
          work="$RUNNER_TEMP/probe"
          mkdir -p "$work"
          "$wfc" --emit-llvm "$program" -o "$work/plain.ll"
          for sanitizer in address thread; do
            case $sanitizer in
              address) flag=-fsanitize=address; symbol=__asan_ ;;
              thread) flag=-fsanitize=thread; symbol=__tsan_ ;;
            esac
            "$wfc" --emit-llvm --sanitize "$sanitizer" "$program" -o "$work/$sanitizer.ll"
            grep '^attributes #0' "$work/$sanitizer.ll"
            /usr/bin/clang -x ir "$work/$sanitizer.ll" "$flag" -O2 -Wno-override-module -c -o "$work/$sanitizer.o"
            /usr/bin/clang -x ir "$work/plain.ll" "$flag" -O2 -Wno-override-module -c -o "$work/plain-$sanitizer.o"
            with=$(nm -u "$work/$sanitizer.o" | grep -c "$symbol" || true)
            without=$(nm -u "$work/plain-$sanitizer.o" | grep -c "$symbol" || true)
            echo "$sanitizer: $with $symbol references with the attribute, $without without"
            nm -u "$work/$sanitizer.o" | grep "$symbol" | sort | uniq -c | head -20
            "$wfc" --sanitize "$sanitizer" "$program" -o "$work/program-$sanitizer"
            status=0; "$work/program-$sanitizer" || status=$?
            echo "$sanitizer plain build exit: $status"
            "$wfc" --sanitize "$sanitizer" --cache "$work/cache-$sanitizer" --fragments function "$program" -o "$work/fragments-$sanitizer"
            status=0; "$work/fragments-$sanitizer" || status=$?
            echo "$sanitizer fragment build exit: $status"
            nm "$work/program-$sanitizer" | grep -c "$symbol" || true
          done
      - name: Sanitized cases
        if: matrix.kind == 'corpus'
        env:
          WHITEFOOT_CONFORMANCE_SHARD: ${{ matrix.shard }}
          WHITEFOOT_CHECK_TIMEOUT: 2400
        run: |
          [ -n "$WHITEFOOT_CONFORMANCE_SHARD" ] || unset WHITEFOOT_CONFORMANCE_SHARD
          make -C compiler ${{ matrix.target }} SANITIZER_FILTER="${{ matrix.filter }}"

  # `whitefootc --sanitize` as a reader runs it, on each host the README
  # names: a sanitized build of a sequential and a `--par` program must exit
  # as the ordinary build does and write no report.
  cli:
    name: whitefootc --sanitize on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v4
      - name: Install the host toolchain
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
            version=$(tr -d '[:space:]' < .github/llvm-major)
            sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
            sudo apt-get install -y --no-install-recommends "libclang-rt-$version-dev"
            sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
            sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          fi
          /usr/bin/clang --version
          rustup default stable
      - name: Sanitized builds run as ordinary builds do
        run: |
          set -u
          perl .github/run-check.pl tmp-build cargo build --manifest-path compiler/Cargo.toml --profile gate --locked --bin whitefootc
          wfc=compiler/target/gate/whitefootc
          work="$RUNNER_TEMP/cli"
          reports="$work/reports"
          mkdir -p "$reports"
          export ASAN_OPTIONS="detect_leaks=0:log_path=$reports/report"
          export UBSAN_OPTIONS="halt_on_error=1:log_path=$reports/report"
          export TSAN_OPTIONS="halt_on_error=1:log_path=$reports/report"
          failed=0
          for program in "tests/programs/heap_run.wf" "--par tests/programs/parallel/tree.wf"; do
            name=$(basename "${program##* }" .wf)
            "$wfc" $program -o "$work/$name-plain" || { echo "::error::ordinary build of $name failed"; failed=1; continue; }
            expected=0; "$work/$name-plain" > /dev/null 2>&1 || expected=$?
            for sanitizer in address thread; do
              if ! "$wfc" --sanitize "$sanitizer" $program -o "$work/$name-$sanitizer"; then
                echo "::error::$sanitizer build of $name failed"; failed=1; continue
              fi
              status=0; "$work/$name-$sanitizer" > /dev/null 2>&1 || status=$?
              echo "$name under $sanitizer: exit $status, ordinary exit $expected"
              [ "$status" -eq "$expected" ] || { echo "::error::$name under $sanitizer exited $status"; failed=1; }
            done
          done
          for report in "$reports"/*; do
            [ -e "$report" ] || continue
            echo "report $report:"; cat "$report"; failed=1
          done
          exit $failed

# Temporary workflow for wf-spec-proof: the static group on this branch, and
# two compiler probes of a `set` whose right-hand side changes the storage of
# its own target. Removed before the full check.
name: tmp-spec-proof

on:
  push:
    branches: [wf-spec-proof]

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - name: Name main as a local ref
        run: |
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          git branch -f main origin/main
      - name: Static group
        env:
          DESIGN_REVIEW_BASE: origin/main
        run: make static

  probes:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install the host toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          rustup default stable
      - name: Build the compiler
        run: perl .github/run-check.pl tmp-probe-build cargo build --manifest-path compiler/Cargo.toml --profile gate --locked --bin whitefootc
      - name: Probes
        run: |
          mkdir -p "$RUNNER_TEMP/probes"
          cd "$RUNNER_TEMP/probes"
          # The target slot is in the window when the target is evaluated;
          # the right-hand side removes an element, so the slot is outside
          # the window when the commit releases its old value.
          cat > shrink.wf <<'WF'
          fn main() -> status: std::process::ExitStatus pure {
            let v = slots_new::<Box<u64>, 4>();
            let first = box_new(value: 1_u64);
            place_back(window: &v, value: move first);
            let second = box_new(value: 2_u64);
            place_back(window: &v, value: move second);
            set v[1_u64] = remove_at(window: &v, index: 0_u64);
            return std::process::exit_status(code: 0_u8);
          }
          WF
          # The right-hand side grows the window's block, which moves it;
          # the store then goes to the address computed before the call.
          cat > grow.wf <<'WF'
          fn refill(cell: &Box<Slots<u64>>) -> result: u64 writes(cell) contract {
            requires cell^.inner.cap <= 64_u64;
            ensures cell^.inner.len == entry(cell)^.inner.len;
          } {
            grow(cell: cell, capacity: 64_u64);
            return 7_u64;
          }

          fn main() -> status: std::process::ExitStatus pure {
            let b = box_slots_new::<u64>(capacity: 1_u64);
            let pin = box_new(value: 9_u64);
            place_back(window: &b.inner, value: 1_u64);
            set b.inner[0_u64] = refill(cell: &b);
            let stored = b.inner[0_u64];
            if stored == 7_u64 {
              return std::process::exit_status(code: 0_u8);
            }
            return std::process::exit_status(code: 3_u8);
          }
          WF
          for probe in shrink grow; do
            set +e
            "$GITHUB_WORKSPACE/compiler/target/gate/whitefootc" -o "$probe" "$probe.wf"
            compiled=$?
            ran=none
            if [ "$compiled" -eq 0 ]; then
              "./$probe"
              ran=$?
            fi
            set -e
            echo "PROBE $probe: compile status $compiled, run status $ran"
          done

  # Each condition the new checks protect, broken once: the check must fail
  # with the problem named.
  proof-fail-demos:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Lean toolchain
        working-directory: proof
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: The checks pass unchanged
        working-directory: proof
        run: |
          perl ../.github/run-check.pl tmp-proof-coverage lake exe coverage
          perl ../.github/run-check.pl tmp-proof-build lake build
      - name: Each broken input fails
        working-directory: proof
        run: |
          expect_failure() {
            label=$1; pattern=$2; shift 2
            if "$@" > "$RUNNER_TEMP/out.txt" 2>&1; then
              echo "FAIL-DEMO $label: the check passed"; cat "$RUNNER_TEMP/out.txt"; exit 1
            fi
            if ! grep -qF -- "$pattern" "$RUNNER_TEMP/out.txt"; then
              echo "FAIL-DEMO $label: failed without naming the problem"; cat "$RUNNER_TEMP/out.txt"; exit 1
            fi
            echo "FAIL-DEMO $label: rejected as expected:"
            grep -F -- "$pattern" "$RUNNER_TEMP/out.txt" | head -2
            git checkout -- ..
          }
          sed -i 's/^The closed integer-type set is /The closed integer type set is /' ../spec/kernel-spec.md
          expect_failure changed-line 'has no line with hash b9d1e5b8e0b6674b' lake exe coverage
          printf '\n## Probe\n\n[OP-17] A rule the list does not classify.\n' >> ../spec/kernel-spec.md
          expect_failure new-family-rule 'OP-17 is in family OP' lake exe coverage
          sed -i '/^outside OP-2 a361e882fc6dbb5e /d' coverage.txt
          expect_failure unlisted-line 'OP-2 a361e882fc6dbb5e is neither marked nor listed outside' lake exe coverage
          printf '%s\n' '-- spec OP-3 0000000000000000' >> WhitefootProof/Integers.lean
          expect_failure uncovered-mark 'OP-3 has no `rule OP-3` entry' lake exe coverage
          sed -i 's/^rule OP-2$/rule OP-99/' coverage.txt
          expect_failure missing-rule 'the specification has no rule OP-99' lake exe coverage
          printf '\ntheorem demo_unproved : 1 + 1 = 3 := by sorry\n\n#require_standard_axioms demo_unproved\n' >> WhitefootProof/Axioms.lean
          expect_failure unproved-step 'demo_unproved depends on' lake build
          printf '\ntheorem demo_native : 2 + 2 = 4 := by native_decide\n\n#require_standard_axioms demo_native\n' >> WhitefootProof/Axioms.lean
          expect_failure unchecked-evaluation 'demo_native depends on' lake build

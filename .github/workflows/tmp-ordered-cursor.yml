# Temporary (wf-std-ordered-map-cursor): the focused checks of the ordered-map
# cursor work, which a draft pull request's gate skips: the compiler build and
# lint, every unit test, the ordered-map, snapshot-export and firn program
# tests, every conformance case's verdict with each failing case listed, and
# the repository-level static checks with the change-log check against the
# branch's fork point. Removed before the full check.
name: tmp-ordered-cursor

on:
  push:
    branches: [wf-std-ordered-map-cursor]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0

jobs:
  corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install the host toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          rustup default stable
          cargo --version
          cargo fetch --locked --manifest-path compiler/Cargo.toml
      - name: Decline core dumps
        run: |
          sudo sysctl -w kernel.core_pattern=core
          cat /proc/sys/kernel/core_pattern
      - name: Reach every conformance verdict and list each failing case
        run: |
          ulimit -c 0
          set +e
          perl .github/run-check.pl cursor-corpus cargo test --manifest-path compiler/Cargo.toml \
            --profile gate --locked --offline --test corpus -- \
            conformance::adapter::the_corpus_reaches_its_declared_verdict_through_the_ordinary_compiler_path \
            --nocapture > "$RUNNER_TEMP/corpus.log" 2>&1
          status=$?
          set -e
          grep -E -A6 '^  Fail ' "$RUNNER_TEMP/corpus.log" || true
          grep -E 'conformance adapter: Pass=' "$RUNNER_TEMP/corpus.log" || tail -60 "$RUNNER_TEMP/corpus.log"
          exit "$status"
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install the host toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          rustup default stable
          rustup component add clippy
          cargo --version
          cargo fetch --locked --manifest-path compiler/Cargo.toml
      - name: Decline core dumps
        run: sudo sysctl -w kernel.core_pattern=core
      - name: Lint the compiler as the gate does
        run: |
          perl .github/run-check.pl cursor-lint cargo clippy --manifest-path compiler/Cargo.toml \
            --all-targets --locked --offline -- -D warnings
      - name: Run every unit test
        if: always()
        run: |
          perl .github/run-check.pl cursor-unit cargo test --manifest-path compiler/Cargo.toml \
            --profile gate --locked --offline --lib
  programs:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install the host toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          rustup default stable
          cargo --version
          cargo fetch --locked --manifest-path compiler/Cargo.toml
      - name: Decline core dumps
        run: sudo sysctl -w kernel.core_pattern=core
      - name: Run the ordered-map, snapshot-export and firn program tests
        run: |
          ulimit -c 0
          perl .github/run-check.pl cursor-programs cargo test --manifest-path compiler/Cargo.toml \
            --profile gate --locked --offline --test corpus -- \
            programs::containers::ordered_map programs::containers::a_client_cannot_read_the_ordered_maps_tree \
            programs::snapshot_export programs::network::firn_
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - name: Set the scratch root
        run: echo "WHITEFOOT_SCRATCH_ROOT=$RUNNER_TEMP/whitefoot" >> "$GITHUB_ENV"
      - name: Name main as a local ref and select the design review base
        run: |
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          git branch -f main origin/main
          echo "DESIGN_REVIEW_BASE=$(git merge-base main HEAD)" >> "$GITHUB_ENV"
      - name: Install the host toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          rustup default stable
          rustup component add clippy rustfmt
          cargo --version
      - name: Fetch locked compiler dependencies
        run: cargo fetch --locked --manifest-path compiler/Cargo.toml
      - name: Decline core dumps
        run: sudo sysctl -w kernel.core_pattern=core
      - name: static
        env:
          WHITEFOOT_CHECK_TIMEOUT: 2400
        run: make check-group GROUP=static

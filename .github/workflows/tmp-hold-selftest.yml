# Temporary: runs the hash-map comparison's reducer self-test, then seven
# changed copies of compare.py (a hold reading taken from the wrong size or
# with the wrong bound) and requires each to make the self-test fail with the
# named case. wf-hash-map-bench-hold removes this file before the full check.
name: tmp-hold-selftest

on:
  push:
    branches: [wf-hash-map-bench-hold]

jobs:
  selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Host memory
        run: |
          free -m
          nproc

      - name: Self-test as written
        run: python3 -B research/experiments/hash-map-compare/compare.py self-test

      - name: Self-test of changed copies
        run: |
          source=research/experiments/hash-map-compare/compare.py
          status=0
          mutant() {
            label=$1; old=$2; new=$3; wanted=$4
            directory="$RUNNER_TEMP/mutant-$label"
            mkdir -p "$directory"
            python3 -I -c 'import sys; s = open(sys.argv[1]).read(); assert s.count(sys.argv[3]) == 1, sys.argv[3]; open(sys.argv[2], "w").write(s.replace(sys.argv[3], sys.argv[4]))' \
              "$source" "$directory/compare.py" "$old" "$new"
            code=0
            python3 -B "$directory/compare.py" self-test > "$directory/out.txt" 2>&1 || code=$?
            echo "== $label: exit $code"
            cat "$directory/out.txt"
            if [ "$code" -ne 1 ] || ! grep -q "^FAIL $wanted" "$directory/out.txt"; then
              echo "NOT DETECTED: $label (wanted exit 1 and a FAIL line for: $wanted)"
              status=1
            fi
          }
          mutant h3-small-size 'calls[(1, HOLD_REFERENCE)] if r["pairs"] > 0' 'calls[(1, HOLD_SMALL)] if r["pairs"] > 0' 'hold H3 on the reference size'
          mutant h3-large-size 'calls[(1, HOLD_REFERENCE)] if r["pairs"] > 0' 'calls[(1, HOLD_LARGE)] if r["pairs"] > 0' 'hold H3 on the reference size'
          mutant h2-small-size '"H2": reference <= HOLD_LIMIT_NS' '"H2": small <= HOLD_LIMIT_NS' 'hold H2 fail'
          mutant h2-large-size '"H2": reference <= HOLD_LIMIT_NS' '"H2": large <= HOLD_LIMIT_NS' 'hold H2 on the reference size'
          mutant h1-old-factor 'HOLD_GROWTH_FACTOR = 2.0' 'HOLD_GROWTH_FACTOR = 4.0' 'hold H1 fail'
          mutant h1-strict '"H1": large <= HOLD_GROWTH_FACTOR * small' '"H1": large < HOLD_GROWTH_FACTOR * small' 'hold H1 at the factor'
          mutant h1-reference-as-small 'small, large = stats[(1, HOLD_SMALL)][1], stats[(1, HOLD_LARGE)][1]' 'small, large = stats[(1, HOLD_REFERENCE)][1], stats[(1, HOLD_LARGE)][1]' 'hold H1 fail'
          exit "$status"

# Temporary: each mutant undoes one thing the Slab reserve change protects and
# must make the slab program test fail at run time, not at compile time.
# Removed before the branch is ready.
name: tmp-slab-mutants

on:
  push:
    branches: [claude/slab-reserve]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0

jobs:
  mutant:
    name: mutant ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        name: [end-marker, no-grow, no-ceiling]
    steps:
      - uses: actions/checkout@v4

      - name: Install the host toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          rustup default stable
          cargo fetch --locked --manifest-path compiler/Cargo.toml

      - name: Apply the mutant to the Slab library
        run: |
          case "${{ matrix.name }}" in
            end-marker)
              # slab_new uses the initial capacity as the free-list end marker again.
              perl -0pi -e 's/free_head: ceiling\);/free_head: capacity);/' lib/std/collections/slab/slab.wf ;;
            no-grow)
              # slab_reserve reports Ok without growing the backing.
              perl -0pi -e 's/  grow\(cell: &slab\^\.cells, capacity: capacity\);\n//' lib/std/collections/slab/slab.wf ;;
            no-ceiling)
              # slab_reserve accepts requests above the ceiling.
              perl -0pi -e 's/  if capacity > ceiling \{\n    return Err<unit, unit>\(error: unit\);\n  \}\n//' lib/std/collections/slab/slab.wf ;;
          esac
          if git diff --quiet -- lib/std/collections/slab/slab.wf; then
            echo "::error::the mutant did not apply"
            exit 1
          fi
          git diff -- lib/std/collections/slab/slab.wf

      - name: Run the slab program test on the mutant
        run: |
          out="$RUNNER_TEMP/mutant.log"
          set +e
          (cd compiler && perl ../.github/run-check.pl "mutant-${{ matrix.name }}" cargo test --profile gate --test corpus --locked --offline -- slab_operations_and_memberships --nocapture) > "$out" 2>&1
          code=$?
          set -e
          grep -E 'panicked|left:|right:|test result|^error' "$out" | head -20 || true
          if [ "$code" -eq 0 ]; then
            echo "::error::mutant ${{ matrix.name }} survived: the test passed"
            exit 1
          fi
          if grep -qE '^error(\[E[0-9]+\])?:' "$out"; then
            echo "::error::mutant ${{ matrix.name }} failed to compile, not at run time"
            exit 1
          fi
          echo "::notice::mutant ${{ matrix.name }} failed the test at run time"

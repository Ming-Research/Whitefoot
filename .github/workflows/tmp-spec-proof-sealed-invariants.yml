# Temporary (spec-proof-sealed-invariants): puts back, one per job, the two
# rules the fifteenth and sixteenth review rounds of #484 found unsound and the
# literal reading of the gap the proof found, and watches the cases that
# protect each fail and the soundness proofs fail to check; proof.yml checks the
# component as it is. Removed before the full check.
name: tmp-spec-proof-sealed-invariants

on:
  push:
    branches: [spec-proof-sealed-invariants]

jobs:
  watch-fail:
    name: Cases and proofs fail with ${{ matrix.defect }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The fifteenth round: a store through a reference with several
          # members removes the debts proved at or below every member.
          - defect: the joined store
            old: "    if 2 ≤ (s.members q).length then"
            new: "    if false then"
            guards: "147 209"
          # The sixteenth round: a debt a swap exchanges keeps its recorded
          # reference.
          - defect: the recorded swap
            old: "  | .inv a I _ => if a.steps.length = o.steps.length then .inv t I none else .cover t"
            new: "  | .inv a I rc => if a.steps.length = o.steps.length then .inv t I rc else .cover t"
            guards: "197 209"
          # The gap: a store's own write-row debts are offered for restoration
          # by its kill row, with the facts before the batch.
          - defect: the literal reading
            old: "        some (X.settle f kb (.inv ⟨w.root, w.steps.take k⟩ I (writeRec w k through)))"
            new: "        some (.inv ⟨w.root, w.steps.take k⟩ I (writeRec w k through))"
            old2: "  ⟨addDebts (X.killRow f kb (storeRemove s w s.debts)) (X.writeRows f kb s w []),"
            new2: "  ⟨X.killRow f kb (addDebts (storeRemove s w s.debts) (X.writeRows f kb s w [])),"
            guards: "370"
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Lean toolchain
        working-directory: proof
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lake" --version
      - name: Put the defect back
        env:
          OLD: ${{ matrix.old }}
          NEW: ${{ matrix.new }}
          OLD2: ${{ matrix.old2 }}
          NEW2: ${{ matrix.new2 }}
        run: |
          file=proof/WhitefootProof/Sealing.lean
          test "$(grep -cxF -- "$OLD" "$file")" -eq 1
          OLD="$OLD" NEW="$NEW" perl -pi -e 's/^\Q$ENV{OLD}\E$/$ENV{NEW}/' "$file"
          grep -nxF -- "$NEW" "$file"
          if [ -n "$OLD2" ]; then
            test "$(grep -cxF -- "$OLD2" "$file")" -eq 1
            OLD2="$OLD2" NEW2="$NEW2" perl -pi -e 's/^\Q$ENV{OLD2}\E$/$ENV{NEW2}/' "$file"
            grep -nxF -- "$NEW2" "$file"
          fi
          git diff --stat
      - name: Cases on the defective component
        working-directory: proof
        env:
          GUARDS: ${{ matrix.guards }}
        run: |
          set +e
          perl ../.github/run-check.pl tmp-watch-cases lake build WhitefootProof.SealingCases > "$RUNNER_TEMP/cases.txt" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/cases.txt"
          if [ "$status" -eq 0 ]; then
            echo "unexpected pass with the defect"
            exit 1
          fi
          grep -E "^error: .*WhitefootProof/SealingCases\.lean:[0-9]+:" "$RUNNER_TEMP/cases.txt" | tee "$RUNNER_TEMP/errors.txt"
          for line in $GUARDS; do
            grep -E "WhitefootProof/SealingCases\.lean:$line:" "$RUNNER_TEMP/errors.txt"
          done
      - name: Proofs on the defective component
        working-directory: proof
        run: |
          set +e
          perl ../.github/run-check.pl tmp-watch-proofs lake build WhitefootProof.SealingSound > "$RUNNER_TEMP/proofs.txt" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/proofs.txt"
          if [ "$status" -eq 0 ]; then
            echo "unexpected pass with the defect"
            exit 1
          fi
          grep -E "^error: .*WhitefootProof/SealingSound\.lean:[0-9]+:" "$RUNNER_TEMP/proofs.txt"

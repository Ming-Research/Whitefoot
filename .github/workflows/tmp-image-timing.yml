# Temporary (board item on the candidate images' first-use cost): separates a
# cold first clang use from writeback of the two compiler builds' output by
# timing the image step after each kind of preparation. Removed before the
# branch is ready.
name: tmp-image-timing

on:
  push:
    branches: [claude/ci-image-warmup]

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
  CARGO_BUILD_JOBS: 2
  JOBS: 2

jobs:
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        prep: [none, sync, warm]
        rep: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            compiler/target
            ${{ runner.temp }}/baseline-target
          key: ${{ runner.os }}-formal-compute-${{ hashFiles('compiler/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-formal-compute-${{ hashFiles('compiler/Cargo.lock') }}-
      - name: Two compiler builds, as compute-regression does
        run: |
          rustup default stable
          git worktree add --detach "$RUNNER_TEMP/baseline" HEAD
          cargo build --manifest-path compiler/Cargo.toml --locked --profile gate --bin whitefootc
          cargo build --manifest-path "$RUNNER_TEMP/baseline/compiler/Cargo.toml" --locked --profile gate --bin whitefootc --target-dir "$RUNNER_TEMP/baseline-target"
      - name: Preparation ${{ matrix.prep }}
        run: |
          grep -E '^(Dirty|Writeback):' /proc/meminfo
          case "${{ matrix.prep }}" in
            sync) /usr/bin/time -f 'sync %e s' sync ;;
            warm) printf 'int main(void){return 0;}\n' > "$RUNNER_TEMP/w.c"; /usr/bin/time -f 'warm %e s' /usr/bin/clang -O2 -c "$RUNNER_TEMP/w.c" -o "$RUNNER_TEMP/w.o" ;;
          esac
          grep -E '^(Dirty|Writeback):' /proc/meminfo
      - name: Image builds
        run: |
          for which in first second; do
            start=$(date +%s.%N)
            make -s -j2 -C tests/performance build BUILD="$RUNNER_TEMP/images-$which" > /dev/null
            end=$(date +%s.%N)
            echo "IMAGES prep=${{ matrix.prep }} rep=${{ matrix.rep }} $which $(echo "$end - $start" | bc) s"
            grep -E '^(Dirty|Writeback):' /proc/meminfo
          done

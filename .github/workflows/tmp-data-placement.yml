# Temporary: research/investigations/data-placement. On hosted runners it
# builds the regression images of three revisions (the stop-signals probe's
# merge base and its receiver-before-entry revision, and this branch) and times
# them under data-only moves. Removed once the investigation has its results;
# the gate fails while a tmp- workflow exists.
#
# It runs only for a head commit whose message carries the line
# "Probe-Run: data-placement-1", so later pushes of the branch start nothing.
name: tmp-data-placement
on:
  push:
defaults:
  run:
    shell: bash
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
jobs:
  decide:
    name: decide
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.marker.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: marker
        run: |
          if git log -1 --format=%B | grep -q '^Probe-Run: data-placement-1$'; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi
  probe:
    name: probe ${{ matrix.i }}
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        i: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Host and tools
        run: |
          lscpu | grep -E '^(Model name|CPU\(s\)):'
          rustup default stable
          rustc -vV
          test -x /usr/bin/clang
          /usr/bin/clang --version
          sudo apt-get update -qq
          sudo apt-get install -y -qq strace > /dev/null
          strace --version | head -n 1
      # b: the stop-signals probe's merge base. s: the revision that started
      # the stop receiver thread before the entry (the probe's S).
      - name: Trees of the two earlier revisions
        run: |
          git worktree add --detach "$RUNNER_TEMP/b" c18e6708b6cc56749e621cf666040cd362094f35
          git worktree add --detach "$RUNNER_TEMP/s" 9ec75560688efe3a016c1dce9948a443b8e017e8
      - name: Compilers
        run: |
          WHITEFOOT_CHECK_TIMEOUT=900 perl .github/run-check.pl tmp-data-placement-compiler-h \
            cargo build --manifest-path compiler/Cargo.toml --locked --profile gate --bin whitefootc
          for revision in b s; do
            CARGO_TARGET_DIR="$RUNNER_TEMP/$revision-target" WHITEFOOT_CHECK_TIMEOUT=900 \
              perl .github/run-check.pl "tmp-data-placement-compiler-$revision" \
              cargo build --manifest-path "$RUNNER_TEMP/$revision/compiler/Cargo.toml" \
              --locked --profile gate --bin whitefootc \
              || echo "::warning::the compiler of revision $revision did not build"
          done
      # Every image is built by this branch's instrument and linked with
      # shift.o, whose moves the environment selects at run time. hd is h with
      # 32 bytes of static data ahead of every other object's.
      - name: Images
        run: |
          here=research/investigations/data-placement
          images="$RUNNER_TEMP/images"
          mkdir -p "$images"
          /usr/bin/clang -std=c11 -O2 -Wall -Wextra -Werror -pthread -c "$here/shift.c" -o "$images/shift.o"
          /usr/bin/clang -std=c11 -O2 -Wall -Wextra -Werror "$here/alias.c" -o "$images/alias"
          printf '\t.section .note.GNU-stack,"",@progbits\n\t.data\nwf_data_pad:\n\t.fill 32,1,0x55\n\t.bss\nwf_bss_pad:\n\t.zero 32\n' \
            | /usr/bin/clang -x assembler -c - -o "$images/datapad.o"
          link="-pthread -lm $images/shift.o"
          make -j2 -C tests/performance build BUILD="$images/h" NATIVE_LINK_FLAGS="$link"
          make -j2 -C tests/performance build BUILD="$images/hd" NATIVE_LINK_FLAGS="$link" \
            PAD_OBJECT="$images/datapad.o"
          for revision in b s; do
            test -x "$RUNNER_TEMP/$revision-target/gate/whitefootc" || continue
            make -j2 -C tests/performance build BUILD="$images/$revision" NATIVE_LINK_FLAGS="$link" \
              ROOT="$RUNNER_TEMP/$revision" WFC="$RUNNER_TEMP/$revision-target/gate/whitefootc" \
              FIXTURES="$RUNNER_TEMP/$revision/tests/programs/compute" \
              || echo "::warning::the images of revision $revision did not build"
          done
          ls "$images"
      - name: Measure
        run: |
          WHITEFOOT_CHECK_TIMEOUT=3300 perl .github/run-check.pl tmp-data-placement-probe \
            bash research/investigations/data-placement/probe.sh "$RUNNER_TEMP/images" "$RUNNER_TEMP/results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: data-placement-${{ matrix.i }}
          if-no-files-found: warn
          path: ${{ runner.temp }}/results/

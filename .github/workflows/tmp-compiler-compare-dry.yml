# Temporary dry run of compiler-compare.yml's stages on a hosted runner
# (wf-compiler-compare-14900k); removed before the full check. The job `port`
# compiles and runs the wasm interpreter with a cached compiler, `lint` checks
# the real workflow file, and `dry` runs every stage of research/experiments/
# compiler-compare/run.sh at a small scale: the null run (this commit as both
# arms), a comparison with the compiler of PR 420 as the base (cross) and as the
# candidate against its merge base with main (live, the 14900K verification's
# shape); default is the zero control at the workflow's default inputs, the
# acceptance run.
name: tmp-compiler-compare-dry

on:
  push:
    branches: [wf-compiler-compare-14900k]

permissions:
  contents: read

concurrency:
  group: tmp-compiler-compare-dry
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
  HALO: df3eb9ec00f4d7db992e82b6d8ab35f8a643a317

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color .github/workflows/compiler-compare.yml
      - name: Self-tests
        if: ${{ !cancelled() }}
        run: |
          OUT=/tmp/out bash research/experiments/compiler-compare/run.sh selftest
          bash -n research/experiments/compiler-compare/run.sh research/experiments/compiler-compare/arms.sh
      - name: The groups stage as the workflow calls it
        if: ${{ !cancelled() }}
        run: |
          run=research/experiments/compiler-compare/run.sh
          export OUT=/tmp/out
          GROUP_LIST=hash_map,interpreters,perf bash $run groups
          GROUP_LIST=interpreters bash $run groups
          for list in perf "" hash_map,intepreters; do
            if GROUP_LIST=$list bash $run groups; then echo "groups '$list' was accepted"; exit 1; fi
          done
          if env -u GROUP_LIST bash $run groups; then echo "an unset list was accepted"; exit 1; fi
      - name: Dispatch inputs the workflow declares
        if: ${{ !cancelled() }}
        run: python3 -c "import yaml,sys; d=yaml.safe_load(open('.github/workflows/compiler-compare.yml')); print(len(d[True]['workflow_dispatch']['inputs']), 'inputs')"

  port:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install the host toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          rustup default stable
      - uses: actions/cache@v4
        id: compiler-cache
        with:
          path: compiler/target/gate/whitefootc
          key: tmp-dry-whitefootc-${{ hashFiles('compiler/**') }}
      - name: Build the compiler
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        env:
          WHITEFOOT_CHECK_TIMEOUT: "3000"
        run: |
          cargo fetch --locked --manifest-path compiler/Cargo.toml
          perl .github/run-check.pl dry/build make -C compiler build
      - name: Fetch Silverfir-nano
        run: |
          mkdir -p "$RUNNER_TEMP/p"
          git clone --quiet https://github.com/mbbill/Silverfir-nano "$RUNNER_TEMP/p/silverfir"
          git -C "$RUNNER_TEMP/p/silverfir" checkout --quiet 5f248e4420102356be7edadbdb4db2ae105d3270
      - name: Compile the wasm interpreter, fixing each redundant condition in the sources until it compiles
        run: |
          wfc=$PWD/compiler/target/gate/whitefootc
          python3 -B - "$wfc" "$RUNNER_TEMP/p" <<'PY'
          import re, subprocess, sys
          wfc, tmp = sys.argv[1], sys.argv[2]
          dirp = 'research/experiments/match-dispatch/wasm/'
          files = [dirp + 'interp_head.wf', dirp + 'interp_tail.wf']
          texts = {f: open(f).read().split('\n') for f in files}
          def compile_once():
              subprocess.run([sys.executable, '-B', dirp + 'gen.py', tmp + '/v2h.wf'], check=True)
              r = subprocess.run([wfc, tmp + '/v2h.wf', '--cache', tmp + '/v2h-cache', '-o', tmp + '/v2h-image'],
                                 capture_output=True, text=True)
              return r.returncode, r.stdout + r.stderr
          def block_end(lines, k):
              depth = 0
              for j in range(k, len(lines)):
                  depth += lines[j].count('{') - lines[j].count('}')
                  if depth == 0:
                      return j
              raise SystemExit('unbalanced block at line %d' % (k + 1))
          for iteration in range(60):
              code, out = compile_once()
              if code == 0:
                  print('compiled after', iteration, 'fixes')
                  break
              errors = re.findall(r'v2h\.wf:(\d+):\d+: error\[OP-5\]: RedundantCondition\n\s+source:\s+(.*)\n.*\n.*\n\s+decided: (\w+)', out)
              if not errors:
                  print(out[:6000])
                  raise SystemExit('a different error')
              fixed = 0
              generated = open(tmp + '/v2h.wf').read().split('\n')
              # One error at a time: a fix moves the lines the others name.
              for lineno, source, decided in errors[:1]:
                  cond = source.strip()
                  hits = [(f, i) for f in files for i, l in enumerate(texts[f]) if l.strip() == cond]
                  seen = [i for i, l in enumerate(generated) if l.strip() == cond]
                  print('redundant:', cond, 'decided', decided, 'at generated line', lineno, 'hits', hits, 'seen', seen)
                  # The sources are copied in order, so the error's place among the
                  # generated copies of the line is its place among the source hits.
                  if decided != 'True' or len(hits) != len(seen) or int(lineno) - 1 not in seen:
                      print(out[:6000])
                      raise SystemExit('needs a manual edit: ' + cond)
                  hits = [hits[seen.index(int(lineno) - 1)]]
                  f, k = hits[0]
                  lines = texts[f]
                  end = block_end(lines, k)
                  indent = len(lines[k]) - len(lines[k].lstrip())
                  body_end = end
                  tail = lines[end].strip()
                  if tail.startswith('} else {'):
                      body_end = end
                      end = block_end(lines, end)  # the else block closes at 'end'
                  elif tail != '}':
                      raise SystemExit('else-if chain after: ' + cond)
                  body = [l[2:] if l.startswith(' ' * (indent + 2)) else l for l in lines[k + 1:body_end]]
                  lines[k:end + 1] = body
                  fixed += 1
              for f in files:
                  open(f, 'w').write('\n'.join(texts[f]))
              print('fixed', fixed, 'in iteration', iteration)
          else:
              raise SystemExit('still failing after 60 iterations')
          PY
          git --no-pager diff --stat -- research/experiments/match-dispatch
          git --no-pager diff -- research/experiments/match-dispatch | tee "$RUNNER_TEMP/port.diff"
      - uses: actions/upload-artifact@v4
        with:
          name: port-diff
          path: ${{ runner.temp }}/port.diff
      - name: Generate, compile and run the wasm interpreter
        run: |
          wfc=$PWD/compiler/target/gate/whitefootc
          python3 -B research/experiments/match-dispatch/wasm/gen.py "$RUNNER_TEMP/p/v2h.wf"
          ( time "$wfc" "$RUNNER_TEMP/p/v2h.wf" --cache "$RUNNER_TEMP/p/v2h-cache" -o "$RUNNER_TEMP/p/v2h-image" ) 2>&1 | cut -c1-600 | head -200
          test -x "$RUNNER_TEMP/p/v2h-image"
          cp "$RUNNER_TEMP/p/silverfir/benchmarks/wasi/coremark/coremark.wasm" "$RUNNER_TEMP/p/coremark.wasm"
          echo "== relative path, 2000 iterations"
          cd "$RUNNER_TEMP/p"
          ( time taskset -c 1 "$RUNNER_TEMP/p/v2h-image" coremark.wasm 0x0 0x0 0x66 2000 ) 2>&1 | tail -30
      - name: Which inputs of the compile change the image bytes
        continue-on-error: true
        run: |
          wfc=$PWD/compiler/target/gate/whitefootc
          p=$RUNNER_TEMP/p
          mkdir -p "$p/copy"
          cp "$p/v2h.wf" "$p/copy/v2h.wf"
          "$wfc" "$p/v2h.wf" --cache "$p/c2" -o "$p/image-othercache"
          "$wfc" "$p/v2h.wf" --cache "$p/v2h-cache" -o "$p/image-warm"
          "$wfc" "$p/v2h.wf" -o "$p/image-nocache"
          "$wfc" "$p/copy/v2h.wf" --cache "$p/c3" -o "$p/image-othersource"
          "$wfc" "$p/v2h.wf" --cache "$p/c4" -o "$p/image-othercache2"
          cd "$p"
          sha256sum v2h-image image-*
          ls -l v2h-image image-*
          for f in image-*; do echo "$f differs from v2h-image in $(cmp -l v2h-image "$f" | wc -l) bytes"; done
          cmp -l v2h-image image-othercache | head -20
          cmp image-othercache image-othercache2 && echo "two other caches agree" || echo "two other caches differ"
      - name: Perf availability
        continue-on-error: true
        run: |
          which perf || echo "no perf"
          cat /proc/sys/kernel/perf_event_paranoid
          perf stat -x, -e instructions:u,cycles:u -- true 2>&1 | head
          ls /sys/bus/event_source/devices/

  dry:
    needs: [lint, port]
    strategy:
      fail-fast: false
      matrix:
        case: [zero, cross, live, scale, default]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CANDIDATE: ${{ matrix.case == 'live' && 'claude/cold-branch-weights' || github.sha }}
      BASE: ${{ matrix.case == 'cross' && 'claude/cold-branch-weights' || github.sha }}
      CASE: ${{ matrix.case }}
      RUNNER_KIND: github
      # The default case is the acceptance run (not named null: YAML reads that as no value): the compiler-compare.yml defaults.
      SIZES: ${{ (matrix.case == 'scale' || matrix.case == 'default') && '1000,10000,1000000' || '1000,10000' }}
      MIN_ROUNDS: ${{ matrix.case == 'default' && '10' || '6' }}
      MAX_ROUNDS: ${{ matrix.case == 'default' && '40' || '8' }}
      INTERP_MIN_ROUNDS: ${{ matrix.case == 'default' && '10' || '6' }}
      INTERP_MAX_ROUNDS: ${{ matrix.case == 'default' && '30' || '8' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: port-diff
          path: ${{ runner.temp }}/diff
      - name: Apply the port's source fixes
        run: |
          if [ -s "$RUNNER_TEMP/diff/port.diff" ]; then git apply "$RUNNER_TEMP/diff/port.diff"; fi
          git status --short
      - name: Install the host toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          rustup default stable
      - name: Stages
        env:
          WHITEFOOT_CHECK_TIMEOUT: "12000"
        run: |
          export OUT="$RUNNER_TEMP/out"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          run=research/experiments/compiler-compare/run.sh
          # The live case leaves the base empty: the candidate's merge base with main.
          if [ "$CASE" = live ]; then BASE=; export BASE; fi
          bash $run tools
          bash $run selftest
          perl .github/run-check.pl dry/arms bash $run arms
          status=0
          perl .github/run-check.pl dry/hashmap bash $run hashmap || status=$?
          perl .github/run-check.pl dry/interp bash $run interp || status=$?
          bash $run summary
          exit $status
      - name: The 14900K branch of the tools stage runs on a hosted runner
        if: ${{ matrix.case == 'zero' && !cancelled() }}
        run: |
          # ps | sed under pipefail, loadavg and the pinned-CPU default.
          OUT="$RUNNER_TEMP/out" RUNNER_KIND=14900k PERF=0 bash research/experiments/compiler-compare/run.sh tools
      - name: A failed perf stat leaves the timed table and fails the stage
        if: ${{ matrix.case == 'zero' && !cancelled() }}
        run: |
          export OUT="$RUNNER_TEMP/out"
          run=research/experiments/compiler-compare/run.sh
          # Hosted runners refuse perf stat; asking for the 14900K's perf stage
          # makes the stage run it, and it must fail after reducing the timed rows.
          set +e
          RUNNER_KIND=14900k CPU=1 PERF=1 INTERP_MIN_ROUNDS=6 INTERP_MAX_ROUNDS=6 bash $run interp
          code=$?
          set -e
          echo "interp exit $code"
          cat "$OUT/interp/summary.txt"
          test "$code" != 0
          grep -q "^fib " "$OUT/interp/summary.txt"
          grep -q "^coremark " "$OUT/interp/summary.txt"
          grep -q "perf stat failed" "$OUT/interp/summary.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dry-${{ matrix.case }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/out/manifest.txt
            ${{ runner.temp }}/out/hashmap/summary.txt
            ${{ runner.temp }}/out/hashmap/raw.tsv
            ${{ runner.temp }}/out/interp/summary.txt
            ${{ runner.temp }}/out/interp/time.tsv
            ${{ runner.temp }}/out/interp/manifest.txt

# Temporary (wf-gate-budget-noise): removed before the branch is ready.
#
# Question: does compiling the semantic tests' front-end driver once, instead
# of once per test closure, shorten the cold build of the unit test binary
# (`cargo test --profile gate --lib --no-run`, the unit group's first stage)?
#
# Prediction written before the run: the driver and its two `timed` wrappers
# were 1,545 copies of about 620 unoptimized IR lines each, 8.6% of the test
# binary's IR; if build time follows IR size at all, dedup/base falls below
# 0.98. Rejected if the median dedup/base over rounds 2 on is 0.99 or more, or
# lies within the spread of twin/base (twin is the same source as base, so its
# ratio to base is this run's noise).
#
#   base   200e4f8c3bee1040b409903a871347226fb9f715 (compiler sources equal to main 48b990f05)
#   twin   a second checkout of base
#   dedup  96e886d86c38b8cc124be4f5393e9d61b71b5561
# Six cold builds per round at the unit group's command, order rotated each
# round, first round dropped from the ratios.
name: tmp-test-build-dedup

on:
  push:
    branches: [wf-gate-budget-noise]
    paths: ['.github/workflows/tmp-test-build-dedup.yml']

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0

jobs:
  pairs:
    name: pairs (host ${{ matrix.host }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        host: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Install the host toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          rustup default stable
          cargo --version
          sudo sysctl -w kernel.core_pattern=core

      - name: Fetch locked compiler dependencies
        run: cargo fetch --locked --manifest-path compiler/Cargo.toml

      - name: Record the host
        run: |
          uname -a
          nproc
          grep -m 1 'model name' /proc/cpuinfo

      - name: Prepare the trees
        run: |
          set -eu
          for v in base twin; do
            git worktree add --detach "$RUNNER_TEMP/$v" 200e4f8c3bee1040b409903a871347226fb9f715
          done
          git worktree add --detach "$RUNNER_TEMP/dedup" 96e886d86c38b8cc124be4f5393e9d61b71b5561
          for v in base twin dedup; do
            git -C "$RUNNER_TEMP/$v" submodule update --init -q || true
          done

      - name: Interleaved cold builds
        run: |
          set -eu
          ulimit -c 0
          variants=(base twin dedup)
          : > "$RUNNER_TEMP/walls.txt"
          for round in 1 2 3 4; do
            for k in 0 1 2; do
              v=${variants[$(( (k + round - 1) % 3 ))]}
              tree="$RUNNER_TEMP/$v"
              rm -rf "$tree/compiler/target"
              start=$(date +%s%N)
              if ! (cd "$tree/compiler" && cargo test --profile gate --lib --no-run --locked --offline) > "$RUNNER_TEMP/build-$v-$round.log" 2>&1; then
                tail -40 "$RUNNER_TEMP/build-$v-$round.log"
                exit 1
              fi
              end=$(date +%s%N)
              ms=$(( (end - start) / 1000000 ))
              echo "round $round $v ${ms} ms"
              echo "$round $v $ms" >> "$RUNNER_TEMP/walls.txt"
              rm -rf "$tree/compiler/target"
            done
          done

      - name: Summary
        if: always()
        run: |
          test -s "$RUNNER_TEMP/walls.txt" || exit 0
          python3 -I - "$RUNNER_TEMP/walls.txt" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import sys, statistics
          rows = [l.split() for l in open(sys.argv[1]) if l.strip()]
          walls = {}
          for rnd, v, ms in rows:
              walls.setdefault(int(rnd), {})[v] = int(ms) / 1000.0
          names = ("base", "twin", "dedup")
          print("### cold unit test build, seconds (host ${{ matrix.host }})")
          print()
          print("| round | " + " | ".join(names) + " |")
          print("|---" * (len(names) + 1) + "|")
          for rnd in sorted(walls):
              w = walls[rnd]
              print("| %d | %s |" % (rnd, " | ".join("%.1f" % w[v] if v in w else "-" for v in names)))
          print()
          for v in names[1:]:
              ratios = [walls[r][v] / walls[r]["base"] for r in sorted(walls)[1:] if v in walls[r] and "base" in walls[r]]
              if len(ratios) > 1:
                  print("%s/base, rounds 2 on: %s; median %.3f" % (v, ", ".join("%.3f" % x for x in ratios), statistics.median(ratios)))
          PY

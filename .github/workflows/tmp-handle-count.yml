# Temporary: measures whether an atomic statement through a value handle runs
# at least 0.95 times the throughput of the same statement through a read-only
# reference parameter, with the compiler of the pull request that stops
# counting a handle the statement's block cannot lose, under the procedure and
# rejection criterion registered in research/investigations/handle-count/
# README.md before any result. Removed after the run, with the results copied
# into that investigation's record.
#
#   gh workflow run tmp-handle-count.yml --ref <branch> -f mode=smoke
#   gh workflow run tmp-handle-count.yml --ref <branch> -f mode=pilot
#   gh workflow run tmp-handle-count.yml --ref <branch> -f mode=main
#
# smoke builds both compilers and the arms on a GitHub-hosted runner, checks
# the handle-count calls in the emitted LLVM, and runs every arm briefly on two
# CPUs to check the wiring and the final map contents; its rates decide
# nothing. pilot (2 blocks) and main (the registered blocks) run only on the
# 14900K runner and refuse any other host.
#
# The heavy steps run under .github/run-check.pl, which holds the host-wide
# lock so that no other heavy command shares the machine. Their labels have
# no row in .github/time-budgets.txt and no budget record is named here, so
# the budget comparison is skipped for them; a dispatch-only measurement is
# not a gate stage.
#
# research-boundary: manual-only
# Explicitly requested measurement; no push or pull-request trigger.
name: tmp-handle-count

on:
  workflow_dispatch:
    inputs:
      mode:
        description: smoke checks the wiring on a GitHub-hosted runner (no verdict); pilot is 2 blocks and main the registered blocks, both on the 14900K
        type: choice
        options: [smoke, pilot, main]
        default: smoke
      blocks:
        description: Blocks of the main run (registered as 12)
        type: string
        default: "12"
      pr_rev:
        description: The pull request's compiler revision; the base is its merge base with main
        type: string
        default: 37d392caf

defaults:
  run:
    shell: bash

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0

jobs:
  smoke:
    if: ${{ inputs.mode == 'smoke' }}
    name: handle-count (smoke, GitHub-hosted, no verdict)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MILLIS: "200"
      BLOCKS: "2"
      CPU_LIST: "0,1"
      PR_INPUT: ${{ inputs.pr_rev }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install the host's tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld
          rustup default stable
          missing=
          for tool in /usr/bin/clang ld.lld cargo make taskset perl python3 git awk lscpu timeout sha256sum; do
            command -v "$tool" >/dev/null || missing="$missing $tool"
          done
          if [ -n "$missing" ]; then
            echo "missing:$missing"
            exit 1
          fi
          echo "OUT=$RUNNER_TEMP/handle-count" >> "$GITHUB_ENV"

      - name: Build the PR's and the base's compilers
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          pr=$(git rev-parse "$PR_INPUT")
          base=$(git merge-base origin/main "$pr")
          echo "PR_REV=$pr" >> "$GITHUB_ENV"
          echo "BASE_REV=$base" >> "$GITHUB_ENV"
          echo "pr $pr base $base"
          git worktree prune
          rm -rf "$RUNNER_TEMP/pr" "$RUNNER_TEMP/base"
          git worktree add --detach "$RUNNER_TEMP/pr" "$pr"
          git worktree add --detach "$RUNNER_TEMP/base" "$base"
          for tree in "$RUNNER_TEMP/pr" "$RUNNER_TEMP/base"; do
            cargo fetch --locked --manifest-path "$tree/compiler/Cargo.toml"
            make -C "$tree/compiler" build
          done

      - name: Build the arms and check the handle-count calls
        run: |
          perl .github/run-check.pl handle-count/build \
            bash research/experiments/handle-count/build.sh \
              --pr "$RUNNER_TEMP/pr/compiler/target/gate/whitefootc" \
              --base "$RUNNER_TEMP/base/compiler/target/gate/whitefootc" \
              --out "$OUT"

      - name: Run the arms
        run: |
          perl .github/run-check.pl handle-count/cells \
            bash research/experiments/handle-count/run.sh --out "$OUT" --bins "$OUT/bin"

      - name: Summarize
        if: always()
        run: |
          test -s "$OUT/raw.tsv" || { echo "no rows were written"; exit 1; }
          python3 -B research/experiments/handle-count/summarize.py --smoke "$OUT/raw.tsv" > "$OUT/summary.txt"
          cat "$OUT/summary.txt"
          grep -q 'blocks kept: 2 of 2' "$OUT/summary.txt" || echo "::warning::the smoke's twin differed by more than 3% in a block; hosted rates are noisy and decide nothing"
          {
            echo "## handle-count (smoke, no verdict)"
            echo
            echo '```text'
            cat "$OUT/host.txt" 2>/dev/null
            echo
            cat "$OUT/summary.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: handle-count-smoke-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/handle-count/raw.tsv
            ${{ runner.temp }}/handle-count/summary.txt
            ${{ runner.temp }}/handle-count/host.txt
            ${{ runner.temp }}/handle-count/runs/
            ${{ runner.temp }}/handle-count/ll/

  measure:
    if: ${{ inputs.mode != 'smoke' }}
    name: handle-count (${{ inputs.mode }}, 14900K)
    runs-on: [self-hosted, 14900k]
    # Builds of two compilers dominate; the cells take about 1 minute at 12
    # blocks. Bounds a stuck runner only.
    timeout-minutes: 90
    # One run at a time on the 14900K, queued rather than cancelled.
    concurrency:
      group: tmp-handle-count-14900k
      cancel-in-progress: false
    env:
      MODE: ${{ inputs.mode }}
      PR_INPUT: ${{ inputs.pr_rev }}
      MILLIS: "1000"
      # The 14900K's 8 P-cores, one hyperthread each.
      CPU_LIST: "0,2,4,6,8,10,12,14"
    steps:
      # The timed modes measure the 14900K's P-cores; any other host would
      # give numbers that answer nothing, so it stops here.
      - name: Refuse any host but the 14900K
        run: |
          model=$(awk -F': ' '/^model name/ {print $2; exit}' /proc/cpuinfo)
          echo "runner: $RUNNER_NAME ($RUNNER_ENVIRONMENT); model: $model; cpus: $(nproc)"
          if [ "$RUNNER_ENVIRONMENT" != self-hosted ]; then
            echo "the $MODE mode runs only on the self-hosted 14900K runner; use mode=smoke on a GitHub-hosted runner"
            exit 1
          fi
          case $model in
            *i9-14900K*) ;;
            *) echo "this host is not an i9-14900K; the CPU list names that machine's cores"; exit 1 ;;
          esac
          if [ "$(nproc)" != 32 ]; then
            echo "expected 32 CPUs (8 P-cores with two hyperthreads, 16 E-cores), found $(nproc)"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the inputs and the host's tools
        env:
          BLOCKS_INPUT: ${{ inputs.blocks }}
        run: |
          [[ "$BLOCKS_INPUT" =~ ^[1-9][0-9]?$ ]] || { echo "blocks must be a number from 1 to 99"; exit 1; }
          if [ "$MODE" = pilot ]; then blocks=2; else blocks=$BLOCKS_INPUT; fi
          echo "BLOCKS=$blocks" >> "$GITHUB_ENV"
          echo "OUT=$RUNNER_TEMP/handle-count" >> "$GITHUB_ENV"
          # A runner service starts without the login shell's PATH, where
          # rustup puts cargo.
          if [ -d "$HOME/.cargo/bin" ]; then
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          missing=
          for tool in /usr/bin/clang cargo make taskset perl python3 git awk lscpu timeout sha256sum; do
            command -v "$tool" >/dev/null || missing="$missing $tool"
          done
          if [ -n "$missing" ]; then
            echo "missing:$missing"
            exit 1
          fi
          /usr/bin/clang --version

      # A cancelled earlier run can leave its arms running, or the host-wide
      # lock of run-check.pl behind; stop them and say so. Then the machine
      # must be idle: under 5% busy on all CPUs over 5 s.
      - name: Stop leftovers and check that the host is idle
        run: |
          ps -eo pid,args | grep -E '/handle-count/bin/' | grep -v grep | tee "$RUNNER_TEMP/leftover.txt" || true
          awk '{print $1}' "$RUNNER_TEMP/leftover.txt" | xargs -r kill 2>/dev/null || true
          lock=/tmp/whitefoot-check-$(id -u).lock
          if [ -e "$lock" ]; then
            owner=$(head -1 "$lock/pid" 2>/dev/null)
            if [ -z "$owner" ] || ! kill -0 "$owner" 2>/dev/null; then
              echo "removing stale lock of $owner: $(cat "$lock/command" 2>/dev/null)"
              rm -rf "$lock"
            fi
          fi
          sleep 2
          sample() { awk '/^cpu / {idle = $5 + $6; total = 0; for (i = 2; i <= NF; i++) total += $i; print idle, total}' /proc/stat; }
          read -r idle_before total_before < <(sample)
          sleep 5
          read -r idle_after total_after < <(sample)
          busy=$(awk -v ib="$idle_before" -v tb="$total_before" -v ia="$idle_after" -v ta="$total_after" 'BEGIN { printf "%.4f", 1 - (ia - ib) / (ta - tb) }')
          echo "load: $(cat /proc/loadavg); busy share over 5 s: $busy"
          ps -eo pid,pcpu,args --sort=-pcpu | head -n 8
          awk -v busy="$busy" 'BEGIN { exit !(busy > 0.05) }' && { echo "the host is not idle; stop its other work first"; exit 1; } || true

      - name: Build the PR's and the base's compilers
        run: |
          pr=$(git rev-parse "$PR_INPUT")
          base=$(git merge-base origin/main "$pr")
          echo "PR_REV=$pr" >> "$GITHUB_ENV"
          echo "BASE_REV=$base" >> "$GITHUB_ENV"
          echo "pr $pr base $base"
          git worktree prune
          rm -rf "$RUNNER_TEMP/pr" "$RUNNER_TEMP/base"
          git worktree add --detach "$RUNNER_TEMP/pr" "$pr"
          git worktree add --detach "$RUNNER_TEMP/base" "$base"
          for tree in "$RUNNER_TEMP/pr" "$RUNNER_TEMP/base"; do
            cargo fetch --locked --manifest-path "$tree/compiler/Cargo.toml"
            make -C "$tree/compiler" build
          done

      - name: Build the arms and check the handle-count calls
        run: |
          perl .github/run-check.pl handle-count/build \
            bash research/experiments/handle-count/build.sh \
              --pr "$RUNNER_TEMP/pr/compiler/target/gate/whitefootc" \
              --base "$RUNNER_TEMP/base/compiler/target/gate/whitefootc" \
              --out "$OUT"

      - name: Run the arms
        run: |
          perl .github/run-check.pl handle-count/cells \
            bash research/experiments/handle-count/run.sh --out "$OUT" --bins "$OUT/bin"

      - name: Summarize
        if: always()
        run: |
          test -s "$OUT/raw.tsv" || { echo "no rows were written"; exit 0; }
          flag=
          if [ "$MODE" = pilot ]; then flag=--pilot; fi
          status=0
          python3 -B research/experiments/handle-count/summarize.py $flag "$OUT/raw.tsv" > "$OUT/summary.txt" || status=$?
          cat "$OUT/summary.txt"
          {
            echo "## handle-count ($MODE)"
            echo
            echo '```text'
            cat "$OUT/host.txt" 2>/dev/null
            echo
            cat "$OUT/summary.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # A FAIL or VOID verdict is a result, not a broken run.
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: handle-count-${{ inputs.mode }}-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/handle-count/raw.tsv
            ${{ runner.temp }}/handle-count/summary.txt
            ${{ runner.temp }}/handle-count/host.txt
            ${{ runner.temp }}/handle-count/runs/
            ${{ runner.temp }}/handle-count/ll/

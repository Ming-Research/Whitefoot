# Temporary (coord-wfbl-04-03): run only the package-fixture cases under the
# gate's toolchain, to choose a stack-exhaustion witness. Removed before the
# branch is ready.
name: tmp-package-fixtures
on:
  push:
    paths:
      - .github/workflows/tmp-package-fixtures.yml
permissions:
  contents: read
jobs:
  fixtures:
    name: fixtures (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v4
      - name: Install the host toolchain
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
            version=$(tr -d '[:space:]' < .github/llvm-major)
            sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
            sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
            sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
            sudo sysctl -w kernel.core_pattern=core
          fi
          /usr/bin/clang --version
          rustup default stable
          cargo fetch --locked --manifest-path compiler/Cargo.toml
      - name: Run the fixture cases
        run: |
          perl .github/run-check.pl tmp-package-fixtures cargo test --manifest-path compiler/Cargo.toml --profile gate --locked --offline --test corpus -- --nocapture package_fixtures tmp_fixture_variants

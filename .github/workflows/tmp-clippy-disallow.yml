# Temporary quick check for the clippy disallowed-methods rule. Removed before the branch is ready.
name: tmp clippy disallow check

on:
  push:
    branches: [coord-wfbl-10-06]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install the host toolchain
        run: |
          rustup default stable
          rustup component add clippy
          cargo --version

      - name: Fetch locked compiler dependencies
        run: cargo fetch --locked --manifest-path compiler/Cargo.toml

      - name: Clippy on the real tree must pass
        run: perl .github/run-check.pl clippy-real cargo clippy --manifest-path compiler/Cargo.toml --all-targets --locked --offline -- -D warnings

      - name: A new unbounded spawn must be refused
        run: |
          printf '%s\n' '#[cfg(test)]' '#[allow(dead_code)]' 'fn tmp_probe_unbounded() {' '    let _ = std::process::Command::new("true").output();' '    let _ = std::process::Command::new("true").status();' '    let _ = std::process::Command::new("true").spawn();' '}' >> compiler/src/toolchain.rs
          set +e
          cargo clippy --manifest-path compiler/Cargo.toml --all-targets --locked --offline -- -D warnings > probe.log 2>&1
          code=$?
          set -e
          cat probe.log | tail -n 40
          test "$code" -ne 0
          test "$(grep -c 'disallowed_methods\|disallowed method' probe.log)" -ge 3

# Temporary probe of the inputs of compiler-compare.yml on a hosted runner
# (wf-compiler-compare-14900k); removed before the full check.
name: tmp-compiler-compare-probe

on:
  push:
    branches: [wf-compiler-compare-14900k]

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install the host toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          rustup default stable
          which perf || echo "no perf"
          cat /proc/sys/kernel/perf_event_paranoid || true
          uname -r

      - name: Build the compiler
        env:
          WHITEFOOT_CHECK_TIMEOUT: "3000"
        run: |
          cargo fetch --locked --manifest-path compiler/Cargo.toml
          perl .github/run-check.pl probe/build make -C compiler build
          ls -l compiler/target/gate/whitefootc

      - name: Fetch Halo at its port to the newer prelude and Silverfir-nano
        run: |
          set -x
          mkdir -p "$RUNNER_TEMP/p"
          rev=df3eb9ec00f4d7db992e82b6d8ab35f8a643a317
          git clone --quiet https://github.com/Ming-Research/Halo-wf.git "$RUNNER_TEMP/p/halo"
          git -C "$RUNNER_TEMP/p/halo" checkout --quiet "$rev"
          git -C "$RUNNER_TEMP/p/halo" log -1 --format='%H %ci %s'
          cat "$RUNNER_TEMP/p/halo/whitefoot.pin"
          ls "$RUNNER_TEMP/p/halo/tests/halo-bench" "$RUNNER_TEMP/p/halo/research/experiments/halo-bench" || true
          git clone --quiet https://github.com/mbbill/Silverfir-nano "$RUNNER_TEMP/p/silverfir"
          git -C "$RUNNER_TEMP/p/silverfir" checkout --quiet 5f248e4420102356be7edadbdb4db2ae105d3270
          git -C "$RUNNER_TEMP/p/silverfir" rev-parse HEAD:benchmarks/wasi/coremark/coremark.wasm

      - name: Compile Halo with the compiler
        continue-on-error: true
        run: |
          wfc=$PWD/compiler/target/gate/whitefootc
          d="$RUNNER_TEMP/p/halo"
          graph=tests/halo-bench/modules.wfg
          [ -f "$d/$graph" ] || graph=research/experiments/halo-bench/modules.wfg
          echo "graph $graph"
          cd "$d"
          time "$wfc" --graph "$graph" --entry bench --full-lto -o "$RUNNER_TEMP/p/halo-image" 2>&1 | tail -40

      - name: Run fib on the Halo image
        continue-on-error: true
        run: |
          fib="$RUNNER_TEMP/p/halo/research/experiments/halo-bench/kernels/fib.lua"
          grep -n '^local N' "$fib"
          for n in 27 32; do
            sed -E "s/^local N = [0-9]+$/local N = $n/" "$fib" > "$RUNNER_TEMP/p/fib.lua"
            echo "== fib($n)"
            ( time taskset -c 1 "$RUNNER_TEMP/p/halo-image" < "$RUNNER_TEMP/p/fib.lua" ) 2>&1 | tail -6
          done

      - name: Compile v2h (as generated, then with the reserved field renamed)
        continue-on-error: true
        run: |
          wfc=$PWD/compiler/target/gate/whitefootc
          python3 -B research/experiments/match-dispatch/wasm/gen.py "$RUNNER_TEMP/p/v2h.wf"
          grep -c '\bheld\b' "$RUNNER_TEMP/p/v2h.wf" || true
          grep -n '\bheld\b' research/experiments/match-dispatch/wasm/*.py research/experiments/match-dispatch/wasm/*.wf | head -20
          sed -E 's/\bheld\b/held_at/g' "$RUNNER_TEMP/p/v2h.wf" > "$RUNNER_TEMP/p/v2h-renamed.wf"
          ( time "$wfc" "$RUNNER_TEMP/p/v2h-renamed.wf" --cache "$RUNNER_TEMP/p/v2h-cache" -o "$RUNNER_TEMP/p/v2h-image" ) 2>&1 | cut -c1-400 | head -80

      - name: Perf availability
        continue-on-error: true
        run: |
          perf stat -x, -e instructions:u,cycles:u -- true 2>&1 | head
          ls /sys/bus/event_source/devices/ || true

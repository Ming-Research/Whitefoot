# Temporary (one-object-core): the gate's four correctness groups on Linux for
# the one-object atomic statement, which a draft pull request's gate skips,
# and the new tests watched failing on the code they guard against. Removed
# before the full check.
name: tmp-one-object

on:
  push:
    branches: [one-object-core]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0

jobs:
  group:
    name: ${{ matrix.stage }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        stage: [static, unit, corpus, runtime]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Set the scratch root
        run: echo "WHITEFOOT_SCRATCH_ROOT=$RUNNER_TEMP/whitefoot" >> "$GITHUB_ENV"

      - name: Name main as a local ref
        run: |
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          git branch -f main origin/main

      - name: Select the design review base
        if: matrix.stage == 'static'
        run: echo "DESIGN_REVIEW_BASE=$(git merge-base main HEAD)" >> "$GITHUB_ENV"

      - name: Install the host toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          rustup default stable
          rustup component add clippy rustfmt
          cargo --version

      - name: Fetch locked compiler dependencies
        run: cargo fetch --locked --manifest-path compiler/Cargo.toml

      - name: Decline core dumps
        run: sudo sysctl -w kernel.core_pattern=core

      - name: ${{ matrix.stage }}
        env:
          WHITEFOOT_CHECK_TIMEOUT: 2400
        run: make check-group GROUP="${{ matrix.stage }}"

      # The group's log can be cut short; the grammar pins' own run prints
      # every expected and found count on its own.
      - name: grammar pins
        if: always() && matrix.stage == 'unit'
        run: perl .github/run-check.pl tmp/grammar cargo test --manifest-path compiler/Cargo.toml --profile gate --locked --offline --lib syntax::grammar::tests -- --test-threads=1

  watch-fail:
    name: watch-fail
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Set the scratch root
        run: echo "WHITEFOOT_SCRATCH_ROOT=$RUNNER_TEMP/whitefoot" >> "$GITHUB_ENV"

      - name: Install the host toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          rustup default stable
          cargo --version

      - name: Fetch locked compiler dependencies
        run: cargo fetch --locked --manifest-path compiler/Cargo.toml

      # A checker that judges a rebound binding's leaving edge as before: the
      # affine rebound-binding case must be accepted, and the pinned repair
      # test must fail at the pair that rebinds its binding.
      - name: rebound-binding rule switched off
        run: |
          sed -i 's/^            if let Some(rebound) = &rebound {$/            if let Some(rebound) = rebound.as_ref().filter(|_| false) {/' compiler/src/semantic/entailment/flow/walk.rs
          grep -n 'rebound.as_ref().filter(|_| false)' compiler/src/semantic/entailment/flow/walk.rs
          perl .github/run-check.pl tmp/watch-build cargo build --manifest-path compiler/Cargo.toml --profile gate --locked --offline --bin whitefootc
          set +e
          compiler/target/gate/whitefootc --check tests/conformance/cases/type11-neg-atomic-rebound-binder.wf
          case_status=$?
          perl .github/run-check.pl tmp/watch-repairs cargo test --manifest-path compiler/Cargo.toml --profile gate --locked --offline --lib driver::pinned_repairs::each_pinned_repair_is_carried_out_by_its_programs > "$RUNNER_TEMP/repairs.log" 2>&1
          repairs_status=$?
          set -e
          cat "$RUNNER_TEMP/repairs.log"
          echo "the affine case's check exits $case_status; the pinned repair test exits $repairs_status"
          test "$case_status" -eq 0
          test "$repairs_status" -ne 0
          grep -n 'atomic-block-rebinds-its-binding.wf' "$RUNNER_TEMP/repairs.log"

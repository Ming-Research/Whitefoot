# Temporary (one-object-core): the gate's four correctness groups on Linux for
# the one-object atomic statement, which a draft pull request's gate skips,
# and the new tests watched failing on the code they guard against. Removed
# before the full check.
name: tmp-one-object

on:
  push:
    branches: [one-object-core]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0

jobs:
  group:
    name: ${{ matrix.stage }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        stage: [static, unit, corpus, runtime]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Set the scratch root
        run: echo "WHITEFOOT_SCRATCH_ROOT=$RUNNER_TEMP/whitefoot" >> "$GITHUB_ENV"

      - name: Name main as a local ref
        run: |
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          git branch -f main origin/main

      - name: Select the design review base
        if: matrix.stage == 'static'
        run: echo "DESIGN_REVIEW_BASE=$(git merge-base main HEAD)" >> "$GITHUB_ENV"

      - name: Install the host toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          rustup default stable
          rustup component add clippy rustfmt
          cargo --version

      - name: Fetch locked compiler dependencies
        run: cargo fetch --locked --manifest-path compiler/Cargo.toml

      - name: Decline core dumps
        run: sudo sysctl -w kernel.core_pattern=core

      - name: ${{ matrix.stage }}
        env:
          WHITEFOOT_CHECK_TIMEOUT: 2400
        run: make check-group GROUP="${{ matrix.stage }}"

      # The group's log can be cut short; the grammar pins' own run prints
      # every expected and found count on its own.
      - name: grammar pins
        if: always() && matrix.stage == 'unit'
        run: perl .github/run-check.pl tmp/grammar cargo test --manifest-path compiler/Cargo.toml --profile gate --locked --offline --lib syntax::grammar::tests -- --test-threads=1

  watch-fail:
    name: watch-fail
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Set the scratch root
        run: echo "WHITEFOOT_SCRATCH_ROOT=$RUNNER_TEMP/whitefoot" >> "$GITHUB_ENV"

      - name: Install the host toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          rustup default stable
          cargo --version

      - name: Fetch locked compiler dependencies
        run: cargo fetch --locked --manifest-path compiler/Cargo.toml

      # A checker that leaves a loop's range invariant out of the statement's
      # invariants: the ledger test must fail and name the loop range
      # invariant witness alone, since each other witness sets the statement's
      # flag another way.
      - name: ledger test without the loop range invariant branch
        run: |
          sed -i '/^                || loops\.get(id)\.is_some_and(|range| !range\.invariants\.is_empty())$/d' compiler/src/semantic/check/control/atomic.rs
          if grep -n 'loops.get(id)' compiler/src/semantic/check/control/atomic.rs; then exit 1; fi
          set +e
          perl .github/run-check.pl tmp/watch-ledger cargo test --manifest-path compiler/Cargo.toml --profile gate --locked --offline --lib lock_ledger_takes_every_unit_whole_for_an_invariant_the_checking_uses > "$RUNNER_TEMP/ledger.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/ledger.log"
          echo "the ledger test exits $status"
          test "$status" -ne 0
          grep -n '"a loop range invariant: ' "$RUNNER_TEMP/ledger.log"
          if grep -nE '"(an affine type invariant|a range type invariant|a local invariant|a loop affine invariant): ' "$RUNNER_TEMP/ledger.log"; then exit 1; fi

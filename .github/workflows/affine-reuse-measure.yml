# Temporary, explicitly requested AUTO failure-reuse experiment; not a gate.
# Remove this workflow after measurement, before the branch is marked ready.
name: affine-reuse-measure

on:
  push:
    branches: [claude/affine-failed-reuse]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: affine-reuse-measure-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_GATE_DEBUG: line-tables-only
  CARGO_PROFILE_GATE_STRIP: none
  HALO_REVISION: 80f0ee4
  WHITEFOOT_CHECK_TIMEOUT: 1800

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve identical-source comparison and prepare worktrees
        run: |
          out="$RUNNER_TEMP/affine-reuse"
          mkdir -p "$out"
          printf 'WHITEFOOT_TIME_BUDGET_RECORD=%s/time-budget-overruns.txt\n' "$out" >> "$GITHUB_ENV"
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          base=$(git merge-base origin/main HEAD)
          head=$(git rev-parse HEAD)
          printf 'BASE_REVISION=%s\nHEAD_REVISION=%s\n' "$base" "$head" >> "$GITHUB_ENV"
          rustup default stable
          git worktree add --detach "$RUNNER_TEMP/base" "$base"
          git worktree add --detach "$RUNNER_TEMP/head" "$head"
          for which in base head; do
            cargo fetch --locked --manifest-path "$RUNNER_TEMP/$which/compiler/Cargo.toml" > "$out/$which-fetch.log" 2>&1
            cp "$RUNNER_TEMP/$which/compiler/src/semantic/entailment/work.rs" "$out/$which-work-schema.rs"
          done
          {
            uname -a
            lscpu
            rustc --version --verbose
            cargo --version
            printf 'base=%s\nhead=%s\nprofile=gate\ndebug=line-tables-only\nstrip=none\n' "$base" "$head"
            printf 'command=whitefootc --graph lib/halo/modules.wfg --check-module pkg::vm\n'
          } > "$out/metadata.txt" 2>&1
      - name: Build both compilers with identical profiles
        run: |
          out="$RUNNER_TEMP/affine-reuse"
          for which in base head; do
            perl .github/run-check.pl "affine-reuse-build-$which" \
              cargo build --manifest-path "$RUNNER_TEMP/$which/compiler/Cargo.toml" \
              --profile gate --locked --offline --bin whitefootc \
              > "$out/$which-build.log" 2>&1 || { cat "$out/$which-build.log"; exit 1; }
            sha256sum "$RUNNER_TEMP/$which/compiler/target/gate/whitefootc" >> "$out/metadata.txt"
          done
      - name: Fetch the same pinned Halo source for both compilers
        run: |
          out="$RUNNER_TEMP/affine-reuse"
          git clone --quiet https://github.com/Ming-Research/Halo-wf.git "$RUNNER_TEMP/halo" > "$out/halo-fetch.log" 2>&1
          git -C "$RUNNER_TEMP/halo" checkout --quiet --detach "$HALO_REVISION"
          printf 'halo=%s\n' "$(git -C "$RUNNER_TEMP/halo" rev-parse HEAD)" >> "$out/metadata.txt"
      - name: Three interleaved uninstrumented checks per compiler
        run: |
          unset WHITEFOOT_CHECK_WORK
          out="$RUNNER_TEMP/affine-reuse"
          printf 'round\twhich\twall_s\tuser_s\tsys_s\n' > "$out/times.tsv"
          cd "$RUNNER_TEMP/halo"
          for round in 1 2 3; do
            order='base head'
            if [ "$round" = 2 ]; then order='head base'; fi
            for which in $order; do
              label="$which-$round"
              status=0
              perl "$GITHUB_WORKSPACE/.github/run-check.pl" affine-reuse-check \
                /usr/bin/time -q -f '%e %U %S' -o "$out/$label.time" \
                "$RUNNER_TEMP/$which/compiler/target/gate/whitefootc" \
                --graph lib/halo/modules.wfg --check-module pkg::vm \
                > "$out/$label.log" 2>&1 || status=$?
              printf '%s\n' "$status" > "$out/$label.status"
              if [ "$status" -ne 0 ]; then cat "$out/$label.log"; exit "$status"; fi
              read -r wall user sys < "$out/$label.time"
              printf '%s\t%s\t%s\t%s\t%s\n' "$round" "$which" "$wall" "$user" "$sys" >> "$out/times.tsv"
            done
          done
          cat "$out/times.tsv"
      - name: Collect one work-counter run per compiler separately from timings
        run: |
          out="$RUNNER_TEMP/affine-reuse"
          cd "$RUNNER_TEMP/halo"
          for which in base head; do
            status=0
            perl "$GITHUB_WORKSPACE/.github/run-check.pl" affine-reuse-counters \
              /usr/bin/time -q -f '%e %U %S' -o "$out/$which-counters.time" \
              env WHITEFOOT_CHECK_WORK="$out/$which-work.tsv" \
              "$RUNNER_TEMP/$which/compiler/target/gate/whitefootc" \
              --graph lib/halo/modules.wfg --check-module pkg::vm \
              > "$out/$which-counters.log" 2>&1 || status=$?
            printf '%s\n' "$status" > "$out/$which-counters.status"
            if [ "$status" -ne 0 ]; then cat "$out/$which-counters.log"; exit "$status"; fi
            test -s "$out/$which-work.tsv"
            if grep -q 'checker work output' "$out/$which-counters.log"; then
              cat "$out/$which-counters.log"
              exit 1
            fi
          done
      - name: Validate evidence and report paired CPU ratio and work differences
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          python3 - <<'PY'
          import collections, csv, io, math, os, pathlib, statistics

          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'affine-reuse'
          out.mkdir(exist_ok=True)
          lines = ['## AUTO failed-query reuse on Halo VM', '',
                   f"Earlier steps: {os.environ['JOB_STATUS']}. Base `{os.environ.get('BASE_REVISION', 'unresolved')}`; head `{os.environ.get('HEAD_REVISION', 'unresolved')}`.",
                   'Hosted Ubuntu 24.04; same pinned Halo source and compiler build settings. Three uninstrumented rounds alternate order; work counters use one separate run per compiler. The head counter run also observes the bounded shadow countermodel probe; the six timing runs leave it disabled.',
                   'CPU ratios are exploratory hosted-runner observations, not a performance gate or a measurement on the 14900K.', '']
          errors = [] if os.environ['JOB_STATUS'] == 'success' else ['An earlier measurement step failed']
          reuse = 'affine_failed_reuse_hits'
          observed = {
              'affine_auto_calls_initial', 'affine_auto_calls_bridge', 'affine_auto_calls_other',
              'affine_direct_initial', 'affine_direct_single', 'affine_direct_pair',
              'affine_direct_final_l0', 'affine_direct_other', 'affine_tightenings_formed',
              'affine_overflow_pair', 'affine_overflow_tightening', 'affine_overflow_residual',
              'affine_overflow_residual_bound_up', 'affine_overflow_residual_bound_down',
              'affine_overflow_direct', 'affine_overflow_bridge', 'affine_overflow_index',
              'affine_interval_construction_probes', 'affine_interval_warm_probes',
              'affine_shadow_groups', 'affine_shadow_would_certify', 'affine_shadow_rejected',
              'affine_shadow_unknown', 'affine_shadow_group_cutoffs', 'affine_shadow_function_cutoffs',
              'affine_shadow_assignments', 'affine_shadow_operations',
              'affine_shadow_bridge_calls', 'affine_shadow_final_exhaustions'}
          additive = observed | {reuse}
          expected = {
              'function': {'joins', 'join_passes', 'intern_calls', 'closure_cache_hits',
                           'affine_attempts', 'affine_memo_hits', 'affine_memo_misses',
                           'affine_cold_demands', 'affine_left_candidates_scanned', 'affine_promotions',
                           'affine_final_family_starts', 'affine_final_family_exhaustions'},
              'snapshot': {'count', 'rows_sum', 'rows_max', 'cells_sum', 'cells_max'},
              'closure': {'count', 'rows_sum', 'rows_max', 'cells_sum', 'cells_max'},
              'probe': {'count', 'rows_sum', 'rows_max', 'cells_sum', 'cells_max'},
              'join': {'join', 'inputs', 'union_rows', 'pairs_evaluated', 'pairs_retained',
                       'parent_references', 'intern_calls'}}

          def require(condition, message):
              if not condition: raise ValueError(message)

          def accepted(statuses):
              require(len(statuses) == 8 and all(s == 0 for s in statuses),
                      'Need identical successful verdicts from all six timed and two counter runs')

          def verdict_text(log):
              # publish_verdicts renders the checked module's qualified name.
              # Wrapper/timer lines have other prefixes and are excluded.
              found = [line for line in log.splitlines() if line.startswith('pkg::vm:')]
              require(len(found) == 1, 'Need exactly one pkg::vm verdict line per run')
              verdict = found[0]
              pending_prefix = 'pkg::vm: accepted, pending '
              require(verdict == 'pkg::vm: accepted' or
                      (verdict.startswith(pending_prefix) and bool(verdict[len(pending_prefix):])),
                      'Expected an accepted module verdict')
              return verdict

          def same_verdicts(verdicts):
              require(len(verdicts) == 8 and len(set(verdicts)) == 1,
                      'Module verdict text or pending-contract list changed between runs')

          def parse_counters(text, additions):
              require(set(additions) <= additive, 'Unknown additive counter schema')
              schema = {kind: metrics.copy() for kind, metrics in expected.items()}
              schema['function'].update(additions)
              runs = collections.defaultdict(dict)
              for row in csv.reader(io.StringIO(text), delimiter='\t'):
                  require(len(row) == 7, 'Counter row must have seven fields')
                  pid, run, name, kind, raw_ordinal, metric, raw = row
                  ordinal, value = int(raw_ordinal), int(raw)
                  require(pid.isdecimal() and run.isdecimal() and bool(name), 'Invalid invocation identity')
                  require(ordinal >= 0 and 0 <= value < 2**64 - 1, 'Invalid or saturated counter')
                  require(kind in schema and metric in schema[kind], f'Unexpected counter {kind}.{metric}')
                  key = kind, ordinal, metric
                  bucket = runs[pid, run, name]
                  require(key not in bucket, 'Duplicate counter row')
                  bucket[key] = value
              require(bool(runs), 'Missing counter invocations')
              counts, data = collections.Counter(), collections.defaultdict(dict)
              for (_, _, name), run in runs.items():
                  counts[name] += 1
                  for kind in ('function', 'snapshot', 'closure', 'probe'):
                      require({(o, m) for k, o, m in run if k == kind} == {(0, m) for m in schema[kind]},
                              f'Incomplete {kind} counters')
                  passes = run['function', 0, 'join_passes']
                  ordinals = {o for k, o, m in run if k == 'join'}
                  require(len(ordinals) == passes and all(0 <= o < passes for o in ordinals), 'Missing join passes')
                  for ordinal in ordinals:
                      require({m for k, o, m in run if k == 'join' and o == ordinal} == schema['join'],
                              'Incomplete join counters')
                  for (kind, ordinal, metric), value in run.items():
                      if kind == 'join' and metric in ('join', 'intern_calls'): continue
                      key = f'{kind}.{metric}'
                      previous = data[name].get(key, 0)
                      data[name][key] = max(previous, value) if metric.endswith('_max') else previous + value
                  # Only known additive metrics proved absent from the recorded
                  # source are represented as zero; missing emitted rows fail above.
                  for metric in additive - set(additions):
                      data[name][f'function.{metric}'] = 0
              return data, counts

          def require_run(data):
              require('run' in data, 'Head counter run lacks the Halo run function')
              return data['run']

          def pairs(rows):
              require(len(rows) == 6, 'Need exactly three paired timing rounds')
              result = collections.defaultdict(dict)
              for row in rows:
                  round_, which = int(row['round']), row['which']
                  require(round_ in (1, 2, 3) and which in ('base', 'head'), 'Invalid timing identity')
                  require(which not in result[round_], 'Duplicate timing observation')
                  values = [float(row[k]) for k in ('wall_s', 'user_s', 'sys_s')]
                  require(all(math.isfinite(v) and v >= 0 for v in values), 'Invalid timing value')
                  require(values[1] + values[2] > 0, 'CPU time must be positive')
                  result[round_][which] = values
              require(set(result) == {1, 2, 3} and all(set(p) == {'base', 'head'} for p in result.values()),
                      'Incomplete timing pairs')
              return result

          def expect_invalid(action):
              try: action()
              except ValueError: return
              raise ValueError('Evidence validator accepted deliberately invalid input')

          # These hosted self-checks show that missing metrics/inputs and wrong
          # verdicts fail, instead of merely demonstrating successful parsing.
          fixture = '\n'.join(f'1\t0\twitness\t{k}\t0\t{m}\t0'
                              for k, metrics in expected.items() if k != 'join' for m in sorted(metrics)) + '\n'
          head_fixture = fixture.replace('witness', 'run') + ''.join(
              f'1\t0\trun\tfunction\t0\t{metric}\t0\n' for metric in sorted(additive))
          parse_counters(fixture, set())
          parsed_head, _ = parse_counters(head_fixture, additive)
          require_run(parsed_head)
          expect_invalid(lambda: parse_counters('', set()))
          for metric in sorted(additive):
              missing = '\n'.join(row for row in head_fixture.splitlines() if f'\t{metric}\t' not in row)
              expect_invalid(lambda: parse_counters(missing, additive))
          expect_invalid(lambda: require_run(parse_counters(head_fixture.replace('\trun\t', '\twitness\t'), additive)[0]))
          expect_invalid(lambda: parse_counters(head_fixture + '1\t0\trun\tfunction\t0\tunknown_metric\t0\n', additive))
          expect_invalid(lambda: parse_counters('\n'.join(r for r in fixture.splitlines() if '\taffine_attempts\t' not in r), set()))
          expect_invalid(lambda: accepted([0] * 7 + [1]))
          expect_invalid(lambda: accepted([0] * 7))
          same_verdicts(['pkg::vm: accepted'] * 8)
          verdict_text('== START wrapper ==\npkg::vm: accepted, pending witness\nreal 1.0\n')
          # Both statuses would be zero; differing pending contracts still fail.
          expect_invalid(lambda: same_verdicts(['pkg::vm: accepted'] * 7 + ['pkg::vm: accepted, pending witness']))
          expect_invalid(lambda: verdict_text('real 1.0\n'))
          expect_invalid(lambda: verdict_text('pkg::vm: accepted\npkg::vm: accepted\n'))
          expect_invalid(lambda: pairs([]))
          lines.append('Evidence validators reject missing counter input, each missing additive metric, an absent Halo run function, unknown metrics, incomplete timings, a changed or missing status, and changed pending contracts even when both statuses are zero.\n')

          def table(title, headers, rows):
              lines.extend([f'### {title}', '', '| ' + ' | '.join(headers) + ' |',
                            '| ' + ' | '.join(['---'] * len(headers)) + ' |'])
              lines.extend('| ' + ' | '.join(str(v).replace('|', '\\|') for v in row) + ' |' for row in rows)
              lines.append('')

          def write_tsv(name, headers, rows):
              with (out / name).open('w') as f:
                  writer = csv.writer(f, delimiter='\t')
                  writer.writerow(headers)
                  writer.writerows(rows)

          def section(action):
              try: action()
              except (OSError, ValueError, KeyError) as error:
                  errors.append(str(error))
                  lines.extend([f'Unavailable or invalid evidence: {error}', ''])

          def verdicts():
              labels = [f'{which}-{round_}' for round_ in (1, 2, 3) for which in ('base', 'head')]
              labels += [f'{which}-counters' for which in ('base', 'head')]
              accepted([int((out / f'{label}.status').read_text().strip()) for label in labels])
              texts = [verdict_text((out / f'{label}.log').read_text()) for label in labels]
              same_verdicts(texts)
              write_tsv('verdicts.tsv', ['run', 'status', 'verdict'], [[label, 0, text] for label, text in zip(labels, texts)])
              lines.append(f'Check verdict is identical across all eight runs, including the pending-contract list: `{texts[0]}` (exit status 0).\n')

          def timings():
              with (out / 'times.tsv').open() as f:
                  rows = list(csv.DictReader(f, delimiter='\t'))
              paired = pairs(rows)
              ratios = [sum(p['head'][1:]) / sum(p['base'][1:]) for p in paired.values()]
              table('Uninstrumented timing', ['Round', 'Base CPU s', 'Head CPU s', 'CPU head/base'],
                    [[round_, f"{sum(p['base'][1:]):.3f}", f"{sum(p['head'][1:]):.3f}",
                      f"{sum(p['head'][1:]) / sum(p['base'][1:]):.3f}"] for round_, p in sorted(paired.items())])
              table('Median timing', ['Compiler', 'Wall s', 'User + system s'],
                    [[which, f'{statistics.median(p[which][0] for p in paired.values()):.3f}',
                      f'{statistics.median(sum(p[which][1:]) for p in paired.values()):.3f}'] for which in ('base', 'head')])
              lines.append(f'Median paired CPU ratio head/base: **{statistics.median(ratios):.3f}**; range {min(ratios):.3f}–{max(ratios):.3f}.\n')

          def counters():
              results, invocations = {}, {}
              for which in ('base', 'head'):
                  source = (out / f'{which}-work-schema.rs').read_text()
                  additions = {metric for metric in additive if f'"{metric}"' in source}
                  require(which != 'head' or additions == additive,
                          'Head source lacks required AUTO observation counters')
                  results[which], invocations[which] = parse_counters((out / f'{which}-work.tsv').read_text(), additions)
                  absent = sorted(additive - additions)
                  if absent:
                      lines.append('Recorded ' + which + ' source lacks these additive metrics; only these absent fields are deliberately reported as zero, not measured zero: ' + ', '.join(f'`{m}`' for m in absent) + '.\n')
              run_work = require_run(results['head'])
              run_rows = [[metric, run_work[f'function.{metric}']] for metric in sorted(observed)]
              write_tsv('work-run-observations.tsv', ['metric', 'head'], run_rows)
              table('Head AUTO observations for Halo run', ['Metric', 'Head count'], run_rows)
              lines.append(f"The run table sums all {invocations['head']['run']} head analysis invocations of the exact function name `run`; individual invocation IDs remain in head-work.tsv. The shadow probe is counter-only: three fixed assignments (clamped zero, minimum, maximum), at most 100,000 validation operations per group and 2,000,000 per function invocation. Cutoffs make observed certification coverage a lower bound.\n")
              coverage = []
              for label, numerator, denominator in (
                  ('Groups certified', 'affine_shadow_would_certify', 'affine_shadow_groups'),
                  ('Bridge AUTO calls inside certified groups', 'affine_shadow_bridge_calls', 'affine_auto_calls_bridge'),
                  ('Certified-group bridge exhaustions / all AUTO exhaustions', 'affine_shadow_final_exhaustions', 'affine_final_family_exhaustions')):
                  n, d = run_work[f'function.{numerator}'], run_work[f'function.{denominator}']
                  coverage.append([label, n, d, f'{100 * n / d:.2f}%' if d else 'not observed'])
              table('Shadow countermodel coverage in Halo run', ['Observed subset', 'Subset count', 'All count', 'Share'], coverage)
              lines.append('Low certified bridge-call or exhaustion coverage is evidence against this fixed assignment set only when probe coverage is complete or adequate; many unknown outcomes or group/function cutoffs leave an inconclusive lower bound. The exhaustion denominator includes initial and other AUTO queries as well as Step-6 bridges. affine_shadow_operations counts validation work, not CPU cost: these counters cannot establish net savings, and a future CI cost attribution must determine whether validation consumes the covered search cost.\n')
              names = results['base'].keys() | results['head'].keys()
              metrics = sorted({m for side in results.values() for fn in side.values() for m in fn})
              totals, differences = [], []
              for metric in metrics:
                  values = []
                  for which in ('base', 'head'):
                      measured = [f[metric] for f in results[which].values() if metric in f]
                      values.append(max(measured, default=0) if metric.endswith('_max') else sum(measured))
                  totals.append([metric, *values, values[1] - values[0]])
                  for name in sorted(names):
                      a = results['base'].get(name, {}).get(metric, 0)
                      b = results['head'].get(name, {}).get(metric, 0)
                      differences.append([name, metric, a, b, b - a, invocations['base'][name], invocations['head'][name]])
              differences.sort(key=lambda row: abs(row[4]), reverse=True)
              write_tsv('work-totals.tsv', ['metric', 'base', 'head', 'head_minus_base'], totals)
              write_tsv('work-function-diff.tsv', ['function', 'metric', 'base', 'head', 'head_minus_base', 'base_invocations', 'head_invocations'], differences)
              table('Work totals (max metrics are maxima; all other metrics are sums)', ['Metric', 'Base', 'Head', 'Head − base'], totals)
              table('Largest per-function work differences', ['Function', 'Metric', 'Base', 'Head', 'Delta', 'Base analyses', 'Head analyses'], differences[:40])
              lines.append('Functions analyzed on only one side contribute zero on the other side; invocation counts are retained in the complete per-function artifact.\n')

          for action in (verdicts, timings, counters): section(action)
          lines.append('Raw timing/counter logs, exit statuses, full compiler and Halo identities, recorded counter schemas and complete counter deltas are in the artifact.')
          lines.append('Temporary stages have initial 1800 s ceilings matching the experiment timeout, not sample-derived budgets. Remove their budget rows with this workflow; derive budgets from samples if the stages are retained.')
          text = '\n'.join(lines) + '\n'
          (out / 'summary.md').write_text(text)
          print(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f: f.write(text)
          if errors: raise SystemExit('Incomplete measurement: ' + '; '.join(errors))
          PY
      - name: Hold temporary experiment stages to their initial ceilings
        if: always() && env.WHITEFOOT_TIME_BUDGET_RECORD != ''
        run: perl .github/run-check.pl --budget-verdict "$WHITEFOOT_TIME_BUDGET_RECORD"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: affine-reuse-measure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/affine-reuse/
          if-no-files-found: warn

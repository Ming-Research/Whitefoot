# Temporary: .github/test-run-check.sh traced, on the self-hosted runner that
# the fast workflow's static job uses, under the wrapper as that job runs it.
# Runs on the pushes the wf-agents engine makes of this work's commits (the
# `wf-try/work-298-26e0fade/` refs). Removed before the full check (AGENTS.md,
# "Checks").
name: tmp-w298-static-host

on:
  push:
    branches: ['wf-try/work-298-26e0fade/**']

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, 14900k]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: false
          persist-credentials: false

      - name: Clear what the last run left
        run: git clean -ffdxq -e /compiler/target/

      - name: The host's tools
        run: |
          uname -a
          grep PRETTY_NAME /etc/os-release || true
          ls -l /bin/sh /usr/bin/awk /usr/bin/bash 2>&1 || true
          (awk --version 2>&1 || awk -W version 2>&1) | head -2 || true
          bash --version | head -1
          perl -v | sed -n 2p
          echo "TMPDIR=${TMPDIR:-unset} RUNNER_TEMP=$RUNNER_TEMP"

      - name: The test under the wrapper, traced
        env:
          WHITEFOOT_CHECK_TIMEOUT: 900
        run: |
          export WHITEFOOT_SCRATCH_ROOT="$RUNNER_TEMP/whitefoot"
          export WHITEFOOT_CHECK_LOCK_DIR="$RUNNER_TEMP/check-lock"
          status=0
          perl .github/run-check.pl check/static sh -c 'sh -x .github/test-run-check.sh > "$1" 2>&1' sh "$RUNNER_TEMP/trace.log" || status=$?
          echo "test exit $status"
          wc -l "$RUNNER_TEMP/trace.log"
          tail -n 40 "$RUNNER_TEMP/trace.log"
          exit 0

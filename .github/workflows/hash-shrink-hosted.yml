# TEMPORARY: serves research/experiments/hash-shrink and its preregistration.
# Remove this workflow before the branch is ready; retain the explicit research
# bundle and its evidence only while the investigation needs reproduction.
# research-boundary: manual-only
# Hosted measurements are exploratory. They satisfy no precise idle-14900K
# requirement and no timing ratio changes the canonical correctness gate.
# First dispatch pilot. Inspect its raw durations/spread, then dispatch panel
# with that pilot run ID and selected rounds; a current-host pilot runs again
# before the million-entry scale. Native binaries never cross hosted runs.
# New labels have no measured CPU-model budgets yet. The owner must explicitly
# select allow_unbudgeted_experiment before any experimental stage runs.
# That proposed temporary mode reports wrapper budgets without a verdict record;
# it neither invents measured gate budgets nor establishes readiness. The choice
# is retained in the dispatch artifact. Command/oracle/missing-input failures fail.
name: hash-shrink-hosted

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Small pilot first; panel requires an inspected prior pilot
        type: choice
        options: [pilot, panel]
        default: pilot
      pilot_run_id:
        description: Completed pilot run on this exact source revision; required for panel
        type: string
        default: ""
      rounds:
        description: Panel blocks (library per each of two cohorts; Firn total, at least 4)
        type: string
        default: "6"
      base:
        description: Full baseline commit before automatic shrinking
        type: string
        default: 8f6a273ca53d6d1a2df56a35ab6093ff3a7165b1
      allow_unbudgeted_experiment:
        description: Explicitly allow temporary report-only stage budgets pending measured budget rows
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: hash-shrink-hosted-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
  WHITEFOOT_CHECK_TIMEOUT: "6000"

jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate the dispatch and record the host
        env:
          PHASE: ${{ inputs.phase }}
          PILOT_RUN: ${{ inputs.pilot_run_id }}
          ROUNDS: ${{ inputs.rounds }}
          BASE: ${{ inputs.base }}
          ALLOW_UNBUDGETED: ${{ inputs.allow_unbudgeted_experiment }}
        run: |
          if [ "$ALLOW_UNBUDGETED" != true ]; then
            echo 'New experimental stages lack the measured budgets required by AGENTS.md. Select allow_unbudgeted_experiment only after ruling on the temporary report-only proposal.' >&2
            exit 1
          fi
          [[ "$BASE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ROUNDS" =~ ^[0-9]+$ ]] && (( ROUNDS >= 4 && ROUNDS <= 20 ))
          if [ "$PHASE" = panel ]; then [[ "$PILOT_RUN" =~ ^[0-9]+$ ]]; fi
          mkdir -p "$RUNNER_TEMP/hash-shrink/host"
          {
            date --iso-8601=seconds
            git rev-parse HEAD
            lscpu
            rustc -vV
            cargo --version
            /usr/bin/clang --version
          } > "$RUNNER_TEMP/hash-shrink/host/manifest.txt"
          printf '%s\n' "$PHASE" "$BASE" "$ROUNDS" "$PILOT_RUN" "$ALLOW_UNBUDGETED" > "$RUNNER_TEMP/hash-shrink/host/dispatch.txt"

      - uses: actions/download-artifact@v4
        if: inputs.phase == 'panel'
        with:
          name: hash-shrink-pilot
          path: ${{ runner.temp }}/hash-shrink-prior
          github-token: ${{ github.token }}
          run-id: ${{ inputs.pilot_run_id }}

      - name: Check out the fixed baseline and unchanged Firn sources
        env:
          BASE: ${{ inputs.base }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/hash-shrink-base" "$BASE"
          git clone --no-checkout https://github.com/Ming-Research/Firn-wf.git "$RUNNER_TEMP/hash-shrink-firn-source"
          git -C "$RUNNER_TEMP/hash-shrink-firn-source" checkout --detach c6f6058fb17277d4d44d364a45efad1eae01a22b
          git -C "$RUNNER_TEMP/hash-shrink-firn-source" submodule update --init --recursive
          git -C "$RUNNER_TEMP/hash-shrink-firn-source" rev-parse HEAD > "$RUNNER_TEMP/hash-shrink/host/firn-revision.txt"
          git -C "$RUNNER_TEMP/hash-shrink-firn-source" submodule status --recursive > "$RUNNER_TEMP/hash-shrink/host/firn-submodules.txt"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-hash-shrink-crates-${{ hashFiles('compiler/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-hash-shrink-crates-

      - name: Build both compilers and make the identical-build twin
        run: |
          for tree in "$RUNNER_TEMP/hash-shrink-base" "$GITHUB_WORKSPACE"; do
            cargo fetch --locked --manifest-path "$tree/compiler/Cargo.toml"
            make -C "$tree/compiler" build
          done
          mkdir -p "$RUNNER_TEMP/hash-shrink-twin"
          cp "$RUNNER_TEMP/hash-shrink-base/compiler/target/gate/whitefootc" "$RUNNER_TEMP/hash-shrink-twin/whitefootc"
          cmp "$RUNNER_TEMP/hash-shrink-base/compiler/target/gate/whitefootc" "$RUNNER_TEMP/hash-shrink-twin/whitefootc"

      - name: Emit and link identical library benchmark sources for all three arms
        run: |
          perl .github/run-check.pl hash-shrink/images \
            python3 -B research/experiments/hash-shrink/run.py --phase build \
            --base-root "$RUNNER_TEMP/hash-shrink-base" --head-root "$GITHUB_WORKSPACE" \
            --base-compiler "$RUNNER_TEMP/hash-shrink-base/compiler/target/gate/whitefootc" \
            --twin-compiler "$RUNNER_TEMP/hash-shrink-twin/whitefootc" \
            --head-compiler "$GITHUB_WORKSPACE/compiler/target/gate/whitefootc" \
            --output "$RUNNER_TEMP/hash-shrink/library"

      - name: Small current-host library pilot before scale selection
        run: |
          perl .github/run-check.pl hash-shrink/library-pilot \
            python3 -B research/experiments/hash-shrink/run.py --phase pilot \
            --base-root "$RUNNER_TEMP/hash-shrink-base" --head-root "$GITHUB_WORKSPACE" \
            --base-compiler "$RUNNER_TEMP/hash-shrink-base/compiler/target/gate/whitefootc" \
            --twin-compiler "$RUNNER_TEMP/hash-shrink-twin/whitefootc" \
            --head-compiler "$GITHUB_WORKSPACE/compiler/target/gate/whitefootc" \
            --output "$RUNNER_TEMP/hash-shrink/library" \
            --members 1024 --remaining 128 --requests 32 --rounds 3

      - name: Build unchanged Firn and run the small current-host network pilot
        run: |
          perl .github/run-check.pl hash-shrink/firn-pilot \
            python3 -B research/experiments/hash-shrink/firn.py --phase pilot \
            --firn-root "$RUNNER_TEMP/hash-shrink-firn-source" \
            --base-compiler "$RUNNER_TEMP/hash-shrink-base/compiler/target/gate/whitefootc" \
            --twin-compiler "$RUNNER_TEMP/hash-shrink-twin/whitefootc" \
            --head-compiler "$GITHUB_WORKSPACE/compiler/target/gate/whitefootc" \
            --output "$RUNNER_TEMP/hash-shrink/firn" \
            --members 1024 --remaining 128 --requests 32 --rounds 3

      - name: Qualify each selected maintained shrink condition before and after
        run: |
          perl .github/run-check.pl hash-shrink/before-after \
            python3 -B research/experiments/hash-shrink/qualify.py \
            --base-root "$RUNNER_TEMP/hash-shrink-base" --head-root "$GITHUB_WORKSPACE" \
            --base-compiler "$RUNNER_TEMP/hash-shrink-base/compiler/target/gate/whitefootc" \
            --head-compiler "$GITHUB_WORKSPACE/compiler/target/gate/whitefootc" \
            --output "$RUNNER_TEMP/hash-shrink/qualification"

      - name: Run the selected million-entry library panel
        if: inputs.phase == 'panel'
        env:
          ROUNDS: ${{ inputs.rounds }}
        run: |
          perl .github/run-check.pl hash-shrink/library-panel \
            python3 -B research/experiments/hash-shrink/run.py --phase panel \
            --base-root "$RUNNER_TEMP/hash-shrink-base" --head-root "$GITHUB_WORKSPACE" \
            --base-compiler "$RUNNER_TEMP/hash-shrink-base/compiler/target/gate/whitefootc" \
            --twin-compiler "$RUNNER_TEMP/hash-shrink-twin/whitefootc" \
            --head-compiler "$GITHUB_WORKSPACE/compiler/target/gate/whitefootc" \
            --output "$RUNNER_TEMP/hash-shrink/library" \
            --pilot-evidence "$RUNNER_TEMP/hash-shrink-prior" \
            --members 1000000 --remaining 1000 --requests 100 --rounds "$ROUNDS"

      - name: Run the selected unchanged-source Firn network panel
        if: inputs.phase == 'panel'
        env:
          ROUNDS: ${{ inputs.rounds }}
        run: |
          perl .github/run-check.pl hash-shrink/firn-panel \
            python3 -B research/experiments/hash-shrink/firn.py --phase panel \
            --firn-root "$RUNNER_TEMP/hash-shrink-firn-source" \
            --base-compiler "$RUNNER_TEMP/hash-shrink-base/compiler/target/gate/whitefootc" \
            --twin-compiler "$RUNNER_TEMP/hash-shrink-twin/whitefootc" \
            --head-compiler "$GITHUB_WORKSPACE/compiler/target/gate/whitefootc" \
            --output "$RUNNER_TEMP/hash-shrink/firn" \
            --members 1000000 --remaining 1000 --requests 100 --rounds "$ROUNDS"

      - name: Publish the scope and available pilot/panel summaries
        if: always()
        run: |
          {
            echo '## HashMap shrink hosted exploration'
            echo 'Hosted timings do not establish the preregistered idle-14900K or strict no-slowdown criteria.'
            echo 'Twin: copied identical baseline compiler; each benchmark/server emitted and linked separately on this host.'
            echo 'No native binaries were restored from a prior hosted run. All raw rows, command statuses, identities and LLVM accompany this run.'
            for summary in "$RUNNER_TEMP/hash-shrink/library/"*-summary.json "$RUNNER_TEMP/hash-shrink/firn/"*summary*.json; do
              if [ -f "$summary" ]; then
                echo '```json'
                cat "$summary"
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hash-shrink-${{ inputs.phase }}
          if-no-files-found: error
          path: ${{ runner.temp }}/hash-shrink/

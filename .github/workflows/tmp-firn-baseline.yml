# Temporary (board item enum-route-check-cost); remove before the branch is ready.
# Firn's whole-program check on the final head against the pre-regression main
# (base), in one run: the baseline compiler cannot check the adapted source
# because main gave `Inputs` a `host_paths` field after it, so it checks a copy
# of the adapted source with that one binding removed, and the merged compilers
# (main with the regression, and the branch) check the adapted source. Columns:
# base, a twin of base for the noise, main, branch. Compiler CPU (user + system),
# five interleaved rounds, plus one work-counter run per compiler. The columns
# and what each result shows are written in the study record before the run.
#
# The adapt step first applies the diff of an earlier run's adaptation, then the
# compiler's own mechanical fix for each remaining rejection (OP-5, EFF-2, the
# `held` rename and the missing `Inputs` field), one at a time, with the merged
# compiler.
name: tmp-firn-baseline

on:
  push:
    branches: [claude/enum-route-check-cost]
    paths: [.github/workflows/tmp-firn-baseline.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

concurrency:
  group: tmp-firn-baseline-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
  MAIN_REVISION: 7b11c52fbaaeef66db780e422b7c2e0e3702258e
  WHITEFOOT_CHECK_TIMEOUT: 1800

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Firn whole program, at the revision the 10-13 measurement used.
          - label: firn
            repo: Firn-wf
            rev: b83b67fa0d7b463dbafe5429b013efc04e39076a
            args: --graph firn/modules.wfg --entry firn --check
            base: 7d9118eba
            rounds: 5
            main_rounds: 5
            adapt_max: 400
            adapt_run: '39682072749'
            adapt_artifact: tmp-halo-check-cost-0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare sources and worktrees
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          rustup default stable
          if [ -n "${{ matrix.base }}" ]; then git worktree add --detach "$RUNNER_TEMP/base" "${{ matrix.base }}"; fi
          git worktree add --detach "$RUNNER_TEMP/main" "$MAIN_REVISION"
          git clone --quiet "https://github.com/Ming-Research/${{ matrix.repo }}.git" "$RUNNER_TEMP/halo"
          git -C "$RUNNER_TEMP/halo" checkout --quiet --detach "${{ matrix.rev }}"
          git -C "$RUNNER_TEMP/halo" submodule update --init --quiet
          { printf 'base=%s\nmain=%s\nbranch=%s\nsource=%s\n' "$([ -d "$RUNNER_TEMP/base" ] && git -C "$RUNNER_TEMP/base" rev-parse HEAD)" "$(git -C "$RUNNER_TEMP/main" rev-parse HEAD)" "$(git rev-parse HEAD)" "${{ matrix.rev }}"; lscpu | grep 'Model name'; } | tee "$RUNNER_TEMP/out/identity.txt"
      - name: Build the merged compiler
        run: |
          perl .github/run-check.pl thc-fetch cargo fetch --locked --manifest-path "$GITHUB_WORKSPACE/compiler/Cargo.toml"
          perl .github/run-check.pl compiler/build cargo build --manifest-path "$GITHUB_WORKSPACE/compiler/Cargo.toml" --profile gate --bin whitefootc --locked --offline
      - name: Apply the earlier run's adaptation
        env:
          GH_TOKEN: ${{ github.token }}
          ADAPT_RUN: ${{ matrix.adapt_run }}
          ADAPT_ARTIFACT: ${{ matrix.adapt_artifact }}
        run: |
          dir=$(mktemp -d "$RUNNER_TEMP/earlier.XXXXXX")
          if gh run download "$ADAPT_RUN" --repo "$GITHUB_REPOSITORY" -n "$ADAPT_ARTIFACT" -D "$dir"; then
            git -C "$RUNNER_TEMP/halo" apply --exclude='deps/*' --whitespace=nowarn "$dir/adapt.diff" && echo "applied the earlier diff" || echo "the earlier diff did not apply; adapting from the original source"
          else
            echo "no earlier artifact; adapting from the original source"
          fi
          git -C "$RUNNER_TEMP/halo" status --short | wc -l
      - name: Adapt the source to the merged compiler's OP-5 rule
        id: adapt
        env:
          ARGS: ${{ matrix.args }}
          ADAPT_MAX: ${{ matrix.adapt_max }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re, subprocess
          temp = pathlib.Path(os.environ['RUNNER_TEMP']); out = temp / 'out'; src = temp / 'halo'
          binary = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'compiler/target/gate/whitefootc'
          cmd = os.environ['ARGS'].split(); cap = int(os.environ['ADAPT_MAX'])
          env = {k: v for k, v in os.environ.items() if k not in ('WHITEFOOT_CHECK_WORK', 'WHITEFOOT_TIME_BUDGET_RECORD')}
          site = re.compile(r'rejected: (\S+?):(\d+):(\d+): error\[([A-Za-z0-9-]+)\]')
          notes = []; end = 'cap reached'; counter = [0]
          def block_end(lines, start, indent):
              return next((n for n in range(start, len(lines)) if lines[n].startswith(indent + '}') and not lines[n].startswith(indent + ' ')), None)
          def fix_else_if(path, number, decided):
              lines = (src / path).read_text().split('\n'); i = number - 1
              m = re.match(r'^(\s*)\} else if (.*) \{$', lines[i])
              if not m: return None
              indent = m.group(1)
              j = block_end(lines, i + 1, indent)
              if j is None: return 'else-if: no closing line at the same indent'
              if decided == 'True':
                  # Keep the then block as the final else; drop the rest of the chain.
                  k = j
                  while lines[k] != indent + '}':
                      k = block_end(lines, k + 1, indent)
                      if k is None: return 'else-if: chain does not close'
                  lines[i:k + 1] = [indent + '} else {'] + lines[i + 1:j] + [indent + '}']
              else:
                  # Drop the then block; the next link (or the closing brace) follows the previous block.
                  lines[i:j + 1] = [lines[j]]
              (src / path).write_text('\n'.join(lines))
              return ''
          def fix_effect_row(path, number, text):
              expected = re.search(r'expected_row: (.*)', text); found = re.search(r'found_row: (.*)', text)
              if not expected or not found: return 'no rows in the diagnostic'
              lines = (src / path).read_text().split('\n'); i = number - 1
              if found.group(1) not in lines[i]: return 'found row is not on the reported line'
              lines[i] = lines[i].replace(found.group(1), expected.group(1), 1)
              (src / path).write_text('\n'.join(lines))
              return None
          def fix_redundant(path, number, decided):
              chain = fix_else_if(path, number, decided)
              if chain is not None: return chain or None
              lines = (src / path).read_text().split('\n'); i = number - 1
              m = re.match(r'^(\s*)if (.*) \{$', lines[i])
              if not m: return f'not a statement-form if: {lines[i]!r}'
              indent = m.group(1)
              j = block_end(lines, i + 1, indent)
              if j is None: return 'no closing brace at the same indent'
              then = [l[2:] if l.startswith('  ') else l for l in lines[i + 1:j]]; other = []; tail = j + 1
              if lines[j] == indent + '} else {':
                  k = block_end(lines, j + 1, indent)
                  if k is None or lines[k] != indent + '}': return 'else branch is not a plain block'
                  other = [l[2:] if l.startswith('  ') else l for l in lines[j + 1:k]]; tail = k + 1
              elif lines[j] != indent + '}': return f'closing line is {lines[j]!r}'
              keep = then if decided == 'True' else other
              # The kept block's own bindings leave their block and could collide
              # with a later binding of the same spelling [TYPE-6]: rename them.
              for at in range(len(keep)):
                  d = re.match(r'^' + re.escape(indent) + r'let (.*?) = ', keep[at])
                  if not d: continue
                  pattern = d.group(1)
                  names = [pattern] if re.fullmatch(r'\w+', pattern) else re.findall(r'(?<=: )[a-z_]\w*', pattern)
                  for name in names:
                      counter[0] += 1; fresh = f'{name}_d{counter[0]}'
                      use = re.compile(r'(?<![\w:])(?<![\w)\]^]\.)' + re.escape(name) + r'(?!\w)(?!:(?!:))')
                      keep[at] = use.sub(fresh, keep[at][:d.end(1)]) + keep[at][d.end(1):]
                      keep[at + 1:] = [use.sub(fresh, l) for l in keep[at + 1:]]
              rest = lines[tail:]
              # Statements after a kept `return` at this level are unreachable.
              last = next((l for l in reversed(keep) if l.strip()), None)
              if last is not None and last.startswith(indent + 'return') and len(last) - len(last.lstrip()) == len(indent):
                  cut = next((n for n, l in enumerate(rest) if l.strip() and len(l) - len(l.lstrip()) < len(indent)), len(rest))
                  rest = rest[cut:]
              (src / path).write_text('\n'.join(lines[:i] + keep + rest))
              return None
          def fix_match_fields(path, number, text):
              declared = re.search(r'declared_fields: \[(.*?)\]', text)
              if not declared or not text.startswith(': InvalidMatchFields'): return 'not a missing-field rejection'
              names = re.findall(r'"(\w+)"', declared.group(1))
              lines = (src / path).read_text().split('\n'); line = lines[number - 1]
              if ') = ' not in line: return 'no closing pattern on the line'
              close = line.index(') = '); listed = set(re.findall(r'(?:(?<=\()|(?<=, ))(\w+): ', line[:close]))
              missing = [n for n in names if n not in listed]
              if not missing: return 'no missing field'
              lines[number - 1] = line[:close] + ''.join(f', {n}: unused_{n}' for n in missing) + line[close:]
              (src / path).write_text('\n'.join(lines))
              return None
          def rename_held():
              changed = 0
              for path in src.rglob('*'):
                  if path.suffix not in ('.wf', '.wfm') or '.git' in path.relative_to(src).parts: continue
                  text = path.read_text(); new = re.sub(r'\bheld\b', 'held_n', text)
                  if new != text: path.write_text(new); changed += 1
              return changed
          for n in range(cap + 1):
              r = subprocess.run([str(binary), *cmd], cwd=src, env=env, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              if r.returncode == 0: end = 'accepted'; break
              (out / 'adapt-last.log').write_text(r.stdout)
              m = site.search(r.stdout)
              if not m: end = 'stopped: no located rejection'; break
              if n == cap: break
              where = f'{m.group(1)}:{m.group(2)}'
              if m.group(4) == 'OP-5':
                  d = re.search(r'decided: (True|False)', r.stdout[m.end():])
                  why = fix_redundant(m.group(1), int(m.group(2)), d.group(1) if d else '?') if d else 'no decided value'
                  if why: end = f'cannot fix {where}: {why}'; break
                  notes.append('OP-5 ' + where)
              elif m.group(4) == 'EFF-2':
                  why = fix_effect_row(m.group(1), int(m.group(2)), r.stdout[m.end():m.end() + 2500])
                  if why: end = f'cannot fix {where}: {why}'; break
                  notes.append('EFF-2 ' + where)
              elif m.group(4) == 'GRAM-10':
                  why = fix_match_fields(m.group(1), int(m.group(2)), r.stdout[m.end():m.end() + 4000])
                  if why: end = f'cannot fix {where}: {why}'; break
                  notes.append('GRAM-10 ' + where)
              elif m.group(4) == 'FORM-3' and 'found: "held"' in r.stdout[m.end():m.end() + 1500] and not any(x.startswith('held') for x in notes):
                  notes.append(f'held renamed in {rename_held()} files')
              else:
                  end = f'stopped at {where} {m.group(4)}'; break
              print('applied', notes[-1], flush=True)
          diff = subprocess.run(['git', 'diff'], cwd=src, stdout=subprocess.PIPE, text=True).stdout
          (out / 'adapt.diff').write_text(diff); (out / 'adapt-notes.txt').write_text('\n'.join(notes) + '\n')
          line = f'## Adapt `{os.environ["ARGS"]}`: {len(notes)} fixes, ended: {end}\n'
          print(line, flush=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f: f.write(line)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f: f.write('accepted=' + ('true' if end == 'accepted' else 'false') + '\n')
          PY
      - name: Build the other compilers
        if: steps.adapt.outputs.accepted == 'true'
        run: |
          for tree in "$RUNNER_TEMP/main" "$RUNNER_TEMP/base"; do
            [ -d "$tree" ] || continue
            perl .github/run-check.pl thc-fetch cargo fetch --locked --manifest-path "$tree/compiler/Cargo.toml"
            perl .github/run-check.pl compiler/build cargo build --manifest-path "$tree/compiler/Cargo.toml" --profile gate --bin whitefootc --locked --offline
          done
      - name: Source without the host_paths binding, and the baseline compiler's check of it
        if: steps.adapt.outputs.accepted == 'true'
        run: |
          cp -a "$RUNNER_TEMP/halo" "$RUNNER_TEMP/halo0"
          python3 - <<'PY'
          import os, pathlib
          src = pathlib.Path(os.environ['RUNNER_TEMP']) / 'halo0'
          needle = ', host_paths: unused_host_paths'; changed = 0
          for path in src.rglob('*.wf'):
              if '.git' in path.relative_to(src).parts: continue
              text = path.read_text()
              if needle in text:
                  path.write_text(text.replace(needle, '')); changed += 1; print('removed the binding in', path.relative_to(src))
          assert changed == 1, f'expected one file with the binding, found {changed}'
          PY
          cd "$RUNNER_TEMP/halo0"
          "$RUNNER_TEMP/base/compiler/target/gate/whitefootc" ${{ matrix.args }}
          echo "the baseline compiler accepts the source without the binding"
      - name: Interleaved checks and counters
        if: steps.adapt.outputs.accepted == 'true'
        env:
          LABEL: ${{ matrix.label }}
          ARGS: ${{ matrix.args }}
          ROUNDS: ${{ matrix.rounds }}
          MAIN_ROUNDS: ${{ matrix.main_rounds }}
        run: |
          python3 - <<'PY'
          import collections, csv, os, pathlib, statistics, subprocess
          temp = pathlib.Path(os.environ['RUNNER_TEMP']); out = temp / 'out'
          ws = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          module = os.environ['LABEL']; rounds = int(os.environ['ROUNDS']); main_rounds = int(os.environ['MAIN_ROUNDS'])
          has_base = (temp / 'base').is_dir(); ref = 'base' if has_base else 'main'
          bins = {}
          if has_base: bins['base'] = temp / 'base/compiler/target/gate/whitefootc'
          bins['twin'] = temp / (ref + '/compiler/target/gate/whitefootc')
          bins['main'] = temp / 'main/compiler/target/gate/whitefootc'
          bins['branch'] = ws / 'compiler/target/gate/whitefootc'
          cmd = os.environ['ARGS'].split()
          env = {k: v for k, v in os.environ.items() if k not in ('WHITEFOOT_CHECK_WORK', 'WHITEFOOT_TIME_BUDGET_RECORD')}
          tag = module.replace('::', '-').replace(' ', '-')
          def run(which, label, counters=False):
              timing = out / (tag + '-' + label + '.time'); e = dict(env)
              if counters: e['WHITEFOOT_CHECK_WORK'] = str(out / (tag + '-' + which + '-work.tsv'))
              r = subprocess.run(['perl', str(ws / '.github/run-check.pl'), 'thc-' + label, '/usr/bin/time', '-q', '-f', '%e\t%U\t%S', '-o', str(timing), str(bins[which]), *cmd],
                                 cwd=temp / ('halo0' if which in ('base', 'twin') else 'halo'), env=e, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              (out / (tag + '-' + label + '.log')).write_text(r.stdout)
              wall, user, sys_ = map(float, timing.read_text().split()[-3:])
              return r.returncode, user + sys_
          order = list(bins); paired = collections.defaultdict(dict); status = collections.defaultdict(dict)
          for rnd in range(1, rounds + 1):
              cur = order[:] if rnd % 2 else order[::-1]
              for w in cur:
                  if w == 'main' and rnd > main_rounds: continue
                  rc, cpu = run(w, f'{w}-{rnd}'); paired[rnd][w] = cpu; status[rnd][w] = rc
                  print(rnd, w, f'rc={rc}', f'{cpu:.2f}', flush=True)
          lines = [f'## {module}: compiler CPU (user+sys), {rounds} interleaved rounds', '',
                   'Exit codes by round: ' + '; '.join(f'r{r}: ' + ' '.join(f'{w}={status[r][w]}' for w in status[r]) for r in sorted(status)), '',
                   '| Compiler | Median CPU s | Ratio to ' + ref + ' (median, min-max) |', '|---|---:|---:|']
          for w in order:
              rows = [p for p in paired.values() if w in p]
              if not rows: continue
              rb = [p[w] / p[ref] for p in rows]
              lines.append(f"| {w} | {statistics.median(p[w] for p in rows):.2f} | {statistics.median(rb):.3f} ({min(rb):.3f}-{max(rb):.3f}) |")
          totals = {}
          for w in order:
              if w == 'twin' or (w == 'main' and module.endswith('pkg::test')): continue
              rc, _ = run(w, 'counters-' + w, counters=True); t = collections.Counter(); print('counters', w, f'rc={rc}', flush=True)
              work = out / (tag + '-' + w + '-work.tsv')
              if work.exists():
                  with work.open() as f:
                      for row in csv.reader(f, delimiter='\t'):
                          if len(row) == 7 and row[6].isdigit(): t[row[3] + ':' + row[5]] += int(row[6])
              totals[w] = t
          fixed = ['join:join', 'join:pairs_evaluated', 'closure:cells_sum']
          keys = fixed + [k for k in sorted(set().union(*totals.values()), key=lambda k: -max(t[k] for t in totals.values())) if k not in fixed][:20]
          ws_ = list(totals)
          lines += ['', '| Counter | ' + ' | '.join(ws_) + ' |', '|---|' + '---:|' * len(ws_)] + [f"| {k} | " + ' | '.join(str(totals[w][k]) for w in ws_) + ' |' for k in keys]
          summary = '\n'.join(lines) + '\n'; print(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f: f.write(summary)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tmp-firn-baseline-${{ strategy.job-index }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: warn

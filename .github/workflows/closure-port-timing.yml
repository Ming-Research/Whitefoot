# Temporary, removed before this branch is ready: times main's compiler and
# this branch's on the stage-3 wasm interpreters for the probe measurement in
# research/investigations/proof-certificate-architecture/INCREMENTAL-CLOSURE.md,
# on the owner's 14900K. Run it with
# `gh workflow run closure-port-timing.yml --ref claude/closure-on-main`.
name: closure-port-timing

on:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  time:
    runs-on: [self-hosted, 14900k]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Describe the host
        run: |
          if [ -d "$HOME/.cargo/bin" ]; then
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          for tool in /usr/bin/time timeout cargo clang python3 sha256sum; do
            command -v "$tool" >/dev/null || { echo "missing $tool"; exit 1; }
          done
          lscpu | grep -E 'Model name|^CPU\(s\)'
          uname -r
          clang --version | head -1

      - name: Build main's compiler and this branch's
        run: |
          set -eo pipefail
          base=$(git merge-base HEAD origin/main)
          echo "main $base"
          echo "port $(git rev-parse HEAD)"
          git worktree prune
          for side in main port; do
            tree="$RUNNER_TEMP/tree-$side"
            rm -rf "$tree"
            if [ "$side" = main ]; then rev=$base; else rev=HEAD; fi
            git worktree add --detach "$tree" "$rev"
            cargo fetch --locked --manifest-path "$tree/compiler/Cargo.toml"
            make -C "$tree/compiler" build
          done

      - name: Time each compiler on each interpreter
        run: |
          set -o pipefail
          out="$RUNNER_TEMP/timing"
          mkdir -p "$out"
          gen=research/experiments/match-dispatch/wasm/gen.py
          python3 "$gen" "$out/acc.wf"
          python3 "$gen" "$out/inline.wf" --inline
          wc -l "$out/acc.wf" "$out/inline.wf"
          sha256sum "$out/acc.wf" "$out/inline.wf"
          printf 'program\tcompiler\texit\tseconds\tmax_rss_kb\tllvm_sha256\n' > "$out/runs.tsv"
          for program in acc inline; do
            for side in port main; do
              compiler="$RUNNER_TEMP/tree-$side/compiler/target/gate/whitefootc"
              ll="$out/$program-$side.ll"
              rm -f "$ll"
              /usr/bin/time -f '%e %M' -o "$out/time.txt" \
                timeout 1800 "$compiler" --emit-llvm -o "$ll" "$out/$program.wf" \
                > "$out/$program-$side.log" 2>&1
              status=$?
              read -r seconds rss < <(tail -1 "$out/time.txt")
              sha=$( [ -s "$ll" ] && sha256sum "$ll" | cut -d' ' -f1 || echo none )
              printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$program" "$side" "$status" "$seconds" "$rss" "$sha" | tee -a "$out/runs.tsv"
              tail -3 "$out/$program-$side.log"
            done
          done
          echo '--- runs.tsv'
          cat "$out/runs.tsv"

# Temporary (claude/par-demand only): reproduce the SIGSEGV of `records verify`
# at WF_WORKERS=8 seen in compute-bench run 38051814229. Removed before ready.
name: tmp-records-crash
on:
  push:
    branches: [claude/par-demand]
    paths: [.github/workflows/tmp-records-crash.yml]
jobs:
  repro:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build the arms
        run: |
          sudo apt-get install -y -q gdb >/dev/null
          make -C compiler build
          make -C research/experiments/par-demand build BUILD="$RUNNER_TEMP/pd" EXPERIMENT=2
      - name: Repeat records verify per arm, width and setting
        run: |
          ulimit -c unlimited
          echo "$RUNNER_TEMP/core.%e.%p" | sudo tee /proc/sys/kernel/core_pattern
          nproc
          for arm in seq par demand idle1; do
            for width in 4 8 16; do
              for setting in on off-never-request; do
                bad=0; slow=0
                for i in $(seq 1 60); do
                  start=$(date +%s%N)
                  WF_WORKERS=$width WF_PAR_DEMAND=$setting timeout 60 "$RUNNER_TEMP/pd/$arm/records" verify > /dev/null 2> "$RUNNER_TEMP/err.txt"
                  status=$?
                  ms=$(( ($(date +%s%N) - start) / 1000000 ))
                  if [ $ms -gt 2000 ]; then slow=$((slow+1)); fi
                  if [ $status -ne 0 ]; then bad=$((bad+1)); echo "FAIL arm=$arm width=$width setting=$setting i=$i status=$status ms=$ms"; tail -3 "$RUNNER_TEMP/err.txt"; fi
                done
                echo "arm=$arm width=$width setting=$setting failures=$bad slow_over_2s=$slow"
              done
            done
          done
          ls "$RUNNER_TEMP"/core.* 2>/dev/null | head -3
      - name: Backtraces
        if: always()
        run: |
          for core in $(ls "$RUNNER_TEMP"/core.* 2>/dev/null | head -2); do
            exe=$(ls "$RUNNER_TEMP"/pd/*/records | head -1)
            for arm in seq par demand idle1; do
              file "$core" | grep -q "$arm/records" && exe="$RUNNER_TEMP/pd/$arm/records"
            done
            file "$core"
            gdb -batch -ex "thread apply all bt 25" "$exe" "$core" 2>&1 | head -200
          done

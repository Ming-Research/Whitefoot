# TEMPORARY quick check for the process-id, local-offset and open-files-limit
# PR after it merged main (spec v0.153 -> this amendment v0.154). It runs only
# what that change and the merge touch, as the gate's own commands do, with no
# time budget record so no budget verdict is produced:
#   static       make static (spec archives, English text, design lint, ...)
#   lib          the lib tests of the modules whose Inputs patterns changed,
#                and the pinned repair texts
#   corpus       the program tests that run the new std functions and the
#                programs main added that destructure Inputs
#   conformance  the whole conformance adapter (every case, the pre2- ones
#                and the cases that name process_id included)
#   runtime      the runtime group (the C probe of the local offset and of
#                the open-files limit)
# Removed before the full check; the gate fails while a tmp- workflow exists.
name: tmp-pid-localtime-merge

on:
  push:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0

jobs:
  quick:
    name: ${{ matrix.stage }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        stage: [corpus, conformance]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Set the scratch root
        run: |
          echo "WHITEFOOT_SCRATCH_ROOT=$RUNNER_TEMP/whitefoot" >> "$GITHUB_ENV"

      - name: Name main as a local ref
        run: |
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          if git symbolic-ref -q HEAD | grep -qx refs/heads/main; then
            echo "checkout is on main"
          else
            git branch -f main origin/main
          fi
          git log --oneline -1 main

      - name: Select the design review base
        if: matrix.stage == 'static'
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          design_review_base=$(sh design/skill/review-base.sh "$GITHUB_EVENT_NAME" "$GITHUB_REF" "$PUSH_BEFORE")
          echo "DESIGN_REVIEW_BASE=$design_review_base" >> "$GITHUB_ENV"
          git log --oneline -1 "$design_review_base"

      - name: Install the host toolchain
        if: matrix.stage != 'static'
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          ld.lld --version
          /usr/bin/clang --version
          python3 --version
          rustup default stable
          rustup component add clippy rustfmt
          cargo --version

      - name: Fetch locked compiler dependencies
        if: matrix.stage != 'static'
        run: cargo fetch --locked --manifest-path compiler/Cargo.toml

      - name: Decline core dumps
        run: |
          sudo sysctl -w kernel.core_pattern=core
          cat /proc/sys/kernel/core_pattern

      - name: static
        if: matrix.stage == 'static'
        env:
          WHITEFOOT_CHECK_TIMEOUT: 900
        run: make static

      - name: lib
        if: matrix.stage == 'lib'
        env:
          WHITEFOOT_CHECK_TIMEOUT: 1500
        run: |
          ulimit -c 0
          cd compiler
          perl ../.github/run-check.pl tmp/lib cargo test --profile gate --lib --locked --offline -- \
            driver::pinned_repairs driver::diagnostic \
            backend::tests::arrays backend::tests::paged backend::tests::ranges \
            backend::tests::storage_alias backend::tests::loop_split \
            backend::tests::owned_places backend::tests::containers \
            backend::tests::windows backend::tests::exhaustion

      - name: corpus
        if: matrix.stage == 'corpus'
        env:
          WHITEFOOT_CHECK_TIMEOUT: 1500
        run: |
          ulimit -c 0
          cd compiler
          perl ../.github/run-check.pl tmp/corpus cargo test --profile gate --test corpus --locked --offline -- \
            programs::local_time programs::open_files programs::heap \
            programs::runs programs::package_fixtures programs::file_replacement

      - name: conformance
        if: matrix.stage == 'conformance'
        env:
          WHITEFOOT_CHECK_TIMEOUT: 1500
        run: |
          ulimit -c 0
          cd compiler
          perl ../.github/run-check.pl tmp/conformance cargo test --profile gate --test corpus --locked --offline -- conformance::adapter:: --nocapture

      - name: runtime
        if: matrix.stage == 'runtime'
        env:
          WHITEFOOT_CHECK_TIMEOUT: 1500
        run: make check-group GROUP=runtime

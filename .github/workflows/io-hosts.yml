# Completion I/O evidence from hosts the maintainer's machine cannot produce:
# a real Linux kernel on real hardware, Windows at all, and an ordinary macOS
# system without a corporate endpoint-security stack in the I/O path.
#
# These jobs retain execution evidence rather than relying on cross-builds.
# A correctness job here fails loudly rather than recording a fallback:
# `completion-linux` requires io_uring, and `completion-windows` exercises both
# IOCP and the native compute pool through the production compiler, reporting
# exact backend failures instead of marking them expected-to-fail. The Windows
# job builds with the pinned llvm-mingw release for x86_64-w64-windows-gnu, the
# one Windows target the compiler emits and the Windows package ships
# (design/compiler/toolchain-resolution). The bench
# jobs that record performance live in `io-bench.yml` and run on demand.
#
# These checks run on the revisions gate.yml checks, decided the same way by
# .github/gate-scope.sh: a push to main, a push to a branch with an open ready
# pull request, the opening or reopening of a ready pull request, the event of
# marking one ready, which skips when its head already has a successful manual
# run of this workflow, and a manual run. Any other push, a draft pull
# request's included, ends after the first job with both checks skipped; the
# author starts this workflow by hand once, after the review has passed
# (AGENTS.md, "Checks").
name: io-hosts

on:
  push:
  pull_request:
    types: [opened, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

# Pushes to one branch share a group, so a later push cancels the run of an
# earlier head. The opening or reopening of a pull request, the event of
# marking one ready and a manual run each have a group of their own, marked
# before the ref so that no branch name can reach it: an opening in the push
# group, created a few seconds after the pull request, could cancel the push
# run of a newer head and leave it unchecked, and a push that skips must not
# cancel a manual run.
concurrency:
  group: io-hosts-${{ github.event.action == 'ready_for_review' && 'ready-' || github.event_name == 'pull_request' && 'opened-' || github.event_name == 'workflow_dispatch' && 'manual-' || '' }}${{ github.head_ref && format('refs/heads/{0}', github.head_ref) || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  # A fresh checkout gains nothing from incremental state (compiler/Cargo.toml).
  CARGO_INCREMENTAL: 0

jobs:
  scope:
    name: Choose whether to check
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: .github
      # A failed query fails the run rather than quietly skipping the checks.
      - name: Choose whether to check
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f .github/gate-scope.sh ]; then
            echo "::error::.github/gate-scope.sh is missing from the checked-out head: the branch was cut from main before main gained it. Merge main into the branch and push again."
            exit 1
          fi
          scope=$(sh .github/gate-scope.sh)
          echo "$scope"
          echo "$scope" >> "$GITHUB_OUTPUT"
          echo "$scope" | sed -n 's/^reason=/io-hosts: /p' >> "$GITHUB_STEP_SUMMARY"

  completion-linux:
    name: completion-linux (ubuntu-24.04)
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # `completion-test` writes its harness under this root, and the step below
      # runs that harness by path. Naming the root here keeps the two agreed; it
      # is set from a step because the `runner` context is not available to a
      # job-level `env:` block.
      - name: Set the scratch root
        run: |
          echo "WHITEFOOT_SCRATCH_ROOT=$RUNNER_TEMP/whitefoot" >> "$GITHUB_ENV"
          echo "WHITEFOOT_TIME_BUDGET_RECORD=$RUNNER_TEMP/time-budget-overruns.txt" >> "$GITHUB_ENV"

      - name: Install the host toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-rt-18-dev
          test -x /usr/bin/clang
          /usr/bin/clang --version

      - name: Record the kernel and libc
        run: |
          uname -srvmo
          getconf GNU_LIBC_VERSION
          nproc
          echo "kernel.io_uring_disabled=$(cat /proc/sys/kernel/io_uring_disabled 2>/dev/null || echo 'absent')"

      # The ring exclusion controls intentionally die with SIGSEGV. As in
      # gate.yml, use a file pattern so Makefile's zero core limit also stops
      # Ubuntu's piped systemd-coredump collection; only the signal is evidence.
      - name: Decline core dumps
        run: |
          sudo sysctl -w kernel.core_pattern=core
          cat /proc/sys/kernel/core_pattern

      # completion-test also builds/runs the x86-64 glibc fork capsule witness,
      # its no-DONTFORK fault control, close-loop fallback and advice-refusal
      # image. Keep that raw child closure outside sanitizer instrumentation.
      - name: Native runtime correctness (io_uring required)
        run: |
          WHITEFOOT_CHECK_TIMEOUT=180 perl .github/run-check.pl linux-runtime \
            make -C compiler -j2 completion-test CC=/usr/bin/clang REQUIRE_NATIVE=1

      - name: Address and undefined sanitizers
        run: WHITEFOOT_CHECK_TIMEOUT=180 perl .github/run-check.pl linux-asan-ubsan make -C compiler -j2 completion-sanitize CC=/usr/bin/clang REQUIRE_NATIVE=1

      # TSan observes actual threads in the default-policy, deque and main
      # runtime groups. The isolated core/read case has no concurrent work.
      - name: Thread sanitizer
        run: |
          WHITEFOOT_CHECK_TIMEOUT=180 perl .github/run-check.pl linux-default-tsan make -C compiler -j2 completion-default-route-tsan CC=/usr/bin/clang REQUIRE_NATIVE=1
          WHITEFOOT_CHECK_TIMEOUT=180 perl .github/run-check.pl linux-deque-tsan make -C compiler -j2 sched-deque-tsan CC=/usr/bin/clang

      - name: Thread sanitizer over the bridge and the ring
        run: WHITEFOOT_CHECK_TIMEOUT=180 perl .github/run-check.pl linux-runtime-tsan make -C compiler -j2 completion-tsan CC=/usr/bin/clang REQUIRE_NATIVE=1

      # The native C checks above keep their own compiler. The WF witness
      # below needs the gate's LLVM version for its emitted waiting entry.
      - name: Install the production compiler's LLVM toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          rustup default stable
          cargo fetch --locked --manifest-path compiler/Cargo.toml

      # This host already requires io_uring. The case uses taskset with
      # three CPUs from its allowed set, prints Inputs.drivers, and compares
      # it with reports published after actual driver executors started.
      # No unavailable-ring or fewer-CPU result satisfies the criterion.
      - name: Runtime driver count through the ordinary Inputs entry
        run: |
          perl .github/run-check.pl compiler/test-build-corpus \
            cargo test --manifest-path compiler/Cargo.toml --profile gate --locked --offline --test corpus --no-run
          perl .github/run-check.pl compiler/test-corpus \
            cargo test --manifest-path compiler/Cargo.toml --profile gate --locked --offline --test corpus \
            programs::driver_count::driver_count_matches_started_roles_under_three_cpu_affinity -- --ignored --exact

      # run-check.pl appended every stage over its budget in
      # .github/time-budgets.txt, or without one, to this record; the stages
      # themselves kept their own statuses.
      - name: Hold every stage to its time budget
        if: always()
        run: perl .github/run-check.pl --budget-verdict "$WHITEFOOT_TIME_BUDGET_RECORD"

  completion-windows:
    name: completion-windows (windows-latest)
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # The C compiler for the runtime units and the test images: clang from
      # llvm-mingw, naming the target explicitly as every whitefootc clang
      # command does.
      WINDOWS_CLANG: clang --target=x86_64-w64-windows-gnu
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install the pinned llvm-mingw
        timeout-minutes: 8
        run: |
          set -euo pipefail
          root=$(bash .github/toolchain/fetch-llvm-mingw.sh .github/toolchain/llvm-assets.json \
            "$RUNNER_TEMP/llvm-mingw-archives" "$RUNNER_TEMP/llvm-mingw" | tail -n 1)
          echo "LLVM_MINGW_ROOT=$root" >> "$GITHUB_ENV"
          # Only llvm-mingw's bin goes ahead of everything else on PATH.
          cygpath -w "$root/bin" >> "$GITHUB_PATH"

      # Every later step that says `clang` must reach llvm-mingw's, not the
      # image's own LLVM.
      - name: Require llvm-mingw's clang to be the job's clang
        run: |
          set -euo pipefail
          ours="$(cygpath -u "$LLVM_MINGW_ROOT")/bin/clang"
          resolved="$(which clang)"
          if [ "$resolved" != "$ours" ]; then
            echo "clang resolves to $resolved, not llvm-mingw's $ours" >&2
            exit 1
          fi
          clang --version | tee "$RUNNER_TEMP/clang-version.txt"
          grep -F 'clang version 22.1.8' "$RUNNER_TEMP/clang-version.txt"
          installed="$(sed -n 's/^InstalledDir: //p' "$RUNNER_TEMP/clang-version.txt" | tr -d '\r')"
          if [ "$(cygpath -u "$installed")" != "$(cygpath -u "$LLVM_MINGW_ROOT")/bin" ]; then
            echo "clang's InstalledDir $installed is not llvm-mingw's bin" >&2
            exit 1
          fi

      - name: Record the host
        run: |
          clang --version
          rustc -vV
          systeminfo | grep -E '^(OS Name|OS Version|System Type|Total Physical Memory)' || true

      # The Windows steps run without run-check.pl, so no time budget holds
      # them; their timeouts only stop a stuck run.
      - name: Construct Windows native test images once
        timeout-minutes: 5
        run: |
          if ! command -v make > /dev/null; then
            choco install make --yes --no-progress
          fi
          make --version
          make -C compiler -j2 completion-windows-cross WINDOWS_CC="$WINDOWS_CLANG" \
            WINDOWS_LLVM_CC="$WINDOWS_CLANG" SHELL=bash \
            COMPLETION_TMP="$(cygpath -u "$RUNNER_TEMP")/completion"

      # A MinGW UCRT image imports the C runtime through api-ms-win-crt-* or
      # ucrtbase and never Visual C++'s runtime; an image the Visual Studio
      # toolchain linked imports VCRUNTIME140.
      - name: Require the test images to be MinGW UCRT images
        run: |
          set -euo pipefail
          for image in "$(cygpath -u "$RUNNER_TEMP")"/completion/*.exe; do
            llvm-readobj --coff-imports "$image" | sed -n 's/^ *Name: //p' | tr -d '\r' | sort -u > "$image.imports"
            echo "--- $(basename "$image") ---"; cat "$image.imports"
            if grep -i -E '^(vcruntime|msvcp)' "$image.imports"; then
              echo "$image imports the Visual C++ runtime" >&2; exit 1
            fi
            grep -i -E '^(api-ms-win-crt-|ucrtbase)' "$image.imports" > /dev/null
          done

      - name: Exercise native deque reuse and live counters
        run: |
          "$RUNNER_TEMP/completion/windows-sched-deque.exe"
          "$RUNNER_TEMP/completion/windows-sched-deque-no-stats.exe"

      - name: Native Windows CPU policy and wait integration
        run: |
          WF_WORKERS=2 "$RUNNER_TEMP/completion/windows-sched-cpu-levels.exe" host
          "$RUNNER_TEMP/completion/windows-sched-cpu-levels.exe" wake
          make -C compiler sched-split-policy-cases WINDOWS_CC="$WINDOWS_CLANG" \
            WINDOWS_LLVM_CC="$WINDOWS_CLANG" SHELL=bash \
            COMPLETION_TMP="$(cygpath -u "$RUNNER_TEMP")/completion" \
            SCHED_POLICY_EXE="$(cygpath -u "$RUNNER_TEMP")/completion/windows-sched-cpu-levels.exe"
          for mode in fit oversubscribed unknown-count mixed; do
            WF_WORKERS=4 "$RUNNER_TEMP/completion/windows-sched-cpu-levels.exe" "$mode"
          done

      - name: Exercise compute startup failures and frame lifetime
        run: |
          for mode in normal owner-fail worker-fail partial partial-three startup-delayed startup-partial; do
            WF_WORKERS=4 "$RUNNER_TEMP/completion/windows-sched-smoke.exe" "$mode"
          done
          WF_WORKERS=1 "$RUNNER_TEMP/completion/windows-sched-smoke.exe"
          set +e
          WF_WORKERS=invalid "$RUNNER_TEMP/completion/windows-sched-smoke.exe" \
            > "$RUNNER_TEMP/completion/startup.out" 2> "$RUNNER_TEMP/completion/startup.err"
          status=$?
          set -e
          test "$status" = 1
          test ! -s "$RUNNER_TEMP/completion/startup.out"
          tr -d '\r' < "$RUNNER_TEMP/completion/startup.err" > "$RUNNER_TEMP/completion/startup.normalized"
          printf '%s\n' 'whitefoot scheduler: WF_WORKERS must be an integer from 0 through 64' | \
            cmp - "$RUNNER_TEMP/completion/startup.normalized"

      - name: Run the Windows default-route probe on both routes
        run: |
          # Show every run before judging it.  A process that ends through
          # `abort()` under the release UCRT takes the fast-fail path, which
          # Git bash reports as exit 127, and the only thing that says which
          # fail-stop fired is the line the runtime wrote on its way out.  A
          # step that stops at the failing command under `set -e` never shows
          # that line, which is how the previous shape of this step turned an
          # named fail-stop into an undiagnosable number.
          show() {
            echo "--- $1: stdout ---"
            tr -d $'\r' < "$2" || true
            echo "--- $1: stderr ---"
            tr -d $'\r' < "$3" || true
            echo "--- $1: exit status: $4 ---"
          }
          record="$RUNNER_TEMP/completion/windows-default-route"
          set +e
          "$RUNNER_TEMP/completion/windows-default-route-probe.exe" \
            "$RUNNER_TEMP/completion" \
            > "$record-ring.out" 2> "$record-ring.txt"
          ring_status=$?
          set -e
          show "native ring" "$record-ring.out" "$record-ring.txt" "$ring_status"
          test "$ring_status" -eq 0 || exit "$ring_status"
          tr -d $'\r' < "$record-ring.txt" | grep -F 'route=native-ring' > /dev/null
          set +e
          WF_IO_NO_NATIVE_RING=1 \
            "$RUNNER_TEMP/completion/windows-default-route-probe.exe" \
            "$RUNNER_TEMP/completion" \
            > "$record-adapter.out" 2> "$record-adapter.txt"
          adapter_status=$?
          set -e
          show "bounded adapter" "$record-adapter.out" "$record-adapter.txt" \
            "$adapter_status"
          test "$adapter_status" -eq 0 || exit "$adapter_status"
          tr -d $'\r' < "$record-adapter.txt" | grep -F 'route=posix-adapter' > /dev/null

      # This image owns direct engine publication and shares compatible native
      # objects with the bridge images. The ring's real operations are evidence.
      - name: Run the Windows native adapter probe
        run: |
          probe_dir="$RUNNER_TEMP/completion"
          set +e
          "$probe_dir/windows-adapter-probe.exe" \
            "$probe_dir/adapter.data" \
            > "$probe_dir/adapter-probe.out" 2> "$probe_dir/adapter-probe.err"
          status=$?
          set -e
          echo "--- native adapter probe: stdout ---"
          tr -d $'\r' < "$probe_dir/adapter-probe.out" || true
          echo "--- native adapter probe: stderr ---"
          tr -d $'\r' < "$probe_dir/adapter-probe.err" || true
          echo "--- native adapter probe: exit status: ${status} ---"
          exit "$status"

      - name: Bound Windows helper sends to a silent peer
        run: |
          WF_IO_NO_NATIVE_RING=1 WF_IO_HELPERS=2 \
            "$RUNNER_TEMP/completion/windows-bounded-send-test.exe"

      - name: Run ordinary values through the production native bodies
        run: |
          probe_dir="$RUNNER_TEMP/completion/ordinary-values"
          mkdir -p "$probe_dir"
          "$RUNNER_TEMP/completion/windows-ordinary-values-probe.exe" "$probe_dir" text
          for helpers in 0 2; do
            for group in file directory tcp; do
              WF_IO_HELPERS="$helpers" \
                "$RUNNER_TEMP/completion/windows-ordinary-values-probe.exe" "$probe_dir" "$group"
            done
          done

      # Only the bridge object replaces initialization and the terminal abort.
      # Other objects retain their production definitions and are reused.
      - name: Require Windows bridge initialization to fail stop
        run: |
          fault_dir="$RUNNER_TEMP/completion/windows-bridge-init-fault"
          mkdir -p "$fault_dir"
          set +e
          WF_IO_NO_NATIVE_RING=0 WF_IO_HELPERS=1 \
            "$RUNNER_TEMP/completion/windows-bridge-init-fail-stop-probe.exe" \
            > "$fault_dir/stdout.txt" 2> "$fault_dir/stderr.txt"
          status=$?
          set -e
          echo "--- bridge initialization fault: stdout ---"
          tr -d $'\r' < "$fault_dir/stdout.txt" || true
          echo "--- bridge initialization fault: stderr ---"
          tr -d $'\r' < "$fault_dir/stderr.txt" || true
          echo "--- bridge initialization fault: exit status: ${status} ---"
          if [ "$status" -ne 86 ]; then
            echo "bridge initialization fault exited ${status}, expected 86" >&2
            exit 1
          fi
          if [ -s "$fault_dir/stdout.txt" ]; then
            echo "bridge initialization fault wrote program output" >&2
            exit 1
          fi
          # The bridge's fail-stop names itself before it ends the process
          # (`completion/bridge.c`, `wf_bridge_fail`), and that line is the
          # evidence that the *initialization* fail-stop is the one that fired
          # rather than some other abort on the way.
          tr -d $'\r' < "$fault_dir/stderr.txt" > "$fault_dir/stderr.normalized"
          printf '%s\n' 'whitefoot completion: the completion bridge could not initialize' \
            > "$fault_dir/expected.txt"
          cmp "$fault_dir/expected.txt" "$fault_dir/stderr.normalized"

      # A native adapter probe can pass while the compiler still emits a Unix
      # bootstrap or the shipped driver forgets one Windows runtime unit. This
      # is the production boundary: native whitefootc emits and links a real
      # .wf program, whose two argument paths are UTF-16, whose files are
      # opened relative to Inputs.cwd, whose first independent read_at must
      # submit to IOCP, and whose bytes leave through OutputStream.write_once. The
      # opt-in runtime assertion aborts at process exit unless at least one
      # IOCP submission was also reaped, so a silent direct fallback cannot
      # satisfy this step.
      # conformance::file_replacement includes writable-subdirectory cases
      # on default and native-disabled routes through the shared file adapter.
      # programs::stop_signals also runs its PRE-2 lifecycle manifest case in
      # an isolated console, plus real control events on both host routes.
      - name: Construct and run shared Windows program cases
        timeout-minutes: 8
        env:
          CARGO_BUILD_JOBS: 2
          RUST_TEST_THREADS: 2
          RUST_MIN_STACK: 8388608
        run: |
          cargo test --manifest-path compiler/Cargo.toml --profile gate --locked \
            --test corpus -- programs::windows:: programs::network:: programs::file_replacement:: programs::stop_signals:: programs::driver_count:: conformance::file_replacement:: native_windows::

      # The driver itself on this target: the module names the MinGW triple,
      # and an ordinary link, a cached ThinLTO link of function fragments (the
      # MinGW driver's --thinlto-cache-dir) and a full-LTO link each produce a
      # UCRT image that runs.
      - name: Drive whitefootc's own links for the MinGW target
        timeout-minutes: 8
        env:
          CARGO_BUILD_JOBS: 2
        run: |
          set -euo pipefail
          cargo build --manifest-path compiler/Cargo.toml --profile gate --locked --bin whitefootc
          wfc=compiler/target/gate/whitefootc.exe
          out="$(cygpath -u "$RUNNER_TEMP")/driver"
          mkdir -p "$out"
          "$wfc" --emit-llvm -o "$out/geometry_vectors.ll" tests/programs/geometry_vectors.wf
          grep -F 'target triple = "x86_64-w64-windows-gnu"' "$out/geometry_vectors.ll"
          check_imports() {
            llvm-readobj --coff-imports "$1" | sed -n 's/^ *Name: //p' | tr -d '\r' | sort -u > "$1.imports"
            echo "--- $(basename "$1") imports ---"; cat "$1.imports"
            if grep -i -E '^(vcruntime|msvcp)' "$1.imports"; then
              echo "$1 imports the Visual C++ runtime" >&2; exit 1
            fi
            grep -i -E '^(api-ms-win-crt-|ucrtbase)' "$1.imports" > /dev/null
          }
          "$wfc" -o "$out/plain.exe" tests/programs/geometry_vectors.wf
          "$out/plain.exe"; check_imports "$out/plain.exe"
          "$wfc" --cache "$out/cache" --fragments function -o "$out/thin.exe" tests/programs/geometry_vectors.wf
          "$out/thin.exe"; check_imports "$out/thin.exe"
          test -n "$(ls -A "$out/cache")"
          "$wfc" --full-lto -o "$out/full.exe" tests/programs/geometry_vectors.wf
          "$out/full.exe"; check_imports "$out/full.exe"

# Completion I/O evidence from hosts the maintainer's machine cannot produce:
# a real Linux kernel on real hardware, Windows at all, and an ordinary macOS
# system without a corporate endpoint-security stack in the I/O path.
#
# These jobs retain execution evidence rather than relying on cross-builds.
# A correctness job here fails loudly rather than recording a fallback:
# `completion-linux` requires io_uring, and `completion-windows` exercises both
# IOCP and the native compute pool through the production compiler, reporting
# exact backend failures instead of marking them expected-to-fail. The bench
# jobs that record performance live in `io-bench.yml` and run on demand;
# ordinary pushes retain these platform correctness checks.
name: io-hosts

on:
  push:
  workflow_dispatch:

concurrency:
  group: io-hosts-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  # A fresh checkout gains nothing from incremental state (compiler/Cargo.toml).
  CARGO_INCREMENTAL: 0

jobs:
  completion-linux:
    name: completion-linux (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # `completion-test` writes its harness under this root, and the step below
      # runs that harness by path. Naming the root here keeps the two agreed; it
      # is set from a step because the `runner` context is not available to a
      # job-level `env:` block.
      - name: Set the scratch root
        run: echo "WHITEFOOT_SCRATCH_ROOT=$RUNNER_TEMP/whitefoot" >> "$GITHUB_ENV"

      - name: Install the host toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-rt-18-dev
          test -x /usr/bin/clang
          /usr/bin/clang --version

      - name: Record the kernel
        run: |
          uname -srvmo
          nproc
          echo "kernel.io_uring_disabled=$(cat /proc/sys/kernel/io_uring_disabled 2>/dev/null || echo 'absent')"

      - name: Native runtime correctness (io_uring required)
        run: |
          WHITEFOOT_CHECK_TIMEOUT=180 perl .github/run-check.pl linux-runtime \
            make -C compiler -j2 completion-test CC=/usr/bin/clang REQUIRE_NATIVE=1

      - name: Address and undefined sanitizers
        run: WHITEFOOT_CHECK_TIMEOUT=180 perl .github/run-check.pl linux-asan-ubsan make -C compiler -j2 completion-sanitize CC=/usr/bin/clang REQUIRE_NATIVE=1

      # TSan observes actual threads in the default-policy, deque and main
      # runtime groups. The isolated core/read case has no concurrent work.
      - name: Thread sanitizer
        run: |
          WHITEFOOT_CHECK_TIMEOUT=180 perl .github/run-check.pl linux-default-tsan make -C compiler -j2 completion-default-route-tsan CC=/usr/bin/clang REQUIRE_NATIVE=1
          WHITEFOOT_CHECK_TIMEOUT=180 perl .github/run-check.pl linux-deque-tsan make -C compiler -j2 sched-deque-tsan CC=/usr/bin/clang

      - name: Thread sanitizer over the bridge and the ring
        run: WHITEFOOT_CHECK_TIMEOUT=180 perl .github/run-check.pl linux-runtime-tsan make -C compiler -j2 completion-tsan CC=/usr/bin/clang REQUIRE_NATIVE=1

  completion-windows:
    name: completion-windows (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Record the host
        run: |
          clang --version
          systeminfo | grep -E '^(OS Name|OS Version|System Type|Total Physical Memory)' || true

      - name: Construct Windows native test images once
        timeout-minutes: 5
        run: |
          if ! command -v make > /dev/null; then
            choco install make --yes --no-progress
          fi
          make --version
          make -C compiler -j2 completion-windows-cross WINDOWS_CC=clang SHELL=bash \
            COMPLETION_TMP="$(cygpath -u "$RUNNER_TEMP")/completion"


      - name: Exercise native deque reuse and live counters
        run: |
          "$RUNNER_TEMP/completion/windows-sched-deque.exe"
          "$RUNNER_TEMP/completion/windows-sched-deque-no-stats.exe"

      - name: Native Windows CPU policy and wait integration
        run: |
          WF_WORKERS=2 "$RUNNER_TEMP/completion/windows-sched-cpu-levels.exe" host
          "$RUNNER_TEMP/completion/windows-sched-cpu-levels.exe" wake
          make -C compiler sched-split-policy-cases WINDOWS_CC=clang SHELL=bash \
            COMPLETION_TMP="$(cygpath -u "$RUNNER_TEMP")/completion" \
            SCHED_POLICY_EXE="$(cygpath -u "$RUNNER_TEMP")/completion/windows-sched-cpu-levels.exe"
          for mode in fit oversubscribed unknown-count mixed; do
            WF_WORKERS=4 "$RUNNER_TEMP/completion/windows-sched-cpu-levels.exe" "$mode"
          done

      - name: Exercise compute startup failures and frame lifetime
        run: |
          for mode in normal owner-fail worker-fail partial partial-three startup-delayed startup-partial; do
            WF_WORKERS=4 "$RUNNER_TEMP/completion/windows-sched-smoke.exe" "$mode"
          done
          WF_WORKERS=1 "$RUNNER_TEMP/completion/windows-sched-smoke.exe"
          set +e
          WF_WORKERS=invalid "$RUNNER_TEMP/completion/windows-sched-smoke.exe" \
            > "$RUNNER_TEMP/completion/startup.out" 2> "$RUNNER_TEMP/completion/startup.err"
          status=$?
          set -e
          test "$status" = 1
          test ! -s "$RUNNER_TEMP/completion/startup.out"
          tr -d '\r' < "$RUNNER_TEMP/completion/startup.err" > "$RUNNER_TEMP/completion/startup.normalized"
          printf '%s\n' 'whitefoot scheduler: WF_WORKERS must be an integer from 0 through 64' | \
            cmp - "$RUNNER_TEMP/completion/startup.normalized"

      - name: Run the Windows default-route probe on both routes
        run: |
          # Show every run before judging it.  A process that ends through
          # `abort()` under the release UCRT takes the fast-fail path, which
          # Git bash reports as exit 127, and the only thing that says which
          # fail-stop fired is the line the runtime wrote on its way out.  A
          # step that stops at the failing command under `set -e` never shows
          # that line, which is how the previous shape of this step turned an
          # named fail-stop into an undiagnosable number.
          show() {
            echo "--- $1: stdout ---"
            tr -d $'\r' < "$2" || true
            echo "--- $1: stderr ---"
            tr -d $'\r' < "$3" || true
            echo "--- $1: exit status: $4 ---"
          }
          record="$RUNNER_TEMP/completion/windows-default-route"
          set +e
          "$RUNNER_TEMP/completion/windows-default-route-probe.exe" \
            "$RUNNER_TEMP/completion" \
            > "$record-ring.out" 2> "$record-ring.txt"
          ring_status=$?
          set -e
          show "native ring" "$record-ring.out" "$record-ring.txt" "$ring_status"
          test "$ring_status" -eq 0 || exit "$ring_status"
          tr -d $'\r' < "$record-ring.txt" | grep -F 'route=native-ring' > /dev/null
          set +e
          WF_IO_NO_NATIVE_RING=1 \
            "$RUNNER_TEMP/completion/windows-default-route-probe.exe" \
            "$RUNNER_TEMP/completion" \
            > "$record-adapter.out" 2> "$record-adapter.txt"
          adapter_status=$?
          set -e
          show "bounded adapter" "$record-adapter.out" "$record-adapter.txt" \
            "$adapter_status"
          test "$adapter_status" -eq 0 || exit "$adapter_status"
          tr -d $'\r' < "$record-adapter.txt" | grep -F 'route=posix-adapter' > /dev/null

      # This image owns direct engine publication and shares compatible native
      # objects with the bridge images. The ring's real operations are evidence.
      - name: Run the Windows native adapter probe
        run: |
          probe_dir="$RUNNER_TEMP/completion"
          set +e
          "$probe_dir/windows-adapter-probe.exe" \
            "$probe_dir/adapter.data" \
            > "$probe_dir/adapter-probe.out" 2> "$probe_dir/adapter-probe.err"
          status=$?
          set -e
          echo "--- native adapter probe: stdout ---"
          tr -d $'\r' < "$probe_dir/adapter-probe.out" || true
          echo "--- native adapter probe: stderr ---"
          tr -d $'\r' < "$probe_dir/adapter-probe.err" || true
          echo "--- native adapter probe: exit status: ${status} ---"
          exit "$status"

      - name: Run ordinary values through the production native bodies
        run: |
          probe_dir="$RUNNER_TEMP/completion/ordinary-values"
          mkdir -p "$probe_dir"
          "$RUNNER_TEMP/completion/windows-ordinary-values-probe.exe" "$probe_dir" text
          for helpers in 0 2; do
            for group in file directory tcp; do
              WF_IO_HELPERS="$helpers" \
                "$RUNNER_TEMP/completion/windows-ordinary-values-probe.exe" "$probe_dir" "$group"
            done
          done

      # Only the bridge object replaces initialization and the terminal abort.
      # Other objects retain their production definitions and are reused.
      - name: Require Windows bridge initialization to fail stop
        run: |
          fault_dir="$RUNNER_TEMP/completion/windows-bridge-init-fault"
          mkdir -p "$fault_dir"
          set +e
          WF_IO_NO_NATIVE_RING=0 WF_IO_HELPERS=1 \
            "$RUNNER_TEMP/completion/windows-bridge-init-fail-stop-probe.exe" \
            > "$fault_dir/stdout.txt" 2> "$fault_dir/stderr.txt"
          status=$?
          set -e
          echo "--- bridge initialization fault: stdout ---"
          tr -d $'\r' < "$fault_dir/stdout.txt" || true
          echo "--- bridge initialization fault: stderr ---"
          tr -d $'\r' < "$fault_dir/stderr.txt" || true
          echo "--- bridge initialization fault: exit status: ${status} ---"
          if [ "$status" -ne 86 ]; then
            echo "bridge initialization fault exited ${status}, expected 86" >&2
            exit 1
          fi
          if [ -s "$fault_dir/stdout.txt" ]; then
            echo "bridge initialization fault wrote program output" >&2
            exit 1
          fi
          # The bridge's fail-stop names itself before it ends the process
          # (`completion/bridge.c`, `wf_bridge_fail`), and that line is the
          # evidence that the *initialization* fail-stop is the one that fired
          # rather than some other abort on the way.
          tr -d $'\r' < "$fault_dir/stderr.txt" > "$fault_dir/stderr.normalized"
          printf '%s\n' 'whitefoot completion: the completion bridge could not initialize' \
            > "$fault_dir/expected.txt"
          cmp "$fault_dir/expected.txt" "$fault_dir/stderr.normalized"

      # A native adapter probe can pass while the compiler still emits a Unix
      # bootstrap or the shipped driver forgets one Windows runtime unit. This
      # is the production boundary: native whitefootc emits and links a real
      # .wf program, whose two argument paths are UTF-16, whose files are
      # opened relative to Inputs.cwd, whose first independent read_at must
      # submit to IOCP, and whose bytes leave through OutputStream.write_once. The
      # opt-in runtime assertion aborts at process exit unless at least one
      # IOCP submission was also reaped, so a silent direct fallback cannot
      # satisfy this step.
      - name: Construct and run shared Windows program cases
        timeout-minutes: 8
        env:
          CARGO_BUILD_JOBS: 2
          RUST_TEST_THREADS: 2
          RUST_MIN_STACK: 8388608
        run: |
          cargo test --manifest-path compiler/Cargo.toml --profile gate --locked \
            --test corpus -- programs::windows:: programs::network:: native_windows::

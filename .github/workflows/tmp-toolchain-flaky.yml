# Temporary (board item wf-toolchain-test-flaky); remove before the branch is ready.
# Runs the toolchain unit tests many times at high thread counts, the way the
# gate's unit group ran them when one failed, and prints the error text of
# every failure, so that a cause (the exec of a just-written script failing
# with ETXTBSY, "Text file busy") is read from a log rather than inferred.
name: tmp-toolchain-flaky

on:
  push:
    branches: [wf-toolchain-test-flaky]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

# One group per commit: the run on the commit before a fix keeps going, so its
# result can be read beside the fixed commit's.
concurrency:
  group: tmp-toolchain-flaky-${{ github.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
  WHITEFOOT_CHECK_TIMEOUT: 1800

jobs:
  loop:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    name: toolchain tests in a loop
    steps:
      - uses: actions/checkout@v4
      - name: Install the host toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          sudo sysctl -w kernel.core_pattern=core
          rustup default stable
          nproc
          grep -m 1 'model name' /proc/cpuinfo
      - name: Build the library tests
        run: |
          perl .github/run-check.pl tft-fetch cargo fetch --locked --manifest-path compiler/Cargo.toml
          perl .github/run-check.pl tft-build cargo test --manifest-path compiler/Cargo.toml --profile gate --locked --offline --lib --no-run
      - name: Run the toolchain tests in a loop
        run: |
          bin=$(cargo test --manifest-path compiler/Cargo.toml --profile gate --locked --offline --lib --no-run --message-format=json 2>/dev/null \
            | jq -r 'select(.reason=="compiler-artifact" and .profile.test==true and .executable!=null) | .executable' | tail -1)
          echo "test binary: $bin"
          cd compiler
          out="$RUNNER_TEMP/loop"
          mkdir -p "$out"
          # Four loops at once, each with sixteen test threads: the tests that
          # write a script and start it run at the same moment, as they do in
          # the unit group.
          loop() {
            fails=0
            for i in $(seq 1 "$2"); do
              if ! "$bin" toolchain:: --test-threads=16 > "$out/run-$1.txt" 2>&1; then
                fails=$((fails + 1))
                { echo "== loop $1 iteration $i"; grep -E -A8 '^---- |panicked|Text file busy' "$out/run-$1.txt"; } >> "$out/failures-$1.txt"
              fi
            done
            echo "$fails" > "$out/fails-$1"
          }
          iterations=${ITERATIONS:-500}
          for worker in 1 2 3 4; do loop "$worker" "$iterations" & done
          wait
          total=0
          for worker in 1 2 3 4; do total=$((total + $(cat "$out/fails-$worker"))); done
          cat "$out"/failures-*.txt 2>/dev/null || true
          echo "toolchain tests: $total failures in $((iterations * 4)) runs"
          echo "toolchain tests: $total failures in $((iterations * 4)) runs" >> "$GITHUB_STEP_SUMMARY"
          test "$total" -eq 0

  # The same operations the tests perform (write a script, make it executable,
  # start it), with sixteen threads doing so at once and nothing else in the
  # process. `old` counts how often the first start of a just-written script
  # fails with ETXTBSY; `new` also waits for the start to succeed once and
  # then requires every later start to succeed.
  stress:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    name: start of a just-written script
    steps:
      - name: Build and run the stress program
        run: |
          mkdir -p "$RUNNER_TEMP/stress-src" "$RUNNER_TEMP/stress-files"
          cat > "$RUNNER_TEMP/stress-src/stress.rs" <<'EOF'
          use std::io::{self, ErrorKind};
          use std::os::unix::fs::PermissionsExt;
          use std::path::{Path, PathBuf};
          use std::process::Command;
          use std::sync::atomic::{AtomicUsize, Ordering};
          use std::time::Duration;
          use std::{fs, thread};

          const SCRIPT: &str = "#!/bin/sh\nprintf '%s\\n' 'fake bundled clang 22'\n";

          fn start(path: &Path) -> io::Result<()> {
              Command::new(path).arg("--version").output().map(|_| ())
          }

          fn busy(result: &io::Result<()>) -> bool {
              matches!(result, Err(error) if error.kind() == ErrorKind::ExecutableFileBusy)
          }

          fn main() {
              let arguments: Vec<String> = std::env::args().collect();
              let barrier = arguments[1] == "new";
              let threads: usize = arguments[2].parse().unwrap();
              let iterations: usize = arguments[3].parse().unwrap();
              let directory = PathBuf::from(&arguments[4]);
              let first_busy = AtomicUsize::new(0);
              let retries = AtomicUsize::new(0);
              let later_failed = AtomicUsize::new(0);
              thread::scope(|scope| {
                  for worker in 0..threads {
                      let (directory, first_busy, retries, later_failed) =
                          (&directory, &first_busy, &retries, &later_failed);
                      scope.spawn(move || {
                          for iteration in 0..iterations {
                              let path = directory.join(format!("clang-{worker}-{iteration}"));
                              fs::write(&path, SCRIPT).unwrap();
                              fs::set_permissions(&path, fs::Permissions::from_mode(0o755)).unwrap();
                              let mut result = start(&path);
                              if busy(&result) {
                                  first_busy.fetch_add(1, Ordering::Relaxed);
                              }
                              if barrier {
                                  while busy(&result) {
                                      thread::sleep(Duration::from_millis(1));
                                      retries.fetch_add(1, Ordering::Relaxed);
                                      result = start(&path);
                                  }
                              }
                              if let Err(error) = &result {
                                  if !busy(&result) {
                                      panic!("{}: {error}", path.display());
                                  }
                              }
                              if barrier && start(&path).is_err() {
                                  later_failed.fetch_add(1, Ordering::Relaxed);
                              }
                              fs::remove_file(&path).unwrap();
                          }
                      });
                  }
              });
              println!(
                  "mode {}: {} threads, {} scripts, first start busy {}, retries {}, later starts failed {}",
                  arguments[1],
                  threads,
                  threads * iterations,
                  first_busy.load(Ordering::Relaxed),
                  retries.load(Ordering::Relaxed),
                  later_failed.load(Ordering::Relaxed)
              );
              if later_failed.load(Ordering::Relaxed) != 0 {
                  std::process::exit(1);
              }
          }
          EOF
          rustc --version
          nproc
          rustc -O -o "$RUNNER_TEMP/stress-src/stress" "$RUNNER_TEMP/stress-src/stress.rs"
          for mode in old new old new; do
            "$RUNNER_TEMP/stress-src/stress" "$mode" 16 3000 "$RUNNER_TEMP/stress-files" | tee -a "$GITHUB_STEP_SUMMARY"
          done

  # The new test of the helper must fail when the helper stops waiting: the
  # guard that retries a busy start is switched off and the test is run.
  broken-helper:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    name: the helper test with the wait removed
    steps:
      - uses: actions/checkout@v4
      - name: Install the host toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          rustup default stable
      - name: Remove the wait, then run the test
        run: |
          sed -i 's/Err(error) if error.kind() == ErrorKind::ExecutableFileBusy => {/Err(error) if false \&\& error.kind() == ErrorKind::ExecutableFileBusy => {/' compiler/src/toolchain/resolution.rs
          git diff --stat
          git diff | grep '^[-+] ' | head
          perl .github/run-check.pl tft-fetch cargo fetch --locked --manifest-path compiler/Cargo.toml
          if perl .github/run-check.pl tft-broken cargo test --manifest-path compiler/Cargo.toml --profile gate --locked --offline --lib -- toolchain::resolution::tests::a_script_open_for_writing_is_waited_for 2>&1 | tee "$RUNNER_TEMP/broken.txt"; then
            echo "the helper test passed with the wait removed"
            exit 1
          fi
          grep -E "Text file busy|test result: FAILED" "$RUNNER_TEMP/broken.txt"
          grep -q "cannot start .*Text file busy" "$RUNNER_TEMP/broken.txt"
          echo "the helper test fails with the wait removed, with the busy error"

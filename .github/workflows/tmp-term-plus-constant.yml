# Temporary (coord-wfbl-01-09): the checks a change to ENT-3.S4, its two log
# entries, the design node and nine conformance cases touches, which a draft
# pull request's gate skips: the static group (specification and log form,
# design-tree lint against the merge base, conformance structure and coverage),
# the readiness check, and the native conformance adapter over the manifest.
# The proof model runs in proof.yml on every push. Removed before the full
# check.
name: tmp-term-plus-constant

on:
  push:
    branches: [claude/term-plus-constant]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0

jobs:
  static:
    name: static and design-ready
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Set the scratch root
        run: echo "WHITEFOOT_SCRATCH_ROOT=$RUNNER_TEMP/whitefoot" >> "$GITHUB_ENV"

      - name: Name main as a local ref
        run: |
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          git branch -f main origin/main

      - name: Select the design review base
        run: echo "DESIGN_REVIEW_BASE=$(git merge-base main HEAD)" >> "$GITHUB_ENV"

      - name: Install the host toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          rustup default stable
          rustup component add clippy rustfmt
          cargo --version

      - name: Fetch locked compiler dependencies
        run: cargo fetch --locked --manifest-path compiler/Cargo.toml

      - name: Decline core dumps
        run: sudo sysctl -w kernel.core_pattern=core

      - name: static
        env:
          WHITEFOOT_CHECK_TIMEOUT: 2400
        run: make check-group GROUP=static

      - name: design-ready
        run: make design-ready

  conformance:
    name: conformance adapter
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Set the scratch root
        run: echo "WHITEFOOT_SCRATCH_ROOT=$RUNNER_TEMP/whitefoot" >> "$GITHUB_ENV"

      - name: Install the host toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          rustup default stable
          cargo --version

      - name: Fetch locked compiler dependencies
        run: cargo fetch --locked --manifest-path compiler/Cargo.toml

      - name: Decline core dumps
        run: sudo sysctl -w kernel.core_pattern=core

      - name: conformance-run
        env:
          WHITEFOOT_CHECK_TIMEOUT: 2400
        run: make conformance-run

  probe:
    name: const-generic probe
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Set the scratch root
        run: echo "WHITEFOOT_SCRATCH_ROOT=$RUNNER_TEMP/whitefoot" >> "$GITHUB_ENV"

      - name: Install the host toolchain
        run: |
          rustup default stable
          cargo --version

      - name: Fetch locked compiler dependencies
        run: cargo fetch --locked --manifest-path compiler/Cargo.toml

      - name: Build the compiler
        env:
          WHITEFOOT_CHECK_TIMEOUT: 2400
        run: perl .github/run-check.pl tmp-probe-build cargo build --profile gate --manifest-path compiler/Cargo.toml --locked --offline --bin whitefootc

      - name: Check the probes
        run: |
          set -u
          dir="$RUNNER_TEMP/probes"
          mkdir -p "$dir"
          chain='fn pick<const n: u32>(i: u32, b: u32, c: u32, m: u32) -> out: u32 pure contract {
            requires i < 100_u32;
            requires b < 100_u32;
            requires c < 100_u32;
            requires i + n <= b;
            requires b + n <= c;
            requires c + n <= m;
          } {
            let j1 = i + n;
            let j2 = j1 + n;
            let j3 = j2 + n;
            let out = m - j3;
            return out;
          }
          '
          printf '%s\nfn main() -> status: std::process::ExitStatus pure {\n  return std::process::exit_status(code: 0_u8);\n}\n' "$chain" > "$dir/const_generic_uninstantiated.wf"
          printf '%s\nfn main() -> status: std::process::ExitStatus pure {\n  let out = pick::<1>(i: 0_u32, b: 1_u32, c: 2_u32, m: 3_u32);\n  return std::process::exit_status(code: 0_u8);\n}\n' "$chain" > "$dir/const_generic_instantiated.wf"
          bin=$(find compiler/target -name whitefootc -type f -path '*gate*' | head -1)
          echo "compiler: $bin"
          for f in "$dir"/*.wf; do
            echo "=== $f"
            cat -n "$f"
            status=0
            "$bin" --check "$f" || status=$?
            echo "exit status: $status"
          done

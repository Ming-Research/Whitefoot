# Temporary claude/guard-fairness workflow; remove before ready.
# Shows once that the new shared-object cases fail under the mutants they
# guard: each case passes unmutated, then fails with its message mutated.
name: tmp-guard-mutants
on:
  workflow_dispatch:
  push:
    branches: [claude/guard-fairness]
    paths: [.github/workflows/tmp-guard-mutants.yml]
jobs:
  mutants:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld
      - name: Controls and mutants
        run: |
          set -u
          status=0
          run_case() {
            SHARED_OBJECT_TEST_CASE="$1" timeout 300s make -C compiler shared-object-test > "$RUNNER_TEMP/out.txt" 2>&1
            code=$?
            tail -5 "$RUNNER_TEMP/out.txt"
            return $code
          }
          expect_pass() {
            if run_case "$1"; then echo "PASS control $1"; else echo "FAIL control $1 did not pass"; status=1; fi
          }
          expect_fail() {
            name=$1 case=$2 message=$3
            if run_case "$case"; then
              echo "FAIL mutant $name: case $case passed"; status=1
            elif grep -qF "$message" "$RUNNER_TEMP/out.txt"; then
              echo "PASS mutant $name: case $case failed with its message"
            else
              echo "FAIL mutant $name: case $case failed for another reason"; status=1
            fi
          }
          for case in rescan rescan-late group-turn; do expect_pass "$case"; done
          bridge=compiler/src/backend/completion/bridge.c
          table=compiler/src/backend/keyed_table.c
          # M1: the rescan is never requested.
          perl -0pi -e 's/\n        owner->guard_rescan = 1u;\n/\n/ or die "M1 not applied"' "$bridge"
          expect_fail M1 rescan "an older watch behind the sweep cursor"
          expect_fail M1 rescan-late "a watch registered past the write's cutoff"
          git checkout -- "$bridge"
          # M2: the rescan check ignores the write's cutoff.
          perl -0pi -e 's/&& newest->watch->context->guard_started <= owner->guard_cutoff\)/&& 1)/ or die "M2 not applied"' "$bridge"
          expect_fail M2 rescan-late "a watch registered past the write's cutoff"
          git checkout -- "$bridge"
          # M3: the first group never parks on a reservation.
          perl -0pi -e 's/if \(count == 0 \|\| targets\[0\]\.hold != NULL\) \{/if (1) {/ or die "M3 not applied"' "$table"
          expect_fail M3 group-turn "a first group took an object a live reservation keeps"
          git checkout -- "$table"
          exit $status

# Temporary claude/guard-fairness workflow; remove before ready.
# Shows once that the new shared-object cases fail under the mutants they
# guard: each case passes unmutated, then fails with its message mutated.
name: tmp-guard-mutants
on:
  workflow_dispatch:
  push:
    branches: [claude/guard-fairness]
    paths: [.github/workflows/tmp-guard-mutants.yml]
jobs:
  mutants:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld
      - name: Controls and mutants
        run: |
          set -u
          status=0
          run_case() {
            SHARED_OBJECT_TEST_CASE="$1" timeout 300s make -C compiler shared-object-test > "$RUNNER_TEMP/out.txt" 2>&1
            code=$?
            tail -5 "$RUNNER_TEMP/out.txt"
            return $code
          }
          expect_pass() {
            if run_case "$1"; then echo "PASS control $1"; else echo "FAIL control $1 did not pass"; status=1; fi
          }
          expect_fail() {
            name=$1 case=$2 message=$3
            if run_case "$case"; then
              echo "FAIL mutant $name: case $case passed"; status=1
            elif grep -qF "$message" "$RUNNER_TEMP/out.txt"; then
              echo "PASS mutant $name: case $case failed with its message"
            else
              echo "FAIL mutant $name: case $case failed for another reason"; status=1
            fi
          }
          for case in group-turn group-release rescan-borrowed; do expect_pass "$case"; done
          bridge=compiler/src/backend/completion/bridge.c
          table=compiler/src/backend/keyed_table.c
          # A2: the later members are taken before the first is acquired.
          perl -0pi -e 's/(    if \(wf__shared_acquire\(targets\[0\]\.object, 1, frame\)\)\n        return 1;\n)(    atomic_group_take_from\(targets, count, atomic_group_run\(targets, count, 0\)\);\n)/$2$1/ or die "A2 not applied"' "$table"
          expect_fail A2 group-turn "a parked first group held a later member"
          git checkout -- "$table"
          # B: a group release ignores its members' write flags.
          perl -0pi -e 's/            if \(wrote\)\n                wf__shared_unlock\(/            if (wrote || 1)\n                wf__shared_unlock(/ or die "B not applied"' "$table"
          expect_fail B group-release "a group release marked unwritten entered the wake"
          git checkout -- "$table"
          # C: a borrowed hold's give-back never sweeps again.
          perl -0pi -e 's/(static wf_context \*wf_shared_give_back_locked\(.*?\n    )if \(rescan\) \{/$1if (rescan \&\& 0) {/s or die "C not applied"' "$bridge"
          sed -n '/^static wf_context \*wf_shared_give_back_locked/,/^}/p' "$bridge" | grep -n 'rescan && 0'
          sed -n '/^static wf_context \*wf_shared_end_hold_locked/,/^}/p' "$bridge" | grep -c 'rescan && 0' | grep -qx 0 || { echo "C touched the ordinary release"; exit 1; }
          expect_fail C rescan-borrowed "a borrowed hold's release did not sweep again"
          git checkout -- "$bridge"
          exit $status

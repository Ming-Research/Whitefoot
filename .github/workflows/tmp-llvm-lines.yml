# Temporary (wf-gate-budget-noise): removed before the branch is ready.
#
# Question: how much of the unit test build's LLVM IR is monomorphized copies
# of the semantic test helpers (`with_resolved_semantics_inputs` and its
# callers, each generic over the caller's closure), and is that share large
# enough to explain why the semantic test module costs more than its lines?
#
# The lib is compiled in test mode as `cargo test --lib` compiles it, with one
# codegen unit and unoptimized IR so the counts are per-instance sizes before
# inlining. The script groups every `define` by its legacy-mangled path with
# the hash removed and prints count and total lines per path.
name: tmp-llvm-lines

on:
  push:
    branches: [wf-gate-budget-noise]
    paths: ['.github/workflows/tmp-llvm-lines.yml']

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0

jobs:
  lines:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install the host toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          rustup default stable
          cargo --version

      - name: Fetch locked compiler dependencies
        run: cargo fetch --locked --manifest-path compiler/Cargo.toml

      - name: Emit the unit test build's IR
        run: |
          grep -m 1 'model name' /proc/cpuinfo
          cd compiler
          perl ../.github/run-check.pl emit-ir cargo rustc --lib --profile test --locked --offline -- \
            --emit=llvm-ir -C codegen-units=1 -C no-prepopulate-passes -C opt-level=0
          find target -name '*.ll' -size +1M -exec ls -l {} +

      - name: Count lines per function path
        run: |
          python3 -I .github/tmp-llvm-lines.py compiler/target | tee -a "$GITHUB_STEP_SUMMARY"

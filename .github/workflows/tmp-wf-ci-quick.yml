# Temporary quick check for wf-ci-quick, a push to the work branch triggers it.
# Delete it before the full check: the gate fails while a tmp- workflow exists.
name: tmp-wf-ci-quick

on:
  push:
    branches-ignore: [main]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: tmp-wf-ci-quick-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Name main as a local ref and pick the design review base
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          git branch -f main origin/main
          design_review_base=$(sh design/skill/review-base.sh "$GITHUB_EVENT_NAME" "$GITHUB_REF" "$PUSH_BEFORE")
          echo "DESIGN_REVIEW_BASE=$design_review_base" >> "$GITHUB_ENV"
          git log --oneline -1 "$design_review_base"

      - name: The gate-scope test
        run: sh .github/test-gate-scope.sh

      # Each altered copy of the decision script must fail the test, so the
      # test sees a wrong decision for every case it protects.
      - name: Watch the gate-scope test fail on altered decisions
        run: |
          work=$(mktemp -d)
          failed=0
          mutate() {
            cp .github/gate-scope.sh .github/test-gate-scope.sh "$work/"
            sed -i -e "$2" "$work/gate-scope.sh"
            if cmp -s .github/gate-scope.sh "$work/gate-scope.sh"; then
              echo "mutation '$1' changed nothing"
              failed=1
            elif sh "$work/test-gate-scope.sh" > "$work/out" 2>&1; then
              echo "NOT CAUGHT: $1"
              failed=1
            else
              echo "caught: $1"
              tail -n 8 "$work/out" | sed 's/^/    /'
            fi
          }
          mutate 'a push to a draft pull request runs' \
            's/decide false "push to draft pull request/decide true "push to draft pull request/'
          mutate 'a draft pull request opened or reopened runs' \
            's/decide false "pull request \$number \$action as a draft"/decide true "pull request \$number \$action as a draft"/'
          mutate 'marking ready skips although no manual run exists' \
            's/decide true "pull request \$number marked ready"/decide false "pull request $number marked ready"/'
          mutate 'marking ready runs although a manual run exists' \
            's/decide false "pull request \$number marked ready, and its head/decide true "pull request $number marked ready, and its head/'
          mutate 'the manual-run query drops the manual event' \
            's/ -f event=workflow_dispatch//'
          mutate 'the manual-run query drops the success status' \
            's/ -f status=success//'
          mutate 'the manual-run query always asks about gate.yml' \
            's|^\( *\)workflow=.*|\1workflow=gate.yml|'
          mutate 'a ready opening runs after its branch moved' \
            's/elif \[ "\$tip" != "\$head_sha" \]; then/elif false; then/'
          exit $failed

      # The filters the decision script sends, against the real API: a manual
      # run of the workflow is found by its head, and none for another head.
      - name: Ask the real API for a successful manual run
        run: |
          echo "workflow ref: $GITHUB_WORKFLOW_REF"
          echo "file name the script derives: $(basename "${GITHUB_WORKFLOW_REF%@*}")"
          ask() {
            gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/gate.yml/runs" \
              -f head_sha="$1" -f event=workflow_dispatch -f status=success -f per_page=1 \
              --jq '.workflow_runs[0].id // empty'
          }
          any=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/gate.yml/runs" \
            -f event=workflow_dispatch -f status=success -f per_page=1 \
            --jq '.workflow_runs[0] | "\(.id) \(.head_sha)"')
          echo "newest successful manual gate run: $any"
          id=${any% *}
          head=${any#* }
          found=$(ask "$head")
          echo "asked by its head $head: '$found'"
          test "$found" = "$id"
          none=$(ask "$GITHUB_SHA")
          echo "asked by this push's head $GITHUB_SHA: '$none'"
          test -z "$none"

      # The job's own script, taken from gate.yml, on a tree with a tmp- file
      # and on one without; the three changed workflows must also parse.
      - name: Watch the temporary-workflow job fail and pass
        run: |
          ruby -ryaml -e 'ARGV.each { |f| YAML.load_file(f); puts "parses: #{f}" }' \
            .github/workflows/gate.yml .github/workflows/io-hosts.yml .github/workflows/compute-regression.yml
          script=$(ruby -ryaml -e 'puts YAML.load_file(".github/workflows/gate.yml")["jobs"]["no-tmp-workflow"]["steps"].last["run"]')
          printf 'script under test:\n%s\n' "$script"
          work=$(mktemp -d)
          mkdir -p "$work/with/.github/workflows" "$work/without/.github/workflows"
          touch "$work/with/.github/workflows/gate.yml" "$work/with/.github/workflows/tmp-x.yml"
          touch "$work/without/.github/workflows/gate.yml"
          if (cd "$work/with" && bash -e -c "$script"); then
            echo "NOT CAUGHT: a tmp- file did not fail the job"
            exit 1
          fi
          echo "caught: the job fails with a tmp- file"
          (cd "$work/without" && bash -e -c "$script")

      - name: Repository invariants, guidance and prose checks
        run: |
          perl .github/run-check.pl quick/static make --no-print-directory repository-invariants guidance spec-prose-integrity

      - name: Design tree lint and readiness
        run: |
          perl .github/run-check.pl quick/design make --no-print-directory design-lint design-ready

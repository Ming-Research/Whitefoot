# Temporary: verifies the segment-table check fails without -z separate-code,
# and that the witness compiles with this branch's compiler. Removed before ready.
name: tmp-unwind-verify

on:
  push:
    branches: [claude/unwind-resume]

permissions:
  contents: read

jobs:
  flagless-must-fail:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install the host toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          rustup default stable
          cargo --version
          cargo fetch --locked --manifest-path compiler/Cargo.toml
      - name: Remove the link flag and expect the new check to fail
        run: |
          file=compiler/src/bin/whitefootc.rs
          sed -i 's/, "-Wl,-z,separate-code"\]/]/' "$file"
          grep -q 'LTO_LINKER: &\[&str\] = &\["-fuse-ld=lld"\];' "$file"
          set +e
          perl .github/run-check.pl lto-flagless cargo test --manifest-path compiler/Cargo.toml \
            --profile gate --locked --offline --bin whitefootc a_full_lto_build_runs_the_program \
            > "$RUNNER_TEMP/flagless.log" 2>&1
          status=$?
          set -e
          tail -40 "$RUNNER_TEMP/flagless.log"
          test "$status" -ne 0
          grep -q "the code segment's address equals its file offset" "$RUNNER_TEMP/flagless.log"
          echo "caught: the check fails without the flag, for the intended reason"

  witness-compiles:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install the host toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          rustup default stable
          cargo --version
          cargo fetch --locked --manifest-path compiler/Cargo.toml
      - name: Build the compiler and compile the witness
        run: |
          witness=$(find . -name witness.wf -path '*unwind-resume*' -not -path './.git/*')
          test -f "$witness"
          cargo build --manifest-path compiler/Cargo.toml --profile gate --locked --offline --bin whitefootc
          compiler/target/gate/whitefootc --check "$witness"
          compiler/target/gate/whitefootc -o "$RUNNER_TEMP/witness" "$witness"
          test -x "$RUNNER_TEMP/witness"
          echo "witness compiles and links with this branch's compiler"

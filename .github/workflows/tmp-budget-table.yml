# Temporary quick check for wf-gate-budget-epyc-first; removed before the full
# check. It runs the static stages that read the files this branch changes and
# compares the budget table's cells with main and with the recomputed table.
name: tmp-budget-table

on:
  push:
    branches: [wf-gate-budget-epyc-first]

permissions:
  contents: read

jobs:
  table:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Name main as a local ref
        run: |
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          git branch -f main origin/main
          git fetch --no-tags origin 6e4d6efbcb401d0ca6aa86035b8f822ffeaa5468
          git log --oneline -1 main

      - name: Static stages that read the changed files
        run: |
          perl .github/run-check.pl repository-invariants make --no-print-directory repository-invariants
          perl .github/run-check.pl guidance make --no-print-directory guidance

      - name: Table cells against main and the recomputed table
        run: |
          base=$(git merge-base main HEAD)
          git show "$base:.github/time-budgets.txt" > "$RUNNER_TEMP/main.txt"
          git show 6e4d6efbcb401d0ca6aa86035b8f822ffeaa5468:.github/time-budgets.txt > "$RUNNER_TEMP/recomputed.txt"
          cp .github/time-budgets.txt "$RUNNER_TEMP/mine.txt"
          cat > "$RUNNER_TEMP/cmp.py" <<'EOF'
          import sys
          COLS = ["epyc-7763", "epyc-9v74", "epyc-9v45", "xeon-8573c", "macos", "windows"]
          EPYC = COLS[:3]

          def table(path):
              t = {}
              for line in open(path):
                  if line.startswith("#") or not line.strip() or line.startswith(("cpu ", "label ")):
                      continue
                  f = line.split()
                  assert len(f) == 7, line
                  t[f[0]] = dict(zip(COLS, f[1:]))
              return t

          main, recomputed, mine = (table(p) for p in sys.argv[1:4])
          assert main.keys() == recomputed.keys() == mine.keys()
          bad = 0
          changed = 0
          for label in main:
              for c in COLS:
                  if mine[label][c] != main[label][c]:
                      changed += 1
                      print(f"changed {label} {c}: {main[label][c]} -> {mine[label][c]}")
                      if c not in EPYC:
                          print("  NOT an EPYC column")
                          bad += 1
                      elif mine[label][c] != recomputed[label][c]:
                          print(f"  differs from the recomputed table ({recomputed[label][c]})")
          unequal = [(l, c) for l in main for c in EPYC
                     if mine[l][c] != recomputed[l][c] and mine[l][c] == main[l][c]]
          print("cells changed against main:", changed)
          print("EPYC cells left at main's value although the recomputed table differs:")
          for l, c in unequal:
              print(f"  {l} {c}: main {main[l][c]}, recomputed {recomputed[l][c]}")
          sys.exit(1 if bad else 0)
          EOF
          python3 -I "$RUNNER_TEMP/cmp.py" "$RUNNER_TEMP/main.txt" "$RUNNER_TEMP/recomputed.txt" "$RUNNER_TEMP/mine.txt"

      - name: The times that failed fit in the new table, and failed in the old one
        run: |
          # cell <table> <label> <column-name>: the table's value for that cell.
          cell() {
            awk -v label="$2" -v col="$3" '
              $1 == "label" { for (i = 2; i <= NF; i++) if ($i == col) c = i; next }
              $1 == label { print $c }' "$1"
          }
          # fit <table>: print each failed time against its cell; exit 1 when
          # any time exceeds its cell.
          fit() {
            status=0
            while read -r label col seconds; do
              budget=$(cell "$1" "$label" "$col")
              if awk -v s="$seconds" -v b="$budget" 'BEGIN { exit !(s > b) }'; then
                echo "  OVER  $label $col: $seconds s > $budget s"
                status=1
              else
                echo "  fits  $label $col: $seconds s <= $budget s"
              fi
            done <<'TIMES'
          compiler/test-corpus epyc-7763 238.39
          compiler/test-corpus epyc-7763 243.90
          check/corpus epyc-7763 365.02
          compiler/test-corpus epyc-7763 238.49
          check/corpus epyc-9v45 238.89
          compiler/test-build-corpus epyc-9v45 90.05
          compiler/test-corpus epyc-9v45 148.77
          TIMES
            return $status
          }
          echo "new table:"
          fit .github/time-budgets.txt
          echo "main's table (every one of these cells must be over):"
          if fit "$RUNNER_TEMP/main.txt" > "$RUNNER_TEMP/old-fit.txt"; then
            cat "$RUNNER_TEMP/old-fit.txt"
            echo "the old table fits every time: this check detects nothing"
            exit 1
          fi
          cat "$RUNNER_TEMP/old-fit.txt"
          test "$(grep -c ' OVER ' "$RUNNER_TEMP/old-fit.txt")" -eq 7

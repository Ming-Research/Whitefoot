# Temporary quick check for coord-wfbl-04-21 (removed before the full check).
name: tmp-open-read-paths

on:
  push:

permissions:
  contents: read

concurrency:
  group: tmp-open-read-paths-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0

jobs:
  linux:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: static
            stage: static
          - name: runtime
            stage: runtime
          - name: programs
            stage: programs
          - name: adapter-1
            stage: adapter
            shard: 1/2
          - name: adapter-2
            stage: adapter
            shard: 2/2
          # The runtime sources of the base commit under the new tests: the
          # tests for the new rule must fail here (red before the fix).
          - name: base-runtime-programs
            stage: base-programs
          - name: base-runtime-adapter-1
            stage: base-adapter
            shard: 1/2
          - name: base-runtime-adapter-2
            stage: base-adapter
            shard: 2/2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Set the scratch root
        run: |
          echo "WHITEFOOT_SCRATCH_ROOT=$RUNNER_TEMP/whitefoot" >> "$GITHUB_ENV"
          echo "WHITEFOOT_TIME_BUDGET_RECORD=$RUNNER_TEMP/time-budget-overruns.txt" >> "$GITHUB_ENV"

      - name: Name main as a local ref
        run: |
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          git branch -f main origin/main
          git log --oneline -1 main

      - name: Select the design review base
        if: matrix.stage == 'static'
        run: |
          design_review_base=$(sh design/skill/review-base.sh "$GITHUB_EVENT_NAME" "$GITHUB_REF" "${{ github.event.before }}")
          echo "DESIGN_REVIEW_BASE=$design_review_base" >> "$GITHUB_ENV"
          git log --oneline -1 "$design_review_base"

      - name: Install the host toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          rustup default stable
          rustup component add clippy rustfmt
          cargo fetch --locked --manifest-path compiler/Cargo.toml
          sudo sysctl -w kernel.core_pattern=core

      # The base commit's runtime units replace the changed ones; the new
      # tests and cases stay.
      - name: Restore the base commit's runtime sources
        if: startsWith(matrix.stage, 'base-')
        run: |
          base=$(git merge-base origin/main HEAD)
          git checkout "$base" -- \
            compiler/src/backend/ordinary_values.c \
            compiler/src/backend/windows_runtime.c \
            compiler/src/backend/completion/file_posix.c \
            compiler/src/backend/completion/file_posix.h \
            compiler/src/backend/completion/linux_io_uring.c
          git status --short

      - name: static or runtime group
        if: matrix.stage == 'static' || matrix.stage == 'runtime'
        env:
          WHITEFOOT_CHECK_TIMEOUT: 900
        run: make check-group GROUP="${{ matrix.stage }}"

      - name: programs that read paths
        if: matrix.stage == 'programs' || matrix.stage == 'base-programs'
        continue-on-error: ${{ matrix.stage == 'base-programs' }}
        run: |
          set -o pipefail
          ulimit -c 0
          cargo test --manifest-path compiler/Cargo.toml --profile gate --test corpus --locked --offline -- \
            programs::open_read_paths:: programs::ordinary_io:: programs::wfgrep:: programs::host_paths:: \
            programs::traversal:: programs::file_replacement:: 2>&1 | tee "$RUNNER_TEMP/programs.log"

      - name: conformance adapter shard
        if: matrix.stage == 'adapter' || matrix.stage == 'base-adapter'
        continue-on-error: ${{ matrix.stage == 'base-adapter' }}
        env:
          WHITEFOOT_CONFORMANCE_SHARD: ${{ matrix.shard }}
        run: |
          set -o pipefail
          ulimit -c 0
          cargo test --manifest-path compiler/Cargo.toml --profile gate --test corpus --locked --offline -- \
            conformance::adapter:: --nocapture 2>&1 | tee "$RUNNER_TEMP/adapter.log"

      - name: Failing cases of the unfixed runtime
        if: startsWith(matrix.stage, 'base-')
        run: |
          grep -E "^test |^  Fail |test result|^failures:" "$RUNNER_TEMP"/*.log || true

  windows:
    name: windows
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      WINDOWS_CLANG: clang --target=x86_64-w64-windows-gnu
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned llvm-mingw
        timeout-minutes: 8
        run: |
          set -euo pipefail
          root=$(bash .github/toolchain/fetch-llvm-mingw.sh .github/toolchain/llvm-assets.json \
            "$RUNNER_TEMP/llvm-mingw-archives" "$RUNNER_TEMP/llvm-mingw" | tail -n 1)
          echo "LLVM_MINGW_ROOT=$root" >> "$GITHUB_ENV"
          cygpath -w "$root/bin" >> "$GITHUB_PATH"

      - name: Construct Windows native test images once
        timeout-minutes: 8
        run: |
          if ! command -v make > /dev/null; then
            choco install make --yes --no-progress
          fi
          make -C compiler -j2 completion-windows-cross WINDOWS_CC="$WINDOWS_CLANG" \
            WINDOWS_LLVM_CC="$WINDOWS_CLANG" SHELL=bash \
            COMPLETION_TMP="$(cygpath -u "$RUNNER_TEMP")/completion"

      - name: Run the file group of the ordinary values probe
        run: |
          probe_dir="$RUNNER_TEMP/completion/ordinary-values"
          mkdir -p "$probe_dir"
          for helpers in 0 2; do
            WF_IO_HELPERS="$helpers" \
              "$RUNNER_TEMP/completion/windows-ordinary-values-probe.exe" "$probe_dir" file
          done

      - name: Windows program cases that read paths
        timeout-minutes: 12
        env:
          CARGO_BUILD_JOBS: 2
          RUST_TEST_THREADS: 2
          RUST_MIN_STACK: 8388608
        run: |
          cargo test --manifest-path compiler/Cargo.toml --profile gate --locked \
            --test corpus -- programs::open_read_paths:: programs::host_paths:: programs::wfgrep_hosts::

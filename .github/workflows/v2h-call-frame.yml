# Temporary phase-3 call-frame comparison. Remove before this branch is ready.
# research-boundary: manual-only
# Runs on a push to this branch only when the commit message contains [14900k].
# Both generators use this branch's compiler. No timing threshold selects a
# verdict: the owner judges the paired gain against the old image's twin.
name: v2h-call-frame

on:
  push:
    branches: [claude/v2h-call-frame]
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Main revision supplying old gen.py and its matching templates
        type: string
        default: main

permissions:
  contents: read

concurrency:
  group: v2h-call-frame-14900k
  cancel-in-progress: false

jobs:
  compare:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[14900k]')
    runs-on: [self-hosted, 14900k]
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      BASELINE_REF: ${{ inputs.baseline_ref || 'main' }}
      LC_ALL: C
      V2H_CPUS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Record inputs and check the host is available
        run: |
          set -euo pipefail
          if [ -d "$HOME/.cargo/bin" ]; then
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          taskset -c "$V2H_CPUS" true
          lock="/tmp/whitefoot-check-$(id -u).lock"
          if [ -d "$lock" ]; then
            cat "$lock/pid" "$lock/command"
            pid=$(cat "$lock/pid")
            ps -p "$pid" -o pid=,args= || true
            echo 'Inspect the existing lock owner; this comparison will not remove it.' >&2
            exit 75
          fi
          out="$RUNNER_TEMP/v2h-call-frame-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$out/old-source"
          echo "V2H_OUT=$out" >> "$GITHUB_ENV"
          if [ "$BASELINE_REF" = main ]; then
            baseline=$(git rev-parse origin/main^{commit})
          else
            baseline=$(git rev-parse --verify "$BASELINE_REF^{commit}")
          fi
          git merge-base --is-ancestor "$baseline" origin/main
          printf '%s\n' "$baseline" > "$out/baseline-sha.txt"
          {
            printf 'branch/compiler %s\nbaseline %s\n' "$(git rev-parse HEAD)" "$baseline"
            printf 'iterations 2000\nrounds 7\nCPU time child user + system seconds\naffinity CPU %s\n' "$V2H_CPUS"
            uname -a
            lscpu
            /usr/bin/clang --version
            rustc --version
          } > "$out/inputs.txt"
          cat "$out/inputs.txt"

      - name: Build old and new with the branch compiler and copy the twin
        run: |
          set -euo pipefail
          out="$V2H_OUT"
          baseline=$(cat "$out/baseline-sha.txt")
          gen=research/experiments/match-dispatch/wasm/gen.py
          perl .github/run-check.pl v2h-call-frame/dependencies \
            cargo fetch --locked --manifest-path compiler/Cargo.toml
          perl .github/run-check.pl v2h-call-frame/compiler make -C compiler build
          git archive "$baseline" research/experiments/match-dispatch/wasm | tar -x -C "$out/old-source"
          python3 "$out/old-source/$gen" "$out/old.wf"
          python3 "$gen" "$out/new.wf"
          wfc="$PWD/compiler/target/gate/whitefootc"
          for form in old new; do
            perl .github/run-check.pl "v2h-call-frame/compile-$form" \
              "$wfc" --dispatch-ledger "$out/$form.wf" -o "$out/wasm-$form" \
              > "$out/compile-$form.log" 2>&1 || { status=$?; cat "$out/compile-$form.log"; exit "$status"; }
            cat "$out/compile-$form.log"
          done
          cp "$out/wasm-old" "$out/wasm-twin"
          cmp "$out/wasm-old" "$out/wasm-twin"
          sha256sum "$wfc" "$out"/*.wf "$out"/wasm-* > "$out/image-sha256.txt"
          perl .github/run-check.pl v2h-call-frame/module \
            git clone --quiet https://github.com/mbbill/Silverfir-nano "$out/sf"
          git -C "$out/sf" checkout --quiet 5f248e44
          git -C "$out/sf" rev-parse HEAD > "$out/module-repository-sha.txt"
          cp "$out/sf/benchmarks/wasi/coremark/coremark.wasm" "$out/coremark.wasm"
          sha256sum "$out/coremark.wasm" >> "$out/image-sha256.txt"

      - name: Check recursive, forward and indirect call frames before timing
        run: |
          set -euo pipefail
          out="$V2H_OUT"
          cat > "$out/fixtures.py" <<'PY'
          import csv
          import pathlib
          import subprocess
          import sys

          out = pathlib.Path(sys.argv[1])

          def uleb(value):
              data = bytearray()
              while value >= 128:
                  data.append((value & 127) | 128)
                  value >>= 7
              return bytes(data + bytes([value]))

          def section(number, data):
              return bytes([number]) + uleb(len(data)) + data

          def vector(parts):
              return uleb(len(parts)) + b"".join(parts)

          def body(locals_decl, instructions):
              data = locals_decl + instructions + b"\x0b"
              return uleb(len(data)) + data

          def assert_equal(expected):
              # All constants here fit in one signed LEB byte.
              return bytes([0x41, expected, 0x47, 0x04, 0x40, 0x00, 0x0b])

          # sum(n) = n + sum(n-1), sum(0) = 10. Each activation checks its
          # local starts at zero, sets it to n+1, then checks after recursion
          # that the local belongs to its own frame. Local 2 holds the result.
          sum_code = bytes([
              0x20, 1, 0x04, 0x40, 0x00, 0x0b,
              0x20, 0, 0x41, 1, 0x6a, 0x21, 1,
              0x20, 0, 0x45, 0x04, 0x7f, 0x41, 10, 0x05,
              0x20, 0, 0x20, 0, 0x41, 1, 0x6b, 0x10, 1, 0x6a, 0x0b,
              0x21, 2,
              0x20, 1, 0x20, 0, 0x41, 1, 0x6a, 0x47, 0x04, 0x40, 0x00, 0x0b,
              0x20, 2,
          ])
          direct_call = bytes([0x41, 3, 0x10, 1])
          indirect_call = bytes([0x41, 3, 0x41, 0, 0x11, 1, 0])

          def module(start_code, element):
              # _start comes before its recursive callee, requiring forward
              # resolution; the table contains the same callee when present.
              data = b"\x00asm\x01\x00\x00\x00"
              data += section(1, vector([b"\x60\x00\x00", b"\x60\x01\x7f\x01\x7f"]))
              data += section(3, vector([uleb(0), uleb(1)]))
              data += section(4, vector([b"\x70\x00\x01"]))
              data += section(7, vector([b"\x06_start\x00\x00"]))
              if element is not None:
                  data += section(9, vector([b"\x00\x41\x00\x0b" + vector([uleb(element)])]))
              data += section(10, vector([body(b"\x00", start_code), body(b"\x01\x02\x7f", sum_code)]))
              return data

          def start_checks(expected):
              return (direct_call + assert_equal(expected)) * 2 + indirect_call + assert_equal(expected)

          cases = [
              ("calls", module(start_checks(16), 1), 0),
              ("wrong-result", module(start_checks(17), 1), 106),
              ("null-table", module(indirect_call + b"\x1a", None), 105),
              ("wrong-signature", module(indirect_call + b"\x1a", 0), 105),
          ]
          with (out / "fixtures.tsv").open("w", newline="") as record:
              rows = csv.writer(record, delimiter="\t")
              rows.writerow(["engine", "fixture", "expected_exit", "actual_exit"])
              for name, data, expected in cases:
                  path = out / f"fixture-{name}.wasm"
                  path.write_bytes(data)
                  for engine in ["old", "new"]:
                      result = subprocess.run([str(out / f"wasm-{engine}"), path.name], cwd=out,
                                              capture_output=True, text=True, timeout=120, check=False)
                      stem = out / f"fixture-{name}-{engine}"
                      stem.with_suffix(".stdout").write_text(result.stdout)
                      stem.with_suffix(".stderr").write_text(result.stderr)
                      rows.writerow([engine, name, expected, result.returncode])
                      record.flush()
                      print(f"{engine} {name}: exit {result.returncode}, expected {expected}", flush=True)
                      if result.returncode != expected:
                          raise RuntimeError(f"{engine} {name}: exit {result.returncode}, expected {expected}")
          PY
          perl .github/run-check.pl v2h-call-frame/fixtures python3 "$out/fixtures.py" "$out"

      - name: Measure seven rotating rounds and validate every result
        run: |
          set -euo pipefail
          out="$V2H_OUT"
          cat > "$out/measure.py" <<'PY'
          import csv
          import importlib.util
          import math
          import pathlib
          import re
          import resource
          import statistics
          import subprocess
          import sys

          out = pathlib.Path(sys.argv[1])
          probe = pathlib.Path(sys.argv[2])
          cpus = sys.argv[3]
          spec = importlib.util.spec_from_file_location("coremark", probe)
          coremark = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(coremark)

          def validate(text, returncode):
              if returncode != 0:
                  raise ValueError(f"exit status {returncode}")
              score = re.search(r"Iterations/Sec\s*:\s*([0-9.]+)", text)
              crcs = dict(re.findall(r"\[0\](crc\w+)\s*:\s*(0x[0-9a-f]+)", text))
              if score is None or not math.isfinite(float(score.group(1))) or float(score.group(1)) <= 0:
                  raise ValueError("missing or invalid CoreMark score")
              if any(crcs.get(k) != v for k, v in coremark.EXPECTED.items()):
                  raise ValueError("wrong or missing list, matrix or state CRC")
              # Independent CoreMark 2K oracle recorded for wasmi and nano in DESIGN.md.
              if crcs.get("crcfinal") != "0x4983":
                  raise ValueError("wrong or missing final CRC")
              return float(score.group(1)), crcs["crcfinal"]

          good = "Iterations/Sec : 1\n" + "\n".join(
              f"[0]{key} : {value}" for key, value in {**coremark.EXPECTED, "crcfinal": "0x4983"}.items())
          validate(good, 0)
          corruptions = [
              (good, 1),
              (good.replace("Iterations/Sec", "missing-score"), 0),
              (good.replace("Iterations/Sec : 1", "Iterations/Sec : 0"), 0),
              (good.replace("0xe714", "0x0000"), 0),
              (good.replace("[0]crcstate", "missing-state"), 0),
              (good.replace("0x4983", "0x0000"), 0),
              (good.replace("[0]crcfinal", "missing-final"), 0),
          ]
          for text, status in corruptions:
              try:
                  validate(text, status)
              except ValueError:
                  continue
              raise RuntimeError("CoreMark validator accepted a damaged result")
          print("CoreMark validator rejected every deliberately damaged result", flush=True)

          names = ["old", "twin", "new"]
          pairs = []
          with (out / "runs.tsv").open("w", newline="") as raw, (out / "ratios.tsv").open("w", newline="") as paired:
              runs = csv.writer(raw, delimiter="\t")
              ratios = csv.writer(paired, delimiter="\t")
              runs.writerow(["round", "position", "engine", "cpu_seconds", "score", "crcfinal"])
              ratios.writerow(["round", "order", "old_cpu_seconds", "twin_cpu_seconds", "new_cpu_seconds", "new/old", "twin/old"])
              for round_index in range(7):
                  offset = round_index % 3
                  order = names[offset:] + names[:offset]
                  times = {}
                  for position, name in enumerate(order, 1):
                      before = resource.getrusage(resource.RUSAGE_CHILDREN)
                      process = subprocess.run(
                          ["taskset", "-c", cpus, str(out / f"wasm-{name}"), "coremark.wasm", "0x0", "0x0", "0x66", "2000"],
                          cwd=out, capture_output=True, text=True, timeout=120, check=False)
                      after = resource.getrusage(resource.RUSAGE_CHILDREN)
                      cpu = (after.ru_utime - before.ru_utime) + (after.ru_stime - before.ru_stime)
                      stem = out / f"round-{round_index + 1}-{name}"
                      stem.with_suffix(".stdout").write_text(process.stdout)
                      stem.with_suffix(".stderr").write_text(process.stderr)
                      score, final = validate(process.stdout, process.returncode)
                      if not math.isfinite(cpu) or cpu <= 0:
                          raise ValueError(f"{name}: invalid CPU time {cpu}")
                      times[name] = cpu
                      runs.writerow([round_index + 1, position, name, f"{cpu:.9f}", score, final])
                      raw.flush()
                      print(f"round {round_index + 1} position {position} {name}: CPU {cpu * 1000:.3f} ms, score {score}, final {final}", flush=True)
                  new_ratio = times["new"] / times["old"]
                  twin_ratio = times["twin"] / times["old"]
                  pairs.append((new_ratio, twin_ratio))
                  ratios.writerow([round_index + 1, ",".join(order), *(f"{times[name]:.9f}" for name in names), f"{new_ratio:.9f}", f"{twin_ratio:.9f}"])
                  paired.flush()
                  print(f"round {round_index + 1}: new/old {new_ratio:.6f}, twin/old {twin_ratio:.6f}", flush=True)
          summary = ["CPU ratios: lower than 1 means faster than old; no adoption verdict."]
          for index, label in enumerate(["new/old", "twin/old"]):
              values = [pair[index] for pair in pairs]
              summary.append(f"{label}: median {statistics.median(values):.6f}, min {min(values):.6f}, max {max(values):.6f}")
          (out / "summary.txt").write_text("\n".join(summary) + "\n")
          print("\n".join(summary), flush=True)
          PY
          perl .github/run-check.pl v2h-call-frame/measure \
            python3 "$out/measure.py" "$out" "$PWD/research/experiments/match-dispatch/wasm/coremark.py" "$V2H_CPUS"
          cat "$out/ratios.tsv"
          cat "$out/summary.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Retain the experiment inputs, raw outputs and paired CPU times
        if: always() && env.V2H_OUT != ''
        uses: actions/upload-artifact@v4
        with:
          name: v2h-call-frame-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.V2H_OUT }}/*.txt
            ${{ env.V2H_OUT }}/*.tsv
            ${{ env.V2H_OUT }}/*.log
            ${{ env.V2H_OUT }}/*.stdout
            ${{ env.V2H_OUT }}/*.stderr
            ${{ env.V2H_OUT }}/*.wf
            ${{ env.V2H_OUT }}/measure.py
            ${{ env.V2H_OUT }}/fixtures.py
            ${{ env.V2H_OUT }}/*.wasm
          if-no-files-found: error

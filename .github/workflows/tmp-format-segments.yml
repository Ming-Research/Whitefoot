# Temporary: runs the new segment-rejection comparison of the formatting
# request (coord-wfbl-10-05). Removed before the full check.
name: tmp-format-segments

on:
  push:
    branches: [claude/format-command]

permissions:
  contents: read

jobs:
  quick:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare the Rust toolchain
        run: |
          rustup default stable
          rustup component add clippy
          cargo fetch --locked --manifest-path compiler/Cargo.toml
      - name: Lint
        working-directory: compiler
        run: perl ../.github/run-check.pl tmp/lint cargo clippy --all-targets --locked --offline -- -D warnings
      - name: Formatting tests of the library
        working-directory: compiler
        run: perl ../.github/run-check.pl tmp/format-lib-tests cargo test --profile gate --locked --offline --lib -- formatting_tests

# Temporary (board item enum-route-check-cost); remove before the branch is ready.
# After the sixth merge of origin/main into the branch (main changed
# semantic/entailment and semantic/range_judgment, files this change also edits):
# a build of every test target of the merged tree, the change's own test module,
# then the whole unit suite, and the design tree's lint and readiness checks
# against the branch's merge base with main. The timings are in tmp-final-timing.
name: tmp-merge-check

on:
  push:
    branches: [claude/enum-route-check-cost]
    paths: [.github/workflows/tmp-merge-check.yml, 'compiler/**', 'design/**', 'research/**']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: tmp-merge-check-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
  WHITEFOOT_CHECK_TIMEOUT: 1800

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    name: unit tests
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and build the test targets
        run: |
          rustup default stable
          perl .github/run-check.pl thc-fetch cargo fetch --locked --manifest-path compiler/Cargo.toml
          perl .github/run-check.pl thc-unit-build cargo test --manifest-path compiler/Cargo.toml --profile gate --locked --offline --lib --no-run
      - name: Routed ensures tests
        run: |
          perl .github/run-check.pl thc-unit-routed cargo test --manifest-path compiler/Cargo.toml --profile gate --locked --offline --lib 'enum_routed_ensures'
      - name: All unit tests
        if: ${{ !cancelled() }}
        run: |
          perl .github/run-check.pl thc-unit-all cargo test --manifest-path compiler/Cargo.toml --profile gate --locked --offline --lib

  design-tree:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    name: design tree lint
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - name: Name main as a local ref
        run: |
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          git branch -f main origin/main
      - name: Tree lint and readiness against the merge base with main
        run: |
          base=$(git merge-base origin/main HEAD)
          git log --oneline -1 "$base"
          perl .github/run-check.pl thc-design-lint make design-lint DESIGN_REVIEW_BASE="$base"
          perl .github/run-check.pl thc-design-ready make design-ready DESIGN_REVIEW_BASE="$base"

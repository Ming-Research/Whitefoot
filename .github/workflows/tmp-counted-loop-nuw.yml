# Temporary (counted-loop-nuw): the checks the exact-operation change to the
# counted loop, range split and byte probe updates, its design node and its log
# entry touch, which a draft pull request's gate skips: the static group (design
# lint against the merge base, log form), the readiness check, and the tests
# that read the lowered and emitted shape of those updates. Removed before the
# full check.
name: tmp-counted-loop-nuw

on:
  push:
    branches: [claude/counted-add-exact]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0

jobs:
  static:
    name: static and design-ready
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Set the scratch root
        run: echo "WHITEFOOT_SCRATCH_ROOT=$RUNNER_TEMP/whitefoot" >> "$GITHUB_ENV"

      - name: Name main as a local ref
        run: |
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          git branch -f main origin/main

      - name: Select the design review base
        run: echo "DESIGN_REVIEW_BASE=$(git merge-base main HEAD)" >> "$GITHUB_ENV"

      - name: Install the host toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          rustup default stable
          rustup component add clippy rustfmt
          cargo --version

      - name: Fetch locked compiler dependencies
        run: cargo fetch --locked --manifest-path compiler/Cargo.toml

      - name: Decline core dumps
        run: sudo sysctl -w kernel.core_pattern=core

      - name: static
        env:
          WHITEFOOT_CHECK_TIMEOUT: 2400
        run: make check-group GROUP=static

      - name: design-ready
        run: make design-ready

  shape-tests:
    name: update shape tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Set the scratch root
        run: echo "WHITEFOOT_SCRATCH_ROOT=$RUNNER_TEMP/whitefoot" >> "$GITHUB_ENV"

      - name: Install the host toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          rustup default stable
          cargo --version

      - name: Fetch locked compiler dependencies
        run: cargo fetch --locked --manifest-path compiler/Cargo.toml

      - name: Decline core dumps
        run: sudo sysctl -w kernel.core_pattern=core

      - name: lowering and backend shape tests
        env:
          WHITEFOOT_CHECK_TIMEOUT: 2400
        run: >
          perl .github/run-check.pl shape-tests
          cargo test --manifest-path compiler/Cargo.toml --profile gate
          --locked --offline --lib
          backend::tests::arithmetic_obligations
          backend::tests::loop_split
          lowering::tests

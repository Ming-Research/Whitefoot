# Temporary: what the OP-5 redundant-condition rule itself adds to check time.
# One runner builds this branch's compiler and main's at the merge base, then
# checks this branch's program corpus with each in alternating
# rounds. Remove before this branch is ready.
name: main-check-compare

on:
  push:
    branches: [claude/redundant-test-r1]

concurrency:
  group: main-check-compare-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
  ROUNDS: 3

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build the branch and main compilers
        run: |
          rustup default stable
          base=$(git merge-base HEAD origin/main)
          echo "BASE=$base" >> "$GITHUB_ENV"
          git worktree add --detach "$RUNNER_TEMP/main" "$base"
          cargo fetch --locked --manifest-path compiler/Cargo.toml
          cargo fetch --locked --manifest-path "$RUNNER_TEMP/main/compiler/Cargo.toml"
          cargo build --manifest-path compiler/Cargo.toml --profile gate --locked --offline
          cargo build --manifest-path "$RUNNER_TEMP/main/compiler/Cargo.toml" --profile gate --locked --offline
          printf 'branch %s\nmain %s\n' "$(git rev-parse HEAD)" "$base"
          lscpu | grep -E 'Model name'
      - name: Check this branch's program corpus in alternating rounds
        run: |
          # The pinned Snowghost oracle modules hold redundant conditions this
          # branch rejects, so their times compare a rejection with an
          # acceptance. The branch's own migrated programs are accepted by both.
          branch=compiler/target/gate/whitefootc
          main="$RUNNER_TEMP/main/compiler/target/gate/whitefootc"
          results="$RUNNER_TEMP/check-times.tsv"
          printf 'round\tside\tprogram\tstatus\tseconds\n' > "$results"
          for round in $(seq 1 "$ROUNDS"); do
            for side in main branch; do
              if [ "$side" = main ]; then compiler=$main; else compiler=$branch; fi
              for program in tests/programs/*.wf; do
                start=$(date +%s.%N)
                set +e
                timeout 600 "$compiler" --check "$program" > /dev/null 2>&1
                status=$?
                set -e
                end=$(date +%s.%N)
                printf '%s\t%s\t%s\t%s\t%.3f\n' "$round" "$side" "$program" "$status" "$(echo "$end - $start" | bc)" >> "$results"
              done
            done
          done
          python3 - "$results" <<'PY'
          import collections, statistics, sys
          rows = [line.rstrip('\n').split('\t') for line in open(sys.argv[1])][1:]
          status = collections.defaultdict(set)
          for _, side, program, code, _ in rows:
              status[program].add((side, code))
          both = {p for p, s in status.items() if s == {('main', '0'), ('branch', '0')}}
          print(f'programs accepted by both compilers in every round: {len(both)} of {len(status)}')
          for p, s in sorted(status.items()):
              if p not in both:
                  print(f'excluded {p}: {sorted(s)}')
          totals = collections.defaultdict(float)
          for round_, side, program, code, seconds in rows:
              if program in both:
                  totals[(side, round_)] += float(seconds)
          for side in ('main', 'branch'):
              values = [totals[(side, r)] for r in sorted({r for _, r in totals})]
              print(f'RESULT side={side} rounds=' + ','.join(f'{v:.2f}' for v in values) + f' median={statistics.median(values):.2f}')
          main = statistics.median([v for (s, _), v in totals.items() if s == 'main'])
          branch = statistics.median([v for (s, _), v in totals.items() if s == 'branch'])
          print(f'RESULT branch/main={branch / main:.3f}')
          PY
      - name: Check Halo and Snowghost in alternating rounds
        run: |
          # The owner's reopening condition for this rule's cost: no program's
          # check slows by more than 50%. Same pinned sources as the earlier
          # measurement; neither is migrated, so the branch also renders
          # rejections, counted per side.
          branch=compiler/target/gate/whitefootc
          main="$RUNNER_TEMP/main/compiler/target/gate/whitefootc"
          for project in halo snowghost; do
            case $project in
              halo) repository=Halo-wf revision=56878ac4d607f7496c8e23a4c2ffe2d45e9cb552 graph=lib/halo/modules.wfg ;;
              snowghost) repository=Snowghost-wf revision=466e9843f7a0fe4926022be8718d4ab677cafed1 graph=renderer/modules.wfg ;;
            esac
            git clone --quiet "https://github.com/Ming-Research/$repository.git" "$RUNNER_TEMP/$project"
            git -C "$RUNNER_TEMP/$project" checkout --quiet --detach "$revision"
            find "$RUNNER_TEMP/$project" -name "*.wf" -exec perl -pi -e "s/\\bheld\\b/held_value/g" {} +
            for round in 1 2; do
              for side in main branch; do
                if [ "$side" = main ]; then compiler=$main; else compiler=$branch; fi
                start=$(date +%s.%N)
                set +e
                timeout 1800 "$compiler" --check-modules --report --graph "$RUNNER_TEMP/$project/$graph" > "$RUNNER_TEMP/$project-$side.txt" 2>&1
                status=$?
                set -e
                end=$(date +%s.%N)
                rejected=$(grep -c '"verdict":"rejected"' "$RUNNER_TEMP/$project-$side.txt" || true)
                accepted=$(grep -c '"verdict":"accepted"' "$RUNNER_TEMP/$project-$side.txt" || true)
                op5=$(grep -c 'OP-5' "$RUNNER_TEMP/$project-$side.txt" || true)
                printf 'RESULT project=%s round=%s side=%s status=%s seconds=%.2f accepted=%s rejected=%s op5_lines=%s\n' \
                  "$project" "$round" "$side" "$status" "$(echo "$end - $start" | bc)" "$accepted" "$rejected" "$op5"
              done
            done
          done
      - name: Time each Halo module with both compilers
        run: |
          # Halo's whole check doubles on this branch while 11 of 15 modules are
          # rejected; per-module times separate accepted modules (the rule's
          # judgment alone) from rejected ones (judgment plus diagnostics).
          branch=compiler/target/gate/whitefootc
          main="$RUNNER_TEMP/main/compiler/target/gate/whitefootc"
          graph="$RUNNER_TEMP/halo/lib/halo/modules.wfg"
          modules=$(grep -o '"module":"[^"]*"' "$RUNNER_TEMP/halo-main.txt" | cut -d'"' -f4 | sort -u)
          for round in 1 2; do
            for module in $modules; do
              for side in main branch; do
                if [ "$side" = main ]; then compiler=$main; else compiler=$branch; fi
                start=$(date +%s.%N)
                set +e
                timeout 900 "$compiler" --check-module "$module" --report --graph "$graph" > "$RUNNER_TEMP/m.txt" 2>&1
                status=$?
                set -e
                end=$(date +%s.%N)
                printf 'MODULE round=%s module=%s side=%s status=%s seconds=%.2f\n' \
                  "$round" "$module" "$side" "$status" "$(echo "$end - $start" | bc)"
              done
            done
          done
      - name: Apply the Halo migration and check it in alternating rounds
        run: |
          # Keep the original whole-graph and per-module inputs until those
          # measurements finish. This patch targets the pinned, renamed tree.
          git -C "$RUNNER_TEMP/halo" apply "$GITHUB_WORKSPACE/research/investigations/redundant-tests/halo-migration.patch"
          branch=compiler/target/gate/whitefootc
          main="$RUNNER_TEMP/main/compiler/target/gate/whitefootc"
          graph="$RUNNER_TEMP/halo/lib/halo/modules.wfg"
          failed=0
          for round in 1 2; do
            if [ "$round" = 1 ]; then sides="main branch"; else sides="branch main"; fi
            for side in $sides; do
              if [ "$side" = main ]; then compiler=$main; else compiler=$branch; fi
              report="$RUNNER_TEMP/halo-migrated-$round-$side.txt"
              start=$(date +%s.%N)
              set +e
              timeout 1800 "$compiler" --check-modules --report --graph "$graph" > "$report" 2>&1
              status=$?
              set -e
              end=$(date +%s.%N)
              rejected=$(grep -c '"verdict":"rejected"' "$report" || true)
              accepted=$(grep -c '"verdict":"accepted"' "$report" || true)
              op5=$(grep -c 'OP-5' "$report" || true)
              printf 'RESULT project=halo-migrated round=%s side=%s status=%s seconds=%.2f accepted=%s rejected=%s op5_lines=%s\n' \
                "$round" "$side" "$status" "$(echo "$end - $start" | bc)" "$accepted" "$rejected" "$op5"
              if [ "$status" -ne 0 ] || [ "$accepted" -ne 15 ] || [ "$rejected" -ne 0 ]; then
                failed=1
              fi
            done
          done
          exit "$failed"
      - name: Keep the branch's Halo and Snowghost diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: downstream-diagnostics
          path: |
            ${{ runner.temp }}/halo-branch.txt
            ${{ runner.temp }}/halo-migrated-*.txt
            ${{ runner.temp }}/snowghost-branch.txt

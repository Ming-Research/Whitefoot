# Temporary: which main merge between 58743a931 and 8c5b07c360c9 made the
# pinned Snowghost style oracle module check 33 times slower (7.2 s -> 237 s on
# EPYC 7763)? One job per main revision checks the same renamed input.
# Remove before this branch is ready.
name: main-check-compare

on:
  push:
    branches: [claude/redundant-test-r1]

concurrency:
  group: main-check-compare-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
  SNOWGHOST_REVISION: 466e9843f7a0fe4926022be8718d4ab677cafed1

jobs:
  bisect:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        rev: [3fabe3cde, 7d9118eba, 5dd90db14, f09032413, a755d4e3b, a7f849230, e96f620db, 35cfc4a0b]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build main at ${{ matrix.rev }}
        run: |
          rustup default stable
          git worktree add --detach "$RUNNER_TEMP/main" "${{ matrix.rev }}"
          cargo fetch --locked --manifest-path "$RUNNER_TEMP/main/compiler/Cargo.toml"
          cargo build --manifest-path "$RUNNER_TEMP/main/compiler/Cargo.toml" --profile gate --locked --offline
          lscpu | grep -E 'Model name'
      - name: Check the style oracle module
        run: |
          git clone --quiet https://github.com/Ming-Research/Snowghost-wf.git "$RUNNER_TEMP/snowghost"
          git -C "$RUNNER_TEMP/snowghost" checkout --quiet --detach "$SNOWGHOST_REVISION"
          find "$RUNNER_TEMP/snowghost/renderer/oracle" -name "*.wf" -exec perl -pi -e "s/\\bheld\\b/held_value/g" {} +
          start=$(date +%s.%N)
          set +e
          timeout 600 "$RUNNER_TEMP/main/compiler/target/gate/whitefootc" \
            --graph "$RUNNER_TEMP/snowghost/renderer/modules.wfg" --check-module pkg::oracle::style --report \
            > "$RUNNER_TEMP/out.txt" 2>&1
          status=$?
          set -e
          end=$(date +%s.%N)
          printf 'RESULT main=%s status=%s seconds=%.2f\n' "${{ matrix.rev }}" "$status" "$(echo "$end - $start" | bc)"
          tail -3 "$RUNNER_TEMP/out.txt"

# Temporary: the machine code of v2h's and wasmi's control-flow handlers,
# for the loop { match } line's third phase. Removed before
# claude/v2h-attribution-1012 is ready.
name: v2h-disasm
on:
  push:
    branches: [claude/v2h-attribution-1012]
    paths: [.github/workflows/v2h-disasm.yml]
jobs:
  disasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install the host toolchain
        run: |
          version=$(tr -d '[:space:]' < .github/llvm-major)
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version" > /dev/null
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          sudo ln -sf "/usr/bin/llvm-objdump-$version" /usr/local/bin/llvm-objdump
          rustup default stable
      - name: Build v2h
        run: |
          set -eo pipefail
          out="$RUNNER_TEMP/d"; mkdir -p "$out"
          cargo fetch --locked --manifest-path compiler/Cargo.toml
          make -C compiler build
          gen=research/experiments/match-dispatch/wasm/gen.py
          python3 "$gen" "$out/v2h.wf"
          python3 "$gen" "$out/names.wf" --names > "$out/names.txt"
          compiler/target/gate/whitefootc "$out/v2h.wf" -o "$out/v2h" > /dev/null
          compiler/target/gate/whitefootc --emit-llvm "$out/v2h.wf" -o "$out/v2h.ll" > /dev/null || true
          ls -la "$out"
      - name: Install wasmi
        run: cargo install --quiet --locked --version 2.0.0 --root "$RUNNER_TEMP/wasmi" wasmi_cli
      - name: Disassemble the control-flow handlers
        run: |
          out="$RUNNER_TEMP/d"
          # Arm numbers follow the instruction variants' tags, read from the
          # handler-word stores in v2h.ll: 185 BrI32Ne, 356 BrIfC, 7 BrTableN,
          # 1 Jump, 9 Call, 8 Return, and 278 I32AddSD as a straight-line baseline.
          for arm in 185 356 7 1 9 8 278; do
            echo "===== v2h wf_run.arm.$arm"
            llvm-objdump -d --no-show-raw-insn --disassemble-symbols="wf_run.arm.$arm" "$out/v2h" | sed -n '1,160p'
          done
          llvm-objdump -d --no-show-raw-insn --demangle "$RUNNER_TEMP/wasmi/bin/wasmi" > "$out/wasmi.s"
          for h in branch_i32_not_eq_si branch_i32_not_eq_ri branch_table_s branch call_internal return i32_add_rs_si; do
            echo "===== wasmi $h"
            awk -v h="handler::exec::$h>:" 'index($0, h) {p=1} p {print; n++} p && /^$/ {exit} n > 160 {exit}' "$out/wasmi.s"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: v2h-disasm
          path: |
            ${{ runner.temp }}/d/v2h.ll
            ${{ runner.temp }}/d/names.txt
            ${{ runner.temp }}/d/wasmi.s

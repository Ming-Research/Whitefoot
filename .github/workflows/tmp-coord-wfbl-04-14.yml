# Temporary quick check for the FN-9 rejection's relation_at_return field.
# Removed before the branch is ready.
name: tmp-coord-wfbl-04-14

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0

jobs:
  quick:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install the host toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          rustup default stable
          rustup component add clippy rustfmt
      - name: Fetch locked compiler dependencies
        run: cargo fetch --locked --manifest-path compiler/Cargo.toml
      - name: Acceptance helper unit tests
        run: perl .github/run-check.pl tmp-acceptance cargo test --manifest-path compiler/Cargo.toml --profile gate --locked --offline --lib clause_at_return
      - name: Diagnostic rendering tests
        run: perl .github/run-check.pl tmp-diagnostic cargo test --manifest-path compiler/Cargo.toml --profile gate --locked --offline --lib driver::diagnostic
      - name: Pinned sentences
        run: perl .github/run-check.pl tmp-pinned cargo test --manifest-path compiler/Cargo.toml --profile gate --locked --offline --lib driver::pinned_sentences
      - name: Postcondition rejections
        run: perl .github/run-check.pl tmp-postconditions cargo test --manifest-path compiler/Cargo.toml --profile gate --locked --offline --lib semantic::tests::postconditions

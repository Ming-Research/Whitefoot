# Temporary: compiles the probes of research/experiments/shared-object-model/
# with this branch's compiler and reports each verdict beside the expected
# one in probes/expected.tsv. The verdicts are today's (candidate P) column of
# research/investigations/shared-object-model/STUDY.md. Removed before the
# branch is ready.
#
# research-boundary: temporary probe, removed before ready
name: tmp-shared-object-model

on:
  push:
    branches: [claude/single-object-atomic]
    paths:
      - research/experiments/shared-object-model/**
      - .github/workflows/tmp-shared-object-model.yml
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0

jobs:
  probes:
    name: shared-object-model probes (today's compiler)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld
          rustup default stable
      - name: Build the compiler
        run: |
          cargo fetch --locked --manifest-path compiler/Cargo.toml
          make -C compiler build
      - name: Compile each probe
        run: |
          dir=research/experiments/shared-object-model/probes
          out="$RUNNER_TEMP/probes"
          mkdir -p "$out"
          {
            echo "## shared-object-model probes, compiler at $(git rev-parse HEAD)"
            echo
            echo "| probe | expected | observed | first diagnostic line |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS=$'\t' read -r probe expected rule; do
            [ -n "$probe" ] || continue
            status=0
            compiler/target/gate/whitefootc --emit-llvm -o "$out/${probe%.wf}.ll" "$dir/$probe" \
              > "$out/${probe%.wf}.txt" 2>&1 || status=$?
            if [ "$status" -eq 0 ]; then observed=accept; else observed="reject ($status)"; fi
            first=$(grep -m1 -E 'error|ERROR|\[[A-Z]+-[0-9]' "$out/${probe%.wf}.txt" | tr '|' '/' | cut -c1-220 || true)
            echo "=== $probe expected=$expected ($rule) observed=$observed"
            cat "$out/${probe%.wf}.txt"
            echo "| $probe | $expected | $observed | $first |" >> "$GITHUB_STEP_SUMMARY"
          done < "$dir/expected.tsv"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-object-model-probes-${{ github.run_id }}
          path: ${{ runner.temp }}/probes/*.txt

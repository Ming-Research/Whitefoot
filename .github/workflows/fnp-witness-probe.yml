# Temporary: compile Firn's fn-parameter ladder steps 03 (four type
# invariants) and 04 (without them) with this branch and with main.
# Remove before this branch is ready.
name: fnp-witness-probe

on:
  push:
    branches: [claude/fnparam-invariant-publish]

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        rev: [main, branch]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and check
        run: |
          rustup default stable
          cp -R .github/fnp-witness "$RUNNER_TEMP/w"
          if [ "${{ matrix.rev }}" = main ]; then git checkout --quiet origin/main; fi
          cargo build --manifest-path compiler/Cargo.toml --profile gate --locked
          for f in "$RUNNER_TEMP"/w/*.wf; do
            set +e
            compiler/target/gate/whitefootc "$f" -o /tmp/out > out.txt 2>&1
            st=$?
            set -e
            printf '== %s %s status=%s\n' "${{ matrix.rev }}" "$(basename "$f")" "$st"
            head -c 800 out.txt; echo
          done

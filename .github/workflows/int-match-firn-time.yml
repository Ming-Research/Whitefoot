# Temporary, explicitly dispatched acquisition on an experiment branch that
# has no pull request and never merges. Remove when this experiment ends.
name: int-match-firn-time

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: int-match-firn-time-14900k
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
  FIRN_TIME_A: 58743a931a5ec6244864d37041fd1a7c1c5a145d
  FIRN_TIME_B: ad8ea57f7cbb0bfd099c9924f7b52639e172e04f

jobs:
  timing:
    if: github.ref == 'refs/heads/claude/int-match-firn-time'
    runs-on: [self-hosted, 14900k]
    timeout-minutes: 150
    steps:
      - name: Initialize evidence before acquisition
        run: |
          set -euo pipefail
          out=$(mktemp -d "$RUNNER_TEMP/int-match-firn-time-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.XXXXXX")
          echo "FIRN_TIME_OUT=$out" >> "$GITHUB_ENV"
          mkdir -p "$out"/{logs,raw,inputs,images}
          printf '%s\n' 'NOT MEASURED: acquisition has not completed.' > "$out/acquisition-status.txt"
          printf '%s\n' 'NOT MEASURED: smallest sample has not completed.' > "$out/sample.md"
          printf '%s\n' 'NOT MEASURED: seven-round acquisition has not completed.' > "$out/timing.md"
          printf '%s\n' 'NOT MEASURED: manifest preparation has not completed.' > "$out/manifest.json"
          printf '%s\n' 'stage,round,order,variant,seconds,actual_returncode,launcher_returncode,timed_out,verdict' > "$out/raw/times.csv"
          printf '%s\n' 'NOT MEASURED: compiler images have not been built.' > "$out/images.sha256"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize manifest and inspect idle host, stale lock and tools
        run: |
          set -euo pipefail
          if [ -d "$HOME/.cargo/bin" ]; then
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          python3 .github/int-match-firn-time.py init
          python3 .github/int-match-firn-time.py host

      - name: Reducer detects invalid matrices and threshold boundaries
        run: python3 .github/int-match-firn-time.py selfcheck

      - name: Prepare exact compiler and source identities
        run: python3 .github/int-match-firn-time.py prepare

      - name: Build three exact compilers with fresh gate targets and copy the twin
        env:
          WHITEFOOT_CHECK_TIMEOUT: "3600"
        run: |
          unset WHITEFOOT_TIME_BUDGET_RECORD
          perl .github/run-check.pl int-match/firn-build python3 .github/int-match-firn-time.py build

      - name: Smallest useful sample, one full Firn entry check per variant
        env:
          WHITEFOOT_CHECK_TIMEOUT: "600"
        run: |
          unset WHITEFOOT_TIME_BUDGET_RECORD
          perl .github/run-check.pl int-match/firn-sample python3 .github/int-match-firn-time.py sample

      - name: One warmup each and seven rotated interleaved rounds
        env:
          WHITEFOOT_CHECK_TIMEOUT: "3600"
        run: |
          unset WHITEFOOT_TIME_BUDGET_RECORD
          perl .github/run-check.pl int-match/firn-rounds python3 .github/int-match-firn-time.py rounds

      - name: Final acquisition status, manifest and complete raw table
        if: always()
        env:
          FIRN_TIME_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ -f .github/int-match-firn-time.py ]; then
            python3 .github/int-match-firn-time.py finalize
          else
            printf '%s\n' 'UNAVAILABLE: checkout/helper unavailable; no timing verdict.' > "$FIRN_TIME_OUT/acquisition-status.txt"
          fi
          {
            cat "$FIRN_TIME_OUT/acquisition-status.txt"
            cat "$FIRN_TIME_OUT/sample.md" "$FIRN_TIME_OUT/timing.md"
            printf '\n### Raw manifest\n\n```json\n'
            cat "$FIRN_TIME_OUT/manifest.json"
            printf '\n```\n\n### Complete raw times\n\n```csv\n'
            cat "$FIRN_TIME_OUT/raw/times.csv"
            printf '\n```\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: int-match-firn-time-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.FIRN_TIME_OUT }}/
          if-no-files-found: error
          retention-days: 14

      - name: Remove only this run's scratch worktrees and Cargo targets
        if: always()
        run: |
          if [ -f .github/int-match-firn-time.py ]; then
            python3 .github/int-match-firn-time.py cleanup
          fi

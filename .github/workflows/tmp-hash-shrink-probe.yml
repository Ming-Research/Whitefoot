# Temporary (board item wf-need-firn-hash-shrink), on a probe branch that is
# never merged: compares the machine code of the grow-only cells of the
# hash-map comparison's bench image under the merge base's library and this
# commit's, to tell a change in the timed code from a change in its placement,
# and the growth path: the base's rebuild against the candidate's rebuild and
# migrate, and the insertion functions they serve.
name: tmp-hash-shrink-probe

on:
  push:
    branches: [claude/hash-shrink-probe]

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
  WHITEFOOT_CHECK_TIMEOUT: 1800

jobs:
  codegen:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    name: bench machine code under both libraries
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install the host toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          sudo ln -sf "/usr/bin/llvm-objdump-$version" /usr/bin/llvm-objdump
          sudo ln -sf "/usr/bin/llvm-nm-$version" /usr/bin/llvm-nm
          rustup default stable
      - name: Build the merge base's library and the PR head's
        run: bash research/experiments/hash-map-compare/arms.sh 441a6bfae9e541a0662a377b56d9505aecef35ca cb5be3621aa31b9a47f4fe8847887ccff8f4fb2f "$RUNNER_TEMP/out"
      - name: Bench images and their symbols
        run: |
          out="$RUNNER_TEMP/out"
          for arm in base candidate; do
            "$out/arms/$arm/compiler/target/gate/whitefootc" research/experiments/hash-map-compare/bench.wf -o "$out/bench-$arm"
            sha256sum "$out/bench-$arm"
            llvm-nm -S --defined-only --numeric-sort "$out/bench-$arm" > "$out/nm-$arm.txt"
            llvm-objdump -d --no-show-raw-insn --no-leading-addr "$out/bench-$arm" > "$out/dis-$arm.txt"
            llvm-objdump -d --no-show-raw-insn "$out/bench-$arm" > "$out/disaddr-$arm.txt"
          done
      - name: Compare the functions
        run: |
          out="$RUNNER_TEMP/out"
          python3 - "$out" <<'PY'
          import re, sys
          out = sys.argv[1]
          def functions(arm):
              text = open(f"{out}/disaddr-{arm}.txt").read()
              funcs, name, body, start = {}, None, [], None
              for line in text.split("\n"):
                  m = re.match(r"^([0-9a-f]+) <(.+)>:$", line)
                  if m:
                      if name: funcs[name] = (start, body)
                      name, body, start = m.group(2), [], int(m.group(1), 16)
                      continue
                  if name and line.strip():
                      m = re.match(r"^\s*([0-9a-f]+):\s*(.*)$", line)
                      if m:
                          insn = m.group(2)
                          insn = re.sub(r"0x[0-9a-f]+", "ADDR", insn)
                          insn = re.sub(r"\b[0-9a-f]{6,}\b", "ADDR", insn)
                          insn = re.sub(r"<([^>+]+)\+0x[0-9a-f]+>", r"<\1+OFF>", insn)
                          body.append((int(m.group(1), 16), insn))
              if name: funcs[name] = (start, body)
              return funcs
          base, cand = functions("base"), functions("candidate")
          keys = ["lookup", "build_sample", "put_one", "fill", "grown", "each_sample", "hash_map_put", "hash_map_rebuild", "hash_map_migrate", "hash_map_reserve", "hash_map_iter", "hash_map_each", "remove", "churn", "shrink", "run_timed"]
          names = sorted(n for n in set(base) | set(cand) if any(k in n for k in keys))
          print(f"{'function':70} {'base n':>6} {'cand n':>6} {'b mod64':>7} {'c mod64':>7} same")
          for n in names:
              b, c = base.get(n), cand.get(n)
              bn = len(b[1]) if b else "-"; cn = len(c[1]) if c else "-"
              bm = b[0] % 64 if b else "-"; cm = c[0] % 64 if c else "-"
              same = "-" if not (b and c) else ("yes" if [i for _, i in b[1]] == [i for _, i in c[1]] else "NO")
              print(f"{n[:70]:70} {bn:>6} {cn:>6} {bm:>7} {cm:>7} {same}")
          # Calls made by the timed-cell functions, per arm.
          for n in names:
              if not any(k in n for k in ["lookup_sample", "build_sample", "each_sample"]): continue
              for arm, f in (("base", base), ("candidate", cand)):
                  if n not in f: continue
                  calls = sorted({re.sub(r"\+OFF", "", i.split("<",1)[1].rstrip(">")) for _, i in f[n][1] if i.startswith("call") and "<" in i})
                  print(f"calls of {n} in {arm}: {calls}")
          # Loop heads: backward jump targets of the timed-cell functions, and their address mod 64.
          for n in names:
              if not any(k in n for k in ["lookup_sample", "build_sample", "each_sample"]): continue
              for arm, f in (("base", base), ("candidate", cand)):
                  if n not in f: continue
                  start, body = f[n]
                  addrs = [a for a, _ in body]
                  text = open(f"{out}/disaddr-{arm}.txt").read()
                  heads = set()
                  for a, _ in body:
                      pass
                  raw = [l for l in text.split("\n")]
                  heads = sorted({int(m.group(1), 16) for l in raw for m in [re.match(r"^\s*([0-9a-f]+):\s*j\w+\s+0x([0-9a-f]+)", l)] if False})
              
          PY
          for arm in base candidate; do
            echo "== $arm: timed-cell functions with addresses"
            awk '/^[0-9a-f]+ <.*(lookup_sample|build_sample).*>:$/{p=1} p&&/^$/{p=0} p' "$out/disaddr-$arm.txt"
          done
          for f in lookup_sample build_sample each_sample; do
            echo "== diff of $f (addresses removed)"
            for arm in base candidate; do
              awk -v f="$f" '$0 ~ "^<.*" f ".*>:$"{p=1} p&&/^$/{p=0} p' "$out/dis-$arm.txt" | sed -E 's/0x[0-9a-f]+/ADDR/g; s/<([^>+]+)\+0x[0-9a-f]+>/<\1+OFF>/g' > "$out/$f-$arm.s"
            done
            diff "$out/$f-base.s" "$out/$f-candidate.s" && echo "identical"
          done
      - name: Growth path, whole functions
        run: |
          out="$RUNNER_TEMP/out"
          dump() {
            F="$2" awk '$0 ~ ("^<" ENVIRON["F"] ">:$"){p=1} p&&/^$/{p=0} p' "$out/dis-$1.txt" | sed -E 's/0x[0-9a-f]+/ADDR/g; s/<([^>+]+)\+0x[0-9a-f]+>/<\1+OFF>/g; s/\$instance\$[0-9a-f]+/$I/g'
          }
          rb='wf_std\.collections\.hash_map\.hash_map_rebuild\$instance\$[0-9a-f]+'
          mg='wf_std\.collections\.hash_map\.hash_map_migrate\$instance\$[0-9a-f]+'
          pt='wf_std\.collections\.hash_map\.hash_map_put\$instance\$[0-9a-f]+'
          tp='wf_std\.collections\.hash_map\.hash_map_try_put\$instance\$[0-9a-f]+'
          dump base "$rb" > "$out/rebuild-base.s"
          dump candidate "$mg" > "$out/migrate-candidate.s"
          dump candidate "$rb" > "$out/rebuild-candidate.s"
          wc -l "$out"/rebuild-base.s "$out"/migrate-candidate.s "$out"/rebuild-candidate.s
          echo "== base rebuild"; cat "$out/rebuild-base.s"
          echo "== candidate migrate"; cat "$out/migrate-candidate.s"
          echo "== candidate rebuild"; cat "$out/rebuild-candidate.s"
          echo "== diff base rebuild -> candidate migrate"
          diff "$out/rebuild-base.s" "$out/migrate-candidate.s" || true
          for f in "$pt" "$tp"; do
            dump base "$f" > "$out/f-base.s"; dump candidate "$f" > "$out/f-candidate.s"
            echo "== diff $f"; wc -l < "$out/f-base.s"; wc -l < "$out/f-candidate.s"
            diff "$out/f-base.s" "$out/f-candidate.s" && echo identical
          done
          echo "== who calls rebuild, migrate, shrink"
          for arm in base candidate; do
            grep -E "call.*hash_map_(rebuild|migrate|shrink|try_put|put)" "$out/disaddr-$arm.txt" | sed -E 's/^ *[0-9a-f]+:\s*//' | sort | uniq -c | sed "s/^/$arm /"
          done
          echo "== function of each call site to rebuild or migrate"
          for arm in base candidate; do
            awk -v arm="$arm" '/^[0-9a-f]+ <.*>:$/{fn=$2} /call.*hash_map_(rebuild|migrate)/{print arm, fn, $NF}' "$out/disaddr-$arm.txt" | sort | uniq -c
          done
      - name: A single rebuild that also shrinks
        # single: the candidate library with migrate folded back into rebuild,
        # whose refusal becomes a count below the length, and the shrink
        # calling rebuild; to see whether the moving loop regains the base's
        # machine code.
        run: |
          out="$RUNNER_TEMP/out"
          arm="$out/arms/single"
          git worktree add --detach "$arm" 441a6bfae9e541a0662a377b56d9505aecef35ca
          python3 - "$arm/lib/std/collections/hash_map/hash-map.wf" <<'PY'
          import sys
          path = sys.argv[1]
          text = open(path).read()
          start = text.index("fn hash_map_rebuild<")
          mig = text.index("fn hash_map_migrate<")
          text = text[:start] + text[mig:]
          sig_old = "fn hash_map_migrate<interface HashMapKey<K, E>, V, const ceiling: u64>(map: &HashMap<K, V, ceiling>, buckets: u64, env: &E) -> result: unit reads(env), writes(map) {\n"
          sig_new = "fn hash_map_rebuild<interface HashMapKey<K, E>, V, const ceiling: u64>(map: &HashMap<K, V, ceiling>, buckets: u64, env: &E) -> result: Result<unit, unit> reads(env), writes(map) {\n"
          assert text.count(sig_old) == 1
          head = text.index(sig_old)
          doc_end = text.index("\n", head + len(sig_old)) + 1
          refuse = "  let live = map^.length;\n  if buckets < live {\n    return Err<unit, unit>(error: unit);\n  }\n"
          text = text[:head] + sig_new + text[head + len(sig_old):doc_end] + refuse + text[doc_end:]
          tail_old = "  set map^.vacated = 0_u64;\n  return unit;\n}"
          assert text.count(tail_old) == 1
          text = text.replace(tail_old, "  set map^.vacated = 0_u64;\n  return Ok<unit, unit>(value: unit);\n}")
          assert text.count("hash_map_migrate::<") == 2
          text = text.replace("hash_map_migrate::<", "let shrunk = hash_map_rebuild::<")
          open(path, "w").write(text)
          PY
          git -C "$arm" diff
          make -C "$arm/compiler" build
          "$arm/compiler/target/gate/whitefootc" research/experiments/hash-map-compare/bench.wf -o "$out/bench-single"
          llvm-objdump -d --no-show-raw-insn --no-leading-addr "$out/bench-single" > "$out/dis-single.txt"
          F='wf_std\.collections\.hash_map\.hash_map_rebuild\$instance\$[0-9a-f]+' awk '$0 ~ ("^<" ENVIRON["F"] ">:$"){p=1} p&&/^$/{p=0} p' "$out/dis-single.txt" \
            | sed -E 's/0x[0-9a-f]+/ADDR/g; s/<([^>+]+)\+0x[0-9a-f]+>/<\1+OFF>/g; s/\$instance\$[0-9a-f]+/$I/g' > "$out/rebuild-single.s"
          wc -l "$out/rebuild-base.s" "$out/rebuild-single.s"
          echo "== single rebuild"; cat "$out/rebuild-single.s"
          echo "== diff base rebuild -> single rebuild"
          diff "$out/rebuild-base.s" "$out/rebuild-single.s" || true
          echo "== movabsq per function"
          for f in rebuild-base migrate-candidate rebuild-single; do printf '%s ' "$f"; grep -c movabsq "$out/$f.s"; done

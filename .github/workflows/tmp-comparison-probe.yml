# Temporary (status board item lm-r1): checks which small programs the
# previous compiler (head 870474a0e) rejects as redundant but the compiler with
# the comparison-origin fix accepts. Remove before the branch is ready.
name: tmp-comparison-probe

on:
  push:
    branches: [claude/redundant-test-r1]
  workflow_dispatch:

concurrency:
  group: tmp-comparison-probe-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0

jobs:
  probe:
    name: comparison-origin probe
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - name: Install the host toolchain
        run: |
          rustup default stable
          cargo fetch --locked --manifest-path compiler/Cargo.toml
      - name: Build the current and the previous compiler
        run: |
          perl .github/run-check.pl probe-build-new cargo build --profile gate --locked --offline --manifest-path compiler/Cargo.toml --bin whitefootc
          git worktree add "$RUNNER_TEMP/old" 870474a0e7b5ab92e4818484150182d1a01ee771
          perl .github/run-check.pl probe-build-old cargo build --profile gate --locked --offline --manifest-path "$RUNNER_TEMP/old/compiler/Cargo.toml" --bin whitefootc
      - name: Check the candidates with both compilers
        run: |
          new=$(find compiler/target -name whitefootc -type f -perm -u+x | head -n 1)
          old=$(find "$RUNNER_TEMP/old/compiler/target" -name whitefootc -type f -perm -u+x | head -n 1)
          echo "new=$new old=$old"
          dir="$RUNNER_TEMP/probe"
          mkdir -p "$dir"
          header='alias ExitStatus = std::process::ExitStatus;
          alias exit_status = std::process::exit_status;
          '
          footer='
          fn main() -> status: ExitStatus pure {
            doc "The checker judges every body.";
            return exit_status(code: 0_u8);
          }'
          cat > "$dir/c1.wf" <<EOS
          $header
          fn choose(x: u64) -> r: u64 pure {
            doc "Two bindings share one bitwise computation; compare with le.";
            let m = iand(x, 1_u64);
            let n = iand(x, 1_u64);
            if m <= n {
              return 1_u64;
            }
            return 2_u64;
          }
          $footer
          EOS
          cat > "$dir/c2.wf" <<EOS
          $header
          fn choose(p: u8, q: u8) -> r: u64 pure {
            doc "Two bindings share one product; compare with le.";
            let x = cvt::<u8, u64>(p);
            let y = cvt::<u8, u64>(q);
            let m = x * y;
            let n = x * y;
            if m <= n {
              return 1_u64;
            }
            return 2_u64;
          }
          $footer
          EOS
          cat > "$dir/c3.wf" <<EOS
          $header
          fn choose(x: u64) -> r: u64 pure {
            doc "Two bindings share one bitwise computation; compare with eq.";
            let m = iand(x, 1_u64);
            let n = iand(x, 1_u64);
            if m == n {
              return 1_u64;
            }
            return 2_u64;
          }
          $footer
          EOS
          cat > "$dir/c4.wf" <<EOS
          $header
          fn choose(x: u64) -> r: u64 pure {
            doc "Reversed operands of the shared computation.";
            let m = iand(x, 1_u64);
            let n = iand(x, 1_u64);
            if n <= m {
              return 1_u64;
            }
            return 2_u64;
          }
          $footer
          EOS
          cat > "$dir/c5.wf" <<EOS
          $header
          fn choose(x: u64) -> r: u64 pure contract {
            requires x < 8_u64;
          } {
            doc "Control: both compilers reject this redundant test.";
            if x < 9_u64 {
              return x;
            }
            return 0_u64;
          }
          $footer
          EOS
          set +e
          for c in c1 c2 c3 c4 c5; do
            for which in old new; do
              bin=$old
              [ "$which" = new ] && bin=$new
              "$bin" --check "$dir/$c.wf" > "$dir/$c.$which.out" 2>&1
              echo "== $c $which: exit $?"
              head -n 8 "$dir/$c.$which.out"
            done
          done

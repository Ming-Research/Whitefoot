# Temporary: the smallest sample of firn-check-time.yml on a hosted runner, to
# show the whole chain (prepare, build, sample, warmup, one round, report)
# before the workflow reaches main. Same helper and steps; differences are the
# runner, one measured round instead of seven, the last CPU instead of CPU 2,
# and no idle-host refusal (a hosted runner is not the dedicated machine, so
# these numbers are a link test and not a measurement). Remove before the full
# check.
name: tmp-firn-check-time

on:
  push:
    branches: [firn-check-time-wf]

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
  FIRN_TIME_NOW_BASE: aa667568707c6c10ff6d5a294feb45e85e83694d
  FIRN_TIME_NOW_RULE: bf7e033330a450b4e4fd848f69c2f35d6580f874
  FIRN_TIME_NOW_SOURCE: bf7e033330a450b4e4fd848f69c2f35d6580f874
  FIRN_TIME_THEN_BASE: 58743a931a5ec6244864d37041fd1a7c1c5a145d
  FIRN_TIME_THEN_RULE: 82fdda25ecb15171568f8b7dd3f033c47f5ab6f7
  FIRN_TIME_THEN_SOURCE: 82fdda25ecb15171568f8b7dd3f033c47f5ab6f7
  FIRN_TIME_CLAIMED_OVERHEAD: "1.6"
  FIRN_TIME_REQUIRED_REDUCTION: "0.5"
  FIRN_TIME_ROUNDS: "1"

jobs:
  timing:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Initialize evidence before acquisition
        run: |
          set -euo pipefail
          out=$(mktemp -d "$RUNNER_TEMP/firn-check-time-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.XXXXXX")
          echo "FIRN_TIME_OUT=$out" >> "$GITHUB_ENV"
          echo "FIRN_TIME_CPU=$(( $(nproc) - 1 ))" >> "$GITHUB_ENV"
          mkdir -p "$out"/{logs,raw,inputs,images}
          printf '%s\n' 'NOT MEASURED: acquisition has not completed.' > "$out/acquisition-status.txt"
          printf '%s\n' 'NOT MEASURED: smallest sample has not completed.' > "$out/sample.md"
          printf '%s\n' 'NOT MEASURED: measured rounds have not completed.' > "$out/timing.md"
          printf '%s\n' 'NOT MEASURED: manifest preparation has not completed.' > "$out/manifest.json"
          printf '%s\n' 'stage,round,order,variant,seconds,actual_returncode,launcher_returncode,timed_out,verdict' > "$out/raw/times.csv"
          printf '%s\n' 'NOT MEASURED: compiler images have not been built.' > "$out/images.sha256"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize manifest and inspect tools
        run: |
          set -euo pipefail
          rustup default stable
          python3 .github/firn-check-time.py init
          python3 .github/firn-check-time.py host

      - name: Reducers refuse invalid acquisitions and keep the criterion's boundaries
        run: python3 .github/firn-check-time.py selfcheck

      - name: Prepare exact compiler and source identities
        run: python3 .github/firn-check-time.py prepare

      - name: Build each compiler with a fresh gate target and copy the twins
        env:
          WHITEFOOT_CHECK_TIMEOUT: "5400"
        run: |
          unset WHITEFOOT_TIME_BUDGET_RECORD
          perl .github/run-check.pl firn-check-time/build python3 .github/firn-check-time.py build

      - name: Smallest useful sample, one full Firn entry check per variant
        env:
          WHITEFOOT_CHECK_TIMEOUT: "900"
        run: |
          unset WHITEFOOT_TIME_BUDGET_RECORD
          perl .github/run-check.pl firn-check-time/sample python3 .github/firn-check-time.py sample

      - name: One warmup each and one rotated round
        env:
          WHITEFOOT_CHECK_TIMEOUT: "900"
        run: |
          unset WHITEFOOT_TIME_BUDGET_RECORD
          perl .github/run-check.pl firn-check-time/rounds python3 .github/firn-check-time.py rounds

      - name: Final acquisition status, manifest and complete raw table
        if: always()
        env:
          FIRN_TIME_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          python3 .github/firn-check-time.py finalize
          {
            cat "$FIRN_TIME_OUT/acquisition-status.txt"
            cat "$FIRN_TIME_OUT/sample.md" "$FIRN_TIME_OUT/timing.md"
            printf '\n### Raw manifest\n\n```json\n'
            cat "$FIRN_TIME_OUT/manifest.json"
            printf '\n```\n\n### Complete raw times\n\n```csv\n'
            cat "$FIRN_TIME_OUT/raw/times.csv"
            printf '\n```\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firn-check-time-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.FIRN_TIME_OUT }}/
          if-no-files-found: error
          retention-days: 7

      - name: Remove only this run's scratch worktrees and Cargo targets
        if: always()
        run: python3 .github/firn-check-time.py cleanup

  # The idle-host refusal never runs on a hosted runner in the timing job; this
  # job gives it real process listings and the three lock states it handles.
  idle-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Idle check against no lock, a live lock and a stale lock
        run: |
          # The default shell stops at the first failing command; the probes
          # expect nonzero exits and read them.
          set +e -u
          lock="/tmp/whitefoot-check-$(id -u).lock"
          probe() {
            out=$(mktemp -d "$RUNNER_TEMP/idle.XXXXXX"); mkdir -p "$out/logs"
            export FIRN_TIME_OUT="$out"
            python3 .github/firn-check-time.py idle > "$out/stdout" 2> "$out/stderr"
            status=$?
            echo "--- $1: exit $status"; cat "$out/stdout" "$out/stderr"
            probe_status=$status; probe_stderr=$(cat "$out/stderr")
          }
          fail() { echo "::error::$1"; exit 1; }
          probe "no lock"
          if [ "$probe_status" -ne 0 ]; then
            case "$probe_stderr" in *"host is busy"*) echo "busy refusal on a hosted runner is a correct refusal";; *) fail "no lock: unexpected failure";; esac
          fi
          ps -eo pid,ppid,pgid,pcpu,comm,args --sort=-pcpu | head -15
          sleep 300 & live=$!
          mkdir "$lock"; echo "$live" > "$lock/pid"; echo "probe live lock" > "$lock/command"
          probe "live lock"
          [ "$probe_status" -ne 0 ] || fail "a live lock owner was accepted"
          case "$probe_stderr" in *"live host lock owner $live"*) ;; *) fail "live lock: wrong refusal";; esac
          [ -d "$lock" ] || fail "a live lock was removed"
          kill "$live"; wait "$live" 2>/dev/null
          echo "$live" > "$lock/pid"
          probe "stale lock"
          if [ "$probe_status" -eq 0 ]; then
            [ ! -e "$lock" ] || fail "a stale lock was not removed"
          else
            case "$probe_stderr" in *"dead lock owner but live heavy"*) [ -d "$lock" ] || fail "a refused stale lock was removed";; *) fail "stale lock: unexpected failure";; esac
          fi
          rm -rf "$lock"

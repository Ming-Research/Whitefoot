# Temporary step-4 packaging trial; remove before release-workflow integration.
# Downloads, archive operations and a few tiny C compilations only: the owner
# explicitly exempted this trial from run-check.pl wrapping.
name: Toolchain package trial

on:
  workflow_dispatch:
  push:
    branches: [claude/bundled-clang-pkg]

permissions:
  contents: read

jobs:
  package:
    name: LLVM subset (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            machine: x86_64
            asset: LLVM-22.1.8-Linux-X64.tar.xz
            sha256: df0e1ecf16caf3489a272a5eea4eec9b0d82878f6477fa309504f918a0006384
          - os: macos-15
            platform: macos-arm64
            machine: arm64
            asset: LLVM-22.1.8-macOS-ARM64.tar.xz
            sha256: f260f4f7c0d430828a81ae8a3826a1d63fc0963ec2459489308cc23b1f7eab4f
    defaults:
      run:
        shell: bash
    env:
      ASSET: ${{ matrix.asset }}
      PUBLISHED_SHA256: ${{ matrix.sha256 }}
    steps:
      - uses: actions/checkout@v4

      # The runner context is not available in job-level env.
      - name: Set scratch paths
        run: |
          {
            echo "ARCHIVE_DIR=$RUNNER_TEMP/llvm-archives"
            echo "TRIAL_DIR=$RUNNER_TEMP/toolchain-trial"
            echo "REPORT_DIR=$RUNNER_TEMP/toolchain-report"
            echo "LICENSE_DIR=$RUNNER_TEMP/toolchain-licenses"
          } >> "$GITHUB_ENV"

      - name: Check the runner architecture
        run: test "$(uname -m)" = "${{ matrix.machine }}"

      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/llvm-archives/${{ matrix.asset }}
          key: official-llvm-${{ matrix.asset }}

      - name: Download and verify the official release archive
        run: |
          set -euo pipefail
          mkdir -p "$ARCHIVE_DIR" "$REPORT_DIR" "$TRIAL_DIR"
          base=https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8
          archive="$ARCHIVE_DIR/$ASSET"
          if [ ! -f "$archive" ]; then
            curl --fail --location --retry 3 --max-time 600 \
              "$base/$ASSET" -o "$archive.part"
            mv "$archive.part" "$archive"
          fi
          # Publisher SHA-256 values pinned from the release's asset listing:
          # https://github.com/llvm/llvm-project/releases/expanded_assets/llvmorg-22.1.8
          # Revalidate cache hits too. A signature sidecar is not itself a hash
          # check, nor do we claim trusted-signer authentication in this trial.
          python3 - "$archive" "$PUBLISHED_SHA256" "$REPORT_DIR/source-verification.txt" <<'PY'
          import hashlib, pathlib, sys
          archive, expected, report = sys.argv[1:]
          digest = hashlib.sha256()
          with open(archive, "rb") as stream:
              for block in iter(lambda: stream.read(1024 * 1024), b""):
                  digest.update(block)
          actual = digest.hexdigest()
          if actual != expected:
              raise SystemExit(f"Publisher checksum mismatch: {actual} != {expected}")
          text = (f"Source asset: {pathlib.Path(archive).name}\n"
                  f"SHA-256: {actual}\n"
                  "Verified against the publisher SHA-256 pinned from the official release asset listing.\n"
                  "The .jsonl attestation and .sig sidecars are retained as evidence; signatures are not authenticated.\n")
          pathlib.Path(report).write_text(text)
          print(text, end="")
          PY
          # These sidecars are offered by this exact release. Keep their bytes
          # for inspection without assuming a particular attestation format.
          for suffix in jsonl sig; do
            curl --fail --location --retry 3 --max-time 120 \
              "$base/$ASSET.$suffix" -o "$REPORT_DIR/$ASSET.$suffix"
          done

      - name: Fetch licenses from the exact LLVM release tag
        run: |
          set -euo pipefail
          for component in llvm clang lld compiler-rt; do
            mkdir -p "$LICENSE_DIR/$component"
            curl --fail --location --retry 3 --max-time 120 \
              "https://raw.githubusercontent.com/llvm/llvm-project/llvmorg-22.1.8/$component/LICENSE.TXT" \
              -o "$LICENSE_DIR/$component/LICENSE.TXT"
          done
          python3 - "$LICENSE_DIR" <<'PY'
          import pathlib, sys
          root = pathlib.Path(sys.argv[1])
          for component in ("llvm", "clang", "lld", "compiler-rt"):
              path = root / component / "LICENSE.TXT"
              text = path.read_text()
              if not text.strip() or "Apache License" not in text or "LLVM Exceptions" not in text:
                  raise SystemExit(f"Missing Apache License or LLVM Exceptions in {path}")
              print(f"Validated same-tag license: {component}/LICENSE.TXT")
          PY

      - name: Extract and trim
        run: |
          set -euo pipefail
          mkdir -p "$TRIAL_DIR/extracted"
          tar -xJf "$ARCHIVE_DIR/$ASSET" -C "$TRIAL_DIR/extracted"
          shopt -s nullglob dotglob
          roots=("$TRIAL_DIR/extracted"/*)
          if [ "${#roots[@]}" -ne 1 ] || [ ! -d "${roots[0]}/bin" ]; then
            echo "Expected one official LLVM distribution root containing bin/" >&2
            exit 1
          fi
          bash .github/toolchain/trim-llvm.sh \
            "${roots[0]}" "$TRIAL_DIR/subset" "$ASSET" "$PUBLISHED_SHA256" "$LICENSE_DIR"
          cp "$TRIAL_DIR/subset/toolchain-manifest.json" "$REPORT_DIR/toolchain-manifest.json"

      - name: Measure the subset
        run: |
          set -euo pipefail
          tar -czf "$TRIAL_DIR/subset.tar.gz" -C "$TRIAL_DIR/subset" .
          python3 - "$TRIAL_DIR/subset" "$TRIAL_DIR/subset.tar.gz" "$REPORT_DIR" <<'PY'
          import os, pathlib, subprocess, sys
          root, archive, reports = map(pathlib.Path, sys.argv[1:])
          files = []
          for directory, directories, names in os.walk(root):
              names += [name for name in directories if (pathlib.Path(directory) / name).is_symlink()]
              for name in names:
                  path = pathlib.Path(directory) / name
                  files.append((path.lstat().st_size, path.relative_to(root).as_posix()))
          files.sort(key=lambda entry: (-entry[0], entry[1]))
          total = sum(size for size, _ in files)
          directory_bytes = dict.fromkeys(("bin", "lib/clang/22/include", "lib/clang/22/lib", "lib other"), 0)
          for size, name in files:
              if name.startswith("bin/"):
                  directory_bytes["bin"] += size
              elif name.startswith("lib/clang/22/include/"):
                  directory_bytes["lib/clang/22/include"] += size
              elif name.startswith("lib/clang/22/lib/"):
                  directory_bytes["lib/clang/22/lib"] += size
              elif name.startswith("lib/"):
                  directory_bytes["lib other"] += size
          disk_kib = int(subprocess.check_output(["du", "-sk", str(root)], text=True).split()[0])
          lines = [f"Uncompressed file bytes (symlinks counted as link text): {total}",
                   f"Allocated disk KiB (du -sk): {disk_kib}",
                   f"tar czf bytes: {archive.stat().st_size}",
                   "", "Per-directory uncompressed file bytes:"]
          lines.extend(f"{size:>14}  {name}" for name, size in directory_bytes.items())
          lines.extend(["", "15 largest files (bytes, relative path):"])
          lines.extend(f"{size:>14}  {name}" for size, name in files[:15])
          text = "\n".join(lines) + "\n"
          provenance = (reports / "source-verification.txt").read_text()
          (reports / "size-listing.txt").write_text(provenance + "\n" + text +
              "\nComplete size inventory (bytes, relative path):\n" +
              "".join(f"{size:>14}  {name}\n" for size, name in files))
          print(text, end="")
          PY

      - name: Relocate, compile, link and check missing builtin headers
        run: |
          set -euo pipefail
          # Removing the full input also prevents a successful compile or
          # loader resolution from accidentally using that untrimmed tree.
          moved="$TRIAL_DIR/relocated toolchain"
          mv "$TRIAL_DIR/subset" "$moved"
          rm -rf "$TRIAL_DIR/extracted"
          unset CPATH C_INCLUDE_PATH CPLUS_INCLUDE_PATH OBJC_INCLUDE_PATH
          unset LIBRARY_PATH LD_LIBRARY_PATH DYLD_LIBRARY_PATH DYLD_FALLBACK_LIBRARY_PATH
          unset LD_PRELOAD DYLD_INSERT_LIBRARIES DYLD_FRAMEWORK_PATH DYLD_FALLBACK_FRAMEWORK_PATH
          unset GCC_EXEC_PREFIX COMPILER_PATH SDKROOT

          # On the disposable Linux runner, make the named host clang and LLVM
          # locations unavailable for the entire smoke and negative check.
          # Restore them even if a check fails, before action post-steps run.
          hidden="$TRIAL_DIR/hidden-host-toolchain"
          mkdir -p "$hidden/bin" "$hidden/lib"
          restore_host() {
            if [ "$RUNNER_OS" = Linux ]; then
              shopt -s nullglob
              for path in "$hidden/bin"/*; do sudo mv "$path" /usr/bin/; done
              for path in "$hidden/lib"/*; do sudo mv "$path" /usr/lib/; done
            fi
          }
          trap restore_host EXIT
          if [ "$RUNNER_OS" = Linux ]; then
            shopt -s nullglob
            for path in /usr/bin/clang*; do sudo mv "$path" "$hidden/bin/"; done
            for path in /usr/lib/llvm-*; do sudo mv "$path" "$hidden/lib/"; done
            remaining=(/usr/bin/clang* /usr/lib/llvm-*)
            test "${#remaining[@]}" -eq 0
            echo 'which -a clang after hiding /usr/bin/clang* and /usr/lib/llvm-*:'
            which -a clang || true
          fi

          mkdir -p "$TRIAL_DIR/unrelated cwd" "$TRIAL_DIR/driver alias"
          alias="$TRIAL_DIR/driver alias/clang"
          ln -s "$moved/bin/clang" "$alias"
          cd "$TRIAL_DIR/unrelated cwd"
          clang="$moved/bin/clang"
          export MOVED_TOOLCHAIN="$moved"
          # All compiler invocations go through this function. The one external
          # symlink is checked by its resolved path, never by a PATH lookup.
          invoke_clang() {
            local driver="$1"
            shift
            python3 - "$driver" <<'PY' || return
          import os, pathlib, sys
          driver = pathlib.Path(sys.argv[1])
          root = pathlib.Path(os.environ["MOVED_TOOLCHAIN"]).resolve()
          if not driver.is_absolute():
              raise SystemExit("Compiler invocation is not absolute")
          driver.resolve(strict=True).relative_to(root)
          PY
            printf 'Compiler command:'
            printf ' %q' "$driver" "$@"
            printf '\n'
            "$driver" "$@"
          }
          invoke_clang "$alias" --version
          resource="$(invoke_clang "$alias" -print-resource-dir | tail -n 1)"
          printf 'clang -print-resource-dir: %s\n' "$resource"
          python3 - "$moved" "$resource" <<'PY'
          import pathlib, sys
          root, resource = (pathlib.Path(value).resolve(strict=True) for value in sys.argv[1:])
          resource.relative_to(root)
          if not (resource / "include/stddef.h").is_file():
              raise SystemExit("Resource directory lacks builtin stddef.h")
          PY
          "$moved/bin/ld.lld" --version
          "$moved/bin/ld64.lld" --version

          link_flags=()
          if [ "$RUNNER_OS" = Linux ]; then
            link_flags=(-fuse-ld=lld "--ld-path=$moved/bin/ld.lld")
            ldd "$clang" | tee "$REPORT_DIR/relocated-dependencies.txt"
            if grep -E '/usr/lib/llvm-|/hidden-host-toolchain/|/extracted/' "$REPORT_DIR/relocated-dependencies.txt"; then
              echo 'Relocated clang uses an excluded LLVM tree' >&2
              exit 1
            fi
          else
            sdk="$(xcrun --sdk macosx --show-sdk-path)"
            ld="$(xcrun --find ld)"
            test -d "$sdk"
            test -x "$ld"
            printf 'System SDK: %s\nSystem linker: %s\n' "$sdk" "$ld"
            link_flags=(-isysroot "$sdk" "--ld-path=$ld")
            otool -L "$clang" | tee "$REPORT_DIR/relocated-dependencies.txt"
          fi
          cat > smoke.c <<'C'
          #include <stddef.h>
          #include <stdatomic.h>
          int main(void) {
            _Atomic(int) value = 40;
            size_t count = 2;
            return atomic_fetch_add(&value, (int)count) == 40 &&
                   atomic_load(&value) == 42 ? 0 : 1;
          }
          C
          # -nostdlibinc leaves clang's builtin directory enabled while removing
          # system/SDK header fallback. The positive and negative use identical
          # header flags, so failure specifically witnesses removed resources.
          invoke_clang "$alias" -std=c11 -nostdlibinc "${link_flags[@]}" smoke.c -o smoke
          ./smoke

          cat > thin-helper.c <<'C'
          #include <stddef.h>
          #include <stdatomic.h>
          int answer(size_t count) {
            _Atomic(int) value = 40;
            return atomic_fetch_add(&value, (int)count) + (int)count;
          }
          C
          cat > thin-main.c <<'C'
          #include <stddef.h>
          extern int answer(size_t);
          int main(void) { return answer(2) == 42 ? 0 : 1; }
          C
          invoke_clang "$clang" -std=c11 -nostdlibinc -flto=thin "${link_flags[@]}" \
            thin-main.c thin-helper.c -o thin-smoke -### 2> "$REPORT_DIR/thin-link-command.txt"
          cat "$REPORT_DIR/thin-link-command.txt"
          if [ "$RUNNER_OS" = macOS ]; then
            python3 - "$moved" "$REPORT_DIR/thin-link-command.txt" <<'PY'
          import pathlib, shlex, sys
          root = pathlib.Path(sys.argv[1]).resolve()
          found = []
          for line in pathlib.Path(sys.argv[2]).read_text().splitlines():
              if not line.lstrip().startswith('"'):
                  continue
              args = shlex.split(line)
              for index, arg in enumerate(args):
                  if arg == "-lto_library":
                      selected = pathlib.Path(args[index + 1])
                      library = selected.resolve(strict=True)
                      library.relative_to(root)
                      if selected.name != "libLTO.dylib":
                          raise SystemExit(f"Unexpected LTO library: {selected}")
                      found.append(library)
          if not found:
              raise SystemExit("System linker command does not select bundled -lto_library")
          print("System linker LTO library:", *found)
          PY
          fi
          invoke_clang "$clang" -std=c11 -nostdlibinc -flto=thin "${link_flags[@]}" \
            thin-main.c thin-helper.c -o thin-smoke
          ./thin-smoke

          incomplete="$TRIAL_DIR/incomplete toolchain"
          cp -a "$moved" "$incomplete"
          rm -rf "$incomplete/lib/clang/22/include"
          # A disposable copy is another allowed bundle root for this command.
          export MOVED_TOOLCHAIN="$incomplete"
          if invoke_clang "$incomplete/bin/clang" -std=c11 -nostdlibinc \
              -c smoke.c -o missing-headers.o > "$REPORT_DIR/missing-headers.txt" 2>&1; then
            echo 'Compiling without builtin headers unexpectedly succeeded' >&2
            exit 1
          fi
          cat "$REPORT_DIR/missing-headers.txt"
          grep -E "(fatal error:.*stddef.h.*(not found|No such file))" "$REPORT_DIR/missing-headers.txt"

      - name: Upload inventory and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toolchain-package-trial-${{ matrix.platform }}
          path: ${{ env.REPORT_DIR }}/
          if-no-files-found: warn
          retention-days: 7

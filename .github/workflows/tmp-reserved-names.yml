# Temporary quick check for coord-wfbl-04-18; removed before the full check.
name: tmp-reserved-names

on:
  push:
    branches: [claude/reserved-names]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0

jobs:
  quick:
    name: ${{ matrix.stage }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        stage: [static, focused]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - name: Set the scratch root
        run: |
          echo "WHITEFOOT_SCRATCH_ROOT=$RUNNER_TEMP/whitefoot" >> "$GITHUB_ENV"
          echo "WHITEFOOT_TIME_BUDGET_RECORD=$RUNNER_TEMP/time-budget-overruns.txt" >> "$GITHUB_ENV"
      - name: Name main as a local ref
        run: |
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          git branch -f main origin/main
      - name: Select the design review base
        if: matrix.stage == 'static'
        run: |
          design_review_base=$(sh design/skill/review-base.sh push "$GITHUB_REF" "")
          echo "DESIGN_REVIEW_BASE=$design_review_base" >> "$GITHUB_ENV"
          git log --oneline -1 "$design_review_base"
      - name: Install the host toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          rustup default stable
          rustup component add clippy rustfmt
          cargo --version
      - name: Fetch locked compiler dependencies
        run: cargo fetch --locked --manifest-path compiler/Cargo.toml
      - name: Decline core dumps
        run: sudo sysctl -w kernel.core_pattern=core
      # The static group holds the design tree's form check, the compiler's
      # format and lint checks; design-ready adds the new-log-entry check.
      - name: Static group
        if: matrix.stage == 'static'
        env:
          WHITEFOOT_CHECK_TIMEOUT: 2400
        run: |
          make check-group GROUP=static
          make design-ready
      # The reserved-name wording and its derivations, the parser and the
      # declaration inventory refusals that carry the rename, and the pinned
      # repair pairs that carry it out.
      - name: Reserved-name tests
        if: matrix.stage == 'focused'
        env:
          WHITEFOOT_CHECK_TIMEOUT: 2400
        run: |
          perl .github/run-check.pl tmp-reserved-names cargo test --manifest-path compiler/Cargo.toml --profile gate --locked --offline --lib -- diagnostic_repairs::reserved_names driver::pinned_repairs syntax::parser resolution::tests driver::diagnostic

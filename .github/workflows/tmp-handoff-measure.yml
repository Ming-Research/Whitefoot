# Temporary: the second 14900K measurements of item 159
# (research/investigations/driver-handoff/DESIGN.md, "Plan for the 14900K
# measurements" under "Second 14900K run"), base main 1d961ddab against this
# commit. Removed before the full check.
name: tmp-handoff-measure

on:
  push:
    branches: ['wf-try/work-159-26e0fade/commit/**']

concurrency:
  group: tmp-handoff-measure-14900k
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  measure:
    runs-on: [self-hosted, 14900k]
    timeout-minutes: 600
    env:
      BASE_REV: 1d961ddabaf0580add827a633560c0b66afb26e5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the host's tools
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          missing=
          for tool in clang ld.lld cargo rustc redis-benchmark redis-cli taskset perl python3 git make cc; do
            command -v "$tool" >/dev/null || missing="$missing $tool"
          done
          echo "cpus: $(nproc)"
          echo "model: $(awk -F': ' '/^model name/ {print $2; exit}' /proc/cpuinfo)"
          echo "runner: $RUNNER_NAME"
          if [ -n "$missing" ]; then
            echo "missing:$missing"
            exit 1
          fi

      # The host's check lock (run-check.pl) keeps other measurements and
      # builds that take it off the host while this one runs; one that holds
      # it makes run-check.pl exit 75 before anything starts, so the step
      # waits for it, at most five hours, and then holds it throughout.
      - name: Build and measure, holding the host's check lock
        env:
          WHITEFOOT_CHECK_TIMEOUT: "32400"
        run: |
          cat >"$RUNNER_TEMP/measure.sh" <<'SCRIPT'
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/measure/compare" "$RUNNER_TEMP/measure/yield"
          git worktree prune
          for side in base candidate; do
            if [ "$side" = base ]; then rev=$BASE_REV; else rev=$GITHUB_SHA; fi
            tree="$RUNNER_TEMP/tree-$side"
            rm -rf "$tree"
            git worktree add --detach "$tree" "$rev"
            echo "revision,$side,$(git -C "$tree" rev-parse HEAD)" | tee -a "$RUNNER_TEMP/measure/revisions.csv"
            cargo fetch --locked --manifest-path "$tree/compiler/Cargo.toml"
            make -C "$tree/compiler" build
            "$tree/compiler/target/gate/whitefootc" --full-lto \
              --graph "$tree/apps/firn/modules.wfg" --entry firn -o "$RUNNER_TEMP/measure/compare/$side"
          done
          OUT="$RUNNER_TEMP/measure/yield" \
            BASE_WFC="$RUNNER_TEMP/tree-base/compiler/target/gate/whitefootc" \
            CAND_WFC="$RUNNER_TEMP/tree-candidate/compiler/target/gate/whitefootc" \
            BASE_REV="$BASE_REV" CAND_REV="$GITHUB_SHA" \
            sh research/experiments/handoff-yield-check/run.sh 2>&1 | tee "$RUNNER_TEMP/measure/yield/run.txt"
          compare="$RUNNER_TEMP/measure/compare"
          OUT="$compare" \
            IMAGES="base=$compare/base candidate=$compare/candidate base-twin=$compare/base" \
            COMPARE_CPUS="1 2" COMPARE_TESTS="mset set get" COMPARE_DEPTHS="16 1" \
            COMPARE_PASSES=6 COMPARE_SECONDS=5 COMPARE_QUIET=0.05 COMPARE_CLIENTS=2000 \
            sh research/experiments/io-completion-bench/redis-bench.sh compare 2>&1 | tee "$compare/bench.txt"
          SCRIPT
          waited=0
          while :; do
            status=0
            perl .github/run-check.pl handoff/measure bash "$RUNNER_TEMP/measure.sh" || status=$?
            if [ "$status" -ne 75 ]; then
              exit "$status"
            fi
            if [ "$waited" -ge 18000 ]; then
              exit 75
            fi
            sleep 60
            waited=$((waited + 60))
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: handoff-measure-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/measure/**/*.csv
            ${{ runner.temp }}/measure/**/*.tsv
            ${{ runner.temp }}/measure/**/*.txt

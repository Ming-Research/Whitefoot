# Temporary: the 14900K measurements of item 159
# (research/investigations/driver-handoff/DESIGN.md, "Plan for the 14900K
# measurements"), base main 469944ea4 against this commit. Removed before the
# full check.
name: tmp-handoff-measure

on:
  push:
    paths:
      - .github/workflows/tmp-handoff-measure.yml

defaults:
  run:
    shell: bash

jobs:
  measure:
    runs-on: [self-hosted, 14900k]
    timeout-minutes: 150
    env:
      BASE_REV: 469944ea438bce0770ec58a18d8f474ecd14b050
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the host's tools
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          missing=
          for tool in clang ld.lld cargo rustc redis-benchmark redis-cli taskset perl python3 git make cc; do
            command -v "$tool" >/dev/null || missing="$missing $tool"
          done
          echo "cpus: $(nproc)"
          echo "model: $(awk -F': ' '/^model name/ {print $2; exit}' /proc/cpuinfo)"
          echo "runner: $RUNNER_NAME"
          if [ -n "$missing" ]; then
            echo "missing:$missing"
            exit 1
          fi

      - name: Build the base and candidate compilers and Firn images
        run: |
          mkdir -p "$RUNNER_TEMP/measure/compare"
          git worktree prune
          for side in base candidate; do
            if [ "$side" = base ]; then rev=$BASE_REV; else rev=$GITHUB_SHA; fi
            tree="$RUNNER_TEMP/tree-$side"
            rm -rf "$tree"
            git worktree add --detach "$tree" "$rev"
            echo "revision,$side,$(git -C "$tree" rev-parse HEAD)" | tee -a "$RUNNER_TEMP/measure/revisions.csv"
            cargo fetch --locked --manifest-path "$tree/compiler/Cargo.toml"
            make -C "$tree/compiler" build
            "$tree/compiler/target/gate/whitefootc" --full-lto \
              --graph "$tree/apps/firn/modules.wfg" --entry firn -o "$RUNNER_TEMP/measure/compare/$side"
          done

      - name: Measure the latencies and the fixed cost
        env:
          OUT: ${{ runner.temp }}/measure/yield
          BASE_WFC: ${{ runner.temp }}/tree-base/compiler/target/gate/whitefootc
          CAND_WFC: ${{ runner.temp }}/tree-candidate/compiler/target/gate/whitefootc
          CAND_REV: ${{ github.sha }}
          WHITEFOOT_CHECK_TIMEOUT: "3600"
        run: |
          mkdir -p "$OUT"
          perl .github/run-check.pl handoff/yield \
            sh research/experiments/handoff-yield-check/run.sh 2>&1 | tee "$OUT/run.txt"

      - name: Compare Firn images
        env:
          OUT: ${{ runner.temp }}/measure/compare
          IMAGES: base=${{ runner.temp }}/measure/compare/base candidate=${{ runner.temp }}/measure/compare/candidate base-twin=${{ runner.temp }}/measure/compare/base
          COMPARE_CPUS: "1 2"
          COMPARE_TESTS: "mset set get"
          COMPARE_DEPTHS: "16 1"
          COMPARE_PASSES: "4"
          COMPARE_SECONDS: "5"
          WHITEFOOT_CHECK_TIMEOUT: "6000"
        run: |
          perl .github/run-check.pl handoff/firn-compare \
            sh research/experiments/io-completion-bench/redis-bench.sh compare 2>&1 | tee "$OUT/bench.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: handoff-measure-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/measure/**/*.csv
            ${{ runner.temp }}/measure/**/*.tsv
            ${{ runner.temp }}/measure/**/*.txt

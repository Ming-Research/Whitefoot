# Temporary: time the checker on Halo-wf's pkg::vm on the 14900K (board item
# proof-bl-cost-halo-check), a baseline after the runner's reinstall.
# Removed before the branch is ready.
name: time-halo-check

on:
  push:
    branches: [claude/halo-check-cost]
    paths: [.github/workflows/time-halo-check.yml]

jobs:
  time:
    runs-on: [self-hosted, 14900k]
    timeout-minutes: 30
    env:
      CPUS: "2-15"
      RUNS: "10"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Ming-Research/Halo-wf
          ref: 99150005f5681780d0fe9d83f22f2b7792198ac7
          path: halo
      - name: Machine
        run: |
          lscpu | grep -E "Model name|^CPU\(s\)|MHz|Thread|Core"
          git rev-parse HEAD
      - name: Put the runner's cargo on PATH
        run: |
          if [ -d "$HOME/.cargo/bin" ]; then
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - name: Build the compiler as releases are built
        run: cargo build --manifest-path compiler/Cargo.toml --locked --profile gate --bin whitefootc
      - name: Time pkg::vm, interleaved with a twin of the same binary
        run: |
          set +e
          bin=$GITHUB_WORKSPACE/compiler/target/gate/whitefootc
          twin=$RUNNER_TEMP/whitefootc-twin
          cp "$bin" "$twin"
          cd halo/lib/halo
          taskset -c "$CPUS" "$bin" --check --graph modules.wfg --check-module pkg::vm > /dev/null
          echo "warm-up exit $?"
          : > $RUNNER_TEMP/times.tsv
          for i in $(seq 1 "$RUNS"); do
            for which in base twin; do
              exe=$bin; [ "$which" = twin ] && exe=$twin
              /usr/bin/time -f "%e %M %x" -o $RUNNER_TEMP/one taskset -c "$CPUS" "$exe" --check --graph modules.wfg --check-module pkg::vm > /dev/null
              echo "$which $(cat $RUNNER_TEMP/one)" >> $RUNNER_TEMP/times.tsv
            done
          done
          cat $RUNNER_TEMP/times.tsv
          python3 - "$RUNNER_TEMP/times.tsv" <<'PY'
          import sys, statistics as st
          rows = [l.split() for l in open(sys.argv[1]) if l.strip()]
          for which in ("base", "twin"):
              xs = sorted(float(r[1]) for r in rows if r[0] == which)
              print(f"{which}: n={len(xs)} median={st.median(xs):.2f}s min={xs[0]:.2f}s max={xs[-1]:.2f}s")
          PY

# Temporary: the experiment's wait-bench.sh on
# GitHub-hosted Linux (the gate's clang 22), macOS with Apple's clang and macOS
# with the pinned upstream clang 22.1.8, each result also written as one notice.
# On the pushes the wf-agents engine makes of this work's commits (the
# `wf-try/work-208-26e0fade/` refs). Removed before the full check (AGENTS.md,
# "Checks").
name: tmp-wait-bench

on:
  push:
    branches: ['wf-try/work-208-26e0fade/**']

permissions:
  contents: read

jobs:
  bench:
    name: wait bench (${{ matrix.set }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - set: linux-llvm-22
            os: ubuntu-24.04
          - set: apple
            os: macos-15
          - set: upstream-22.1.8
            os: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install the compiler
        env:
          SET: ${{ matrix.set }}
        run: |
          set -euo pipefail
          case "$SET" in
            linux-llvm-22)
              curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
              version=$(tr -d '[:space:]' < .github/llvm-major)
              sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
              echo "CLANG=/usr/bin/clang-$version" >> "$GITHUB_ENV"
              echo "SYSROOT=" >> "$GITHUB_ENV"
              ;;
            apple)
              echo "CLANG=/usr/bin/clang" >> "$GITHUB_ENV"
              echo "SYSROOT=" >> "$GITHUB_ENV"
              ;;
            upstream-22.1.8)
              asset=$(python3 -c 'import json; print(json.load(open(".github/toolchain/llvm-assets.json"))["platforms"]["macos-arm64"]["asset"])')
              digest=$(python3 -c 'import json; print(json.load(open(".github/toolchain/llvm-assets.json"))["platforms"]["macos-arm64"]["sha256"])')
              tag=$(python3 -c 'import json; print(json.load(open(".github/toolchain/llvm-assets.json"))["llvm_tag"])')
              curl --fail --location --retry 3 --max-time 600 \
                "https://github.com/llvm/llvm-project/releases/download/$tag/$asset" -o "$RUNNER_TEMP/$asset"
              echo "$digest  $RUNNER_TEMP/$asset" | shasum -a 256 -c -
              mkdir -p "$RUNNER_TEMP/llvm"
              tar -xJf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/llvm"
              root=$(echo "$RUNNER_TEMP"/llvm/*)
              echo "CLANG=$root/bin/clang" >> "$GITHUB_ENV"
              echo "SYSROOT=$(/usr/bin/xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
              ;;
          esac

      # A workflow that a push starts reads no file under the research
      # directory (.github/check-research-inputs.py), so the two files of the
      # instrument are written here byte for byte as the experiment keeps them.
      - name: Write the instrument
        run: |
          mkdir -p "$RUNNER_TEMP/bench"
          cat > "$RUNNER_TEMP/bench/wait-bench.c" <<'WAIT_BENCH_C'
          /* The cost of one call of wf_file_wait_readiness (completion/file_posix.c), the
           * runtime's one C frame over a page, whose prologue the stack-probe arguments
           * change. Every entry names one readable pipe and the timeout is zero, so the
           * poll answers at once: the cheapest call the function makes, which puts the
           * prologue's share of a call at its largest. One process times one batch of
           * calls and prints the nanoseconds per call. A call must answer at least one
           * entry; Linux answers every one, while macOS's poll folds entries that name
           * the same descriptor, which both variants of a comparison meet alike.
           *
           * usage: wait-bench COUNT CALLS
           * Built and run by wait-bench.sh; see README.md, "The cost of the probe
           * prologue". */
          #define _POSIX_C_SOURCE 200809L
          #include <stdio.h>
          #include <stdlib.h>
          #include <time.h>
          #include <unistd.h>

          #include "file_adapter.h"

          static double now_ns(void) {
              struct timespec at;
              clock_gettime(CLOCK_MONOTONIC, &at);
              return (double)at.tv_sec * 1e9 + (double)at.tv_nsec;
          }

          int main(int argc, char **argv) {
              if (argc != 3) {
                  fprintf(stderr, "usage: %s COUNT CALLS\n", argv[0]);
                  return 2;
              }
              size_t count = (size_t)strtoul(argv[1], NULL, 10);
              unsigned long calls = strtoul(argv[2], NULL, 10);
              int fds[2];
              if (count == 0 || count > WF_FILE_READINESS_BATCH || calls == 0 || pipe(fds) != 0
                  || write(fds[1], "x", 1) != 1) {
                  fprintf(stderr, "cannot set up the benchmark\n");
                  return 2;
              }
              wf_file_readiness *entries = calloc(count, sizeof(*entries));
              if (entries == NULL) {
                  return 2;
              }
              for (size_t index = 0; index < count; index++) {
                  entries[index].descriptor = fds[0];
                  entries[index].events = WF_FILE_READABLE;
              }
              /* The first calls also touch the stack pages and the descriptor table. */
              for (unsigned long call = 0; call < calls / 10 + 1; call++) {
                  int answered = wf_file_wait_readiness(entries, count, 0);
                  if (answered < 1 || (size_t)answered > count) {
                      fprintf(stderr, "the wait answered %d of %zu entries\n", answered, count);
                      return 1;
                  }
              }
              double begin = now_ns();
              for (unsigned long call = 0; call < calls; call++) {
                  int answered = wf_file_wait_readiness(entries, count, 0);
                  if (answered < 1 || (size_t)answered > count) {
                      fprintf(stderr, "the wait answered %d of %zu entries\n", answered, count);
                      return 1;
                  }
              }
              printf("%.2f\n", (now_ns() - begin) / (double)calls);
              return 0;
          }
          WAIT_BENCH_C
          cat > "$RUNNER_TEMP/bench/wait-bench.sh" <<'WAIT_BENCH_SH'
          #!/usr/bin/env bash
          # Time wf_file_wait_readiness (completion/file_posix.c) compiled under each
          # variant's probe arguments, the variants run one after another in rotating
          # order within every round so that drift of the machine reaches each alike, and
          # print a median of the paired per-round ratios to the first variant. Also
          # prints, for each variant, how many page steps and touches the function's
          # assembly holds and whether that assembly is the first variant's.
          # Written for macOS's /bin/bash 3.2 as well.
          #
          # usage: wait-bench.sh CLANG SYSROOT LABEL NAME=ARGUMENTS...
          #   CLANG      the clang to run
          #   SYSROOT    the macOS SDK for an upstream clang, or empty
          #   LABEL      a name for this set
          #   NAME=ARGS  one variant: its name and the probe arguments it compiles with,
          #              split on spaces; the first variant is the baseline
          # ROUNDS (default 15) rounds per count. Run from the repository root; the C
          # source is read from the directory of this script.
          #
          # The unit is compiled as the driver compiles a runtime unit (-std=c11
          # -pthread -I… -O2 -falign-functions=64), on Linux also with
          # -ffunction-sections, so that the linker, which is told to drop what main
          # cannot reach, leaves out every other function of the unit and with it their
          # references to the rest of the runtime (a Mach-O linker drops them by symbol).
          set +e
          clang="$1"; sysroot_path="$2"; label="$3"; shift 3
          rounds="${ROUNDS:-15}"
          src=compiler/src/backend
          here=$(cd "$(dirname "$0")" && pwd)
          out="${TMPDIR:-/tmp}/wait-bench-$label"
          rm -rf "$out"; mkdir -p "$out"
          sysroot=()
          if [ -n "$sysroot_path" ]; then sysroot=(-isysroot "$sysroot_path"); fi
          common=(-std=c11 -pthread -I "$src" -I "$src/completion")
          if [ "$(uname -s)" = Darwin ]; then
            link=(-Wl,-dead_strip)
            sections=()
          else
            link=(-no-pie -Wl,--gc-sections -Wl,--unresolved-symbols=ignore-all)
            sections=(-ffunction-sections)
          fi
          pin=()
          if command -v taskset > /dev/null 2>&1; then pin=(taskset -c 1); fi

          "$clang" ${sysroot[@]+"${sysroot[@]}"} "${common[@]}" -O2 -c -o "$out/bench.o" "$here/wait-bench.c" || exit 1
          names=()
          for spec in "$@"; do
            name="${spec%%=*}"; args="${spec#*=}"
            names+=("$name")
            # shellcheck disable=SC2086
            "$clang" ${sysroot[@]+"${sysroot[@]}"} "${common[@]}" -O2 -falign-functions=64 ${sections[@]+"${sections[@]}"} $args \
              -c -o "$out/$name.o" "$src/completion/file_posix.c" || exit 1
            # shellcheck disable=SC2086
            "$clang" ${sysroot[@]+"${sysroot[@]}"} "${common[@]}" -O2 -falign-functions=64 ${sections[@]+"${sections[@]}"} $args \
              -S -o "$out/$name.s" "$src/completion/file_posix.c" || exit 1
            "$clang" ${sysroot[@]+"${sysroot[@]}"} -pthread ${link[@]+"${link[@]}"} -o "$out/$name" "$out/bench.o" "$out/$name.o" || exit 1
            steps=$(awk -v a='wf_file_wait_readiness:' -v b='_wf_file_wait_readiness:' '
              $1 == a || $1 == b { inside = 1 }
              inside && /\.cfi_endproc/ { exit }
              inside && (/subq[ \t]+\$4096, %rsp/ || /sub[ \t]+sp, sp, #1, lsl #12/ || /___chkstk_darwin/) { n++ }
              END { print n + 0 }' "$out/$name.s")
            same=no; if cmp -s "$out/$name.s" "$out/${names[0]}.s"; then same=yes; fi
            echo "variant $name: arguments [$args], page steps or helper calls in the function: $steps, assembly equal to ${names[0]}'s: $same"
          done

          table="$out/times.tsv"; : > "$table"
          for count in 1 64 4096; do
            case "$count" in 1) calls=300000 ;; 64) calls=100000 ;; *) calls=3000 ;; esac
            round=0
            while [ "$round" -lt "$rounds" ]; do
              round=$((round + 1))
              total=${#names[@]}
              shift_by=$(( (round - 1) % total ))
              i=0
              while [ "$i" -lt "$total" ]; do
                name="${names[$(( (i + shift_by) % total ))]}"
                ns=$(${pin[@]+"${pin[@]}"} "$out/$name" "$count" "$calls") || { echo "!!! $name failed at count $count"; exit 1; }
                printf '%s\t%s\t%s\t%s\n' "$count" "$round" "$name" "$ns" >> "$table"
                i=$((i + 1))
              done
            done
          done

          python3 -I - "$table" "${names[0]}" <<'PY'
          import collections, statistics, sys
          rows = collections.defaultdict(dict)   # (count, round) -> {variant: ns}
          order = []
          for line in open(sys.argv[1]):
              count, rnd, name, ns = line.split('\t')
              rows[(int(count), int(rnd))][name] = float(ns)
              if name not in order:
                  order.append(name)
          base = sys.argv[2]
          print('entries  variant            median ns/call   paired ratio to %s (median, min..max)' % base)
          for count in sorted({c for c, _ in rows}):
              rounds = [rows[(c, r)] for c, r in sorted(rows) if c == count]
              for name in order:
                  values = [r[name] for r in rounds]
                  ratios = [r[name] / r[base] for r in rounds]
                  print('%7d  %-17s %14.1f   %.4f (%.4f..%.4f)' % (
                      count, name, statistics.median(values), statistics.median(ratios), min(ratios), max(ratios)))
          PY
          WAIT_BENCH_SH

      - name: Time the wait under each variant
        env:
          SET: ${{ matrix.set }}
        run: |
          set +e
          bench="$RUNNER_TEMP/bench/wait-bench.sh"
          "$CLANG" --version | head -1
          case "$SET" in
            linux-llvm-22)
              bash "$bench" "$CLANG" "$SYSROOT" "$SET" 'none=' 'clash=-fstack-clash-protection' > bench.txt 2>&1 ;;
            apple)
              bash "$bench" "$CLANG" "$SYSROOT" "$SET" 'default=' 'stack-check=-fstack-check' 'no-stack-check=-fno-stack-check' > bench.txt 2>&1 ;;
            upstream-22.1.8)
              bash "$bench" "$CLANG" "$SYSROOT" "$SET" 'none=' 'clash-cc1=-Xclang -fstack-clash-protection' > bench.txt 2>&1 ;;
          esac
          status=$?
          cat bench.txt
          cat bench.txt >> "$GITHUB_STEP_SUMMARY"
          body=$(sed -e 's/%/%25/g' bench.txt | awk '{ printf "%s%%0A", $0 }')
          echo "::notice title=wait bench $SET::$body"
          exit $status

# Temporary quick check for wf-dir-listing-names; deleted before the full check.
name: tmp-dir-listing-names

on:
  push:
    branches: [wf-dir-listing-names]

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - name: Set the scratch root
        run: |
          echo "WHITEFOOT_SCRATCH_ROOT=$RUNNER_TEMP/whitefoot" >> "$GITHUB_ENV"
          echo "WHITEFOOT_TIME_BUDGET_RECORD=$RUNNER_TEMP/time-budget-overruns.txt" >> "$GITHUB_ENV"
      - name: Name main as a local ref
        run: |
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          git branch -f main origin/main
          echo "DESIGN_REVIEW_BASE=$(git merge-base origin/main HEAD)" >> "$GITHUB_ENV"
      - name: Install the host toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          version=$(tr -d '[:space:]' < .github/llvm-major)
          sudo bash "$RUNNER_TEMP/llvm.sh" "$version"
          sudo ln -sf "/usr/bin/clang-$version" /usr/bin/clang
          sudo ln -sf "/usr/bin/ld.lld-$version" /usr/bin/ld.lld
          rustup default stable
          rustup component add clippy rustfmt
          cargo fetch --locked --manifest-path compiler/Cargo.toml
          sudo sysctl -w kernel.core_pattern=core
      - name: Static group
        run: make check-group GROUP=static
      - name: Design and specification readiness
        run: make design-ready
      - name: Decoder records
        run: perl .github/run-check.pl tmp-enumeration cargo test --manifest-path compiler/Cargo.toml --profile gate --locked --offline --lib enumeration_records
      - name: Programs that list and name entries
        run: |
          perl .github/run-check.pl tmp-programs cargo test --manifest-path compiler/Cargo.toml --profile gate --locked --offline --test corpus -- programs::traversal:: programs::wfgrep:: programs::wfgrep_hosts:: programs::host_paths:: programs::file_replacement::
      - name: Conformance adapter
        run: |
          perl .github/run-check.pl tmp-conformance cargo test --manifest-path compiler/Cargo.toml --profile gate --locked --offline --test corpus -- conformance::adapter::
      - name: POSIX ordinary values probe
        run: perl .github/run-check.pl tmp-ordinary-values make -C compiler ordinary-values-test

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      WINDOWS_CLANG: clang --target=x86_64-w64-windows-gnu
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned llvm-mingw
        run: |
          set -euo pipefail
          root=$(bash .github/toolchain/fetch-llvm-mingw.sh .github/toolchain/llvm-assets.json \
            "$RUNNER_TEMP/llvm-mingw-archives" "$RUNNER_TEMP/llvm-mingw" | tail -n 1)
          echo "LLVM_MINGW_ROOT=$root" >> "$GITHUB_ENV"
          cygpath -w "$root/bin" >> "$GITHUB_PATH"
      - name: Construct Windows native test images
        run: |
          if ! command -v make > /dev/null; then
            choco install make --yes --no-progress
          fi
          make -C compiler -j2 completion-windows-cross WINDOWS_CC="$WINDOWS_CLANG" \
            WINDOWS_LLVM_CC="$WINDOWS_CLANG" SHELL=bash \
            COMPLETION_TMP="$(cygpath -u "$RUNNER_TEMP")/completion"
      - name: Ordinary values probe
        run: |
          probe_dir="$RUNNER_TEMP/completion/ordinary-values"
          mkdir -p "$probe_dir"
          for helpers in 0 2; do
            for group in file directory; do
              WF_IO_HELPERS="$helpers" \
                "$RUNNER_TEMP/completion/windows-ordinary-values-probe.exe" "$probe_dir" "$group"
            done
          done
      - name: Shared Windows program and case tests
        env:
          CARGO_BUILD_JOBS: 2
          RUST_TEST_THREADS: 2
          RUST_MIN_STACK: 8388608
        run: |
          start=$(date +%s)
          cargo test --manifest-path compiler/Cargo.toml --profile gate --locked \
            --test corpus -- programs::windows:: programs::file_replacement:: programs::host_paths:: programs::wfgrep_hosts:: conformance::file_replacement::
          echo "elapsed $(( $(date +%s) - start )) s"

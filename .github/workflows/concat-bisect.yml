# Temporary, inspection-only workflow for halo-req-concat-codegen (status
# board): which main merge between wf-78223721f77d and wf-7062f3ac4ac7 stops
# inlining Halo's table_get and makes concat's copy loop reload metadata per
# byte. It builds one Halo source (Halo-wf claude/halo-pin-7062f3a) with each
# existing release on main's first-parent path and uploads symbols and the
# disassembly of the functions involved. No timing runs here. This file and
# its branch are deleted after the run.
name: concat-bisect

on:
  push:
    branches: [claude/concat-bisect]

defaults:
  run:
    shell: bash

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Ming-Research/Halo-wf
          ref: claude/halo-pin-7062f3a
          submodules: true
          path: halo
      - name: Emit IR before and after #345 and record inlining remarks
        working-directory: halo
        run: |
          set -euo pipefail
          make toolchain
          out="$PWD/build/bisect-out"; mkdir -p "$out"
          OPT=$(command -v opt || ls /usr/lib/llvm-*/bin/opt 2>/dev/null | sort -V | tail -1)
          echo "opt = $OPT"; "$OPT" --version | head -3
          for release in wf-9497f0a54fec wf-exp-b8cf83108946; do
            echo "release = $release" > whitefoot.pin
            make compiler
            make toolchain-check
            wfc=build/whitefoot/$release/whitefootc
            "$wfc" --graph research/experiments/halo-bench/modules.wfg --entry bench --emit-llvm -o "$out/$release.ll"
            awk '/^define .*halo\.heap\.table_get[(\"]/,/^}/' "$out/$release.ll" > "$out/ir-table_get-$release.ll"
            grep -n 'halo.heap.table_get(' "$out/$release.ll" | grep -v '^[0-9]*:define' | head -20 > "$out/ir-calls-$release.txt" || true
            "$OPT" -passes='default<O3>' -pass-remarks-missed=inline -pass-remarks-analysis=inline -pass-remarks=inline \
              "$out/$release.ll" -o /dev/null 2> "$out/remarks-$release.txt" || echo "opt failed for $release"
            echo "$release: inline remarks for table_get"
            grep -E "table_get'|table_get\b" "$out/remarks-$release.txt" | grep -v table_get_str | sed -E 's/ at callsite.*//' | sort | uniq -c | sort -rn | head -8
          done
          git checkout -- whitefoot.pin
      - uses: actions/upload-artifact@v4
        with:
          name: concat-bisect
          path: halo/build/bisect-out

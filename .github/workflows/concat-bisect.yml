# Temporary, inspection-only workflow for halo-req-concat-codegen (status
# board): which main merge between wf-78223721f77d and wf-7062f3ac4ac7 stops
# inlining Halo's table_get and makes concat's copy loop reload metadata per
# byte. It builds one Halo source (Halo-wf claude/halo-pin-7062f3a) with each
# existing release on main's first-parent path and uploads symbols and the
# disassembly of the functions involved. No timing runs here. This file and
# its branch are deleted after the run.
name: concat-bisect

on:
  push:
    branches: [claude/concat-bisect]

defaults:
  run:
    shell: bash

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Ming-Research/Halo-wf
          ref: claude/halo-pin-7062f3a
          submodules: true
          path: halo
      - name: Build Halo with each release, count out-of-line table_get calls, keep concat_step
        working-directory: halo
        run: |
          set -euo pipefail
          make toolchain
          out="$PWD/build/bisect-out"; mkdir -p "$out"
          for release in wf-78223721f77d wf-7062f3ac4ac7 wf-exp-a92354b8c160; do
            echo "release = $release" > whitefoot.pin
            make compiler
            make toolchain-check
            bin="$out/halo-$release"
            build/whitefoot/$release/whitefootc --graph research/experiments/halo-bench/modules.wfg --entry bench --full-lto -o "$bin"
            calls=$(objdump -d --no-show-raw-insn "$bin" | grep -cE 'call +[0-9a-f]+ <wf_package.halo.heap.table_get>' || true)
            f=$(nm "$bin" | awk '/concat_step/ {print $3}' | head -1)
            objdump -d --no-show-raw-insn -M intel --disassemble="$f" "$bin" > "$out/concat_step-$release.txt"
            echo "$release: table_get out-of-line calls $calls"
          done
          git checkout -- whitefoot.pin
      - uses: actions/upload-artifact@v4
        with:
          name: concat-bisect
          path: halo/build/bisect-out

  snowghost:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Ming-Research/Snowghost-wf
          ref: main
          fetch-depth: 0
          submodules: true
          path: sg
      - name: Snowghost out-of-line calls before #345, after #345 and with Whitefoot#357
        working-directory: sg
        run: |
          set -euo pipefail
          make -s toolchain
          out="$PWD/build/sg-bisect"; mkdir -p "$out"
          for release in wf-9497f0a54fec wf-exp-b8cf83108946 wf-exp-a92354b8c160; do
            if [ "$release" = wf-exp-a92354b8c160 ]; then git checkout -q 15e8d4a7a2a0c9bf94ab01d7cefd8159ebd9b579 -- renderer; fi
            echo "release = $release" > whitefoot.pin
            make -s compiler
            if grep -q '^toolchain-check' whitefoot-kit/whitefoot.mk; then make -s toolchain-check; fi
            wfc=$(realpath build/whitefoot/$release/whitefootc)
            (cd renderer && "$wfc" --graph modules.wfg --entry layout_oracle -o "$out/layout-$release")
            { objdump -d --no-show-raw-insn "$out/layout-$release" | grep -oE 'call +[0-9a-f]+ <[^>+]*' || true; } \
              | sed -E 's/call +[0-9a-f]+ <//' | sort | uniq -c | sort -k2 > "$out/calls-layout-$release.txt"
          done
          git checkout -- whitefoot.pin renderer
          join -1 2 -2 2 -a1 -a2 -e 0 -o 0,1.1,2.1 "$out/calls-layout-wf-9497f0a54fec.txt" "$out/calls-layout-wf-exp-b8cf83108946.txt" > "$out/j1.txt"
          join -1 1 -2 2 -a1 -a2 -e 0 -o 0,1.2,1.3,2.1 "$out/j1.txt" "$out/calls-layout-wf-exp-a92354b8c160.txt" \
            | awk '$2 != $3 || $3 != $4 {print $2, "/", $3, "/", $4, $1}' | grep -vE 'plt|wf__' > "$out/diff.txt" || true
          wc -l < "$out/diff.txt"
          grep -E '\.(next_glyphs|set_links|set_glyph_class|add_scalar_piece|write_item|sizing_reset|size_of|height_relative)(\.body)?$' "$out/diff.txt" || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sg-bisect
          path: sg/build/sg-bisect

# Temporary, inspection-only workflow for halo-req-concat-codegen (status
# board): which main merge between wf-78223721f77d and wf-7062f3ac4ac7 stops
# inlining Halo's table_get and makes concat's copy loop reload metadata per
# byte. It builds one Halo source (Halo-wf claude/halo-pin-7062f3a) with each
# existing release on main's first-parent path and uploads symbols and the
# disassembly of the functions involved. No timing runs here. This file and
# its branch are deleted after the run.
name: concat-bisect

on:
  push:
    branches: [claude/concat-bisect]

defaults:
  run:
    shell: bash

jobs:
  inspect:
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Ming-Research/Halo-wf
          ref: claude/halo-pin-7062f3a
          submodules: true
          path: halo
      - name: Emit IR and inlining remarks for the Whitefoot#357 release
        working-directory: halo
        run: |
          set -euo pipefail
          make toolchain
          out="$PWD/build/bisect-out"; mkdir -p "$out"
          OPT=$(command -v opt-22 || ls /usr/lib/llvm-22/bin/opt)
          for release in wf-exp-4753d28fb4ae; do
            echo "release = $release" > whitefoot.pin
            make compiler
            make toolchain-check
            wfc=build/whitefoot/$release/whitefootc
            "$wfc" --graph research/experiments/halo-bench/modules.wfg --entry bench --emit-llvm -o "$out/$release.ll"
            "$OPT" -passes='default<O3>' -pass-remarks-missed=inline -pass-remarks=inline "$out/$release.ll" -o "$out/$release.opt.ll" 2> "$out/remarks-$release.txt" || echo "opt failed"
            "$OPT" -S -passes='default<O3>' "$out/$release.ll" -o "$out/$release.O3.ll" || true
            grep -E "'wf_package.halo.heap.table_get' " "$out/remarks-$release.txt" | sed -E "s/.*table_get' (not inlined|inlined) into '([^']*)'.*(cost=[0-9]+, threshold=[0-9]+).*/\1 \2 \3/" | sort | uniq -c | sort -rn | head -20
            rm -f "$out/$release.opt.ll"
          done
          git checkout -- whitefoot.pin
      - uses: actions/upload-artifact@v4
        with:
          name: concat-bisect
          path: halo/build/bisect-out

  snowghost:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Ming-Research/Snowghost-wf
          ref: main
          fetch-depth: 0
          submodules: true
          path: sg
      - name: Snowghost IR and inlining remarks before and after #345
        working-directory: sg
        run: |
          set -euo pipefail
          make -s toolchain
          out="$PWD/build/sg-bisect"; mkdir -p "$out"
          OPT=$(command -v opt-22 || ls /usr/lib/llvm-22/bin/opt)
          for release in wf-9497f0a54fec wf-exp-b8cf83108946; do
            echo "release = $release" > whitefoot.pin
            make -s compiler
            if grep -q '^toolchain-check' whitefoot-kit/whitefoot.mk; then make -s toolchain-check; fi
            wfc=$(realpath build/whitefoot/$release/whitefootc)
            (cd renderer && "$wfc" --graph modules.wfg --entry layout_oracle --emit-llvm -o "$out/layout-$release.ll")
            "$OPT" -passes='default<O2>' -pass-remarks-missed=inline -pass-remarks=inline "$out/layout-$release.ll" -o /dev/null 2> "$out/remarks-$release.txt" || echo "opt failed"
            for f in next_glyphs set_links set_glyph_class add_scalar_piece set_glyph copy_point; do
              echo "== $release $f"
              grep -E "'[a-z_.]*\.$f' " "$out/remarks-$release.txt" | sed -E "s/.*' (not inlined|inlined) into '([^']*)'.*(cost=[0-9]+, threshold=[0-9]+|always inline|never inline|noinline)?.*/\1 \2 \3/" | sort | uniq -c | sort -rn | head -6
              awk "/^define .*\\.$f\\(/,/^}/" "$out/layout-$release.ll" > "$out/ir-$f-$release.ll"
              wc -l < "$out/ir-$f-$release.ll"
            done
          done
          git checkout -- whitefoot.pin
      - uses: actions/upload-artifact@v4
        with:
          name: sg-bisect
          path: sg/build/sg-bisect

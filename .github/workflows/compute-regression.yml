# Separate WF-vs-WF performance regression. Correctness CI and make check do
# not construct a baseline. Formal fixtures/oracles supply all inputs.
name: compute-regression
on:
  pull_request:
  workflow_dispatch:
    inputs:
      qualify:
        description: Run identical-source and known-slowdown instrument controls
        type: boolean
        default: true
defaults:
  run:
    shell: bash
concurrency:
  group: compute-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: never
  # A fresh checkout gains nothing from incremental state (compiler/Cargo.toml).
  CARGO_INCREMENTAL: 0
  CARGO_BUILD_JOBS: 2
  RUST_TEST_THREADS: 2
  JOBS: 2
jobs:
  regression:
    name: compute regression (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Always report this required job, including an explicit irrelevant-path
      # skip. Semantic analysis is included: its permissions affect emission.
      - name: Select comparison and instrument qualification
        id: scope
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
          QUALIFY: ${{ inputs.qualify }}
        run: |
          base_ref="${BASE_REF:-main}"
          git fetch --no-tags origin "+refs/heads/$base_ref:refs/remotes/origin/$base_ref"
          base=$(git merge-base "origin/$base_ref" HEAD)
          echo "base=$base" >> "$GITHUB_OUTPUT"
          measure=true
          if [ "$EVENT_NAME" = pull_request ] && git diff --quiet "$base" HEAD -- \
            compiler spec/kernel-spec.md tests/programs/compute tests/performance \
            .github/workflows/compute-regression.yml .github/run-check.pl; then
            measure=false
            echo 'Performance comparison skipped: no measured compiler, runtime, fixture or instrument input changed.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "measure=$measure" >> "$GITHUB_OUTPUT"
          qualify=false
          if [ "$QUALIFY" = true ] || ! git diff --quiet "$base" HEAD -- \
            tests/performance tests/programs/compute compiler/runtime.mk \
            .github/workflows/compute-regression.yml; then qualify=true; fi
          echo "qualify=$qualify" >> "$GITHUB_OUTPUT"
      - name: Check instrument decisions and host toolchain
        if: steps.scope.outputs.measure == 'true'
        run: |
          sh tests/performance/test-verdict.sh
          rustup default stable
          rustc -vV
          cargo --version
          test -x /usr/bin/clang
          /usr/bin/clang --version
          test "$(nproc)" -ge 2
      - uses: actions/cache@v4
        if: steps.scope.outputs.measure == 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            compiler/target
            ${{ runner.temp }}/baseline-target
          key: ${{ runner.os }}-formal-compute-${{ hashFiles('compiler/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-formal-compute-${{ hashFiles('compiler/Cargo.lock') }}-
      - name: Export and identify both compiler inputs
        if: steps.scope.outputs.measure == 'true'
        env:
          BASE: ${{ steps.scope.outputs.base }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/baseline" "$BASE"
          mkdir -p "$RUNNER_TEMP/performance-results"
          identity_error() {
            echo "::error::$*" >&2
            exit 1
          }
          candidate_kernels=$(sed -n 's/^KERNELS := //p' tests/performance/Makefile)
          baseline_kernels=$(sed -n 's/^KERNELS := //p' "$RUNNER_TEMP/baseline/tests/performance/Makefile")
          test -n "$candidate_kernels" || identity_error 'candidate kernel list is missing'
          test "$candidate_kernels" = "$baseline_kernels" || \
            identity_error "kernel lists differ: candidate=[$candidate_kernels] baseline=[$baseline_kernels]"
          cmp tests/programs/compute/oracle.h \
            "$RUNNER_TEMP/baseline/tests/programs/compute/oracle.h" || \
            identity_error 'candidate and baseline oracle interfaces differ'
          for kernel in $candidate_kernels; do
            candidate_oracle="tests/programs/compute/${kernel}_oracle.c"
            baseline_oracle="$RUNNER_TEMP/baseline/tests/programs/compute/${kernel}_oracle.c"
            for field in name fixture; do
              candidate_count=$(awk -v field="$field" \
                '$0 ~ "^const char \\*const wf_oracle_" field " = " { count++ } END { print count + 0 }' \
                "$candidate_oracle")
              baseline_count=$(awk -v field="$field" \
                '$0 ~ "^const char \\*const wf_oracle_" field " = " { count++ } END { print count + 0 }' \
                "$baseline_oracle")
              test "$candidate_count" -eq 1 || \
                identity_error "$kernel candidate has $candidate_count wf_oracle_$field declarations; expected one"
              test "$baseline_count" -eq 1 || \
                identity_error "$kernel baseline has $baseline_count wf_oracle_$field declarations; expected one"
              candidate_identity=$(sed -n "/^const char \\*const wf_oracle_$field = /p" "$candidate_oracle")
              baseline_identity=$(sed -n "/^const char \\*const wf_oracle_$field = /p" "$baseline_oracle")
              test "$candidate_identity" = "$baseline_identity" || \
                identity_error "$kernel wf_oracle_$field differs between candidate and baseline"
            done
          done
          {
            printf 'candidate=%s\nbaseline=%s\n' "$(git rev-parse HEAD)" "$BASE"
            printf 'native=-O2; ordinary host runtime; no alignment overrides\n'
            printf 'kernels=%s\n' "$candidate_kernels"
            rustc -vV
            /usr/bin/clang --version
            lscpu
            printf '\ncandidate inputs:\n'
            sha256sum tests/programs/compute/*.wf tests/programs/compute/*_host.ll \
              tests/programs/compute/*_oracle.c tests/programs/compute/oracle.h \
              tests/programs/compute/host-adapter.awk tests/performance/* compiler/runtime.mk
            printf '\nbaseline inputs:\n'
            sha256sum "$RUNNER_TEMP"/baseline/tests/programs/compute/*.wf \
              "$RUNNER_TEMP"/baseline/tests/programs/compute/*_host.ll \
              "$RUNNER_TEMP"/baseline/tests/programs/compute/*_oracle.c \
              "$RUNNER_TEMP"/baseline/tests/programs/compute/oracle.h \
              "$RUNNER_TEMP"/baseline/tests/programs/compute/host-adapter.awk \
              "$RUNNER_TEMP"/baseline/compiler/runtime.mk
          } > "$RUNNER_TEMP/performance-results/identity.txt"
      - name: Build the candidate compiler
        if: steps.scope.outputs.measure == 'true'
        run: |
          WHITEFOOT_CHECK_TIMEOUT=300 perl .github/run-check.pl performance-candidate-compiler \
            cargo build --manifest-path compiler/Cargo.toml --locked --profile gate --bin whitefootc
      - name: Build the merge-base compiler
        if: steps.scope.outputs.measure == 'true'
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/baseline-target
        run: |
          WHITEFOOT_CHECK_TIMEOUT=300 perl .github/run-check.pl performance-baseline-compiler \
            cargo build --manifest-path "$RUNNER_TEMP/baseline/compiler/Cargo.toml" \
            --locked --profile gate --bin whitefootc
      - name: Construct candidate and baseline native images
        if: steps.scope.outputs.measure == 'true'
        run: |
          WHITEFOOT_CHECK_TIMEOUT=180 perl .github/run-check.pl performance-candidate-images \
            make -j2 -C tests/performance build BUILD="$RUNNER_TEMP/performance-candidate"
          WHITEFOOT_CHECK_TIMEOUT=180 perl .github/run-check.pl performance-baseline-images \
            make -j2 -C tests/performance build BUILD="$RUNNER_TEMP/performance-baseline" \
            ROOT="$RUNNER_TEMP/baseline" WFC="$RUNNER_TEMP/baseline-target/gate/whitefootc" \
            FIXTURES="$RUNNER_TEMP/baseline/tests/programs/compute"
      # Every host invocation needs a null observation: qualification on an
      # earlier runner cannot establish this runner's measurement conditions.
      # Reusing exactly the candidate images also removes construction/layout
      # differences from the null. Failure means inconclusive evidence, and
      # stops the comparison; no retry or threshold change selects a pass.
      - name: Check this host with identical images
        if: steps.scope.outputs.measure == 'true'
        run: |
          status=0
          WHITEFOOT_CHECK_TIMEOUT=300 perl .github/run-check.pl performance-null \
            bash tests/performance/compare.sh "$RUNNER_TEMP/performance-candidate" \
            "$RUNNER_TEMP/performance-candidate" "$RUNNER_TEMP/performance-results/null" || status=$?
          if [ "$status" -ne 0 ]; then
            echo 'INCONCLUSIVE: identical-image control failed; no compiler regression verdict is available.' | tee "$RUNNER_TEMP/performance-results/inconclusive.txt"
            exit "$status"
          fi
      - name: Qualify explicit slowdown sensitivity
        if: steps.scope.outputs.measure == 'true' && steps.scope.outputs.qualify == 'true'
        run: |
          status=0
          WHITEFOOT_CHECK_TIMEOUT=300 perl .github/run-check.pl performance-slow-control \
            bash tests/performance/compare.sh "$RUNNER_TEMP/performance-candidate" \
            "$RUNNER_TEMP/performance-candidate" "$RUNNER_TEMP/performance-results/slow" slow || status=$?
          test "$status" -eq 1
          grep -F -q 'VERDICT: FAIL -- 5 kernel(s) adverse at two widths' \
            "$RUNNER_TEMP/performance-results/slow/verdict.txt"
      - name: Compare the candidate with its merge base
        if: steps.scope.outputs.measure == 'true'
        run: |
          WHITEFOOT_CHECK_TIMEOUT=300 perl .github/run-check.pl performance-comparison \
            bash tests/performance/compare.sh "$RUNNER_TEMP/performance-baseline" \
            "$RUNNER_TEMP/performance-candidate" "$RUNNER_TEMP/performance-results/comparison"
      - name: Publish decisions and visible suspects
        if: always() && steps.scope.outputs.measure == 'true'
        run: |
          if [ -f "$RUNNER_TEMP/performance-results/inconclusive.txt" ]; then
            cat "$RUNNER_TEMP/performance-results/inconclusive.txt" >> "$GITHUB_STEP_SUMMARY"
          fi
          for run in null slow comparison; do
            file="$RUNNER_TEMP/performance-results/$run/verdict.txt"
            if [ -f "$file" ]; then
              { printf '\n### %s\n\n```text\n' "$run"; cat "$file"; printf '\n```\n'; } >> "$GITHUB_STEP_SUMMARY"
              while IFS= read -r line; do echo "::warning::$run: $line"; done < <(grep '^suspect: ' "$file" || true)
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always() && steps.scope.outputs.measure == 'true'
        with:
          name: compute-regression-ubuntu-24.04
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/performance-results/
            ${{ runner.temp }}/performance-candidate/
            ${{ runner.temp }}/performance-baseline/

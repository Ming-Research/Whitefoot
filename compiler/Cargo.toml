[package]
name = "whitefoot"
version = "0.1.0"
edition = "2024"
publish = false
# The oldest stable that builds the compiler (let chains, slice::as_chunks).
rust-version = "1.88"

[lib]
doctest = false

[[bin]]
name = "whitefootc"
path = "src/bin/whitefootc.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"

# The gate's test profile. The suite's owning tests run compute-bound
# front-end analysis on real programs; at the default unoptimized test
# profile one wfgrep pass was measured at 136s against ~8s here. It keeps
# every debug assertion and overflow check (plain release would drop them)
# and changes only code generation, so no test's identity or meaning moves.
# Used by the Makefile `test` target; a bare `cargo test <filter>` during
# development still uses the default profile.
#
# Local builds are incremental: without it every edit rebuilds the whole
# crate, once for the binary and once for the test harness (83 s and 141 s on
# four cores), where measured edits take 10 to 25 s with it. CI builds from a
# fresh checkout and sets CARGO_INCREMENTAL=0, since there incremental state
# only slows the build and the tests; the measurements are F9 in
# research/investigations/compiler-architecture/DESIGN.md.
[profile.gate]
inherits = "release"
debug-assertions = true
overflow-checks = true
incremental = true
